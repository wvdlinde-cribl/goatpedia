summary: Keycloak is logged by the Elastic integrations package keycloak. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: keycloak
    desc: 'Elastic integrations fixture, 20 events. Upstream: keycloak/data_stream/log/_dev/test/pipeline/test-ecs-log.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: keycloak
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: json
  Fields in the first fixture: '@timestamp, event.sequence, log.logger, log.level, message, process.thread.name'
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Keycloak events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries @timestamp, event.sequence, log.logger, log.level, message, process.thread.name. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads keycloak and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
logs:
  - type: Log
    sourcetype: keycloak
    format: json
    desc: 20 fixture events in the samples pool (elastic).
    sample: '{"@timestamp":"2025-05-01T01:16:31.591777597Z","event.sequence":44,"log.logger":"org.keycloak.url.HostnameV2ProviderFactory","log.level":"INFO","message":"If hostname is specified, hostname-strict is effectively ignored","process.thread.name":"main","process.thread.id":1,"mdc":{},"ndc":"","host.hostname":"068a18c2f627","process.name":"/usr/lib/jvm/java-21-openjdk-198.51.100.15.6-1.el9.x86_64/bin/java","process.pid":1,"ecs.version":"1.12.2","data_stream.type":"logs","service.name":"Keycloak","service.version":"26.2.2","service.environment":"prod"}'
    key:
      - '@timestamp'
      - event.sequence
      - log.logger
      - log.level
cves: []
detections:
  - title: Keycloak events arriving
    severity: low
    signals:
      - '@timestamp'
