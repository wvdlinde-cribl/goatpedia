summary: Proofpoint On Demand is logged by the Datadog integrations-core package proofpoint_on_demand. The Pack Generator samples pool holds fixture events for 3 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: proofpoint_on_demand
    desc: 'Datadog integrations-core fixture, 1 events. Upstream: proofpoint_on_demand/assets/logs/proofpoint-on-demand_tests.yaml'
  - st: proofpoint_on_demand_mail
    desc: 'Elastic integrations fixture, 19 events. Upstream: proofpoint_on_demand/data_stream/mail/_dev/test/pipeline/test-mail.log'
  - st: proofpoint_on_demand_message
    desc: 'Elastic integrations fixture, 10 events. Upstream: proofpoint_on_demand/data_stream/message/_dev/test/pipeline/test-message.log'
facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: proofpoint_on_demand
  Sourcetypes: '3'
  Fixture events: '30'
  Log format seen: json
  Fields in the first fixture: msgParts, guid, filter.suborgs.rcpts[0], filter.suborgs.sender, filter.routeDirection, filter.actions[0].module
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Proofpoint On Demand events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries msgParts, guid, filter.suborgs.rcpts[0], filter.suborgs.sender, filter.routeDirection, filter.actions[0].module. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads proofpoint_on_demand and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
