# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: tenable-sc
name: Tenable Security Center
short: Tenable SC
vendor: Tenable
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Tenable.sc
  - SecurityCenter
  - Tenable Security Center Continuous View
tags:
  - vulnerability-management
  - nessus
  - asset-inventory
  - scanning
summary: An on-premises vulnerability management platform that runs and collects Nessus scans, agent results and passive monitoring data, and stores them in repositories for analysis. It tracks the assets it sees and the vulnerability findings on each one, and keeps the Nessus plugin library that defines every check. The three streams here are assets with severity counts, plugin definitions, and individual vulnerability findings with severity, CVSS and exploit information.
sourcetypes:
  - st: tenable_sc_asset
    desc: One asset (host) seen by Security Center, with IP, DNS and NetBIOS names, OS, last scan policy and counts of findings by severity
  - st: tenable_sc_plugin
    desc: One Nessus plugin definition, the check behind a finding, with name, description, risk factor, solution, CPEs and references
  - st: tenable_sc_vulnerability
    desc: One vulnerability finding on one host and port, with plugin, severity, CVSS and VPR scores, exploit availability, first and last seen and mitigation state
facts:
  Product: On-premises vulnerability management (formerly Tenable.sc / SecurityCenter)
  Form factor: Security Center server managing Nessus scanners, Nessus Agents and Nessus Network Monitor
  Data model: Repositories of scan results. Assets, vulnerabilities and plugins are queried through the analysis API
  Log transport: HTTPS JSON from the Security Center REST API, pulled by a collector with an API key
  Log format: One JSON object per asset, plugin or finding. Most numbers are strings
  What an asset record answers: Which host it is and how many critical, high, medium, low and info findings it has
  What a finding answers: Which plugin found what on which IP and port, how severe it is, whether an exploit exists, and when it was first and last seen
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Security Center and scanners
      desc: Security Center and its Nessus scanners run inside the network and scan internal hosts. A collector calls the Security Center API for assets, plugins and findings.
howItWorks:
  - title: Scanning
    body: Nessus scanners and agents run scan policies made of plugins. Each plugin is one check, for example a missing patch or an exposed service. Results are imported into repositories in Security Center.
  - title: Findings and severity
    body: A finding ties a plugin to a host IP and port. severity runs from Info (0) to Critical (4). cvssV3BaseScore, vprScore and exploitAvailable describe how dangerous it is. firstSeen, lastSeen and hasBeenMitigated show its life cycle. acceptRisk and recastRisk show analyst decisions.
  - title: How the data leaves the product
    body: A collector queries the analysis endpoints for vulnerabilities and assets and the plugin endpoint for definitions, usually filtered on lastSeen since the last poll. Each record is a JSON object for any destination.
traffic:
  handles:
    - Active network vulnerability scans
    - Agent-based host assessment
    - Asset discovery and inventory
  flow:
    - step: Scan runs
      desc: A Nessus scanner or agent runs a scan policy against hosts.
    - step: Results are stored
      desc: Security Center imports findings into a repository and updates asset severity counts.
    - step: Collector queries
      desc: A collector calls the Security Center API for findings, assets and plugins.
    - step: Records are JSON
      desc: Each record is one JSON object. Goatpedia reads these samples as JSON.
logs:
  - type: Assets
    sourcetype: tenable_sc_asset
    format: json
    desc: One host. ip, dnsName and netbiosName identify it, osCPE gives the OS, and severityCritical, severityHigh, severityMedium, severityLow and severityInfo count its findings. The IP uses a documentation address.
    sample: '{"ip":"203.0.113.40","uuid":"4add65d0-27fc-491c-91ba-3f498a61f49e","score":"307","total":"150","severityInfo":"131","severityLow":"0","severityMedium":"9","severityHigh":"4","severityCritical":"6","macAddress":"2001:db8::1","policyName":"Basic Agent Scan","pluginSet":"201901281542","netbiosName":"UNKNOWN\\RNKMIGAUV2L8ZEYF.EXAMPLE","dnsName":"rnkmigauv2l8zeyf.example","osCPE":"cpe:/o:microsoft:windows_102001:db8::1x64-home","biosGUID":"9e8c4d43-982b-4405-a76c-d56c1d6cf117","tpmID":"","mcafeeGUID":"","lastAuthRun":"","lastUnauthRun":"","hostUniqueness":"repositoryID,ip,dnsName","uniqueness":"repositoryID,ip,dnsName","repository":{"id":"2","name":"Staged-Large","description":"","sciID":"1","dataFormat":"IPv4"}}'
    key:
      - ip
      - uuid
      - score
      - total
  - type: Plugins
    sourcetype: tenable_sc_plugin
    format: json
    desc: One Nessus plugin. id and name identify the check, description and solution explain it, riskFactor rates it, and cpe and seeAlso give affected products and references. This sample is the plugin for a Red Hat gettext advisory.
    sample: '{"id":"137395","name":"RHEL 7 : gettext (RHSA-2020:2485)","description":"The remote Redhat Enterprise Linux 7 host has packages installed that are affected by a vulnerability as referenced in the RHSA-2020:2485 advisory.\n\n  - gett...","type":"active","copyright":"This script is Copyright (C) 2020-2021 and is owned by Tenable, Inc. or an Affiliate thereof.","version":"1.8","sourceFile":"redhat-RHSA-2020-2485.nasl","dependencies":"ssh_get_info.nasl,redhat_repos.nasl","requiredPorts":"","requiredUDPPorts":"","cpe":"cpe:/o:redhat:rhel_aus:7.7\ncpe:/o:redhat:rhel_e4s:7.6\ncpe:/o:redhat:rhel_e4s:7.7\ncpe:/o:redhat:rhel_eus:7.7\ncpe:/o:redhat:rhel_tus:7.7\np-cpe:/a:redhat:enterp...","srcPort":null,"dstPort":null,"protocol":"","riskFactor":"High","solution":"Update the affected packages.","seeAlso":"https://cwe.mitre.org/data/definitions/416.html\nhttps://access.redhat.com/security/cve/CVE-2018-18751\nhttps://access.redhat.com/errata/RHSA-2020:2485\nhttps:/...","synopsis":"The remote Red Hat host is missing a security update.","checkType":"local","exploitEase":"No known exploits are available","exploitAvailable":"false","exploitFrameworks":"","cvssVector":"AV:N/AC:L/Au:N/C:P/I:P/A:P/E:U/RL:OF/RC:C","cvssVectorBF":"2164860004","baseScore":"7.5","temporalScore":"5.5","cvssV3Vector":"AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H/E:U/RL:O/RC:C","cvssV3VectorBF":"10809321768","cvssV3BaseScore":"9.8","cvssV3TemporalScore":"8.5"}'
    key:
      - id
      - name
      - description
      - type
  - type: Vulnerability findings
    sourcetype: tenable_sc_vulnerability
    format: json
    desc: One finding. pluginID and pluginName say what check matched, ip, port and protocol where, severity.name how bad, and exploitAvailable, firstSeen and lastSeen its context. This sample is an Info finding for the web server type on 443. The IP uses a documentation address.
    sample: '{"pluginID":"10107","severity":{"id":"0","name":"Info","description":"Informative"},"hasBeenMitigated":"1","acceptRisk":"0","recastRisk":"0","ip":"192.0.2.10","uuid":"","port":"443","protocol":"TCP","pluginName":"HTTP Server Type and Version","firstSeen":"1570291573","lastSeen":"1632586125","exploitAvailable":"No","exploitEase":"","exploitFrameworks":"","synopsis":"A web server is running on the remote host.","description":"This plugin attempts to determine the type and the version of the remote web server.","solution":"","seeAlso":"http://www.nessus.org/","riskFactor":"None","stigSeverity":"","vprScore":"","vprContext":"[]","baseScore":"","temporalScore":"","cvssVector":"","cvssV3BaseScore":"5","cvssV3TemporalScore":"5","cvssV3Vector":"","cpe":""}'
    key:
      - pluginID
      - severity.id
      - severity.name
      - severity.description
cves: []
detections:
  - title: Exploitable critical or high vulnerability
    severity: high
    signals:
      - severity.name
      - exploitAvailable
      - pluginName
      - ip
      - port
    why: A Critical or High finding with a known exploit is the highest-priority fix and a likely attack path. Pair it with asset context to see which exposed hosts carry it.
    kql: |
      dataset="tenable-sc_logs"
      | where sourcetype == "tenable_sc_vulnerability" and severity.name in ("Critical", "High") and exploitAvailable == "Yes"
      | project ip, port, protocol, pluginID, pluginName, severity.name, cvssV3BaseScore, lastSeen
    mitre:
      - T1190
optimizations:
  - title: Route informational findings to storage
    saving: most of the finding volume
    fn: Routes
    how: Info findings (severity 0) are inventory — service banners, OS detection, open ports. They far outnumber real vulnerabilities. Keep Low and above in the SIEM and send Info to cheaper storage.
    expr: severity.id == '0'
    stream:
      routes:
        - name: Tenable SC Info findings → storage
          filter: /"severity":\{"id":"0"/.test(_raw)
          to: Cribl Lake or other low-cost storage
          final: true
        - name: Tenable SC Low and above findings → SIEM
          filter: /"pluginID":"/.test(_raw)
          to: The SIEM, full fidelity
          final: true
      note: Routes see the raw event, so they match the severity id inside the JSON text. Put the Info route first so only Low and above reach the SIEM.
references:
  - title: Tenable Security Center documentation
    url: https://docs.tenable.com/security-center/
