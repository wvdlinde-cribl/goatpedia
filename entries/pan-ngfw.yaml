summary: A next-generation firewall that classifies traffic by application, user and content rather than port, combining stateful firewalling, IPS, URL filtering, sandboxing and remote-access VPN (GlobalProtect) in a single-pass engine. One of the highest-volume log sources in most SOCs.
sourcetypes:
  - st: pan:traffic
    desc: Session start/end records — the bulk of volume
  - st: pan:threat
    desc: IPS, AV, spyware, URL, WildFire, file and data-filtering verdicts
  - st: pan:system
    desc: Device events incl. GlobalProtect logins, HA, commits
  - st: pan:config
    desc: Admin configuration changes (who/what/when)
  - st: pan:globalprotect
    desc: Dedicated GlobalProtect log type (PAN-OS 9.1+)
  - st: pan:userid
    desc: IP-to-user mapping events
facts:
  First released: 2007 (PA-4000)
  OS: PAN-OS (current trains 10.2 / 11.1 / 11.2)
  Form factors: Hardware (PA-400 → PA-7500), VM-Series, CN-Series, Cloud NGFW
  Deployment modes: Layer 3, Layer 2, Virtual Wire, Tap
  Central mgmt: Panorama, Strata Cloud Manager
  Log transport: Syslog UDP/TCP/TLS, Panorama, Strata Logging Service (HTTPS)
  Log format: CSV (default), custom → CEF / LEEF / key=value
  Typical EPS: 1k – 100k+ per firewall
  Cribl Pack: Palo Alto Networks (Packs Dispensary)
placement:
  slots:
    - edge
    - internal
    - cloud
    - remote
  items:
    - slot: edge
      title: Internet perimeter
      desc: Most common. Sits between ISP and the internal network, enforces outbound web policy and protects published services in the DMZ.
    - slot: internal
      title: Internal segmentation
      desc: Between user and data-center zones (east-west). Often in Virtual Wire mode so no re-IP is needed.
    - slot: cloud
      title: Cloud / VPC
      desc: VM-Series or Cloud NGFW in AWS/Azure/GCP transit or inspection VPCs, often behind a gateway load balancer.
    - slot: remote
      title: Remote access (GlobalProtect)
      desc: The firewall hosts the GlobalProtect portal + gateway; the agent on laptops tunnels traffic back in. Exposed to the internet — prime CVE target.
howItWorks:
  - title: Single-Pass Parallel Processing (SP3)
    body: Each packet is parsed once. Networking, policy lookup, App-ID, decoding and signature matching run as one pass over the stream rather than chained engines, which is why enabling features costs less throughput than on stacked appliances.
  - title: App-ID
    body: "Identifies the application regardless of port using signatures, protocol decoders and heuristics. A session can \"app-shift\" as more is learned: ssl → web-browsing → youtube-base. The final app is what lands in the traffic log."
  - title: User-ID
    body: Maps IP addresses to users from AD event logs, GlobalProtect, SAML/captive portal, XFF headers or syslog parsing, so policies and logs carry src_user.
  - title: Content-ID
    body: Threat Prevention (IPS, anti-virus, anti-spyware, DNS Security), URL Filtering, WildFire sandboxing and data filtering operate on the decoded stream. Every verdict is a THREAT log.
  - title: Decryption
    body: SSL Forward Proxy (outbound) and SSL Inbound Inspection (to your own servers). Without decryption, App-ID and Content-ID only see TLS metadata (SNI, certificate).
  - title: Zones & policy
    body: Interfaces belong to zones; security rules match src/dst zone, address, user, application, service and URL category. First match wins. NAT is a separate policy evaluated before security.
traffic:
  handles:
    - All IPv4/IPv6 L3–L4
    - 5,000+ L7 applications (App-ID)
    - TLS 1.2/1.3 (decryption optional)
    - IPsec & SSL VPN
    - DNS (DNS Security)
    - SaaS (SaaS Security inline)
  flow:
    - step: Ingress
      desc: Packet arrives on an interface; zone assigned.
    - step: Session lookup
      desc: Existing session? Fast-path to content inspection.
    - step: Route + NAT
      desc: "New flow: forwarding lookup, NAT policy evaluated (pre-NAT addresses)."
    - step: Security policy
      desc: Zone/address/user/port match; App-ID may re-evaluate later.
    - step: App-ID / Decrypt
      desc: Application identified, optional TLS decryption.
    - step: Content-ID
      desc: IPS, AV, URL, WildFire verdicts → THREAT log.
    - step: Egress + log
      desc: Forwarded; TRAFFIC log at session start and/or end.
