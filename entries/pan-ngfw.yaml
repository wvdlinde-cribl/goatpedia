cves:
  - id: CVE-2024-3400
    cvss: 10
    year: 2024
    kev: true
    scope: device
    title: GlobalProtect OS command injection via arbitrary file creation
    affected: PAN-OS 10.2, 11.0, 11.1 with GlobalProtect gateway or portal
    fixed: 10.2.9-h1, 11.0.4-h1, 11.1.2-h3 (and later hotfixes)
    detect: "THREAT logs with threat_id 95187 / 95189 / 95191. On-box: gpsvc.log lines matching \"failed to unmarshal session(../\". Unusual outbound from the firewall itself."
    avoid: Patch; enable Threat Prevention with the above IDs set to reset on the GP interface; restrict GP portal exposure; enable device telemetry off.
  - id: CVE-2024-0012
    cvss: 9.3
    year: 2024
    kev: true
    scope: device
    title: Management web interface authentication bypass (chained with CVE-2024-9474)
    affected: PAN-OS 10.2, 11.0, 11.1, 11.2 with mgmt interface reachable
    fixed: 10.2.12-h2, 11.0.6-h1, 11.1.5-h1, 11.2.4-h1
    detect: TRAFFIC to the management IP from untrust or unknown sources; CONFIG logs from unexpected admins; new admin accounts.
    avoid: Never expose the management interface; permit only a jump-host allow-list; patch.
  - id: CVE-2025-0108
    cvss: 8.8
    year: 2025
    kev: true
    scope: device
    title: Management web interface authentication bypass (path confusion)
    affected: PAN-OS 10.1, 10.2, 11.1, 11.2
    fixed: 10.1.14-h9, 10.2.13-h3, 11.1.6-h1, 11.2.4-h4
    detect: Same signals as CVE-2024-0012; web requests to /unauth/ paths in mgmt access logs.
    avoid: Restrict mgmt interface; patch.
  - id: CVE-2020-2021
    cvss: 10
    year: 2020
    kev: true
    scope: device
    title: SAML authentication bypass when IdP certificate validation is disabled
    affected: PAN-OS 8.1, 9.0, 9.1 with SAML auth
    fixed: 8.1.15, 9.0.9, 9.1.3
    detect: SYSTEM/GlobalProtect auth success from new geos without matching IdP sign-in event.
    avoid: Enable "Validate Identity Provider Certificate"; patch.
  - id: CVE-2023-44487
    cvss: 7.5
    year: 2023
    kev: true
    scope: traffic
    title: HTTP/2 "Rapid Reset" DoS — affects HTTP/2 traffic the firewall protects
    affected: Any HTTP/2 server behind the firewall
    fixed: Server-side patches; PAN Threat ID 40152 for detection
    detect: Burst of very short HTTP/2 sessions per src_ip with low bytes and session_end_reason=tcp-rst-from-client.
    avoid: Enable the threat signature; rate-limit with DoS Protection profiles.
detections:
  - title: GlobalProtect exploitation (CVE-2024-3400)
    severity: critical
    signals:
      - type=THREAT
      - threat_id 95187/95189/95191
      - dst = GP portal
    why: Direct indicator of exploitation attempts against an internet-facing service.
    kql: |-
      dataset="pan_logs" type="THREAT"
      | where threat_id has_any ("95187","95189","95191")
      | summarize hits=count(), first=min(_time) by src_ip, dst_ip, action
  - title: GlobalProtect brute force / password spray
    severity: high
    signals:
      - type=SYSTEM
      - eventid=globalprotectgateway-auth-fail
      - count per login IP
    why: Spray against VPN is a top initial-access vector; precedes successful logins from the same IP.
    kql: |-
      dataset="pan_logs" type="SYSTEM" eventid="globalprotectgateway-auth-fail"
      | extract "Login from: (?<login_ip>[^,]+), User name: (?<user>[^,]+)" from description
      | summarize fails=count(), users=dcount(user) by login_ip, bin(_time, 10m)
      | where fails > 20 or users > 5
  - title: Management interface reachable from untrust
    severity: high
    signals:
      - type=TRAFFIC
      - src_zone=untrust
      - dst_ip ∈ mgmt IPs
    why: Pre-condition for CVE-2024-0012 / CVE-2025-0108. Should be zero.
    kql: |-
      dataset="pan_logs" type="TRAFFIC" src_zone="untrust"
      | lookup pan_mgmt_ips on dst_ip
      | where isnotempty(mgmt_host)
      | summarize count() by src_ip, dst_ip, app
  - title: Critical threat allowed (prevention gap)
    severity: medium
    signals:
      - type=THREAT
      - severity=critical
      - action=alert
    why: Signature matched but the profile only alerts — a policy misconfiguration, not an attack per se.
    kql: |-
      dataset="pan_logs" type="THREAT" severity="critical" action="alert"
      | summarize count() by rule, threat_id
  - title: Non-standard app on 443 (tunnelling)
    severity: medium
    signals:
      - dst_port=443
      - app=unknown-tcp | ssh | tor
    why: App-ID disagrees with the port — classic C2 or tunnelling sign.
    kql: |-
      dataset="pan_logs" type="TRAFFIC" dst_port=443
      | where app in ("unknown-tcp","ssh","tor","openvpn")
      | summarize bytes=sum(bytes) by src_ip, dst_ip, app
optimizations:
  - title: Drop session-start records
    saving: 10–20 %
    fn: Drop
    how: Session-end records contain everything the start record has plus bytes and end reason. Prefer "Log at Session End" on rules, or drop subtype=start in Stream.
    expr: type=='TRAFFIC' && subtype=='start'
  - title: Strip future_use, empty and duplicate fields
    saving: 25–40 %
    fn: Parser → Serialize
    how: Parse the CSV, remove future_use*, receive_time (≈ generated_time), seqno, action_flags and empty values, then re-serialise. Keep field order if the SIEM TA expects CSV.
    expr: "remove: future_use*, receive_time, seqno, action_flags; drop empty"
  - title: Suppress repetitive denies
    saving: 5–15 %
    fn: Suppress
    how: Internet background noise produces thousands of identical denies. Keep one per src_ip/dst_ip/dst_port per 60 s with a count.
    expr: "key: `${src_ip}:${dst_ip}:${dst_port}`  allow 1 / 60s  when action=='deny'"
  - title: Aggregate high-volume allowed flows to metrics
    saving: 20–35 %
    fn: Aggregations
    how: Allowed DNS, NTP and internal SMB flows are rarely searched individually. Roll up to bytes/sessions per src/dst/app per minute, send raw to Lake.
    expr: app in ('dns','ntp','ms-ds-smb') && action=='allow'
  - title: Route by value
    saving: SIEM licence
    fn: Routes
    how: THREAT, SYSTEM, CONFIG, GLOBALPROTECT → SIEM at full fidelity. TRAFFIC → Cribl Lake raw + SIEM optimised. Replay from Lake during incidents.
    expr: type!='TRAFFIC' → SIEM  |  type=='TRAFFIC' → Lake + SIEM(optimised)
