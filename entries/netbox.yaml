summary: Netbox is logged by the Elastic integrations package netbox. The Pack Generator samples pool holds fixture events for 2 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: netbox_devices
    desc: 'Elastic integrations fixture, 2 events. Upstream: netbox/data_stream/devices/_dev/test/pipeline/test-devices.json'
  - st: netbox_ips
    desc: 'Elastic integrations fixture, 2 events. Upstream: netbox/data_stream/ips/_dev/test/pipeline/test-devices.json'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: netbox
  Sourcetypes: '2'
  Fixture events: '4'
  Log format seen: json
  Fields in the first fixture: id, url, display_url, display, name, device_type.id
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Netbox events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries id, url, display_url, display, name, device_type.id. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads netbox and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
