id: netbox
name: NetBox
short: NetBox
vendor: NetBox Labs
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - NetBox Community
  - NetBox Cloud
tags:
  - ipam
  - dcim
  - inventory
  - source-of-truth
  - json
summary: 'An open-source source of truth for network infrastructure: devices, racks, sites, IP addresses, prefixes and VLANs. Network and operations teams model what should exist in NetBox, and automation reads it back over a REST API. These records are inventory, not activity. A device record says what a device is and where it sits, and an IP record says which address is assigned to which interface.'
sourcetypes:
  - st: netbox_devices
    desc: Each device in the DCIM inventory, with its type, role, site, rack, status and primary addresses
  - st: netbox_ips
    desc: Each IP address in IPAM, with its VRF, tenant, status, role, NAT mapping and the interface it is assigned to
facts:
  Product: Infrastructure resource modelling (DCIM) and IP address management (IPAM)
  Deployment: Self-hosted Django application with PostgreSQL, or the hosted NetBox Cloud
  Log transport: HTTPS REST API, polled by a collector with an API token. Webhooks and event rules can push object changes
  Log format: One JSON object per inventory object, as returned by the API
  What a device record answers: What the device is, its role and status, where it is racked, and which addresses are its primary and out-of-band IPs
  What an IP record answers: Which interface on which device holds an address, in which VRF and tenant, and what it is NAT-mapped to
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: NetBox server
      desc: NetBox runs on the internal management network, or as NetBox Cloud. It holds the intended state of the network. A collector reads its API on a schedule and uses the records to enrich events from other devices with site, rack, role and owner.
howItWorks:
  - title: DCIM and IPAM
    body: NetBox models physical infrastructure (sites, locations, racks, device types, devices, interfaces) and IP space (VRFs, prefixes, IP addresses). Objects link to each other, so an IP address points at an interface, and the interface points at a device in a rack at a site.
  - title: Source of truth
    body: 'NetBox records what the network is meant to look like. It does not discover devices or watch traffic. Its value in a log pipeline is context: turning an address seen in a firewall log into a named device, role, tenant and site.'
  - title: How the records leave the product
    body: The REST API returns each object as JSON, with nested summaries of linked objects (device_type, site, rack, primary_ip). A collector pages through /api/dcim/devices/ and /api/ipam/ip-addresses/ with a token and stores the results as lookup data.
traffic:
  handles:
    - Device inventory (DCIM)
    - IP address management (IPAM)
    - Tenancy, sites and racks
  flow:
    - step: Operator models
      desc: An engineer or an automation job creates or updates a device or an IP address in NetBox.
    - step: NetBox stores it
      desc: The object is saved with links to its type, role, site, rack, tenant and interfaces.
    - step: Collector polls
      desc: A collector calls the REST API with a token and pages through devices and IP addresses.
    - step: Records are JSON
      desc: Each object is one JSON record. A pipeline uses it as an enrichment lookup for other sources.
logs:
