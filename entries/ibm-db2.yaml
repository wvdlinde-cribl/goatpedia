summary: The built-in audit facility of IBM Db2 (LUW). It records events in eight categories — AUDIT, CHECKING, OBJMAINT, SECMAINT, SYSADMIN, VALIDATE, CONTEXT and EXECUTE — to a binary audit log per member, which db2audit extract (or SYSPROC.AUDIT_DELIM_EXTRACT) turns into delimited files per category or a readable report. It answers who authenticated, who granted what, who ran which administrative command and which SQL statement text was executed.
sourcetypes:
  - st: ibm_db2_audit_context
    desc: CONTEXT category — operation context and statement text (EXECUTE_IMMEDIATE, PREPARE, CONNECT, COMMIT, ROLLBACK …)
  - st: ibm_db2_audit_objmaint
    desc: OBJMAINT category — CREATE_OBJECT, DROP_OBJECT, ALTER_OBJECT, RENAME_OBJECT
  - st: ibm_db2_audit_secmaint
    desc: SECMAINT category — GRANT, REVOKE, IMPLICIT_GRANT, role and trusted-context changes, SECADM/DBADM/DATAACCESS authorities
  - st: ibm_db2_audit_sysadmin
    desc: SYSADMIN category — DB2AUDIT, DB2SET, START_DB2/STOP_DB2, UPDATE_DBM_CFG, BACKUP_DB, RESTORE_DB, FORCE_APPLICATION …
  - st: ibm_db2_audit_validate
    desc: VALIDATE category — AUTHENTICATION and GET_USERMAPPING_FROM_PLUGIN, with SQLCODE status
facts:
  First released: 1983 (DB2 for MVS); Db2 LUW since the 1990s; audit facility rewritten in 9.5 (policies, per-database logs)
  Current releases: Db2 12.1, 11.5 (Linux, AIX, Windows; containers / OpenShift; Db2 on Cloud, Db2 Warehouse)
  Audit configuration: Instance level via db2audit configure; database level via CREATE AUDIT POLICY + AUDIT … USING POLICY (SECADM)
  Categories: AUDIT, CHECKING, OBJMAINT, SECMAINT, SYSADMIN, VALIDATE, CONTEXT, EXECUTE
  Log transport: Binary db2audit.instance.log / db2audit.db.<db>.log → archive → db2audit extract (delasc or file) → file monitor / syslog forwarder
  Log format: Delimited ASCII per category (audit.del, checking.del, objmaint.del, secmaint.del, sysadmin.del, validate.del, context.del, execute.del + auditlobs); or key=value report
  Typical volume: VALIDATE + SECMAINT + SYSADMIN low (< 10 EPS); CONTEXT/EXECUTE can be the largest source in the estate on OLTP systems
  Event status: SQLCODE — >= 0 success, < 0 failure (e.g. -30082 security processing failed)
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Core banking, ERP and mainframe-adjacent data tier
      desc: Db2 LUW on AIX/Linux behind SAP, core banking and insurance applications. Usually the system of record for regulated data, so audit is a PCI/SOX requirement.
    - slot: internal
      title: Warehouse / analytics
      desc: Db2 Warehouse and federated Db2 instances pulling from many sources; federation wrappers add Java (and its CVEs) to the database host.
    - slot: cloud
      title: Db2 on OpenShift and Db2 on Cloud
      desc: Containerised Db2 (Db2U operator, Cloud Pak for Data) and IBM-managed Db2 on Cloud. Audit still uses db2audit; the extract job runs inside the pod or via the managed service.
howItWorks:
  - title: Audit policies
    body: A SECADM creates audit policies (CREATE AUDIT POLICY … CATEGORIES VALIDATE STATUS BOTH, SECMAINT STATUS BOTH …) and attaches them with AUDIT to the database, tables, authorities (SYSADM, DBADM, SECADM), users, groups, roles or trusted contexts. Instance-level events (SYSADMIN, instance VALIDATE) are configured with db2audit configure.
  - title: Buffered binary audit log
    body: Each member writes to db2audit.instance.log.<member> and db2audit.db.<dbname>.log.<member> in the audit data path. audit_buf_sz sets synchronous vs asynchronous writing; ERRORTYPE AUDIT makes a failed audit write fail the statement, NORMAL lets it continue.
  - title: Archive and extract
    body: db2audit archive (or SYSPROC.AUDIT_ARCHIVE) moves the active log to an archive path with a timestamp. db2audit extract delasc writes one delimited file per category (statement text goes to auditlobs with LOB location specifiers); db2audit extract file writes a readable key=value report. A scheduled extract is what feeds the SIEM.
  - title: Categories that matter for security
    body: VALIDATE (authentication, status SQLCODE), SECMAINT (GRANT/REVOKE of privileges and authorities such as DBADM, SECADM, DATAACCESS, ACCESSCTRL), SYSADMIN (instance commands, configuration, backup/restore, db2audit itself), OBJMAINT (DDL), CONTEXT (statement text and connection context) and EXECUTE (full statement with host-variable values — the most expensive).
  - title: Event correlation
    body: All records of one operation share an event correlator, and CONTEXT records carry the statement that produced an OBJMAINT/SECMAINT record. A GRANT logged as successful can still be rolled back, so the CONTEXT COMMIT/ROLLBACK tells you whether it stuck.
traffic:
  handles:
    - DRDA client connections (TCP 50000 / 50001 TLS by default)
    - Local (IPC) connections from the instance owner
    - SQL and XQuery statements, stored procedures
    - GRANT / REVOKE, roles, trusted contexts, RCAC (row/column access control)
    - Instance and database administration commands
    - Federation to remote sources (wrappers)
  flow:
    - step: Connect
      desc: Client connects over DRDA (or IPC locally); the security plug-in authenticates the user.
    - step: VALIDATE record
      desc: AUTHENTICATION written with auth type, plug-in name and SQLCODE status.
    - step: Authorize
      desc: Privilege checks run; CHECKING records for authorisation attempts if audited.
    - step: Execute
      desc: Statement runs; CONTEXT/EXECUTE records carry the statement text, OBJMAINT/SECMAINT the object changes.
    - step: Audit log
      desc: Records buffered and written to the per-member binary audit log.
    - step: Archive + extract
      desc: Scheduled db2audit archive + extract delasc produce per-category .del files.
    - step: Ship
      desc: A file monitor or syslog forwarder sends the delimited rows to Cribl Stream.
logs:
  - type: VALIDATE (authentication)
    sourcetype: ibm_db2_audit_validate
    format: csv
    share: 30–60 % (without CONTEXT/EXECUTE)
    avg: ~260 B
    desc: One row per authentication attempt from validate.del. event_status is the SQLCODE (0 ok, -30082 bad credentials); application_id encodes the client IP in hex for TCP connections (CB00712D = 203.0.113.45).
    fields:
      - timestamp
      - category
      - audit_event
      - event_correlator
      - event_status
      - database
      - userid
      - authid
      - execution_id
      - origin_node
      - coordinator_node
      - application_id
      - application_name
      - auth_type
      - package_schema
      - package_name
      - package_section
      - package_version
      - plugin_name
      - local_txn_id
      - global_txn_id
      - client_userid
      - client_wrkstnname
      - client_applname
      - client_acctng
      - trusted_context
      - conn_trust_type
      - role_inherited
      - original_userid
      - instance_name
      - hostname
      - tenant_name
    key:
      - timestamp
      - audit_event
      - event_status
      - database
      - userid
      - application_id
      - application_name
      - client_wrkstnname
    noise:
      - package_schema
      - package_name
      - package_section
      - package_version
      - local_txn_id
      - global_txn_id
      - tenant_name
      - origin_node
    sample: '"2026-11-12-09.14.22.185321","VALIDATE","AUTHENTICATION",2,-30082,"PAYDB   ","jdoe","JDOE","jdoe",0,0,"CB00712D.BC53.261112091422","db2jcc_application","SERVER","","",0,"","IBMOSauthserver","","","","WS-FIN-0042","","","","","","","db2inst1","db2prd01",""'
  - type: SECMAINT (grants and authorities)
    sourcetype: ibm_db2_audit_secmaint
    format: text
    share: < 5 %
    avg: ~450 B
    desc: GRANT/REVOKE of privileges and authorities, shown here in the db2audit extract file report form (one record, fields separated by semicolons). The delasc form has the same fields plus trusted-context, RCAC and client-register columns.
    pattern: '^timestamp=(?<timestamp>[^;]+); category=(?<category>[^;]+); audit event=(?<audit_event>[^;]+); event correlator=(?<event_correlator>\d+); event status=(?<event_status>-?\d+); database=(?<database>[^;]*); userid=(?<userid>[^;]*); authid=(?<authid>[^;]*); application id=(?<application_id>[^;]*); application name=(?<application_name>[^;]*); package schema=(?<package_schema>[^;]*); package name=(?<package_name>[^;]*); package section=(?<package_section>\d+); object schema=(?<object_schema>[^;]*); object name=(?<object_name>[^;]*); object type=(?<object_type>[^;]*); grantor=(?<grantor>[^;]*); grantee=(?<grantee>[^;]*); grantee type=(?<grantee_type>[^;]*); privilege=(?<privilege>[^;]*);$'
    key:
      - timestamp
      - audit_event
      - event_status
      - userid
      - object_name
      - grantor
      - grantee
      - privilege
    noise:
      - package_schema
      - package_name
      - package_section
    sample: 'timestamp=2026-11-12-09.31.05.188101; category=SECMAINT; audit event=GRANT; event correlator=4; event status=0; database=PAYDB; userid=dbadm1; authid=DBADM1; application id=0A140411.C1F2.261112093105; application name=db2bp; package schema=NULLID; package name=SQLC2P31; package section=0; object schema=PAYDB; object name=PAYDB; object type=DATABASE; grantor=DBADM1; grantee=SVC_ETL; grantee type=USER; privilege=DATAACCESS;'
  - type: CONTEXT (statement text)
    sourcetype: ibm_db2_audit_context
    format: text
    share: 40–90 % (when enabled)
    avg: ~400 B
    desc: Context and statement text for each audited operation (EXECUTE_IMMEDIATE, PREPARE, CONNECT, COMMIT, ROLLBACK …). Shown in report form; in delasc output the statement text sits in auditlobs and the row carries a LOB location specifier.
    pattern: '^timestamp=(?<timestamp>[^;]+); category=(?<category>[^;]+); audit event=(?<audit_event>[^;]+); event correlator=(?<event_correlator>\d+); database=(?<database>[^;]*); userid=(?<userid>[^;]*); authid=(?<authid>[^;]*); application id=(?<application_id>[^;]*); application name=(?<application_name>[^;]*); package schema=(?<package_schema>[^;]*); package name=(?<package_name>[^;]*); package section=(?<package_section>\d+); text=(?<text>.*);$'
    key:
      - timestamp
      - audit_event
      - database
      - userid
      - application_id
      - text
    noise:
      - package_schema
      - package_name
      - package_section
      - event_correlator
