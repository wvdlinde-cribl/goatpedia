    desc: Instance-level administrative commands from sysadmin.del — db2audit itself, db2set, start/stop, configuration updates, backup/restore, FORCE APPLICATION. A DB2AUDIT event outside the extract schedule can mean someone is reconfiguring or stopping audit.
