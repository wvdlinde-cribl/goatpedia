cves:
  - id: CVE-2026-10543
    cvss: 9.8
    year: 2026
    kev: false
    scope: device
    title: Db2 privilege escalation with a specially crafted query (improper authorization; ownership-transfer and ADMIN_MOVE_TABLE / ADMIN_COPY_SCHEMA paths changed by the fix)
    affected: Db2 Server 11.5.0–11.5.9 and 12.1.0–12.1.5, all platforms
    fixed: Interim security update (APAR DT472016) for 11.5.9, 12.1.4 and 12.1.5
    detect: SECMAINT records where the grantee gains DBADM/SECADM/DATAACCESS without a matching GRANT by a known admin; CONTEXT text with TRANSFER OWNERSHIP, ADMIN_MOVE_TABLE or ADMIN_COPY_SCHEMA from non-admin users.
    avoid: Apply the security update; audit SECMAINT and CONTEXT for all authorities; restrict EXECUTE on administrative procedures.
  - id: CVE-2025-36184
    cvss: 7.2
    year: 2026
    kev: false
    scope: device
    title: Db2 on Linux — instance owner can escalate to root (execution with unnecessary privileges)
    affected: Db2 11.5.0–11.5.9 on Linux
    fixed: Special build (APAR DT191269) for 11.5.9
    detect: SYSADMIN records for DB2SET / UPDATE_DBM_CFG by the instance owner at unusual times, followed by OS-level root activity on the database host (auditd).
    avoid: Patch; protect the instance-owner account like root (MFA on jump host, no shared password); monitor setuid binaries under sqllib.
  - id: CVE-2018-1978
    cvss: 7.8
    year: 2019
    kev: false
    scope: device
    title: Db2 buffer overflow — authenticated local user executes code as root
    affected: Db2 9.7, 10.1, 10.5, 11.1
    fixed: 11.1.4.4 iFix001 (special builds for older releases)
    detect: Not visible in db2audit; look for crashes (db2diag.log traps) and root processes spawned from Db2 setuid binaries.
    avoid: Patch or upgrade off out-of-support releases; restrict shell access to database hosts.
  - id: CVE-2023-27559
    cvss: 7.5
    year: 2023
    kev: false
    scope: device
    title: Db2 server crash (DoS) on a specially crafted subquery
    affected: Db2 10.5, 11.1, 11.5
    detect: CONTEXT records with deeply nested subqueries from one application id immediately before a gap in all audit categories and a START_DB2 SYSADMIN record.
    avoid: Patch; limit ad-hoc SQL access; use workload management to cap runaway queries.
  - id: CVE-2021-44228
    cvss: 10
    year: 2021
    kev: true
    scope: device
    title: Apache Log4j JNDI RCE (Log4Shell) in Db2 11.5 Federation wrappers (DVM JDBC, NoSQL/Hadoop, Blockchain)
    affected: Db2 11.5 only when FEDERATED=YES and one of those wrappers is configured
    fixed: Special builds for 11.5.6 / 11.5.7; mitigation DB2_JVM_STARTARGS=-Dlog4j2.formatMsgNoLookups=true
    detect: CONTEXT text with ${jndi strings passed to federated nicknames; outbound LDAP/RMI from the Db2 host in firewall logs.
    avoid: Set FEDERATED=NO if unused; apply the special build; egress-filter database hosts.
detections:
  - title: Brute force / password spraying against Db2
    severity: high
    signals:
      - category=VALIDATE
      - audit_event=AUTHENTICATION
      - event_status < 0 (e.g. -30082)
      - many attempts per application_id source or per user
    why: Db2 authenticates against the OS or LDAP, so a spray against Db2 is also a spray against those accounts. Repeated -30082 from one client is either an attack or a broken service credential.
    kql: |-
      dataset="db2_audit" category has "VALIDATE" event_status < 0
      | extend client=substring(application_id, 1, 8)
      | summarize fails=count(), users=dcount(userid) by client, database, bin(_time, 10m)
      | where fails > 20 or users > 5
    mitre:
      - T1110.001
      - T1110.003
  - title: High-value authority granted (DBADM, SECADM, DATAACCESS, ACCESSCTRL)
    severity: high
    signals:
      - category=SECMAINT
      - audit_event=GRANT
      - privilege in DBADM / SECADM / DATAACCESS / ACCESSCTRL / SQLADM
    why: These authorities give read access to all data or control over security itself. They change rarely and only through change management — any grant is worth a ticket check.
    kql: |-
      dataset="db2_audit" category="SECMAINT" audit_event="GRANT" event_status >= 0
      | where privilege in ("DBADM","SECADM","DATAACCESS","ACCESSCTRL","SQLADM","SETSESSIONUSER")
      | project _time, userid, grantor, grantee, grantee_type, privilege, object_name
    mitre:
      - T1098
  - title: Audit configuration changed or stopped
    severity: high
    signals:
      - category=SYSADMIN audit_event=DB2AUDIT outside the archive/extract schedule
      - CONTEXT text with AUDIT … REMOVE POLICY / DROP AUDIT POLICY / ALTER AUDIT POLICY
    why: Turning off or narrowing the audit policy is defence evasion; on Db2 it requires SYSADM (instance) or SECADM (database), so it also identifies who holds those powers.
    kql: |-
      dataset="db2_audit" (audit_event has "DB2AUDIT") or (text matches regex @"(?i)(DROP|ALTER)\s+AUDIT\s+POLICY|REMOVE\s+POLICY")
      | project _time, userid, application_name, audit_event, text
    mitre:
      - T1562.001
  - title: Instance owner or SYSADM changing registry and configuration
    severity: medium
    signals:
      - category=SYSADMIN
      - audit_event in DB2SET / UPDATE_DBM_CFG / UPDATE_DB_CFG
      - outside change window
    why: db2set and DBM CFG changes (e.g. AUTHENTICATION=CLIENT, SYSADM_GROUP, DB2_JVM_STARTARGS) can weaken authentication or load code — the precursor to CVE-2025-36184-style escalation.
    kql: |-
      dataset="db2_audit" category has "SYSADMIN"
      | where audit_event has_any ("DB2SET","UPDATE_DBM_CFG","UPDATE_DB_CFG")
      | summarize count() by userid, audit_event, bin(_time, 1h)
    mitre:
      - T1078.003
      - T1556
  - title: Bulk data export or unload
    severity: medium
    signals:
      - CONTEXT text with EXPORT TO / UNLOAD / ADMIN_CMD('EXPORT …')
      - SYSADMIN UNLOAD_TABLE or BACKUP_DB to an unusual path
    why: Exfiltration from Db2 commonly uses the built-in EXPORT/UNLOAD utilities or a backup image copied off-host, which bypasses application-level controls.
    kql: |-
      dataset="db2_audit"
      | where text matches regex @"(?i)\b(EXPORT\s+TO|UNLOAD|ADMIN_CMD\s*\(\s*'EXPORT)" or audit_event has_any ("UNLOAD_TABLE","BACKUP_DB")
      | project _time, userid, application_id, audit_event, text
    mitre:
      - T1005
      - T1213
optimizations:
  - title: Audit EXECUTE/CONTEXT only where it matters
    saving: 50–90 %
    fn: Drop
    how: Attach EXECUTE/CONTEXT policies to sensitive tables, privileged authorities (SYSADM, DBADM, SECADM) and human users rather than the whole database. In Stream, drop CONTEXT COMMIT/ROLLBACK/CONNECT_RESET records that carry no statement text.
    expr: category=='CONTEXT' && ['COMMIT','ROLLBACK','CONNECT_RESET','DESCRIBE','CLOSE_CURSOR'].includes(audit_event)
  - title: Strip empty and package columns
    saving: 30–50 %
    fn: Parser → Serialize
    how: Delasc rows carry many empty client-register, trusted-context, transaction-id and package columns. Parse with the per-category header, drop empties and package_*/txn ids, then serialise to JSON or keep CSV if the SIEM parser expects it.
    expr: "remove: package_*, local_txn_id, global_txn_id, tenant_name; drop empty"
  - title: Decode the client IP from application_id
    saving: Analyst time
    fn: Eval
    how: For TCP connections the first 8 hex digits of application_id are the client IPv4 address. Add src_ip so detections and lookups work without string tricks.
    expr: "Code function — if application_id starts with 8 hex digits, src_ip = the 4 hex byte pairs converted to decimal and joined with dots"
  - title: Suppress repeated failed authentications
    saving: 5–20 %
    fn: Suppress
    how: A misconfigured service retries with a stale password thousands of times. Keep one per userid + client per minute with a count.
    expr: "key: `${userid}:${application_id.substr(0,8)}`  allow 1 / 60s  when category=='VALIDATE' && event_status<0"
  - title: Route by category
    saving: SIEM licence
    fn: Routes
    how: VALIDATE failures, SECMAINT, SYSADMIN and OBJMAINT → SIEM. CONTEXT/EXECUTE → Cribl Lake for compliance retention and investigations.
    expr: category in ('CONTEXT','EXECUTE') → Lake | else → SIEM
