summary: Beyondtrust Pra is logged by the Elastic integrations package beyondtrust_pra. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: beyondtrust_pra_access_session
    desc: 'Elastic integrations fixture, 2 events. Upstream: beyondtrust_pra/data_stream/access_session/_dev/test/pipeline/test-event.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: beyondtrust_pra
  Sourcetypes: '1'
  Fixture events: '2'
  Log format seen: json
  Fields in the first fixture: body, data.value[0].name, data.value[0].value, data.value[1].name, data.value[1].value, destination.display_name
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Beyondtrust Pra events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries body, data.value[0].name, data.value[0].value, data.value[1].name, data.value[1].value, destination.display_name. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads beyondtrust_pra and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
