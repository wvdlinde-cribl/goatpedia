summary: Asana is logged by the Datadog integrations-core package asana. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: asana
    desc: 'Datadog integrations-core fixture, 2 events. Upstream: asana/assets/logs/asana_tests.yaml'
facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: asana
  Sourcetypes: '1'
  Fixture events: '2'
  Log format seen: json
  Fields in the first fixture: gid, created_at, event_type, event_category, actor.actor_type, actor.gid
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Asana events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries gid, created_at, event_type, event_category, actor.actor_type, actor.gid. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads asana and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
logs:
  - type: Asana
    sourcetype: asana
    format: json
    desc: 2 fixture events in the samples pool (logtest).
    sample: '{"gid":"1208575735614490","created_at":"2024-10-18T04:42:40.072Z","event_type":"user_app_authorized","event_category":"apps","actor":{"actor_type":"user","gid":"1208549725691543","name":"Test User","email":"user@example.com"},"resource":{"resource_type":"user","gid":"1208549725691543","name":"Test User","email":"user@example.com"},"details":{"app_type":"oauth","app_gid":"1207902716322150","app_name":"ExperienceCloudAsana","app_url":""},"context":{"context_type":"web","client_ip_address":"198.51.100.25","user_agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/203.0.113.8 Safari/537.36"}}'
