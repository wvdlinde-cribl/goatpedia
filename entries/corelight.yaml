id: corelight
name: Corelight Sensor
short: Corelight
aka:
  - Corelight Open NDR
  - Corelight AP sensors
  - Corelight Software Sensor
  - Corelight Fleet Manager
  - Corelight Investigator
vendor: Corelight
category: ndr
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - ndr
  - nsm
