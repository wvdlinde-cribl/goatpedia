summary: Lite Llm is logged by the Elastic integrations package lite_llm. The Pack Generator samples pool holds fixture events for 2 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: lite_llm_audit
    desc: 'Elastic integrations fixture, 10 events. Upstream: lite_llm/data_stream/audit/_dev/test/pipeline/test-audit.log'
  - st: lite_llm_spend_tracking
    desc: 'Elastic integrations fixture, 5 events. Upstream: lite_llm/data_stream/spend_tracking/_dev/test/pipeline/test-spend-tracking.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: lite_llm
  Sourcetypes: '2'
  Fixture events: '15'
  Log format seen: json
  Fields in the first fixture: id, updated_at, changed_by, changed_by_api_key, action, table_name
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Lite Llm events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries id, updated_at, changed_by, changed_by_api_key, action, table_name. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads lite_llm and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
