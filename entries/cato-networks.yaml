summary: Cato Networks is logged by the Elastic integrations package cato_networks. The Pack Generator samples pool holds fixture events for 2 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: cato_networks
    desc: 'Elastic integrations fixture, 5 events. Upstream: cato_networks/data_stream/event/_dev/test/pipeline/test-event.log'
  - st: cato_networks_audit
    desc: 'Elastic integrations fixture, 4 events. Upstream: cato_networks/data_stream/audit/_dev/test/pipeline/test-audit.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: cato_networks
  Sourcetypes: '2'
  Fixture events: '9'
  Log format seen: json
  Fields in the first fixture: ISP_name, account_id, account_name, action, ad_name, app_stack
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Cato Networks events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries ISP_name, account_id, account_name, action, ad_name, app_stack. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads cato_networks and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
