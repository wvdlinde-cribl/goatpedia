    sample: '{"role_id":"63622d93d274d9489dbbgresdcv6a1cf","data_scope_id":"fgreg63622d93d274d9489db6a1cf","allowed_scopes_impersonation":["63622d93d274d9489db6a1cf","63622d93d274d9489db6a1cc"],"first_name":"john","last_name":"doe","email":"user@example.com","title":"Software Engineer","department":"example","user_name":"john.doe","last_updated":"Sat, 10 Mar 2025 18:53:09 GMT","source":"example source","uuid":"63622d93d274d9489db6a1cf","role_name":"example role","data_scope_name":"example data scope","last_login":"Sat, 08 Mar 2025 18:53:09 GMT"}'
    key:
      - role_id
      - data_scope_id
      - allowed_scopes_impersonation[0]
      - allowed_scopes_impersonation[1]
cves: []
detections:
  - title: Open high-severity finding
    severity: medium
    signals:
      - event.data.finding_name
      - event.data.finding_severity
      - event.data.status
    why: An open high-severity finding is a rule that matched, such as adapters failing, which leaves the inventory blind for the tools behind them.
    kql: |
      dataset="axonius_logs"
      | where sourcetype == "axonius_alert_finding" and event.data.finding_severity == "high" and event.data.status == "open"
      | project event.data.trigger_date, event.data.finding_name, event.data.finding_severity, event.data.status
optimizations: []
references:
  - title: Axonius documentation
    url: https://docs.axonius.com/
