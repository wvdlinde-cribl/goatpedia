id: axonius
name: Axonius
short: Axonius
vendor: Axonius
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Axonius Cybersecurity Asset Management
  - Axonius Platform
tags:
  - asset-management
  - caasm
  - saas
  - json
summary: A cyber asset management platform that connects to hundreds of IT and security tools through adapters and merges what they know into one inventory of devices, users, software, cloud resources and more. It correlates records from different tools into one asset, finds gaps such as a device with no EDR agent, and raises findings and tickets. Its API returns the merged assets of each type, plus the platform's own adapters, gateways, findings and users.
sourcetypes:
  - st: axonius_adapter
    desc: Configured adapters and their connections, with status and counts of successful, failing and inactive connections
  - st: axonius_alert_finding
    desc: Alert findings Axonius raised from its rules, such as failed adapters, with severity, status and trigger time
  - st: axonius_application
    desc: Application and URL assets, with exposure context and the adapters that reported them
  - st: axonius_compute
    desc: Compute assets (devices), with the adapters that saw them, protocols, risk and software vulnerabilities
  - st: axonius_exposure
    desc: Exposure and vulnerability repository records, with CVE, CISA KEV data and required action
  - st: axonius_gateway
    desc: Axonius gateways that connect the cloud platform to internal networks, with tunnel and DNS settings
  - st: axonius_identity
    desc: Identity assets (users) merged from directories and SaaS, with admin roles, account state and associated devices
  - st: axonius_incident
    desc: Incidents collected from security tools, such as cloud security alerts, with risk level and state
  - st: axonius_network
    desc: Network assets such as load balancers, with addresses and connected cloud resources
  - st: axonius_storage
    desc: Storage assets such as object storage buckets, with account, creation date and fetch details
  - st: axonius_ticket
    desc: Tickets collected from ticketing and finding adapters, with category, status and dates
  - st: axonius_user
    desc: Users of the Axonius console itself, with role, data scope and allowed impersonation scopes
facts:
  Product: Cyber asset attack surface management (CAASM)
  Data sources: Adapters for directories, EDR, MDM, cloud providers, vulnerability scanners, ticketing and SaaS
  Deployment: SaaS or self-hosted, with gateways for internal networks
  Log transport: HTTPS JSON REST API, polled by a collector with an API key and secret
  Log format: One JSON object per asset or platform object. Assets carry internal_axon_id, asset_type, adapters and event.data
  What an asset record answers: What the asset is, which tools know about it, and what its current state and risk are
  What a finding answers: Which Axonius rule fired, how severe it is and whether it is open
placement:
  slots:
    - cloud
    - internal
  items:
    - slot: cloud
      title: Axonius platform
      desc: The inventory, correlation, rules and findings run in the Axonius instance. A collector polls its API.
    - slot: internal
      title: Gateways and adapters
      desc: Adapters connect to the tools that hold asset data. Gateways give a cloud instance reach into internal networks to query on-premises tools.
howItWorks:
  - title: Adapters and correlation
    body: Each adapter fetches records from one tool on a discovery cycle. Axonius correlates records that describe the same asset into one, identified by internal_axon_id, and lists the contributing adapters. adapter_list_length says how many tools saw the asset.
  - title: Asset types
    body: Assets are typed, devices, users, software, URLs, load balancers, object storage, incidents, tickets, vulnerabilities and more. Each record holds event.data with the merged fields, and accurate_for_datetime for when it was true.
  - title: Findings
    body: Rules run against the inventory each cycle and raise findings, such as an adapter failing or a device missing a required agent. Each finding has a name, severity, status and trigger date.
  - title: How the events leave the product
    body: A collector with an API key and secret queries the REST API per asset type and for adapters, gateways, findings and console users, page by page.
traffic:
  handles:
    - Asset data fetched from IT and security tools
    - Correlation and inventory of devices, users, software and cloud resources
    - Findings and tickets about coverage gaps and risk
  flow:
    - step: Adapters fetch
      desc: Adapters query connected tools on each discovery cycle.
    - step: Axonius correlates
      desc: Records are merged into assets and rules raise findings.
    - step: Collector polls
      desc: A collector reads assets and platform objects from the API as JSON.
