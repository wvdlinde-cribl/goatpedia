id: vectra-detect
name: Vectra Detect
short: Vectra Detect
vendor: Vectra
category: saas
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - vectra_detect
  - Elastic integrations
tags:
  - elastic
  - text
summary: Vectra Detect is logged by the Elastic integrations package vectra_detect. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: vectra_detect
    desc: 'Elastic integrations fixture, 20 events. Upstream: vectra_detect/data_stream/log/_dev/test/pipeline/test-host-scoring.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: vectra_detect
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Vectra Detect events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Elastic integrations package reads vectra_detect and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as text.
logs:
  - type: Log
    sourcetype: vectra_detect
    format: text
    desc: 20 fixture events in the samples pool (elastic).
    sample: 'vectra_json_v2 -: {"version": "7.4", "host_id": 522, "headend_addr": "192.0.2.20", "host_name": "desktop01", "dvchost": "x29-1-13.sc.tvec", "host_ip": "198.51.100.15", "threat": 53, "certainty": 98, "privilege": 0, "score_decreases": false, "href": "https://x29-1-13.sc.tvec/hosts/522", "host_roles": "", "src_key_asset": false, "dst_key_asset": false, "category": "HOST SCORING", "quadrant": "critical", "sensor": "Vectra X", "detection_profile": "{\"name\": \"botnet\", \"vname\": \"Botnet\", \"scoringDetections\": [\"Cryptocurrency Mining\"]}", "host_groups": "[]", "tags": "[]", "account_access_history": "[]", "service_access_history": "[]", "mac_address": "00-00-5E-00-53-23", "mac_vendor": "Nortel Networks", "last_detection_type": "Cryptocurrency Mining", "vectra_timestamp": "1678013510"}'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Vectra Detect events arriving
    severity: low
    signals:
      - message
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "vectra_detect"'
optimizations: []
references:
  - title: elastic/integrations vectra_detect/data_stream
    url: https://github.com/elastic/integrations/blob/cbfff90638a7565377768f50726775c0febc7bf4/packages/vectra_detect/data_stream/log/_dev/test/pipeline/test-host-scoring.log
  - title: Pack Generator sample vectra_detect.json
    url: https://github.com/wvdlinde-cribl/cribl-pack-samples/blob/main/samples/vectra_detect.json
