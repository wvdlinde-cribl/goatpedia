id: checkpoint-harmony-endpoint
name: Check Point Harmony Endpoint
short: Harmony EP
vendor: Check Point Software Technologies
category: ngfw
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Harmony Endpoint
  - Check Point Endpoint Security
  - SandBlast Agent
tags:
  - endpoint
  - edr
  - antimalware
  - anti-phishing
  - json
summary: Check Point Harmony Endpoint, formerly SandBlast Agent, is an endpoint protection and EDR product for Windows, macOS and Linux. The Check Point Endpoint Security Client on each device combines anti-malware, anti-bot, threat emulation and extraction, zero-phishing, URL filtering and forensics, managed from the Harmony Endpoint management service in the Infinity Portal or an on-premises management server. Each blade logs its detections and actions, so the logs show which machine and user met which threat, what it was, and whether the client detected, prevented or cleaned it.
sourcetypes:
  - st: checkpoint_harmony_endpoint_antibot
    desc: Anti-Bot events, one record per connection or DNS query from an endpoint to a known command-and-control or malicious domain, with the process, domain and action
  - st: checkpoint_harmony_endpoint_antimalware
    desc: Anti-Malware events, one record per infection found by the signature and heuristic scanner, with the host, user, engine and signature versions and the action taken
  - st: checkpoint_harmony_endpoint_forensics
    desc: Forensics case analysis events, one record per incident the forensics engine analysed, with the triggering detection, the file and its hashes, and the attack status
  - st: checkpoint_harmony_endpoint_threatemulation
    desc: Threat Emulation events, one record per file sent to the sandbox and judged malicious, with the file name and hash and the action taken
  - st: checkpoint_harmony_endpoint_threatextraction
    desc: Threat Extraction events, one record per downloaded document the client tried to sanitise by removing active content, with the result
  - st: checkpoint_harmony_endpoint_urlfiltering
    desc: URL Filtering events, one record per web request checked against URL category policy, with the URL, the protection and the action
  - st: checkpoint_harmony_endpoint_zerophishing
    desc: Zero-Phishing events, one record per web page the browser extension judged to be a phishing site, with the URL and the action
facts:
  Product: Endpoint protection platform and EDR with anti-malware, anti-bot, sandboxing, content disarm, anti-phishing, URL filtering and forensics
  Form factor: Check Point Endpoint Security Client on Windows, macOS and Linux, with a browser extension for web protections. Managed from the Infinity Portal (cloud) or an on-premises Endpoint Security Management Server
  Log transport: Events are stored in the management service's log server. A collector reads them from the Infinity Portal logs API with a client id and secret, or from the on-premises management through Log Exporter as syslog
  Log format: JSON. All blades share common fields (time, severity, confidence_level, product, event_type, action, src, src_machine_name, src_user_name, policy_name) plus blade-specific fields such as file_name, file_md5, resource or protection_name
  What an event answers: On which machine and for which user which protection (product, protection_type) found what (description, file_name, resource), how severe and certain it is, and whether it was detected, prevented, extracted or cleaned (action)
placement:
  slots:
    - endpoint
    - cloud
  items:
    - slot: endpoint
      title: Endpoint Security Client
      desc: The client runs on each laptop, desktop and server and the browser extension in each browser. Detection and enforcement happen there, and each event names the machine and user.
    - slot: cloud
      title: Harmony Endpoint management
      desc: Policies and logs live in the Harmony Endpoint management service in the Infinity Portal, or on an on-premises management server. Collectors read events from there.
howItWorks:
  - title: Blades
    body: The client is built from blades that the policy turns on. Anti-Malware scans files. Anti-Bot watches DNS and connections for command-and-control. Threat Emulation runs suspicious files in a sandbox, and Threat Extraction strips active content from documents. Zero-Phishing and URL Filtering work in the browser. Forensics builds an incident report when another blade fires.
  - title: What an event records
    body: product names the blade and event_type the kind of event. action is what the client did, such as Detect, Prevent or Extract. severity and confidence_level rate it. src_machine_name, src_user_name and src identify the endpoint. protection_type and protection_name name the specific protection, and description explains the finding, often with the exclusion steps.
  - title: Forensics cases
    body: When a detection fires, the forensics blade traces what led to it and what followed. The case analysis event records which protection detected it (detected_by), the file and hashes, and attack_status, for example Dormant when the threat never ran.
  - title: How the events leave the product
    body: Clients upload logs to the management service. In the Infinity Portal a collector creates an API key for the logs service and runs log queries for new endpoint events. On premises, Log Exporter can send them as syslog. The destination is a choice of the pipeline, not a property of Harmony Endpoint.
traffic:
  handles:
    - Files written, downloaded and executed on endpoints
    - DNS queries and outbound connections
    - Web browsing and phishing pages
    - Document downloads with active content
  flow:
    - step: Activity on the endpoint
      desc: A user downloads a file, opens a page or a process makes a connection.
    - step: A blade inspects it
      desc: The relevant blade scans, emulates, extracts or checks reputation, and acts according to policy.
    - step: Client logs the event
      desc: The client sends an event with the blade, action, severity, file or URL and endpoint details to the management service.
    - step: Collector reads the logs
      desc: A collector queries the logs API, or receives Log Exporter syslog, and forwards each JSON event.
logs:
  - type: Anti-Bot event
    sourcetype: checkpoint_harmony_endpoint_antibot
    format: json
