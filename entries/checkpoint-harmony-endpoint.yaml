cves: []
detections:
  - title: Malware detected on an endpoint
    severity: high
    signals:
      - product
      - severity
      - action
      - src_machine_name
      - src_user_name
    why: High and critical events from Anti-Malware, Threat Emulation, Anti-Bot and Forensics mean malicious code was on the machine or calling out from it. When the action is only Detect, the threat was not blocked and needs follow-up on that host.
    kql: |
      dataset="checkpoint-harmony-endpoint_logs"
      | where sourcetype in ("checkpoint_harmony_endpoint_antimalware", "checkpoint_harmony_endpoint_threatemulation", "checkpoint_harmony_endpoint_antibot", "checkpoint_harmony_endpoint_forensics") and severity in ("High", "Critical")
      | project time, product, event_type, severity, action, src_machine_name, src_user_name, description
    mitre:
      - T1204
  - title: Phishing page detected in the browser
    severity: medium
    signals:
      - product
      - action
      - description
      - src_user_name
    why: A Zero-Phishing detection means a user opened a page built to steal credentials. If the action was Detect rather than Prevent, the user may have entered their password.
    kql: |
      dataset="checkpoint-harmony-endpoint_logs"
      | where sourcetype == "checkpoint_harmony_endpoint_zerophishing"
      | project time, severity, action, src_machine_name, src_user_name, description
    mitre:
      - T1566.002
optimizations:
  - title: Keep detections, route informational events to storage
    saving: much of the endpoint log volume
    fn: Routes
    how: Informational URL filtering and threat extraction events record routine browsing and document handling. Send high and critical detections to the SIEM in full, and send informational events to cheaper storage.
    expr: "severity == 'Informational'"
references: []
