    key:
      - process_exec.process.exec_id
      - process_exec.process.pid
      - process_exec.process.uid
      - process_exec.process.cwd
cves: []
detections:
  - title: Shell started in a pod
    severity: medium
    signals:
      - process_exec.process.binary
      - process_exec.process.pod.name
      - process_exec.process.pod.namespace
      - process_exec.process.uid
    why: Most containers never start an interactive shell. A shell in a pod is often someone exec-ing in, or an attacker who reached code execution in the workload.
    kql: |
      dataset="tetragon_logs"
      | where sourcetype == "tetragon" and process_exec.process.binary in ("/bin/sh", "/bin/bash", "/usr/bin/sh", "/usr/bin/bash", "/bin/dash") and isnotempty(process_exec.process.pod.name)
      | project time, node_name, process_exec.process.pod.namespace, process_exec.process.pod.name, process_exec.process.binary, process_exec.process.arguments, process_exec.process.uid
    mitre:
      - T1059.004
      - T1609
optimizations: []
references:
