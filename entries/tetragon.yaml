id: tetragon
name: Cilium Tetragon
short: Tetragon
vendor: Isovalent (Cisco)
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Tetragon
  - Cilium Tetragon
tags:
  - ebpf
  - kubernetes
  - runtime-security
  - process
summary: An open-source eBPF-based security observability and runtime enforcement tool from the Cilium project. Tetragon runs as an agent on each Linux node or Kubernetes node and records process executions and exits, and, through tracing policies, file access, network connections and system calls, with full Kubernetes context. Each event says which binary ran with which arguments, as which user, under which parent, in which pod and container.
sourcetypes:
  - st: tetragon
    desc: Tetragon JSON events from the node agent, such as process_exec and process_exit, and tracing policy events, with process, parent and Kubernetes pod context
facts:
  Product: eBPF runtime security observability and enforcement for Linux and Kubernetes
  Form factor: Tetragon agent as a DaemonSet on Kubernetes nodes, or a service on Linux hosts
  Event types: process_exec, process_exit, and process_kprobe, process_tracepoint or process_lsm from tracing policies
  Log transport: JSON written to an export file on the node (or read over its gRPC API). A log forwarder ships the file
  Log format: One JSON object per event, keyed by event type, with node_name and time
  What a process_exec event answers: Which binary ran with which arguments and working directory, as which uid, started by which parent, in which pod, container, namespace and workload
placement:
  slots:
    - internal
    - endpoint
  items:
    - slot: internal
      title: Kubernetes nodes
      desc: Tetragon runs on every node of the cluster as a DaemonSet. It sees all processes in all containers on that node through eBPF.
    - slot: endpoint
      title: Linux hosts
      desc: Tetragon can also run as a service on a standalone Linux server, where it records the host's processes without Kubernetes context.
howItWorks:
  - title: eBPF in the kernel
    body: Tetragon loads eBPF programs into the Linux kernel. Process execution and exit are always observed. Tracing policies add hooks on kernel functions, tracepoints or LSM hooks, to watch file, network or privilege operations, and can enforce by killing a process or overriding a return value.
  - title: Process context
    body: Each process gets an exec_id that stays unique across the cluster, and a parent_exec_id, so the full process tree can be rebuilt. Events carry binary, arguments, cwd, uid, auid, start time and flags, plus pod, container, image, labels and workload when the process runs in Kubernetes.
  - title: How events leave the node
    body: The agent writes events as JSON lines to an export file, with rotation, and can also stream them over gRPC. A log forwarder on the node reads the file and sends the events to any collector.
traffic:
  handles:
    - Process execution and exit
    - File, network and syscall activity under tracing policies
    - Kubernetes pod and container context
  flow:
    - step: Process runs
      desc: A process starts in a container or on the host.
    - step: Kernel hook fires
      desc: Tetragon's eBPF program sees the execution and collects process, parent and namespace data.
    - step: Agent writes the event
      desc: The agent adds Kubernetes context and writes one JSON event to its export file.
    - step: Collector reads
      desc: A log forwarder ships the line. Goatpedia reads it as JSON.
logs:
  - type: Process events
    sourcetype: tetragon
    format: json
    desc: One process execution. process_exec.process.binary and arguments say what ran, uid and cwd how, process_exec.parent which process started it, and process_exec.process.pod which pod, container and workload. This sample is local-path-provisioner starting in a kind cluster, run by containerd-shim.
