id: awsfirehose
name: Amazon Data Firehose
short: Firehose
vendor: Amazon Web Services
category: cloud
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Amazon Kinesis Data Firehose
  - AWS Firehose
tags:
  - streaming
  - log-delivery
  - aws
  - cloud
  - json
summary: A managed AWS streaming service that delivers records from AWS services and applications to S3, Redshift, OpenSearch, Splunk or any HTTP endpoint. Many AWS logs, such as CloudWatch Logs subscriptions and VPC Flow Logs, can be sent through a Firehose stream. Each delivered record wraps the original log line, so what a record means depends on the log it carries, here a VPC flow log.
sourcetypes:
  - st: awsfirehose
    desc: Records delivered by a Firehose stream, each wrapping one log line in message. The lines here are VPC Flow Log records
facts:
  Product: Managed delivery stream for logs and events
  Sources: Direct PUT from applications, Kinesis Data Streams, CloudWatch Logs subscriptions, VPC Flow Logs, WAF and others
  Destinations: S3, Redshift, OpenSearch, Splunk, and HTTP endpoints, including third-party log platforms
  Log transport: HTTPS POST of batched records to the destination endpoint, with an access key header
  Log format: JSON records, each with the original log line. VPC Flow Logs use the space-separated default format
  What a VPC flow record answers: Which address talked to which on which port and protocol, how much traffic, and whether it was accepted
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Firehose delivery stream
      desc: The stream runs in an AWS region. AWS services put records into it, and Firehose batches and delivers them to the configured destination.
howItWorks:
  - title: Delivery streams
    body: A Firehose stream buffers records by size or time, can transform them with a Lambda function, and delivers batches to its destination. Failed deliveries are retried and can be backed up to S3.
  - title: VPC Flow Logs through Firehose
    body: VPC Flow Logs capture IP traffic per network interface. Sent to Firehose, each record is one line in the default format, version, account id, interface id, source and destination address and port, protocol, packets, bytes, start and end time, action and log status.
  - title: How the records leave AWS
    body: For an HTTP endpoint destination, Firehose POSTs JSON batches with an access key. Any collector with an HTTP endpoint can receive them.
traffic:
  handles:
    - Log delivery from AWS services
    - VPC network flow records in this stream
  flow:
    - step: Source produces
      desc: An AWS service, here VPC Flow Logs, produces a log record.
    - step: Firehose buffers
      desc: The delivery stream batches records and optionally transforms them.
    - step: Firehose delivers
      desc: Firehose POSTs the batch to the destination endpoint or writes it to storage.
logs:
  - type: VPC flow records via Firehose
    sourcetype: awsfirehose
    format: json
    desc: One object per record. message is a VPC flow log line, version, account, interface, source and destination address and port, protocol, packets, bytes, start and end time, action (ACCEPT here) and status. Addresses are documentation addresses.
    sample: '{"message":"2 123456789010 eni-1235b8ca123456789 198.51.100.15 198.51.100.25 20641 22 6 20 4249 1418530010 1418530070 ACCEPT OK"}'
    key:
      - message
cves: []
detections: []
optimizations:
  - title: Drop accepted flows outside a watch list
    saving: most of the flow volume
    fn: Drop
    how: Accepted flows are the bulk of VPC traffic. Rejected flows and flows to sensitive ports are the security-relevant subset. Keep REJECT records and send accepted flows to cheaper storage or aggregate them.
    expr: message.indexOf(' ACCEPT ') >= 0
    stream:
      log: VPC flow records via Firehose
      functions:
        - id: drop
          filter: typeof message == 'string' && message.indexOf(' ACCEPT ') >= 0
          description: Drop accepted flows; keep REJECT records for the SIEM (send accepted flows to cheaper storage or aggregate them)
          conf: {}
      test:
        - '{"message":"2 123456789010 eni-1235b8ca123456789 203.0.113.12 198.51.100.25 49152 3389 6 20 4249 1418530010 1418530070 REJECT OK"}'
      expect:
        out: 1
references:
  - title: What is Amazon Data Firehose?
    url: https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html
  - title: VPC Flow Logs
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html
