summary: Kolide is logged by the Elastic integrations package kolide. The Pack Generator samples pool holds fixture events for 9 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: kolide_audit
    desc: 'Elastic integrations fixture, 20 events. Upstream: kolide/data_stream/audit/_dev/test/pipeline/test-kolide-audit-pipeline.json'
  - st: kolide_auth
    desc: 'Elastic integrations fixture, 20 events. Upstream: kolide/data_stream/auth/_dev/test/pipeline/test-kolide-auth-pipeline.json'
  - st: kolide_deprovisioned_person
    desc: 'Elastic integrations fixture, 2 events. Upstream: kolide/data_stream/deprovisioned_person/_dev/test/pipeline/test-kolide-deprovisioned-person-pipeline.json'
  - st: kolide_device
    desc: 'Elastic integrations fixture, 7 events. Upstream: kolide/data_stream/device/_dev/test/pipeline/test-kolide-device-pipeline.json'
  - st: kolide_issues
    desc: 'Elastic integrations fixture, 11 events. Upstream: kolide/data_stream/issues/_dev/test/pipeline/test-kolide-issues-pipeline.json'
  - st: kolide_osquery_result
    desc: 'Elastic integrations fixture, 5 events. Upstream: kolide/data_stream/osquery_result/_dev/test/pipeline/test-kolide-osquery-result-s3-sample.json'
  - st: kolide_osquery_status
    desc: 'Elastic integrations fixture, 6 events. Upstream: kolide/data_stream/osquery_status/_dev/test/pipeline/test-kolide-osquery-status-s3-sample.json'
  - st: kolide_people
    desc: 'Elastic integrations fixture, 2 events. Upstream: kolide/data_stream/people/_dev/test/pipeline/test-kolide-people-pipeline.json'
  - st: kolide_request
    desc: 'Elastic integrations fixture, 7 events. Upstream: kolide/data_stream/request/_dev/test/pipeline/test-kolide-request-pipeline.json'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: kolide
  Sourcetypes: '9'
  Fixture events: '80'
  Log format seen: json
  Fields in the first fixture: id, timestamp, actor_name, description, actor_info.actor_name, actor_info.actor_email
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Kolide events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries id, timestamp, actor_name, description, actor_info.actor_name, actor_info.actor_email. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads kolide and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
logs:
