    sourcetype: kolide_audit
    format: json
    desc: 20 fixture events in the samples pool (elastic).
    sample: '{"id":"90000001","timestamp":"2026-06-04T19:10:55.090Z","actor_name":"Alice Johnson","description":"user ''user@example.com'' accepted invitation to Kolide","actor_info":{"actor_name":"Alice Johnson","actor_email":"user@example.com","actor_type":"User"}}'
