# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: kolide
name: Kolide Device Trust
short: Kolide
vendor: Kolide (a 1Password company)
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Kolide
  - 1Password Device Trust
  - 1Password Extended Access Management
tags:
  - device-trust
  - endpoint-compliance
  - osquery
  - sso
  - json
summary: A device-trust service. An osquery-based agent on each laptop checks the device against the company's checks, and Kolide blocks sign-ins through the identity provider from devices that fail. Kolide runs as a SaaS service, with the agent on endpoints. Its API and log pipeline expose admin audit events, sign-in attempts, device and people inventory, failing checks (issues), exemption requests and raw osquery results and status.
sourcetypes:
  - st: kolide_audit
    desc: Admin and user actions in the Kolide account, with the actor and a description
  - st: kolide_auth
    desc: Device-trust sign-in attempts through the identity provider, with result, person, device, IP and the steps of the session
  - st: kolide_deprovisioned_person
    desc: People removed from the Kolide roster, with when they last authenticated
  - st: kolide_device
    desc: Inventory of enrolled devices, with OS, hardware, owner and auth state
  - st: kolide_issues
    desc: Failing device checks (issues), such as an unencrypted disk, with the check result and blocking date
  - st: kolide_osquery_result
    desc: Results of scheduled osquery queries from the agent, with device decorations
  - st: kolide_osquery_status
    desc: Status and diagnostic messages of the osquery agent on a device
  - st: kolide_people
    desc: The people roster, with email, usernames and whether they have a registered device
  - st: kolide_request
    desc: Requests from end users, such as exemption requests for a failing check
facts:
  Product: Device-trust and endpoint-compliance service that gates SSO sign-in on device health
  Agent: Osquery-based Kolide agent on macOS, Windows and Linux
  Identity integration: Sits in the SSO flow of the identity provider (for example Okta) and blocks failing devices
  Log transport: HTTPS REST API pulled by a collector, plus a log pipeline that delivers osquery results and status to storage such as S3
  Log format: One JSON object per record
  What an auth event answers: Who tried to sign in, from which IP and browser, with which device, and whether Kolide let them through
  What an issue answers: Which device fails which check, since when, and when it will be blocked
  What an audit event answers: Who changed the Kolide account and what they did
placement:
  slots:
    - cloud
    - endpoint
  items:
    - slot: cloud
      title: Kolide service
      desc: Checks, people, devices and the sign-in gate live in the Kolide SaaS service, wired into the identity provider. Audit, auth, inventory, issue and request records are read from its API.
    - slot: endpoint
      title: Kolide agent
      desc: The agent runs osquery on each enrolled laptop. It reports check results, scheduled query results and its own status, which the log pipeline delivers with device decorations.
howItWorks:
  - title: Checks and issues
    body: Kolide runs checks on each device, such as disk encryption or OS version. A failed check becomes an issue on that device, with the detected value and a date after which the device will be blocked unless it is fixed or exempted.
  - title: Sign-in gate
    body: Kolide sits in the identity provider's sign-in flow. When a person signs in, Kolide identifies the device, looks at its issues and passes or blocks the session. Each attempt is an auth record with result, initial_status and the sub-events of the session, such as the SAML start or an agent download.
  - title: Osquery log pipeline
    body: The agent runs scheduled osquery queries. Results (snapshot or differential) and agent status lines are delivered through Kolide's log pipeline. Kolide adds kolide_decorations naming the device, its owner and the remote IP.
  - title: Inventory and requests
    body: The API lists people, deprovisioned people and devices, and the requests end users raise, such as an exemption for a check they cannot fix now.
traffic:
  handles:
    - SSO sign-in gated on device health
    - Device check results
    - Osquery scheduled queries
    - Admin changes to the account
  flow:
    - step: Agent checks the device
      desc: The agent runs checks and osquery queries on the laptop and reports results to Kolide.
    - step: Person signs in
      desc: The identity provider hands the sign-in to Kolide, which passes or blocks it based on the device's issues.
    - step: Kolide records it
      desc: Kolide stores auth attempts, issues, audit events and inventory, and pushes osquery results through the log pipeline.
    - step: Collector reads JSON
      desc: A collector polls the API or reads the pipeline output. Goatpedia reads each record as JSON.
logs:
  - type: Audit events
    sourcetype: kolide_audit
    format: json
    desc: One object per account action. actor_name and actor_info say who did it and description what was done. This sample is a user accepting an invitation to Kolide. Values are documentation addresses.
    sample: '{"id":"90000001","timestamp":"2026-06-04T19:10:55.090Z","actor_name":"Alice Johnson","description":"user ''user@example.com'' accepted invitation to Kolide","actor_info":{"actor_name":"Alice Johnson","actor_email":"user@example.com","actor_type":"User"}}'
    key:
      - id
      - timestamp
      - actor_name
      - description
  - type: Sign-in attempts
    sourcetype: kolide_auth
    format: json
    desc: One object per device-trust sign-in session. result is the outcome, person_email who signed in, ip_address and browser_name where from, and events the steps of the session. This sample is a failed attempt that started a SAML session and downloaded the Linux agent. Values are documentation addresses.
    sample: '{"id":"id-543149772982012844324275333","timestamp":"2026-06-14T23:49:36.779Z","person_name":"E U","person_email":"user@example.com","person_info":{"identifier":"100001","link":"https://api.kolide.com/people/100001"},"device_info":{"identifier":"","link":null},"result":"Fail","initial_status":"unknown","ip_address":"203.0.113.8","country":"Example Country","city":"Example City","browser_name":"Chrome","browser_user_agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/203.0.113.40 Safari/537.36","issues_displayed":[],"events":[{"timestamp":"2026-06-14T23:49:36.779Z","event_type":"sign_in_attempt","event_description":"SAML session started by user@example.com"},{"timestamp":"2026-06-14T23:49:51.614Z","event_type":"agent_download_request","event_description":"Downloaded package: linux-systemd-deb"}],"session_timestamp":"2026-06-14T23:49:36.914Z","sub_event_type":"sign_in_attempt","sub_event_description":"SAML session started by user@example.com"}'
    key:
      - id
      - timestamp
      - person_name
      - person_email
  - type: Deprovisioned people
    sourcetype: kolide_deprovisioned_person
    format: json
    desc: One object per person removed from the roster. email, created_at and last_authenticated_at say who it was and when they last signed in. Values are documentation addresses.
    sample: '{"id":"861637","name":"Alice Johnson","email":"user@example.com","created_at":"2026-06-04T18:29:22.129Z","last_authenticated_at":"2024-06-15T12:00:00Z","has_registered_device":false,"api_url":"https://api.kolide.com/people/861637"}'
    key:
      - id
      - name
      - email
      - created_at
  - type: Devices
    sourcetype: kolide_device
    format: json
    desc: One object per enrolled device. name, operating_system, serial and auth_state describe it, and registered_owner_info names the owner. This sample is an unregistered Ubuntu device in Good auth state.
    sample: '{"id":"2000001","name":"example-ubuntu-01","registered_at":null,"last_authenticated_at":null,"last_seen_at":"2026-06-14T21:16:58.000Z","registered_owner_info":{"identifier":"","link":null},"operating_system":"Ubuntu 24.04.3 LTS (Noble Numbat)","hardware_model":"ExampleModel9","serial":"Default string","hardware_uuid":"89a1d5c1-2b3e-4f67-8a9b-0c1d2e3f4a5b","note":"Unused asset","auth_state":"Good","will_block_at":null,"product_image_url":"https://assets2.kolide.com/assets/inventory/devices/linux-929081eb.png","auth_configuration":null,"device_type":"Linux","form_factor":"computer"}'
    key:
      - id
      - name
      - registered_at
      - last_authenticated_at
  - type: Device issues
    sourcetype: kolide_issues
    format: json
    desc: One object per failing check on a device. title names the check, value holds what was detected, and exempted, resolved_at and blocks_device_at give its state. This sample is a Linux root filesystem that is not encrypted.
    sample: '{"id":"500000010","issue_key":"check_target","issue_value":"/","title":"Disk Is Not Encrypted","value":{"path":"/","type":"ext4","device":"/dev/nvme0n1p2","de_type":"","check_target":"/","de_encrypted":"No","device_alias":"/dev/nvme0n1p2","de_encryption":"","zfs_encryption":"","check_target_type":"Mountpoint","fscrypt_encrypted":"No","fs_type_encryption":"","fscrypt_encryption":"","KOLIDE_CHECK_STATUS":"FAIL","cryptluks_encryption":""},"exempted":false,"resolved_at":null,"detected_at":"2026-06-14T20:31:58.869Z","blocks_device_at":null,"device_information":{"identifier":"2000001","link":"https://api.kolide.com/devices/2000001"},"check_information":{"identifier":"32","link":"https://api.kolide.com/checks/32"},"last_rechecked_at":"2026-06-14T20:31:58.000Z"}'
    key:
      - id
      - issue_key
      - issue_value
      - title
  - type: Osquery results
    sourcetype: kolide_osquery_result
    format: json
    desc: One object per scheduled query result. name is the query, action snapshot or differential, and snapshot the returned rows. kolide_decorations names the device, owner and remote IP. This sample lists /etc/hosts entries on a Mac. Values are documentation addresses.
    sample: '{"snapshot":[{"address":"192.0.2.10","hostnames":"localhost"},{"address":"192.0.2.20","hostnames":"broadcasthost"}],"action":"snapshot","name":"pack:kolide_log_pipeline:test:etc_hosts","hostIdentifier":"00000000-0000-0000-0000-000000000001","calendarTime":"Tue Jul  7 18:21:44 2026 UTC","unixTime":1783448504,"epoch":1781800669,"counter":0,"numerics":false,"decorations":{"computer_name":"Test User''s MacBook Pro","hardware_model":"Mac16,8","hardware_serial":"TESTSERIAL0001","hardware_vendor":"Apple Inc.","hardware_version":"","hostname":"test-macbook-pro","local_hostname":"test-macbook-pro","uuid":"00000000-0000-0000-0000-000000000001"},"kolide_decorations":{"device_id":9000000,"device_display_name":"test-macbook-pro","remote_ip":"203.0.113.8","serial_number":"TESTSERIAL0001","hardware_uuid":"00000000-0000-0000-0000-000000000001","enrolled_at":"2026-06-18T16:37:49.943Z","device_registered_owner_id":9100000,"device_registered_owner_name":"Test User","device_registered_owner_email":"user@example.com","device_registered_at":"2026-07-02T14:39:42.576Z"},"request_id":"01KWYX2FE5SD1DJ2XMH96V19NT","type":"results_log"}'
    key:
      - snapshot[0].address
      - snapshot[0].hostnames
      - snapshot[1].address
      - snapshot[1].hostnames
  - type: Osquery agent status
    sourcetype: kolide_osquery_status
    format: json
    desc: One object per agent status line. s is the severity, f the source file, i the line and m the message. This sample is the agent refreshing its configuration. Values are documentation addresses.
    sample: '{"s":0,"f":"config.cpp","i":1337,"m":"Refreshing configuration state","h":"00000000-0000-0000-0000-000000000001","c":"Wed Jul  1 06:24:48 2026 UTC","u":1782887088,"kolide_decorations":{"device_id":9000000,"device_display_name":"test-macbook-pro","remote_ip":"203.0.113.40","serial_number":"TESTSERIAL0001","hardware_uuid":"00000000-0000-0000-0000-000000000001","enrolled_at":"2026-06-18T16:37:49.943Z","device_registered_owner_id":9100000,"device_registered_owner_name":"Test User","device_registered_owner_email":"user@example.com","device_registered_at":"2026-06-18T16:38:12.195Z"},"request_id":"01KWE5MJK0MYXQMW1XAB6QG6AP","type":"status_log"}'
    key:
      - s
      - f
      - i
      - m
  - type: People
    sourcetype: kolide_people
    format: json
    desc: One object per person in the roster. name, email, usernames and has_registered_device describe them. Values are documentation addresses.
    sample: '{"id":"861637","name":"Alice Johnson","email":"user@example.com","created_at":"2024-01-10T08:00:00Z","last_authenticated_at":"2024-06-15T12:00:00Z","has_registered_device":true,"usernames":["user@example.com"]}'
    key:
      - id
      - name
      - email
      - created_at
  - type: End-user requests
    sourcetype: kolide_request
    format: json
    desc: One object per request. _kolide_request_type is the kind, status its state and requester_message the reason given. This sample is an open exemption request for an issue on a device. Values are documentation addresses.
    sample: '{"_kolide_request_type":"exemption","id":"exemption-request-001","status":"open","requester_message":"Need temporary access for incident response","requested_at":"2024-03-11T21:28:17Z","device_information":{"identifier":"200001","link":"https://api.example.com/devices/200001"},"requester_information":{"identifier":"100001","link":"https://api.example.com/people/100001"},"issues":[{"identifier":"9999","link":"https://api.example.com/issues/9999"}]}'
    key:
      - _kolide_request_type
      - id
      - status
      - requester_message
cves: []
detections:
  - title: Device-trust sign-in blocked
    severity: medium
    signals:
      - result
      - person_email
      - ip_address
      - sub_event_type
    why: A failed result means Kolide refused the sign-in, because the device is unknown or has a blocking issue. Repeated failures for one person, or failures from an unexpected IP, point at a non-compliant or unregistered device trying to reach company apps.
    kql: |
      dataset="kolide_logs"
      | where sourcetype == "kolide_auth" and result == "Fail"
      | project timestamp, person_email, ip_address, country, browser_name, sub_event_description
  - title: Exemption requested for a failing check
    severity: low
    signals:
      - _kolide_request_type
      - status
      - requester_message
    why: An exemption lets a device keep signing in while a check still fails. Open exemption requests are the admin decisions that weaken device policy.
    kql: |
      dataset="kolide_logs"
      | where sourcetype == "kolide_request" and _kolide_request_type == "exemption" and status == "open"
      | project requested_at, id, requester_message
optimizations: []
references: []
