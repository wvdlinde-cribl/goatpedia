summary: A network threat-prevention appliance that inspects traffic at the internet edge and detonates suspicious objects in its MVX virtual-execution engine to find exploits, malware downloads and callbacks. FireEye NX is now sold as Trellix Network Security. Besides alerts, the appliance can emit network metadata about flows it observed; in these records the original event is kept as rawmsg next to collector metadata such as the reporting device and source address.
sourcetypes:
  - st: fireeye_nx
    desc: Events from a FireEye NX appliance, with the original event in rawmsg (such as a flow record with addresses, ports and event type) and collector metadata
facts:
  Product: Network threat detection and prevention with virtual-execution sandboxing
  Form factor: Physical or virtual appliance inline or on a SPAN/TAP at the network edge
  Log transport: Syslog, or a log forwarder that wraps each appliance event with its own metadata
  Log format: JSON. rawmsg holds the appliance's event (here a JSON flow record); meta_sip4, deviceid and meta_cbname describe where it came from
  What an event answers: Which flow or alert the appliance reported, between which addresses and ports, and from which appliance
placement:
  slots:
    - edge
  items:
    - slot: edge
      title: NX appliance
      desc: The appliance sits at the internet edge, inline or on a mirror port, and inspects web and other outbound traffic. It sends events to a log receiver.
howItWorks:
  - title: Inspection and detonation
    body: The appliance matches traffic against signatures and intelligence and sends suspicious objects, such as downloaded files and URLs, to its MVX engine, which runs them in virtual machines to see whether they exploit or infect.
  - title: Alerts and metadata
    body: Confirmed attacks become alerts (malware object, web infection, callback). The appliance can also record network metadata such as flows, with source and destination addresses and ports and an event type.
  - title: How the events leave the appliance
    body: Events go out as syslog or through a forwarder. In these samples a forwarder has wrapped each event, keeping the original text as rawmsg and adding the source address, length and device id. Any receiver can take them.
traffic:
  handles:
    - Web and outbound traffic at the internet edge
    - File downloads and URLs for sandbox analysis
    - Malware callbacks
  flow:
    - step: Traffic inspected
      desc: Traffic passes the appliance, inline or on a mirror port.
    - step: Analysis
      desc: The appliance records flow metadata and detonates suspicious objects.
    - step: Event emitted
      desc: The appliance sends a flow record or alert.
    - step: Forwarder wraps it
      desc: A log forwarder keeps the original as rawmsg, adds its metadata and sends it on.
logs:
  - type: NX events
    sourcetype: fireeye_nx
    format: json
    desc: One object per event. rawmsg is the original appliance event, here a flow record with event_type flow, src_ip, src_port and dest_ip. meta_sip4 is the address of the sender, deviceid and meta_cbname identify the appliance, and meta_oml is the message length. Addresses are documentation addresses.
    sample: '{"rawmsg":"{\"timestamp\":\"2020-09-22T08:34:44.991339+0000\",\"flow_id\":721570461162990,\"event_type\":\"flow\",\"src_ip\":\"2001:db8::1\",\"src_port\":45944,\"dest_ip\":\"2001:db8::1\",...","meta_sip4":"192.0.2.20","meta_oml":520,"deviceid":"860665216674","meta_cbname":"fireeye-7e0de1"}'
    key:
      - rawmsg
      - meta_sip4
      - meta_oml
      - deviceid
