id: sentinel-one-cloud-funnel
name: SentinelOne Cloud Funnel
short: S1 Funnel
vendor: SentinelOne
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Cloud Funnel
  - Singularity Cloud Funnel
  - SentinelOne Deep Visibility telemetry
tags:
  - edr
  - endpoint-telemetry
  - xdr
  - process
summary: The telemetry export of the SentinelOne Singularity platform. SentinelOne agents on endpoints record process, file, network, DNS, registry and login activity, and Cloud Funnel streams that raw telemetry from the SentinelOne cloud into a customer-owned cloud storage bucket. Each event describes one action by one process, with the process tree, image hashes, signer, user and the behavioural indicator counters the agent keeps for each process.
sourcetypes:
  - st: sentinel_one_cloud_funnel
    desc: Raw endpoint telemetry from SentinelOne agents, one event per process action (DNS, process, file, network, registry and more), with process lineage and indicator counters
facts:
  Product: Export of SentinelOne EDR telemetry to customer cloud storage
  Clients: SentinelOne agents on Windows, macOS, Linux and Kubernetes workloads
  Log transport: SentinelOne writes compressed files to an Amazon S3 bucket the customer owns. A collector reads new objects from the bucket
  Log format: One JSON object per event with flat dotted keys such as src.process.name and event.category
  Event categories: event.category names the kind of action, such as dns, process, file, ip, registry, logins, indicators
  What an event answers: Which process did what, which parent started it, what its hashes and signer were, and under which user
  What indicator counters answer: How many persistence, injection, ransomware and reconnaissance behaviours the agent has seen from that process so far
placement:
  slots:
    - endpoint
    - cloud
  items:
    - slot: endpoint
      title: SentinelOne agent
      desc: The agent on each endpoint observes process activity and sends it to the SentinelOne cloud. The action happens here.
    - slot: cloud
      title: Cloud Funnel bucket
      desc: The SentinelOne management console streams the telemetry into an S3 bucket owned by the customer. Any collector with read access to that bucket can pick the files up.
howItWorks:
  - title: Storylines
    body: The agent groups related activity into a storyline, a tree of processes descended from one root. Each event carries the source process (src.process) and its parent (src.process.parent), and flags whether the parent is the storyline root.
  - title: What one event holds
    body: event.category says what kind of action happened. The src.process fields describe the acting process — name, image hashes, signer, user, module count and how many files it created. osSrc.process describes the operating system process seen by the agent.
  - title: Indicator counters
    body: The agent counts behaviours per process — indicatorPersistenceCount, indicatorInjectionCount, indicatorRansomwareCount, indicatorReconnaissanceCount and others. A non-zero counter means the agent has already matched that behaviour for the process.
  - title: How the data leaves the product
    body: Cloud Funnel is enabled in the SentinelOne console with a target bucket and an optional query filter. SentinelOne writes the telemetry into that bucket. The collector that reads the bucket chooses the destination.
traffic:
  handles:
    - Process creation and lineage
    - DNS, network, file and registry activity
    - Behavioural indicators on endpoints
  flow:
    - step: Process acts
      desc: A process on an endpoint makes a DNS request, writes a file, opens a connection or starts a child.
    - step: Agent records it
      desc: The SentinelOne agent attaches the process, parent, hashes, user and indicator counters and sends the event to the SentinelOne cloud.
    - step: Cloud Funnel exports it
      desc: SentinelOne writes the event into the customer's S3 bucket as part of a compressed file.
    - step: Collector reads
      desc: A collector reads new objects from the bucket. Goatpedia reads each event as JSON.
logs:
  - type: Endpoint telemetry
    sourcetype: sentinel_one_cloud_funnel
    format: json
    desc: One action by one process. event.category is the kind of action (this sample is dns). src.process.parent.name, src.process.user and the image hashes say who acted. The indicator counters such as src.process.indicatorRansomwareCount and src.process.indicatorInjectionCount are zero here.
    sample: '{"timestamp":"18:32:29.495","src.process.parent.isStorylineRoot":true,"event.category":"dns","src.process.parent.image.sha1":"f9bc4c756eab5121ace7ec1cf6a394be0439dec0","site.id":"123456789123456789","osSrc.process.isRedirectCmdProcessor":false,"src.process.image.binaryIsExecutable":true,"src.process.parent.displayName":"VIERO-RMSLaunchBar","osSrc.process.image.md5":"f905359ab27db1dda964d77442735cb8","osSrc.process.crossProcessOpenProcessCount":0,"osSrc.process.publisher":"MICROSOFTWINDOWSPUBLISHER","osSrc.process.crossProcessDupThreadHandleCount":0,"src.process.user":"asdf\\SYSTEM","osSrc.process.indicatorPersistenceCount":0,"src.process.parent.subsystem":"SYS_WIN32","src.process.indicatorRansomwareCount":0,"src.process.crossProcessDupRemoteProcessHandleCount":0,"osSrc.process.crossProcessOutOfStorylineCount":0,"osSrc.process.image.sha1":"bfacfa096a56e3d149634e15e1b6470ff5a03957","src.process.tgtFileCreationCount":6,"osSrc.process.childProcCount":0,"src.process.indicatorInjectionCount":0,"osSrc.process.indicatorReconnaissanceCount":0,"src.process.moduleCount":251,"src.process.parent.name":"VIERO.exe","i.version":"preprocess-lib-1.0","osSrc.process.signedStatus":"signed","sca:atlantisIngestTime":1664811166298,"src.process.image.md5":"421f6d5ec86f6b930646321fc6ed2c46","src.process.indicatorReconnaissanceCount":0}'
    key:
      - timestamp
      - src.process.parent.isStorylineRoot
      - event.category
      - src.process.parent.image.sha1
cves: []
detections:
  - title: Process with ransomware or injection indicators
    severity: high
    signals:
      - src.process.indicatorRansomwareCount
      - src.process.indicatorInjectionCount
      - src.process.parent.name
      - src.process.user
    why: The agent increments these counters when it sees ransomware-like file activity or code injection from a process. Any event from a process with a non-zero counter belongs to a storyline worth opening.
    kql: |
      dataset="sentinel-one-cloud-funnel_logs"
      | where sourcetype == "sentinel_one_cloud_funnel" and (src.process.indicatorRansomwareCount > 0 or src.process.indicatorInjectionCount > 0)
      | project timestamp, event.category, src.process.parent.name, src.process.user, src.process.image.sha1
    mitre:
      - T1486
      - T1055
optimizations:
  - title: Keep indicator-bearing events in the SIEM
    saving: most of the telemetry volume
    fn: Routes
    how: Cloud Funnel exports every process action, which is far more than a SIEM needs for alerting. Route events from processes with non-zero indicator counters to the SIEM in full and send the rest to low-cost storage for hunting.
    expr: src.process.indicatorRansomwareCount > 0 || src.process.indicatorInjectionCount > 0 || src.process.indicatorReconnaissanceCount > 0
    stream:
      routes:
        - name: Cloud Funnel events with indicators → SIEM
          filter: /"src\.process\.indicator(Ransomware|Injection|Reconnaissance)Count":[1-9]/.test(_raw)
          to: The SIEM, full fidelity
          final: true
        - name: Cloud Funnel other telemetry → low-cost storage
          filter: /"event\.category":"/.test(_raw)
          to: Cribl Lake or object storage for hunting; replay on demand
          final: true
      note: Routes see the raw event, so they match non-zero indicator counters inside the JSON text. Put the SIEM route first.
