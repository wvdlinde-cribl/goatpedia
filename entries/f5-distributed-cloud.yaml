howItWorks:
  - title: What the fixture shows
    body: F5 Distributed Cloud events in this library are the test fixtures shipped with DataDog/integrations-extras (68a7a16c1a). The first event carries country, kubernetes.container_name, kubernetes.host, kubernetes.pod_id, kubernetes.labels.app, kubernetes.namespace_name. Values in the sample were rewritten to documentation addresses.
