placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Sidekiq events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads sidekiq and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as text.
logs:
  - type: Sidekiq
    sourcetype: sidekiq
    format: text
    desc: 5 fixture events in the samples pool (logtest).
    sample: '2012-03-02T19:40:45Z 32515 TID-oveahmcxw INFO: HardWorker JID-oveaivtrg start'
    pattern: (?<message>[\s\S]+)
    key:
      - message
