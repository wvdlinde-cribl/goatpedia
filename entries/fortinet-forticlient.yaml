id: fortinet-forticlient
name: FortiClient
short: FortiClient
vendor: Fortinet
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Fortinet FortiClient
  - FortiClient EMS
tags:
  - endpoint
  - vpn
  - ztna
  - web-filter
  - kv
summary: Fortinet's endpoint agent, combining VPN and ZTNA access, endpoint protection, web filtering and application firewall. It is managed by FortiClient EMS and reports to FortiAnalyzer or a syslog receiver. Its logs record traffic the endpoint allowed or blocked, with the application, user, addresses and ports involved.
sourcetypes:
  - st: fortinet_forticlient
    desc: FortiClient endpoint logs in key=value form, such as traffic allowed or denied by its firewall, web filter or application control
facts:
  Product: Endpoint agent for VPN/ZTNA, endpoint protection, web filtering and application firewall
  Clients: Windows, macOS, Linux, iOS and Android
  Account plane: FortiClient EMS for policy and management; FortiAnalyzer or syslog for logs
  Log transport: Syslog or upload to FortiAnalyzer, forwarded on to any receiver
  Log format: Syslog header followed by key=value pairs
  What a traffic event answers: Which application and user on the endpoint tried to reach which address and port, over which protocol and service, and whether it was allowed or denied
placement:
  slots:
    - endpoint
    - remote
  items:
    - slot: endpoint
      title: FortiClient agent
      desc: The agent on laptops, desktops and phones enforces web filter, application firewall and protection policies from EMS, and writes a log entry for each decision.
    - slot: remote
      title: Remote users
      desc: For remote users FortiClient provides the VPN or ZTNA connection into the network, so its logs cover endpoints outside the office.
howItWorks:
  - title: Policy from EMS
    body: FortiClient EMS pushes profiles to endpoints, including web filter categories, application firewall rules, VPN and ZTNA settings and protection options.
  - title: Decisions on the endpoint
    body: When an application on the endpoint opens a connection or a web request, FortiClient applies the profile and records the outcome with the protocol, service, source and destination, the application name and process id, the direction and the logged-on user.
  - title: How the logs leave the endpoint
    body: FortiClient uploads logs to FortiAnalyzer or sends them to a syslog server set in the profile. Either can forward them to any collector.
traffic:
  handles:
    - Outbound connections from endpoint applications
    - Web requests checked against web filter categories
    - VPN and ZTNA connections
  flow:
    - step: Application connects
      desc: An application on the endpoint opens a connection or web request.
    - step: FortiClient decides
      desc: The agent applies the EMS profile and allows or denies it.
    - step: Log entry written
      desc: The decision is logged with the application, user, addresses, ports and status.
    - step: Forwarded
      desc: The log is sent to FortiAnalyzer or a syslog receiver.
logs:
  - type: Endpoint traffic log
    sourcetype: fortinet_forticlient
    format: kv
    desc: One line per decision. status is deny, proto and service are udp and http, src/dst and src_port/dst_port the connection, app_name and pid the application, traff_direct the direction, logon_user the user and block_count how many times it was blocked. Addresses are documentation addresses and host names use the reserved .invalid domain.
    sample: January 29 06:09:59 boNemoe4402.www.invalid proto=udp service=http status=deny src=203.0.113.8 dst=203.0.113.40 src_port=7178 dst_port=3994 server_app=reeufugi pid=7880 app_name=enderitq traff_direct=external block_count=5286 logon_user=user@example.com msg=failure
    key:
      - proto
      - service
      - status
      - src
cves: []
detections:
  - title: Endpoint traffic denied
    severity: low
    signals:
      - status
      - app_name
      - dst
      - logon_user
    why: A deny means the endpoint profile stopped an application from connecting. Many denies for one application, or denies to the same destination across endpoints, point to unwanted software or malware trying to call out.
    kql: |
      dataset="fortinet-forticlient_logs"
      | where sourcetype == "fortinet_forticlient" and status == "deny"
      | project _time, logon_user, app_name, pid, src, dst, dst_port, proto, service, block_count
    mitre:
      - T1071
optimizations: []
references:
  - title: FortiClient documentation
    url: https://docs.fortinet.com/product/forticlient
related:
  - fortiedr
  - fortigate
