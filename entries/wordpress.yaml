id: wordpress
name: WordPress Activity Log
short: WordPress
aka:
  - WP Activity Log
  - WP Security Audit Log (WSAL)
  - Melapress WP Activity Log
  - wp_wsal_occurrences
vendor: WordPress (Automattic)
category: web
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - web
