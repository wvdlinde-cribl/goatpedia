    body: Appomni events in this library are the test fixtures shipped with DataDog/integrations-extras (68a7a16c1a). The first event carries @timestamp, appomni.alert.channel, appomni.organization.id, appomni.event.sortable_event_id, appomni.event.sortable_ingest_id, appomni.event.id. Values in the sample were rewritten to documentation addresses.
