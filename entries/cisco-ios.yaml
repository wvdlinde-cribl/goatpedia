id: cisco-ios
name: Cisco IOS / IOS XE
short: Cisco IOS
aka:
  - Cisco IOS
  - Cisco IOS XE
  - Catalyst switches
  - ISR / ASR routers
  - Catalyst 8000 / 9000
vendor: Cisco
category: netinfra
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - router
