id: vmware-esxi
name: VMware ESXi & vCenter
short: ESXi
aka:
  - vSphere
  - ESXi
  - vCenter Server
  - VCSA
  - VMware Cloud Foundation
vendor: Broadcom (VMware)
category: os
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - hypervisor
