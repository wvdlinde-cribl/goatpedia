id: nginx-ingress-controller
name: Nginx Ingress Controller
short: Controller
vendor: Nginx
category: web
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - nginx_ingress_controller
  - Datadog integrations-core
tags:
  - logtest
