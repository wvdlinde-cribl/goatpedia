summary: Security service edge platform built around a cloud proxy that decodes SaaS and web traffic down to the app instance and activity (upload, share, login, delete). Inline CASB, secure web gateway, DLP, threat protection, cloud firewall and private access (NPA) share one policy engine, plus API-based scanning of sanctioned SaaS. Logs are rich JSON events and alerts pulled over the REST API v2 iterator, or web transactions streamed as CSV/W3C to object storage.
sourcetypes:
  - st: netskope_event_json
    desc: Events from the REST API v2 dataexport endpoints — page, application, network, audit, infrastructure, incident, endpoint
  - st: netskope_alert_json
    desc: Alerts from the REST API v2 dataexport endpoints — DLP, malware, malsite, policy, UBA, compromised credential, CTEP, watchlist, quarantine, remediation, security assessment
  - st: NetskopeAlerts_CL
    desc: Microsoft Sentinel table populated by the Netskope v2 (REST API CCP) connector
  - st: NetskopeEventsDLP_CL
    desc: Microsoft Sentinel table for Netskope DLP incident events
  - st: NetskopeWebTransactions_CL
    desc: Microsoft Sentinel table for Log Streaming web transactions
  - st: netskope
    desc: 'Elastic integrations fixture, 17 events. Upstream: netskope/data_stream/events/_dev/test/pipeline/test-events.log'
  - st: netskope_alerts
    desc: 'Elastic integrations fixture, 10 events. Upstream: netskope/data_stream/alerts/_dev/test/pipeline/test-alerts.log'
  - st: netskope_alerts_events_v2
    desc: 'Elastic integrations fixture, 5 events. Upstream: netskope/data_stream/alerts_events_v2/_dev/test/pipeline/test-combined.log'
  - st: netskope_transaction
    desc: 'Elastic integrations fixture, 4 events. Upstream: netskope/data_stream/transaction/_dev/test/pipeline/test-transaction.log'
facts:
  First released: 2013 (CASB); platform rebranded Netskope One in 2023
  Delivery model: SaaS on Netskope's NewEdge private security cloud
  Traffic steering: Netskope Client (tunnel), GRE / IPsec, explicit proxy / PAC, reverse proxy, API connectors for SaaS
  Policy engines: Inline CASB, Next Gen SWG, DLP, Threat Protection / sandbox, Cloud Firewall, NPA (ZTNA), RBI
  Log transport: REST API v2 dataexport iterator (pull, ≤10,000 records per page); Log Streaming to S3 / GCS / Azure Blob; Cloud Exchange Log Shipper (syslog CEF)
  Log format: JSON (API events/alerts); CSV or W3C extended (web transactions)
  Event types: page, application, network, audit, infrastructure, incident, endpoint, client status
  Typical volume: Page + web transactions dominate; alerts are a small fraction
  Cribl Pack: Netskope Events and Alerts (cc-netskope-events-and-alerts, Packs Dispensary)
placement:
  slots:
    - cloud
    - remote
    - endpoint
    - edge
  items:
    - slot: cloud
      title: NewEdge POPs
      desc: The proxy, DLP and threat engines run in Netskope's data centers. API-mode CASB also scans sanctioned SaaS (M365, Google Workspace, Box) at rest.
    - slot: remote
      title: Roaming users
      desc: Netskope Client steers web and SaaS traffic (and private-app traffic for NPA) to the nearest POP wherever the user is.
    - slot: endpoint
      title: Netskope Client
      desc: Agent on Windows, macOS, Linux and mobile. Enrolls the user/device, enforces steering and endpoint DLP — and is where the product's CVEs live.
    - slot: edge
      title: Branch tunnels
      desc: GRE/IPsec from the branch firewall or SD-WAN sends office traffic to Netskope without an agent; access_method becomes GRE or IPSec.
howItWorks:
  - title: Cloud proxy with app decoding
    body: Traffic is decrypted at the POP and parsed by app-specific connectors that understand thousands of SaaS and web apps. Instead of "POST to a URL" Netskope records app, instance (corporate vs personal tenant), activity (Upload, Share, Login Attempt, Delete) and object — the fields that make application events and alerts precise.
  - title: Cloud Confidence Index
    body: Every app carries a CCI score and level (ccl = poor / low / medium / high / excellent) from Netskope's risk rating of the vendor. Policies commonly coach or block uploads to apps with ccl low or poor, and the fields travel in every event.
  - title: DLP
    body: Content inspection with predefined and custom profiles, fingerprinting, exact data match and ML classifiers runs on uploads, posts and API-scanned files. A match raises a DLP alert carrying profile, rule, severity, file metadata and an incident id for forensics.
  - title: Threat Protection
    body: Downloads and cloud-stored files are scanned by AV engines, ML, and a sandbox; hits raise malware alerts. Malsite alerts flag visits to known malicious or phishing domains, CTEP alerts flag IPS-style signatures on cloud firewall traffic.
  - title: User behaviour analytics
    body: UBA models per-user activity (bulk downloads, unusual locations, rare apps) and emits UBA alerts with a user confidence index, while compromised-credential alerts flag corporate accounts seen in breach data.
  - title: Getting the logs out
    body: The REST API v2 iterator endpoints track a consumer-owned index per endpoint; you request operation=next and honour the wait_time in the response. Log Streaming pushes web transactions (fields chosen per stream) to object storage. Running two consumers on the same index loses data.
traffic:
  handles:
    - HTTP / HTTPS web traffic (TLS decryption)
    - SaaS apps decoded to instance and activity
    - Cloud storage uploads, downloads and shares (inline + API)
    - Non-web TCP/UDP via Cloud Firewall
    - Private apps via NPA (ZTNA)
    - Email in sanctioned SaaS (API DLP)
  flow:
    - step: Steer
      desc: Netskope Client, GRE/IPsec or proxy sends the request to the nearest NewEdge POP.
    - step: Identify
      desc: User from client enrollment / SAML; device classification and posture attached.
    - step: Decrypt & decode
      desc: TLS decrypted unless bypassed; app connector identifies app, instance and activity.
    - step: Inspect
      desc: Real-time policy, DLP, threat protection and CCI checks.
    - step: Enforce
      desc: Allow, block, coach (user justification) or isolate.
    - step: Log
      desc: Page / application event written; alerts raised for DLP, malware and policy hits; available via API and Log Streaming.
