cves:
  - id: CVE-2024-7401
    cvss: 7.5
    year: 2024
    kev: false
    scope: device
    title: Netskope Client enrollment bypass — static OrgKey lets anyone with the key enroll a client as any user
    affected: Tenants without Secure Enrollment enforced (not tied to a client version)
    fixed: Enable Secure Enrollment and enforce enrollment tokens (default for new tenants from release 123.0.0)
    detect: Client enrollment / client status events for a user from a device, hostname or country never seen before; the same user enrolled on several devices in a short time; activity for users who are on leave or disabled.
    avoid: Enforce Secure Enrollment tokens; use IdP enrollment with MFA; enable device classification and block unclassified devices.
  - id: CVE-2023-2270
    cvss: 7.8
    year: 2023
    kev: false
    scope: device
    title: Netskope Client for Windows local privilege escalation — SYSTEM service unzips config to a relative path
    affected: Netskope Client for Windows v99 and earlier
    fixed: v100 and later
    detect: Client status / endpoint events showing client versions ≤ 99; on the host, EDR sees files written by a standard user into the client's protected directories.
    avoid: Upgrade the client; follow Netskope client hardening (tamper protection, password-protected uninstall).
  - id: CVE-2025-0309
    cvss: 6.0
    year: 2025
    kev: false
    scope: device
    title: Netskope Client local privilege escalation by forcing enrollment to a rogue server
    affected: Netskope Client R128 and earlier
    fixed: R129 and later
    detect: Endpoint/proxy logs showing the client contacting enrollment paths (/v1/externalhost?service=enrollment, /v2/checkupdate) on hosts outside *.goskope.com; a new trusted root CA installed on the device.
    avoid: Upgrade to R129+; restrict client connections to goskope.com; monitor for unexpected root CA installation and MSI installs by the Netskope service.
  - id: CVE-2025-24054
    cvss: 5.4
    year: 2025
    kev: true
    scope: traffic
    title: Windows NTLM hash disclosure via .library-ms files — delivered through web and cloud-storage downloads
    affected: Windows 10, 11 and Server releases before the March 2025 updates
    fixed: Microsoft March 2025 security updates
    detect: Application / page events downloading ZIP or .library-ms objects from file-sharing apps, followed by network events with outbound SMB (dstport 445) to an internet IP from the same user.
    avoid: Patch Windows; block .library-ms downloads by file type; block outbound SMB in Cloud Firewall policy.
  - id: CVE-2024-38213
    cvss: 6.5
    year: 2024
    kev: true
    scope: traffic
    title: Windows Mark-of-the-Web bypass ("Copy2Pwn") via WebDAV — malware delivery that Netskope's SWG inspects
    affected: Windows 10, 11 and Server releases before the June 2024 updates
    fixed: Microsoft June 2024 security updates (disclosed August 2024)
    detect: Page events with WebDAV access to uncategorized or newly registered domains, followed by malware alerts or executable downloads for the same user.
    avoid: Patch Windows; block WebDAV to uncategorized destinations; keep Threat Protection set to block with sandboxing for executables and archives.
detections:
  - title: Upload of sensitive data to a personal or low-CCI app instance
    severity: high
    signals:
      - alert_type=DLP
      - activity=Upload
      - instance personal or ccl low/poor
    why: The classic exfiltration path — corporate data copied to a personal Drive/Dropbox or a throwaway file-transfer site.
    kql: |-
      dataset="netskope_logs" alert_type="DLP" activity="Upload"
      | where ccl in ("low","poor") or instance_id == "personal"
      | summarize alerts=count(), files=dcount(object), profiles=make_set(dlp_profile) by user, app, bin(_time, 1h)
    mitre:
      - T1567.002
      - T1048
  - title: Bulk download from corporate SaaS followed by upload elsewhere
    severity: high
    signals:
      - activity=Download count high on a corporate instance
      - activity=Upload to another app within 1h
    why: Departing-employee and insider exfiltration look like this; UBA may alert too, but correlating the two activities makes it actionable.
    kql: |-
      dataset="netskope_logs" type="nspolicy" activity in ("Download","Upload")
      | summarize downloads=countif(activity == "Download"), uploads=countif(activity == "Upload"), apps=make_set(app) by user, bin(_time, 1h)
      | where downloads > 200 and uploads > 20
    mitre:
      - T1530
      - T1567.002
  - title: Malware allowed or only alerted
    severity: high
    signals:
      - alert_type=Malware
      - action=alert or allow
    why: A detection that did not block means the file reached the endpoint. Pivot to EDR on the hostname and hash.
    kql: |-
      dataset="netskope_logs" alert_type="Malware"
      | where action != "block"
      | summarize count() by user, malware_name, malware_severity, sha256, app
    mitre:
      - T1204.002
      - T1105
  - title: One user active from many devices or countries
    severity: medium
    signals:
      - application events
      - hostname count per user > 3 in 24h
      - more than one src_country
    why: Enrollment abuse (CVE-2024-7401 class) or a stolen session gives an outsider a policy-trusted identity in the tenant. New devices and countries per user should be rare.
    kql: |-
      dataset="netskope_logs" type="nspolicy"
      | summarize devices=dcount(hostname), countries=dcount(src_country), list=make_set(src_country) by user, bin(_time, 24h)
      | where devices > 3 or countries > 1
    mitre:
      - T1078
      - T1098
  - title: Traffic bypassing inspection
    severity: low
    signals:
      - type=connection
      - bypass_traffic=yes
    why: Steering exceptions and certificate-pinned apps are legitimate, but new bypassed domains are blind spots and sometimes deliberate evasion.
    kql: |-
      dataset="netskope_logs" type="connection" bypass_traffic="yes"
      | summarize users=dcount(user), bytes=sum(server_bytes) by domain, bypass_reason
      | sort by users desc
    mitre:
      - T1090
optimizations:
  - title: Strip geo, empty and default-value fields
    saving: 40–60 %
    fn: Parser → Serialize
    how: API events carry dozens of geo fields (lat/long/zip/timezone for both ends) and many empty strings, zeros and empty lists. Remove them and keep src_country/dst_country. This is what the Netskope Pack's reduction does.
    expr: "remove: *_latitude, *_longitude, *_zipcode, *_timezone, *_region; drop '', 0, [] values"
  - title: Route page events to Lake
    saving: 30–50 % SIEM licence
    fn: Routes
    how: Page / connection events are high-volume web history. Send them to Cribl Lake and keep application events, alerts, audit and network events in the SIEM.
    expr: type=='connection' → Lake ; alert=='yes' || type!='connection' → SIEM
  - title: Aggregate allowed CDN and telemetry page events
    saving: 10–20 %
    fn: Aggregations
    how: Content-delivery, software-update and analytics domains generate repetitive page events. Roll up bytes and counts per user, domain and category per 5 minutes.
    expr: type=='connection' && ['Content Delivery','Software Updates','Web Analytics'].includes(category)
  - title: Suppress duplicate alerts
    saving: 5–10 %
    fn: Suppress
    how: The same DLP or policy alert can fire for every retry of the same upload. Keep one per user, policy and object per 10 minutes.
    expr: "key: `${user}:${policy}:${object}`  allow 1 / 600s  when alert=='yes'"
