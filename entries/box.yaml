summary: Box is logged by the Datadog integrations-core package box. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: box
    desc: 'Datadog integrations-core fixture, 4 events. Upstream: box/assets/logs/box_tests.yaml'
facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: box
  Sourcetypes: '1'
  Fixture events: '4'
  Log format seen: json
  Fields in the first fixture: event_id, event_type, additional_details.shield_alert.rule_id, additional_details.shield_alert.rule_name, additional_details.shield_alert.risk_score, additional_details.shield_alert.rule_category
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Box events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries event_id, event_type, additional_details.shield_alert.rule_id, additional_details.shield_alert.rule_name, additional_details.shield_alert.risk_score, additional_details.shield_alert.rule_category. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads box and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
