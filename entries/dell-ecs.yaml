id: dell-ecs
name: Dell ECS (Elastic Cloud Storage)
short: Dell ECS
aka:
  - ECS
  - Elastic Cloud Storage
  - Dell EMC ECS
  - EMC ECS
  - ObjectScale
vendor: Dell
category: storage
status: full
updated: "2026-11-15"
