    body: Beelzebub events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries event.DateTime, event.RemoteAddr, event.Protocol, event.Command, event.CommandOutput, event.Status. Values in the sample were rewritten to documentation addresses.
