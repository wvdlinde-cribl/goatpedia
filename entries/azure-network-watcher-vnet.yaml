id: azure-network-watcher-vnet
name: Azure Network Watcher virtual network flow logs
short: VNet Flow Logs
vendor: Microsoft
category: cloud
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - VNet flow logs
  - Virtual network flow logs
tags:
  - azure
  - flow-logs
  - network
  - json
summary: Virtual network flow logs are an Azure Network Watcher feature that records the IP traffic through an Azure virtual network, subnet or network interface. They succeed NSG flow logs and capture flows whether a network security group, an Azure Virtual Network Manager admin rule or nothing at all decided them, and they mark whether the traffic was encrypted. The logs show which workloads talked to which addresses, on which ports, how much data moved and which rule allowed or blocked it.
sourcetypes:
  - st: azure_network_watcher_vnet
    desc: Virtual network flow log records (FlowLogFlowEvent), grouped by access control list and rule, each holding flow tuples with addresses, ports, protocol, direction, flow state, encryption state and byte counts
facts:
  Product: Flow logging for Azure virtual networks, subnets and network interfaces, part of Azure Network Watcher
  Scope: Enabled on a virtual network, subnet or NIC (targetResourceID). flowLogResourceID names the flow log resource in Network Watcher
  Log transport: Written as JSON blobs to an Azure storage account (insights-logs-flowlogflowevent container), from where a collector reads them. Traffic Analytics can also process them
  Log format: JSON. One record per interval with flowRecords.flows grouped by aclID, then by rule, then comma-separated flowTuples
  Flow tuple: Time in milliseconds, source IP, destination IP, source port, destination port, protocol number, direction (I or O), flow state (B begin, C continuing, E end, D denied), encryption (X encrypted, NX not encrypted and similar codes), then packets and bytes in each direction
  What a record answers: Which flows crossed the virtual network, under which rule, whether they were denied or encrypted, and how much data each one carried
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Virtual network
      desc: The flow log is attached to an Azure virtual network, a subnet or a network interface. Network Watcher in the same region observes the traffic of every workload in that scope and writes the records to a storage account.
howItWorks:
  - title: Scope and rules
    body: A virtual network flow log covers the target resource named in targetResourceID. Flows are grouped by the access control list that evaluated them (aclID) and the rule that matched, such as DefaultRule_AllowInternetOutBound. Traffic that no security rule touched is still logged.
  - title: Flow tuples
    body: Each flowTuples string is one flow observation. The state shows its life cycle, B when it begins, C while it continues, E when it ends and D when it is denied. The encryption field shows whether the flow ran over Azure virtual network encryption. Continuing and end tuples carry packet and byte counts.
  - title: How the logs leave Azure
    body: Network Watcher writes the records as JSON blobs to a storage account, one blob per hour, appended every few minutes. A collector reads the blobs, usually prompted by blob-created notifications through an event hub or queue. The destination is a choice of the pipeline, not a property of the virtual network.
traffic:
  handles:
    - Inbound and outbound IP flows in an Azure virtual network
    - TCP, UDP and other IP protocols
    - Allow and deny decisions of NSG and admin rules
    - Virtual network encryption state
  flow:
    - step: Workload sends traffic
      desc: A VM, container or other resource in the virtual network opens or receives a connection.
    - step: Flow is observed
      desc: The Azure host records the flow with the rule that applied, its state, its encryption and its counters.
    - step: Network Watcher writes it
      desc: The flow is added as a tuple under its ACL and rule and appended to the hourly blob in the storage account.
    - step: Collector reads the blob
      desc: A collector picks up the new blob content and splits it into JSON records.
logs:
  - type: Virtual network flow record
    sourcetype: azure_network_watcher_vnet
    format: json
    desc: One record per interval for one flow log. targetResourceID is the monitored virtual network, flowLogVersion is the schema version and flowRecords.flows holds the tuples. This sample has two outbound TCP 443 flows under DefaultRule_AllowInternetOutBound, one beginning and one ending, neither encrypted (NX). The end tuple carries packet and byte counts. The sample uses documentation addresses.
    sample: '{"time":"2022-09-14T09:00:52.5625085Z","flowLogVersion":4,"flowLogGUID":"abcdef01-2345-6789-0abc-def012345678","macAddress":"0022487bC205","category":"FlowLogFlowEvent","flowLogResourceID":"/SUBSCRIPTIONS/00000000-0000-0000-0000-000000000000/RESOURCEGROUPS/NETWORKWATCHERRG/PROVIDERS/MICROSOFT.NETWORK/NETWORKWATCHERS/NETWORKWATCHER_EASTUS2EUAP/FL...","targetResourceID":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myResourceGroup/providers/Microsoft.Network/virtualNetworks/myVNet","operationName":"FlowLogFlowEvent","flowRecords":{"flows":[{"aclID":"00000000-1234-abcd-ef00-c1c2c3c4c5c6","flowGroups":[{"rule":"DefaultRule_AllowInternetOutBound","flowTuples":["1663146003599,192.0.2.20,198.51.100.15,23956,443,6,O,B,NX,0,0,0,0","1663146003606,198.51.100.25,203.0.113.8,36776,443,6,O,E,NX,22,2217,33,0"]}]}]}}'
    key:
      - time
      - flowLogVersion
      - flowLogGUID
      - macAddress
cves: []
detections: []
optimizations:
  - title: Summarise allowed flows, keep denies in full
    saving: most of the flow log volume
    fn: Aggregations
    how: Begin and continuing tuples for allowed traffic make up most records. Split the tuples into one event per flow, keep denied (D) flows and end tuples in full, and aggregate the rest to counts per source, destination and port before the SIEM.
references:
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
