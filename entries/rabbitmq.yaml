# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: rabbitmq
name: RabbitMQ
short: RabbitMQ
vendor: Broadcom
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - RabbitMQ Server
  - VMware RabbitMQ
  - Tanzu RabbitMQ
tags:
  - message-broker
  - amqp
  - mqtt
  - middleware
  - text
summary: An open-source message broker that implements AMQP, MQTT and STOMP, maintained by Broadcom (formerly VMware). Applications publish messages to exchanges and consume them from queues. The broker log records node start-up, cluster membership, client connections and authentication, and warnings such as memory or disk alarms.
sourcetypes:
  - st: rabbitmq
    desc: RabbitMQ node log lines with timestamp, level, Erlang process id and message
facts:
  Product: Message broker for AMQP 0-9-1, AMQP 1.0, MQTT and STOMP
  Deployment: Erlang nodes on servers, containers or Kubernetes, often in a cluster
  Log transport: Log file per node, console output, or syslog
  Log format: 'Text lines: timestamp, [level], <Erlang pid>, message'
  What a log line answers: What the node did or saw, such as a client connection, an authentication refusal, or a resource alarm
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Broker cluster
      desc: RabbitMQ nodes run in the application tier and are reached by producers and consumers over AMQP or MQTT. Each node writes its own log.
howItWorks:
  - title: Connections and channels
    body: Clients open a connection, authenticate with a user and vhost, then publish and consume on channels. Connection open, close and authentication results are logged.
  - title: Cluster and alarms
    body: Nodes log cluster joins and partitions, and raise memory and disk alarms that block publishers.
  - title: How the log leaves the product
    body: Each node writes to its log file or console, and can send to syslog. A collector tails the file or container output.
traffic:
  handles:
    - AMQP, MQTT and STOMP client connections
    - Broker authentication
    - Cluster membership
  flow:
    - step: Client connects
      desc: An application opens a connection and authenticates.
    - step: Node logs
      desc: The node writes a line for the connection, the result or any alarm.
    - step: Collector reads
      desc: A collector tails the log file or container output.
logs:
  - type: Broker log
    sourcetype: rabbitmq
    format: text
    desc: 'One line per log entry: timestamp, level in brackets, the Erlang process id and the message. This sample is an info-level line with no message text after the process id.'
    sample: 2023-01-24 10:38:45.236018+00:00 [info] <0.229.0>
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Broker login refused
    severity: medium
    signals:
      - message
    why: A refused login is a client using wrong credentials, or someone trying the default guest account. Repeated refusals from one address are guessing.
    kql: |
      dataset="rabbitmq_logs"
      | where sourcetype == "rabbitmq" and message contains "login refused"
      | project message
    mitre:
      - T1110
optimizations: []
references:
  - title: RabbitMQ logging
    url: https://www.rabbitmq.com/docs/logging
