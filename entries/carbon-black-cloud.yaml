      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Carbon Black Cloud events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries device_target_value, parent_name, reason, mdr_alert_notes_present, parent_guid, parent_md5. Values in the sample were rewritten to documentation addresses.
