id: xm-cyber
name: XM Cyber
short: XM Cyber
vendor: XM Cyber
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - XM Cyber Exposure Management
tags:
  - exposure
  - attack-path
  - endpoint
  - json
summary: XM Cyber maps how an attacker could move through an environment. Sensors and cloud connectors inventory devices, identities and software, then the platform scores which of those sit on paths to critical assets. Five JSON streams cover the audit trail, the device risk summary, the entity inventory, a product rollup and the vulnerabilities. A collector pulls them from the XM Cyber API.
sourcetypes:
  - st: xm_cyber_audit_trail
    desc: One platform audit event, such as a sensor failing a domain scan
  - st: xm_cyber_device
    desc: One device with its choke-point score, vulnerability counts and whether it is a critical asset
  - st: xm_cyber_entity_inventory
    desc: One inventoried entity, with the agent version, addresses and labels
  - st: xm_cyber_product
    desc: One installed product rolled up across devices, with how many vulnerabilities it carries
  - st: xm_cyber_vulnerability
    desc: One CVE, with its score and how many critical assets it puts at risk
facts:
  Product: Exposure management. It finds attack paths to critical assets and ranks the choke points on those paths
  Where it sits: A cloud tenant, with an agent or a sensor on endpoints and connectors into cloud and identity systems
  Log transport: HTTPS JSON from the XM Cyber API. Audit, devices, entities, products and vulnerabilities are separate resources
  Log format: One JSON object per record. Audit uses eventType and eventSubType. Devices use a choke-point score. Vulnerabilities use a CVE id
  What an audit event answers: What the platform or a sensor did, and whether a scan failed
  What a device answers: How exposed that host is, and when it was last compromised in a scenario
  What a vulnerability answers: Which CVE, and how many critical assets sit downstream of it
placement:
  slots:
    - cloud
    - endpoint
  items:
    - slot: cloud
      title: XM Cyber tenant
      desc: Attack-path scores, the entity inventory and the audit trail live in the XM Cyber tenant. A collector calls that API. The product does not bind the export to one SIEM.
    - slot: endpoint
      title: XM Cyber sensor
      desc: The entity inventory describes the agent on a host. agentVersionStr, ipv4Str and the labels are that host. Addresses in the samples are documentation addresses. A label such as device_without_edr is the platform marking a gap it saw.
howItWorks:
  - title: Audit trail
    body: An audit event is the platform recording its own work. eventType is the area, such as ACTIVE_DIRECTORY. eventSubType is the outcome, such as SENSOR_SCAN_FAILED. details is the sentence. objectName and objectType are what was being scanned. The sample is a sensor failing a domain scan of a documentation domain, with userId name Automated.
  - title: Devices, products and vulnerabilities
    body: A device row is the risk summary for one host. chokePointScore and chokePointLevel say whether the host is a place many attack paths pass through. criticalVulnerabilities and the other counts are the findings on it. isCriticalAsset says whether the customer marked it critical. A product row rolls one piece of software up across devices. productName, productVulnerabilities and devicesFoundOn are that rollup. A vulnerability row is one CVE. cve, severityLevel and the CVSS fields rate it. criticalAssetsAtRisk is how many critical assets the platform can reach through hosts that have it. The sample CVE is on 18 devices and puts 29 critical assets at risk.
  - title: Entity inventory
    body: An entity record is the raw inventory of one agent. name, agentVersionStr, ipv4Str and arch identify it. customProperties.labels are tags the platform applied. The sample labels include spooler and device_without_edr. disabled and lastConnectionTime say whether the sensor is still checking in. This stream is a snapshot. It is much larger than the audit trail or the vulnerability list.
  - title: How the records are collected
    body: A collector with API access requests each resource. Any collector can do this. Goatpedia reads these samples as JSON.
traffic:
  handles:
    - Sensor and platform audit, including failed scans
    - Device choke-point scores and vulnerability counts
    - CVE findings that reach critical assets
  flow:
    - step: Sensors inventory the environment
      desc: Agents and cloud connectors report devices, software and identity objects to the tenant.
    - step: The platform scores paths
      desc: XM Cyber writes a device score, a product rollup and a CVE row, and it writes an audit event when a scan fails or an operator changes something.
    - step: Collector pulls JSON
      desc: A collector requests the audit trail, devices, entities, products and vulnerabilities separately.
logs:
  - type: Audit trail
    sourcetype: xm_cyber_audit_trail
    format: json
    desc: One platform audit object. eventType and eventSubType say what happened. This sample is ACTIVE_DIRECTORY and SENSOR_SCAN_FAILED. details says the domain scan failed. objectName is a documentation domain. userId.name is Automated.
    sample: '{"_id":"64a1b2c3d4e5f60718293a4b","details":"ExampleDC01 failed to perform domain scan","eventSubType":"SENSOR_SCAN_FAILED","eventType":"ACTIVE_DIRECTORY","objectName":"example.com","objectType":"DOMAIN","tenant":"demo","terminalId":{"hostname":"acme","ip":"acme"},"timestamp":"2023-04-16T10:49:26.855Z","userId":{"name":"Automated"}}'
    key:
      - _id
      - details
      - eventSubType
      - eventType
  - type: Device risk
    sourcetype: xm_cyber_device
    format: json
    desc: One device summary. chokePointScore and chokePointLevel are the exposure rank. This sample is a workstation at Low, not marked a critical asset, with criticalVulnerabilities 2. ipAddress and domain use documentation values. lastCompromised is the last scenario time.
    sample: '{"deviceId":"9000000000000000001","deviceName":"host-01","chokePointScore":38,"chokePointLevel":"Low","isCriticalAsset":false,"lastScan":"2026-09-06T14:08:10.982Z","lastCompromised":"2026-09-04T00:00:00.000Z","deviceType":"Workstation","type":"agent","products":4,"ipAddress":"203.0.113.40","subnet":"192.0.2.10/24","labels":["lab","example-security-test"],"enrichmentLabels":["enriched"],"os":"Windows 11","domain":"corp.example.com","ou":"OU=Workstations,DC=corp,DC=example,DC=com","fqdn":"host-01.corp.example.com","criticalVulnerabilities":2,"highVulnerabilities":5,"mediumVulnerabilities":10,"lowVulnerabilities":3,"unknownVulnerabilities":0,"maxCvssV2":8,"maxCvssV3":9.1,"maxCvssV31":8.8,"maxCvssV4":7.2,"enitityVulnerabilities":1,"affectedEntities":4,"criticalAssetsAtRisk":2}'
    key:
      - deviceId
      - deviceName
      - chokePointScore
      - chokePointLevel
  - type: Entity inventory
    sourcetype: xm_cyber_entity_inventory
    format: json
    desc: One inventoried agent. agentVersionStr, name and ipv4Str identify it. This sample agent is enabled and its labels include device_without_edr. ipv4Str is a documentation address. disabledReason and lastConnectionTime say why it last changed state.
    sample: '{"id":"90000000000000000003","accessKeyCreationDate":"Unknown","podIP":"","ec2PublicIpAddress":"","agentVersion":{"major":1,"minor":55,"patch":2},"agentVersionStr":"1.55.2","arch":"Amd64","cmId":"0000","connectionCounter":160,"customProperties":{"snifferStatus":"Active","snifferStatusChangeable":true,"domainWorkgroup":{"type":"workgroup","data":"workgroup"},"ouComputer":"workgroup","subnetInfo":"192.0.2.20/24","macAddresses":["2001:db8::1"],"ouUser":"workgroup","labels":[{"label":"spooler"},{"label":"device_without_edr"}],"snifferStatusConfiguration":"ForcedEnabled","custom_labels":[{"label":"testLabel"},{"label":"sn : azure Identity : sn"}],"hardwareInfo":{"totalRamMb":"2047","cpuProcessorType":"Intel(R) Xeon(R) Gold 5318Y CPU @ 2.10GHz","cpuCoreCount":1,"cpuCount":1,"cpuManufacturer":"GenuineIntel","cpuSpeedMhz":2095,"systemManufacturer":"VMware, Inc.","systemModel":"VMware Virtual Platform"}},"customerId":"89a1d5c1-2b3e-4f67-8a9b-0c1d2e3f4a5b","disabled":false,"disabledChangedAt":"2025-12-01T05:31:01.103Z","disabledReason":"revivedByCmNodeMgr","firstSeen":"2024-08-07T12:18:26.093Z","hasUpdateAvailable":false,"installationId":"00000000-0000-0000-0000-000000000001","ipv4":[{"data":[192,168],"type":"Buffer"}],"ipv4Num":[2885681155],"ipv4Str":["198.51.100.15"],"ipv6":[{"data":[32,1],"type":"Buffer"}],"ipv6Str":["2001:db8::1"],"lastConnectionTime":"2026-05-03T08:40:06.399Z","lastDisconnectionReason":"Keepalive","lastRebootTime":"2025-05-15T09:33:32.000Z","lastStatusChange":"2026-05-03T08:40:06.399Z","latestPossibleAgentVersion":{"major":1,"minor":55,"patch":2},"latestPossibleAgentVersionStr":"1.55.2","name":"172-0-0-3","nameUppercase":"172-0-0-3"}'
    key:
      - id
      - accessKeyCreationDate
      - podIP
      - ec2PublicIpAddress
  - type: Product rollup
    sourcetype: xm_cyber_product
    format: json
    desc: One product across the estate. productName is the software. This sample is Windows Remote Desktop Services, found on 8 devices, with productVulnerabilities 2 and affectedCriticalAssets 3. lastDataUpdate is when the rollup was refreshed.
    sample: '{"productName":"windows remote desktop services","vendor":null,"productVulnerabilities":2,"devicesFoundOn":8,"affectedCriticalAssets":3,"chokePointsFoundOn":0,"productsCriticalAssetsAtRisk":29,"productOperatingSystem":["Windows 7 SP 1.0","Windows Server 2012 R2"],"lastDataUpdate":"2026-09-07T01:32:06.000Z"}'
    key:
      - productName
      - vendor
      - productVulnerabilities
      - devicesFoundOn
  - type: Vulnerability
    sourcetype: xm_cyber_vulnerability
    format: json
    desc: One CVE. cve is the id and severityLevel is the band. This sample is CVE-2013-6629 at Medium, on 18 devices, with criticalAssetsAtRisk 29 and inCisaKev false. epssScore is the exploit probability the record carries.
    sample: '{"cve":"CVE-2013-6629","description":"The get_sos function in jdmarker.c in (1) libjpeg 6b and (2) libjpeg-turbo through 1.3.0, as used in Google Chrome before 31.0.1650.48, Ghostscript, and othe...","cvss2":5,"firstDetected":"2025-04-03T00:00:00.000Z","publishedDate":"2013-11-19T00:00:00.000Z","severity":20,"cvss2Vector":"AV:N/AC:M/Au:N/C:P/I:N/A:N","cvss30":0,"cvss3Vector":"","cvss31":0,"cvss31Vector":"","cvss4":0,"cvss4Vector":"","epssPercentile":0.95322,"epssScore":0.10117,"epssProbability":0.10117,"inCisaKev":false,"inExploitDb":false,"hasAttackTechnique":false,"severityLevel":"Medium","products":2,"deviceFoundOn":18,"criticalAssetsFoundOn":1,"chokePointFoundOn":1,"criticalAssetsAtRisk":29,"NVDURL":"https://nvd.nist.gov/vuln/detail/CVE-2013-6629","CVEOrgURL":"https://www.cve.org/CVERecord?id=CVE-2013-6629","MSRCURL":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2013-6629","RedHatURL":"https://access.redhat.com/security/cve/CVE-2013-6629","AmazonLinuxURL":"https://explore.alas.aws.amazon.com/CVE-2013-6629.html"}'
    key:
      - cve
      - description
      - cvss2
      - firstDetected
cves: []
detections:
  - title: Sensor failed a domain scan
    severity: medium
    signals:
      - eventSubType
      - eventType
      - objectName
      - details
    why: SENSOR_SCAN_FAILED means the sensor did not complete a scan, so the attack-path picture for that domain is stale. The sample is an Active Directory domain scan that failed. A successful inventory row is not this signal.
    kql: |
      dataset="xm-cyber_logs"
      | where sourcetype == "xm_cyber_audit_trail" and eventSubType == "SENSOR_SCAN_FAILED"
      | project timestamp, eventType, eventSubType, objectName, objectType, details
  - title: CVE puts critical assets at risk
    severity: high
    signals:
      - cve
      - criticalAssetsAtRisk
      - severityLevel
      - deviceFoundOn
    why: criticalAssetsAtRisk greater than zero means the platform can reach at least one critical asset through hosts that have this CVE. The sample puts 29 critical assets at risk. A CVE with nothing downstream is a finding without that path.
    kql: |
      dataset="xm-cyber_logs"
      | where sourcetype == "xm_cyber_vulnerability" and criticalAssetsAtRisk > 0
      | project cve, severityLevel, deviceFoundOn, criticalAssetsAtRisk, inCisaKev, epssScore
optimizations:
  - title: Sample the entity inventory
    saving: most of the agent-inventory volume
    fn: Drop
    how: Entity inventory is a full snapshot of every agent and it repeats on each poll. Audit failures and vulnerabilities that reach critical assets are the security-relevant subset. Drop or sample the entity inventory before the SIEM.
    expr: "sourcetype == 'xm_cyber_entity_inventory'"
    stream:
      log: Entity inventory
      functions:
        - id: drop
          filter: installationId !== undefined && agentVersionStr !== undefined && customProperties !== undefined
          description: Drop the repeating entity inventory snapshot before the SIEM; audit and vulnerability events pass
          conf: {}
      expect:
        out: 0
references: []
