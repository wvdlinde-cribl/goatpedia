# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: kubernetes
name: Kubernetes
short: Kubernetes
vendor: Cloud Native Computing Foundation
category: cloud
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - K8s
  - kube-apiserver
tags:
  - containers
  - orchestration
  - audit
  - control-plane
  - json
summary: An open-source container orchestrator. Every change to a cluster, and every read of its objects, goes through the kube-apiserver. When an audit policy is set, the API server writes one audit event per request stage, saying who called which verb on which resource, from where, and whether it was allowed. That is the record of control-plane activity for the cluster.
sourcetypes:
  - st: kubernetes_audit_logs
    desc: Kubernetes API server audit events, one per request stage, with user, verb, resource, source IP, response code and authorization decision
facts:
  Product: Container orchestration platform; the kube-apiserver is the single API for the cluster
  Deployment: Self-managed clusters on servers or VMs, or managed services in public clouds
  Clients: kubectl, controllers, operators, CI systems and service accounts inside pods
  Log transport: Audit log backend (a JSON file on the control-plane node) or webhook backend; managed services export it through the cloud's logging
  Log format: One JSON object per audit event (kind Event, apiVersion audit.k8s.io/v1)
  What an audit event answers: Who (user.username, groups) did which verb on which object (objectRef), from which IP, with which result (responseStatus.code) and why it was allowed (annotations)
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Control plane (kube-apiserver)
      desc: The API server runs on the control-plane nodes. Its audit backend writes the audit log there, or sends it to a webhook.
    - slot: cloud
      title: Managed Kubernetes
      desc: In managed services the control plane is run by the cloud provider and audit events are exported through the provider's logging service. The event format is the same.
howItWorks:
  - title: Every action is an API request
    body: Users, controllers and pods change and read the cluster by calling the kube-apiserver. Each request names a verb (get, list, watch, create, update, patch, delete) and a resource such as pods or secrets in a namespace.
  - title: Audit policy and stages
    body: An audit policy decides which requests are recorded and at which level (None, Metadata, Request, RequestResponse). A request can produce events at several stages, such as RequestReceived and ResponseComplete. Metadata events carry the user, verb, object and response code but not the bodies.
  - title: Authorization decision
    body: The annotations authorization.k8s.io/decision and reason record whether RBAC or another authorizer allowed the request. responseStatus.code is the HTTP result, so 401 and 403 are rejected calls.
traffic:
  handles:
    - Kubernetes API calls (get
    - list
    - watch
    - create
    - update
    - patch
    - delete)
    - RBAC authorization
    - Service-account access from pods
  flow:
    - step: Client calls the API
      desc: kubectl, a controller or a pod's service account sends a request to the kube-apiserver.
    - step: API server authorizes
      desc: The API server authenticates the caller, checks RBAC and runs the request.
    - step: Audit event written
      desc: For each stage the policy selects, the audit backend writes one JSON event to the audit file or webhook. Goatpedia reads it as JSON.
logs:
  - type: API server audit events
    sourcetype: kubernetes_audit_logs
    format: json
    desc: One object per request stage. verb, objectRef and user.username say who did what to which object; sourceIPs and userAgent say from where; responseStatus.code and the authorization annotations give the result. This sample is the default service account listing pods in the default namespace with kubectl, allowed with 200. Values are documentation addresses.
    sample: '{"kind":"Event","apiVersion":"audit.k8s.io/v1","level":"Metadata","auditID":"abcde12345","stage":"ResponseComplete","requestURI":"/api/v1/namespaces/default/pods","verb":"get","user":{"username":"system:serviceaccounts:default:default","uid":"12345678","groups":["system:authenticated"]},"sourceIPs":["192.0.2.20"],"userAgent":"kubectl/v1.26.1","objectRef":{"resource":"pods","namespace":"default","name":"my-pod","apiGroup":"","apiVersion":"v1"},"responseStatus":{"metadata":{},"code":200},"requestReceivedTimestamp":"2025-03-04T06:22:18.819232Z","stageTimestamp":"2025-03-04T06:22:18.822532Z","annotations":{"authorization.k8s.io/decision":"allow","authorization.k8s.io/reason":""}}'
    key:
      - kind
      - apiVersion
      - level
      - auditID
cves: []
detections:
  - title: Secrets read through the API
    severity: high
    signals:
      - verb
      - objectRef.resource
      - objectRef.namespace
      - user.username
      - sourceIPs
    why: Secrets hold tokens and passwords. A get, list or watch on secrets by a user or service account that does not normally read them is credential access inside the cluster.
    kql: |
      dataset="kubernetes_logs"
      | where sourcetype == "kubernetes_audit_logs" and objectRef.resource == "secrets" and verb in ("get", "list", "watch")
      | project requestReceivedTimestamp, user.username, verb, objectRef.namespace, objectRef.name, sourceIPs, userAgent
    mitre:
      - T1552.007
  - title: API request rejected
    severity: medium
    signals:
      - responseStatus.code
      - user.username
      - verb
      - objectRef.resource
    why: 401 and 403 responses are calls the API server refused, for a bad credential or missing RBAC permission. A burst from one identity is often a stolen token being tried against the cluster.
    kql: |
      dataset="kubernetes_logs"
      | where sourcetype == "kubernetes_audit_logs" and responseStatus.code in (401, 403)
      | project requestReceivedTimestamp, user.username, verb, objectRef.resource, objectRef.namespace, sourceIPs, userAgent
    mitre:
      - T1078.004
optimizations:
  - title: Drop system read chatter
    saving: most of the audit volume
    fn: Drop
    how: Controllers and nodes running as system identities get, list and watch objects all the time. Keep writes, any access to secrets, and every request by a human or workload identity.
    expr: (verb == 'get' || verb == 'list' || verb == 'watch') && user.username.startsWith('system:') && objectRef.resource != 'secrets'
    stream:
      log: API server audit events
      functions:
        - id: drop
          filter: (verb == 'get' || verb == 'list' || verb == 'watch') && String((user || {}).username || '').indexOf('system:') == 0 && (objectRef || {}).resource != 'secrets'
          description: Drop get/list/watch by system identities, except on secrets; keep writes and every human or workload request
          conf: {}
      test:
        - '{"kind":"Event","apiVersion":"audit.k8s.io/v1","level":"Metadata","auditID":"abcde12346","stage":"ResponseComplete","requestURI":"/api/v1/namespaces/default/secrets","verb":"get","user":{"username":"system:serviceaccounts:default:default","uid":"12345678","groups":["system:authenticated"]},"sourceIPs":["192.0.2.20"],"userAgent":"kubectl/v1.26.1","objectRef":{"resource":"secrets","namespace":"default","name":"my-secret","apiGroup":"","apiVersion":"v1"},"responseStatus":{"metadata":{},"code":200},"requestReceivedTimestamp":"2025-03-04T06:22:18.819232Z","stageTimestamp":"2025-03-04T06:22:18.822532Z","annotations":{"authorization.k8s.io/decision":"allow","authorization.k8s.io/reason":""}}'
        - '{"kind":"Event","apiVersion":"audit.k8s.io/v1","level":"Metadata","auditID":"abcde12347","stage":"ResponseComplete","requestURI":"/api/v1/namespaces/default/pods","verb":"get","user":{"username":"jdoe@example.com","uid":"12345679","groups":["system:authenticated"]},"sourceIPs":["198.51.100.30"],"userAgent":"kubectl/v1.26.1","objectRef":{"resource":"pods","namespace":"default","name":"my-pod","apiGroup":"","apiVersion":"v1"},"responseStatus":{"metadata":{},"code":200},"requestReceivedTimestamp":"2025-03-04T06:22:18.819232Z","stageTimestamp":"2025-03-04T06:22:18.822532Z","annotations":{"authorization.k8s.io/decision":"allow","authorization.k8s.io/reason":""}}'
      expect:
        out: 2
references:
  - title: Kubernetes auditing
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
