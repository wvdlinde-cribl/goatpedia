id: admin-by-request-epm
name: Admin By Request EPM
short: AdminByRequest
vendor: Admin By Request
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Admin By Request
  - FastTrack Software Admin By Request
tags:
  - endpoint-privilege-management
  - pam
  - endpoint
  - json
  - audit
summary: An endpoint privilege management product that removes local admin rights and lets users ask for elevation when they need it. An agent on Windows and macOS enforces the policy, and requests are approved automatically, by an administrator or after a malware scan in the cloud portal. The portal records agent events such as blocked executions, and an audit log of every elevation request with who asked, why, who approved and what ran.
sourcetypes:
  - st: admin_by_request_epm
    desc: Events raised by the endpoint agent, such as an execution blocked by policy, with the computer, user and application
  - st: admin_by_request_epm_auditlog
    desc: The audit log of elevation requests, with the reason, approver, timing, computer, user and elevated application
facts:
  Product: Endpoint privilege management (just-in-time local admin)
  Clients: Agent for Windows and macOS, with a cloud portal for policy and approvals
  Log transport: HTTPS JSON REST API of the Admin By Request portal, polled by a collector with an API key
  Log format: One JSON object per event or per elevation request
  What an event answers: What the agent did on which computer for which user and application
  What an audit entry answers: Who asked to elevate what, why, who approved or denied it, and what the elevated session ran
placement:
  slots:
    - endpoint
    - cloud
  items:
    - slot: endpoint
      title: Endpoint agent
      desc: The agent on each laptop or server removes standing admin rights, blocks applications by policy and grants elevation when a request is approved.
    - slot: cloud
      title: Admin By Request portal
      desc: Policies, approvals and the audit log live in the vendor's cloud portal. A collector reads events and audit entries from the portal API.
howItWorks:
  - title: Elevation requests
    body: A user who needs admin rights asks through the agent, either to run one application as admin or for a time-limited admin session. The request carries a reason. Depending on settings it is approved automatically, approved or denied by an administrator, or validated through single sign-on. The audit entry records approvedBy or deniedBy, the times, and the applications installed, uninstalled or elevated during the session.
  - title: Scanning and blocking
    body: Files run with elevation are hashed and can be scanned against multiple antivirus engines before they start. Policies can also block named applications outright. A blocked execution becomes an agent event with the file, path, vendor and SHA-256.
  - title: How the events leave the product
    body: The portal exposes events and the audit log through its REST API. A collector holding an API key polls both and keeps the last id or time so it does not repeat entries.
traffic:
  handles:
    - Requests for local admin rights
    - Elevated application runs, installs and uninstalls
    - Policy blocks of executables
  flow:
    - step: User asks
      desc: A user requests to run an application as admin or to get an admin session, and gives a reason.
    - step: Portal decides
      desc: The request is approved automatically, by an administrator, or after a scan. Blocked applications are refused by policy.
    - step: Agent records
      desc: The agent reports the outcome, the application and what ran to the portal.
    - step: Collector polls
      desc: A collector reads events and audit entries from the portal API as JSON.
logs:
  - type: Agent events
    sourcetype: admin_by_request_epm
    format: json
    desc: One object per agent event. eventCode and eventText say what happened, here an execution blocked by policy. computerName and userName say where, and application gives the file, path, vendor and sha256.
    sample: '{"id":53820480,"eventCode":92,"eventLevel":0,"eventText":"Execution of file blocked by policy","eventTime":"2022-01-27T12:16:38.817","eventTimeUTC":"2022-01-27T12:16:38.817","computerName":"FTWIN11","userAccount":"TEST","userName":"FastTrack Support","alertAccount":null,"auditLogURL":null,"rollback":false,"additionalData":null,"application":{"file":"msedge.exe","path":"C:\\Program Files (x86)\\Microsoft\\Edge\\Application","name":"Microsoft Edge","vendor":"Microsoft Corporation","version":"msedge.exe","sha256":"3BC499B8B30FE66A91FABC2FF5AE6E6A9452C116AEDCAC7DBC5AEEEAEED2EB9C"}}'
    key:
      - id
      - eventCode
      - eventLevel
      - eventText
  - type: Elevation audit log
    sourcetype: admin_by_request_epm_auditlog
    format: json
    desc: One object per elevation request. type is the kind of request (Run As Admin here), reason is the user's justification, approvedBy or deniedBy the decision. user and computer say who and where, application the elevated file with its scan result. The audit link uses example.com.
    sample: '{"id":615669,"traceNo":"34376579","settingsName":"Global","type":"Run As Admin","typeCode":0,"status":"Finished","statusCode":2,"reason":"Need to update reader. It says out of date when trying to open PDF files from our supplier.","approvedBy":"Jim Kerr","deniedReason":null,"deniedBy":null,"ssoValidated":false,"requestTime":"2020-04-01T12:03:00","requestTimeUTC":"2020-04-01T12:03:00","startTime":"2020-04-01T12:03:30","startTimeUTC":"2020-04-01T12:03:30","endTime":"2020-04-01T12:09:11","endTimeUTC":"2020-04-01T12:09:11","responseTime":"00:00:05.4100000","auditlogLink":"https://www.example.com/AuditLog?Page=AppElevations&ID=12&ShowFilter=false","user":{"account":"ACMEPDH","fullName":"Paul David Hewson","email":"user@example.com","phone":"555.345.6789","isAdmin":false},"computer":{"name":"W1005623","platform":"Windows","platformCode":0,"make":"Dell Inc.","model":"XPS 15 9550"},"application":{"file":"readerdc_uk_fb_crd_install.exe","path":"C:\\installers","name":"Adobe Download Manager","vendor":"Adobe Inc.","version":"2.0.0.495s","sha256":"9369FB712545F6B6FEC5FBF8B1DD228E57CA7899933BBE354B7C4351C8700C99","scanResult":"Clean","scanResultCode":0,"threat":null,"virustotalLink":"https://www.example.com/latest-scan/9369FB712545F6B6FEC5FBFC4351C8700C99","preapproved":false},"installs":[{"application":"Adobe Acrobat Reader DC","version":"20.006.20042","vendor":"Adobe Systems Incorporated"}],"uninstalls":[{"application":"Adobe Reader XI (11.0.23)  MUI","version":"11.0.23","vendor":"Adobe Systems Incorporated"}],"elevatedApplications":[{"name":"Adobe Download Manager","path":"C:\\Users\\pdh\\Downloads","file":"readerdc_uk_fb_crd_install.exe","version":"2.0.0.495s","vendor":"Adobe Inc.","sha256":"9369FB712545F6B6FEC5FBF8B1DD228E57CA7899933BBE354B7C4351C8700C99","scanResult":"Clean","scanResultCode":0,"threat":null,"virustotalLink":"https://www.example.com/latest-scan/9369FB712545F6B6FEC5F4B7C4351C8700C99"},{"name":"Adobe Self Extractor","path":"C:\\Users\\pdh\\AppData\\Local\\Adobe\\E1F06F26-140E-4556-A421-788F6C2015BD\\DA1C2141-106A-4BC6-B096-658FCF15DBFC","file":"C12D10CF-96D9-4985-BE1E-00B35267FB0C","version":"20.6.20042.371103","vendor":"Adobe Inc.","sha256":"912525F339CFC46D2CE7402366FC213084D79DEAD70D754F4A73C8BA4AA40650","scanResult":"Clean","scanResultCode":0,"threat":null,"virustotalLink":"https://www.example.com/latest-scan/912525F339CFC46DC8BA4AA40650"}],"scanResults":[{"scanResult":"Clean","scanResultCode":0,"engine":"BitDefender","threat":null},{"scanResult":"Clean","scanResultCode":0,"engine":"CrowdStrike","threat":null}]}'
    key:
      - id
      - traceNo
      - settingsName
      - type
cves: []
detections:
  - title: Execution blocked by policy
    severity: medium
    signals:
      - eventText
      - computerName
      - userName
      - application.file
    why: A blocked execution is a user or process trying to run something the policy forbids. Repeats on one machine, or unfamiliar hashes, are worth a look.
    kql: |
      dataset="admin-by-request-epm_logs"
      | where sourcetype == "admin_by_request_epm" and eventText has "blocked"
      | project eventTimeUTC, computerName, userName, application.file, application.path, application.sha256
    mitre:
      - T1204
  - title: Elevated application not scanned clean
    severity: high
    signals:
      - application.scanResult
      - application.threat
      - user.account
      - computer.name
    why: Admin By Request scans files before elevation. An elevation whose application did not come back Clean means admin rights were requested for a file the scanners flagged.
    kql: |
      dataset="admin-by-request-epm_logs"
      | where sourcetype == "admin_by_request_epm_auditlog" and application.scanResult != "Clean"
      | project requestTimeUTC, user.account, computer.name, type, application.file, application.scanResult, application.threat, approvedBy
    mitre:
      - T1548
optimizations: []
references: []
