summary: Stan is logged by the Elastic integrations package stan. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: stan
    desc: 'Elastic integrations fixture, 20 events. Upstream: stan/data_stream/log/_dev/test/pipeline/test-log-sample.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: stan
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Stan events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Elastic integrations package reads stan and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text.
logs:
  - type: Log
    sourcetype: stan
    format: text
    desc: 20 fixture events in the samples pool (elastic).
    sample: '[7] 2021/01/13 14:20:06.981022 [INF] STREAM: Starting nats-streaming-server[test-cluster] version 0.15.1'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Stan events arriving
    severity: low
    signals:
      - message
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "stan"'
optimizations: []
references:
  - title: elastic/integrations stan/data_stream
    url: https://github.com/elastic/integrations/blob/cbfff90638a7565377768f50726775c0febc7bf4/packages/stan/data_stream/log/_dev/test/pipeline/test-log-sample.log
  - title: Pack Generator sample stan.json
    url: https://github.com/wvdlinde-cribl/cribl-pack-samples/blob/main/samples/stan.json
