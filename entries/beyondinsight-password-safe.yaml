id: beyondinsight-password-safe
name: BeyondTrust Password Safe
short: Password Safe
vendor: BeyondTrust
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - BeyondInsight Password Safe
  - Password Safe Cloud
tags:
  - pam
  - privileged-access
  - password-vault
  - identity
  - json
summary: BeyondTrust Password Safe is a privileged account and session management product. It discovers servers, databases and directories, takes over their privileged accounts, rotates their passwords and releases them to approved users, and can record the sessions opened with them. It runs on the BeyondInsight platform, self-hosted or as a cloud service. Its API exposes the asset, managed system and managed account inventory plus session and user audit records, which together show who was given privileged access to what, and who changed the vault.
sourcetypes:
  - st: beyondinsight_password_safe_asset
    desc: Asset inventory records, one per discovered or registered asset, with name, type, DNS name, IP, operating system and workgroup
  - st: beyondinsight_password_safe_managedaccount
    desc: Managed account records, one per privileged account under Password Safe control, with the system it belongs to, release durations and password change schedule
  - st: beyondinsight_password_safe_managedsystem
    desc: Managed system records, one per server, database, directory or cloud platform Password Safe manages accounts on, with platform, connection and password rule settings
  - st: beyondinsight_password_safe_session
    desc: Privileged session records, one per session opened through Password Safe with a managed account, with user, target asset, protocol, start, end, duration and recording status
  - st: beyondinsight_password_safe_useraudit
    desc: User audit records, one per administrative action in BeyondInsight, with the action type, section of the product, user and source IP
facts:
  Product: Privileged password and session management, part of the BeyondTrust BeyondInsight platform
  Form factor: Self-hosted U-Series appliance or Windows install, or BeyondTrust-hosted Password Safe Cloud
  Log transport: Records are read from the Password Safe public REST API by any collector with an API key and a run-as user. BeyondInsight can also forward events as syslog
  Log format: One JSON object per record, using the API's own field names (AssetID, ManagedSystemID, SessionID, ActionType)
  What the inventory streams answer: Which assets, managed systems and privileged accounts exist, how long a password may be released for, and when it is next rotated
  What a session record answers: Which user opened which session as which managed account on which asset, when, for how long and whether it was recorded
  What a user audit record answers: Who changed which part of BeyondInsight or Password Safe, with which action, from which IP
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Password Safe appliance and managed systems
      desc: The appliance or server sits inside the network, reaches the managed systems to rotate passwords and proxies the sessions users open to them. Asset, system and account records describe these internal targets.
    - slot: cloud
      title: Password Safe Cloud
      desc: In the cloud edition the vault and console are hosted by BeyondTrust, with resource brokers inside the network reaching the managed systems. The same API serves the records.
howItWorks:
  - title: Assets, systems and accounts
    body: Discovery scans find assets. An asset becomes a managed system when Password Safe is told how to connect to it and which password rules apply. Privileged accounts on that system become managed accounts, whose passwords Password Safe changes on a schedule (LastChangeDate, NextChangeDate) and releases for a limited time (DefaultReleaseDuration, MaximumReleaseDuration).
  - title: Requests and sessions
    body: A user requests access to a managed account. After approval Password Safe either releases the password or opens a session for the user through its session proxy, so the user never sees the password. Session records carry the user, the managed account, the asset, the protocol, start and end times and the recording key.
  - title: User audits
    body: Every administrative action in BeyondInsight, such as adding a Secrets Safe folder, changing a policy or a user, is written to the user audit log with ActionType, Section, UserName and IPAddress.
  - title: How the records leave the product
    body: A collector authenticates to the Password Safe public API with an API key and a run-as user and pages through the asset, managed system, managed account, session and user audit endpoints. Each record comes back as a JSON object. The destination is a choice of the pipeline, not a property of Password Safe.
traffic:
  handles:
    - Privileged password requests and releases
    - Password rotation on managed systems
    - Proxied privileged sessions (RDP, SSH)
    - BeyondInsight administration
  flow:
    - step: Admin or user acts
      desc: An administrator changes the configuration, or a user requests a privileged account and opens a session.
    - step: Password Safe records it
      desc: The change is added to the user audit log, the session is recorded, and the inventory reflects the systems and accounts under management.
    - step: Collector polls the API
      desc: A collector calls the public REST API for each record type and pages through the results.
    - step: Records are JSON
      desc: Each record is a JSON object and is forwarded as one event.
logs:
  - type: Asset
    sourcetype: beyondinsight_password_safe_asset
    format: json
    desc: One inventory record per asset. AssetName, AssetType, DnsName, IPAddress and OperatingSystem describe it and WorkgroupID scopes it. This sample is an Ubuntu server. The sample uses documentation addresses.
    sample: '{"WorkgroupID":1,"AssetID":22,"AssetName":"HealthTiger","AssetType":"Server","DnsName":"HealthTiger.example.com","DomainName":"example.com","IPAddress":"192.0.2.20","MacAddress":"2001:db8::1","OperatingSystem":"Ubuntu 20.04","CreateDate":"2023-01-15T10:30:00Z","LastUpdateDate":"2023-06-20T14:45:00Z"}'
    key:
      - WorkgroupID
      - AssetID
      - AssetName
      - AssetType
  - type: Managed account
    sourcetype: beyondinsight_password_safe_managedaccount
    format: json
    desc: One record per privileged account under management. SystemName and AccountName identify it, DefaultReleaseDuration and MaximumReleaseDuration say how long its password may be checked out, and LastChangeDate and NextChangeDate show the rotation schedule. IsISAAccess marks information systems administrator access. The sample uses documentation addresses.
    sample: '{"PlatformID":4,"SystemId":5,"SystemName":"KittenGrowth","InstanceName":"Primary","DomainName":"example.com","AccountId":5,"AccountName":"MacdonaldP.Irene","UserPrincipalName":"user@example.com","ApplicationID":123,"ApplicationDisplayName":"AccountingApp","MaximumReleaseDuration":525600,"DefaultReleaseDuration":120,"LastChangeDate":"2024-12-10T08:57:45.9","NextChangeDate":"2024-12-12T00:00:00.0","ChangeState":2,"IsChanging":false,"IsISAAccess":true,"PreferredNodeID":"2ca45774-d4e0-4b8f-9b52-3f52b78ae2ca","AccountDescription":"Primary managed account for KittenGrowth system"}'
    key:
      - PlatformID
      - SystemId
      - SystemName
      - InstanceName
  - type: Managed system
    sourcetype: beyondinsight_password_safe_managedsystem
    format: json
    desc: One record per system Password Safe manages. PlatformID is the system type, HostName, DNSName and IPAddress locate it, and PasswordRuleID, ReleaseDuration and AutoManagementFlag show how its accounts are handled. Fields that do not apply to the platform are null. The sample uses documentation addresses.
    sample: '{"ManagedSystemID":15,"EntityTypeID":2,"AssetID":null,"DatabaseID":null,"DirectoryID":null,"CloudID":null,"WorkgroupID":3,"HostName":"MinimalSystem","DNSName":"minimal.example.com","IPAddress":"198.51.100.15","InstanceName":"Default","IsDefaultInstance":null,"Template":"BasicTemplate","ForestName":"TestForest","UseSSL":null,"OracleInternetDirectoryID":null,"OracleInternetDirectoryServiceName":"DefaultOiD","SystemName":"MinimalSystem","PlatformID":6,"NetBiosName":"MinimalNet","Port":null,"Timeout":15,"Description":"Minimal system with null values","ContactEmail":"user@example.com","PasswordRuleID":1,"DSSKeyRuleID":null,"ReleaseDuration":60,"MaxReleaseDuration":300000,"ISAReleaseDuration":90,"AutoManagementFlag":false}'
    key:
      - ManagedSystemID
      - EntityTypeID
      - AssetID
      - DatabaseID
  - type: Privileged session
    sourcetype: beyondinsight_password_safe_session
    format: json
    desc: One record per session opened through Password Safe. UserID is the requester, ManagedAccountName and AssetName the account and target, Protocol the session type, StartTime, EndTime and Duration the timing, and Status and ArchiveStatus its state and recording. This sample is a session of about two hours as admin_user on web-server-01.
    sample: '{"SessionID":1001,"UserID":123,"NodeID":"node-001","Status":1,"ArchiveStatus":1,"Protocol":0,"StartTime":"2025-01-15T08:30:00Z","EndTime":"2025-01-15T10:45:00Z","Duration":8100,"AssetName":"web-server-01","ManagedSystemID":456,"ManagedAccountID":789,"ManagedAccountName":"admin_user","RecordKey":"rec_key_abc123","Token":"token_xyz789","ApplicationID":101,"RequestID":201,"SessionType":1}'
    key:
      - SessionID
      - UserID
      - NodeID
      - Status
  - type: User audit
    sourcetype: beyondinsight_password_safe_useraudit
    format: json
    desc: One record per administrative action. ActionType is what was done, Section the area of the product, UserName and IPAddress who did it and from where. This sample is a Secrets Safe folder being added. The sample uses documentation addresses.
    sample: '{"AuditID":1,"ActionType":"Add","Section":"SecretsSafeFolder","UserID":-1,"UserName":"user@example.com","IPAddress":"198.51.100.25","CreateDate":"2024-12-06T17:59:40.36Z"}'
    key:
      - AuditID
      - ActionType
      - Section
      - UserID
cves: []
detections:
  - title: Change to the vault configuration
    severity: medium
    signals:
      - ActionType
      - Section
      - UserName
      - IPAddress
    why: User audit records are changes to who may reach privileged credentials and how. Deletes, and changes to Secrets Safe, policies or users, made by an unexpected account or from an unexpected address deserve review.
    kql: |
      dataset="beyondinsight-password-safe_logs"
      | where sourcetype == "beyondinsight_password_safe_useraudit" and ActionType in ("Add", "Update", "Delete")
      | project CreateDate, UserName, IPAddress, ActionType, Section
    mitre:
      - T1098
optimizations: []
references: []
