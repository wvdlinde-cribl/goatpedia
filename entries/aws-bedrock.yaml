summary: AWS Bedrock is logged by the Elastic integrations package aws_bedrock. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: aws_bedrock_invocation
    desc: 'Elastic integrations fixture, 10 events. Upstream: aws_bedrock/data_stream/invocation/_dev/test/pipeline/test-aws-bedrock.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: aws_bedrock
  Sourcetypes: '1'
  Fixture events: '10'
  Log format seen: json
  Fields in the first fixture: schemaType, schemaVersion, timestamp, accountId, identity.arn, region
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: AWS Bedrock events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries schemaType, schemaVersion, timestamp, accountId, identity.arn, region. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads aws_bedrock and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
