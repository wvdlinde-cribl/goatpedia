id: oracle-weblogic
name: Oracle WebLogic Server
short: WebLogic
vendor: Oracle
category: db
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - WebLogic
  - Oracle Fusion Middleware WebLogic
tags:
  - application-server
  - java
  - web
  - access-log
  - text
summary: 'Oracle''s Java EE application server, used to host enterprise Java applications and many Oracle products. Each WebLogic server instance writes an HTTP access log in common log format: the client, the request, the status and the size of every request it served. That log is the web view of the applications running on it.'
sourcetypes:
  - st: oracle_weblogic_access
    desc: HTTP access log of a WebLogic server instance, one line per request served
facts:
  Product: Java EE / Jakarta EE application server
  Deployment: Domains of admin and managed servers on premises or in the cloud, often behind a load balancer or web tier
  Log transport: access.log file in each server's logs directory, read by a file collector
  Log format: Common log format by default, or extended log format when configured
  What an access line answers: Which client requested which URL with which method, and the status and bytes returned
placement:
  slots:
    - internal
    - dmz
  items:
    - slot: internal
      title: WebLogic managed server
      desc: Applications run on managed servers in the application tier, usually behind a load balancer or Oracle HTTP Server. Each server writes its own access log on its host.
    - slot: dmz
      title: Web tier
      desc: A reverse proxy or load balancer in front of WebLogic often terminates client connections, so the client address in the access log can be the proxy unless forwarding headers are logged.
howItWorks:
  - title: Servers and domains
    body: A WebLogic domain has an admin server and managed servers. Applications are deployed to managed servers or clusters.
  - title: HTTP access logging
    body: 'Each server can log every HTTP request it serves. The default format is common log format: client, identity, user, time, request line, status and bytes.'
  - title: How the log leaves the product
    body: The log is written to access.log under the server's logs directory and rotated by size or time. A collector tails the file.
traffic:
  handles:
    - HTTP and HTTPS requests to Java applications
  flow:
    - step: Client requests
      desc: A browser or service calls an application URL on the server.
    - step: Server responds
      desc: WebLogic routes the request to the application and returns a status and body.
    - step: Access line written
      desc: The server appends one line to access.log, which a collector tails.
logs:
  - type: HTTP access
    sourcetype: oracle_weblogic_access
    format: text
    desc: 'One line per request in common log format: client address, user, timestamp, request line, status and bytes. This sample is a successful GET for an image resource of the MedRec sample application. The sample uses documentation addresses.'
    sample: 203.0.113.8 - - [26/Mar/2022:23:40:05 +0530] "GET /medrec/javax.faces.resource/welcome.jpg.xhtml?ln=img&amp;con=bayland HTTP/1.1" 200 844071
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections: []
optimizations:
  - title: Drop static resource requests
    saving: much of the access volume
    fn: Drop
    how: Images, stylesheets and scripts make up a large share of requests and say little about application security. Drop them and keep page, API and error requests.
    expr: /\.(jpg|jpeg|png|gif|css|js|ico)(\.xhtml)?(\?|\s)/.test(message)
references: []
