id: goflow2
name: GoFlow2
short: GoFlow2
vendor: netsampler
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - GoFlow
tags:
  - sflow
  - netflow
  - ipfix
  - json
summary: GoFlow2 is an open-source collector for sFlow, NetFlow and IPFIX. Routers and switches send sampled packet headers to it, and GoFlow2 decodes them into one JSON object per sample. It does not store the flows and it does not alert. A collector downstream of GoFlow2 does. This stream is sFlow v5. The project is the maintained fork of the GoFlow collector first published by Cloudflare.
sourcetypes:
  - st: goflow2_sflow
    desc: One sFlow v5 sample decoded by GoFlow2. The sampler, the interfaces, the addresses, the ports and the sampling rate are the flow.
facts:
  Product: Open-source NetFlow, IPFIX and sFlow collector. It decodes samples and emits them. It is not a router.
  Where it runs: A host or container you run. By default it listens for sFlow on UDP 6343 and for NetFlow and IPFIX on UDP 2055.
  Log transport: The samples arrive as UDP from the network devices. GoFlow2 writes JSON, to stdout or to a log shipper.
  Log format: One JSON object per flow sample. type SFLOW_5 is an sFlow v5 record.
  What a sample answers: Which device sampled the packet, which interfaces it crossed, who talked to whom, on which ports, and how many packets the one sample stands for
  What sampling_rate answers: How many real packets one record represents. A rate of 1000 means the counters under-count by that factor.
placement:
  slots:
    - internal
    - edge
  items:
    - slot: internal
      title: GoFlow2 collector
      desc: The collector process sits where it can receive UDP from the routers and switches. It prints one JSON object per sample. A log collector reads that output.
    - slot: edge
      title: Sampler
      desc: sampler_address is the router or switch that took the sample, not the host running GoFlow2. in_if and out_if are interfaces on that device.
howItWorks:
  - title: Sampling
    body: sFlow copies one packet in every N and sends the header, plus the sampler's address and interface numbers, to a collector. GoFlow2 decodes the sFlow v5 datagram and emits one JSON object per sample. NetFlow and IPFIX are the other listeners. They use templates and can take a minute to start decoding. This stream is the sFlow output.
  - title: One JSON sample
    body: type SFLOW_5 says the protocol. sampler_address is the device that sampled. src_addr, dst_addr, src_port, dst_port and proto are the conversation. in_if and out_if are the interfaces. bytes is the sample size. sampling_rate is the multiplier. The addresses in the sample are documentation addresses.
  - title: How the JSON leaves
    body: GoFlow2 writes the objects itself, by default as JSON on standard output. Any collector that can read a process's output, or a file, or a socket GoFlow2 is pointed at, can take them. GoFlow2 does not choose the destination.
traffic:
  handles:
    - sFlow v5 samples
    - NetFlow and IPFIX flows on the collector's other listeners
    - Sampled packet headers, interfaces and sampling rate
  flow:
    - step: A device samples a packet
      desc: A router or switch copies a packet header and sends an sFlow datagram to GoFlow2.
    - step: GoFlow2 decodes it
      desc: The collector turns one sample into one JSON object with the addresses, ports, interfaces and sampling rate.
    - step: A collector reads the JSON
      desc: Something downstream reads the JSON and can forward it anywhere.
logs:
