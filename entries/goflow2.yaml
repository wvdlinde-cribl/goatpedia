    sourcetype: goflow2_sflow
    format: json
    desc: One sFlow v5 sample. sampler_address is the device that sampled. src_addr, dst_addr, proto and the ports are the conversation. sampling_rate is how many packets this one record stands for. The addresses in this sample are documentation addresses.
    sample: '{"type":"SFLOW_5","time_flow_start_ns":1722384059314899700,"sampler_address":"198.51.100.15","sequence_num":44555,"in_if":563,"out_if":573,"src_addr":"198.51.100.25","dst_addr":"203.0.113.8","etype":"IPv4","proto":"TCP","src_port":10876,"dst_port":443,"src_vlan":1500,"dst_vlan":1500,"sampling_rate":1000,"bytes":70}'
    key:
      - type
      - time_flow_start_ns
      - sampler_address
      - sequence_num
