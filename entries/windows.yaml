summary: Windows is logged by the Elastic integrations package windows. The Pack Generator samples pool holds fixture events for 4 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: windows_forwarded
    desc: 'Elastic integrations fixture, 20 events. Upstream: windows/data_stream/forwarded/_dev/test/pipeline/test-sysmon-operational-events.json'
  - st: windows_powershell_operational
    desc: 'Elastic integrations fixture, 20 events. Upstream: windows/data_stream/powershell_operational/_dev/test/pipeline/test-events.json'
  - st: windows_sysmon_operational
    desc: 'Elastic integrations fixture, 20 events. Upstream: windows/data_stream/sysmon_operational/_dev/test/pipeline/test-events.json'
  - st: windows_windows_defender
    desc: 'Elastic integrations fixture, 20 events. Upstream: windows/data_stream/windows_defender/_dev/test/pipeline/test-events-windows-defender-events.json'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: windows
  Sourcetypes: '4'
  Fixture events: '80'
  Log format seen: xml, text
  Fields in the first fixture: Provider.Name, Provider.Guid, EventID, Version, Level, Task
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Windows events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries Provider.Name, Provider.Guid, EventID, Version, Level, Task. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - xml
  flow:
    - step: Collect
      desc: The Elastic integrations package reads windows and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as xml / text.
