    sourcetype: cisco:umbrella:dns
    format: csv
    share: 80–95 %
    avg: ~250 B
    desc: One line per DNS query (v10 field order). Identity, internal and external IP, action, query type, response code, domain and categories. The core Umbrella log.
    fields:
      - timestamp
      - most_granular_identity
      - identities
      - internal_ip
      - external_ip
      - action
      - query_type
      - response_code
      - domain
      - categories
      - most_granular_identity_type
      - identity_types
      - blocked_categories
      - rule_id
      - destination_countries
      - organization_id
    key:
      - most_granular_identity
      - internal_ip
      - action
      - query_type
      - domain
      - categories
      - blocked_categories
    noise:
      - identities
      - identity_types
      - organization_id
      - destination_countries
