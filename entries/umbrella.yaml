summary: Cloud-delivered protective DNS (born as OpenDNS) that resolves every query through Cisco's anycast resolvers and blocks domains by security and content category before a connection is made. The SIG tiers add a secure web gateway, cloud-delivered firewall, DLP and CASB. Logs are CSV files written every few minutes to an S3 bucket (Cisco-managed or your own) — one folder each for DNS, proxy and firewall.
sourcetypes:
  - st: cisco:umbrella:dns
    desc: Splunk add-on name for Umbrella DNS logs (S3 CSV)
  - st: cisco:umbrella:proxy
    desc: Splunk add-on name for Umbrella secure web gateway (proxy) logs
  - st: cisco:umbrella:cloudfirewall
    desc: Splunk add-on name for Umbrella cloud-delivered firewall logs
  - st: cisco_umbrella
    desc: Generic name for Umbrella logs (any of the S3 log types)
  - st: cisco_cloud_security_dns
    desc: DNS logs as named by the Cisco Security Cloud app (cisco:cloud_security:dns) — same CSV for Umbrella and Secure Access
  - st: cisco_cloud_security_firewall
    desc: Cloud-delivered firewall logs (cisco:cloud_security:firewall)
  - st: cisco_cloud_security_proxy
    desc: Secure web gateway / proxy logs (cisco:cloud_security:proxy)
  - st: UMBRELLA_DNS
    desc: Google SecOps (Chronicle) log type for Umbrella DNS
  - st: cisco_umbrella_dns
    desc: 'Datadog integrations-core fixture, 5 events. Upstream: cisco_umbrella_dns/assets/logs/cisco-umbrella-dns_tests.yaml'
facts:
  First released: 2012 (OpenDNS Umbrella); OpenDNS resolvers since 2006; Cisco since 2015
  Delivery model: SaaS — global anycast DNS resolvers plus SIG data centers; converging into Cisco Secure Access
  Deployment modes: Network egress IP registration, Virtual Appliance (internal IP / AD identity), Roaming client / Secure Client module, SIG IPsec tunnels, PAC / proxy chaining
  Identities: Networks, Sites, Roaming Computers, AD Users and Computers, Network Devices, Chromebooks, mobile
  Log transport: CSV files (gzip) to an S3 bucket — Cisco-managed or customer-owned — under dnslogs/, proxylogs/, firewalllogs/; Reporting API for queries
  Log format: Quoted CSV, versioned schema (DNS log v10 has 16 fields); optional header row
  Typical volume: Every DNS query of every identity — usually the highest event count of any security source per user
placement:
  slots:
    - cloud
    - edge
    - internal
    - remote
  items:
    - slot: cloud
      title: Anycast resolvers and SIG
      desc: Umbrella resolvers answer queries and apply policy; SIG data centers host the proxy and cloud firewall for tunneled traffic.
    - slot: edge
      title: Network egress
      desc: Simplest deployment — point the DHCP or internal DNS forwarders at Umbrella and register the egress IP; logs then show the network identity only.
    - slot: internal
      title: Virtual Appliances
      desc: Conditional DNS forwarders inside the network that add internal IP and AD user/computer identity (with the AD connector) before forwarding to Umbrella.
    - slot: remote
      title: Roaming client / Secure Client
      desc: The Umbrella roaming module on laptops sends DNS (and optionally web traffic) to Umbrella off-network and tags the query with the device identity.
howItWorks:
  - title: Protective DNS
    body: Every query is resolved by Umbrella. If the domain falls in a blocked security category (Malware, Phishing, Command and Control, Newly Seen Domains, Cryptomining, DNS Tunneling VPN) or content category, Umbrella answers with the IP of a block page instead of the real address. The connection never starts, so DNS logs are both the verdict and the evidence.
  - title: Identity-aware policy
    body: Umbrella decides which policy applies by the most granular identity it can see — AD user beats roaming computer beats internal network beats egress network. Both the most granular identity and the full identity list land in each log line.
  - title: Intelligent proxy
    body: For "grey" domains (mixed reputation, e.g. shared hosting), DNS answers point to Umbrella's selective proxy, which inspects the URL and file before allowing it. Those requests show up in proxy logs, not only DNS.
  - title: Secure Internet Gateway
    body: The SIG tiers add a full secure web gateway (TLS decryption, AV and AMP file reputation, URL categories, DLP, CASB controls) and a layer 3/4 cloud-delivered firewall for traffic sent over IPsec tunnels or the roaming client.
  - title: Logging to S3
    body: "Umbrella writes CSV files per log type into an S3 bucket every few minutes, in date folders (dnslogs/<yyyy-mm-dd>/…csv.gz). A Cisco-managed bucket keeps data for a limited retention window; a customer-owned bucket keeps it as long as you want. Collectors (Cribl S3 Source, Splunk add-on, Sentinel connector) poll the bucket."
traffic:
  handles:
    - Recursive DNS (UDP/TCP 53), DNSCrypt, DoH
    - HTTP / HTTPS via selective proxy and SWG
    - All ports via cloud-delivered firewall (SIG tunnels)
    - File reputation (AMP / Secure Endpoint)
    - SaaS app discovery and control (CASB)
  flow:
    - step: Query
      desc: Device or forwarder sends a DNS query to Umbrella (anycast), optionally tagged with identity by VA or roaming client.
    - step: Identify
      desc: Most granular identity determined; matching policy selected.
    - step: Categorize
      desc: Domain looked up against security and content categories (Talos intelligence).
    - step: Answer
      desc: Real IP (allowed), block page IP (blocked) or selective-proxy IP (grey domain).
    - step: Proxy / firewall
      desc: SIG traffic additionally inspected by SWG and cloud firewall.
    - step: Log
      desc: CSV line written to the S3 log bucket per log type.
logs:
