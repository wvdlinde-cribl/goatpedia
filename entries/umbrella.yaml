cves:
  - id: CVE-2018-0437
    cvss: 7.8
    year: 2018
    kev: false
    scope: device
    title: Umbrella Enterprise Roaming Client / Roaming Module privilege escalation to Administrator
    affected: Umbrella Enterprise Roaming Client for Windows before 2.1.118; Umbrella Roaming Module for AnyConnect before 4.6.1098
    fixed: ERC 2.1.118; Roaming Module 4.6.1098
    detect: Not visible in DNS logs. Inventory roaming client versions (Umbrella deployment report) and alert on executables written to the client's program directories by non-admin users (EDR).
    avoid: Upgrade the roaming client / migrate to Cisco Secure Client; remove local admin rights.
  - id: CVE-2020-3153
    cvss: 6.5
    year: 2020
    kev: true
    scope: device
    title: AnyConnect Secure Mobility Client for Windows uncontrolled search path — the client that hosts the Umbrella roaming module
    affected: Cisco AnyConnect Secure Mobility Client for Windows before 4.8.02042
    fixed: 4.8.02042
    detect: Roaming computers whose DNS logs show old client builds or that suddenly stop appearing as Roaming Computers identities; on the host, DLLs dropped into system directories by the installer process.
    avoid: Upgrade to a fixed AnyConnect / Secure Client release; restrict local logon; monitor installer activity.
  - id: CVE-2026-20246
    cvss: 6.0
    year: 2026
    kev: false
    scope: device
    title: Umbrella Virtual Appliance vmadmin CLI privilege escalation to root
    affected: Cisco Umbrella Virtual Appliance before 3.8.5
    fixed: 3.8.5
    detect: Not in the DNS logs. Watch VA console/SSH access and configuration changes; a compromised VA can mis-attribute identities, so sudden changes in internal_ip / AD identity mapping are a symptom.
    avoid: Upgrade VAs to 3.8.5+; restrict vmadmin console access; keep VAs on isolated management segments.
  - id: CVE-2020-1350
    cvss: 10
    year: 2020
    kev: true
    scope: traffic
    title: SIGRed — Windows DNS Server RCE via malicious SIG responses (internal resolvers that forward to Umbrella)
    affected: Windows Server 2008 – 2019 DNS servers before the July 2020 updates
    fixed: Microsoft July 2020 security updates
    detect: DNS logs showing internal forwarders resolving attacker-controlled domains with SIG/TXT query types and oversized TCP responses; blocks in categories Malware / Command and Control from domain controllers' internal IPs.
    avoid: Patch Windows DNS; apply the TcpReceivePacketSize workaround if patching is delayed; keep forwarders' upstream restricted to Umbrella.
  - id: CVE-2023-50387
    cvss: 7.5
    year: 2023
    kev: false
    scope: traffic
    title: KeyTrap — DNSSEC validation CPU exhaustion against validating resolvers
    affected: DNSSEC-validating resolvers (BIND, Unbound, PowerDNS, Knot, Windows DNS and others) before vendor patches
    fixed: Vendor resolver updates (February 2024)
    detect: Spikes of queries to a handful of domains with SERVFAIL response codes from internal forwarders; long-tail domains with many DNSSEC keys.
    avoid: Patch internal validating resolvers; forwarding to Umbrella offloads validation from internal servers.
detections:
  - title: Blocked security-category lookups per host
    severity: high
    signals:
      - action=Blocked
      - blocked_categories Malware / Command and Control / Phishing
      - count per identity
    why: A host repeatedly resolving C2 or malware domains is almost always infected — the block stops the connection but not the malware. Hand the host to EDR.
    kql: |-
      dataset="umbrella_logs" sourcetype="cisco:umbrella:dns" action="Blocked"
      | where blocked_categories has_any ("Malware","Command and Control","Phishing","Cryptomining")
      | summarize hits=count(), domains=dcount(domain) by most_granular_identity, internal_ip, blocked_categories
    mitre:
      - T1071.004
      - T1568
  - title: Allowed lookups of newly seen domains (DGA)
    severity: medium
    signals:
      - action=Allowed
      - categories has Newly Seen Domains
      - many unique domains per host
    why: Domain-generation malware resolves dozens of never-seen-before domains; a human rarely produces more than a few per hour.
    kql: |-
      dataset="umbrella_logs" sourcetype="cisco:umbrella:dns" action="Allowed"
      | where categories has "Newly Seen Domains"
      | summarize uniq=dcount(domain), nx=countif(response_code == "NXDOMAIN") by most_granular_identity, bin(_time, 1h)
      | where uniq > 25 or nx > 50
    mitre:
      - T1568.002
  - title: DNS tunnelling
    severity: high
    signals:
      - query_type 16 (TXT) or 10 (NULL)
      - many unique subdomains of one parent
      - categories DNS Tunneling VPN
    why: Tunnelling tools (iodine, dnscat2, Cobalt Strike DNS beacons) encode data in labels and TXT records — volume per parent domain gives them away.
    kql: |-
      dataset="umbrella_logs" sourcetype="cisco:umbrella:dns"
      | extend parent=extract("([^.]+\\.[^.]+)\\.?$", 1, domain)
      | summarize uniq=dcount(domain), txt=countif(query_type == "16 (TXT)") by most_granular_identity, parent, bin(_time, 1h)
      | where uniq > 200 or txt > 100
    mitre:
      - T1071.004
      - T1048.003
  - title: Malicious file allowed through the proxy
    severity: high
    signals:
      - cisco:umbrella:proxy
      - amp_disposition=Malicious or av_detections not empty
      - action=ALLOWED
    why: A file with a malicious AMP verdict that was not blocked reached the endpoint — check whether it executed.
    kql: |-
      dataset="umbrella_logs" sourcetype="cisco:umbrella:proxy" action="ALLOWED"
      | where amp_disposition == "Malicious" or isnotempty(av_detections)
      | summarize count() by policy_identity_label, internal_client_ip, url, sha256, amp_malware_name
    mitre:
      - T1105
      - T1204.002
  - title: Outbound SMB / RDP to the internet blocked by cloud firewall
    severity: medium
    signals:
      - cisco:umbrella:cloudfirewall
      - destination_port 445 / 3389
      - direction OUTBOUND
    why: Outbound SMB to the internet leaks NTLM hashes and is used by worms; outbound RDP from a branch is often a remote-access tool or data theft.
    kql: |-
      dataset="umbrella_logs" sourcetype="cisco:umbrella:cloudfirewall" direction="OUTBOUND"
      | where destination_port in ("445","3389")
      | summarize sessions=count(), dests=dcount(destination_ip) by identities, source_ip, destination_port, action
    mitre:
      - T1048
      - T1021.001
optimizations:
  - title: Aggregate allowed DNS to metrics
    saving: 40–70 %
    fn: Aggregations
    how: Allowed queries to common, well-categorized domains are the bulk of volume and rarely queried one by one. Roll them up to counts per identity, domain and query type per 5 minutes; keep raw in Lake.
    expr: action=='Allowed' && !/Newly Seen|Uncategorized|Malware|Command and Control|Phishing/.test(categories)
  - title: Suppress repeated identical lookups
    saving: 10–25 %
    fn: Suppress
    how: Short TTLs and chatty apps re-query the same name constantly. Keep one line per identity, domain and action per 60 s with a count.
    expr: "key: `${most_granular_identity}:${domain}:${action}`  allow 1 / 60s"
  - title: Drop redundant columns
    saving: 15–25 %
    fn: Parser → Serialize
    how: identities and identity_types repeat the most granular values plus parents, organization_id is constant per tenant, and empty columns are quoted empty strings. Remove them and re-serialise.
    expr: "remove: identities, identity_types, organization_id, destination_list_ids; drop empty"
  - title: Route by verdict
    saving: SIEM licence
    fn: Routes
    how: Blocked DNS, proxy and firewall lines plus allowed lines in risky categories go to the SIEM. Everything else goes to Cribl Lake straight from the S3 collector for replay.
    expr: action!='Allowed' || /Newly Seen|Uncategorized/.test(categories) → SIEM ; else → Lake
