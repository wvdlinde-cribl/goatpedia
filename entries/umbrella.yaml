id: umbrella
name: Cisco Umbrella
short: Umbrella
aka:
  - OpenDNS Umbrella
  - Cisco Umbrella DNS Security
  - Cisco Umbrella SIG
  - Cisco Secure Access (successor SSE)
  - Umbrella Roaming Client
