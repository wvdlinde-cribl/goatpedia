summary: Junos OS is the operating system on Juniper routers, switches and firewalls. The device writes syslog when a process starts, a protocol changes state, an administrator signs in, or a task runs long. This stream is that syslog, one text line per event. Any collector can receive it. The message code in the sample is RPD_SCHED_TASK_LONGRUNTIME, which the routing daemon emits when a scheduled task runs long.
sourcetypes:
  - st: juniper_junos
    desc: Junos syslog. One line is one message from a process on the device. The message code is the part to read.
facts:
  Product: Operating system for Juniper routers, switches and firewalls
  Form factor: Juniper hardware and virtual appliances running Junos
  Log transport: Syslog from the device
  Log format: One text line. A standard line has a timestamp, a process and a message code such as RPD_SCHED_TASK_LONGRUNTIME, then the text.
  What a line answers: Which process reported which message code, and the text that follows the code
placement:
  slots:
    - edge
    - internal
  items:
    - slot: edge
      title: Routers and firewalls
      desc: Junos devices at the edge write syslog for routing, security and admin events. A collector receives the lines.
    - slot: internal
      title: Core and switching
      desc: Switches and core routers use the same syslog. The process name and the message code say which subsystem spoke.
howItWorks:
  - title: One syslog line
    body: A Junos message carries a timestamp, the process that emitted it, a message code, and a sentence. The code is the stable part. RPD_ is the routing protocol daemon. Other prefixes belong to other processes, such as login or the chassis daemon.
  - title: This sample
    body: The message code is RPD_SCHED_TASK_LONGRUNTIME. That is the routing daemon reporting that a scheduled task ran long. The numbers in the text are the run time the daemon recorded. Match on that code. The leading token on this line is stray text.
  - title: How the lines leave
    body: Junos sends syslog to the hosts configured under system syslog. Any collector can receive it.
traffic:
  handles:
    - Routing-daemon messages
    - Process and chassis events
    - Administrator and login messages on the same syslog stream
  flow:
    - step: A process reports
      desc: A Junos daemon hits a condition, such as a task that ran long, a protocol change, or a sign-in.
    - step: Junos writes a line
      desc: The line carries a message code and the text.
    - step: Collector receives syslog
      desc: A collector takes the line and can forward it anywhere.
logs:
  - type: System log
    sourcetype: juniper_junos
    format: text
    desc: One syslog line. Read the message code. This sample's code is RPD_SCHED_TASK_LONGRUNTIME, a routing-daemon notice that a scheduled task ran long.
    sample: 'Jan 29 06:09:59 ceroinBC.exe[6713]: RPD_SCHED_TASK_LONGRUNTIME: : exe ran for 7309(5049)'
    pattern: (?<message>[\s\S]+)
    key:
      - message
