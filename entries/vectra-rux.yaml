id: vectra-rux
name: Vectra Respond UX
short: Vectra RUX
vendor: Vectra AI
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Vectra RUX
  - Respond UX
tags:
  - ndr
  - detection
  - json
summary: Vectra Respond UX is the Vectra AI platform interface and its API. Sensors and the brain score hosts and accounts, raise detections, and can disable an account or a host while an investigation is open. The platform also records who changed settings, and it reports the health of the brain and the sensors. Five JSON streams cover audit, detections, entity scores, health and lockdown. A collector pulls them from the platform API.
sourcetypes:
  - st: vectra_rux_audit
    desc: One change an administrator or an API client made in the platform, with the user and the result
  - st: vectra_rux_detection_event
    desc: One detection, with its category, threat and certainty, and the entity it is about
  - st: vectra_rux_entity_event
    desc: One entity score update, with urgency, severity and the detections currently on that entity
  - st: vectra_rux_health
    desc: One health report for the brain and its sensors, covering CPU, memory, disk and connectivity
  - st: vectra_rux_lockdown
    desc: One lockdown of an account or a host, including who locked it and when it was unlocked
facts:
  Product: The Respond UX console and API of the Vectra AI platform. It exposes detections, entity scores, lockdown and platform health
  Where it sits: The brain is an appliance or a cloud instance. Sensors sit on the internal network or in cloud accounts and pair to that brain
  Log transport: HTTPS JSON from the platform API on the brain or the Vectra portal. Audit, detections, entity scoring, health and lockdown are separate resources
  Log format: One JSON object per event. Timestamps are event_timestamp except on lockdown, which uses lock_event_timestamp
  What a detection answers: Which entity, what detection type, and the threat and certainty
  What a lockdown answers: Which account or host was disabled, who did it, and when it was released
  What an audit event answers: Who changed a platform object, and whether it succeeded
placement:
  slots:
    - cloud
    - internal
  items:
    - slot: cloud
      title: Vectra portal
      desc: Respond UX in the Vectra cloud serves the same API. Detection URLs in the sample point at a portal host. A collector polls that API. The destination is a choice of the pipeline.
    - slot: internal
      title: Brain and sensors
      desc: The brain scores entities and can order a lockdown through an identity provider. Health names each paired sensor, its address and whether metadata is flowing. Sensor addresses in the sample are documentation addresses.
howItWorks:
  - title: Detections and entity scores
    body: A detection event is one security event. detection_type and d_type_vname name it. category is the attack grouping, such as command_and_control. threat and certainty are the scores. entity_uid and src_entity name the account or host. The sample detection is Azure AD Redundant Access Creation. An entity event is the score of that account or host over time. urgency_score, severity and urgency_reason say how the platform is ranking it, and active_detection_types lists what is still open.
  - title: Lockdown and audit
    body: Lockdown is a response action. type is account or host. entity_name is who was locked. locked_by is the operator. lock_event_timestamp and unlock_event_timestamp bound the window. The sample locks an account and later unlocks it. Audit is administration of the platform. username, user_role and source_ip are the actor. event_action and event_object are the change. result_status is success or not. The sample updates tags on an account and succeeds.
  - title: Health
    body: A health document is the brain checking itself. memory, cpu and disk are utilization. sensors lists paired sensors and their status. system.version names the Vectra version and whether this brain is bridged to the cloud. connectivity and trafficdrop say whether sensor metadata is arriving. This is operations data, not a detection.
  - title: How the API is collected
    body: A collector with API credentials calls the brain or the portal and pages each resource. Any collector can do this. Goatpedia reads these samples as JSON.
traffic:
  handles:
    - Detections and entity score changes
    - Account and host lockdown
    - Administration of the Vectra platform
    - Health of the brain and sensors
  flow:
    - step: The brain scores activity
      desc: Sensors send metadata to the brain. The brain opens or updates a detection and rescores the entity.
    - step: An operator may respond
      desc: An analyst or an automatic rule locks an account or a host. Administrators also edit tags and other platform objects.
    - step: Collector polls the API
      desc: A collector requests audit, detections, entity events, health and lockdown as separate JSON lists.
logs:
  - type: Audit
    sourcetype: vectra_rux_audit
    format: json
    desc: One object per platform change. event_action and event_object say what changed. This sample updates account tags and result_status is success. username is admin, from a documentation source_ip. user_type is API_CLIENT.
    sample: '{"id":212,"user_id":1,"username":"admin","user_type":"API_CLIENT","api_client_id":"0cc5c3a9-4b1d-4b3a-9c5c-3a9b1d4b3a9b","user_role":"Security Analyst","version":"2022.0.0","source_ip":"198.51.100.25","event_timestamp":"2025-01-01T00:00:00.000Z","message":"[table:linked_account][id:1] with tags [] was changed to [''tag1'', ''tag2'', ''tag3'', ''tag4'', ''tag5'', ''tag6'']","result_status":"success","event_data":{},"event_object":"account_tags","event_action":"updated"}'
    key:
      - id
      - user_id
      - username
      - user_type
  - type: Detection
    sourcetype: vectra_rux_detection_event
    format: json
    desc: One object per detection. detection_type names it and category groups it. This sample is Azure AD Redundant Access Creation, category command_and_control, threat 50 and certainty 50. entity_uid is the account. mitre lists the technique id the platform attached.
    sample: '{"id":28538,"category":"command_and_control","threat":50,"certainty":50,"triaged":false,"detection_type":"Azure AD Redundant Access Creation","url":"https://207031206993.uw2.devportal.vectra.ai/detections/959","d_type_vname":"Azure AD Redundant Access Creation","detection_id":959,"detection_href":"https://207031206993.uw2.devportal.vectra.ai/detections/959?detail_id=94341","entity_id":1,"type":"account","entity_href":"https://207031206993.uw2.devportal.vectra.ai/accounts/1","entity_uid":"O365:ServicePrincipal_3fb87dda-882a-49e1-88b9-67d2499b2fd4","src_entity":"O365:ServicePrincipal_3fb87dda-882a-49e1-88b9-67d2499b2fd4","event_timestamp":"2022-09-12T16:31:35Z","mitre":["T1526"],"detail":{},"severity":5}'
    key:
      - id
      - category
      - threat
      - certainty
  - type: Entity score
    sourcetype: vectra_rux_entity_event
    format: json
    desc: One object per entity score update. urgency_score and severity are the rank. This sample is a host-typed entity at severity Low and urgency 0. urgency_reason explains the ranking in a sentence, and active_detection_types lists what is still open. category is ACCOUNT SCORING.
    sample: '{"id":24,"entity_id":100,"breadth_contrib":0,"importance":0,"type":"host","is_prioritized":false,"severity":"Low","urgency_reason":"Ransomware: This entity was prioritized because it was implicated in an active ransomware detection","urgency_score":0,"velocity_contrib":0,"event_timestamp":"2022-08-07T00:14:31Z","name":"AWS:None/us-1-east/config:AWSConfig-Describe","active_detection_types":["AWS S3 Enumeration"],"category":"ACCOUNT SCORING","last_detection":{"id":103,"type":"AWS S3 Enumeration","url":"https://200888808432.uw2.devportal.vectra.ai/detections/103"},"attack_rating":0,"url":"https://200888808432.uw2.devportal.vectra.ai/accounts/8"}'
    key:
      - id
      - entity_id
      - breadth_contrib
      - importance
  - type: Platform health
    sourcetype: vectra_rux_health
    format: json
    desc: One health document. memory.usage_percent, cpu and disk are the brain. sensors lists paired sensors with status and ip_address. This sample's sensors are paired and traffic checks are OK. Sensor addresses are documentation addresses. system.version.vectra_version is the software version.
    sample: '{"memory":{"usage_percent":47,"free_bytes":5597118464,"used_bytes":33078743040,"total_bytes":67444477952,"updated_at":"2025-04-18 07:17:35+00:00"},"trafficdrop":{"sensors":[{"name":"EDR Sensor","error":"All interfaces have traffic volume within range","status":"OK","serial_number":"V421353ef386550fb2f9a959fa3f52aee","luid":"w4ftj0a8","ip_address":"203.0.113.8"},{"name":"XDR Sensor","error":"Interface have traffic volume within range","status":"OK","serial_number":"1421353ef386550fb2f9a959fa3f52aee","luid":"w4ftj0a8","ip_address":"203.0.113.40"}],"updated_at":"2025-04-18 07:17:35+00:00"},"cpu":{"user_percent":30,"nice_percent":0,"system_percent":24.9,"idle_percent":43.9,"updated_at":"2025-04-18 07:17:35+00:00"},"hostid":{"artifact_counts":{"TestEDR":0,"arsenic":0,"carbon_black":0,"cb_cloud":0,"clear_state":0,"cookie":0,"crowdstrike":0,"cybereason":0,"dhcp":6606,"dns":27818,"end_time":0,"fireeye":0,"generic_edr":0,"idle_end":27818,"idle_start":27936,"invalid":0,"kerberos":209,"kerberos_user":0,"mdns":18575,"netbios":15596,"proxy_ip":0,"rdns":0,"sentinelone":0,"split":0,"src_port":0,"static_ip":0,"total":134681,"uagent":10122,"vmachine_info":0,"windows_defender":1},"ip_always_percent":18.52,"ip_sometimes_percent":2.47,"ip_never_percent":79.01,"updated_at":"2025-04-18 07:17:35+00:00"},"network":{"updated_at":"2025-04-18 07:17:34+00:00","vlans":{"vlan_ids":["7","8"],"count":1}},"disk":{"degraded_raid_volume":{"error":"error","output":"output","status":"OK"},"disk_raid":{"error":"error","output":"output","status":"OK"},"disk_utilization":{"free_bytes":10000109,"total_bytes":67444477952,"usage_percent":47,"used_bytes":33078743040},"raid_disks_missing":{"error":"error","output":"output","status":"OK"},"updated_at":"2025-04-18 07:17:34+00:00"},"power":{"status":"SKIP","error":"Power check for this device is not supported","updated_at":"2025-04-18 07:17:35+00:00"},"system":{"uptime":"261 days, 13 hours, 33 minutes","serial_number":"VHE66258a5e8dafe76d9a5dd741abd9