550fb2f9a959fa3f52aee","luid":"w4ftj0a8","ip_address":"192.0.2.10","affected_metadata_hours":["2025-04-18T00:00:00Z","2025-04-18T01:00:00Z"]}],"updated_at":"2025-04-18 07:17:35+00:00"}}'
    key:
      - memory.usage_percent
      - memory.free_bytes
      - memory.used_bytes
      - memory.total_bytes
  - type: Lockdown
    sourcetype: vectra_rux_lockdown
    format: json
    desc: One object per lockdown. entity_name is the account or host and locked_by is who disabled it. This sample locks an account and records unlock_event_timestamp later. The account name uses a documentation email.
    sample: '{"id":1,"type":"account","entity_id":2,"entity_name":"O365:user@example.com","lock_event_timestamp":"2023-03-06T22:30:06Z","locked_by":"vadmin","certainty":0,"unlock_event_timestamp":"2023-04-07T23:50:00Z"}'
    key:
      - id
      - type
      - entity_id
      - entity_name
cves: []
detections:
  - title: Account or host was locked
    severity: high
    signals:
      - entity_name
      - locked_by
      - type
      - lock_event_timestamp
    why: A lockdown disables an account or a host while Vectra holds it. That is a response action, whether an analyst or an automatic rule took it. The sample is an account lock that was later released. Health checks and low entity scores are not this signal.
    kql: |
      dataset="vectra-rux_logs"
      | where sourcetype == "vectra_rux_lockdown"
      | project lock_event_timestamp, unlock_event_timestamp, type, entity_name, locked_by, certainty
    mitre:
      - T1531
  - title: Command-and-control detection
    severity: high
    signals:
      - category
      - detection_type
      - threat
      - certainty
      - entity_uid
    why: category command_and_control is the platform grouping a detection as beaconing or remote control. The sample is an Azure AD redundant-access detection in that category. Entity score updates without a detection are a different stream.
    kql: |
      dataset="vectra-rux_logs"
      | where sourcetype == "vectra_rux_detection_event" and category == "command_and_control"
      | project event_timestamp, detection_type, category, threat, certainty, entity_uid, severity
optimizations:
  - title: Drop platform health
    saving: most of the health-check volume
    fn: Drop
    how: Health is a repeated snapshot of CPU, memory, disk and every sensor. It is most of the operational volume and it is not a detection. Keep detections, lockdown and audit. Drop the health stream before the SIEM.
    expr: "sourcetype == 'vectra_rux_health'"
    stream:
      log: Platform health
      functions:
        - id: drop
          filter: typeof memory === 'object' && typeof cpu === 'object' && typeof sensors !== 'undefined'
          description: Drop Vectra platform health snapshots (CPU, memory, disk, sensors) before the SIEM; detections, lockdown and audit pass
          conf: {}
      expect:
        out: 0
        smaller: true
references:
  - title: Vectra Respond UX API
    url: https://docs.vectra.ai/configuration/access/api-rux

