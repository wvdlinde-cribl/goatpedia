summary: Amazon's public cloud. Customers run compute, networking, storage and managed services in accounts and regions, and each service writes its own logs to CloudWatch Logs or S3. This entry covers several of those service logs, API Gateway access, CloudFront and load balancer access, EC2 and EMR host logs, Lambda function logs, Route 53 resolver queries, and the Inspector and Security Hub findings that summarise risk.
sourcetypes:
  - st: aws_apigateway_logs
    desc: API Gateway access logs, one line per API request with caller IP, method, resource path, status and size
  - st: aws_cloudfront_logs
    desc: CloudFront standard access logs, one tab-separated line per request served by an edge location
  - st: aws_ec2_logs
    desc: Operating system and application logs from EC2 instances shipped to CloudWatch Logs, such as syslog from the instance
  - st: aws_elb_logs
    desc: Load balancer access logs, here from an Application Load Balancer, one line per request with client, target, timings and status
  - st: aws_emr_logs
    desc: Logs from EMR clusters, such as Hadoop, YARN and Spark daemon logs from the cluster nodes
  - st: aws_inspector
    desc: Amazon Inspector findings, vulnerabilities and network reachability issues on EC2, containers and Lambda
  - st: aws_lambda_logs
    desc: Lambda function logs in CloudWatch Logs, including the START, END and REPORT lines of each invocation
  - st: aws_route53_resolver_logs
    desc: Route 53 Resolver query logs, one record per DNS query from a VPC with name, type, response code and source
  - st: aws_securityhub_findings_full_posture
    desc: AWS Security Hub findings in the AWS Security Finding Format, from AWS services and partner products
facts:
  Product: Public cloud platform
  Log destinations: CloudWatch Logs, S3 buckets and Kinesis Data Firehose, chosen per service
  API Gateway and Lambda: Logs go to CloudWatch Logs log groups
  CloudFront and load balancers: Access logs are written as files to an S3 bucket
  Route 53 Resolver: Query logs go to CloudWatch Logs, S3 or Firehose
  Inspector and Security Hub: Findings are JSON, read from the service APIs or through EventBridge
  What an access log answers: Who requested what through which front door, and what status and timing came back
  What a resolver query answers: Which VPC resource looked up which name and what the answer was
  What a finding answers: Which resource has which vulnerability or misconfiguration, and how severe it is
placement:
  slots:
    - cloud
    - edge
  items:
    - slot: edge
      title: CloudFront, API Gateway and load balancers
      desc: These services take client traffic at the edge of the AWS environment and write one access record per request.
    - slot: cloud
      title: VPCs, compute and security services
      desc: EC2, EMR, Lambda and Route 53 Resolver run inside the account's VPCs and write to CloudWatch Logs or S3. Inspector and Security Hub produce findings for the account.
howItWorks:
  - title: Each service logs for itself
    body: There is no single AWS log. Each service is configured to log, and decides where to. API Gateway and Lambda use CloudWatch log groups, CloudFront and ELB write gzip files to S3, Route 53 Resolver query logging can target CloudWatch, S3 or Firehose. EC2 and EMR host logs reach CloudWatch through the CloudWatch agent or EMR's log archiving to S3.
  - title: Access logs
    body: API Gateway access logs use a format the API owner defines, here JSON with requestId, ip, httpMethod, resourcePath and status. CloudFront standard logs are tab-separated with a fixed field list. ALB logs are space-separated with request type, time, load balancer, client, target, processing times, status codes, bytes, request line and user agent.
  - title: Findings
    body: Inspector scans EC2, ECR images and Lambda for package vulnerabilities and network reachability and writes findings with a severity and score. Security Hub collects findings from Inspector, GuardDuty, Config and partners in the AWS Security Finding Format (ASFF), with severity, compliance status and the affected resources.
  - title: How the logs leave AWS
    body: A collector reads S3 objects (usually from an SQS notification), subscribes to CloudWatch log groups, receives a Firehose stream, or queries the finding APIs. Any collector can do this.
traffic:
  handles:
    - HTTP requests through CloudFront, API Gateway and load balancers
    - DNS queries from VPCs
    - Compute workloads on EC2, EMR and Lambda
    - Vulnerability and posture findings
  flow:
    - step: Activity happens
      desc: A client calls an API or site, a function runs, an instance logs, or a VPC resource resolves a name.
    - step: Service writes
      desc: The service writes the record to CloudWatch Logs or to an S3 bucket, or raises a finding.
    - step: Collector reads
      desc: A collector reads the log group, the S3 objects or the finding API.
logs:
  - type: API Gateway access
    sourcetype: aws_apigateway_logs
    format: json
    desc: One JSON object per API request. ip is the caller, httpMethod and resourcePath the call, status the result, requestId the id to trace it. The IP is a documentation address.
    sample: '{"requestId":"48752d0f-c99d-4cfa-a5a7-f3c6834d19e5","ip":"192.0.2.10","caller":"-","user":"-","requestTime":"10/Jun/2023:15:36:28 +0000","httpMethod":"GET","resourcePath":"/pets","status":"200","protocol":"HTTP/1.1","responseLength":"184"}'
    key:
      - requestId
      - ip
      - caller
      - user
  - type: CloudFront access
    sourcetype: aws_cloudfront_logs
    format: text
    desc: One tab-separated line per request at an edge location. Fields include date, time, edge location, bytes, client IP, method, host, URI, status, user agent, result type, protocol and TLS version. The client is a documentation address.
    sample: "2019-12-04\t21:02:31\tLAX1\t392\t192.0.2.20\tGET\td111111abcdef8.cloudfront.net\t/index.html\t200\t-\tMozilla/5.0%20(Windows%20NT%2010.0;%20Win64;%20x64)%20AppleWebKit/537.36%20(KHTML,%20like%20Gecko)%20Chrome/78.0.3904.108%20Safari/537.36\t-\t-\tHit\tSOX4xwn4XV6Q4rgb7XiVGOHms_BGlTAC4KyHmureZmBNrjGdRLiNIQ==\td111111abcdef8.cloudfront.net\thttps\t23\t0.001\t-\tTLSv1.2\tECDHE-RSA-AES128-GCM-SHA256\tHit\tHTTP/2.0\t-\t-\t11040\t0.001\tHit\ttext/html\t78\t-\t-"
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: EC2 instance logs
    sourcetype: aws_ec2_logs
    format: text
    desc: One line per log message from an instance, a timestamp followed by the instance's syslog line. This sample is systemd stopping a user slice.
    sample: '2020-02-20T07:01:01.000Z Feb 20 07:01:01 ip-172-31-81-156 systemd: Stopping User Slice of root.'
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: Load balancer access
    sourcetype: aws_elb_logs
    format: text
    desc: One space-separated line per request through an Application Load Balancer. The fields are type, time, load balancer, client and target address, processing times, status codes, bytes, request, user agent, target group and actions. Addresses are documentation addresses.
    sample: http 2018-07-02T22:23:00.186641Z app/my-loadbalancer/50dc6c495c0c9188 198.51.100.15:2817 198.51.100.25:80 0.000 0.001 0.000 200 200 34 366 "GET http://www.example.com:80/ HTTP/1.1" "curl/7.46.0" - - arn:aws:elasticloadbalancing:us-east-2:123456789012:targetgroup/my-targets/73e2d6bc24d8a067 "Root=1-58337262-36d228ad5d99923122bbe354" "-" "-" 0 2018-07-02T22:22:48.364000Z "forward,redirect" "-" "-" "203.0.113.8:80" "200" "-" "-"
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: EMR cluster logs
    sourcetype: aws_emr_logs
    format: text
    desc: One line per log message from a cluster daemon, with time, level, component and text. This sample is the Hadoop NameNode starting.
    sample: '2023-06-26 13:45:49,685 INFO namenode.NameNode: STARTUP_MSG:'
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: Inspector findings
    sourcetype: aws_inspector
    format: json
    desc: One object per finding. type and severity say what kind and how serious, status whether it is active, inspectorScore the score, packageVulnerabilityDetails or networkReachabilityDetails the evidence, resources the affected resource.
    sample: '{"awsAccountId":"123456789","description":"Findins message","findingArn":"arn:aws:s32001:db8::1sample","firstObservedAt":"1.663703546405E9","inspectorScore":1.2,"inspectorScoreDetails":{"adjustedCvss":{"adjustments":[{"metric":"Base","reason":"use Base metric"}],"cvssSource":"scope1","score":8.9,"scoreSource":"scope2","scoringVector":"Attack Vector","version":"v3.1"}},"lastObservedAt":"1.663703546405E9","networkReachabilityDetails":{"networkPath":{"steps":[{"componentId":"02ce3860-3126-42af-8ac7-c2a661134129","componentType":"type"}]},"openPortRange":{"begin":1234,"end":4567},"protocol":"TCP"},"packageVulnerabilityDetails":{"cvss":[{"baseScore":1.1,"scoringVector":"Attack Vector","source":"scope3","version":"v3.1"}],"referenceUrls":["https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2019-6111"],"relatedVulnerabilities":["security"],"source":"example","sourceUrl":"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2019-6111","vendorCreatedAt":"1.663703546405E9","vendorSeverity":"basic","vendorUpdatedAt":"1.663703546405E9","vulnerabilityId":"123456789","vulnerablePackages":[{"arch":"arch","epoch":123,"filePath":"/example","fixedInVersion":"3","name":"example","packageManager":"BUNDLER","release":"release","sourceLayerHash":"50d858e0985ecc7f60418aaf0cc5ab587f42c2570a884095a9e8ccacd0f6545c","version":"2.0"}]},"remediation":{"recommendation":{"text":"example","Url":"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2019-6111"}},"resources":[{"details":{"awsEc2Instance":{"iamInstanceProfileArn":"arn:aws:s32001:db8::1iam","imageId":"123456789","ipV4Addresses":["203.0.113.40","192.0.2.10"],"ipV6Addresses":["2a02:cf40::"],"keyName":"sample","launchedAt":"1.663703546405E9","platform":"EC2","subnetId":"123456","type":"Instance","vpcId":"3265875"},"awsEcrContainerImage":{"architecture":"arch","author":"example","imageHash":"50d858e0985ecc7f60418aaf0cc5ab587f42c2570a884095a9e8ccacd0f6545d","imageTags":["sample"],"platform":"ECR","pushedAt":"1.663703546405E9","registry":"ecr registry","repositoryName":"sample"}},"id":"12345678","partition":"partition","region":"us-east-1","tags":{"string1":"string1","string2":"string2"},"type":"AWS_EC2_INSTANCE"}],"severity":"INFORMATIONAL","status":"ACTIVE","title":"sample findings","type":"NETWORK_REACHABILITY","updatedAt":"1.663703546405E9"}'
    key:
      - awsAccountId
      - description
      - findingArn
      - firstObservedAt
  - type: Lambda function logs
    sourcetype: aws_lambda_logs
    format: text
    desc: One line per function log message. Each invocation writes START, then the function's own output, then END and REPORT with duration and memory. This sample is a START line.
    sample: 'START RequestId: 6bc28136-xmpl-4365-b021-0ce6b2e64ab0 Version: $LATEST'
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: Route 53 Resolver queries
    sourcetype: aws_route53_resolver_logs
    format: json
    desc: One object per DNS query. query_name and query_type are the question, rcode the answer code, srcaddr the VPC resource that asked, vpc_id where. This sample is an NXDOMAIN. The source is a documentation address.
    sample: '{"version":"1.100000","account_id":"626345947581","region":"us-east-1","vpc_id":"vpc-01e31a7c","query_timestamp":"2021-12-11T22:46:23Z","query_name":"does-not-exist.abc.com.","query_type":"A","query_class":"IN","rcode":"NXDOMAIN","answers":[],"srcaddr":"192.0.2.20","srcport":"48701","transport":"UDP","srcids":{}}'
    key:
      - version
      - account_id
      - region
      - vpc_id
  - type: Security Hub findings
    sourcetype: aws_securityhub_findings_full_posture
    format: json
    desc: One ASFF object per finding. Title, Description and FindingProviderFields.Severity describe it, Compliance.Status gives control status, Resources the affected resources, Network and Action the network evidence. Addresses are documentation addresses.
    sample: '{"Action":{"ActionType":"PORT_PROBE","PortProbeAction":{"PortProbeDetails":[{"LocalPortDetails":{"Port":80,"PortName":"HTTP"},"LocalIpDetails":{"IpAddressV4":"198.51.100.15"},"RemoteIpDetails":{"Country":{"CountryName":"Example Country"},"City":{"CityName":"Example City"},"GeoLocation":{"Lon":0,"Lat":0},"Organization":{"AsnOrg":"ExampleASO","Org":"ExampleOrg","Isp":"ExampleISP","Asn":64496}}}],"Blocked":false}},"AwsAccountId":"111111111111","CompanyName":"AWS","Compliance":{"RelatedRequirements":["Req1","Req2"],"Status":"PASSED","StatusReasons":[{"ReasonCode":"CLOUDWATCH_ALARMS_NOT_PRESENT","Description":"CloudWatch alarms do not exist in the account"}]},"Confidence":42,"CreatedAt":"2017-03-22T13:22:13.933Z","Criticality":99,"Description":"The version of openssl found on instance i-abcd1234 is known to contain a vulnerability.","FindingProviderFields":{"Confidence":42,"Criticality":99,"RelatedFindings":[{"ProductArn":"arn:aws:securityhub:us-west-2001:db8::1product/aws/guardduty","Id":"123e4567-e89b-12d3-a456-426655440000"}],"Severity":{"Label":"MEDIUM","Original":"MEDIUM"},"Types":["Software and Configuration Checks/Vulnerabilities/CVE"]},"FirstObservedAt":"2017-03-22T13:22:13.933Z","GeneratorId":"acme-vuln-9ab348","Id":"us-west-2/111111111111/98aebb2207407c87f51e89943f12b1ef","LastObservedAt":"2017-03-23T13:22:13.933Z","Malware":[{"Name":"Stringler","Type":"COIN_MINER","Path":"/usr/sbin/stringler","State":"OBSERVED"}],"Network":{"Direction":"IN","OpenPortRange":{"Begin":443,"End":443},"Protocol":"TCP","SourceIpV4":"198.51.100.25","SourceIpV6":"2a02:cf40::","SourcePort":"42","SourceDomain":"example1.com","SourceMac":"2001:db8::1","DestinationIpV4":"203.0.113.8","DestinationIpV6":"2a02:cf40::","DestinationPort":"80","DestinationDomain":"example2.com"},"NetworkPath":[{"ComponentId":"abc-01a234bc56d8901ee","ComponentType":"AWS2001:db8::1InternetGateway","Egress":{"Destination":{"Address":["203.0.113.40/24"],"PortRanges":[{"Begin":443,"End":443}]},"Protocol":"TCP","Source":{"Address":["192.0.2.10/24"]}},"Ingress":{"Destination":{"Address":["192.0.2.20/24"],"PortRanges":[{"Begin":443,"End":443}]},"Protocol":"TCP","Source":{"Address":["198.51.100.15/24"]}}}],"Note":{"Text":"Don''t forget to check under the mat.","UpdatedBy":"jsmith","UpdatedAt":"2018-08-31T00:15:09Z"},"PatchSummary":{"Id":"pb-123456789098","InstalledCount":"100","MissingCount":"100","FailedCount":"0","InstalledOtherCount":"1023","InstalledRejectedCount":"0","InstalledPendingReboot":"0","OperationStartTime":"2018-09-27T23:37:31Z","OperationEndTime":"2018-09-27T23:39:31Z","RebootOption":"RebootIfNeeded","Operation":"Install"},"Process":{"Name":"syslogd","Path":"/usr/sbin/syslogd","Pid":12345,"ParentPid":56789,"LaunchedAt":"2018-09-27T22:37:31Z","TerminatedAt":"2018-09-27T23:37:31Z"},"ProductArn":"arn:aws:securityhub:us-east-1:111111111111:product/111111111111/default","ProductFields":{"generico/secure-pro/Count":"6","Service_Name":"cloudtrail.amazonaws.com","aws/inspector/AssessmentTemplateName":"My daily CVE assessment","aws/inspector/AssessmentTargetName":"My prod env","aws/inspector/RulesPackageName":"Common Vulnerabilities and Exposures"},"ProductName":"Security Hub","RecordState":"ACTIVE","Region":"us-east-1","RelatedFindings":[{"ProductArn":"arn:aws:securityhub:us-west-2001:db8::1product/aws/guardduty","Id":"123e4567-e89b-12d3-a456-426655440000"},{"ProductArn":"arn:aws:securityhub:us-west-2001:db8::1product/aws/guardduty","Id":"AcmeNerfHerder-111111111111-x189dx7824"}],"Remediation":{"Recommendation":{"Text":"Run sudo yum update and cross your fingers and toes.","Url":"http://myfp.com/recommendations/dangerous_things_and_how_to_fix_them.html"}},"Resources":[{"Type":"AwsEc2Instance","Id":"i-cafebabe","Partition":"aws","Region":"us-west-2","Tags":{"billingCode":"Lotus-1-2-3","needsPatching":"true"},"Details":{"IamInstanceProfileArn":"arn:aws:iam2001:db8::1123456789012:role/IamInstanceProfileArn","ImageId":"ami-79fd7eee","IpV4Addresses":["198.51.100.25"],"IpV6Addresses":["2a02:cf40::"],"KeyName":"testkey","LaunchedAt":"2018-09-29T01:25:54Z","MetadataOptions":{"HttpEndpoint":"enabled","HttpProtocolIpv6":"enabled","HttpPutResponseHopLimit":1,"HttpTokens":"optional","InstanceMetadataTags":"disabled"},"NetworkInterfaces":[{"NetworkInterfaceId":"eni-e5aa89a3"}],"SubnetId":"PublicSubnet","Type":"i3.xlarge","VirtualizationType":"hvm","VpcId":"TestVPCIpv6"}}],"Sample":true,"SchemaVersion":"2018-10-08","Severity":{"Label":"CRITICAL","Original":"8.3"}}'
    key:
      - Action.ActionType
      - Action.PortProbeAction.PortProbeDetails[0].LocalPortDetails.Port
      - Action.PortProbeAction.PortProbeDetails[0].LocalPortDetails.PortName
      - Action.PortProbeAction.PortProbeDetails[0].LocalIpDetails.IpAddressV4
cves: []
detections:
  - title: High or critical Inspector finding
    severity: high
    signals:
      - severity
      - status
      - type
      - title
    why: An active HIGH or CRITICAL finding is an exploitable weakness on a running workload.
    kql: |
      dataset="aws_logs"
      | where sourcetype == "aws_inspector" and status == "ACTIVE" and severity in ("HIGH", "CRITICAL")
      | project updatedAt, awsAccountId, title, type, severity, inspectorScore
  - title: Many NXDOMAIN answers from one source
    severity: low
    signals:
      - rcode
      - srcaddr
      - query_name
    why: Lots of failed lookups from one VPC resource can mean malware trying generated domains, or a broken service. Either is worth a look.
    kql: |
      dataset="aws_logs"
      | where sourcetype == "aws_route53_resolver_logs" and rcode == "NXDOMAIN"
      | summarize count() by srcaddr, vpc_id
    mitre:
      - T1568.002
optimizations:
  - title: Drop Lambda platform lines
    saving: a large share of Lambda log volume
    fn: Drop
    how: Each invocation writes START and END lines that carry only the request id. REPORT has the duration and memory, and the function output has the content. Drop START and END before the SIEM.
    expr: message.indexOf('START RequestId:') == 0 || message.indexOf('END RequestId:') == 0
    stream:
      log: Lambda function logs
      functions:
        - id: drop
          filter: message && (message.indexOf('START RequestId:') == 0 || message.indexOf('END RequestId:') == 0)
          description: Drop Lambda START and END platform lines; REPORT and function output are kept
          conf: {}
      test:
        - 'END RequestId: 6bc28136-xmpl-4365-b021-0ce6b2e64ab0'
        - "REPORT RequestId: 6bc28136-xmpl-4365-b021-0ce6b2e64ab0\tDuration: 2.89 ms\tBilled Duration: 3 ms\tMemory Size: 128 MB\tMax Memory Used: 71 MB"
      expect:
        out: 1
references:
  - title: API Gateway logging
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-logging.html
  - title: CloudFront standard logs
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/AccessLogs.html
  - title: Application Load Balancer access logs
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-access-logs.html
  - title: Route 53 Resolver query logging
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs.html
  - title: AWS Security Finding Format
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-findings-format.html
  - title: Lambda logs in CloudWatch
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs.html
