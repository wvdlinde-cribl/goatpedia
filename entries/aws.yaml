id: aws
name: Amazon Web Services
short: AWS
vendor: Amazon Web Services
category: cloud
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Amazon Web Services
  - AWS Cloud
tags:
  - cloud
