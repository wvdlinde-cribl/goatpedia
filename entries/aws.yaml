facts:
  Where the sample comes from: Elastic integrations
  Integration package: aws
  Sourcetypes: '9'
  Fixture events: '115'
  Log format seen: json, text
  Fields in the first fixture: requestId, ip, caller, user, requestTime, httpMethod
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: AWS events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries requestId, ip, caller, user, requestTime, httpMethod. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads aws and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json / text.
