summary: Varonis is logged by the Splunk Connect for Syslog package varonis. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: varonis_datalert
    desc: 'Splunk Connect for Syslog fixture, 2 events. Upstream: tests/test_varonis.py'
facts:
  Where the sample comes from: Splunk Connect for Syslog
  Integration package: varonis
  Sourcetypes: '1'
  Fixture events: '2'
  Log format seen: cef
  Fields in the first fixture: syslog_header, cef_version, device_vendor, device_product, device_version, signature_id
placement:
  slots:
    - edge
  items:
    - slot: edge
      title: Splunk Connect for Syslog
      desc: Fixtures were harvested from splunk/splunk-connect-for-syslog. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Varonis events in this library are the test fixtures shipped with splunk/splunk-connect-for-syslog (d861082778). The first event carries syslog_header, cef_version, device_vendor, device_product, device_version, signature_id. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - cef
  flow:
    - step: Collect
      desc: The Splunk Connect for Syslog package reads varonis and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as cef.
