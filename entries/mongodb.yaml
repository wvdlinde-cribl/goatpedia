aka:
  - mongod
  - MongoDB Community Server
  - MongoDB Enterprise Server
tags:
  - database
  - nosql
  - text
summary: A document database. Applications connect to the mongod server, usually on port 27017, inside the data centre or a cloud network. Its server log records startup and build information, connections, slow operations, replication and access-control messages. Older releases write it as plain text; MongoDB 4.4 and later write structured JSON.
sourcetypes:
  - st: mongodb
    desc: The mongod server log in the classic text format, one line per message with timestamp, severity, component, context and text
facts:
  Product: Document database server (mongod) with replica sets and sharding
  Clients: Applications and drivers, mongosh, over the MongoDB wire protocol, default port 27017
  Log transport: Log file on each server (or syslog), read by a file agent
  Log format: Text lines as timestamp severity component [context] message before 4.4; one JSON object per line from 4.4
  What a log line answers: Which component (CONTROL, NETWORK, ACCESS, COMMAND, REPL and others) reported what, in which thread, and when
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: mongod servers
      desc: Database servers or replica-set members run behind the applications that use them. Each writes its own server log.
    - slot: cloud
      title: Cloud VMs
      desc: Self-managed MongoDB on cloud VMs writes the same log. MongoDB Atlas is the hosted service and is described separately.
howItWorks:
  - title: Components
    body: Every message is tagged with a component, such as CONTROL for startup, NETWORK for connections, ACCESS for authentication, COMMAND for slow operations and REPL for replication, and a severity letter (F, E, W, I, D).
  - title: Context
    body: The context in square brackets names the thread, such as initandlisten at startup or connNNN for a client connection, so lines for one connection can be followed.
traffic:
  handles:
    - Client connections and authentication
    - Database reads and writes
    - Replication
  flow:
    - step: Server acts
      desc: mongod starts, accepts a connection, authenticates a client or runs an operation.
    - step: Line written
      desc: The component writes one line to the server log.
    - step: Collector reads it
      desc: A file agent ships the line. Goatpedia reads it as text.
logs:
  - type: Server log
    sourcetype: mongodb
    format: text
    desc: One line per server message, with timestamp, severity letter, component, context and text. This sample is an informational CONTROL line from initandlisten at startup giving the git version of the build.
    sample: '2018-02-05T13:44:56.657+0100 I CONTROL  [initandlisten] git version: 009580ad490190ba33d1c6253ebd8d91808923e4'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
