id: cisco-meraki
name: Cisco Meraki MX / MR / MS
short: Meraki
aka:
  - Meraki MX Security & SD-WAN appliance
  - Meraki MR wireless
  - Meraki MS switches
  - Meraki Z teleworker gateway
  - Meraki Dashboard
vendor: Cisco
category: ngfw
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - firewall
