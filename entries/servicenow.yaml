summary: A SaaS platform for IT service management, IT asset management and other workflows. Each customer instance stores its data in tables — incidents, changes, users, configuration items and hardware assets. The records here are rows read from those tables, so they describe the state of an asset or ticket rather than a security event, which makes them useful context for who owns a machine and what it is.
sourcetypes:
  - st: servicenow
    desc: Records read from ServiceNow instance tables, one row per event, such as hardware assets (alm_hardware), with each column as a display value and a raw value
facts:
  Product: IT service and asset management platform (Now Platform)
  Instance: One cloud instance per customer, at <name>.service-now.com, organised as tables
  Log transport: HTTPS JSON from the instance REST Table API, polled by a collector with an integration account
  Log format: One JSON object per table row. Each column is an object with display_value and value
  What a row answers: What the record is (table_name), its current fields, and who created or last updated it and when (sys_created_by, sys_updated_by, sys_updated_on)
  What a hardware asset row answers: Asset tag, model, model category, install date, owner and financial values of a device
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: ServiceNow instance
      desc: The tables live in the customer's ServiceNow instance. A collector with an integration account queries the Table API for new or changed rows.
howItWorks:
  - title: Tables and records
    body: Everything in ServiceNow is a record in a table. alm_hardware holds hardware assets, cmdb_ci holds configuration items, incident holds incidents. Every record has system fields such as sys_created_on, sys_created_by, sys_updated_on, sys_updated_by and sys_domain.
  - title: Display and raw values
    body: Reference and choice fields store an id but show a label. With display values requested, each column comes back as an object with value (the stored value, for example a sys_id or UTC time) and display_value (the label or local time). Currency fields add currency_display_value.
  - title: How the data leaves the product
    body: A collector queries the Table API, usually filtered on sys_updated_on since the last poll, and writes one JSON object per row with the table name attached. This is a pull of record state, not an audit stream.
traffic:
  handles:
    - IT asset and configuration records
    - Incidents, changes and requests
    - Record create and update metadata
  flow:
    - step: Record changes
      desc: A user, integration or discovery job creates or updates a row in an instance table.
    - step: Collector queries
      desc: A collector calls the Table API for rows updated since its last poll.
    - step: Rows are JSON
      desc: Each row is one JSON object with table_name and each column as display_value and value. Goatpedia reads these samples as JSON.
