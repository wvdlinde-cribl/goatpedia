summary: An open-source distributed event-streaming platform. Brokers run on servers or in containers inside the data centre or a cloud network, and producers and consumers read and write topics through them. The broker's own server log records startup, configuration, partition and consumer-group housekeeping, controller changes and errors, which tells you whether the cluster is healthy and what it did.
sourcetypes:
  - st: kafka
    desc: The Kafka broker server log, one line per broker message with timestamp, level, component and text
facts:
  Product: Distributed event-streaming platform (brokers, topics, partitions, consumer groups)
  Deployment: Self-managed broker clusters on servers, VMs or Kubernetes; also offered as managed cloud services
  Log transport: Log4j files on each broker (server.log and friends), read by a file agent or forwarded by syslog
  Log format: Plain text, one line per message, as [timestamp] LEVEL [component] text (class)
  What a server-log line answers: Which broker component did what and when, such as group metadata cleanup, partition leadership or a failed connection
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Kafka brokers
      desc: Brokers usually sit inside the data centre or a private cloud network, between the applications that produce events and those that consume them. Each broker writes its own server log on local disk.
    - slot: cloud
      title: Cloud-hosted clusters
      desc: Kafka also runs on cloud VMs or Kubernetes. The broker log is the same text format wherever the broker runs.
howItWorks:
  - title: Brokers, topics and groups
    body: A Kafka cluster is a set of brokers. Topics are split into partitions spread over the brokers. Consumers join consumer groups, and a group coordinator on one broker tracks their committed offsets.
  - title: The server log
    body: Each broker logs through Log4j. Lines carry the time in square brackets, the level (INFO, WARN, ERROR), the component in square brackets with the broker id, the message text and the Java class at the end. Routine housekeeping, such as the GroupMetadataManager removing expired offsets, appears at INFO.
  - title: How the lines leave the broker
    body: The broker writes to local files. A file agent tails them, or Log4j is configured to send to syslog. Any collector can read them.
traffic:
  handles:
    - Topic produce and consume traffic
    - Consumer-group coordination
    - Partition leadership and replication
  flow:
    - step: Broker acts
      desc: A broker component starts, elects a leader, rebalances a group or cleans up offsets.
    - step: Log4j writes a line
      desc: The component writes one text line with time, level, component and class to the broker's server log.
    - step: Collector reads it
      desc: A file agent or syslog forwarder ships the line. Goatpedia reads the sample as text.
logs:
  - type: Broker server log
    sourcetype: kafka
    format: text
    desc: One line per broker message. This sample is the group coordinator on broker 10 reporting that its periodic cleanup removed no expired offsets. The level (INFO) and the component in brackets say which part of the broker spoke.
    sample: '[2018-10-17 12:04:41,718] INFO [GroupMetadataManager brokerId=10] Removed 0 expired offsets in 0 milliseconds. (kafka.coordinator.group.GroupMetadataManager)'
    pattern: (?<message>[\s\S]+)
    key:
      - message
