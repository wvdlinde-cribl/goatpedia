summary: IBM MQ is IBM's message queue. Applications put and get messages on queues, and a queue manager moves those messages, including between queue managers. The queue manager writes an error log that also carries informational and warning lines. Each line has an AMQ code, a user, a program and the queue manager name. This stream is that log. The sample is an informational line that a queue-manager task started.
sourcetypes:
  - st: ibmmq_errorlog
    desc: One line from the queue manager error log. The AMQ code, the user, the program and the queue manager name are in the text.
facts:
  Product: Message-oriented middleware. Applications exchange messages through queues owned by a queue manager.
  Form factor: Queue managers on hosts you run, or IBM MQ on cloud platforms
  Log transport: The queue manager writes a text error log on the host. A collector tails that file.
  Log format: One text line, often several sentences. The AMQ code ends in I for information, W for warning or E for error.
  What a line answers: Which queue manager, which program and which user, and the AMQ code that says what happened
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Queue manager
      desc: The queue manager process runs beside the applications that use it. The error log is a file on that host. A collector tails the file.
howItWorks:
  - title: The error log
    body: Queue managers write AMQERR logs. A line names the time, the process, the user, the program, the host, the installation and the queue manager, then an AMQ code and a paragraph. The suffix on the code is the severity. I is informational, W is a warning, E is an error. EXPLANATION and ACTION are the product's own text.
  - title: This sample
    body: The code is AMQ5037I. The message says the queue manager task APP-SIGNAL has started, and that this start is the third. The user is mqm, the program is amqzmur0 and the queue manager is QM1. That is a task starting, not a failed command. The line also contains a documentation address in the version field.
  - title: How the lines leave
    body: IBM MQ writes the file locally. Any collector that can tail it can forward the lines. The queue manager does not choose the destination.
traffic:
  handles:
    - Queue manager task start and stop
    - Informational, warning and error AMQ codes
    - The queue manager, program and user named on the line
  flow:
    - step: The queue manager acts
      desc: A task starts, a channel changes, or the queue manager hits a warning or an error.
    - step: A line is appended
      desc: The error log gains one AMQ message with the user, the program and the queue manager.
    - step: Collector tails the file
      desc: A collector reads the line and can forward it anywhere.
logs:
  - type: Queue manager log
    sourcetype: ibmmq_errorlog
    format: text
    desc: One error-log line. The AMQ code is the message id and its suffix is the severity. User, Program and QMgr name who and where. This sample is AMQ5037I, an informational line that the APP-SIGNAL task started. The line contains a documentation address.
    sample: '06/14/22 11:54:29 - Process(119.8) User(mqm) Program(amqzmur0) Host(00c6b2142371) Installation(Installation1) VRMF(192.0.2.20) QMgr(QM1) Time(2022-06-14T11:54:29.349Z) ArithInsert2(3) CommentInsert1(APP-SIGNAL) AMQ5037I: The queue manager task ''APP-SIGNAL'' has started. EXPLANATION: The restartable utility task manager has started the APP-SIGNAL task. This task has now started 3 times. ACTION: None.'
    pattern: (?<message>[\s\S]+)
    key:
      - message
