id: ibmmq
name: Ibmmq
short: Ibmmq
vendor: Ibmmq
category: saas
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - ibmmq
  - Elastic integrations
tags:
  - elastic
  - text
summary: Ibmmq is logged by the Elastic integrations package ibmmq. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: ibmmq_errorlog
    desc: 'Elastic integrations fixture, 6 events. Upstream: ibmmq/data_stream/errorlog/_dev/test/pipeline/test-errorlog.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: ibmmq
  Sourcetypes: '1'
  Fixture events: '6'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Ibmmq events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Elastic integrations package reads ibmmq and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text.
logs:
  - type: Errorlog
    sourcetype: ibmmq_errorlog
    format: text
    desc: 6 fixture events in the samples pool (elastic).
    sample: '06/14/22 11:54:29 - Process(119.8) User(mqm) Program(amqzmur0) Host(00c6b2142371) Installation(Installation1) VRMF(192.0.2.20) QMgr(QM1) Time(2022-06-14T11:54:29.349Z) ArithInsert2(3) CommentInsert1(APP-SIGNAL) AMQ5037I: The queue manager task ''APP-SIGNAL'' has started. EXPLANATION: The restartable utility task manager has started the APP-SIGNAL task. This task has now started 3 times. ACTION: None.'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Ibmmq events arriving
    severity: low
    signals:
      - message
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "ibmmq_errorlog"'
optimizations: []
references:
  - title: elastic/integrations ibmmq/data_stream
    url: https://github.com/elastic/integrations/blob/cbfff90638a7565377768f50726775c0febc7bf4/packages/ibmmq/data_stream/errorlog/_dev/test/pipeline/test-errorlog.log
  - title: Pack Generator sample ibmmq_errorlog.json
