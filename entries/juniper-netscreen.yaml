id: juniper-netscreen
name: NetScreen
short: NetScreen
vendor: Juniper Networks
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - ScreenOS
  - Juniper NetScreen
tags:
  - firewall
  - syslog
  - vpn
summary: NetScreen is Juniper's older firewall and VPN appliance family, running ScreenOS. It filters traffic between zones and writes a syslog line for traffic, policy and system events. This stream is that syslog. The sample says the event alarm log was overwritten, which means older alarm events on that firewall were discarded. Any collector can receive the syslog.
sourcetypes:
  - st: juniper_netscreen
    desc: ScreenOS syslog from a NetScreen firewall. One line is one traffic, policy or system message.
facts:
  Product: Firewall and VPN appliance running ScreenOS. Juniper ended the product line. The syslog is still what those appliances emit.
  Form factor: NetScreen and SSG appliances
  Log transport: Syslog from the firewall
  Log format: One text line. device_id names the firewall. The message text is the event.
  What an overwritten-log message answers: The appliance discarded older events because the alarm log wrapped or was overwritten
placement:
  slots:
    - edge
  items:
    - slot: edge
      title: NetScreen firewall
      desc: The appliance sits between zones and writes syslog for the traffic and system events it handles. device_id in the line is that box. A collector receives the syslog.
howItWorks:
  - title: ScreenOS syslog
    body: A NetScreen line names the device and a message. Traffic lines describe a policy decision. System lines describe the box itself, including the state of its own logs. device_id is the firewall.
  - title: This sample
    body: The message says the audit log queue's event alarm log was overwritten. When that happens, older alarm events on the firewall are gone. The line is the gap in the audit trail. device_id in the sample is olab.
  - title: How the lines leave
    body: ScreenOS sends syslog to the addresses configured on the appliance. Any collector can receive it.
traffic:
  handles:
    - Traffic matching a policy
    - System and alarm messages
    - Loss of the local alarm log when it is overwritten
  flow:
    - step: The firewall acts
      desc: A packet matches a policy, or the appliance hits a system condition such as a full log.
    - step: ScreenOS writes a line
      desc: The line names the device and the message.
    - step: Collector receives syslog
      desc: A collector takes the line and can forward it anywhere.
logs:
  - type: Firewall log
    sourcetype: juniper_netscreen
    format: text
    desc: One ScreenOS syslog line. device_id names the firewall. The message text is the event. This sample says the event alarm log was overwritten, so older alarm events on that box were discarded.
    sample: 'modtempo: NetScreen device_id=olab system-low-00628(rci): audit log queue Event Alarm Log is overwritten (2016-1-29 06:09:59)'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Alarm log was overwritten
    severity: medium
    signals:
      - message
    why: An overwritten event alarm log means the firewall discarded older events. Anything that happened before the wrap is missing from the box. The sample is that message.
    kql: |
      dataset="juniper-netscreen_logs"
      | where sourcetype == "juniper_netscreen" and message has "overwritten"
      | project message
    mitre:
      - T1562
optimizations: []
references:
  - title: Juniper documentation
    url: https://www.juniper.net/documentation/
