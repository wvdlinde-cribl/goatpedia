summary: Google Scc is logged by the Elastic integrations package google_scc. The Pack Generator samples pool holds fixture events for 4 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: google_scc_asset
    desc: 'Elastic integrations fixture, 7 events. Upstream: google_scc/data_stream/asset/_dev/test/pipeline/test-asset.log'
  - st: google_scc_audit
    desc: 'Elastic integrations fixture, 1 events. Upstream: google_scc/data_stream/audit/_dev/test/pipeline/test-audit.log'
  - st: google_scc_finding
    desc: 'Elastic integrations fixture, 7 events. Upstream: google_scc/data_stream/finding/_dev/test/pipeline/test-finding.log'
  - st: google_scc_source
    desc: 'Elastic integrations fixture, 2 events. Upstream: google_scc/data_stream/source/_dev/test/pipeline/test-source.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: google_scc
  Sourcetypes: '4'
  Fixture events: '17'
  Log format seen: json
  Fields in the first fixture: asset.ancestors[0], asset.ancestors[1], asset.assetType, asset.name, asset.resource.data.description, asset.resource.data.lifecycleState
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Google Scc events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries asset.ancestors[0], asset.ancestors[1], asset.assetType, asset.name, asset.resource.data.description, asset.resource.data.lifecycleState. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads google_scc and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
