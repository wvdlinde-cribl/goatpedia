placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Shopify events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries subject_id, path, subject_type, author, verb, created_at. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads shopify and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
logs:
  - type: Shopify
    sourcetype: shopify
    format: json
    desc: 4 fixture events in the samples pool (logtest).
    sample: '{"subject_id":1234,"path":"/admin/pages","subject_type":"Blog","author":"Shopify","verb":"create","created_at":"2024-08-27T15:36:38+05:30","description":"Blog was created: News.","arguments":["News"],"id":222397999050809,"message":"Blog was created: <a href=\"https://admin.shopify.com/store/{store_name}/admin/blogs/1234\">News</a>."}'
    key:
      - subject_id
      - path
      - subject_type
      - author
cves: []
detections:
  - title: Shopify events arriving
    severity: low
    signals:
      - subject_id
      - path
      - subject_type
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "shopify"'
optimizations: []
references:
