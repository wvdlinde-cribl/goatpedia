summary: Cisco Aironet is Cisco's line of enterprise wireless access points, managed in most deployments by a wireless LAN controller such as the AireOS controllers or the IOS XE based Catalyst 9800. The controller handles client association, authentication against RADIUS, roaming, radio management and rogue detection for every access point. It sends syslog messages for those functions, which tell you about authentication and AAA problems, access point joins and failures, and controller health.
sourcetypes:
  - st: cisco_aironet
    desc: Wireless LAN controller syslog, one message per event from controller processes such as AAA, client management and access point management, in Cisco %FACILITY-SEVERITY-MNEMONIC form
facts:
  Product: Enterprise Wi-Fi access points and the wireless LAN controllers that manage them
  Form factor: Indoor and outdoor access points, with hardware, virtual, cloud or switch-embedded controllers
  Log transport: Syslog over UDP or TCP from the controller to one or more syslog servers
  Log format: Cisco syslog text with a sequence number, host, timestamp and a %FACILITY-SEVERITY-MNEMONIC tag, then the message. On Catalyst 9800 the chassis, slot and process (for example wncd) follow
  What a controller message answers: Which controller process reported what, at which severity, for example a RADIUS or accounting server problem, an access point joining or dropping, or a client authentication failure
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Wireless LAN controller and access points
      desc: Access points hang off the campus switches. The controller sits in the data centre or campus core, terminates the access point tunnels and talks to RADIUS. Its syslog describes the whole wireless network.
howItWorks:
  - title: Access points and the controller
    body: Access points join a controller over CAPWAP and receive their configuration from it. The controller manages WLANs, radio settings, client association and roaming, and on the Catalyst 9800 runs per-function processes such as wncd for wireless clients.
  - title: Authentication and AAA
    body: For 802.1X WLANs the controller sends client authentication and accounting to RADIUS servers through AAA server groups. A missing or invalid server group shows up as AAA errors such as BADSERVERTYPEERROR.
  - title: How the logs leave the controller
    body: The controller is configured with syslog hosts and a logging level. Each message carries a facility, a severity from 0 to 7 and a mnemonic. Any syslog collector can receive them. The destination is a choice of the pipeline, not a property of the controller.
traffic:
  handles:
    - Wi-Fi client association and roaming
    - 802.1X and RADIUS authentication and accounting
    - Access point join and radio management
  flow:
    - step: Wireless event happens
      desc: A client associates or authenticates, an access point joins or drops, or a controller process hits an error.
    - step: Controller process logs it
      desc: The process writes a syslog message with facility, severity and mnemonic.
    - step: Syslog is sent
      desc: The controller sends the message to the configured syslog servers.
logs:
  - type: Controller syslog
    sourcetype: cisco_aironet
    format: text
    desc: One syslog message from the controller. The %FACILITY-SEVERITY-MNEMONIC tag says which function reported it and how serious it is, and the text after it explains. This sample is a severity 3 AAA error from the wncd process on a Catalyst 9800 controller that could not process an accounting server type because the server group handle was invalid. The sample uses documentation host names.
    sample: '<147>4105777: example-wlc-01.example.com: 4105879: Jun  2 16:00:48.072 SGT: %AAA-3-BADSERVERTYPEERROR: Chassis 1 R0/0: wncd: Cannot process accounting server type *invalid_group_handle*'
    pattern: (?<message>[\s\S]+)
    key:
      - message
