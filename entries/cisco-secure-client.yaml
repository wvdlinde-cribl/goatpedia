facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: cisco_secure_client
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Cisco Secure Client events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads cisco_secure_client and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text.
logs:
  - type: Cisco Secure Client
    sourcetype: cisco_secure_client
    format: text
    desc: 20 fixture events in the samples pool (logtest).
    sample: '<190>2025-12-05T10:51:16Z: %FTD-4-113035: Group Employee-Access User evelyn.baker IP 203.0.113.40 Session terminated: AnyConnect not enabled or invalid AnyConnect image on the device_123'
    pattern: (?<message>[\s\S]+)
    key:
      - message
