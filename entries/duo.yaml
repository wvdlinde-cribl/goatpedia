cves:
  - id: CVE-2024-20301
    cvss: 6.2
    year: 2024
    kev: false
    scope: device
    title: Duo Authentication for Windows Logon and RDP — trusted sessions not invalidated after reboot (MFA bypass with primary credentials)
    affected: Duo Authentication for Windows Logon and RDP 4.2.0 – 4.2.2
    fixed: 4.3.0
    detect: Windows logons (4624 type 2/10) on Duo-protected hosts without a matching Duo authentication event for that user and host around the same time; Duo agent version inventory.
    avoid: Upgrade to 4.3.0+; Cisco recommends migrating to a new application instance (new ikey/skey); disable "remember me" trusted sessions where not needed.
  - id: CVE-2023-20123
    cvss: 4.6
    year: 2023
    kev: false
    scope: device
    title: Duo for macOS / Windows Logon offline access mode allows replay of valid session credentials (physical access)
    affected: Duo Two-Factor Authentication for macOS and Duo Authentication for Windows Logon and RDP with offline access enabled (see Cisco advisory for versions)
    detect: Offline-mode logons appear in the offline enrollment / authentication log with factor Offline Duo Mobile Passcode; a logon on a host that was reported lost or stolen.
    avoid: Upgrade the logon agents; restrict offline access to the groups that need it; limit offline login count.
  - id: CVE-2024-3596
    cvss: 9
    year: 2024
    kev: false
    scope: traffic
    title: Blast-RADIUS — MD5 chosen-prefix forgery of RADIUS responses between a VPN/NAS and the Duo Authentication Proxy
    affected: RADIUS/UDP (RFC 2865) deployments without Message-Authenticator enforcement, including Duo Authentication Proxy RADIUS server sections
    fixed: Duo Authentication Proxy 6.4.2 adds force_message_authenticator; 6.6.0+ supports RadSec
    detect: A VPN login accepted by the NAS with NO corresponding Duo authentication record for that user/application at that time; RADIUS traffic to the proxy crossing untrusted network segments.
    avoid: Set force_message_authenticator=true on radius_server sections, require Message-Authenticator on the NAS, prefer RadSec, keep RADIUS off untrusted networks.
  - id: CVE-2023-20269
    cvss: 9.1
    year: 2023
    kev: true
    scope: traffic
    title: Cisco ASA/FTD remote-access VPN brute force and clientless session (used by Akira/LockBit) — the VPNs Duo most often protects
    affected: Cisco ASA and FTD software with remote-access VPN (see Cisco advisory for trains)
    detect: Bursts of Duo authentication requests for many usernames from the VPN application with reason no_response or deny_unenrolled_user — or VPN logins that never reach Duo (tunnel group without the Duo AAA server).
    avoid: Patch ASA/FTD; ensure every tunnel group and the DefaultWEBVPNGroup require Duo; deny unenrolled users; enable Verified Push.
detections:
  - title: Push harassment (MFA fatigue)
    severity: high
    signals:
      - factor=duo_push
      - result=denied with reason in (no_response, user_mistake, user_cancelled)
      - ≥ 5 per user in 10 minutes
      - detected_attack_detectors contains PUSH_HARASSMENT
    why: An attacker who holds the password spams pushes hoping the user approves one. A run of denials followed by a success is a likely compromise.
    kql: |-
      dataset="duo_logs" event_type="authentication" factor="duo_push"
      | summarize denied=countif(result=="denied"), ok=countif(result=="success"), ips=dcount(access_device.ip) by user.name, bin(_time, 10m)
      | where denied >= 5
    mitre:
      - T1621
  - title: User reported a push as fraud
    severity: high
    signals:
      - result=fraud
      - reason=user_marked_fraud
    why: The user's password is almost certainly known to an attacker — the push was triggered by someone else. Reset the password and check other logins from the same access_device.ip.
    kql: |-
      dataset="duo_logs" result="fraud"
      | project _time, user.name, application.name, access_device.ip, access_device.location.country, auth_device.name
    mitre:
      - T1621
      - T1078
  - title: Access and approval devices in different countries
    severity: medium
    signals:
      - access_device.location.country ≠ auth_device.location.country
      - result=success
    why: Users normally approve from a phone near their computer. A successful login where the requesting browser is in another country than the approving phone suggests a relayed, phished or proxied session.
    kql: |-
      dataset="duo_logs" result="success" isnotempty(access_device.location.country)
      | where access_device.location.country != auth_device.location.country
      | summarize n=count() by user.name, access_device.location.country, auth_device.location.country, application.name
    mitre:
      - T1078
  - title: Bypass code created or viewed
    severity: high
    signals:
      - action.name in (bypass_create, bypass_view)
      - or administrator action bypass_create
    why: Bypass codes skip MFA entirely. Help-desk social engineering ("I lost my phone") ends with a bypass code — correlate with the target user's next logins.
    kql: |-
      dataset="duo_logs" action.name in ("bypass_create","bypass_view")
      | project _time, actor.name, actor.type, target.name, access_device.ip.address, outcome.result
    mitre:
      - T1556.006
  - title: New phone or passkey enrolled after denied pushes
    severity: medium
    signals:
      - action.name in (phone_create, phone_associate, webauthncredential_create)
      - or event_type=enrollment
      - preceded by denied authentications for the same user
    why: Attackers who get past MFA once register their own device for persistence. New device enrolment right after a fatigue burst is a takeover pattern.
    kql: |-
      dataset="duo_logs" action.name in ("phone_create","phone_associate","webauthncredential_create")
      | project _time, actor.name, actor.type, target.name, target.type, access_device.ip.address
    mitre:
      - T1098.005
  - title: Integration secret key viewed
    severity: medium
    signals:
      - action=integration_skey_view or integration_skey_bulk_view
    why: The ikey/skey pair lets anyone call the Duo API as that application (and forge Auth Proxy calls). Viewing it outside of a deployment change is suspicious.
    kql: |-
      dataset="duo_logs" action in ("integration_skey_view","integration_skey_bulk_view")
      | project _time, username, object, description
    mitre:
      - T1552
optimizations:
  - title: Drop deprecated and empty device fields
    saving: 10–20 %
    fn: Eval
    how: access_device.flash_version / java_version are almost always "uninstalled", ood_software and alias are usually empty, and model/features versions never change. Remove them and null values.
    expr: "remove: access_device.flash_version, access_device.java_version, ood_software, alias, *.features_version, *.model_version"
  - title: Aggregate remembered-device and trusted-network successes
    saving: 15–35 %
    fn: Aggregations
    how: Successes with reason remembered_device or trusted_network involve no user challenge and repeat all day. Roll them up to count per user, application and access IP per hour; keep every denial, fraud and push event raw.
    expr: result=='success' && ['remembered_device','trusted_network'].includes(reason)
  - title: Route by log type
    saving: SIEM licence
    fn: Routes
    how: Fraud, denied, activity and administrator events → SIEM at full fidelity; aggregated routine successes → SIEM; full raw authentication log and telephony → Lake for investigations and billing review.
    expr: result!='success' || __collector=='activity' || __collector=='administrator' → SIEM
