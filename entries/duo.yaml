facts:
  First released: 2010 (Duo Security; acquired by Cisco in 2018)
  Delivery model: Multi-tenant SaaS (api-XXXXXXXX.duosecurity.com per account) plus on-prem connectors
  On-prem components: Duo Authentication Proxy (RADIUS/LDAP for VPN, firewalls), Windows Logon & RDP, macOS logon, AD FS/OWA plugins, Duo Desktop (device health)
  Factors: Duo Push / Verified Push, passkeys and WebAuthn, passcodes, hardware tokens, SMS, phone call, bypass codes
  Log transport: Admin API polling (mintime/maxtime, next_offset paging, 2-minute availability delay, ~1 request/min recommended)
  Log format: JSON (default) or OCSF Authentication class (formatter=1, beta)
  Retention: 180 days queryable via API
  Typical volume: 2–10 authentication events per user per day, ~1.5–3 KB each
placement:
  slots:
    - cloud
    - internal
    - remote
    - endpoint
  items:
    - slot: cloud
      title: Duo cloud service
      desc: Policy evaluation, push delivery, SSO and all logging happen in the Duo cloud. Every protected app calls the Duo API; the Admin API is where logs are pulled from.
    - slot: internal
      title: Authentication Proxy
      desc: On-prem service (Windows/Linux) that sits between a VPN, firewall or appliance and the directory. It does primary auth against AD/RADIUS and then calls Duo for the second factor — the RADIUS hop that Blast-RADIUS targets.
    - slot: remote
      title: Remote access MFA
      desc: VPN concentrators (ASA/FTD, Palo Alto GlobalProtect, Fortinet) and web apps prompt for Duo; push requests go to users' phones wherever they are.
    - slot: endpoint
      title: Logon and device health
      desc: Duo for Windows Logon/RDP and macOS add MFA at OS sign-in (with offline access), and Duo Desktop reports disk encryption, firewall and OS version for trusted-endpoint policies.
howItWorks:
  - title: Two-step flow
    body: The protected application or Authentication Proxy first performs primary authentication (directory password, SAML IdP) and then calls the Duo Auth API with the username. Duo evaluates policy, challenges the user with an allowed factor and returns allow/deny. Duo never sees the primary password unless Duo SSO is the IdP.
  - title: Policy engine
    body: Global, application and group policies decide new-user behaviour (enroll, allow, deny), allowed factors, authorised networks, remembered devices, device health requirements, OS/browser versions and user location. The resulting decision and its reason (user_approved, denied_by_policy, location_restricted …) land in the authentication log.
  - title: Push and Verified Push
    body: Duo Push sends an approve/deny prompt to Duo Mobile; Verified Push requires the user to type a code from the login screen, which defeats blind push-fatigue approval. Users can report a push as fraud (result fraud, reason user_marked_fraud).
  - title: Risk-based authentication
    body: Duo Premier/Advantage add risk-based factor selection and remembered devices. Detections such as push harassment, novel ASN, unrealistic travel, country code mismatch and credential stuffing are written to adaptive_trust_assessments and can step a user up to a stronger factor.
  - title: Two devices per event
    body: Every authentication carries access_device (the computer/browser requesting access, with IP, OS, browser and Duo Desktop health) and auth_device (the phone or key that approved it, with its own IP and location). A mismatch between the two locations is a strong signal of a relayed or phished login.
  - title: Admin API logs
    body: Authentication (v2), activity (v2), administrator (v1, being replaced by activity), telephony (v2) and offline-enrollment endpoints are polled with HMAC-signed requests. Results are available two minutes after the event and paged with next_offset; Cribl Stream typically uses a REST Collector per endpoint.
traffic:
  handles:
    - Duo Auth API / Web SDK (Universal Prompt) over HTTPS
    - RADIUS (PAP/MSCHAPv2 pass-through) via Authentication Proxy
    - LDAP / LDAPS proxying via Authentication Proxy
    - SAML 2.0 / OIDC (Duo Single Sign-On)
    - Push notifications to Duo Mobile (APNs / FCM)
    - WebAuthn / FIDO2 passkeys and security keys
    - SMS and voice telephony factors
  flow:
    - step: Access request
      desc: User reaches a protected app, VPN or OS logon.
    - step: Primary auth
      desc: Password checked against AD/LDAP/RADIUS or the SAML IdP (by the app or Authentication Proxy).
    - step: Duo preauth
      desc: App calls Duo with the username and client context; Duo applies policy (enrolled? allowed network? device health?).
    - step: Second factor
      desc: Push, Verified Push, passkey, passcode or phone; the user approves, denies or reports fraud.
    - step: Decision
      desc: Duo returns allow/deny with a reason; the app or proxy completes or rejects the login.
    - step: Audit record
      desc: Authentication log written with access_device, auth_device, factor, result and reason; available via Admin API after two minutes.
