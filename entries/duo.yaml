summary: Cloud MFA, device-trust and SSO service. Duo Push, passcodes and passkeys protect web apps, VPNs (via the on-prem Authentication Proxy over RADIUS/LDAP), Windows/macOS logon and SSO. The Admin API exposes authentication, activity, administrator and telephony logs as JSON — the record of push harassment, fraud reports, bypass codes and MFA policy tampering.
sourcetypes:
  - st: cisco_duo_activity
    desc: Duo Activity log v2 (/admin/v2/logs/activity) — actor/action/target records for admin and user activity
  - st: cisco_duo_administrator
    desc: Duo Administrator log (/admin/v1/logs/administrator) — admin console and API changes
  - st: duo_security
    desc: Duo authentication log v2 (/admin/v2/logs/authentication) — one record per MFA attempt
  - st: cisco:duo:authentication
    desc: Cisco Security Cloud app for Splunk — Duo authentication logs
  - st: cisco:duo:activity
    desc: Cisco Security Cloud app for Splunk — Duo activity logs
  - st: cisco:duo:administrator
    desc: Cisco Security Cloud app for Splunk — Duo administrator logs
  - st: cisco_duo
    desc: 'Datadog integrations-core fixture, 7 events. Upstream: cisco_duo/assets/logs/cisco-duo_tests.yaml'
  - st: cisco_duo_admin
    desc: 'Elastic integrations fixture, 20 events. Upstream: cisco_duo/data_stream/admin/_dev/test/pipeline/test-admin.log'
  - st: cisco_duo_offline_enrollment
    desc: 'Elastic integrations fixture, 2 events. Upstream: cisco_duo/data_stream/offline_enrollment/_dev/test/pipeline/test-offline-enrollment.log'
