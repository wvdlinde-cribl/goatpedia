id: f5-awaf
name: F5 BIG-IP Advanced WAF
short: F5 AWAF
aka:
  - ASM
  - BIG-IP ASM
  - Application Security Manager
  - F5 Advanced WAF
  - AWAF
vendor: F5
category: waf
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - waf
