id: jumpcloud
name: Jumpcloud
short: Jumpcloud
vendor: Jumpcloud
category: saas
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - jumpcloud
  - Elastic integrations
tags:
