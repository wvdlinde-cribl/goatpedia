id: jumpcloud
name: JumpCloud
short: JumpCloud
vendor: JumpCloud
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - JumpCloud Directory Platform
  - Directory Insights
tags:
  - identity
  - directory
  - audit
  - json
summary: JumpCloud is a cloud directory. People sign in to the user portal, to devices, and to SSO, RADIUS and LDAP. Administrators change users, groups and policies. Directory Insights records those actions as JSON events. A collector polls the Directory Insights API. The sample is one directory sign-in attempt that succeeded without a second factor.
sourcetypes:
  - st: jumpcloud
    desc: One Directory Insights event. event_type, success and the actor say what happened in the directory and whether it worked.
facts:
  Product: Cloud directory for users, devices, SSO, RADIUS and LDAP
  Clients: The user portal, the admin console, device agents, and SSO, RADIUS and LDAP clients
  Log transport: HTTPS JSON. A collector POSTs to the Directory Insights API with an administrator API key.
  Log format: One JSON object per event. event_type is the action. success is the outcome. service says which JumpCloud service, such as directory.
  What a sign-in event answers: Who tried to sign in, from which address, whether it succeeded, and whether a second factor was used
  What initiated_by answers: The user or admin who caused the event, with an email when Directory Insights has one
placement:
  slots:
    - cloud
    - endpoint
  items:
    - slot: cloud
      title: JumpCloud directory
      desc: Users, groups and the Directory Insights trail live in JumpCloud. Sign-ins to the portals, SSO, RADIUS and LDAP are recorded here. A collector polls the API.
    - slot: endpoint
      title: Device agent
      desc: The JumpCloud agent on a computer reports device sign-ins and system events into the same Directory Insights trail. client_ip on a directory sign-in is the client that attempted it.
howItWorks:
  - title: One event
    body: event_type is the action, such as user_login_attempt. success is whether it worked. mfa says whether a second factor was involved. service is the JumpCloud service, such as directory, sso, radius or systems. initiated_by.email and username name the person. client_ip is the client. organization is the tenant. timestamp is when.
  - title: This sample
    body: The event is a directory sign-in attempt that succeeded. mfa is false, so the success did not use a second factor. The email and the client address are documentation values.
  - title: How a collector polls
    body: Directory Insights is a pull API. The collector sends a start time and the services it wants, and JumpCloud returns a page of JSON events. Any collector with an API key can do this.
traffic:
  handles:
    - Directory sign-in attempts
    - Administrator changes to users and groups
    - SSO, RADIUS, LDAP and device events in the same trail
  flow:
    - step: A person or an admin acts
      desc: Someone signs in, or an administrator changes the directory, or a device agent reports an event.
    - step: Directory Insights stores it
      desc: JumpCloud appends one JSON event with the type, the outcome and the actor.
    - step: Collector polls
      desc: A collector requests events after its saved start time and can forward each object anywhere.
logs:
  - type: Directory event
    sourcetype: jumpcloud
    format: json
    desc: One Directory Insights event. event_type is the action. success is the outcome. mfa says whether a second factor was used. initiated_by.email and client_ip are who and from where. This sample is a successful directory sign-in with mfa false. The email and the address are documentation values.
    sample: '{"@version":"1","version":"2","client_ip":"198.51.100.25","event_type":"user_login_attempt","id":"63c264c6c1bd55c1b7e901a5","initiated_by":{"email":"user@example.com","id":"123456789abcdef123456789","type":"user"},"mfa":false,"organization":"1234abcdef123456789abcde","service":"directory","success":true,"timestamp":"2023-01-14T08:20:06.495Z","username":"user.name"}'
    key:
      - '@version'
      - version
      - client_ip
      - event_type
cves: []
detections:
  - title: Directory sign-in did not succeed
    severity: medium
    signals:
      - event_type
      - success
      - username
      - client_ip
      - initiated_by.email
    why: A user_login_attempt with success false is someone failing to open the directory. Repeated failures for one username are the brute-force view of this source.
    kql: |
      dataset="jumpcloud_logs"
      | where sourcetype == "jumpcloud" and event_type == "user_login_attempt" and success == false
      | project timestamp, event_type, success, username, initiated_by.email, client_ip, mfa
    mitre:
      - T1110
  - title: Sign-in succeeded without a second factor
    severity: medium
    signals:
      - event_type
      - success
      - mfa
      - username
      - client_ip
    why: The sample is a successful directory sign-in with mfa false. Where the directory is expected to require a second factor, that success is the control gap.
    kql: |
      dataset="jumpcloud_logs"
      | where sourcetype == "jumpcloud" and event_type == "user_login_attempt" and success == true and mfa == false
      | project timestamp, username, initiated_by.email, client_ip, mfa, service
optimizations: []
references:
  - title: Directory Insights API
    url: https://jumpcloud.com/support/directory-insights-api
  - title: JumpCloud API documentation
    url: https://docs.jumpcloud.com/
