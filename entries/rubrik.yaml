facts:
  Where the sample comes from: Elastic integrations
  Integration package: rubrik
  Sourcetypes: '12'
  Fixture events: '15'
  Log format seen: json
  Fields in the first fixture: clusterId, clusterName, capacityBytes, diskId, diskType, isEncrypted
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Rubrik events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries clusterId, clusterName, capacityBytes, diskId, diskType, isEncrypted. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads rubrik and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
