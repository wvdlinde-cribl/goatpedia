# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: rubrik
name: Rubrik Security Cloud
short: Rubrik
vendor: Rubrik, Inc.
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Rubrik
  - Rubrik CDM
  - Rubrik Cloud Data Management
  - RSC
tags:
  - backup
  - data-protection
  - ransomware-recovery
  - metrics
summary: A data protection platform. Rubrik clusters on premises or in the cloud back up virtual machines, physical hosts, databases and file shares under SLA domains, and Rubrik Security Cloud manages those clusters from one control plane. The streams here are inventory and health snapshots pulled from its API — cluster capacity and node load, protected objects and their SLA, job counts and task outcomes — which tell you whether backups are running and whether anything has fallen out of protection.
sourcetypes:
  - st: rubrik_drives
    desc: One record per disk in a Rubrik node, with type, encryption, status and capacity
  - st: rubrik_filesets
    desc: One record per fileset (a set of paths on a host that is backed up), with snapshot counts, storage and SLA compliance
  - st: rubrik_global_cluster_performance
    desc: One record per cluster with total, used and available capacity, daily growth and estimated runway
  - st: rubrik_managed_volumes
    desc: One record per managed volume (a storage target applications write backups to), with state, size and SLA
  - st: rubrik_monitoring_jobs
    desc: Job counts per cluster by kind — backup, archive, replication, recovery, conversion and log backup
  - st: rubrik_mssql_databases
    desc: One record per protected Microsoft SQL Server database, with its cluster, online state and SLA
  - st: rubrik_node_statistics
    desc: Per-node time series of CPU, memory, IOPS, throughput and network bytes
  - st: rubrik_physical_hosts
    desc: One record per physical host registered for backup, with OS and agent connectivity
  - st: rubrik_sla_domains
    desc: One record per SLA domain, the policy that sets backup frequency, retention, windows and archival, with counts of objects it protects
  - st: rubrik_tasks
    desc: Counts of succeeded, failed, canceled and missed tasks per SLA domain
  - st: rubrik_unmanaged_objects
    desc: Snapshots whose source object is no longer protected (relics or unprotected), with storage they still hold
  - st: rubrik_virtual_machines
    desc: One record per protected virtual machine, with power state, backup agent status and SLA
facts:
  Product: Backup, recovery and data security for VMs, hosts, databases and shares
  Form factor: Rubrik clusters (appliances, software on certified hardware, or cloud clusters) managed through Rubrik Security Cloud
  Protection model: Objects are assigned to SLA domains. The SLA domain sets frequency, retention, backup windows, replication and archival
  Log transport: Pulled over HTTPS from the Rubrik API by a collector on a schedule
  Log format: One JSON object per object or metric snapshot
  What task counts answer: Whether backups for each SLA domain succeeded, failed, were canceled or were missed
  What object records answer: Which VMs, hosts and databases are protected, under which SLA, and whether they comply
  What capacity records answer: How full each cluster is and how many days of runway it has left
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Rubrik cluster
      desc: The cluster sits in the data center next to the hypervisors, hosts and databases it protects. It runs the backup jobs and stores the snapshots. Node, drive and capacity metrics describe this hardware.
    - slot: cloud
      title: Rubrik Security Cloud
      desc: The SaaS control plane that manages clusters, SLA domains and protected objects. A collector calls its API to read inventory, compliance and job metrics. Nothing in the product is tied to one SIEM.
howItWorks:
  - title: SLA domains
    body: Rubrik protects data by policy, not by job. An SLA domain says how often to take a snapshot, how long to keep it, which window backups may run in, and where to replicate or archive. A VM, host, fileset, managed volume or database is assigned to an SLA domain and inherits it as its effectiveSlaDomain.
  - title: Clusters and objects
    body: A cluster is a set of nodes with drives. It ingests snapshots from protected objects and reports capacity, growth and an estimated runway in days. Each protected object keeps a snapshot count and a compliance status that says whether its snapshots meet its SLA.
  - title: Jobs, tasks and relics
    body: Backup, archive, replication, recovery and conversion run as jobs. Task counts per SLA domain show how many succeeded, failed, were canceled or were missed. When a source object disappears or loses protection, its remaining snapshots become unmanaged objects (for example a relic) that still use storage.
  - title: How the data leaves the product
    body: These records are not pushed as syslog. A collector authenticated to the Rubrik API polls each resource and writes one JSON object per object or per metric sample. The destination is a choice of the pipeline.
traffic:
  handles:
    - Snapshot backups of VMs, hosts, databases and filesets
    - Replication and archival of snapshots
    - Recovery and live mount
  flow:
    - step: Cluster runs jobs
      desc: The Rubrik cluster takes snapshots on the schedule of each SLA domain, and replicates or archives them.
    - step: State is recorded
      desc: Rubrik keeps object inventory, compliance, task outcomes and node metrics in its management plane.
    - step: Collector polls
      desc: A collector calls the Rubrik API for each resource kind and receives JSON.
    - step: Events are JSON
      desc: Each record is one JSON object. Goatpedia reads these samples as JSON.
logs:
  - type: Drives
    sourcetype: rubrik_drives
    format: json
    desc: One disk in a node. diskId, diskType, status and isEncrypted describe the disk. capacityBytes and unallocatedBytes show how much space is left. This sample is an active, unencrypted HDD.
    sample: '{"clusterId":"dd16a645-dc11-43b0-b01a-30f37a4c2eb7","clusterName":"cluster-1","capacityBytes":3834792386560,"diskId":"sdd","diskType":"HDD","isEncrypted":false,"path":"/mnt/wwn-0x9000b3100b3610c9","status":"ACTIVE","unallocatedBytes":1497465520128,"usableBytes":1457440894976,"nodeId":"1f7c2a2a-8631-416d-abfb-0ab97c2e0fd0"}'
    key:
      - clusterId
      - clusterName
      - capacityBytes
      - diskId
  - type: Filesets
    sourcetype: rubrik_filesets
    format: json
    desc: One fileset and its protection state. complianceStatus says whether its snapshots meet the SLA in effectiveSlaDomainName. This sample is a Linux fileset with 6 snapshots that is OUT_OF_COMPLIANCE with the Bronze SLA.
    sample: '{"archiveStorage":0,"totalSnapshots":6,"filesetName":"Linux","osType":"LINUX","localStorage":1286184885,"archiveSnapshots":0,"complianceStatus":"OUT_OF_COMPLIANCE","clusterID":"7f4f96b3-e777-4bde-ba08-47a40ecaa416","clusterName":"401-rubrik","effectiveSlaDomainName":"Bronze","effectiveSlaDomainID":"8f983b74-a50f-5ffa-b73d-359462c06f4b"}'
    key:
      - archiveStorage
      - totalSnapshots
      - filesetName
      - osType
  - type: Cluster capacity
    sourcetype: rubrik_global_cluster_performance
    format: json
    desc: One cluster's capacity summary. metric.totalCapacity, metric.usedCapacity and metric.availableCapacity are bytes. estimatedRunway is days until full at the current metric.averageDailyGrowth. This sample cluster is Disconnected with 1140 days of runway.
    sample: '{"estimatedRunway":1140,"id":"b1a9e557-0b47-4bc1-841d-e6379e733016","metric":{"availableCapacity":719592345600,"averageDailyGrowth":630829064,"cdpCapacity":0,"ingestedSnapshotStorage":436860485632,"liveMountCapacity":0,"miscellaneousCapacity":3490865159,"pendingSnapshotCapacity":2064,"physicalSnapshotStorage":313507076073,"snapshotCapacity":313507076073,"totalCapacity":1036590288896,"usedCapacity":316997943296},"name":"prod-rub1","status":"Disconnected","type":"Robo"}'
    key:
      - estimatedRunway
      - id
      - metric.availableCapacity
      - metric.averageDailyGrowth
  - type: Managed volumes
    sourcetype: rubrik_managed_volumes
    format: json
    desc: One managed volume, a storage share that a database or application writes its own backups into. state, provisionedSize and snapshotDistribution show its use. effectiveSlaDomain is its SLA.
    sample: '{"cluster":{"id":"b1a9e557-0b47-4bc1-841d-e6379e733016","name":"prod-rub1"},"host":null,"id":"e07d2906-8915-56ba-a551-ba8fd4a20b6f","mainMount":{"logicalUsedSize":24576},"name":"test-volume","numChannels":1,"provisionedSize":1073741824,"snapshotDistribution":{"scheduledCount":0,"totalCount":0},"state":"MANAGED_VOLUME_STATE_EXPORTED","effectiveSlaDomain":{"id":"4031c11d-078e-4f14-8566-717cfffaf359","name":"sla-domain-1"}}'
    key:
      - cluster.id
      - cluster.name
      - host
      - id
  - type: Job counts
    sourcetype: rubrik_monitoring_jobs
    format: json
    desc: Job counts for one cluster. allJobs is the total and backupJobs, archiveJobs, replicationJobs, recoveryJobs and conversionJobs break it down by kind.
    sample: '{"allJobs":668241,"archiveJobs":{"count":8},"backupJobs":{"count":36092},"conversionJobs":{"count":0},"id":"7f4f96b3-e777-4bde-ba08-47a40ecaa416","logBackupJobs":{"count":0},"name":"401-rubrik","recoveryJobs":{"count":39},"replicationJobs":{"count":6},"cluster":{"id":"7562f3f9-f7ff-4828-af2c-87df3bf4f54c","name":"cluster-1"}}'
    key:
      - allJobs
      - archiveJobs.count
      - backupJobs.count
      - conversionJobs.count
  - type: SQL Server databases
    sourcetype: rubrik_mssql_databases
    format: json
    desc: One protected SQL Server database. isOnline and effectiveSlaDomain show whether it is reachable and which SLA protects it.
    sample: '{"id":"4d77e6de-0eef-4593-870b-60ac9a7a0727","name":"mssql-1","cluster":{"id":"f5ce5ffc-42d4-47bc-a64f-d928030892d5","name":"cluster-1"},"isOnline":true,"effectiveSlaDomain":{"id":"4031c11d-078e-4f14-8566-717cfffaf359","name":"sla-domain-1"}}'
    key:
      - id
      - name
      - cluster.id
      - cluster.name
  - type: Node statistics
    sourcetype: rubrik_node_statistics
    format: json
    desc: One time sample for one node. cpuStat and usedMemoryStat are percentages. IOPS, read and write throughput and network bytes show load at that time.
    sample: '{"clusterId":"4963bfb3-8fa1-4be1-b610-6c73b3676c27","clusterName":"aks-brik","clusterType":"Robo","cpuStat":56,"iopsReadsPerSecond":1,"iopsWritesPerSecond":270,"networkBytesReceived":361,"networkBytesTransmitted":545,"nodeId":"VRVW423514397","readThroughputBytesPerSecond":50312,"time":"2025-02-04T00:29:00.000Z","usedMemoryStat":84,"writeThroughputBytesPerSecond":1967273}'
    key:
      - clusterId
      - clusterName
      - clusterType
      - cpuStat
  - type: Physical hosts
    sourcetype: rubrik_physical_hosts
    format: json
    desc: One physical host registered for backup. connectionStatus.connectivity is the state of the Rubrik agent. This sample is a Windows host that is DISCONNECTED. The name uses a documentation address.
    sample: '{"id":"aed47d37-4267-4b15-9a4c-be41c215cb52","name":"203.0.113.8","connectionStatus":{"connectivity":"DISCONNECTED"},"cluster":{"id":"7562f3f9-f7ff-4828-af2c-87df3bf4f54c","name":"cluster-1"},"osType":"WINDOWS","effectiveSlaDomain":{"id":"4031c11d-078e-4f14-8566-717cfffaf359","name":"sla-domain-1"}}'
    key:
      - id
      - name
      - connectionStatus.connectivity
      - cluster.id
  - type: SLA domains
    sourcetype: rubrik_sla_domains
    format: json
    desc: One SLA domain. frequencies, allowedBackupWindows and archivalSpecs are the policy. numProtectedObjects and the num* counters say how many objects of each kind it covers.
    sample: '{"numNutanixVms":0,"numHypervVms":0,"numDbs":1,"numManagedVolumes":1,"numEc2Instances":0,"numVcdVapps":0,"numOracleDbs":0,"numFilesets":1,"numStorageArrayVolumeGroups":0,"numWindowsVolumeGroups":0,"numLinuxHosts":1,"numShares":0,"numWindowsHosts":0,"numVms":0,"numProtectedObjects":2,"id":"6fc7ca5c-5926-4a85-b236-a43a9935dff9","primaryClusterId":"5e81520e-a7e1-4ed4-adce-870804739532","name":"cluster-1","primaryClusterSlaVersion":20,"replicationTargetSlaVersion":4,"frequencies":{"daily":{"frequency":1,"retention":35},"weekly":{"frequency":1,"retention":53,"dayOfWeek":"Monday"},"monthly":{"frequency":1,"retention":3,"dayOfMonth":"FirstDay"}},"allowedBackupWindows":[{"startTimeAttributes":{"minutes":0,"hour":19},"durationInHours":13}],"firstFullAllowedBackupWindows":[],"localRetentionLimit":259200,"maxLocalRetentionLimit":32054400,"archivalSpecs":[{"locationId":"4b6ccad7-907b-41eb-88c7-3b271802d1ed","locationName":"S3:test-1","archivalThreshold":259200,"isPassthroughSupported":true}],"replicationSpecs":[{"locationId":"2d458abf-df57-4873-9075-63d7b674e307","locationName":"LOCAL","retentionLimit":259200,"replicationType":"REPLICATION_TO_CLUSTER"}],"isDefault":false,"uiColor":"#7f3340","showAdvancedUi":false}'
    key:
      - numNutanixVms
      - numHypervVms
      - numDbs
      - numManagedVolumes
  - type: Task outcomes
    sourcetype: rubrik_tasks
    format: json
    desc: Task counts for one SLA domain. succeededTasksValue, failedTasksValue, canceledTasksValue and missedTasksValue are the outcomes. This sample shows failed and missed tasks next to one success.
    sample: '{"slaDomainId":"4d77e6de-0eef-4593-870b-60ac9a7a0727","slaDomainName":"mssql-1","succeededTasksValue":1,"failedTasksValue":2,"canceledTasksValue":3,"missedTasksValue":4,"metricType":"succeeded_tasks"}'
    key:
      - slaDomainId
      - slaDomainName
      - succeededTasksValue
      - failedTasksValue
  - type: Unmanaged objects
    sourcetype: rubrik_unmanaged_objects
    format: json
    desc: Snapshots kept for an object that is no longer actively protected. unmanagedStatus (for example Relic), snapshotCount and localStorage show what is left and how much space it holds.
    sample: '{"id":"VM-UNIQUE-ID-129","name":"Virtual-Datastore","objectType":"VirtualMachine","physicalLocation":[{"managedId":"vCenter2001:db8::1VCENTER-ID","name":"location_1"},{"managedId":"DataCenter2001:db8::1DATACENTER-ID","name":"Datacenter-1"}],"unmanagedStatus":"Relic","snapshotCount":3,"isRemote":false,"localStorage":107543704053,"archiveStorage":0,"retentionSlaDomainId":"SLA-DOMAIN-ID","retentionSlaDomainName":"Backup-Policy","hasSnapshotsWithPolicy":true}'
    key:
      - id
      - name
      - objectType
      - physicalLocation[0].managedId
  - type: Virtual machines
    sourcetype: rubrik_virtual_machines
    format: json
    desc: One protected virtual machine. powerStatus, agentStatus.agentStatus and effectiveSlaDomain show its state and policy.
    sample: '{"id":"4d77e6de-0eef-4593-870b-60ac9a7a0727","name":"vm-1","cluster":{"id":"7562f3f9-f7ff-4828-af2c-87df3bf4f54c","name":"cluster-1"},"powerStatus":"ON","agentStatus":{"agentStatus":"CONNECTED"},"effectiveSlaDomain":{"id":"4031c11d-078e-4f14-8566-717cfffaf359","name":"sla-domain-1"}}'
    key:
      - id
      - name
      - cluster.id
      - cluster.name
cves: []
detections:
  - title: Backup tasks failed or were missed
    severity: high
    signals:
      - failedTasksValue
      - missedTasksValue
      - slaDomainName
    why: A failed or missed backup leaves data without a recent restore point. Attackers who plan ransomware often disrupt backups first, so a sudden rise in failed or missed tasks deserves a look as well as an operational fix.
    kql: |
      dataset="rubrik_logs"
      | where sourcetype == "rubrik_tasks" and (failedTasksValue > 0 or missedTasksValue > 0)
      | project slaDomainName, failedTasksValue, missedTasksValue, canceledTasksValue, succeededTasksValue
    mitre:
      - T1490
  - title: Protected data out of SLA compliance
    severity: medium
    signals:
      - complianceStatus
      - filesetName
      - effectiveSlaDomainName
    why: OUT_OF_COMPLIANCE means the object does not have the snapshots its SLA promises. That is the gap a recovery would fall into.
    kql: |
      dataset="rubrik_logs"
      | where sourcetype == "rubrik_filesets" and complianceStatus == "OUT_OF_COMPLIANCE"
      | project clusterName, filesetName, osType, effectiveSlaDomainName, totalSnapshots
optimizations: []
references: []
