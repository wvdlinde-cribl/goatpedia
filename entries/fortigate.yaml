id: fortigate
name: Fortinet FortiGate
short: FortiGate
vendor: Fortinet
category: ngfw
status: full
updated: "2026-11-12"
contributors:
  - wlinde
aka:
  - FortiOS
  - FortiGate-VM
  - FortiGate NGFW
  - FortiWiFi
tags:
  - firewall
  - vpn
  - sslvpn
