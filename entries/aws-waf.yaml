id: aws-waf
name: AWS WAF
short: AWS WAF
aka:
  - AWS WAFv2
  - AWS WAF Classic
  - Web ACL
  - Protection pack
  - AWS Firewall Manager (WAF policies)
vendor: Amazon Web Services
category: waf
status: full
updated: "2026-11-12"
