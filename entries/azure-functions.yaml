summary: Azure Functions is logged by the Elastic integrations package azure_functions. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: azure_functions_functionapplogs
    desc: 'Elastic integrations fixture, 4 events. Upstream: azure_functions/data_stream/functionapplogs/_dev/test/pipeline/test-azure-functions-error-raw.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: azure_functions
  Sourcetypes: '1'
  Fixture events: '4'
  Log format seen: json
  Fields in the first fixture: time, resourceId, category, operationName, level, location
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Azure Functions events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries time, resourceId, category, operationName, level, location. Values in the sample were rewritten to documentation addresses.
traffic:
