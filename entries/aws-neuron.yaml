id: aws-neuron
name: AWS Neuron
short: AWS Neuron
vendor: AWS
category: cloud
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - aws_neuron
  - Datadog integrations-core
tags:
  - logtest
  - text
summary: AWS Neuron is logged by the Datadog integrations-core package aws_neuron. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: aws_neuron
    desc: 'Datadog integrations-core fixture, 5 events. Upstream: aws_neuron/assets/logs/aws_neuron_tests.yaml'
facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: aws_neuron
  Sourcetypes: '1'
  Fixture events: '5'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: AWS Neuron events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads aws_neuron and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text.
logs:
  - type: AWS Neuron
    sourcetype: aws_neuron
    format: text
    desc: 5 fixture events in the samples pool (logtest).
    sample: INFO:Neuron:Number of arithmetic operators (pre-compilation) before = 565, fused = 548, percent fused = 96.99%
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: AWS Neuron events arriving
    severity: low
    signals:
      - message
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "aws_neuron"'
optimizations: []
references:
  - title: DataDog/integrations-core aws_neuron/assets
    url: https://github.com/DataDog/integrations-core/blob/faa3db574bb0a2d218968c7bc2134f34f1ec9155/aws_neuron/assets/logs/aws_neuron_tests.yaml
  - title: Pack Generator sample aws_neuron.json
    url: https://github.com/wvdlinde-cribl/cribl-pack-samples/blob/main/samples/aws_neuron.json
