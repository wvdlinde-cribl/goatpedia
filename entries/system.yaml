id: system
name: Windows Security Event Log
short: Win Security
vendor: Microsoft
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Windows Security log
  - Microsoft-Windows-Security-Auditing
  - WinEventLog:Security
tags:
  - windows
  - audit
  - event-log
  - active-directory
summary: The Security channel of the Windows event log, written by the Microsoft-Windows-Security-Auditing provider on every Windows computer and domain controller. Audit policy decides which actions it records — logons, privilege use, object access, account and group changes, policy changes and process creation. Each event has a numeric EventID and an EventData block with the subject, target and details, so it is the primary record of who did what on a Windows host.
sourcetypes:
  - st: system_security
    desc: Windows Security event log entries as XML, one event per audited action with EventID, computer, subject account and EventData fields
facts:
  Product: Windows audit log (Security channel) on Windows clients, servers and domain controllers
  Provider: Microsoft-Windows-Security-Auditing
  Configuration: Advanced audit policy (local or Group Policy) chooses which subcategories are recorded, as success, failure or both
  Log transport: Read locally by an agent through the Windows Event Log API, or forwarded with Windows Event Forwarding (WEF) to a collector host
  Log format: XML. A System block (Provider, EventID, TimeCreated, Computer, Channel) and an EventData block of named Data fields
  What an event answers: Which audited action happened (EventID), on which computer, by which account (SubjectUserName, SubjectUserSid), and on what object or privilege
  Example — 4674: An operation was attempted on a privileged object. PrivilegeList names the privilege and ProcessName the process that used it
placement:
  slots:
    - endpoint
    - internal
  items:
    - slot: endpoint
      title: Windows clients and servers
      desc: Every Windows computer writes its own Security log. An agent on the host, or Windows Event Forwarding, sends the events on.
    - slot: internal
      title: Domain controllers
      desc: Domain controllers write the authentication and directory-change events for the whole domain. They are the most important Security logs to collect.
howItWorks:
  - title: Audit policy
    body: Windows only writes what the audit policy asks for. Subcategories such as Logon, Sensitive Privilege Use, Security Group Management and Process Creation can each be set to audit success, failure or both.
  - title: Reading an event
    body: EventID identifies the event type, for example 4624 logon, 4625 failed logon, 4672 special privileges, 4674 privileged object operation, 4688 process creation, 4720 user created. EventData then names the subject account (SubjectUserSid, SubjectUserName, SubjectDomainName, SubjectLogonId) and the event-specific fields.
  - title: How the events leave the host
    body: The Event Log service stores the channel locally. An agent subscribes to it, or Windows Event Forwarding pushes events to a collector computer. Any collector can then render the events as XML.
traffic:
  handles:
    - Logons and authentication
    - Privilege use and privileged object operations
    - Account, group and policy changes
    - Process creation and object access
  flow:
    - step: Action happens
      desc: A user logs on, a process uses a privilege, or an admin changes an account on a Windows host.
    - step: Windows audits it
      desc: If the audit policy covers the subcategory, the Security-Auditing provider writes an event to the Security channel.
    - step: Event is forwarded
      desc: An agent or Windows Event Forwarding reads the event and sends it on as XML.
    - step: Collector parses
      desc: Goatpedia reads the event as XML, with System and EventData fields flattened.
logs:
  - type: Security events
    sourcetype: system_security
    format: xml
    desc: One audited action. EventID says what kind, Computer where, SubjectUserName and SubjectUserSid who, and the remaining EventData fields describe it. This sample is EventID 4674 — LOCAL SERVICE using SeSecurityPrivilege through lsass.exe on a domain controller.
    sample: <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing" Guid="{54849625-5478-4994-A5BA-3E3B0328C30D}" /><EventID>4674</EventID><Version>0</Version><Level>0</Level><Task>13056</Task><Opcode>0</Opcode><Keywords>0x8010000000000000</Keywords><TimeCreated SystemTime="2015-10-09T00:22:36.237816000Z" /><EventRecordID>1099680</EventRecordID><Correlation /><Execution ProcessID="496" ThreadID="504" /><Channel>Security</Channel><Computer>DC01.contoso.local</Computer><Security /></System><EventData><Data Name="SubjectUserSid">S-1-5-19</Data><Data Name="SubjectUserName">LOCAL SERVICE</Data><Data Name="SubjectDomainName">NT AUTHORITY</Data><Data Name="SubjectLogonId">0x3e5</Data><Data Name="ObjectServer">LSA</Data><Data Name="ObjectType">-</Data><Data Name="ObjectName">-</Data><Data Name="HandleId">0x0</Data><Data Name="AccessMask">16777216</Data><Data Name="PrivilegeList">SeSecurityPrivilege</Data><Data Name="ProcessId">0x1f0</Data><Data Name="ProcessName">C:\\Windows\\System32\\lsass.exe</Data></EventData></Event>
    key:
      - Provider.Name
      - Provider.Guid
      - EventID
      - Version
cves: []
detections:
  - title: Sensitive privilege used by a non-service account
    severity: medium
    signals:
      - EventID
      - PrivilegeList
      - SubjectUserName
      - SubjectUserSid
      - ProcessName
    why: 4674 events for SeDebugPrivilege, SeTcbPrivilege or SeBackupPrivilege by an ordinary user account can mean credential dumping or tampering. The built-in service accounts (S-1-5-18, S-1-5-19, S-1-5-20) use these privileges all the time and are excluded.
    kql: |
      dataset="system_logs"
      | where sourcetype == "system_security" and EventID == 4674 and PrivilegeList in ("SeDebugPrivilege", "SeTcbPrivilege", "SeBackupPrivilege") and SubjectUserSid !in ("S-1-5-18", "S-1-5-19", "S-1-5-20")
      | project TimeCreated.SystemTime, Computer, SubjectUserName, SubjectDomainName, PrivilegeList, ProcessName
    mitre:
      - T1134
optimizations:
  - title: Drop privileged object operations by built-in service accounts
    saving: much of the privilege-use volume
    fn: Drop
    how: LSASS and other services running as SYSTEM, LOCAL SERVICE or NETWORK SERVICE produce a steady stream of 4674 events. Drop 4674 from those SIDs and keep the ones made by user accounts.
    expr: EventID == '4674' && (SubjectUserSid == 'S-1-5-18' || SubjectUserSid == 'S-1-5-19' || SubjectUserSid == 'S-1-5-20')
    stream:
      log: Security events
      parse: false
      functions:
        - id: drop
          filter: /<EventID>4674<\/EventID>/.test(_raw) && /Name="SubjectUserSid">S-1-5-(18|19|20)</.test(_raw)
          description: Drop 4674 privileged object operations made by SYSTEM, LOCAL SERVICE or NETWORK SERVICE; keep those made by user accounts
          conf: {}
      test:
        - <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing" Guid="{54849625-5478-4994-A5BA-3E3B0328C30D}" /><EventID>4674</EventID><Version>0</Version><Level>0</Level><Task>13056</Task><Opcode>0</Opcode><Keywords>0x8010000000000000</Keywords><TimeCreated SystemTime="2015-10-09T00:22:36.237816000Z" /><EventRecordID>1099681</EventRecordID><Correlation /><Execution ProcessID="496" ThreadID="504" /><Channel>Security</Channel><Computer>DC01.contoso.local</Computer><Security /></System><EventData><Data Name="SubjectUserSid">S-1-5-21-1111111111-2222222222-3333333333-1104</Data><Data Name="SubjectUserName">jdoe</Data><Data Name="SubjectDomainName">EXAMPLE</Data><Data Name="SubjectLogonId">0x5a12f</Data><Data Name="ObjectServer">LSA</Data><Data Name="ObjectType">-</Data><Data Name="ObjectName">-</Data><Data Name="HandleId">0x0</Data><Data Name="AccessMask">16777216</Data><Data Name="PrivilegeList">SeSecurityPrivilege</Data><Data Name="ProcessId">0x1f0</Data><Data Name="ProcessName">C:\\Windows\\System32\\lsass.exe</Data></EventData></Event>
      expect:
        out: 1
