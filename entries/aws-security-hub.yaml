cves:
  - id: CVE-2024-6387
    cvss: 8.1
    year: 2024
    kev: false
    scope: traffic
    title: OpenSSH "regreSSHion" unauthenticated RCE — a top Inspector finding surfaced through Security Hub
    affected: OpenSSH 8.5p1 – 9.7p1 on glibc Linux (and before 4.4p1)
    fixed: OpenSSH 9.8p1 (plus distribution backports)
    detect: Inspector findings in Security Hub with Vulnerabilities[].Id=CVE-2024-6387 on EC2 instances; combine with EC2.13/EC2.19 control failures (SSH open to 0.0.0.0/0) to rank exposure.
    avoid: Patch sshd; remove 0.0.0.0/0 on port 22; use SSM Session Manager instead of public SSH.
  - id: CVE-2021-44228
    cvss: 10
    year: 2021
    kev: true
    scope: traffic
    title: Log4Shell — found by Inspector in EC2, ECR and Lambda packages
    affected: Apache Log4j 2.0-beta9 – 2.15.0 (excluding 2.12.2, 2.12.3, 2.3.1)
    fixed: Log4j 2.17.1 (Java 8), 2.12.4 (Java 7), 2.3.2 (Java 6)
    detect: Inspector findings with Vulnerabilities[].Id=CVE-2021-44228 and ExploitAvailable=YES; correlated GuardDuty findings on the same resource indicate active exploitation.
    avoid: Patch and rebuild images; ECR enhanced scanning on push; WAF Known Bad Inputs rule group.
  - id: CVE-2022-22965
    cvss: 9.8
    year: 2022
    kev: true
    scope: traffic
    title: Spring4Shell — Spring Framework data-binding RCE in Java workloads
    affected: Spring Framework 5.3.0 – 5.3.17, 5.2.0 – 5.2.19 on JDK 9+ (Tomcat WAR deployment)
    fixed: Spring Framework 5.3.18, 5.2.20
    detect: Inspector findings with Vulnerabilities[].Id=CVE-2022-22965 on ECR images / EC2; prioritise those behind internet-facing ALBs.
    avoid: Upgrade Spring (or Spring Boot 2.6.6 / 2.5.12); WAF rule group with the Spring4Shell signatures.
  - id: CVE-2023-44487
    cvss: 7.5
    year: 2023
    kev: true
    scope: traffic
    title: HTTP/2 Rapid Reset DoS — in web servers and proxies on EC2 and in containers
    affected: HTTP/2 server implementations (nginx, Envoy, Go net/http, Tomcat, Jetty, …) before their October 2023 fixes
    detect: Inspector findings with Vulnerabilities[].Id=CVE-2023-44487 on self-managed web tiers. AWS-managed ALB/CloudFront were mitigated by AWS.
    avoid: Patch the HTTP/2 stacks; put self-managed servers behind CloudFront/ALB with AWS Shield.
  - id: CVE-2024-3094
    cvss: 10
    year: 2024
    kev: false
    scope: traffic
    title: xz/liblzma backdoor (supply chain) — packaged into some rolling-release distro images
    affected: xz-utils / liblzma 5.6.0 and 5.6.1
    detect: Inspector findings with Vulnerabilities[].Id=CVE-2024-3094 in ECR images or EC2 instances built from Fedora Rawhide/Debian testing/Kali-era images.
    avoid: Rebuild with a non-backdoored xz (distributions reverted to 5.4.x); pin base images; ECR continuous scanning.
detections:
  - title: Critical or high new finding (any product)
    severity: high
    signals:
      - Severity.Label in CRITICAL / HIGH
      - RecordState=ACTIVE
      - Workflow.Status=NEW
    why: The single triage queue for AWS-native detections — GuardDuty, Inspector, Macie and Access Analyzer all land here with one schema.
    kql: |-
      dataset="aws_security_hub"
      | where Severity.Label in ("CRITICAL","HIGH") and RecordState=="ACTIVE" and Workflow.Status=="NEW"
      | summarize count(), first=min(_time) by ProductName, Title, AwsAccountId
    mitre:
      - T1078.004
  - title: Public exposure control newly failing
    severity: high
    signals:
      - Compliance.SecurityControlId in S3.8 / S3.1 / EC2.19 / RDS.2
      - Compliance.Status=FAILED
    why: A bucket, security group or database just became public — often a misconfiguration minutes before data is exposed or a deliberate step by an attacker.
    kql: |-
      dataset="aws_security_hub" Compliance.Status="FAILED"
      | where Compliance.SecurityControlId in ("S3.1","S3.8","EC2.19","RDS.2","Lambda.1")
      | summarize first=min(_time) by Compliance.SecurityControlId, Resources[0].Id, AwsAccountId
    mitre:
      - T1530
  - title: Exploitable vulnerability on an internet-facing workload
    severity: high
    signals:
      - ProductName=Inspector
      - Vulnerabilities[0].ExploitAvailable=YES
      - resource also fails an exposure control
    why: Inspector's exploit flag plus a public network path is the shortest route to T1190; joining the two control families prioritises patching.
    kql: |-
      dataset="aws_security_hub" detail.findings[0].ProductName="Inspector"
      | where detail.findings[0].Vulnerabilities[0].ExploitAvailable=="YES" and detail.findings[0].Severity.Label in ("CRITICAL","HIGH")
      | summarize cves=make_set(detail.findings[0].Vulnerabilities[0].Id) by detail.findings[0].Resources[0].Id, detail.findings[0].AwsAccountId
    mitre:
      - T1190
  - title: Findings suppressed or archived in bulk
    severity: medium
    signals:
      - Workflow.Status=SUPPRESSED or RecordState=ARCHIVED
      - many findings, one actor
    why: An attacker with securityhub:BatchUpdateFindings or automation-rule rights can silence detections. Pair with CloudTrail BatchUpdateFindings / CreateAutomationRule / DisableSecurityHub events.
    kql: |-
      dataset="aws_security_hub"
      | where Workflow.Status=="SUPPRESSED" or RecordState=="ARCHIVED"
      | summarize n=count(), products=make_set(ProductName) by AwsAccountId, bin(_time, 1h)
      | where n > 50
    mitre:
      - T1562.001
  - title: GuardDuty TTP finding via Security Hub
    severity: high
    signals:
      - ProductName=GuardDuty
      - Types[0] startswith TTPs/
    why: The ASFF TTP namespace already names the ATT&CK tactic; useful when Security Hub is the only AWS feed in the SIEM.
    kql: |-
      dataset="aws_security_hub" ProductName="GuardDuty"
      | where Types[0] startswith "TTPs/"
      | summarize count() by Types[0], Resources[0].Id, AwsAccountId
    mitre:
      - T1552.005
optimizations:
  - title: Drop PASSED control re-evaluations
    saving: 40–80 %
    fn: Drop
    how: "Most control findings are re-sent as PASSED on every evaluation. Keep a PASSED only when it follows a FAILED (state change) and drop the rest — or send them to Lake for compliance reporting."
    expr: Compliance && Compliance.Status=='PASSED' && ProductName=='Security Hub'
  - title: Split detail.findings[] and unwrap the envelope
    saving: 5–15 %
    fn: Unroll → Eval
    how: One EventBridge event can carry several findings. Unroll detail.findings into one event per finding, then drop version, id, source, detail-type and the resources array.
    expr: "unroll: detail.findings → finding; remove: version, id, source, detail-type, resources"
  - title: Suppress unchanged updates
    saving: 20–50 %
    fn: Suppress
    how: Keep one event per finding Id per state; repeated updates with the same status and severity (only UpdatedAt/LastObservedAt changed) are dropped.
    expr: "key: `${Id}:${Compliance && Compliance.Status}:${Severity.Label}:${RecordState}`  allow 1 / 86400s"
  - title: Strip remediation text and duplicate fields
    saving: 10–25 %
    fn: Parser → Serialize
