    sourcetype: aws_securityhub_finding
    format: json
    share: 70–95 %
    avg: ~3 KB
    desc: "One CSPM control result for one resource. Compliance.Status says whether the resource passes; the same Id is re-sent on every evaluation."
    key:
      - Title
      - Severity.Label
      - Compliance.Status
      - Compliance.SecurityControlId
      - AwsAccountId
      - Resources[0].Id
      - Workflow.Status
      - RecordState
    noise:
      - SchemaVersion
      - Remediation.Recommendation.Text
      - ProductFields.aws/securityhub/ProductName
      - ProductFields.aws/securityhub/CompanyName
