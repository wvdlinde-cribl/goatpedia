# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: aws-security-hub
name: AWS Security Hub
short: Security Hub
aka:
  - AWS Security Hub CSPM
  - ASFF
  - AWS Security Finding Format
vendor: Amazon Web Services
category: cloud
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - aws
  - cspm
  - findings
  - asff
  - ocsf
  - json
  - eventbridge
  - compliance
summary: The AWS findings aggregator and posture-management service. Security Hub CSPM runs compliance controls (AWS FSBP, CIS, PCI DSS, NIST) against your accounts and imports findings from GuardDuty, Inspector, Macie, IAM Access Analyzer, Config and partner tools, all normalised to the AWS Security Finding Format (ASFF). The newer Security Hub correlates the same signals and uses OCSF. For a SIEM it is a single feed of AWS security findings, but control re-evaluations make it noisier than it looks.
sourcetypes:
  - st: aws_security_hub
    desc: Pack Generator sourcetype for Security Hub EventBridge events (Security Hub Findings - Imported)
  - st: aws_securityhub_finding
    desc: Pack Generator sourcetype for a single ASFF finding
  - st: aws:securityhub:finding
    desc: Splunk Add-on for AWS sourcetype for Security Hub findings
  - st: AWSSecurityHubFindings
    desc: Microsoft Sentinel table for Security Hub findings
  - st: AWS_SECURITY_HUB
    desc: Google SecOps (Chronicle) log type
  - st: aws_securityhub_findings
    desc: 'Elastic integrations fixture, 6 events. Upstream: aws/data_stream/securityhub_findings/_dev/test/pipeline/test-securityhub-findings.log'
facts:
  First released: re:Invent 2018 (GA June 2019); OCSF-based Security Hub alongside "Security Hub CSPM" from 2025
  Delivery model: Managed regional service; delegated administrator + cross-region aggregation for the organization
  Finding sources: Own CSPM controls, GuardDuty, Inspector, Macie, IAM Access Analyzer, Config, Firewall Manager, Health, 3rd-party products via BatchImportFindings
  Log transport: EventBridge (Security Hub Findings - Imported), then Firehose/SQS/HTTP; GetFindings API; export to Security Lake
  Log format: "JSON — ASFF (SchemaVersion 2018-10-08); new Security Hub findings in OCSF 1.6"
  Severity: "Label INFORMATIONAL / LOW / MEDIUM / HIGH / CRITICAL (Normalized 0–100)"
  Typical volume: Thousands to millions of findings/day per organization — control re-evaluations dominate
  Cribl Pack: None found in the Packs Dispensary (OCSF Post Processor pack can help with OCSF output)
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Delegated administrator account
      desc: Security Hub is enabled for the organization from a security account. Findings from every member account arrive there, and EventBridge rules in that account forward them.
    - slot: cloud
      title: Aggregation region
      desc: Cross-region aggregation copies findings from linked regions into one home region, so one EventBridge rule captures the whole organization. Without it you need a rule (and collector) per region.
    - slot: cloud
      title: Security Lake / SIEM export
      desc: Findings are often sent on to Amazon Security Lake (OCSF in S3) or streamed via EventBridge → Firehose into Cribl and the SIEM.
howItWorks:
  - title: Normalisation to ASFF
    body: Every integrated product sends findings through BatchImportFindings in ASFF — a fixed JSON schema with ProductArn, GeneratorId, Types (namespace/category/classifier), Severity, Resources[], Compliance, Workflow and RecordState. ProductFields holds the vendor-specific extras.
  - title: Security controls and standards
    body: Security Hub CSPM evaluates controls (e.g. S3.8, IAM.6, EC2.19) mostly through AWS Config rules, and periodically or on change re-evaluates them. Each evaluation updates the control finding with Compliance.Status PASSED, FAILED, WARNING or NOT_AVAILABLE. Consolidated control findings produce one finding per control per resource instead of one per standard.
  - title: Finding lifecycle
    body: "A finding keeps its Id; updates change UpdatedAt and fields such as Compliance.Status, RecordState (ACTIVE/ARCHIVED) and Workflow.Status (NEW, NOTIFIED, RESOLVED, SUPPRESSED). Every update is a new EventBridge event, so a single misconfiguration can produce an event per evaluation cycle."
  - title: Automations and enrichment
    body: Automation rules rewrite severity, workflow or notes on matching findings at import time; BatchUpdateFindings lets SOAR and analysts change workflow state. Insights are saved group-by queries over findings.
  - title: OCSF-based Security Hub
    body: The newer Security Hub (the classic service is now called Security Hub CSPM) correlates GuardDuty, Inspector, Macie and posture signals into exposure findings and stores findings in OCSF 1.6. Plan parsers for both shapes during a migration.
traffic:
  handles:
    - CSPM control findings (FSBP, CIS, PCI DSS, NIST 800-53)
    - GuardDuty threat findings
    - Inspector vulnerability findings (EC2, ECR, Lambda)
    - Macie sensitive-data findings
    - IAM Access Analyzer external-access findings
    - AWS Config and Firewall Manager findings
    - Third-party findings via BatchImportFindings
  flow:
    - step: Signal
      desc: A control evaluation, GuardDuty detection, Inspector scan or partner product produces a result.
    - step: Import
      desc: The result is sent to Security Hub as an ASFF finding (BatchImportFindings).
    - step: Automation
      desc: Automation rules adjust severity, workflow or notes; duplicates are merged on Id.
    - step: Aggregate
      desc: The finding is copied to the delegated admin account and the aggregation region.
    - step: Emit
      desc: EventBridge publishes a Security Hub Findings - Imported event with detail.findings[].
    - step: Collect
      desc: An EventBridge rule targets Firehose / SQS / an HTTP endpoint; Cribl splits detail.findings[] into one event per finding.
logs:
