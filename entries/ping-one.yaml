summary: Ping One is logged by the Datadog integrations-core package ping_one. The Pack Generator samples pool holds fixture events for 2 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: ping_one
    desc: 'Datadog integrations-core fixture, 1 events. Upstream: ping_one/assets/logs/ping-one_tests.yaml'
  - st: ping_one_audit
    desc: 'Elastic integrations fixture, 20 events. Upstream: ping_one/data_stream/audit/_dev/test/pipeline/test-pipeline-audit.log'
facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: ping_one
  Sourcetypes: '2'
  Fixture events: '21'
  Log format seen: json
  Fields in the first fixture: result.description, result.status, createdAt, actors.client.environment.id, actors.client.name, actors.client.id
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Ping One events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries result.description, result.status, createdAt, actors.client.environment.id, actors.client.name, actors.client.id. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads ping_one and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
