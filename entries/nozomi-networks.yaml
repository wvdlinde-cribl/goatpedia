  - type: Sessions
    sourcetype: nozomi_networks_session
    format: json
    desc: One object per session between two nodes. from and to are the endpoints, from_port, to_port, protocol and transport_protocol describe the traffic, and transferred counts bytes and packets. The sample uses documentation addresses.
