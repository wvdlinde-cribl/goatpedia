cves: []
detections:
  - title: Open high-severity OT alert
    severity: high
    signals:
      - severity
      - type_name
      - ip_src
      - ip_dst
      - status
    why: A program change, a new engineering link or a threat match on a controller is the core OT security signal. Severity 10 is highest. Open alerts that nobody acknowledged need triage.
    kql: |
      dataset="nozomi-networks_logs"
      | where sourcetype == "nozomi_networks_alert" and severity >= 7 and status == "open"
      | project time, type_name, severity, ip_src, ip_dst, zone_src, zone_dst, protocol
    mitre:
      - T0843
  - title: Known exploited vulnerability on an OT node
    severity: medium
    signals:
      - cve
      - is_kev
      - cve_score
      - name
    why: A CVE on the KEV list is one that attackers use. On a controller or an HMI it raises the priority of segmentation and patching.
    kql: |
      dataset="nozomi-networks_logs"
      | where sourcetype == "nozomi_networks_node_cve" and is_kev == true
      | project time, cve, cve_score, cve_epss_score, name, vendor, nodes
optimizations:
  - title: Keep sessions and variables out of the SIEM
    saving: most of the Nozomi volume
    fn: Routes
    how: Sessions and process variables are continuous telemetry, refreshed for every link and tag. Alerts, audit and vulnerabilities are the security subset. Route sessions and variables to cheaper storage and send the rest to the SIEM.
    expr: sourcetype == 'nozomi_networks_session' || sourcetype == 'nozomi_networks_variable'
    stream:
      routes:
        - name: Nozomi sessions → cheap storage
          filter: /"transport_protocol":/.test(_raw) && /"transferred\.bytes":/.test(_raw)
          to: Cribl Lake or other low-cost storage
          final: true
        - name: Nozomi process variables → cheap storage
          filter: /"var_key":/.test(_raw) && /"flow_status":/.test(_raw)
          to: Cribl Lake or other low-cost storage
          final: true
        - name: Nozomi alerts, audit, vulnerabilities and other records → SIEM
          filter: 'true'
          to: The SIEM, full fidelity
          final: true
      note: Routes see the raw event, so they match keys that only session records (transport_protocol, transferred.bytes) or process variable records (var_key, flow_status) carry. If your source sets sourcetype, you can use sourcetype == 'nozomi_networks_session' || sourcetype == 'nozomi_networks_variable' instead. Put the two telemetry routes before the SIEM route.
