summary: An OT and IoT security platform. Guardian sensors passively watch industrial network traffic from a SPAN or TAP, decode protocols such as EtherNet/IP, Modbus and IEC 104, build an asset inventory and raise alerts on anomalies and threats. Vantage (SaaS) or the CMC aggregates sensors. Its data is alerts, assets and nodes, vulnerabilities, sessions, process variables, sensor health and the platform audit trail.
sourcetypes:
  - st: nozomi_networks_alert
    desc: Alerts raised by a sensor, such as a program change on a PLC, with source and destination nodes, protocol, zone and risk
  - st: nozomi_networks_asset
    desc: Assets in the inventory, grouping nodes into one device with vendor, type, OS or firmware, risk and lifecycle
  - st: nozomi_networks_audit
    desc: 'Audit trail of the platform: sign-ins, API key sessions and configuration actions, with user and address'
  - st: nozomi_networks_health
    desc: Sensor health and system messages, such as upgrade notices, with the sensor host and type
  - st: nozomi_networks_node
    desc: 'Network nodes seen by a sensor: one address with its role, zone, vendor, product and protocols'
  - st: nozomi_networks_node_cve
    desc: Vulnerabilities matched to a node by its vendor, product and firmware, with CVE score, EPSS and KEV flag
  - st: nozomi_networks_session
    desc: 'Sessions between nodes: endpoints, ports, protocol, status and bytes and packets transferred'
  - st: nozomi_networks_variable
    desc: Process variables read from industrial protocols, with host, value, range, protocol and change counts
facts:
  Product: Passive OT/IoT network monitoring, asset inventory, vulnerability and threat detection
  Form factor: Guardian sensors (physical, virtual or container) on industrial networks, managed by Vantage SaaS or an on-premises CMC
  Log transport: HTTPS query API on Guardian, CMC or Vantage, polled by a collector. Syslog and CEF forwarding are also available for alerts
  Log format: One JSON object per record, per data set (alerts, assets, nodes, sessions and others)
  What an alert answers: What happened (type_name, name), between which nodes and zones, over which protocol, and how serious it is (severity, risk)
  What an audit event answers: Who signed in or acted on the platform, from where, and through which controller or API key
  What a node CVE answers: Which industrial or IT device has which CVE, how severe and likely it is, and whether it is known exploited
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Guardian sensor
      desc: Guardian sits on the OT network, fed by a SPAN port or TAP on industrial switches. It sees controller, HMI and engineering station traffic and never sits inline.
    - slot: cloud
      title: Vantage or CMC
      desc: Vantage in the cloud, or a CMC on premises, gathers sensor data across sites. A collector queries its API for alerts, assets, audit and the other data sets.
howItWorks:
  - title: Passive protocol decoding
    body: Guardian decodes industrial and IT protocols from mirrored traffic. From that it learns nodes, sessions between them, and process variables that controllers read and write.
  - title: Baseline and alerts
    body: After a learning phase Guardian alerts on deviations such as a new node, a new link, a PLC program change or a variable outside its range, and on threat-intelligence and signature matches. Each alert names source and destination nodes, zones, roles and a severity.
  - title: Inventory and vulnerabilities
    body: Nodes are grouped into assets with vendor, product, firmware and lifecycle. Asset Intelligence and CPE matching attach CVEs to nodes with scores, EPSS and a KEV flag.
  - title: How the records leave the product
    body: Each data set can be queried over the HTTPS API with an API key. A collector polls each one and keeps a time cursor. Alerts can also be pushed as syslog or CEF.
traffic:
  handles:
    - Industrial protocols (EtherNet/IP, Modbus, IEC 104 and others)
    - OT asset discovery
    - Anomaly and threat alerts
    - Platform administration
  flow:
    - step: Traffic mirrored
      desc: Industrial switches mirror traffic to the Guardian sensor.
    - step: Sensor learns and alerts
      desc: Guardian updates nodes, sessions, variables and assets, and raises alerts on anomalies and threats.
    - step: Central aggregation
      desc: Vantage or the CMC receives the sensor data and the audit trail.
    - step: Collector queries
      desc: A collector polls the API per data set and receives JSON records.
logs:
  - type: Alerts
    sourcetype: nozomi_networks_alert
    format: json
    desc: One object per alert. type_name and name say what happened, ip_src and ip_dst with zone_src and zone_dst say between which nodes, protocol says how, and severity and properties.base_risk say how serious. This sample is a PLC program change from an engineering station, still open and not acknowledged. The sample uses documentation addresses.
    sample: '{"id":"6dbf93f8-d8da-4ae3-bf1a-e91a82fc3041","ack":false,"name":"Program change","note":"User Defined Note","synchronized":true,"time":1747398906110,"id_dst":"198.51.100.25","id_src":"203.0.113.8","ip_dst":"203.0.113.40","ip_src":"192.0.2.10","status":"open","mac_dst":"2001:db8::1","mac_src":"2001:db8::1","parents":["id1"],"port_dst":44818,"port_src":58679,"protocol":"ethernetip","severity":10,"zone_dst":"Production_B","zone_src":"Production_B","dst_roles":"producer","label_dst":"private.directinvesting.com1","label_src":"private.directinvesting.com2","src_roles":"consumer, engineering_station","ti_source":"","type_name":"Program change","session_id":"12eszcd-223cds34","replicated":true,"bpf_filter":"(ip host 192.0.2.20 and ip host 198.51.100.15 and tcp port 58679 and tcp port 44818) or (vlan and ip host 198.51.100.25 and ip host 203.0.113.8 and tcp port ...","properties":{"to_id":"203.0.113.40","from_id":"192.0.2.10","base_risk":6,"raised_by":"n2os_ids","n2os_version":"25.0.0-03042016_D5AB7","is_dst_public":false,"is_src_public":false,"is_dst_node_learned":true,"is_src_node_learned":true,"mitre_attack_for_ics":{"source":{"types":["Engineering Workstation"],"levels":["2"]},"destination":{"types":["Field Controller/RTU/PLC/IED"],"levels":["2"]}},"is_dst_reputation_bad":false,"is_src_reputation_bad":false}}'
    key:
      - id
      - ack
      - name
      - note
  - type: Assets
    sourcetype: nozomi_networks_asset
    format: json
    desc: One object per asset. ip, mac_address, os, vendor and product_name identify the device, type and roles say what it does, and risk and lifecycle say how exposed and how old it is. The sample uses documentation addresses.
    sample: '{"id":"f855ca08-ec50-4953-ba47-abb18464013e","ip":["192.0.2.20"],"os":"Mac OS X","name":"198.51.100.15","risk":2,"time":1746643849541,"type":"typehost","level":"level1","roles":["other"],"zones":["Undefined"],"vendor":"unknown","os:info":{"source":"passive"},"lifecycle":"life-cycle","protocols":["smb","http"],"type:info":{"source":"passive"},"created_at":1681948201431,"mac_vendor":["Cisco Systems, Inc"],"mac_address":["2001:db8::1"],"vendor:info":{"source":"passive"},"product_name":"pname","serial_number":"123456789","capture_device":"demo","is_ai_enriched":false,"lifecycle:info":{"source":"passive"},"os_or_firmware":"fware","appliance_hosts":["Demo Sensor iq e6ef8db9"],"end_of_sale_date":1747994353,"firmware_version":"fv2","mac_address_level":{"2001:db8::1":"unconfirmed"},"product_name:info":{"source":"passive"}}'
    key:
      - id
      - ip[0]
      - os
      - name
  - type: Audit trail
    sourcetype: nozomi_networks_audit
    format: json
    desc: One object per platform action. name and event describe it, action is the operation, username is who, and ip_address is where from. This sample is an API key signing in. The sample uses documentation addresses.
    sample: '{"id":"e68f6c04-fe98-4549-abcf-6a2213249c3c","name":"API key signed in","event":"API key signed in with id 7a6534a6-ee49-4cb3-a0ae-1f3a6cac9b26","action":"create","browser":"python-requests/2.32.3","details":null,"username":"user@example.com via APIkey AK6eef5d","controller":"api/api_key_sessions","ip_address":"203.0.113.8","record_created_at":1747028333580,"time":1747028333579}'
    key:
      - id
      - name
      - event
      - action
  - type: Sensor health
    sourcetype: nozomi_networks_health
    format: json
    desc: One object per health or system message. info.description is the message, and sensor_host and sensor_appliance_type name the sensor it is about.
    sample: '{"id":"f8c3fe6d-6926-4cbe-b51d-08f38a72c593","info":{"description":"Recommended changes. The following items should be changed to support the updates included in version 22.5.0.\n\nAlert rules:\nNothing to change here\n\nAssertion..."},"time":1741868841845,"record_created_at":1741869377517,"sensor_id":"1c08da2c-e7e9-4030-b956-cada6e0a9a96","sensor_host":"Sandbox-TAE-Guardian3","sensor_appliance_type":"guardian"}'
    key:
      - id
      - info.description
      - time
      - record_created_at
  - type: Nodes
    sourcetype: nozomi_networks_node
    format: json
    desc: One object per node seen on the network. ip, name and label identify it, type and roles say what it is, and vendor, protocols and properties carry what the sensor decoded, such as a PLC product name and firmware. The sample uses documentation addresses.
    sample: '{"id":"9b492faf-5cf2-4b91-b745-f1e903bba5d1","ip":"2001:db8::1","os":"Windows XP SP3","name":"00112231@203.0.113.40","type":"controller","zone":"Layer2","label":"ACMEincHQ_SW2","level":"1.5","roles":["other"],"subnet":"192.0.2.10/24","vendor":"Rockwell Automation","os:info":{"source":"none"},"is_public":false,"lifecycle":"end_of_sale","protocols":["ethernetip"],"type:info":{"source":"passive","protocol":"ethernetip"},"bpf_filter":"ip host 192.0.2.20","created_at":1725960106182,"is_learned":true,"label:info":{"source":"none"},"mac_vendor":"Schweitzer Engineering Laboratories","properties":{"_type.passive":"controller","_vendor.passive":"Rockwell Automation/Allen-Bradley","ethernetip/vendor":"Rockwell Automation/Allen-Bradley","ethernetip/vendor_id":"1","_product_name.passive":"ControlLogix 1756-ENBT/A","ethernetip/device_type":"Communications Adapter","ethernetip/product_code":"166","ethernetip/product_name":"1756-ENBT/A","ethernetip/serial_number":"00112231","ethernetip/device_type_id":"12","ethernetip/firmware_version":"18.002"},"reputation":"test reputation","sent.bytes":"0","is_disabled":false,"links_count":"1","mac_address":"2001:db8::1","vendor:info":{"source":"passive","protocol":"ethernetip","confidence":"high","granularity":"complete"},"_is_licensed":true,"is_broadcast":false}'
    key:
      - id
      - ip
      - os
      - name
  - type: Node vulnerabilities
    sourcetype: nozomi_networks_node_cve
    format: json
    desc: One object per CVE matched to a node. cve and cve_score name it, is_kev and cve_epss_score say how likely it is to be used, and name, vendor and nodes identify the affected device. The sample uses documentation addresses.
    sample: '{"id":"4e046f7f-f76f-4d1f-9585-97eedffd863b","cve":"CVE-2021-30992","cve_score":5.5,"time":1742300286262,"minimum_hotfix":"KB3074683","latest_hotfix":"KB5059091","matching_cpes":["cpe:/o:apple:ipados:13.3.1:-:-"],"cwe_name":"Out-of-bounds Read","cve_summary":"This issue was addressed with improved handling of file metadata. This issue is fixed in iOS 15.2 and iPadOS 15.2. A user in a FaceTime call may unexpectedly...","references":[{"url":"https://support.xyz.com/en-us","name":"About the security content of iOS 15.2 and iPadOS 15.2","source":"user@example.com","reference_type":"Vendor Advisory"}],"is_kev":false,"cve_creation_time":1629832523963,"cve_update_time":1732183506837,"cve_source":"user@example.com","probability":"Confirmed","likelihood":1,"resolved":false,"nodes":["198.51.100.15","localhost"],"zones":["Production_B"],"name":"iPad Pro 12.9\" 2nd Gen (Wi-Fi)","type":"tablet","vendor":"Apple","product_name":"iPad Pro 12.9\" 2nd Gen (Wi-Fi)","firmware_version":"","os":"iPadOS 13_3_1","record_created_at":1742300286108,"cve_epss_score":0.00066,"cwe_id":"125","asset_id":"616489ea-7bd3-41e7-a618-aecfa9f3d91a","appliance_host":"sensor-east-01"}'
