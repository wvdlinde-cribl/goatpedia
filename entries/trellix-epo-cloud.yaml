id: trellix-epo-cloud
name: Trellix ePO Cloud
short: ePO Cloud
vendor: Trellix
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Trellix ePolicy Orchestrator
  - ePO
tags:
  - epo
  - endpoint
  - json
summary: Trellix ePolicy Orchestrator in the cloud is the console for Trellix endpoint products. Agents on workstations and servers check in, and the console stores the system tree, the managed devices, and the events those products report. Three JSON streams cover that. Events are the detections and actions. Devices and groups are the inventory. A collector pulls each one from the ePO cloud API.
sourcetypes:
  - st: trellix_epo_cloud
    desc: One event reported to ePO, such as an endpoint-security scan result, with the analyzer and the target
  - st: trellix_epo_cloud_device
    desc: One managed device in the system tree, with its agent, operating system and address
  - st: trellix_epo_cloud_group
    desc: One group in the system tree, with its name, parent and path
facts:
  Product: Cloud ePolicy Orchestrator. It manages Trellix agents and stores the events those products send up
  Where agents sit: On endpoints. The console and its API are the Trellix cloud at api.manage.trellix.com
  Log transport: HTTPS JSON from the ePO cloud API. Events, devices and groups are separate resources
  Log format: One JSON object per record. type says which resource. attributes holds the fields. links.self is the API path
  What an event answers: Which analyzer on which host reported what, and the source and target of that event
  What a device answers: Whether the agent is managed, which OS it runs, and when it last updated
  What a group answers: Where the device sits in the system tree
placement:
  slots:
    - cloud
    - endpoint
  items:
    - slot: cloud
      title: ePO cloud console
      desc: The system tree, devices and events live in the Trellix cloud. A collector calls the ePO API. links.self on each object is that API path. The console is not tied to one SIEM.
    - slot: endpoint
      title: Managed agent
      desc: The agent on the host is attributes.agentguid on an event and attributes.agentGuid on a device. analyzerhostname and analyzeripv4 are the host that reported the event. Addresses in the samples are documentation addresses.
howItWorks:
  - title: Events
    body: An event is something an endpoint product reported. type MVEvents is that record. attributes.analyzer and attributes.analyzername are the product, such as Trellix Endpoint Security. attributes.analyzerdetectionmethod is how it was found. The sample method is a quick scan. attributes.targetprocessname, targetusername and the source and target addresses are the two sides of the event when the product has them. attributes.timestamp is when ePO took the event.
  - title: Devices and groups
    body: A device is one managed node. attributes.name and attributes.computerName are the host. attributes.managed and attributes.agentState say whether ePO is managing it. attributes.osType, osVersion and ipAddress describe the machine. attributes.tags is the tag list. A group is a folder in the system tree. attributes.name, attributes.parentId and attributes.nodeTextPath place it. The sample group is GlobalRoot, the top of the tree.
  - title: How the three are collected
    body: The API serves events, devices and groups as separate lists. A collector requests each list. Any collector with access to the tenant can do this. Goatpedia reads these samples as JSON.
traffic:
  handles:
    - Endpoint product events reported to ePO
    - The managed-device inventory
    - The system-tree groups
  flow:
    - step: Agent checks in
      desc: A Trellix agent reports events and its own identity to the ePO cloud console.
    - step: Console stores three kinds of record
      desc: Events, devices and groups are separate objects. type on the object says which one it is.
    - step: Collector pulls JSON
      desc: A collector requests each resource from the API and forwards the objects.
logs:
  - type: Threat event
    sourcetype: trellix_epo_cloud
    format: json
    desc: One event object. type is MVEvents. attributes.analyzername is the product and attributes.analyzerdetectionmethod is how it was found. This sample is Trellix Endpoint Security doing a quick scan, with a target process and documentation addresses on the analyzer and the target.
    sample: '{"id":"0102be3a-41db-448c-9a68-bce7c480d443","type":"MVEvents","links":{"self":"/epo/v2/events/0102be3a-41db-448c-9a68-bce7c480d443"},"attributes":{"timestamp":"2023-04-06T23:36:14.041Z","autoguid":"9fcf439b-82d7-425c-1234-abcdefghijklmn","detectedutc":"1680823939000","receivedutc":"1680824174041","agentguid":"8630b925-cbd2-ed11-1234-abcdefghijklmn","analyzer":"ENDP_AM_1070LYNX","analyzername":"Trellix Endpoint Security","analyzerversion":"198.51.100.15","analyzerhostname":"ub20","analyzeripv4":"198.51.100.25","analyzeripv6":"/2001:db8::1","analyzermac":"00005E005300","analyzerdatversion":"5298.0","analyzerengineversion":"6600.9927","analyzerdetectionmethod":"quick scan","sourcehostname":null,"sourceipv4":"203.0.113.8","sourceipv6":"/2001:db8::1","sourcemac":"00005E005300","sourceusername":null,"sourceprocessname":null,"sourceurl":"https://example.com","targethostname":null,"targetipv4":"203.0.113.40","targetipv6":"/2001:db8::1","targetmac":"00005E005300","targetusername":"root","targetport":null,"targetprotocol":null,"targetprocessname":"/usr/sbin/logrotate"}}'
    key:
      - id
      - type
      - links.self
      - attributes.timestamp
  - type: Managed device
    sourcetype: trellix_epo_cloud_device
    format: json
    desc: One device object. attributes.name and attributes.computerName are the host. attributes.agentVersion, osType and ipAddress describe the agent and the machine. This sample is a managed Linux server. ipAddress is a documentation address.
    sample: '{"id":"314623","type":"devices","links":{"self":"https://api.manage.trellix.com/epo/v2/devices/314623"},"attributes":{"name":"localhost","parentId":854691,"agentGuid":"3AF594B1-13D2-ED11-87C6-000000800B73","lastUpdate":"2023-04-07T08:38:35.517+00:00","agentState":0,"nodePath":null,"agentPlatform":"LINUX","agentVersion":"192.0.2.10","nodeCreatedDate":"2023-03-29T12:06:05.877+00:00","managed":"1","tenantId":61399,"tags":"Deployment 2, Deployment, Server","excludedTags":"","managedState":1,"computerName":"localhost","domainName":"(none)","ipAddress":"192.0.2.20","osType":"Linux","osVersion":"3.10","osBuildNumber":0,"cpuType":"Intel(R) Xeon(R) CPU E5-2620 v2 @ 2.10GHz","cpuSpeed":2100,"numOfCpu":4,"totalPhysicalMemory":12409634816,"macAddress":"00005E005300","userName":"N/A","osPlatform":"Server","ipHostName":"localhost","subnetAddress":"","isPortable":"non-portable"},"relationships":{"installedProducts":{"links":{"self":"https://api.manage.trellix.com/epo/v2/devices/314623/relationships/installedProducts","related":"https://api.manage.trellix.com/epo/v2/devices/314623/installedProducts"}}}}'
    key:
      - id
      - type
      - links.self
      - attributes.name
  - type: System tree group
    sourcetype: trellix_epo_cloud_group
    format: json
    desc: One group object. attributes.name is the folder and attributes.nodeTextPath is where it sits. This sample is GlobalRoot, the top of the tree, with no parent.
    sample: '{"id":"1","type":"groups","links":{"self":"https://api.manage.trellix.com/epo/v2/groups/1"},"attributes":{"name":"GlobalRoot","groupTypeId":7,"parentId":0,"l1ParentId":null,"l2ParentId":null,"notes":null,"nodePath":"1","nodeTextPath":"GlobalRoot","nodeTextPath2":"\\"},"relationships":{"subGroups":{"links":{"self":"https://api.manage.trellix.com/epo/v2/groups/1/relationships/subGroups","related":"https://api.manage.trellix.com/epo/v2/groups/1/subGroups"}}}}'
    key:
      - id
      - type
      - links.self
      - attributes.name
cves: []
detections: []
optimizations:
  - title: Sample the device inventory
    saving: most of the device-inventory volume
    fn: Drop
    how: Devices and groups are a snapshot of the system tree, repeated on each poll, and a large tenant has far more of those rows than threat events. Keep the event stream in full. Sample or drop the device and group snapshots before the SIEM.
    expr: "sourcetype == 'trellix_epo_cloud_device' || sourcetype == 'trellix_epo_cloud_group'"
references:
  - title: Trellix documentation
    url: https://docs.trellix.com/
