id: vsphere
name: VMware vSphere
short: vSphere
vendor: Broadcom
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - vSphere
  - VMware vCenter Server
  - vCenter
tags:
  - virtualization
  - syslog
  - audit
  - text
summary: VMware vSphere is the virtualization platform that runs virtual machines under ESXi and is managed by vCenter Server. vCenter and the appliance it runs on write syslog for administration, including who was authorized to call the appliance management service. This stream is that syslog, kept as one text line. Any syslog collector can receive it.
sourcetypes:
  - st: vsphere
    desc: One syslog line from vCenter or the vCenter appliance. The sample is an appliance-management authorization decision
facts:
  Product: Virtualization platform. ESXi hosts run the virtual machines. vCenter Server manages the hosts, clusters and the appliance itself
  Where it sits: On the internal management network. Administrators reach vCenter from their workstations
  Log transport: Syslog from vCenter and the appliance. A collector receives it on the syslog port the operator configured
  Log format: One text line per event. This stream keeps the line in message
  What the sample line answers: Whether an appliance-management call was authorized, and whether the method was local
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: vCenter Server
      desc: vCenter sits on the management network and is the control plane for the ESXi hosts. Appliance management audit (applmgmt-audit) is the vCenter appliance deciding whether a local or remote caller may run a management action. The syslog hostname in the sample is vcenter.
howItWorks:
  - title: The appliance management audit
    body: vCenter writes more than one log. This stream is the syslog the appliance emits. The sample program is applmgmt-audit. The message is an AuthorizationResponse with authorized true or false and a method such as LOCAL. authorized is the decision. method is how the caller authenticated.
  - title: How to read the line
    body: The line is RFC 5424 syslog plus the appliance's own text. Because the stream stores it as message, a search looks for AuthorizationResponse and the authorized flag inside that string. A true result is a call that was allowed. A false result is a call the appliance refused.
  - title: How the line is collected
    body: vCenter forwards syslog to a collector. The product does not bind that collector to one SIEM. Goatpedia reads these samples as text.
traffic:
  handles:
    - Appliance management authorization decisions
    - Other vCenter syslog the host forwards on the same stream
  flow:
    - step: Administrator calls vCenter
      desc: Someone or a local process calls the appliance management service.
    - step: Appliance writes the decision
      desc: applmgmt-audit logs an AuthorizationResponse with the authorized flag and the method.
    - step: Syslog leaves the appliance
      desc: vCenter sends the line to the configured syslog collector.
logs:
  - type: Appliance syslog
    sourcetype: vsphere
    format: text
    desc: One syslog line in message. This sample is applmgmt-audit reporting AuthorizationResponse authorized=True and method=LOCAL, so a local caller was allowed. A refused call has authorized=False in the same text.
    sample: '<14>1 2021-09-06T14:40:05.753710+00:00 vcenter applmgmt-audit - - -  2021-09-06T14:40:05.753: INFO AuthorizationResponse = { authorized=True, method=LOCAL }'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Appliance management call refused
    severity: medium
    signals:
      - message
    why: authorized=False is the appliance refusing a management call. Repeated refusals are someone, or a script, failing to administer vCenter. The sample line is an allowed local call, which is the ordinary case.
    kql: |
      dataset="vsphere_logs"
      | where sourcetype == "vsphere" and message has "authorized=False"
      | project message
optimizations: []
references:
  - title: VMware vSphere documentation
    url: https://docs.vmware.com/en/VMware-vSphere/index.html
