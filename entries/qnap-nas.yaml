id: qnap-nas
name: QNAP NAS (QTS)
short: QNAP NAS
vendor: QNAP Systems
category: storage
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - QNAP QTS
  - QNAP QuTS hero
  - QuLog Center
tags:
  - nas
  - storage
  - file-sharing
  - syslog
  - text
summary: Network-attached storage appliances from QNAP running the QTS or QuTS hero operating system. They serve files over SMB, NFS, AFP and web apps and run many add-on applications. Their system event and connection logs, collected by QuLog Center, record admin and user actions, network and storage events, and are sent as syslog.
sourcetypes:
  - st: qnap_nas
    desc: QNAP system event and access log lines sent as syslog by qulogd, with user, source IP, application, category and content
facts:
  Product: Network-attached storage with file sharing and apps
  Form factor: Desktop and rack NAS appliances running QTS or QuTS hero
  Log transport: Syslog from QuLog Center to a remote server
  Log format: 'Syslog lines with labelled fields: Users, Source IP, Computer name, Application, Category, Content'
  What an event answers: Which user from which address did what in which NAS application, or what changed on the system
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: NAS appliance
      desc: The NAS sits on the internal network and serves files to users and servers. Some are exposed to the internet through myQNAPcloud or port forwarding, which is a common attack path.
howItWorks:
  - title: System events
    body: 'QTS logs system events from its applications and services: users, network, storage, updates and security settings. Each names the user, source IP, application and category.'
  - title: Access logs
    body: Connection logs record file service and web logins and file access by protocol.
  - title: How the log leaves the product
    body: QuLog Center collects the logs and can send them as syslog to a remote server.
traffic:
  handles:
    - SMB, NFS and AFP file sharing
    - NAS web administration
    - Storage and network events
  flow:
    - step: Action or change
      desc: A user logs in or changes a setting, or the system has a network or storage event.
    - step: QTS logs it
      desc: The event is written to the system or connection log.
    - step: Syslog out
      desc: QuLog Center sends it as syslog to the receiver.
logs:
  - type: NAS event log
    sourcetype: qnap_nas
    format: text
    desc: One syslog line per event from qulogd. Users is the account, Source IP the client, Application and Category where it happened, and Content what happened. This sample is a network adapter disconnecting. The sample uses documentation addresses.
    sample: '<28>Oct 30 20:28:41 qnap-nas01 qulogd[14629]: event log: Users: admin, Source IP: 198.51.100.25, Computer name: ---, Application: Network & Virtual Switch, Category: Infrastructure, Content: [Network & Virtual Switch] Interface "Adapter 2" disconnected.'
    pattern: (?<message>[\s\S]+)
    key:
      - message
