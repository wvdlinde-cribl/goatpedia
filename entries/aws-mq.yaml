    url: https://github.com/elastic/integrations/blob/cbfff90638a7565377768f50726775c0febc7bf4/packages/aws_mq/data_stream/rabbitmq_general_logs/_dev/test/pipeline/test-amazonmq-rabbitmq-general.log
