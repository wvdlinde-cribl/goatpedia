id: aws-mq
name: Amazon MQ
short: Amazon MQ
vendor: Amazon Web Services
category: cloud
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - AWS MQ
  - Amazon MQ for RabbitMQ
tags:
  - message-broker
  - rabbitmq
  - aws
  - cloud
  - text
summary: A managed message broker service on AWS that runs Apache ActiveMQ or RabbitMQ for the customer. Applications connect over AMQP, MQTT, STOMP or OpenWire, and AWS operates the broker hosts. For RabbitMQ brokers, Amazon MQ publishes the broker's general log to CloudWatch Logs, which records connections, TLS handshakes, authentication and broker events.
sourcetypes:
  - st: aws_mq_rabbitmq_general_logs
    desc: The RabbitMQ general log of an Amazon MQ broker, one line per broker message with time, level, Erlang process and text
facts:
  Product: Managed ActiveMQ and RabbitMQ brokers
  Deployment: Single-instance or cluster brokers in the customer's VPC or publicly accessible
  Log transport: CloudWatch Logs log group per broker, when general logging is enabled
  Log format: RabbitMQ text log line with timestamp, level in brackets, Erlang process id and message
  What a general log line answers: What the broker did, such as accepting or closing a connection, authenticating a user or rejecting a TLS handshake
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Amazon MQ broker
      desc: The broker runs in AWS, reachable from the customer's VPC or publicly. Its general log goes to a CloudWatch log group in the account.
howItWorks:
  - title: Brokers
    body: Amazon MQ runs the RabbitMQ engine on hosts AWS manages. Clients connect to the broker endpoint with a username and password over TLS.
  - title: General log
    body: The RabbitMQ general log records connections opening and closing, user authentication, channel errors and TLS alerts. Each line has a level such as info, notice, warning or error.
  - title: How the logs leave the service
    body: With general logging enabled, Amazon MQ writes the broker's log to CloudWatch Logs. A collector subscribes to or reads the log group.
traffic:
  handles:
    - AMQP and other client connections to the broker
    - Authentication and TLS handshakes
    - Queue and exchange operations
  flow:
    - step: Client connects
      desc: An application opens a TLS connection to the broker and authenticates.
    - step: Broker logs
      desc: RabbitMQ writes a line to its general log about the connection or error.
    - step: CloudWatch receives
      desc: Amazon MQ publishes the line to the broker's CloudWatch log group, where a collector reads it.
logs:
  - type: RabbitMQ general log
    sourcetype: aws_mq_rabbitmq_general_logs
    format: text
    desc: One line per broker message with time, level, Erlang process and text. This sample is a TLS handshake refused with Insufficient Security, a client offering ciphers or a protocol version the broker does not accept.
    sample: '2025-03-21 06:25:13.777161+00:00 [notice] <0.10337402.0> TLS server: In state hello at tls_handshake.erl:354 generated SERVER ALERT: Fatal - Insufficient Security'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections: []
optimizations: []
references:
  - title: Amazon MQ developer guide
    url: https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html
