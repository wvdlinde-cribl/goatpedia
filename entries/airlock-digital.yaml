  - st: airlock_digital_execution_histories
    desc: 'Elastic integrations fixture, 2 events. Upstream: airlock_digital/data_stream/execution_histories/_dev/test/pipeline/test-execution-histories.log'
  - st: airlock_digital_server_activities
    desc: 'Elastic integrations fixture, 2 events. Upstream: airlock_digital/data_stream/server_activities/_dev/test/pipeline/test-server-activities.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: airlock_digital
  Sourcetypes: '3'
  Fixture events: '6'
  Log format seen: json
  Fields in the first fixture: agentid, clientversion, domain, freespace, groupid, hostname
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Airlock Digital events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries agentid, clientversion, domain, freespace, groupid, hostname. Values in the sample were rewritten to documentation addresses.
