summary: Palo Alto Networks' cloud-native application protection platform. Its posture side scans cloud accounts for misconfigurations and raises policy alerts. Its compute side runs Defenders on hosts and containers to profile workloads, find vulnerabilities and detect runtime attacks. Its data covers alerts, the console audit trail, misconfigured assets, vulnerabilities, host profiles and runtime incident audits.
sourcetypes:
  - st: prisma_cloud_alert
    desc: 'Posture alerts: a cloud resource violating a policy, with the policy, status, resource and attribution'
  - st: prisma_cloud_audit
    desc: 'Audit trail of the Prisma Cloud console and API: logins and changes by users and access keys'
  - st: prisma_cloud_host_profile
    desc: 'Runtime profiles that Defenders learned for a host: apps, processes, ports and SSH activity'
  - st: prisma_cloud_incident_audit
    desc: Runtime incidents from Defenders, with the attack type, technique, effect and the host or container
  - st: prisma_cloud_misconfiguration
    desc: Assets scanned against posture policies, with pass or fail and alert counts by severity
  - st: prisma_cloud_vulnerability
    desc: Vulnerabilities found on cloud assets, with CVE, CVSS, EPSS, KEV, exposure and fix status
facts:
  Product: 'CNAPP: cloud security posture (CSPM) plus workload protection (CWPP)'
  Deployment: SaaS console, cloud account onboarding by API, and Defender agents on hosts, containers and serverless
  Log transport: HTTPS REST APIs for posture and Compute, polled by a collector with an access key. Alerts can also be pushed through integrations
  Log format: One JSON object per alert, audit entry, asset, vulnerability, profile or incident
  What an alert answers: Which cloud resource broke which policy, how severe it is, and who created the resource
  What an audit entry answers: Who logged in to or changed the console, from where, and whether it succeeded
  What an incident audit answers: What runtime attack Defender saw on which host or container, and what it did about it
placement:
  slots:
    - cloud
    - internal
  items:
    - slot: cloud
      title: Prisma Cloud console
      desc: The console and its APIs run as SaaS. It connects to AWS, Azure, GCP and OCI accounts by API to read configuration and activity. A collector polls its APIs.
    - slot: internal
      title: Defenders on workloads
      desc: Defender agents run on hosts, Kubernetes nodes and containers in cloud or on-premises networks. They profile workloads and report runtime events and vulnerabilities to the console.
howItWorks:
  - title: Posture
    body: Prisma Cloud reads cloud account configuration and evaluates it against policies. A failing resource produces an alert with the policy, the resource and attribution of who created it. Misconfiguration records list each asset with its pass or fail state.
  - title: Workload protection
    body: Defenders learn a runtime model of each host and container (processes, ports, network) and flag deviations and known attack techniques as incidents, with an effect such as alert, prevent or block.
  - title: Vulnerabilities
    body: Images, hosts and packages are scanned for CVEs. Each finding carries CVSS, EPSS, KEV, internet exposure and whether a fix exists.
  - title: How the data leaves the product
    body: A collector uses an access key to call the alert, audit, asset and vulnerability APIs, and the Compute API for host profiles and incidents. Each call returns JSON pages.
traffic:
  handles:
    - Cloud account configuration
    - Host and container runtime activity
    - Vulnerability scanning
    - Console administration
  flow:
    - step: Scan or observe
      desc: Prisma Cloud scans cloud accounts, and Defenders watch workloads.
    - step: Findings raised
      desc: Policy failures become alerts, runtime attacks become incidents, and CVEs become vulnerability findings.
    - step: Collector polls
      desc: A collector calls the APIs with an access key for each data type.
    - step: JSON out
      desc: Each finding or audit entry becomes one JSON event.
logs:
  - type: Posture alerts
    sourcetype: prisma_cloud_alert
    format: json
