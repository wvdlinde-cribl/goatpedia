cves: []
detections:
  - title: Failed Prisma Cloud console login
    severity: medium
    signals:
      - actionType
      - result
      - user
      - ipAddress
    why: A failed login to the console or by access key is someone using a wrong or revoked credential. The console controls cloud-wide security policy, so repeated failures matter.
    kql: |
      dataset="prisma-cloud_logs"
      | where sourcetype == "prisma_cloud_audit" and actionType == "LOGIN" and result == "fail"
      | project timestamp, user, ipAddress, action
    mitre:
      - T1110
  - title: Internet-exposed vulnerability that is known exploited
    severity: high
    signals:
      - CVE_ID
      - CISA_KEV
      - INTERNET_EXPOSED
      - ASSET_ID
    why: A KEV vulnerability on an asset reachable from the internet is the case attackers reach first. These findings should go to the front of the patch queue.
    kql: |
      dataset="prisma-cloud_logs"
      | where sourcetype == "prisma_cloud_vulnerability" and CISA_KEV == "Y" and INTERNET_EXPOSED == "Y"
      | project CVE_ID, CVSS_BASE_SCORE, SEVERITY, ASSET_ID, PACKAGE_NAME, FIX_VERSION
    mitre:
      - T1190
optimizations:
  - title: Send posture inventory to cheaper storage
    saving: most of the Prisma Cloud volume
    fn: Routes
    how: Misconfiguration records and host profiles are inventory that is refreshed on every scan. Alerts, audit entries, runtime incidents and exploitable vulnerabilities are the security subset for the SIEM.
    expr: sourcetype == 'prisma_cloud_misconfiguration' || sourcetype == 'prisma_cloud_host_profile'
    stream:
      routes:
        - name: Prisma Cloud posture inventory → Lake
          filter: /"scannedPolicy":|"overallPassed":|"sshEvents":|"startupProcess":/.test(_raw)
          to: Cribl Lake or other low-cost storage
          final: true
        - name: Prisma Cloud alerts, audit, incidents, vulnerabilities → SIEM
          filter: /"policyId":|"actionType":|"audits":|"CVE_ID":/.test(_raw)
          to: The SIEM
          final: true
      note: Routes see the raw event, so they match keys that only the misconfiguration (asset posture) and host profile records carry; if your source sets sourcetype, use sourcetype == 'prisma_cloud_misconfiguration' || sourcetype == 'prisma_cloud_host_profile' instead. Put the inventory route first.
