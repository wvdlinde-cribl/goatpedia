summary: Prisma Cloud is logged by the Elastic integrations package prisma_cloud. The Pack Generator samples pool holds fixture events for 6 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: prisma_cloud_alert
    desc: 'Elastic integrations fixture, 4 events. Upstream: prisma_cloud/data_stream/alert/_dev/test/pipeline/test-alert.log'
  - st: prisma_cloud_audit
    desc: 'Elastic integrations fixture, 5 events. Upstream: prisma_cloud/data_stream/audit/_dev/test/pipeline/test-audit.log'
  - st: prisma_cloud_host_profile
    desc: 'Elastic integrations fixture, 1 events. Upstream: prisma_cloud/data_stream/host_profile/_dev/test/pipeline/test-host-profile.log'
  - st: prisma_cloud_incident_audit
    desc: 'Elastic integrations fixture, 1 events. Upstream: prisma_cloud/data_stream/incident_audit/_dev/test/pipeline/test-incident-audit.log'
  - st: prisma_cloud_misconfiguration
    desc: 'Elastic integrations fixture, 4 events. Upstream: prisma_cloud/data_stream/misconfiguration/_dev/test/pipeline/test-misconfiguration.log'
  - st: prisma_cloud_vulnerability
    desc: 'Elastic integrations fixture, 3 events. Upstream: prisma_cloud/data_stream/vulnerability/_dev/test/pipeline/test-vulnerability.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: prisma_cloud
  Sourcetypes: '6'
  Fixture events: '18'
  Log format seen: json
  Fields in the first fixture: id, alertAdditionalInfo.scannerVersion, alertAttribution.attributionEventList[0].event, alertAttribution.attributionEventList[0].event_ts, alertAttribution.attributionEventList[0].username, alertAttribution.resourceCreatedBy
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Prisma Cloud events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries id, alertAdditionalInfo.scannerVersion, alertAttribution.attributionEventList[0].event, alertAttribution.attributionEventList[0].event_ts, alertAttribution.attributionEventList[0].username, alertAttribution.resourceCreatedBy. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads prisma_cloud and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
