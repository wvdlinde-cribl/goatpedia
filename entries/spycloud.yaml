# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: spycloud
name: SpyCloud
short: SpyCloud
vendor: SpyCloud, Inc.
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - SpyCloud Enterprise Protection
  - SpyCloud Compass
tags:
  - threat-intelligence
  - credential-exposure
  - infostealer
  - identity
summary: A SaaS service that recaptures stolen data from breaches, combo lists and infostealer malware logs and matches it to a customer's domains and employees. The breach catalog describes each source SpyCloud has collected, breach records are the exposed identities and credentials that belong to your watchlist, and Compass records describe devices infected by infostealer malware and what was stolen from them. Together they tell you whose credentials are in criminal hands and from where.
sourcetypes:
  - st: spycloud_breach_catalog
    desc: One entry per breach or malware source SpyCloud has collected, with dates, category, number of records, confidence and which data types it contains
  - st: spycloud_breach_record
    desc: One exposed identity matching the watchlist, with email, username, password information, target site and the infected machine details when it came from malware
  - st: spycloud_compass
    desc: One infostealer record from Compass, describing an infected device and a credential stolen from it, with host, OS, browser, target URL and IPs
facts:
  Product: Recaptured breach, combo list and infostealer data matched to an organisation
  Watchlist: The customer's domains, emails and IP ranges. Records are matched against it
  Severity: Each record has a severity that reflects what was exposed, from an email only up to plaintext passwords and malware-sourced session data
  Log transport: HTTPS JSON, pulled from the SpyCloud API with an API key
  Log format: One JSON object per catalog entry or record
  What a breach record answers: Which employee identity was exposed, for which site, with which password type, and from which source
  What a Compass record answers: Which device was infected by an infostealer, who owned it, and which credentials were taken from it
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: SpyCloud platform
      desc: SpyCloud collects and parses breach and malware data outside the customer's network and stores matches in its SaaS platform. A collector polls the API for new records.
howItWorks:
  - title: Recapture
    body: SpyCloud researchers obtain breach dumps, combo lists and infostealer logs. Each source becomes a breach catalog entry with dates, a category, record counts, a confidence score and a list of asset types it holds.
  - title: Matching to the watchlist
    body: Records in each source are parsed and matched to customer watchlist domains and emails. A match is a breach record with the identity, password details and the source id that points back to the catalog.
  - title: Infostealer data
    body: Infostealer malware takes saved credentials, cookies and system details from an infected browser. Those records carry infected_machine_id, infected_time, user_hostname, user_os, user_browser, ip_addresses and the target_url the credential was saved for. Compass presents this malware-sourced data per device.
  - title: How the data leaves the product
    body: A collector calls the SpyCloud API for catalog entries and for records published since its last poll. Each is a JSON object for any destination.
traffic:
  handles:
    - Exposed employee credentials from breaches
    - Infostealer infections and stolen sessions
    - Breach source metadata
  flow:
    - step: Data is recaptured
      desc: SpyCloud obtains a breach dump or malware log and adds it to its catalog.
    - step: Records are matched
      desc: Identities in the source that belong to the customer watchlist become breach or Compass records.
    - step: Collector polls
      desc: A collector requests newly published records and catalog entries from the API.
    - step: Events are JSON
      desc: Each record is one JSON object. Goatpedia reads these samples as JSON.
logs:
  - type: Breach catalog
    sourcetype: spycloud_breach_catalog
    format: json
    desc: One breach source. title, breach_date, acquisition_date and spycloud_publish_date describe it, num_records and confidence size it, and assets lists the data types it contains. The sample uses example.com.
    sample: '{"acquisition_date":"2022-01-15","breach_category":"credentials","breach_date":"2022-01-10","breach_main_category":"personal","breached_companies":[{"company_name":"ExampleCorp","industry":"unknown"}],"combo_list_flag":"YES","confidence":85,"consumer_category":"individuals","description":"Data breach containing user credentials","id":46201,"media_urls":["https://example.com/image1.jpg","https://example.com/image2.jpg"],"NA":"event","num_records":100000,"premium_flag":"NO","public_date":"2022-01-20","sensitive_source":true,"short_title":"ExampleBreach","site":"example.com","site_description":"Website for testing purposes","spycloud_publish_date":"2022-01-25","title":"Example Breach","tlp":"amber","type":"data","uuid":"def456","assets":{"account_caption":537892,"account_image_url":891234,"account_last_activity_time":456721,"account_login_time":987345,"account_modification_time":123456,"account_nickname":678912,"account_notes":234567,"account_password_date":789123,"account_secret":345678,"account_secret_question":912345,"account_signup_time":234789,"account_status":567890,"account_title":890123,"account_type":123456,"active_investor":789012,"address_1":345678,"address_2":901234,"age":567890,"av_softwares":123456,"backup_email":789012,"backup_email_username":234567,"bank_number":890123,"birthplace":456721,"buys_online":987345,"cat_owner":123456,"cc_bin":678912,"cc_code":234567,"cc_expiration":789012,"cc_last_four":345678,"cc_number":901234}}'
    key:
      - acquisition_date
      - breach_category
      - breach_date
      - breach_main_category
  - type: Breach records
    sourcetype: spycloud_breach_record
    format: json
    desc: One exposed identity. email, username and target_domain say whose account and for which site, password_type says what kind of password was exposed, and infected_machine_id, user_hostname and ip_addresses appear when it came from malware. Values are synthetic and use documentation addresses.
    sample: '{"infected_time":"2023-01-15T12:30:45Z","spycloud_publish_date":"2023-01-20T08:00:00Z","severity":3,"infected_path":"/documents/confidential","target_url":"https://example.com/login","document_id":"3350f1da-fa39-4415-b2cc-02057e2fbe99","user_sys_domain":"8ad8.default","country_code":"US","country":"United States","user_hostname":"workstation-1","user_os":"Windows 10","homepage":"https://www.chess.com/member/sarahjoh","target_domain":"example.com","email":"user@example.com","full_name":"John Doe","email_domain":"example.com","email_username":"john.doe","username":"john_doe","password":"P@ssw0rd123","password_plaintext":"******","password_type":"alphanumeric","user_browser":"Chrome","ip_addresses":["203.0.113.8","203.0.113.40"],"infected_machine_id":"ABC123","av_softwares":["McAfee","Windows Defender"],"log_id":"76afa48107ec32f51a2aba4a314357c1e69d2267f1b04bf1afc948d0f77b1658","user_sys_registered_owner":"John Milk","source_id":50436,"target_subdomain":"login.example.com","domain":"example1.com"}'
    key:
      - infected_time
      - spycloud_publish_date
      - severity
      - infected_path
  - type: Compass infostealer records
    sourcetype: spycloud_compass
    format: json
    desc: One credential stolen by infostealer malware. infected_machine_id, user_hostname, user_os and infected_time describe the infected device, and email, target_url and target_domain say which account was taken. Values are synthetic and use documentation addresses.
    sample: '{"infected_time":"2023-10-18T06:00:00Z","spycloud_publish_date":"2023-10-25T00:00:00Z","severity":3,"infected_path":"/home/user/documents/malware","document_id":"0d7a806a-3c6b-481a-ac74-70785e05f4e7","country":"United States","user_os":"Windows 10","user_hostname":"User-PC","user_sys_domain":"8ad8.default","postal_code":"86663","country_code":"US","target_url":"http://www.targetsite.com/page","homepage":"www.difficult.com","email":"user@example.com","email_domain":"example.com","email_username":"user","full_name":"Erin Roberts","target_domain":"targetsite.com","user_browser":"Chrome 94.0.4606.81","password":"123456789","source_id":50684,"ip_addresses":["192.0.2.10","192.0.2.20"],"infected_machine_id":"MACH789","av_softwares":["McAfee","Windows Defender"],"log_id":"LOG98765","user_sys_registered_owner":"John Kim","keyboard_languages":["English (US)","Spanish"],"domain":"example1.com","target_subdomain":"subdomain.targetsite.com","password_type":"Complex"}'
    key:
      - infected_time
      - spycloud_publish_date
      - severity
      - infected_path
cves: []
detections:
  - title: Employee credentials exposed
    severity: high
    signals:
      - email
      - target_domain
      - password_type
      - severity
    why: A breach record means a password tied to a company identity is available to criminals. If it is reused or current, it is a ready-made login. Reset and check for use.
    kql: |
      dataset="spycloud_logs"
      | where sourcetype == "spycloud_breach_record"
      | project spycloud_publish_date, email, username, target_domain, password_type, severity, source_id
    mitre:
      - T1078
  - title: Device infected by infostealer malware
    severity: high
    signals:
      - infected_machine_id
      - user_hostname
      - email
      - target_url
    why: A Compass record means a device used by someone in the organisation was infected and its saved credentials were taken. The device needs cleaning and every credential saved on it needs resetting.
    kql: |
      dataset="spycloud_logs"
      | where sourcetype == "spycloud_compass" and isnotempty(infected_machine_id)
      | project infected_time, infected_machine_id, user_hostname, user_os, email, target_url
    mitre:
      - T1555.003
optimizations: []
references: []
