summary: Spycloud is logged by the Elastic integrations package spycloud. The Pack Generator samples pool holds fixture events for 3 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: spycloud_breach_catalog
    desc: 'Elastic integrations fixture, 1 events. Upstream: spycloud/data_stream/breach_catalog/_dev/test/pipeline/test-breach-catalog.log'
  - st: spycloud_breach_record
    desc: 'Elastic integrations fixture, 2 events. Upstream: spycloud/data_stream/breach_record/_dev/test/pipeline/test-breach-record.log'
  - st: spycloud_compass
    desc: 'Elastic integrations fixture, 1 events. Upstream: spycloud/data_stream/compass/_dev/test/pipeline/test-compass.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: spycloud
  Sourcetypes: '3'
  Fixture events: '4'
  Log format seen: json
  Fields in the first fixture: acquisition_date, breach_category, breach_date, breach_main_category, breached_companies[0].company_name, breached_companies[0].industry
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Spycloud events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries acquisition_date, breach_category, breach_date, breach_main_category, breached_companies[0].company_name, breached_companies[0].industry. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads spycloud and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
