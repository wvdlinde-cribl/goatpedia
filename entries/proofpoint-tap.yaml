summary: Proofpoint Tap is logged by the Elastic integrations package proofpoint_tap. The Pack Generator samples pool holds fixture events for 3 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: proofpoint_tap_clicks_blocked
    desc: 'Elastic integrations fixture, 6 events. Upstream: proofpoint_tap/data_stream/clicks_blocked/_dev/test/pipeline/test-clicks-blocked.log'
  - st: proofpoint_tap_clicks_permitted
    desc: 'Elastic integrations fixture, 5 events. Upstream: proofpoint_tap/data_stream/clicks_permitted/_dev/test/pipeline/test-clicks-permitted.log'
  - st: proofpoint_tap_message_blocked
    desc: 'Elastic integrations fixture, 7 events. Upstream: proofpoint_tap/data_stream/message_blocked/_dev/test/pipeline/test-message-blocked.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: proofpoint_tap
  Sourcetypes: '3'
  Fixture events: '18'
  Log format seen: json
  Fields in the first fixture: url, classification, clickTime, threatTime, userAgent, campaignId
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Proofpoint Tap events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries url, classification, clickTime, threatTime, userAgent, campaignId. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads proofpoint_tap and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
