    url: https://github.com/DataDog/integrations-core/blob/faa3db574bb0a2d218968c7bc2134f34f1ec9155/anthropic_compliance_logs/assets/logs/anthropic-compliance-logs_tests.yaml
  - title: Pack Generator sample anthropic_compliance_logs.json
