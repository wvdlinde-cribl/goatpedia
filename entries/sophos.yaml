summary: Sophos is logged by the Elastic integrations package sophos. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: sophos_utm
    desc: 'Elastic integrations fixture, 20 events. Upstream: sophos/data_stream/utm/_dev/test/pipeline/test-sophos-utm-http.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: sophos
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: kv
  Fields in the first fixture: header, id, severity, sys, sub, name
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Sophos events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries header, id, severity, sys, sub, name. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - kv
  flow:
    - step: Collect
      desc: The Elastic integrations package reads sophos and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as kv.
logs:
