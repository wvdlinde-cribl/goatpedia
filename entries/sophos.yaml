# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: sophos
name: Sophos UTM
short: Sophos UTM
vendor: Sophos
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Sophos Unified Threat Management
  - Astaro Security Gateway
  - Sophos UTM Web Protection
tags:
  - utm
  - firewall
  - web-proxy
  - secure-web-gateway
summary: A unified threat management appliance that combines firewall, intrusion prevention, VPN, email and web protection on one gateway at the network edge. Its web protection runs an HTTP/S proxy that filters browsing by category, reputation and application and scans downloads. The httpproxy log records each web request through that proxy — who asked for which URL, what the gateway decided, and why.
sourcetypes:
  - st: sophos_utm
    desc: The Sophos UTM web proxy (httpproxy) log, one line per HTTP/S request with user, URL, category, reputation, action and timings
facts:
  Product: UTM gateway — firewall, IPS, VPN, web and email protection
  Form factor: Hardware appliance, virtual appliance or cloud instance running Sophos UTM 9
  Log transport: Syslog from the appliance to a remote syslog server, or log files on the appliance
  Log format: Syslog header (time, host, daemon[pid]) followed by key="value" pairs
  What a web request answers: Which user and source IP requested which URL, which category and reputation it had, and whether the proxy passed or blocked it
  Other daemons: Firewall (packet filter), IPS, VPN and mail daemons use the same key="value" style with their own sys and sub values
placement:
  slots:
    - edge
  items:
    - slot: edge
      title: UTM gateway
      desc: The appliance sits between the internal network and the internet. Users browse through its web proxy, transparently or explicitly. It writes the log locally and can forward it by syslog to any collector.
howItWorks:
  - title: Web protection
    body: The httpproxy daemon handles web traffic. It authenticates the user when configured, looks up the URL category and reputation, applies the web filter profile, scans the content with the antivirus engines, and passes or blocks the request.
  - title: Reading a line
    body: sys and sub say which subsystem wrote the line (SecureWeb, http). action is the decision. srcip, user and group say who browsed. url, method, statuscode and size describe the request. category, categoryname, reputation and application explain the filter decision. The *time fields are timings in milliseconds.
  - title: How the log leaves the appliance
    body: The UTM keeps local log files and can send every daemon's log to remote syslog servers. Any syslog collector can receive them.
traffic:
  handles:
    - HTTP and HTTPS web browsing
    - URL category and reputation filtering
    - Download antivirus scanning
    - Application control
  flow:
    - step: User browses
      desc: A browser or application on the internal network requests a URL through the gateway.
    - step: Proxy decides
      desc: httpproxy checks the user, category, reputation, application and content, then passes or blocks the request.
    - step: Line is written
      desc: The proxy writes one syslog line with key="value" pairs for the request.
    - step: Collector receives
      desc: The UTM forwards the line by syslog. Goatpedia reads it as key-value pairs.
logs:
  - type: Web proxy requests
    sourcetype: sophos_utm
    format: kv
    desc: One web request through the proxy. action is the decision, srcip and user say who, url, method and statuscode describe the request, and categoryname and reputation explain the filter result. This sample is a HEAD request that was passed (action pass, reputation trusted). Addresses use documentation ranges.
    sample: '2023:03:08-15:00:00 sophos-test-vm1 httpproxy[6267]: id="0001" severity="info" sys="SecureWeb" sub="http" name="http access" action="pass" method="HEAD" srcip="203.0.113.8" dstip="203.0.113.40" user="testuser" group="testgroup" ad_domain="example.com" statuscode="200" cached="0" profile="HTTP_Sophos_Profile_1" filteraction="REF_HTTP_ACTION" size="311" request="0x7fad9e44ac00" url="https://myurl.test.com/extension" referer="https://referer.test.com/" error="" authtime="0" dnstime="5" aptptime="0" cattime="200" avscantime="0" fullreqtime="32181" device="0" auth="0" ua="Microsoft BITS/7.8" exceptions="" category="178" reputation="trusted" categoryname="Internet Services" application="googplay" app-id="816" country="United States" content-type="application/octet-stream"'
    key:
      - id
      - severity
      - sys
      - sub
cves: []
detections:
  - title: Web request blocked by the proxy
    severity: medium
    signals:
      - action
      - user
      - srcip
      - url
      - categoryname
      - reputation
    why: A block means the proxy refused a URL by category, reputation or malware scan. Repeated blocks for one user or to malicious categories point at an infected host or risky browsing.
    kql: |
      dataset="sophos_logs"
      | where sourcetype == "sophos_utm" and sub == "http" and action != "pass"
      | project time, srcip, user, url, action, categoryname, reputation
optimizations:
  - title: Route trusted, allowed browsing to storage
    saving: most of the web proxy volume
    fn: Routes
    how: Most proxy lines are allowed requests to trusted sites. Keep blocks and non-trusted reputations in the SIEM and send allowed, trusted requests to cheaper storage for investigations.
    expr: action == 'pass' && reputation == 'trusted'
references:
  - title: Sophos documentation
    url: https://docs.sophos.com/
