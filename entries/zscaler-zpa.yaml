cves:
  - id: CVE-2026-59564
    cvss: 9.1
    year: 2026
    kev: false
    scope: device
    title: Authentication bypass between Zscaler Client Connector and the Client Connector Portal
    affected: Client Connector before Windows 4.6.0.457 / 4.7.0.317 / 4.8.0.232 / 4.9.0.372, macOS 4.5.2.312 / 4.7.0.292 / 4.8.0.191, Linux 3.7.2.64 / 4.2.1.64, Android & ChromeOS 4.2, iOS 4.5.1
    fixed: The versions listed above (per train) and later
    detect: User Status records with a Version older than the fixed build; new Hostname values authenticating for an existing Username; PosturesMiss suddenly empty on a device that used to fail posture.
    avoid: Enforce minimum ZCC versions in the app profile; alert on Version below the fixed build in User Status; require posture profiles in access policy.
  - id: CVE-2023-28805
    cvss: 9.8
    year: 2023
    kev: false
    scope: device
    title: Client Connector for Linux improper input validation → privilege escalation
    affected: Zscaler Client Connector for Linux before 1.4.0.105
    fixed: 1.4.0.105
    detect: User Status records with Platform=linux and Version below 1.4.0.105; on the host, EDR sees child processes of the ZCC service running as root.
    avoid: Upgrade Linux ZCC; report outdated versions from User Status; restrict local shell access on Linux endpoints.
  - id: CVE-2026-31431
    cvss: 7.8
    year: 2026
    kev: true
    scope: device
    title: Linux kernel local privilege escalation (algif_aead) — on customer-managed App Connector, Private Service Edge and Private Cloud Controller hosts
    affected: Linux kernel 4.14 and later until patched by the OS vendor (Zscaler lists App Connector, Network Connector, PSE and PCC as needing OS updates)
    detect: Not visible in LSS. Track App Connector Status Platform/Version and patch level; investigate unexpected restarts (TimestampUnAuthentication followed by a new ConnectorStartTime) and any interactive logins on connector hosts.
    avoid: Patch the connector OS kernel per the OS vendor; keep connectors on Zscaler-supported images; no interactive accounts beyond admin break-glass.
  - id: CVE-2021-44228
    cvss: 10
    year: 2021
    kev: true
    scope: traffic
    title: Log4Shell (Apache Log4j2 JNDI injection) — private Java apps published through ZPA
    affected: Apache Log4j2 2.0-beta9 to 2.14.1 (incomplete fixes up to 2.16.0)
    fixed: 2.17.1 (Java 8), 2.12.4 (Java 7), 2.3.2 (Java 6)
    detect: AppProtection logs matching JNDI lookup patterns (${jndi:) in headers or URLs; afterwards, outbound LDAP/RMI from the app server in firewall logs. User Activity shows only the connection, not the payload.
    avoid: Enable an AppProtection profile on Java app segments; restrict segments to the users who need them; patch Log4j.
  - id: CVE-2022-26134
    cvss: 9.8
    year: 2022
    kev: true
    scope: traffic
    title: Confluence Server/Data Center OGNL injection RCE — internal wiki published through ZPA
    affected: Confluence Server and Data Center from 1.3.0 before the fixed versions
    fixed: 7.4.17, 7.13.7, 7.14.3, 7.15.2, 7.16.4, 7.17.4, 7.18.1
    detect: AppProtection hits on OGNL expressions in the URI (%24%7B); User Activity for the Confluence segment from users or countries that never used it before.
    avoid: Publish Confluence through ZPA only (no internet exposure), restrict the segment to employees, enable AppProtection, patch.
detections:
  - title: Access policy refusals across many apps (internal reconnaissance)
    severity: high
    signals:
      - zpa_user_activity
      - InternalReason=BRK_MT_SETUP_FAIL_REJECTED_BY_POLICY / NO_POLICY_FOUND
      - many distinct Application or Host values
    why: A legitimate user hits a handful of apps they are allowed to use. One identity being refused across dozens of hosts or ports looks like a stolen session or malware scanning through the tunnel.
    kql: |-
      dataset="zpa_logs" sourcetype="zpa_user_activity"
      | where InternalReason in ("BRK_MT_SETUP_FAIL_REJECTED_BY_POLICY","BRK_MT_SETUP_FAIL_NO_POLICY_FOUND")
      | summarize refusals=count(), hosts=dcount(Host), ports=dcount(ServicePort) by Username, ClientPublicIP, bin(_time, 15m)
      | where hosts > 10 or refusals > 50
    mitre:
      - T1046
      - T1078
  - title: Access attempts from a device failing posture
    severity: medium
    signals:
      - InternalReason=BRK_MT_SETUP_FAIL_REJECTED_BY_POLICY_POSTURE_FAILED
      - PosturesMiss not empty in User Status
    why: Credentials used from an unmanaged or tampered device (EDR stopped, disk not encrypted) are a common sign of account takeover or of a personal device being used against policy.
    kql: |-
      dataset="zpa_logs" sourcetype="zpa_user_activity" InternalReason="BRK_MT_SETUP_FAIL_REJECTED_BY_POLICY_POSTURE_FAILED"
      | summarize attempts=count(), apps=make_set(Application) by Username, Hostname, ClientPublicIP
    mitre:
      - T1078
  - title: Same user authenticating from two countries in a short window
    severity: high
    signals:
      - zpa_user_status
      - SessionStatus=ZPN_STATUS_AUTHENTICATED
      - CountryCode changes within 1h
    why: ZPA sessions are long-lived and tied to the device; two countries for one user within an hour is impossible travel or a cloned session.
    kql: |-
      dataset="zpa_logs" sourcetype="zpa_user_status" SessionStatus="ZPN_STATUS_AUTHENTICATED"
      | summarize countries=dcount(CountryCode), list=make_set(CountryCode), ips=make_set(PublicIP), hosts=make_set(Hostname) by Username, bin(_time, 1h)
      | where countries > 1
    mitre:
      - T1078
      - T1550.004
  - title: Access policy or app segment loosened
    severity: high
    signals:
      - zpa_audit
      - auditOperationType Update/Delete
      - objectType Policy / Application Segment / Segment Group
    why: Changing a Block rule to Allow, or widening a segment to a whole subnet, quietly opens internal reach for everyone matching the rule — a classic persistence step after an admin compromise.
    kql: |-
      dataset="zpa_logs" sourcetype="zpa_audit"
      | where auditOperationType in ("Update","Delete") and objectType in ("Policy","Application Segment","Segment Group","Administrator")
      | project _time, modifiedByUser, auditOperationType, objectType, objectName, auditOldValue, auditNewValue
    mitre:
      - T1562.007
      - T1098
  - title: Admin console sign-in failures
    severity: medium
    signals:
      - zpa_audit
      - auditOperationType="Sign In Failure"
    why: The admin console controls who can reach every private app. Repeated failures for one admin, or failures from many admins at once, indicate password guessing.
    kql: |-
      dataset="zpa_logs" sourcetype="zpa_audit" auditOperationType="Sign In Failure"
      | summarize fails=count() by modifiedByUser, bin(_time, 15m)
      | where fails > 5
    mitre:
      - T1110
  - title: App Connector disconnected
    severity: low
    signals:
      - zpa_app_connector
      - SessionStatus=ZPN_STATUS_DISCONNECTED
    why: Besides breaking access, a disconnected connector also stops LSS — every ZPA log type routed through it goes dark, and data from the outage is not resent.
    kql: |-
      dataset="zpa_logs" sourcetype="zpa_app_connector" SessionStatus="ZPN_STATUS_DISCONNECTED"
      | summarize last=max(_time) by Connector, ConnectorGroup, Version, PrivateIP
    mitre:
      - T1562.008
optimizations:
  - title: Keep close records, drop "active" refreshes
    saving: 20–40 %
    fn: Drop
    how: Long sessions emit periodic active records with incremental byte counters. The close record carries the totals. Drop ConnectionStatus=active unless you need near-real-time byte accounting.
    expr: ConnectionStatus=='active'
  - title: Strip timing and empty fields
    saving: 25–40 %
    fn: Parser → Serialize
    how: User Activity carries more than a dozen Timestamp*/ProcessingTime fields used for troubleshooting latency, plus many empty strings. Remove them and empty values before the SIEM; keep the full record in Lake.
    expr: "remove: Timestamp* (except TimestampConnectionStart/End), *ProcessingTime, *SetupTime, AppLearnTime; drop empty"
  - title: Turn connector metrics into metrics
    saving: 5–10 %
    fn: Aggregations
    how: App Connector status records are periodic health telemetry. Convert CPU, memory and interface counters to metrics per connector and keep only state changes as events.
    expr: sourcetype=='zpa_app_connector' && SessionStatus=='ZPN_STATUS_AUTHENTICATED'
  - title: Route by value
    saving: SIEM licence
    fn: Routes
    how: Audit, User Status and refused / failed User Activity go to the SIEM. Successful User Activity goes to Lake with an optimised copy to the SIEM for investigations.
    expr: InternalReason!='' || sourcetype!='zpa_user_activity' → SIEM ; else → Lake + SIEM(optimised)
