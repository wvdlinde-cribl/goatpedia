id: zscaler-zpa
name: Zscaler Private Access (ZPA)
short: Zscaler ZPA
aka:
  - ZPA
  - Zscaler Private Access
  - Zscaler App Connector
  - Zscaler Log Streaming Service (LSS)
  - Zscaler Privileged Remote Access (PRA)
vendor: Zscaler
category: swg
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - ztna
  - sse
  - vpn-replacement
  - app-connector
  - lss
