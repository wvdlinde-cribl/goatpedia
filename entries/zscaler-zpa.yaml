  - zero-trust
summary: Zero-trust network access service that replaces remote-access VPN. Users never join the network — the Client Connector (or a browser) reaches a Zscaler Public Service Edge, which brokers a per-application tunnel to an outbound-only App Connector sitting next to the app. Policy is per user, group, posture and app segment, and the Log Streaming Service sends user activity, user status, connector and audit records as JSON, CSV or TSV.
sourcetypes:
  - st: zpa_user_activity
    desc: One record per application connection (open / active / close) with user, app segment, connector, server and the internal reason for blocks and errors
  - st: zpa_user_status
    desc: Client Connector session authentications and disconnects with public IP, geo, posture hits/misses and IdP
  - st: zpa_app_connector
    desc: App Connector status and metrics — control-session state, version, CPU/memory, interface counters
  - st: zpa_audit
    desc: Admin console changes and sign-ins (who changed which policy, segment or connector)
  - st: zpa_browser_access
    desc: HTTP request records for clientless Browser Access applications
  - st: zscalerlss-zpa-app
    desc: Splunk TA name for the LSS User Activity feed
  - st: zscalerlss-zpa-auth
    desc: Splunk TA name for the LSS User Status feed
  - st: zscalerlss-zpa-audit
    desc: Splunk TA name for the LSS Audit feed
  - st: zscalerlss-zpa-connector
    desc: Splunk TA name for the LSS App Connector Status feed
  - st: zscalerlss-zpa-bba
    desc: Splunk TA name for the LSS Browser Access feed
  - st: zscalerlss-zpa-web-inspection
    desc: Splunk TA name for AppProtection (web inspection) logs
facts:
  First released: "2016"
  Delivery model: SaaS broker (Public Service Edges) + customer-hosted App Connectors / optional Private Service Edges
  Access methods: Zscaler Client Connector, clientless Browser Access, Privileged Remote Access (RDP/SSH/VNC in browser)
  Connector platforms: RHEL / Rocky / AlmaLinux VMs, VMware, Hyper-V, AWS, Azure, GCP, containers
  Log transport: Log Streaming Service — App Connector forwards a TCP stream (optionally mutual TLS) to your log receiver
  Log format: Per-receiver template — JSON (default for SIEMs), CSV or TSV
  Log types: User Activity, User Status, App Connector Status/Metrics, Audit, Browser Access, AppProtection, PRA, Microsegmentation
  Cloud retention: User Activity / Status / Connector ≥14 days, Audit ≥6 months (stream out for longer)
  Typical volume: User Activity ≈ 1 record per app connection; low compared with web proxy logs
placement:
  slots:
    - remote
    - cloud
    - internal
    - endpoint
  items:
    - slot: remote
      title: Remote users (VPN replacement)
      desc: Client Connector on the laptop intercepts traffic for defined application segments and sends it to ZPA; there is no network-level access and no inbound port.
    - slot: cloud
      title: Public Service Edges (broker)
      desc: Zscaler-run brokers authenticate the user, evaluate access policy and stitch the user's tunnel to the App Connector's tunnel.
    - slot: internal
      title: App Connectors in DC / VPC
      desc: Lightweight Linux VMs next to the applications. They only dial out (TLS 443) to ZPA, and they also forward LSS logs to your receiver.
    - slot: endpoint
      title: Client Connector agent
      desc: Same agent as ZIA. Supplies identity, device posture and trusted-network state; its CVEs affect both services.
howItWorks:
  - title: Inside-out connectivity
    body: App Connectors establish outbound TLS control sessions to the ZPA cloud. Applications are never exposed to the internet — no listener, no public IP, no inbound firewall rule — which removes the VPN concentrator as an attack surface.
  - title: Application segments and policy
    body: Admins define application segments (FQDNs / IP ranges + ports) and segment groups. Access policy rules match user, SAML/SCIM attributes, posture profile, trusted network, client type and country, top-down first match. No matching Allow rule means the session is refused with BRK_MT_SETUP_FAIL_REJECTED_BY_POLICY or BRK_MT_SETUP_FAIL_NO_POLICY_FOUND.
  - title: Microtunnels
    body: For every allowed request the broker selects an App Connector that can reach the server (app discovery / health), and creates a per-user, per-application microtunnel. The User Activity log records each step's timing (policy, CA processing, connector setup) and the bytes exchanged.
  - title: Browser Access and PRA
    body: Web apps can be published clientless (Browser Access, logged as HTTP records), and RDP/SSH/VNC consoles through Privileged Remote Access with approvals, credential vaulting, session recording and file-transfer inspection.
  - title: AppProtection
    body: An inline ModSecurity-based inspection engine (OWASP CRS plus Zscaler controls) running in the App Connector path. It is the only ZPA component that sees request payloads, so exploit attempts against published apps appear in AppProtection logs, not in User Activity.
  - title: Log Streaming Service
    body: LSS starts in the ZPA cloud and is delivered through an App Connector to a log receiver (TCP, optional mTLS). If the connector-to-SIEM link breaks, non-audit data generated during the outage is not retransmitted — a lost receiver is a permanent gap.
traffic:
  handles:
    - Private TCP and UDP applications (by FQDN / IP and port)
    - Web apps over HTTPS (Browser Access)
    - RDP, SSH, VNC (Privileged Remote Access)
    - ICMP to private hosts (optional)
    - Kerberos, LDAP and SMB inspection (optional)
  flow:
    - step: Intercept
      desc: Client Connector sees a request for an app segment FQDN and forwards it to the nearest Public Service Edge.
    - step: Authenticate
      desc: SAML assertion and device posture already established in the user session (User Status log).
    - step: Authorize
      desc: Access policy evaluated; no match or a Block rule ends the request with a BRK_MT_* reason.
    - step: Connector selection
      desc: Broker picks an App Connector that can reach the server; connector opens the server connection.
    - step: Microtunnel
      desc: User and connector tunnels are stitched; optional double encryption and AppProtection inspection.
    - step: Log
      desc: User Activity records at open, periodically while active, and at close, streamed by LSS.
logs:
  - type: User Activity
    sourcetype: zpa_user_activity
    format: json
    share: 70–85 %
    avg: ~2 KB
    desc: One record per application connection state (open, active, close). Carries user, client public IP and geo, the policy rule, application and segment group, connector, server IP/port, InternalReason for failures, timings and byte counters.
    key:
      - Username
      - ClientPublicIP
      - ClientCountryCode
      - Application
      - Policy
      - ServerIP
      - ServerPort
      - InternalReason
    noise:
      - TimestampCATx
      - TimestampCARx
      - TimestampAppLearnStart
      - TimestampZENFirstTxClient
      - TimestampZENFirstRxConnector
      - PolicyProcessingTime
      - CAProcessingTime
      - AppLearnTime
    sample: '{"LogTimestamp":"Thu Nov 12 09:31:07 2026","Customer":"Example Corp","SessionID":"Kq7wP2mZx9TbLc4RvnA1","ConnectionID":"Kq7wP2mZx9TbLc4RvnA1,Hd8sQ1kLp0XyWe3NvbM2","InternalReason":"BRK_MT_SETUP_FAIL_REJECTED_BY_POLICY","ConnectionStatus":"close","IPProtocol":6,"DoubleEncryption":0,"Username":"jdoe@example.com","ServicePort":445,"ClientPublicIP":"203.0.113.45","ClientPrivateIP":"192.168.1.23","ClientLatitude":52.37,"ClientLongitude":4.89,"ClientCountryCode":"NL","ClientZEN":"broker2a.ams1","Policy":"Block_Finance_Shares","Connector":"","ConnectorZEN":"","ConnectorIP":"","ConnectorPort":0,"Host":"fs01.corp.example.com","Application":"Finance File Shares","AppGroup":"Finance","Server":"0","ServerIP":"","ServerPort":0,"PolicyProcessingTime":31,"CAProcessingTime":402,"ConnectorZENSetupTime":0,"ConnectionSetupTime":0,"ServerSetupTime":0,"AppLearnTime":0,"TimestampConnectionStart":"2026-11-12T09:31:07.112Z","TimestampConnectionEnd":"2026-11-12T09:31:07.118Z","TimestampCATx":"2026-11-12T09:31:07.113Z","TimestampCARx":"2026-11-12T09:31:07.114Z","TimestampAppLearnStart":"","TimestampZENFirstRxClient":"","TimestampZENFirstTxClient":"","TimestampZENFirstRxConnector":"","ZENTotalBytesRxClient":0,"ZENTotalBytesTxClient":0,"ZENTotalBytesRxConnector":0,"ZENTotalBytesTxConnector":0,"Idp":"Okta","Platform":"windows","Hostname":"LT-JDOE-01"}'
  - type: User Status
    sourcetype: zpa_user_status
    format: json
    share: 5–15 %
    avg: ~1 KB
    desc: Client Connector session authentication, failure and disconnect. Public IP and country of the client, the Service Edge used, IdP, SAML attributes and posture profiles that passed or failed.
    key:
      - Username
      - SessionStatus
      - PublicIP
      - CountryCode
      - Hostname
      - PosturesMiss
      - Version
    noise:
      - Latitude
      - Longitude
      - ZENLatitude
      - ZENLongitude
      - FQDNRegistered
      - FQDNRegisteredError
    sample: '{"LogTimestamp":"Thu Nov 12 09:30:55 2026","Customer":"Example Corp","Username":"jdoe@example.com","SessionID":"Kq7wP2mZx9TbLc4RvnA1","SessionStatus":"ZPN_STATUS_AUTHENTICATED","Version":"4.8.0.232","ZEN":"broker2a.ams1","CertificateCN":"c1a2b3.example.zpa-customer.com","PrivateIP":"192.168.1.23","PublicIP":"203.0.113.45","Latitude":52.37,"Longitude":4.89,"CountryCode":"NL","TimestampAuthentication":"2026-11-12T09:30:55.000Z","TimestampUnAuthentication":"","TotalBytesRx":0,"TotalBytesTx":0,"Idp":"Okta","Hostname":"LT-JDOE-01","Platform":"windows","ClientType":"zpn_client_type_zapp","TrustedNetworks":"","TrustedNetworksNames":"","SAMLAttributes":"email:jdoe@example.com,groups:Finance","PosturesHit":"Domain Joined,EDR Running","PosturesMiss":"Disk Encrypted","ZENLatitude":52.3,"ZENLongitude":4.9,"ZENCountryCode":"NL","FQDNRegistered":"0","FQDNRegisteredError":"CUSTOMER_NOT_ENABLED"}'
  - type: Audit
    sourcetype: zpa_audit
    format: json
    share: < 1 %
    avg: ~1 KB
    desc: Admin console actions — create, update, delete, sign in / sign-in failure — with object type and name, old and new values and the admin. Retained ≥6 months in the cloud.
    key:
      - modifiedByUser
      - auditOperationType
      - objectType
      - objectName
      - auditNewValue
    noise:
      - customerID
      - clientAuditUpdate
      - requestID
