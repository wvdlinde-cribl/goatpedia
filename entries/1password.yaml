id: 1password
name: 1Password
short: 1Password
vendor: 1Password
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - AgileBits
  - 1Password Business
  - 1Password Events API
tags:
  - password-manager
  - identity
  - json
  - audit
summary: A business password manager. People unlock vaults from a browser extension, a desktop app or a mobile app, and fill, reveal or share items. Administrators change users, groups and vault access in the account. 1Password records those actions as three JSON event streams — sign-in attempts, item usages and audit events — which any collector can pull from the Events API.
sourcetypes:
  - st: 1password_signin_attempts
    desc: Each attempt to sign in to the 1Password account, with the outcome and the client that tried
  - st: 1password_item_usages
    desc: Each use of an item in a shared vault, such as fill, reveal, export or share
  - st: 1password_audit_events
    desc: Changes team members make in the account, including users, groups, vaults and access
facts:
  Product: Business password manager for shared vaults of logins and other secrets
  Clients: Browser extension, desktop apps, mobile apps, CLI
  Account plane: 1Password Business. The account region picks the Events API host (events.1password.com, events.1password.ca, events.1password.eu, or events.ent.1password.com)
  Log transport: HTTPS JSON, pulled by any collector that holds a bearer token. Three separate calls, one per event stream
  Log format: One JSON object per event. A response wraps a list of events and a cursor for the next poll
  What a sign-in event answers: Who tried to sign in, from which app and IP, and whether it succeeded
  What an item-usage event answers: Who used which item in which shared vault, and what they did with it
  What an audit event answers: Who changed the account, and which action they took on which kind of object
placement:
  slots:
    - cloud
    - endpoint
  items:
    - slot: cloud
      title: 1Password account
      desc: The vaults and the account administration live in the 1Password service for that business. Sign-ins, item use and admin changes are stored there. A collector polls the Events API of the account's region. Nothing in the product is tied to one SIEM or one log vendor.
    - slot: endpoint
      title: Apps and browser extension
      desc: People sign in and use items on laptops and phones. Sign-in and item-usage events name that client (app, platform, operating system and IP). The endpoint is where the person acts. The event is recorded in the account.
howItWorks:
  - title: Vaults and items
    body: A 1Password account holds vaults. A vault holds items such as logins. People are granted access to vaults, often through groups. Item-usage events exist for items in shared vaults. Each one names the vault and the item by uuid, the person, and the action they took.
  - title: Sign-in
    body: A sign-in attempt is one try to open the account from a client. The category is the outcome, including success, credentials_failed, mfa_failed, sso_failed, modern_version_failed and firewall_failed. The type is the finer reason, such as credentials_ok or a rejected second factor. The event also carries the target user, the client and the country derived from the client IP.
  - title: Using an item
    body: When someone uses an item in a shared vault, 1Password records an item usage. The action is one of fill, reveal, secure-copy, export, share, enter-item-edit-mode, select-sso-provider, server-create, server-update or server-fetch. fill is an ordinary autofill. reveal, secure-copy, export and share are the actions where a secret left the vault in a form a person could take away.
  - title: Account administration
    body: Audit events are the account's own audit log. Each one names the team member who acted (actor), the action, and the kind of object it applied to (object_type), plus the session and location when 1Password has them. Reading an audit event means reading action together with object_type. A suspended user is an action on a user object, not a sign-in failure.
  - title: How the events leave the product
    body: 1Password does not push syslog. A collector that the account has issued a bearer token to calls the Events API. The token's features list which of the three streams it may read (signinattempts, itemusages, auditevents). Each call returns a page of JSON events and a cursor. The collector stores the cursor and sends it on the next call so it does not miss or repeat events. Any collector can do this. The destination the collector writes to is a choice of the pipeline, not a property of 1Password.
traffic:
  handles:
    - Sign-in to the 1Password account
    - Use of items in shared vaults
    - Administration of users, groups and vaults
  flow:
    - step: Person acts
      desc: Someone signs in, or fills, reveals, copies, exports or shares an item, from a 1Password app or browser extension. An administrator changes users, groups or vault access in the account.
    - step: Account records it
      desc: The 1Password account stores the action on one of the three streams. Sign-in attempts, item usages and audit events are separate and are requested separately.
    - step: Collector polls
      desc: A collector posts to the Events API host for that account's region, with a bearer token, and asks for the next page after its saved cursor.
    - step: Events are JSON
      desc: Each event is one JSON object. The collector can forward that object anywhere. Goatpedia reads these samples as JSON.
logs:
  - type: Sign-in attempts
    sourcetype: 1password_signin_attempts
    format: json
    desc: One object per sign-in attempt. category is the outcome and type is the finer reason. This sample is a successful password sign-in. Values are documentation addresses.
    sample: '{"uuid":"HGIF4OEWXDTVWKEQDIWTKV26HU","session_uuid":"UED4KFZ5BH37IQWTJ7LG4VPWK7","timestamp":"2021-08-11T14:28:03Z","country":"AR","category":"success","type":"credentials_ok","details":null,"target_user":{"uuid":"OJQGU46KAPROEJLCK674RHSAY5","name":"Name","email":"user@example.com"},"client":{"app_name":"1Password Browser Extension","app_version":"1109","platform_name":"Chrome","platform_version":"93.0.4577.62","os_name":"Android","os_version":"10","ip_address":"198.51.100.15"}}'
    key:
      - category
      - type
      - timestamp
      - target_user.email
      - client.ip_address
  - type: Item usages
    sourcetype: 1password_item_usages
    format: json
    desc: One object per use of an item in a shared vault. action says what was done. This sample is a reveal. vault_uuid and item_uuid identify the item. The user and client blocks say who did it and from where.
    sample: '{"uuid":"MCQODBBWJD5HISKYNP3HJPV2DV","timestamp":"2021-08-30T18:57:42.484Z","used_version":1,"vault_uuid":"jaqxqf5qylslqiitnduawrndc5","item_uuid":"bvwmmwxisuca7wbehrbyqhag54","user":{"uuid":"OJQGU46KAPROEJLCK674RHSAY5","name":"Name","email":"user@example.com"},"client":{"app_name":"1Password Browser Extension","app_version":"1109","platform_name":"Chrome","platform_version":"93.0.4577.62","os_name":"Android","os_version":"10","ip_address":"192.0.2.20"},"location":{"country":"Canada","region":"Ontario","city":"Toronto","latitude":43.64,"longitude":-79.433},"action":"reveal"}'
    key:
      - action
      - timestamp
      - vault_uuid
      - item_uuid
      - user.email
  - type: Audit events
    sourcetype: 1password_audit_events
    format: json
    desc: One object per change a team member makes in the account. Read action together with object_type. This sample is a user being suspended. actor_details is who did it. session.ip is the client address of that session.
    sample: '{"uuid":"3UQOGUC7DVOCN4OZP2MDKHFLSG","timestamp":"2022-10-24T21:16:52.827288935Z","actor_uuid":"GLF6WUEKS5CSNDJ2OG6TCZD3M4","actor_details":{"uuid":"GLF6WUEKS5CSNDJ2OG6TCZD3M4","name":"Test Actor","email":"user@example.com"},"action":"suspend","object_type":"user","object_uuid":"ZRQCUD6A65AKHFETOUFO7NL4OM","session":{"uuid":"ODOHXUYQCJBUJKRGZNNPBJURPE","login_time":"2022-10-24T21:07:34.703106271Z","device_uuid":"rqtd557fn2husnstp5nc66w2xa","ip":"192.0.2.10"},"location":{"country":"Canada","region":"Ontario","city":"Toronto","latitude":43.64,"longitude":-79.433}}'
    key:
      - action
      - object_type
      - timestamp
      - actor_details.email
      - session.ip
cves: []
detections:
  - title: Sign-in did not succeed
    severity: medium
    signals:
      - category
      - type
      - target_user.email
      - client.ip_address
    why: A credentials, MFA, SSO or firewall failure is someone failing to open the account. Repeated failures for one user, or failures from many countries, are the brute-force and password-spraying view of this source.
    kql: |
      dataset="1password_logs"
      | where sourcetype == "1password_signin_attempts" and category != "success"
      | project timestamp, category, type, target_user.email, client.ip_address, country
    mitre:
      - T1110
  - title: Secret copied out of a vault
    severity: high
    signals:
      - action
      - item_uuid
      - vault_uuid
      - user.email
    why: fill is ordinary autofill. reveal, secure-copy, export and share are the actions where the secret is shown, copied, exported or sent to someone. Those are the item events worth an alert.
    kql: |
      dataset="1password_logs"
      | where sourcetype == "1password_item_usages" and action in ("reveal", "secure-copy", "export", "share")
      | project timestamp, action, user.email, vault_uuid, item_uuid, client.ip_address
    mitre:
      - T1555
optimizations:
  - title: Drop ordinary autofill
    saving: most item-usage volume
    fn: Drop
    how: Every autofill is an item usage with action fill. Security monitoring needs the actions where a secret is revealed, copied, exported or shared, plus audit events and failed sign-ins. Drop fill before the SIEM.
    expr: "action == 'fill'"
  - title: Keep failures and admin changes in the SIEM
    saving: SIEM licence
    fn: Routes
    how: Send failed sign-ins, reveal/export/share item usages, and all audit events to the SIEM in full. Successful sign-ins and autofill are context. Keep them in cheaper storage and forward a sample, not every event.
    expr: "category != 'success' || action == 'reveal' || action == 'secure-copy' || action == 'export' || action == 'share' || object_type != null"
