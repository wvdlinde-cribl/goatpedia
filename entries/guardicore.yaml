id: guardicore
name: Guardicore
short: Guardicore
vendor: Guardicore
category: netinfra
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - guardicore
  - Splunk Connect for Syslog
tags:
  - sc4s
  - cef
summary: Guardicore is logged by the Splunk Connect for Syslog package guardicore. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: guardicore_centra_cef
    desc: 'Splunk Connect for Syslog fixture, 3 events. Upstream: tests/test_guardicore.py'
facts:
  Where the sample comes from: Splunk Connect for Syslog
  Integration package: guardicore
  Sourcetypes: '1'
  Fixture events: '3'
  Log format seen: cef
  Fields in the first fixture: syslog_header, cef_version, device_vendor, device_product, device_version, signature_id
placement:
  slots:
    - edge
  items:
    - slot: edge
      title: Splunk Connect for Syslog
      desc: Fixtures were harvested from splunk/splunk-connect-for-syslog. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Guardicore events in this library are the test fixtures shipped with splunk/splunk-connect-for-syslog (d861082778). The first event carries syslog_header, cef_version, device_vendor, device_product, device_version, signature_id. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - cef
  flow:
    - step: Collect
      desc: The Splunk Connect for Syslog package reads guardicore and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as cef.
logs:
  - type: Guardicore Centra Cef
    sourcetype: guardicore_centra_cef
    format: cef
    desc: 3 fixture events in the samples pool (sc4s).
    sample: '<14>2026-06-15T13:45Z guardicore- CEF:0|Guardicore|Centra|51|Network Log|Network Log|None|id=cda17db8 act=Allowed cnt=1 start=2026-06-15T13:45Z src=203.0.113.8 shost=shost dst=203.0.113.40 dpt=53 dhost=Unknown proto=TCP cs1Label=connection_type cs1=SUCCESSFUL cs2Label=source_asset_labels cs2=os_type: AIX cs6Label=connection_verdict cs6=allowed cs7Label=policy_rule cs7=cs7 cs8Label=policy_ruleset cs8=AIX DNS Control'
    key:
      - cef_version
      - device_vendor
      - device_product
      - device_version
cves: []
detections:
  - title: Guardicore events arriving
    severity: low
    signals:
      - syslog_header
      - cef_version
      - device_vendor
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "guardicore_centra_cef"'
optimizations: []
references:
  - title: splunk/splunk-connect-for-syslog tests/test_guardicore.py
    url: https://github.com/splunk/splunk-connect-for-syslog/blob/d861082778c4ce35a1636dc83e19763338bf662e/tests/test_guardicore.py
  - title: Pack Generator sample guardicore_centra_cef.json
