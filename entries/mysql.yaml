summary: The most widely deployed open-source relational database. Security telemetry comes from three places — the audit plugin (MySQL Enterprise Audit JSON/XML, or the MariaDB server_audit plugin's CSV, also used on Community and Percona builds), the error log (failed logins at verbosity 3, startup and plugin changes) and the general/slow query logs. Audit is the source that answers who connected from where, what they ran and whether it succeeded.
sourcetypes:
  - st: mysql
    desc: MySQL server logs — Enterprise Audit JSON records and error-log lines
  - st: mysql_server_audit
    desc: MariaDB/Percona-style server_audit plugin CSV (timestamp, serverhost, username, host, connectionid, queryid, operation, database, object, retcode)
  - st: mysql:errorLog
    desc: Splunk Add-on for MySQL — error log file
  - st: mysql:generalQueryLog
    desc: Splunk Add-on for MySQL — general query log file
  - st: mysql:slowQueryLog
    desc: Splunk Add-on for MySQL — slow query log (CIM Databases)
  - st: mysql_error
    desc: 'Elastic integrations fixture, 20 events. Upstream: mysql/data_stream/error/_dev/test/pipeline/test-mysql-darwin-brew-5-7-10.log'
  - st: mysql_slowlog
    desc: 'Elastic integrations fixture, 20 events. Upstream: mysql/data_stream/slowlog/_dev/test/pipeline/test-percona-ubuntu-5-7-19.log'
facts:
  First released: 1995 (MySQL AB); Oracle since 2010
  Current trains: 8.0 (EOL April 2026), 8.4 LTS, 9.x innovation
  Delivery model: Self-managed on Linux/Windows, containers, and managed (Amazon RDS/Aurora, Azure Database for MySQL, Cloud SQL, HeatWave)
  Audit options: MySQL Enterprise Audit (audit_log component/plugin, commercial), MariaDB server_audit plugin, Percona audit_log plugin
  Log transport: Local files (audit.log / audit.json, error.log), syslog (server_audit_output_type=SYSLOG), performance_schema tables, managed-service log export
  Log format: Enterprise Audit XML (default) or JSON; server_audit CSV; error log text or JSON (log_sink_json)
  Typical volume: Connection-only audit ≈ 1–10 EPS per server; query auditing can reach 1k–10k+ EPS on a busy OLTP server
  Default port: TCP 3306 (X Protocol 33060)
placement:
  slots:
    - internal
    - cloud
    - dmz
  items:
    - slot: internal
      title: Application data tier
      desc: Behind the application servers in the data-center core. Should only accept connections from app subnets and DBA jump hosts.
    - slot: cloud
      title: Managed and self-hosted cloud MySQL
      desc: EC2/VM installs and managed services (RDS, Aurora, Cloud SQL, Azure). Managed services expose the same audit plugin output through the provider's log service.
    - slot: dmz
      title: LAMP stacks and CMS hosts
      desc: WordPress, Drupal and other PHP apps often run MySQL on the same host or next to the web server. A SQL injection in the web app becomes queries in this audit log.
howItWorks:
  - title: Connection and authentication
    body: The client connects over TCP 3306 (or a Unix socket), negotiates TLS and authenticates with a plugin (caching_sha2_password, mysql_native_password, LDAP/Kerberos in Enterprise). The account is matched on 'user'@'host', so the same user name from a different host is a different account. Failures return error 1045 (ER_ACCESS_DENIED_ERROR).
  - title: Privilege system
    body: Privileges are global, per-database, per-table and per-column, plus roles (8.0+). GRANT/REVOKE, CREATE USER, ALTER USER and SET PASSWORD change them; SUPER/SYSTEM_VARIABLES_ADMIN can change server variables such as log locations.
  - title: Audit plugin
    body: The audit API sees connection, general (query), table access and server events. MySQL Enterprise Audit filters with JSON rules (audit_log_filter_set_filter) and writes XML or JSON; the MariaDB server_audit plugin uses server_audit_events (CONNECT, QUERY, TABLE, QUERY_DDL, QUERY_DML, QUERY_DCL) and writes CSV to a file or syslog.
  - title: Error log
    body: Records startup/shutdown, plugin and component loads, crash recovery and replication errors. At log_error_verbosity=3 it also writes failed logins (MY-010926 Access denied … using password, MY-010914 denied to database). Hosts rejected before authentication (ERROR 1130) are not logged here.
  - title: General and slow query logs
    body: The general log records every statement received (heavy, normally off). The slow query log records statements over long_query_time with rows examined — useful for spotting bulk extraction but not an audit trail.
traffic:
  handles:
    - MySQL classic protocol (TCP 3306)
    - X Protocol / document store (TCP 33060)
    - TLS 1.2/1.3 client connections
    - SQL DDL, DML and DCL statements
    - Replication (binlog) between primary and replicas
    - LOAD DATA / SELECT … INTO OUTFILE file I/O
  flow:
    - step: Connect
      desc: Client opens TCP 3306 and negotiates TLS.
    - step: Authenticate
      desc: Account 'user'@'host' matched; auth plugin verifies credentials. Audit connection event with status 0 or 1045.
    - step: Parse
      desc: Statement received; general-log and audit general/query event written.
    - step: Privilege check
      desc: Global/db/table/column privileges checked; denial returns 1142/1044.
    - step: Execute
      desc: Storage engine reads/writes rows; table_access (READ/WRITE) audit events per table.
    - step: Result
      desc: Rows returned with status/retcode; slow log if over threshold; disconnect event at session end.
logs:
  - type: Audit (server_audit CSV)
    sourcetype: mysql_server_audit
    format: csv
    share: 60–90 %
    avg: ~150 B
    desc: One line per connect, disconnect, failed connect, query or table access. retcode is the MySQL error number (0 = success, 1045 = access denied). On QUERY lines the object column holds the statement text in single quotes.
    fields:
      - timestamp
      - serverhost
      - username
      - host
      - connectionid
      - queryid
      - operation
      - database
      - object
      - retcode
    key:
      - timestamp
      - username
      - host
      - operation
      - database
      - object
      - retcode
    noise:
      - serverhost
      - queryid
    sample: "20261112 09:14:22,db-prod-01,root,203.0.113.45,48211,0,FAILED_CONNECT,,,1045"
  - type: Enterprise Audit (JSON)
    sourcetype: mysql
    format: json
    share: 60–90 % (when Enterprise Audit is used instead)
    avg: ~400 B
    desc: MySQL Enterprise Audit with audit_log_format=JSON. One object per event; class is connection, general or table_access, and the status field carries the error code (1045 = failed login).
    key:
      - class
      - event
      - login.user
      - login.ip
      - general_data.sql_command
      - general_data.query
      - general_data.status
    noise:
      - id
      - login.os
      - login.proxy
    sample: '{"timestamp":"2026-11-12 09:31:05","id":0,"class":"general","event":"status","connection_id":48390,"account":{"user":"app_rw","host":"10.20.%"},"login":{"user":"app_rw","os":"","ip":"10.20.4.17","proxy":""},"general_data":{"command":"Query","sql_command":"grant","query":"GRANT ALL PRIVILEGES ON *.* TO ''svc_backup''@''%''","status":0}}'
  - type: Error log (failed login)
    sourcetype: mysql
    format: text
    share: < 5 %
    avg: ~130 B
    desc: MySQL 8.x error-log line. Failed authentications appear as Note MY-010926 only when log_error_verbosity=3; the thread id matches the connection id in the audit log.
    pattern: ^(?<timestamp>\S+) (?<thread_id>\d+) \[(?<prio>\w+)\] \[(?<err_code>MY-\d+)\] \[(?<subsystem>\w+)\] Access denied for user '(?<user>[^']*)'@'(?<client_host>[^']*)' \(using password. (?<using_password>YES|NO)\)$
    key:
      - timestamp
      - err_code
      - user
      - client_host
      - using_password
    noise:
      - subsystem
    sample: "2026-11-12T09:14:22.186218Z 48211 [Note] [MY-010926] [Server] Access denied for user 'root'@'203.0.113.45' (using password: YES)"
  - type: Error
    sourcetype: mysql_error
    format: text
    desc: 20 fixture events in the samples pool (elastic).
    sample: 161209 13:08:33 mysqld_safe Starting mysqld daemon with databases from /usr/local/var/mysql
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: Slowlog
    sourcetype: mysql_slowlog
    format: text
    desc: 20 fixture events in the samples pool (elastic).
    sample: SET timestamp=1542349556;
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves:
  - id: CVE-2016-6662
    cvss: 9.8
    year: 2016
    kev: false
    scope: device
    title: Remote root code execution by writing a malicious my.cnf (via general_log_file or SQL injection)
    affected: MySQL through 5.5.52, 5.6.33, 5.7.15; MariaDB and Percona Server of the same era
    fixed: MySQL 5.5.53, 5.6.34, 5.7.16
    detect: "Audit QUERY lines with SET GLOBAL general_log_file pointing at a my.cnf path, or SELECT … INTO OUTFILE / DUMPFILE into /etc/mysql or the datadir; mysqld restart in the error log shortly after."
    avoid: Patch; never grant FILE or SUPER to application accounts; secure_file_priv set to a dedicated directory; mysqld config files owned by root and not writable by mysql.
  - id: CVE-2016-6663
    cvss: 7.0
    year: 2016
    kev: false
    scope: device
    title: Race condition privilege escalation from a low-privileged DB account to the mysql OS user (REPAIR TABLE)
    affected: MySQL before 5.5.52, 5.6.33, 5.7.15, 8.0.1; matching MariaDB and Percona versions
    fixed: MySQL 5.5.52, 5.6.33, 5.7.15, 8.0.1
    detect: Repeated REPAIR TABLE / CREATE TABLE … DATA DIRECTORY statements from a non-DBA account in the audit log.
    avoid: Patch; restrict CREATE/ALTER on shared schemas; run mysqld with a restricted service account.
  - id: CVE-2023-21912
    cvss: 7.5
    year: 2023
    kev: false
    scope: device
    title: Unauthenticated network DoS (Server Security Privileges) — crash of mysqld before login
    affected: MySQL Server 5.7.41 and prior, 8.0.30 and prior
    fixed: MySQL 8.0.31 (April 2023 Critical Patch Update)
    detect: Burst of FAILED_CONNECT / connection errors from one source followed by a crash-recovery sequence (InnoDB recovery, "ready for connections") in the error log.
    avoid: Patch; never expose 3306 to the internet; allow-list client subnets with host firewall or security groups.
  - id: CVE-2023-34362
    cvss: 9.8
    year: 2023
    kev: true
    scope: traffic
    title: MOVEit Transfer SQL injection — application-layer SQLi reaching the MySQL / SQL Server back end
    affected: MOVEit Transfer before 2021.0.6, 2021.1.4, 2022.0.4, 2022.1.5, 2023.0.1
    fixed: 2021.0.6, 2021.1.4, 2022.0.4, 2022.1.5, 2023.0.1
    detect: Query-level audit from the MOVEit service account showing statements it never issues normally (INSERT into user/session tables, UNION SELECTs) and new rows in admin tables.
    avoid: Patch MOVEit; least-privilege DB account for the app; alert on DCL/DDL from application accounts.
  - id: CVE-2024-27956
    cvss: 9.8
    year: 2024
    kev: false
    scope: traffic
    title: WordPress "Automatic" plugin unauthenticated SQL injection — creates admin users in the MySQL wp_users table
    affected: ValvePress Automatic plugin through 3.92.0
    fixed: 3.92.1
    detect: WRITE events on wp_users / wp_usermeta outside of normal registration flow; QUERY lines with INSERT INTO wp_users from the WordPress DB account.
    avoid: Update the plugin; WAF in front of WordPress; separate DB accounts for read and admin paths.
detections:
  - title: Brute force / password spraying against MySQL
    severity: high
    signals:
      - operation=FAILED_CONNECT
      - retcode=1045
      - many attempts or users from one host
    why: Internet-exposed MySQL is constantly brute-forced; spraying root and common service accounts precedes data theft and ransom notes in dropped databases.
    kql: |-
      dataset="mysql_audit" operation="FAILED_CONNECT"
      | summarize fails=count(), users=dcount(username) by host, bin(_time, 10m)
      | where fails > 20 or users > 5
    mitre:
      - T1110.001
      - T1110.003
  - title: Successful login after failures from the same host
    severity: high
    signals:
      - FAILED_CONNECT then CONNECT
      - same host, same username
      - within 30 min
    why: The brute force worked. Pivot to everything that connection id ran next.
    kql: |-
      dataset="mysql_audit" operation in ("FAILED_CONNECT","CONNECT")
      | summarize fails=countif(operation=="FAILED_CONNECT"), ok=countif(operation=="CONNECT") by host, username, bin(_time, 30m)
      | where fails >= 10 and ok > 0
    mitre:
      - T1110
      - T1078
  - title: Account or privilege change
    severity: medium
    signals:
      - GRANT / CREATE USER / ALTER USER / SET PASSWORD
      - from an application account or outside change window
    why: Attackers create backdoor accounts ('svc_backup'@'%') or grant ALL ON *.* to keep access. Application accounts should never issue DCL.
    kql: |-
      dataset="mysql_audit" operation="QUERY"
      | where object matches regex @"(?i)\b(GRANT|CREATE\s+USER|ALTER\s+USER|SET\s+PASSWORD|DROP\s+USER)\b"
      | project _time, username, host, database, object, retcode
    mitre:
      - T1098
      - T1136
  - title: File write / read through SQL (OUTFILE, LOAD_FILE, general_log_file)
    severity: high
    signals:
      - INTO OUTFILE / DUMPFILE
      - LOAD_FILE( / LOAD DATA INFILE
      - SET GLOBAL general_log_file
    why: The classic path from SQL injection to a web shell or to CVE-2016-6662-style config injection; legitimate use is rare and DBA-only.
    kql: |-
      dataset="mysql_audit" operation="QUERY"
      | where object matches regex @"(?i)(INTO\s+(OUT|DUMP)FILE|LOAD_FILE\s*\(|LOAD\s+DATA\s+(LOCAL\s+)?INFILE|general_log_file|slow_query_log_file)"
      | project _time, username, host, object
    mitre:
      - T1505.003
      - T1005
  - title: Audit or logging disabled
    severity: high
    signals:
      - SET GLOBAL server_audit_logging=OFF
      - audit_log_filter_remove_user / UNINSTALL PLUGIN
      - SET GLOBAL general_log=OFF after being on
    why: Turning off the audit trail is a defence-evasion step that usually precedes bulk extraction.
    kql: |-
      dataset="mysql_audit" operation="QUERY"
      | where object matches regex @"(?i)(server_audit_logging\s*=\s*(0|OFF)|server_audit_events|audit_log_filter_remove|UNINSTALL\s+(PLUGIN|COMPONENT))"
      | project _time, username, host, object
    mitre:
      - T1562.001
  - title: Bulk data extraction
    severity: medium
    signals:
      - READ events across many tables by one connection
      - mysqldump pattern (SHOW CREATE TABLE + SELECT /*!40001 SQL_NO_CACHE */)
    why: Exfiltration of whole schemas looks like a single connection touching every table in minutes — very different from an app's steady pattern.
    kql: |-
      dataset="mysql_audit" operation="READ"
      | summarize tables=dcount(object), reads=count() by username, host, connectionid, bin(_time, 15m)
      | where tables > 50
    mitre:
      - T1213
      - T1005
optimizations:
  - title: Audit connections + DDL/DCL, not every DML statement
    saving: 60–90 %
    fn: Drop
    how: Set server_audit_events=CONNECT,QUERY_DDL,QUERY_DCL (or an Enterprise filter on connection + specific sql_commands) at source; in Stream drop READ/WRITE table events for known application accounts and keep them for humans.
    expr: operation in ('READ','WRITE') && username in ('app_ro','app_rw')
  - title: Suppress repeated failed connects
    saving: 10–30 %
    fn: Suppress
    how: A brute-force run produces thousands of identical FAILED_CONNECT lines. Keep one per host/username per minute with a count field for the SIEM.
    expr: "key: `${host}:${username}`  allow 1 / 60s  when operation=='FAILED_CONNECT'"
  - title: Normalise and truncate query text
    saving: 15–40 %
    fn: Eval
    how: Long INSERT … VALUES batches blow up event size. Truncate object to 2 KB and add a query fingerprint (literals replaced) so you can group without storing every value.
    expr: "object = object.length > 2048 ? object.substring(0,2048) : object"
  - title: Route DBA and privileged activity to the SIEM, the rest to Lake
    saving: SIEM licence
    fn: Routes
    how: Connections, failures, DCL/DDL and anything from human accounts → SIEM. Application DML and table access → Cribl Lake for investigations.
    expr: "operation!='QUERY' || /\\b(GRANT|CREATE|ALTER|DROP)\\b/i.test(object) → SIEM | else → Lake"
