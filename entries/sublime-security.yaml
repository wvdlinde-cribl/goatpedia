    key:
      - body.plain.raw
      - body.current_thread.text
      - body.html.charset
      - body.html.content_transfer_encoding
  - type: Message events
    sourcetype: sublime_security_message_event
    format: json
    desc: One message in one mailbox. attack_score_verdict is Sublime's verdict, mailbox.email the recipient, sender and subject the message, and read_at, replied_at and forwarded_at what the user did. This sample is a suspicious message with the subject "Available?".
    sample: '{"id":"ef875384-6868-4e60-819a-e392f3fc1344","canonical_id":"ae608db67f666a7c92729c4a018e24362caea4c3b4b9fa00534a838dc989bab3","created_at":"2024-07-12T05:15:19.061701Z","attack_score_verdict":"suspicious","external_id":"811a4cb9-aa1c-4e81-a0d1-21e163872c08","message_source_id":"257982a1-f106-4c68-bc64-ff032914ed5f","mailbox":{"id":"433fe142-e2e5-4372-84ea-480279543a9b","external_id":null,"email":"user@example.com"},"subject":"Available?","sender":{"email":"user@example.com","display_name":"Alice"},"landed_in_spam":false,"read_at":null,"replied_at":null,"forwarded_at":null,"forward_recipients":[],"recipients":[{"email":"user@example.com"},{"email":"user@example.com"}]}'
    key:
      - id
      - canonical_id
      - created_at
      - attack_score_verdict
cves: []
detections:
  - title: Message scored suspicious or malicious
    severity: high
    signals:
      - attack_score_verdict
      - mailbox.email
      - sender.email
      - subject
      - read_at
    why: A suspicious or malicious verdict is a likely phishing or BEC message. If read_at, replied_at or forwarded_at is set, the user interacted with it and the attempt may have worked.
    kql: |
      dataset="sublime-security_logs"
      | where sourcetype == "sublime_security_message_event" and attack_score_verdict in ("suspicious", "malicious")
      | project created_at, attack_score_verdict, mailbox.email, sender.email, subject, read_at, replied_at, forwarded_at
    mitre:
      - T1566
optimizations: []
references:
  - title: Sublime Security documentation
    url: https://docs.sublime.security/
