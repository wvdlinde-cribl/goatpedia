summary: Sublime Security is logged by the Elastic integrations package sublime_security. The Pack Generator samples pool holds fixture events for 3 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: sublime_security_audit
    desc: 'Elastic integrations fixture, 2 events. Upstream: sublime_security/data_stream/audit/_dev/test/pipeline/test-audit.log'
  - st: sublime_security_email_message
    desc: 'Elastic integrations fixture, 2 events. Upstream: sublime_security/data_stream/email_message/_dev/test/pipeline/test-email-message.log'
  - st: sublime_security_message_event
    desc: 'Elastic integrations fixture, 2 events. Upstream: sublime_security/data_stream/message_event/_dev/test/pipeline/test-message-event.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: sublime_security
  Sourcetypes: '3'
  Fixture events: '6'
  Log format seen: json
  Fields in the first fixture: id, type, created_at, data.request.id, data.request.path, data.request.method
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Sublime Security events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries id, type, created_at, data.request.id, data.request.path, data.request.method. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads sublime_security and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
