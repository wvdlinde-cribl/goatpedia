id: sublime-security
name: Sublime Security
short: Sublime
vendor: Sublime Security
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Sublime Platform
  - Sublime email security
tags:
  - email-security
  - phishing
  - bec
  - audit
summary: An email security platform that connects to Microsoft 365 or Google Workspace mailboxes and evaluates every message with detection rules written in its Message Query Language and with machine-learning attack scoring. It can flag, move or remove malicious mail after delivery. It produces three streams — audit events for actions in the platform, the full analysed message (the message data model), and message events that record a verdict for a message in a mailbox.
sourcetypes:
  - st: sublime_security_audit
    desc: Audit log of the Sublime platform, one event per user or API action with the request path, method, auth method, IP and the acting user
  - st: sublime_security_email_message
    desc: The analysed email message as Sublime models it — headers, sender, recipients, body, links, attachments and hashes
  - st: sublime_security_message_event
    desc: One message in one mailbox with its attack score verdict, sender, recipients, subject and what the user did with it
facts:
  Product: API-based email security for Microsoft 365 and Google Workspace
  Deployment: Sublime Cloud, or self-hosted in the customer's own cloud account
  Detection: Rules in Message Query Language (MQL) plus an attack score with verdicts such as malicious, suspicious or likely benign
  Log transport: HTTPS JSON from the Sublime API, or webhooks, received by any collector
  Log format: One JSON object per audit event, message or message event
  What an audit event answers: Who in the platform did what, through which API path, with which authentication method and from which IP
  What a message event answers: Which mailbox received which message, what verdict Sublime gave it, and whether it was read, replied to or forwarded
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Sublime platform and mailbox APIs
      desc: Sublime reads mail through the Microsoft 365 or Google Workspace APIs, analyses it in the Sublime platform, and acts on it in the mailbox. A collector reads its events from the Sublime API.
howItWorks:
  - title: Message analysis
    body: Each message is parsed into the message data model — sender, recipients, headers and hops, body text and HTML, links with their domains, and attachments with type and hashes. Detection rules and the attack score run against that model.
  - title: Verdicts and actions
    body: A message event records the outcome for one mailbox — attack_score_verdict, whether it landed in spam, and whether the user read, replied to or forwarded it. Rules can trigger actions such as moving the message or adding a warning banner.
  - title: Platform audit
    body: Every user or API action in the Sublime console is an audit event with a type such as message_group.search, the request path and method, the authentication method (for example an API key) and the user who acted with their role.
  - title: How the data leaves the product
    body: A collector calls the Sublime audit and message APIs, or receives webhooks, and forwards each JSON object to any destination.
traffic:
  handles:
    - Inbound, internal and outbound email
    - Phishing, BEC and malware attachment detection
    - Post-delivery remediation
    - Platform administration and API use
  flow:
    - step: Message arrives
      desc: An email is delivered to a Microsoft 365 or Google Workspace mailbox.
    - step: Sublime analyses it
      desc: Sublime pulls the message through the mailbox API, builds the message data model and scores it.
    - step: Events are recorded
      desc: The message, a message event with its verdict, and any admin action are stored by Sublime.
    - step: Collector receives
      desc: A collector reads the events from the API. Goatpedia reads these samples as JSON.
logs:
  - type: Audit events
    sourcetype: sublime_security_audit
    format: json
    desc: One action in the platform. type names it, data.request.path, method and authentication_method describe the call, data.request.ip says from where, and created_by gives the user and role. This sample is an admin searching message groups with an API key. The IP uses a documentation address.
    sample: '{"id":"26704b44-d1b0-4362-8221-579e604f40cb","type":"message_group.search","created_at":"2024-07-30T05:33:47.725649Z","data":{"request":{"id":"ca817b01-cfaa-40ea-ab80-30b6a8e6ef08","path":"/v1/messages/groups/search","method":"GET","query":{},"body":"","api_key_name":"demo mode key","authentication_method":"api_key","ip":"203.0.113.40","user_agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/192.0.2.10 Safari/537.36"}},"created_by":{"id":"6e6eca05-4fea-406b-86d4-b40177e25474","active":true,"first_name":"Bob","last_name":"User","email_address":"user@example.com","phone_number":null,"created_at":"2024-07-12T05:13:47.879426Z","updated_at":"2024-07-12T05:13:47.879426Z","role":"admin","is_enrolled":true,"google_oauth_user_id":"","microsoft_oauth_user_id":""}}'
    key:
      - id
      - type
      - created_at
      - data.request.id
  - type: Email messages
    sourcetype: sublime_security_email_message
    format: json
    desc: One message as Sublime parsed it. sender, recipients and headers describe the envelope, body holds text, links and IPs, and attachments lists files with type and hashes. This is a synthetic test message using example.com and documentation addresses.
