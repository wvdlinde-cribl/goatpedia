id: island-browser
name: Island
short: Island
vendor: Island
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Island Enterprise Browser
  - Island Browser
tags:
  - browser
  - dlp
  - audit
  - json
summary: Island is an enterprise browser. People do their work in it, and the organization sets policy for navigation, downloads, copy and similar actions. The browser reports each activity with a verdict. The management console records administrator changes, the users, the browsers, and credentials Island has matched to a known breach. A collector pulls each stream as JSON from Island's API.
sourcetypes:
  - st: island_browser_admin_actions
    desc: One action in the Island management console, such as a user being created. entityType, actionType and the actor say what changed.
  - st: island_browser_audit
    desc: One browser activity. type is the activity, such as navigation. verdict is whether policy allowed it.
  - st: island_browser_compromised_credential
    desc: One credential Island matched to a breach. status says whether it is still unresolved.
  - st: island_browser_device
    desc: One browser device. The machine, the user, the OS and the disk, firewall and protection flags are the posture.
  - st: island_browser_user
    desc: One person in the tenant. Status, groups and the last sign-in are the directory record.
facts:
  Product: Enterprise browser with policy on navigation and data movement, plus a management console
  Clients: The Island browser on the endpoint. Administrators use the management console.
  Log transport: HTTPS JSON from the Island management API. Users, devices, compromised credentials, admin actions and browser audit are separate calls.
  Log format: One JSON object per action, activity, credential, device or user
  What an audit event answers: Who navigated or acted, which URL, which rule, and whether the verdict was allowed
  What a compromised credential answers: Which account showed up in a breach, and whether the status is still unresolved
  What an admin action answers: Who created or changed a user or another object, from which address
placement:
  slots:
    - endpoint
    - cloud
  items:
    - slot: endpoint
      title: Island browser
      desc: The browser enforces policy on the laptop. Navigation and other activity are recorded with a verdict, a URL and the device. The event is stored in the Island tenant.
    - slot: cloud
      title: Management console
      desc: Users, devices, admin actions and compromised-credential matches live in the tenant. A collector with an API key polls them.
howItWorks:
  - title: Browsing
    body: An audit event is one activity. type Navigation is a page visit. verdict Allowed means policy let it through. Any other verdict is the browser blocking or controlling it. topLevelUrl and submittedUrl are the page. ruleName is the policy. sourceIp is the client. email and userName are the person. keystrokes is text the policy recorded for that activity, when it recorded any. The sample is an allowed navigation to a documentation URL, from a documentation address, with a short example keystroke string.
  - title: Administration and credentials
    body: An admin action names entityType, actionType and actionDomain. The sample is a Create of a User in UserManagement, done with an API key, from a documentation address. A compromised credential is one email Island matched to a breach. breachSource, compromisedDate and status are the match. Unresolved means nobody has closed it. A device record is one browser install, with disk encryption, firewall and the agent protection flag. A user record is the person, their groups and their last login.
  - title: How a collector pulls them
    body: Island stores the records in the tenant. A collector calls the management API. Any collector with a key can do this. Allowed navigation is most of the audit volume.
traffic:
  handles:
    - Browser navigation and other audited activity
    - Administrator changes to users and policy
    - Credentials matched to a breach
    - Device posture and the user directory
  flow:
    - step: A person or an admin acts
      desc: Someone browses in Island, an administrator changes the tenant, or Island matches a credential to a breach.
    - step: The tenant records it
      desc: The activity, the admin action, the credential, the device or the user is one JSON object.
    - step: Collector polls the API
      desc: A collector requests the next page and can forward each object anywhere.
logs:
  - type: Admin action
    sourcetype: island_browser_admin_actions
    format: json
    desc: One console change. entityType and actionType are the object and the verb. actionDomain is the area, such as user management. email and sourceIp are the actor and the client. This sample is a user being created through an API key. The email and the address are documentation values.
    sample: '{"entityType":"User","entityId":"auth0|30e45685-6701-4c92-bcdd-49e53c7853bd","actionType":"Create","actionDomain":"UserManagement","entityName":"user@example.com","timestamp":"2025-08-28T11:04:18.985019Z","userId":"auth0|1e396c45-b365-4207-ae78-b35b10c06aaf","email":"API|Testing API Key","sourceIp":"192.0.2.10","apiKeyName":"Testing API Key","tenantId":"elastic-testing","id":"b2f2209f-756f-4065-8cfb-d6d1878bfa2e","createdDate":"2025-08-28T11:04:18.985287Z","updatedDate":"2025-08-28T11:04:18.985287Z"}'
    key:
      - entityType
      - entityId
      - actionType
      - actionDomain
  - type: Browser activity
    sourcetype: island_browser_audit
    format: json
    desc: One activity in the browser. type is the kind, such as navigation. verdict is the policy result. topLevelUrl and ruleName are the page and the rule. This sample is an allowed navigation. The URL, the email and the address are documentation values.
    sample: '{"id":"0554e3ab-618a-4171-a5d7-33555ac4476b","createdDate":"2025-09-09T09:24:36.278692Z","updatedDate":"2025-09-09T09:24:36.278693Z","tenantId":"elastic-testing","userId":"auth0|cbbf1398-e567-4e6f-8929-5a786ffc2486","deviceId":"7748cf6a-1a23-4572-b5ee-129962616b25","clientEventId":"d14e7489-e627-4cf8-bf89-daeb6c4b6a55","userName":"John Doe","email":"user@example.com","type":"Navigation","verdict":"Allowed","verdictReason":"Navigation allowed by policy","timestamp":"2025-09-09T13:29:38.000Z","processedDate":"2025-09-09T13:29:39.123456Z","topLevelUrl":"https://example.com","country":"India","region":"Asia","urlWebCategories":["Business","Technology"],"saasApplicationName":"Microsoft 365","saasApplicationCategory":"Productivity","urlWebReputation":85,"tabId":935959881,"ruleId":"rule-12345","ruleName":"Standard Navigation Policy","screenshotFileName":"screenshot_20250909_132938.png","keystrokes":"example search query","details":"{\n  \"navigation_details\": {\n    \"referrer\": \"https://google.com\",\n    \"user_agent\": \"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36\"\n  },\n  \"policy_versi...","incognito":false,"submittedUrl":"https://example.com/page","sourceIp":"192.0.2.20"}'
    key:
      - id
      - createdDate
      - updatedDate
      - tenantId
  - type: Compromised credential
    sourcetype: island_browser_compromised_credential
    format: json
    desc: One credential matched to a breach. email and username are the account. breachSource and compromisedDate are the breach. status Unresolved means it is still open. The email in this sample is a documentation address.
    sample: '{"breachSource":"Ransomware Attack - April 2025","compromisedDate":"2024-09-13T00:00:00Z","createdDate":"2024-09-21T09:46:00Z","email":"user@example.com","id":"cc-10364-ae99d-20364","impactedDomain":"enterprise.io","status":"Unresolved","tenantId":"tenant-005-tech","updatedDate":"2024-09-21T14:40:00Z","username":"john.doe364"}'
    key:
      - breachSource
      - compromisedDate
      - createdDate
      - email
  - type: Browser device
    sourcetype: island_browser_device
    format: json
    desc: One installed browser. machineName, serialNumber, osPlatform and the user identify it. diskEncrypted, osFirewallEnabled and spmProtected are the posture flags. status is whether the device is active. The email and the addresses in this sample are documentation values.
    sample: '{"id":"device-xyz-001","createdDate":"2025-08-05T09:07:23.735Z","updatedDate":"2025-08-05T09:07:23.735Z","tenantId":"tenant-1234-abcd","machineId":"MCHN123456","machineName":"CORP-LAPTOP-45","machineModel":"Dell Latitude 7420","serialNumber":"SN1234567890","userName":"Aditya Sharma","userId":"user-5678-defg","email":"user@example.com","osPlatform":"Windows","islandPlatform":"Browser","osVersion":"Windows 11 Pro 22H2","browserVersion":"1.18.2.1001","chromiumVersion":"116.0.5845.97","extensionVersion":"2.5.0","updaterVersion":"3.1.0","lastSeen":"2025-08-05T09:07:23.735Z","policyUpdateTime":"2025-08-05T09:06:00.000Z","diskEncrypted":true,"latestSecurityUpdateId":"KB5028185","osUserName":"CORP\\adityas","status":"Active","spmProtected":true,"internalIpAddress":"198.51.100.25","externalIpAddress":"203.0.113.8","osDomain":"CORP.LOCAL","systemIntegrityProtection":true,"osFirewallEnabled":true}'
    key:
      - id
      - createdDate
      - updatedDate
      - tenantId
  - type: User
    sourcetype: island_browser_user
    format: json
    desc: One person. email, userStatus and groups are the directory record. lastLogin is the last sign-in. This sample is an active user in the Admins group. The email is a documentation address.
    sample: '{"id":"f3d9a7c8-42b1-4f19-9b51-8a3c56e6d912","createdDate":"2025-08-15T10:30:00Z","updatedDate":"2025-08-18T14:45:00Z","tenantId":"acme-tenant-001","userId":"user-12345","userType":"Management","userStatus":"Active","groups":["Admins","Security"],"connectionName":"AzureAD","allowedTenantsIds":["acme-tenant-001","partner-tenant-002"],"firstName":"John","lastName":"Doe","email":"user@example.com","lastLogin":"2025-08-18T14:40:10Z","lastSeen":"2025-08-18T14:41:55Z","invitationDate":"2025-08-10T09:00:00Z","expirationDate":null,"emailVerified":true,"userSource":"Email","claims":{},"scimId":null}'
    key:
      - id
      - createdDate
      - updatedDate
      - tenantId
cves: []
detections:
  - title: Compromised credential still unresolved
    severity: high
    signals:
      - status
      - email
      - username
      - breachSource
      - compromisedDate
    why: status Unresolved means Island matched the account to a breach and nobody has closed the match. That is a credential that may still be in use. The sample is one unresolved match.
    kql: |
      dataset="island-browser_logs"
      | where sourcetype == "island_browser_compromised_credential" and status == "Unresolved"
      | project email, username, status, breachSource, compromisedDate, impactedDomain
  - title: Administrator created a user
    severity: medium
    signals:
      - actionType
      - actionDomain
      - entityType
      - email
      - sourceIp
    why: A Create in UserManagement adds an account to the enterprise browser. The sample is that action, performed with an API key. The actor email and the source address say who and from where.
    kql: |
      dataset="island-browser_logs"
      | where sourcetype == "island_browser_admin_actions" and actionDomain == "UserManagement" and actionType == "Create"
      | project timestamp, actionType, entityType, entityName, email, sourceIp, apiKeyName
    mitre:
      - T1136
optimizations:
  - title: Drop allowed browsing
    saving: most of the browsing volume
    fn: Drop
    how: Allowed navigation is the bulk of the browser audit. Keep verdicts that are not Allowed, plus admin actions and unresolved compromised credentials. Allowed browsing is context. Keep it in cheaper storage if you still want the history.
    expr: verdict == 'Allowed'
    stream:
      log: Browser activity
      functions:
        - id: drop
          filter: verdict == 'Allowed'
          description: Drop allowed browser activity; keep blocked and other verdicts
          conf: {}
      test:
        - '{"id":"0554e3ab-618a-4171-a5d7-33555ac4476c","createdDate":"2025-09-09T09:24:36.278692Z","updatedDate":"2025-09-09T09:24:36.278693Z","tenantId":"elastic-testing","userId":"auth0|cbbf1398-e567-4e6f-8929-5a786ffc2486","deviceId":"7748cf6a-1a23-4572-b5ee-129962616b25","clientEventId":"d14e7489-e627-4cf8-bf89-daeb6c4b6a56","userName":"John Doe","email":"user@example.com","type":"Navigation","verdict":"Blocked","verdictReason":"Navigation blocked by policy","timestamp":"2025-09-09T13:29:38.000Z","processedDate":"2025-09-09T13:29:39.123456Z","topLevelUrl":"https://bad.example.com","country":"India","region":"Asia","urlWebCategories":["Malware"],"saasApplicationName":"Microsoft 365","saasApplicationCategory":"Productivity","urlWebReputation":5,"tabId":935959881,"ruleId":"rule-12345","ruleName":"Standard Navigation Policy","screenshotFileName":"screenshot_20250909_132938.png","keystrokes":"example search query","details":"{}","incognito":false,"submittedUrl":"https://bad.example.com/page","sourceIp":"192.0.2.20"}'
      expect:
        out: 1
        present:
          - verdict
        smaller: true
