facts:
  Where the sample comes from: Elastic integrations
  Integration package: gcp_vertexai
  Sourcetypes: '1'
  Fixture events: '5'
  Log format seen: json
  Fields in the first fixture: protoPayload.@type, protoPayload.authenticationInfo.principalEmail, protoPayload.requestMetadata.callerIp, protoPayload.requestMetadata.callerSuppliedUserAgent, protoPayload.requestMetadata.requestAttributes.time, protoPayload.requestMetadata.requestAttributes.auth
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: GCP Vertexai events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries protoPayload.@type, protoPayload.authenticationInfo.principalEmail, protoPayload.requestMetadata.callerIp, protoPayload.requestMetadata.callerSuppliedUserAgent, protoPayload.requestMetadata.requestAttributes.time, protoPayload.requestMetadata.requestAttributes.auth. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads gcp_vertexai and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
