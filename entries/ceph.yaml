summary: Ceph is logged by the Datadog integrations-core package ceph. The Pack Generator samples pool holds fixture events for 4 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: ceph
    desc: 'Datadog integrations-core fixture, 10 events. Upstream: ceph/assets/logs/ceph_tests.yaml'
  - st: ceph_cluster_status
    desc: 'Elastic integrations fixture, 2 events. Upstream: ceph/data_stream/cluster_status/_dev/test/pipeline/test-cluster-status-metrics-nautilus.log'
  - st: ceph_osd_pool_stats
    desc: 'Elastic integrations fixture, 1 events. Upstream: ceph/data_stream/osd_pool_stats/_dev/test/pipeline/test-osd-pool-stats-metrics.log'
  - st: ceph_osd_tree
    desc: 'Elastic integrations fixture, 2 events. Upstream: ceph/data_stream/osd_tree/_dev/test/pipeline/test-osd-tree-metrics-2.log'
facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: ceph
  Sourcetypes: '4'
  Fixture events: '15'
  Log format seen: text, json
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Ceph events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads ceph and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as text / json.
logs:
  - type: Ceph
    sourcetype: ceph
    format: text
    desc: 10 fixture events in the samples pool (logtest).
    sample: '2019-06-19 08:00:04.025198 mon.ceph-node-1 unknown.0 - 0 :  [INF] mkfs 9f7d54f4-56b0-4f37-ab0a-eeaf198fd8f6'
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: Cluster Status
    sourcetype: ceph_cluster_status
    format: json
    desc: 2 fixture events in the samples pool (elastic).
    sample: '{"command":"status format=json","outb":{"fsid":"71bb7c52-360c-410a-9847-717e1483a05f","health":{"checks":{"OSD_DOWN":{"severity":"HEALTH_WARN","summary":{"message":"1 osds down"}},"OSD_HOST_DOWN":{"severity":"HEALTH_WARN","summary":{"message":"1 host (1 osds) down"}},"PG_DEGRADED":{"severity":"HEALTH_WARN","summary":{"message":"Degraded data redundancy: 148/222 objects degraded (66.667%), 33 pgs degraded, 328 pgs undersized"}},"POOL_TOO_FEW_PGS":{"severity":"HEALTH_WARN","summary":{"message":"1 pools have too few placement groups"}},"POOL_TOO_MANY_PGS":{"severity":"HEALTH_WARN","summary":{"message":"2 pools have too many placement groups"}}},"status":"HEALTH_WARN"},"election_epoch":19,"quorum":[0],"quorum_names":["master"],"quorum_age":184768,"monmap":{"epoch":2,"min_mon_release_name":"14","num_mons":1},"osdmap":{"osdmap":{"epoch":114,"num_osds":4,"num_up_osds":1,"num_in_osds":2,"num_remapped_pgs":0}},"pgmap":{"pgs_by_state":[{"state_name":"active+undersized","count":295},{"state_name":"active+undersized+degraded","count":33}],"num_pgs":328,"num_pools":5,"num_objects":74,"data_bytes":145064680,"bytes_used":1239285760,"bytes_avail":20231356416,"bytes_total":21470642176,"degraded_objects":148,"degraded_total":222,"degraded_ratio":0.6666666666666665,"read_bytes_sec":1738015,"write_bytes_sec":2543437,"read_op_per_sec":3,"write_op_per_sec":4},"fsmap":{"epoch":1,"by_rank":[],"up:standby":0},"services":{"dashboard":"https://master.29053.local:8443/","restful":"https://master.29053.local:8003/"},"always_on_modules":{"nautilus":["balancer","crash"]}},"servicemap":{"epoch":6072,"modified":"2023-02-08 16:02:26.086357","services":{}},"progress_events":{},"outs":""}'
