    desc: 1 fixture events in the samples pool (elastic).
    sample: '{"pool_name":"device_health_metrics","pool_id":1,"recovery":{},"recovery_rate":{},"client_io_rate":{"write_bytes_sec":932015,"read_op_per_sec":0,"write_op_per_sec":1}}'
