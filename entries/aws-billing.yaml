id: aws-billing
name: AWS Cost and Usage Report
short: AWS CUR
vendor: Amazon Web Services
category: cloud
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - AWS Billing
  - CUR
  - AWS Data Exports
tags:
  - billing
  - finops
  - aws
  - cloud
  - csv
summary: The most detailed billing data AWS provides. The Cost and Usage Report, now delivered through AWS Data Exports, writes CSV or Parquet files to an S3 bucket with one line item per resource, usage type, operation and hour or day. It shows what every account spent on which product and why, including discounts, Savings Plans and reservations.
sourcetypes:
  - st: aws_billing_cur
    desc: Cost and Usage Report line items, one row per resource, usage type and period with account, product, usage amount and cost
facts:
  Product: Detailed billing export for AWS accounts and organizations
  Log transport: CSV or Parquet files written to an S3 bucket, refreshed several times a day
  Log format: Delimited rows whose columns are grouped by prefix (bill_, line_item_, product_, pricing_, reservation_, savings_plan_)
  What a line item answers: Which account used how much of which product and usage type in which period, and what it cost
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: AWS billing and S3 bucket
      desc: The management account defines the export. AWS writes the report files into an S3 bucket in that account, where a collector reads them.
howItWorks:
  - title: Line items
    body: Each row is a line item for one resource or usage type over the time interval in identity_time_interval. line_item_line_item_type says if it is usage, tax, credit, a Savings Plan or reservation fee. line_item_usage_amount and line_item_unblended_cost give quantity and cost.
  - title: Columns
    body: Columns are grouped by prefix. bill_ is the invoice and payer, line_item_ the usage, product_ the product attributes, pricing_ the rate, reservation_ and savings_plan_ the commitments, and resource tags when enabled. Each file starts with a header row naming them.
  - title: How the data leaves AWS
    body: AWS writes and overwrites report files in S3 for the current billing period. A collector reads new or changed objects from the bucket.
traffic:
  handles:
    - AWS usage and charges per account, product and resource
  flow:
    - step: Usage is metered
      desc: AWS meters every service's usage per account and resource.
    - step: Report is written
      desc: AWS writes the cost and usage files for the billing period to the S3 bucket.
    - step: Collector reads
      desc: A collector reads the CSV or Parquet objects from S3.
