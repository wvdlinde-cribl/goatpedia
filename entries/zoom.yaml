id: zoom
name: Zoom
short: Zoom
vendor: Zoom
category: saas
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - zoom
  - Elastic integrations
tags:
  - elastic
  - json
summary: Zoom is logged by the Elastic integrations package zoom. The Pack Generator samples pool holds fixture events for 3 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: zoom_activity
    desc: 'Elastic integrations fixture, 5 events. Upstream: zoom/data_stream/activity/_dev/test/pipeline/test-zoom-activity.log'
  - st: zoom_meeting_activity
    desc: 'Elastic integrations fixture, 5 events. Upstream: zoom/data_stream/meeting_activity/_dev/test/pipeline/test-zoom-meeting-activity.log'
  - st: zoom_operation
    desc: 'Elastic integrations fixture, 5 events. Upstream: zoom/data_stream/operation/_dev/test/pipeline/test-zoom-operation.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: zoom
  Sourcetypes: '3'
  Fixture events: '15'
  Log format seen: json
  Fields in the first fixture: client_type, email, ip_address, time, type, version
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Zoom events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries client_type, email, ip_address, time, type, version. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads zoom and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
logs:
  - type: Activity
    sourcetype: zoom_activity
    format: json
    desc: 5 fixture events in the samples pool (elastic).
    sample: '{"client_type":"Browser","email":"user@example.com","ip_address":"203.0.113.8","time":"2024-06-07T10:00:00Z","type":"Sign in","version":"6.0.0.1000"}'
    key:
      - client_type
      - email
      - ip_address
      - time
  - type: Meeting Activity
    sourcetype: zoom_meeting_activity
    format: json
    desc: 5 fixture events in the samples pool (elastic).
    sample: '{"meeting_number":"982 610 0285","activity_time":"2024-03-21 07:09:03:216","operator":"Jill Chill","operator_email":"user@example.com","activity_category":"Meeting Started","activity_detail":"Meeting Started"}'
    key:
      - meeting_number
      - activity_time
      - operator
      - operator_email
  - type: Operation
    sourcetype: zoom_operation
    format: json
    desc: 5 fixture events in the samples pool (elastic).
    sample: '{"action":"Update","category_type":"User","operation_detail":"Activate User user@example.com","operator":"user@example.com","time":"2024-06-07T10:00:00Z"}'
    key:
      - action
      - category_type
      - operation_detail
      - operator
cves: []
detections:
  - title: Zoom events arriving
    severity: low
    signals:
      - client_type
      - email
      - ip_address
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "zoom_activity"'
optimizations: []
references:
  - title: elastic/integrations zoom/data_stream
    url: https://github.com/elastic/integrations/blob/cbfff90638a7565377768f50726775c0febc7bf4/packages/zoom/data_stream/activity/_dev/test/pipeline/test-zoom-activity.log
  - title: Pack Generator sample zoom_activity.json
    url: https://github.com/wvdlinde-cribl/cribl-pack-samples/blob/main/samples/zoom_activity.json
