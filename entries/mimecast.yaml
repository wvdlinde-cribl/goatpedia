facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: mimecast
  Sourcetypes: '12'
  Fixture events: '168'
  Log format seen: json
  Fields in the first fixture: eventInfo, eventTime, id, auditType, category, user
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Mimecast events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries eventInfo, eventTime, id, auditType, category, user. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads mimecast and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
