    body: Qualys Vmdr events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries DETECTION_LIST.FIRST_FOUND_DATETIME, DETECTION_LIST.IS_DISABLED, DETECTION_LIST.IS_IGNORED, DETECTION_LIST.LAST_FOUND_DATETIME, DETECTION_LIST.LAST_PROCESSED_DATETIME, DETECTION_LIST.LAST_TEST_DATETIME. Values in the sample were rewritten to documentation addresses.
