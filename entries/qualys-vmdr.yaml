# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: qualys-vmdr
name: Qualys VMDR
short: Qualys VMDR
vendor: Qualys
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Qualys Vulnerability Management, Detection and Response
  - Qualys VM
tags:
  - vulnerability-management
  - scanner
  - saas
  - json
summary: Qualys' vulnerability management service. Cloud Agents and scanners test hosts for vulnerabilities identified by QID, and the KnowledgeBase describes each QID with CVEs, severity, threat intelligence and fixes. Its data covers host detections, KnowledgeBase entries and the user activity log of the Qualys account.
sourcetypes:
  - st: qualys_vmdr_asset_host_detection
    desc: 'Vulnerability detections per host: QID, severity, status, first and last found, results, with host and KnowledgeBase details'
  - st: qualys_vmdr_knowledge_base
    desc: 'KnowledgeBase entries for QIDs: CVEs, severity, threat intelligence, consequence, diagnosis and solution'
  - st: qualys_vmdr_user_activity
    desc: 'Activity of users in the Qualys account: logins and actions by module, with user, role and IP'
facts:
  Product: Vulnerability scanning, prioritisation and remediation tracking
  Sensors: Cloud Agents, internal and external scanners, and cloud connectors
  Log transport: Qualys APIs over HTTPS (host list detection, KnowledgeBase, user activity log), polled by a collector
  Log format: XML API output, converted to one JSON object per detection, QID or activity entry
  What a detection answers: Which host has which vulnerability, how severe, since when, and whether it is still active
  What a user activity entry answers: Who logged in to or acted in the Qualys account, from where, with which role
placement:
  slots:
    - cloud
    - internal
  items:
    - slot: cloud
      title: Qualys platform
      desc: Detections, the KnowledgeBase and account activity live in the Qualys cloud platform. A collector polls its APIs.
    - slot: internal
      title: Scanners and agents
      desc: Scanner appliances inside the network and Cloud Agents on hosts perform the tests and report to the platform.
howItWorks:
  - title: Detections
    body: A scan or agent assessment tests a host for QIDs. Each detection records the QID, severity, type (confirmed or potential), status (new, active, fixed, re-opened), and first and last found times.
  - title: KnowledgeBase
    body: Each QID has an entry with CVEs, CVSS, severity level, threat intelligence tags such as Exploit_Public, and the diagnosis, consequence and solution text.
  - title: Account activity
    body: The user activity log records logins and actions in the Qualys UI and API.
  - title: How the data leaves the product
    body: A collector calls the host list detection, KnowledgeBase and activity log APIs, usually for changes since the last poll.
traffic:
  handles:
    - Vulnerability scanning
    - Vulnerability KnowledgeBase
    - Qualys account administration
  flow:
    - step: Assess
      desc: A scanner or Cloud Agent tests a host.
    - step: Record detection
      desc: The platform records detections for the host and updates their status.
    - step: Collector polls
      desc: A collector fetches detections, KnowledgeBase changes and user activity.
