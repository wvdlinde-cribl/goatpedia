LITY":"yes"},"AUTHENTICATION":"auth","EXPLOITABILITY":"exploit","REMEDIATION_LEVEL":"remedy","REPORT_CONFIDENCE":"level"},"CVSS_V3":{"BASE":"base","TEMPORAL":"temporal","VECTOR_STRING":"ax_vb","CVSS3_VERSION":"1.0.0","ATTACK":{"VECTOR":"ax_vb","COMPLEXITY":"hard"},"IMPACT":{"CONFIDENTIALITY":"confidential","INTEGRITY":"0","AVAILABILITY":"1"},"PRIVILEGES_REQUIRED":"userlevel","USER_INTERACTION":"interact","SCOPE":"4","EXPLOIT_CODE_MATURITY":"mature","REMEDIATION_LEVEL":"5","REPORT_CONFIDENCE":"confident"},"AUTOMATIC_PCI_FAIL":"fail","TITLE":"Fedora Security Update for editorconfig (ABCDEFG-2023-6e5d4757df)","PATCHABLE":"0","IS_DISABLED":"0","QID":"284008","CHANGE_LOG_LIST":{"CHANGE_LOG_INFO":[{"CHANGE_DATE":"2023-06-05T18:04:20Z","COMMENTS":"Real-time threat indicator \"High_Lateral_Movement\" added."},{"CHANGE_DATE":"2023-06-06T05:00:02Z","COMMENTS":"Exploit added."}]},"CATEGORY":"Fedora","DISCOVERY":{"REMOTE":"0","ADDITIONAL_INFO":"Patch Available, Exploit Available","AUTH_TYPE_LIST":{"AUTH_TYPE":"Unix"}},"COMPLIANCE_LIST":{"COMPLIANCE":{"TYPE":"law","SECTION":"law_section","DESCRIPTION":"Not Provided"}}}'
    key:
      - VENDOR_REFERENCE_LIST.VENDOR_REFERENCE.ID
      - VENDOR_REFERENCE_LIST.VENDOR_REFERENCE.URL
      - THREAT_INTELLIGENCE.THREAT_INTEL[0].#text
      - THREAT_INTELLIGENCE.THREAT_INTEL[0].id
  - type: User activity
    sourcetype: qualys_vmdr_user_activity
    format: json
    desc: One object per action in the Qualys account. Action and Module say what, Date when, and the user name, role and IP who and from where. This sample is a login by a Manager. The sample uses documentation addresses.
    sample: '{"Action":"login","Date":"2024-02-03T04:35:38Z","Details":"user_logged in","Module":"auth","User IP":"192.0.2.20","User Name":"saand_rn","User Role":"Manager"}'
    key:
      - Action
      - Date
      - Details
      - Module
cves: []
detections:
  - title: Active severity 4 or 5 vulnerability
    severity: medium
    signals:
      - DETECTION_LIST.SEVERITY
      - DETECTION_LIST.STATUS
      - DETECTION_LIST.QID
      - IP
    why: Severity 4 and 5 are Qualys' critical and urgent levels. A confirmed detection still active on a host is open exposure that should be in the remediation queue.
    kql: |
      dataset="qualys-vmdr_logs"
      | where sourcetype == "qualys_vmdr_asset_host_detection" and DETECTION_LIST.SEVERITY in ("4", "5") and DETECTION_LIST.STATUS == "Active" and DETECTION_LIST.TYPE == "Confirmed"
      | project IP, DNS, DETECTION_LIST.QID, DETECTION_LIST.SEVERITY, DETECTION_LIST.FIRST_FOUND_DATETIME, DETECTION_LIST.LAST_FOUND_DATETIME
    mitre:
      - T1190
optimizations:
  - title: Keep the KnowledgeBase as a lookup
    saving: all KnowledgeBase volume in the SIEM
    fn: Routes
    how: KnowledgeBase entries are reference data that change slowly. Store them as a lookup keyed by QID and enrich detections from it instead of indexing them as events.
    expr: sourcetype == 'qualys_vmdr_knowledge_base'
references: []
