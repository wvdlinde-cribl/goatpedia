cves: []
detections:
  - title: Open high-severity incident
    severity: high
    signals:
      - properties.severity
      - properties.status
      - properties.title
      - properties.owner.assignedTo
    why: High incidents that are not closed are the cases that need an analyst now. Unassigned ones are the gap.
    kql: |
      dataset="microsoft-sentinel_logs"
      | where sourcetype == "microsoft_sentinel_incident" and properties.severity == "High" and properties.status != "Closed"
      | project properties.createdTimeUtc, properties.incidentNumber, properties.title, properties.status, properties.owner.assignedTo
optimizations: []
references:
  - title: What is Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/overview
