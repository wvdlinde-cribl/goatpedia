id: microsoft-sentinel
name: Microsoft Sentinel
short: Sentinel
vendor: Microsoft
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Azure Sentinel
tags:
  - siem
  - soar
  - azure
  - alerts
  - incidents
  - json
summary: Microsoft's cloud SIEM and SOAR service, built on a Log Analytics workspace in Azure. Analytics rules run over the workspace data and raise alerts, which Sentinel groups into incidents for analysts to triage, assign and close. Exported from the workspace or read from the Sentinel API, these records show which rules fired, on which entities, and how each incident was handled.
sourcetypes:
  - st: microsoft_sentinel
    desc: Rows of the workspace SecurityAlert table, one alert with name, severity, provider, entities, tactics and status
  - st: microsoft_sentinel_alert
    desc: Security alerts read through the Sentinel management API, with display name, severity, product, confidence and status
  - st: microsoft_sentinel_incident
    desc: Sentinel incidents, with title, severity, status, owner, classification, related analytic rules and counts of alerts and comments
facts:
  Product: Cloud SIEM and SOAR on Azure Log Analytics
  Scope: One or more Log Analytics workspaces in Azure subscriptions
  Log transport: Workspace data export to an Event Hub or storage, or the Sentinel REST API polled by a collector
  Log format: One JSON object per alert row, alert resource or incident resource
  What an alert answers: Which rule or product raised what, about which entity, how severe, and when
  What an incident answers: Which case this is, who owns it, its status, and how it was classified when closed
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Sentinel workspace
      desc: Analytics rules, alerts and incidents live in the Log Analytics workspace that Sentinel runs on, in Azure. A collector reads the export or calls the API for that workspace.
howItWorks:
  - title: Analytics rules and alerts
    body: Scheduled and near-real-time analytics rules query the workspace and raise alerts. Alerts from other Microsoft products can also flow in. Every alert is stored in the SecurityAlert table with AlertName, AlertSeverity, ProviderName, Entities and Tactics.
  - title: Incidents
    body: Sentinel groups alerts into incidents. Analysts assign an owner, change status (New, Active, Closed) and, on closing, set a classification such as TruePositive, BenignPositive or FalsePositive with a reason and comment.
  - title: Getting the records out
    body: Workspace data export streams table rows such as SecurityAlert to an Event Hub. Alerts and incidents can also be read as Azure resources through the Microsoft.SecurityInsights API. Any collector can take them from there.
traffic:
  handles:
    - Analytic rule alerts
    - Incident triage and assignment
    - Incident closure and classification
  flow:
    - step: Rule fires
      desc: An analytics rule or connected product raises an alert in the workspace.
    - step: Incident created or updated
      desc: Sentinel groups the alert into an incident, and analysts work the incident.
    - step: Record exported
      desc: The alert row is exported, or the alert and incident resources are read from the API. Goatpedia reads them as JSON.
logs:
  - type: SecurityAlert rows
    sourcetype: microsoft_sentinel
    format: json
    desc: One SecurityAlert row. AlertName, AlertSeverity, ProviderName and Entities say what fired, how severe and about what; Status and Tactics give state and ATT&CK context. This sample is a high scheduled-alert about an AWS entity, status New.
    sample: '{"TimeGenerated":"2024-09-26T05:23:30.5594143Z","DisplayName":"Incident for Entity Type account with Entity ID: 302.0 and Tags: [\"MDR - Customer Escalation\"]","AlertName":"Incident for Entity Type account with Entity ID: 302.0 and Tags: [\"MDR - Customer Escalation\"]","AlertSeverity":"High","Description":"Incident has been created for Entity AWS:44512121212/us-east-1/ec2:i-42f44fdfvdf5d of type account with Entity ID: 302.0 and Tags: [\"MDR - Customer Escalatio...","ProviderName":"ASI Scheduled Alerts","VendorName":"Microsoft","VendorOriginalId":"jnfjrdnkr-7cbd-5454-9c61-455cc9818f50","SystemAlertId":"jnfjrdnkr-7cbd-5454-9c61-455cc9818f50","AlertType":"24d005cc-4dd7-437d-82fd-fnddg875rgr-dd8c-41e7-b686-fd5adbbd0aee","IsIncident":0,"StartTime":"2024-09-26T05:18:17.9124607Z","EndTime":"2024-09-26T05:18:17.9124607Z","ProcessingEndTime":"2024-09-26T05:23:30.0436295Z","ExtendedProperties":"{}","Entities":"[{\"$id\":\"2\",\"Name\":\"AWS:44512121212/us-east-1/ec2:i-42f44fdfvdf5d\",\"Type\":\"account\"}]","SourceSystem":"Detection","WorkspaceSubscriptionId":"55fd55dfv-527c-4ffe-b7d5-444f4vdvvf4","WorkspaceResourceGroup":"test","ProductName":"Azure Sentinel","ProductComponentName":"Scheduled Alerts","Status":"New","Tactics":"Unknown","_ItemId":"7c0162e6-7bc7-11ef-ac1b-7c1e524a21ba","_Internal_WorkspaceResourceId":"/subscriptions/e55fd55dfv-527c-4ffe-b7d5-444f4vdvvf4/resourcegroups/test/providers/microsoft.operationalinsights/workspaces/example","Type":"SecurityAlert","TenantId":"55fd4svd5-45a7-437d-82fd-54sdv44svf"}'
    key:
      - TimeGenerated
      - DisplayName
      - AlertName
      - AlertSeverity
  - type: Alert resources
    sourcetype: microsoft_sentinel_alert
    format: json
    desc: One alert as an API resource. properties.alertDisplayName, severity, productName, confidenceLevel and status describe it. This sample is a low alert from Azure Security Center, status New.
    sample: '{"id":"/subscriptions/abcdef1-111111-4647-9105-6339bfdb4e6a/resourceGroups/myRG/providers/Microsoft.OperationalInsights/workspaces/myWorkspace/providers/Microsoft.S...","name":"abcdef-6fde-4ab7-a093-d09f7b75c58c","type":"Microsoft.SecurityInsights/Entities","kind":"SecurityAlert","properties":{"systemAlertId":"abcdef-6fde-4ab7-a093-d09f7b75c58c","tactics":["abc"],"alertDisplayName":"myAlert","confidenceLevel":"Unknown","severity":"Low","vendorName":"Microsoft","productName":"AzureSecurityCenter","alertType":"myAlert","processingEndTime":"2020-07-20T18:21:53.6158361Z","status":"New","endTimeUtc":"2020-07-21T18:21:53.6158361Z","startTimeUtc":"2020-07-20T18:21:53.6158361Z","timeGenerated":"2020-07-20T18:21:53.6158361Z","resourceIdentifiers":[{"type":"LogAnalytics","workspaceId":"abcdefg-985d-4e4e-8e91-fb3466cd0e5b","subscriptionId":"a123456-4d29-4647-9105-6339bfdb4e6a","resourceGroup":"myRG"}],"additionalData":{"AlertMessageEnqueueTime":"2020-07-20T18:21:57.304Z"},"friendlyName":"myAlert"},"systemData":{"createdAt":"2020-07-20T18:21:57.304Z","createdBy":"admin","createdByType":"User","lastModifiedAt":"2020-07-20T18:21:57.304Z"}}'
