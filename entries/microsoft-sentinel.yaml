      - kind
  - type: Incidents
    sourcetype: microsoft_sentinel_incident
    format: json
    desc: One incident as an API resource. properties.title, severity, status, owner and classification describe the case, and additionalData the counts and tactics. This sample is a high incident closed as a false positive for inaccurate data. Values are documentation addresses.
    sample: '{"id":"/subscriptions/d0cfe6b2-9ac0-4464-9919-dccaee2e48c0/resourceGroups/myRg/providers/Microsoft.OperationalInsights/workspaces/myWorkspace/providers/Microsoft.Se...","name":"aaaaaaa-5cd7-4139-a149-9f2736ff2ab5","type":"Microsoft.SecurityInsights/incidents","etag":"\"bbbbbbbb-0000-0000-0000-5c37296e0000\"","properties":{"lastModifiedTimeUtc":"2019-01-01T13:15:30Z","createdTimeUtc":"2019-01-01T13:15:30Z","lastActivityTimeUtc":"2019-01-01T13:05:30Z","firstActivityTimeUtc":"2019-01-01T13:00:30Z","description":"Thisisademoincident","title":"Myincident","owner":{"objectId":"abcdefghij-040d-4a46-9e2b-91c2941bfa70","email":"user@example.com","userPrincipalName":"user@example.com","assignedTo":"johndoe"},"severity":"High","classification":"FalsePositive","classificationComment":"Notamaliciousactivity","classificationReason":"InaccurateData","status":"Closed","incidentUrl":"https://portal.azure.com/#asset/Microsoft_Azure_Security_Insights/Incident/subscriptions/d0cfe6b2-9ac0-4464-9919-dccaee2e48c0/resourceGroups/myRg/providers/M...","incidentNumber":3177,"labels":[],"providerName":"AzureSentinel","providerIncidentId":"3177","relatedAnalyticRuleIds":["/subscriptions/abc12345678-9ac0-4464-9919-dccaee2e48c0/resourceGroups/myRg/providers/Microsoft.OperationalInsights/workspaces/myWorkspace/providers/Microsoft..."],"additionalData":{"alertsCount":0,"bookmarksCount":0,"commentsCount":3,"alertProductNames":[],"tactics":["InitialAccess","Persistence"]}}}'
    key:
