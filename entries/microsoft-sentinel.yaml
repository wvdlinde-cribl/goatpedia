summary: Microsoft Sentinel is logged by the Elastic integrations package microsoft_sentinel. The Pack Generator samples pool holds fixture events for 3 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: microsoft_sentinel
    desc: 'Elastic integrations fixture, 1 events. Upstream: microsoft_sentinel/data_stream/event/_dev/test/pipeline/test-event.log'
  - st: microsoft_sentinel_alert
    desc: 'Elastic integrations fixture, 2 events. Upstream: microsoft_sentinel/data_stream/alert/_dev/test/pipeline/test-alert.log'
  - st: microsoft_sentinel_incident
    desc: 'Elastic integrations fixture, 1 events. Upstream: microsoft_sentinel/data_stream/incident/_dev/test/pipeline/test-incident.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: microsoft_sentinel
  Sourcetypes: '3'
  Fixture events: '4'
  Log format seen: json
  Fields in the first fixture: TimeGenerated, DisplayName, AlertName, AlertSeverity, Description, ProviderName
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Microsoft Sentinel events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries TimeGenerated, DisplayName, AlertName, AlertSeverity, Description, ProviderName. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads microsoft_sentinel and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
