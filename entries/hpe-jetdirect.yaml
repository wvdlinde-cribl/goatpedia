howItWorks:
  - title: What the fixture shows
    body: HPE Jetdirect events in this library are the test fixtures shipped with splunk/splunk-connect-for-syslog (d861082778). The first event carries header, time, user, source_IP, outcome, interface. Values in the sample were rewritten to documentation addresses.
traffic:
