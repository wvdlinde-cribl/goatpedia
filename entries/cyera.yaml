facts:
  Where the sample comes from: Elastic integrations
  Integration package: cyera
  Sourcetypes: '5'
  Fixture events: '22'
  Log format seen: json
  Fields in the first fixture: account.name, account.platform, account.uid, affectedDataClassAppearances[0].recordsCount.recordsCount, affectedDataClassAppearances[0].recordsCount.dataClass.classificationName, affectedDataClassAppearances[0].recordsCount.dataClass.uid
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Cyera events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries account.name, account.platform, account.uid, affectedDataClassAppearances[0].recordsCount.recordsCount, affectedDataClassAppearances[0].recordsCount.dataClass.classificationName, affectedDataClassAppearances[0].recordsCount.dataClass.uid. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads cyera and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
