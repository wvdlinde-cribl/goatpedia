    desc: 'Elastic integrations fixture, 5 events. Upstream: cyera/data_stream/event/_dev/test/pipeline/test-event.log'
  - st: cyera_audit
    desc: 'Elastic integrations fixture, 6 events. Upstream: cyera/data_stream/audit/_dev/test/pipeline/test-audit.log'
