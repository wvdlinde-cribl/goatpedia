id: cyberarkpas
name: CyberArk Privileged Access Manager
short: CyberArk PAM
vendor: CyberArk
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - CyberArk PAS
  - CyberArk Privileged Access Security
  - CyberArk Digital Vault
  - CyberArk Vault
tags:
  - pam
  - privileged-access
  - vault
  - audit
  - syslog
summary: A privileged access management suite built around the Digital Vault, which stores privileged credentials in safes. People and applications retrieve passwords through the web portal (PVWA), session manager (PSM) or application identity components, and the CPM rotates them. The Vault audits every action, such as retrieving a password or opening a session, and can forward that audit trail as syslog.
sourcetypes:
  - st: cyberarkpas_audit
    desc: Vault audit records, one per action on a safe, account or the Vault itself, forwarded as syslog
facts:
  Product: Privileged access management (credential vault, session management, password rotation)
  Components: Digital Vault, Password Vault Web Access (PVWA), Privileged Session Manager (PSM), Central Policy Manager (CPM), application identity providers
  Log transport: Syslog from the Vault server to any receiver, using a configurable XSL translator
  Log format: The audit_record XML is translated by XSL into the chosen syslog format; these samples hold the record as structured fields (MessageID, Action, Issuer, Safe, File and so on)
  What an audit record answers: Who (Issuer) did what (Action, MessageID) to which account (Safe, File), from where (Station), and why (Reason)
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Digital Vault and components
      desc: The Vault runs on a hardened server in the data centre. PVWA, PSM and CPM servers talk to it, and applications request credentials through them. The Vault forwards its audit records to a syslog receiver.
howItWorks:
  - title: Safes and accounts
    body: Privileged credentials are stored as accounts in safes. Safe membership decides who may list, use, retrieve or manage each account, and policies decide rotation and session rules.
  - title: Audit records
    body: Every action is an audit record with a MessageID (295 is Retrieve password), an Action text, the Issuer (user or component), Safe and File (the account object), Station (client address) and Reason. CAProperties holds account properties such as PolicyID and UserName.
  - title: How the records leave the Vault
    body: In the Vault's dbparm.ini the administrator sets a syslog server, port, protocol and an XSL translator file. The Vault applies the translator to each audit record and sends it. Any receiver can take the result.
traffic:
  handles:
    - Password retrieval and use
    - Privileged session start and end
    - Safe and account administration
    - Password rotation by the CPM
  flow:
    - step: Credential requested
      desc: A user in PVWA, a PSM session or an application asks the Vault for a privileged credential.
    - step: Vault decides and audits
      desc: The Vault checks safe permissions and policy, then writes an audit record of the action.
    - step: Translated to syslog
      desc: The Vault translates the record with its XSL file.
    - step: Sent to a receiver
      desc: The record is sent to the configured syslog receiver.
logs:
  - type: Vault audit
    sourcetype: cyberarkpas_audit
    format: json
    desc: One record per Vault action. syslog.audit_record.MessageID 295 and Action "Retrieve password" say a password was retrieved, Issuer is the component that did it (Prov_PVWA, an application identity provider), Safe and File name the account, Station is the client and Reason is "AIM password request". The address is a documentation address.
    sample: '{"format":"elastic","version":"1.0","raw":"<syslog>\n  <audit_record>\n    <Rfc5424>no</Rfc5424>\n    <Vendor>Cyber-Ark</Vendor>\n    <Product>Vault</Product>\n    <Version>11.6.0000</Version>\n    <Message...","syslog":{"audit_record":{"Rfc5424":"no","Vendor":"Cyber-Ark","Product":"Vault","Version":"11.6.0000","MessageID":"295","IsoTimestamp":"2021-03-16T15:01:00Z","Desc":"Retrieve password","Severity":"Info","Issuer":"Prov_PVWA","Action":"Retrieve password","SourceUser":"","TargetUser":"","Safe":"Linux","File":"Root\\Operating System-LINUX-SSH-radiussrv.cyberark.local-admin2","Station":"203.0.113.8","Location":"","Category":"","RequestId":"","Reason":"AIM password request","ExtraDetails":"","Message":"Retrieve password","GatewayStation":"","CAProperties":{"CAProperty":[{"Name":"PolicyID","Value":"LINUX-SSH"},{"Name":"UserName","Value":"admin2"}]}}}}'
    key:
      - format
      - version
      - raw
      - syslog.audit_record.Rfc5424
cves: []
detections:
  - title: Privileged password retrieved
    severity: medium
    signals:
      - syslog.audit_record.Action
      - syslog.audit_record.Issuer
      - syslog.audit_record.Safe
      - syslog.audit_record.File
      - syslog.audit_record.Station
    why: Retrieving a password hands a privileged credential out of the Vault. Retrievals by unusual issuers, from unusual stations, or of root and domain admin accounts outside a change window are the high-value events in this source.
    kql: |
      dataset="cyberarkpas_logs"
      | where sourcetype == "cyberarkpas_audit" and syslog.audit_record.Action == "Retrieve password"
      | project syslog.audit_record.IsoTimestamp, syslog.audit_record.Issuer, syslog.audit_record.Safe, syslog.audit_record.File, syslog.audit_record.Station, syslog.audit_record.Reason
    mitre:
      - T1555
optimizations: []
references:
  - title: CyberArk documentation
    url: https://docs.cyberark.com/
