summary: Socradar Alert is logged by the Elastic integrations package socradar_alert. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: socradar_alert_incidents
    desc: 'Elastic integrations fixture, 5 events. Upstream: socradar_alert/data_stream/incidents/_dev/test/pipeline/test-incidents.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: socradar_alert
  Sourcetypes: '1'
  Fixture events: '5'
  Log format seen: json
  Fields in the first fixture: alarm_id, status, alarm_risk_level, alarm_text, alarm_asset, notification_id
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Socradar Alert events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries alarm_id, status, alarm_risk_level, alarm_text, alarm_asset, notification_id. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads socradar_alert and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
logs:
  - type: Incidents
    sourcetype: socradar_alert_incidents
    format: json
    desc: 5 fixture events in the samples pool (elastic).
    sample: '{"alarm_id":"a1b2c3d4-0000-0000-0000-000000000001","status":"OPEN","alarm_risk_level":"HIGH","alarm_text":"A possible phishing domain targeting your brand was detected.","alarm_asset":"example.com","notification_id":1001,"tags":["phishing","brand-protection"],"company_id":330,"is_approved":false,"date":"2024-01-15 10:30:00","alarm_type_details":{"alarm_sub_type":"Phishing Domain","alarm_main_type":"Brand Protection","alarm_generic_title":"Possible Phishing Domain Detected","alarm_default_risk_level":"HIGH"}}'
    key:
      - alarm_id
      - status
      - alarm_risk_level
      - alarm_text
cves: []
detections:
  - title: Socradar Alert events arriving
    severity: low
    signals:
      - alarm_id
      - status
      - alarm_risk_level
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "socradar_alert_incidents"'
optimizations: []
references:
