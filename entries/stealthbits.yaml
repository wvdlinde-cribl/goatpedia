      title: Splunk Connect for Syslog
      desc: Fixtures were harvested from splunk/splunk-connect-for-syslog. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Stealthbits events in this library are the test fixtures shipped with splunk/splunk-connect-for-syslog (d861082778). The first event carries header, PolicyName, Domain, Server, ServerAddress, Perpetrator. Values in the sample were rewritten to documentation addresses.
traffic:
