cves: []
detections:
  - title: High-severity runtime detection
    severity: high
    signals:
      - severity
      - content.ruleName
      - content.fields.proc.cmdline
      - labels.kubernetes.pod.name
    why: Sysdig severities 0 to 3 are its high band. A runtime event at that level is a rule Sysdig considers a likely attack, such as a reverse shell or credential access in a container.
    kql: |
      dataset="sysdig_logs"
      | where sourcetype == "sysdig" and severity <= 3
      | project timestamp, name, content.ruleName, severity, content.fields.proc.cmdline, labels.kubernetes.namespace.name, labels.kubernetes.pod.name
    mitre:
      - T1059.004
  - title: Exploitable vulnerability in an image
    severity: high
    signals:
      - package.vulnerability.exploitable
      - package.vulnerability.name
      - package.vulnerability.severity
      - metadata.pullString
    why: An exploitable vulnerability has a known exploit. In an image that is running it is the finding to fix first.
    kql: |
      dataset="sysdig_logs"
      | where sourcetype == "sysdig_vulnerability" and package.vulnerability.exploitable == true
      | project metadata.pullString, package.name, package.version, package.vulnerability.name, package.vulnerability.severity, package.suggestedFix
optimizations:
  - title: Route informational activity alerts to storage
    saving: most of the policy alert volume
    fn: Routes
    how: Activity-log policies describe themselves as very noisy and useful for threat hunting. Their alerts arrive at severity 7. Send them to cheaper storage and keep lower-numbered (more severe) alerts in the SIEM.
    expr: severity == 7
references:
  - title: Sysdig documentation
    url: https://docs.sysdig.com/
  - title: Falco documentation
    url: https://falco.org/docs/
