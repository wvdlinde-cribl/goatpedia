id: sysdig
name: Sysdig Secure
short: Sysdig
vendor: Sysdig, Inc.
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Sysdig
  - Sysdig Secure
  - Sysdig Monitor
tags:
  - cnapp
  - container-security
  - kubernetes
  - runtime-detection
summary: A cloud-native application protection platform for containers, Kubernetes and cloud accounts. Sysdig agents on hosts watch system calls with Falco-based rules, and the Sysdig Secure SaaS backend also scans images for vulnerabilities and checks cloud posture against compliance benchmarks. Its streams cover runtime security events and policy alerts (what a process did in which container and pod), posture results per control, and image vulnerabilities with severity and fix version.
sourcetypes:
  - st: sysdig
    desc: Sysdig Secure events, such as runtime workload detections, with the rule, policy, severity, process and container fields and Kubernetes and cloud labels
  - st: sysdig_alerts
    desc: Policy alerts from Sysdig Secure, one per rule match on a host or container, with the rule, output, process fields and labels
  - st: sysdig_cspm
    desc: Cloud security posture results, one per compliance requirement and control, with pass or fail, severity and counts of failing resources
  - st: sysdig_vulnerability
    desc: Vulnerability findings for container images and hosts, one per package and vulnerability, with severity, CVSS, exploitability and fix version
facts:
  Product: Container, Kubernetes and cloud security (runtime detection, vulnerability management, posture)
  Form factor: Sysdig agent (and Falco engine) on hosts and Kubernetes nodes, plus the Sysdig Secure SaaS backend
  Detection engine: Falco rules over system calls and audit logs, grouped into policies with a severity
  Log transport: HTTPS JSON from the Sysdig Secure APIs or event forwarding, received by any collector
  Log format: One JSON object per event, alert, posture result or vulnerability
  What a runtime event answers: Which rule matched, which process and command line ran, in which container, pod, namespace, cluster and cloud account
  What a posture result answers: Which control of which benchmark passed or failed, and how many resources fail it
  What a vulnerability answers: Which package in which image has which CVE, how severe it is, whether it is exploitable and which version fixes it
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Sysdig agent on nodes
      desc: The agent runs on each host or Kubernetes node, inside the customer's data center or cloud network. It watches system calls of every container and evaluates Falco rules locally.
    - slot: cloud
      title: Sysdig Secure backend
      desc: Agents send events to the Sysdig Secure SaaS, which also scans images and cloud accounts. A collector reads events, alerts, posture and vulnerabilities from its APIs.
howItWorks:
  - title: Runtime detection
    body: The agent captures system calls through an eBPF probe or kernel module. Falco rules match patterns such as a shell in a container, user management commands or unexpected network tools. A match produces an event with the rule name, output text, process fields (proc.name, proc.cmdline, proc.pname) and container and Kubernetes labels.
  - title: Policies and severity
    body: Rules are grouped into policies. Each event carries the policy, an originator and a numeric severity, where lower numbers are more severe. Activity-log policies are intentionally noisy and meant for hunting rather than alerting.
  - title: Posture and vulnerabilities
    body: Sysdig evaluates cloud accounts against benchmarks such as CIS, giving pass or fail per requirement and control. Image and host scanning lists each vulnerable package with its CVE, CVSS score, exploitability, fix version and any risk acceptance.
  - title: How the data leaves the product
    body: A collector calls the Sysdig Secure APIs for events, posture results and vulnerability findings, or receives forwarded events. Each record is a JSON object for any destination.
traffic:
  handles:
    - System calls of containers and hosts
    - Kubernetes workloads and cloud accounts
    - Container image packages
    - Compliance controls
  flow:
    - step: Activity happens
      desc: A process runs in a container, an image is deployed, or a cloud resource changes.
    - step: Sysdig evaluates
      desc: The agent matches Falco rules against system calls, and the backend scans images and cloud configuration.
    - step: Result is recorded
      desc: Sysdig Secure stores a runtime event, a policy alert, a posture result or a vulnerability finding.
    - step: Collector receives
      desc: A collector reads the record from the API. Goatpedia reads these samples as JSON.
