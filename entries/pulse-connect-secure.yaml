summary: Pulse Connect Secure is logged by the Elastic integrations package pulse_connect_secure. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: pulse_connect_secure
    desc: 'Elastic integrations fixture, 20 events. Upstream: pulse_connect_secure/data_stream/log/_dev/test/pipeline/test-log-vpn.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: pulse_connect_secure
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Pulse Connect Secure events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Elastic integrations package reads pulse_connect_secure and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as text.
logs:
  - type: Log
    sourcetype: pulse_connect_secure
    format: text
    desc: 20 fixture events in the samples pool (elastic).
    sample: 'Oct 19 09:16:53 pcs-node1 1 2021-10-19T09:16:53+02:00 203.0.113.40 PulseSecure: - - - 2021-10-19 09:16:53 - pcs-node1 - [192.0.2.10] user.name(REALM)[] - Primary authentication successful for user.name/REALM from 192.0.2.20'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Pulse Connect Secure events arriving
    severity: low
    signals:
      - message
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "pulse_connect_secure"'
optimizations: []
references:
