  - type: Device vulnerabilities
    sourcetype: m365_defender_vulnerability
    format: json
    desc: One object per CVE on a device. CveId, CvssScore and ExploitabilityLevel say how bad it is, DeviceName where, and RecommendedSecurityUpdate what fixes it. This sample is a Red Hat kernel CVE on a Linux host, with no known exploit.
