cves: []
detections:
  - title: New high or medium Defender alert
    severity: high
    signals:
      - severity
      - status
      - title
      - serviceSource
      - mitreTechniques
    why: Alerts are Defender's own detections. New high and medium alerts that nobody has picked up are the triage queue.
    kql: |
      dataset="m365-defender_logs"
      | where sourcetype == "m365_defender_alert" and severity in ("high", "medium") and status == "new"
      | project createdDateTime, severity, title, category, serviceSource, mitreTechniques, incidentId
  - title: Exploitable vulnerability on a device
    severity: medium
    signals:
      - CveId
      - CvssScore
      - ExploitabilityLevel
      - DeviceName
    why: A CVE with a public exploit or exploit kit on a device is the patching priority. NoExploit findings can wait for normal patch cycles.
    kql: |
      dataset="m365-defender_logs"
      | where sourcetype == "m365_defender_vulnerability" and ExploitabilityLevel != "NoExploit"
      | project EventTimestamp, DeviceName, CveId, CvssScore, ExploitabilityLevel, RecommendedSecurityUpdate
    mitre:
      - T1190
optimizations: []
