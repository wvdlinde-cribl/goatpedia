summary: Microsoft's extended detection and response suite. It joins signals from Defender for Endpoint, Office 365, Identity and Cloud Apps into one portal, correlates alerts into incidents, and keeps advanced hunting tables of raw device, email and identity activity. The service runs in Microsoft's cloud with sensors on endpoints and in Microsoft 365. Its streams give raw hunting events, alerts, incidents and per-device vulnerabilities.
sourcetypes:
  - st: m365_defender
    desc: Advanced hunting events streamed from Defender XDR, such as DeviceEvents, with the action type, device and initiating process
  - st: m365_defender_alert
    desc: Security alerts from the Defender products, with title, severity, status, category, detection source and MITRE techniques
  - st: m365_defender_incident
    desc: Incidents that group related alerts, with status, severity, classification, assignment, comments and the alerts and evidence inside
  - st: m365_defender_vulnerability
    desc: Vulnerabilities found on devices by vulnerability management, with CVE, CVSS, exploitability and the recommended update
facts:
  Product: Cloud XDR suite combining Defender for Endpoint, Office 365, Identity and Cloud Apps
  Sensors: Defender for Endpoint on Windows, macOS, Linux and mobile; Microsoft 365 mail and identity services
  Log transport: Streaming API to Azure Event Hubs or storage for hunting events; Microsoft Graph security API for alerts and incidents; vulnerability data through the Defender API
  Log format: One JSON object per event, alert, incident or vulnerability record
  What a hunting event answers: What happened on which device, which process caused it and under which account (ActionType, DeviceName, InitiatingProcess fields)
  What an alert answers: What was detected, by which Defender product, how severe and whether it is being handled
  What an incident answers: Which alerts belong together, who owns the case and how it was classified
  What a vulnerability record answers: Which device has which CVE, how severe and exploitable it is, and which update fixes it
placement:
  slots:
    - cloud
    - endpoint
  items:
    - slot: cloud
      title: Microsoft Defender portal
      desc: Correlation, alerts, incidents and hunting tables live in the Defender XDR service in Microsoft's cloud. Collectors read Event Hubs or call the Graph and Defender APIs for the tenant.
    - slot: endpoint
      title: Defender sensors
      desc: The Defender for Endpoint sensor on each device produces the device events and the inventory behind vulnerability findings. The device acts; the event is stored in the tenant.
howItWorks:
  - title: Sensors and hunting tables
    body: Defender sensors send device, email, identity and cloud-app activity to the tenant. It lands in advanced hunting tables such as DeviceEvents, DeviceProcessEvents and EmailEvents. The Streaming API can send those rows to an Event Hub as they arrive; each message names its table in category, such as AdvancedHunting-DeviceEvents.
  - title: Alerts and incidents
    body: Detections from any Defender product become alerts. Defender XDR correlates related alerts into an incident. Both are exposed through the Microsoft Graph security API with status, severity, classification, determination, assignment and links to the portal.
  - title: Vulnerability management
    body: Defender vulnerability management uses the sensor's software inventory to list each CVE that applies to a device, with the CVSS score, exploitability level and the security update that fixes it.
traffic:
  handles:
    - Device process
    - file
    - network and registry activity
    - Email and identity signals
    - Alert triage and incident handling
    - Software vulnerability findings
  flow:
    - step: Sensor observes
      desc: A Defender sensor records activity on a device, in mail or in identity traffic.
    - step: Defender analyses
      desc: The service stores the raw rows, raises alerts, correlates incidents and computes vulnerability findings.
    - step: Data is exported
      desc: Hunting rows stream to an Event Hub; alerts, incidents and vulnerabilities are read from the APIs.
    - step: Events are JSON
      desc: Each record is one JSON object. Goatpedia reads the samples as JSON.
logs:
