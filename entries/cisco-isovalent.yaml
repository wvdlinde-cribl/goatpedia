id: cisco-isovalent
name: Cisco Isovalent (Cilium / Tetragon)
short: Isovalent
aka:
  - Isovalent Enterprise for Cilium
  - Isovalent Runtime Security
  - Tetragon
  - Cilium
  - Hubble
vendor: Cisco
category: workload
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - kubernetes
  - ebpf
  - runtime-security
