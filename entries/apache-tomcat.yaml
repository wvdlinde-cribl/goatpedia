id: apache-tomcat
name: Apache Tomcat
short: Tomcat
vendor: Apache Software Foundation
category: web
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Tomcat
  - Catalina
tags:
  - web-server
  - java
  - servlet-container
  - web
  - text
summary: An open-source Java servlet container and web server that runs Java web applications. It sits behind a load balancer or reverse proxy, or faces clients directly on its HTTP connector. Tomcat writes an access log of every request, the catalina log of server start-up, connectors and errors, and the localhost log of messages from deployed applications.
sourcetypes:
  - st: apache_tomcat_access
    desc: Access log written by the AccessLogValve, one line per HTTP request with client, user, request, status, bytes and timing
  - st: apache_tomcat_catalina
    desc: The catalina log of the server itself, such as start-up, connector and deployment messages and errors
  - st: apache_tomcat_localhost
    desc: The localhost log, messages logged by web applications and their listeners in the default host
facts:
  Product: Java servlet and JSP container with an HTTP connector
  Deployment: Java process on a server or container, often behind a reverse proxy or load balancer
  Log transport: Local files in the logs directory, read by a file agent
  Log format: Access log in a configurable pattern based on common log format. catalina and localhost logs use the JULI one-line format
  What an access line answers: Who requested which URL, as which user, and what status and size came back
  What a catalina line answers: Which server component reported what, at which level
placement:
  slots:
    - dmz
    - internal
  items:
    - slot: dmz
      title: Tomcat HTTP connector
      desc: Tomcat accepts HTTP requests on its connector, either directly from clients or from a proxy in front of it. The access log is written here.
    - slot: internal
      title: Web applications
      desc: The applications deployed in Tomcat, including the Manager and Host Manager apps, write to the localhost log.
howItWorks:
  - title: Connectors and valves
    body: A connector listens on a port and hands requests to the engine. The AccessLogValve writes one line per request in a pattern the administrator sets. This server's pattern adds the server address, response time and X-Forwarded-For to the common log format.
  - title: Server and application logs
    body: Tomcat logs through JULI. catalina.<date>.log holds server lifecycle messages (start, stop, connector bind failures). localhost.<date>.log holds messages from the default host's applications. Each line has a timestamp, a level such as INFO or SEVERE, the thread and the logging class.
  - title: Manager applications
    body: The Manager and Host Manager web apps let an authenticated user deploy and control applications. Requests to /manager and /host-manager in the access log are administrative access.
traffic:
  handles:
    - HTTP requests to Java web applications
    - Application deployment and lifecycle
    - Manager and Host Manager administration
  flow:
    - step: Request arrives
      desc: A client or proxy sends an HTTP request to the connector.
    - step: Tomcat serves it
      desc: The engine routes it to an application and the access log valve writes a line.
    - step: Components log
      desc: The server and applications write lifecycle messages and errors to catalina and localhost logs.
    - step: Agent reads
      desc: A file agent tails the log files.
logs:
  - type: Access log
    sourcetype: apache_tomcat_access
    format: text
    desc: One line per request. The fields are client address, user, time, request line, status, bytes, server address, response time, referer, user agent and X-Forwarded-For. This sample is admin requesting a Host Manager asset. Addresses are documentation addresses.
    sample: 198.51.100.25 - admin [02/Mar/2023:18:58:17 +0530] "POST /host-manager/images/asf-logo.svg HTTP/1.1" 200 20486 203.0.113.8 + 400 "http://localhost:8080/host-manager/html" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/203.0.113.40 Safari/537.36" X-Forwarded-For="192.0.2.10, 192.0.2.20"
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: Catalina log
    sourcetype: apache_tomcat_catalina
    format: text
    desc: One line per server message with time, level, thread, class and text. This sample is a SEVERE failure to initialise the HTTP connector on port 8080, usually the port already in use.
    sample: 06-Mar-2023 18:34:17.383 SEVERE [main] org.apache.catalina.util.LifecycleBase.handleSubClassException Failed to initialize component [Connector[HTTP/1.1-8080]]
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: Localhost log
    sourcetype: apache_tomcat_localhost
    format: text
    desc: One line per application message with time, level, thread, class and text. This sample is a context listener reporting an attribute added.
    sample: '23-Feb-2023 15:40:03.713 INFO [localhost-startStop-1] org.apache.catalina.core.ApplicationContext.log ContextListener: attributeAdded(''StockTicker'', ''async.Stockticker@57ca937b'')'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Manager application access
    severity: medium
    signals:
      - message
    why: The Manager and Host Manager apps can deploy code into Tomcat. Access to them from outside the admin network, or failed logins against them, is a common route to code execution.
    kql: |
      dataset="apache-tomcat_logs"
      | where sourcetype == "apache_tomcat_access" and (message has "/manager/" or message has "/host-manager/")
      | project _time, message
    mitre:
      - T1190
optimizations: []
references:
  - title: Apache Tomcat logging
    url: https://tomcat.apache.org/tomcat-9.0-doc/logging.html
  - title: Apache Tomcat valve configuration (AccessLogValve)
    url: https://tomcat.apache.org/tomcat-9.0-doc/config/valve.html
related:
  - tomcat
