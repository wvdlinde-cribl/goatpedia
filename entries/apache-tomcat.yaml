  - st: apache_tomcat_catalina
    desc: 'Elastic integrations fixture, 20 events. Upstream: apache_tomcat/data_stream/catalina/_dev/test/pipeline/test-catalina.log'
  - st: apache_tomcat_localhost
    desc: 'Elastic integrations fixture, 20 events. Upstream: apache_tomcat/data_stream/localhost/_dev/test/pipeline/test-localhost.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: apache_tomcat
  Sourcetypes: '3'
