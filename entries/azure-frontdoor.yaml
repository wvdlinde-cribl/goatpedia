  - st: azure_frontdoor_health_probe
    desc: 'Elastic integrations fixture, 3 events. Upstream: azure_frontdoor/data_stream/health_probe/_dev/test/pipeline/test-health-probe.log'
  - st: azure_frontdoor_waf
    desc: 'Elastic integrations fixture, 7 events. Upstream: azure_frontdoor/data_stream/waf/_dev/test/pipeline/test-fdwaf.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: azure_frontdoor
  Sourcetypes: '3'
  Fixture events: '18'
  Log format seen: json
  Fields in the first fixture: category, operationName, properties.ErrorInfo, properties.backendHostname, properties.cacheStatus, properties.clientIp
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Azure Frontdoor events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries category, operationName, properties.ErrorInfo, properties.backendHostname, properties.cacheStatus, properties.clientIp. Values in the sample were rewritten to documentation addresses.
