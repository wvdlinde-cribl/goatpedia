      - instanceName
      - threadID
      - requestID
      - correlationID
  - type: Ldap Access
    sourcetype: ping_directory_ldap_access
    format: kv
    desc: 15 fixture events in the samples pool (elastic).
    sample: '[25/May/2026:18:22:45.267 +0530] CONNECT instanceName="pingdirectory-elastic-test" threadID=198 conn=0 from="192.0.2.20" fromPort=44560 to="198.51.100.15" toPort=1636 protocol="LDAP+TLS" clientConnectionPolicy="default"'
    key:
      - instanceName
      - threadID
      - conn
      - from
