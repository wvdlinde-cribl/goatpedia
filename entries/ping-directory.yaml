    sourcetype: ping_directory_user
    format: json
    desc: 5 fixture events in the samples pool (elastic).
    sample: '{"displayName":"John Doe","emails":["user@example.com","user@example.com"],"name":{"familyName":"Doe","formatted":"John Doe","givenName":"John"},"title":"DevOps Engineer","userName":"john.doe","userType":"Full-Time","id":"c9bbce6c-7d77-4d93-b674-42b1e8a00606","meta":{"resourceType":"User","location":"https://198.51.100.25:2443/scim/v2/Users/c9bbce6c-7d77-4d93-b674-42b1e8a00606"},"schemas":["urn:ietf:params:scim:schemas:core:2.0:User"]}'
    key:
