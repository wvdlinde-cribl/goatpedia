# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: ping-directory
name: PingDirectory
short: PingDirectory
vendor: Ping Identity
category: idp
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Ping Directory Server
  - UnboundID Directory Server
tags:
  - ldap
  - directory
  - identity
  - scim
  - audit
summary: Ping Identity's LDAP directory server for large identity stores, with a REST and SCIM 2.0 interface. Applications bind and search over LDAP, and provisioning tools manage users and groups over SCIM. Its logs cover LDAP connections and operations, HTTP requests to its REST and SCIM endpoints, and the server audit log. User and group records describe the identities it holds.
sourcetypes:
  - st: ping_directory_audit
    desc: Server audit and error log lines, such as logger start-up and warnings from the directory server
  - st: ping_directory_group
    desc: Group entries read over SCIM, with display name and members
  - st: ping_directory_http_access
    desc: 'HTTP access log of the REST and SCIM interface: client, method, URL, headers, status and time'
  - st: ping_directory_ldap_access
    desc: 'LDAP access log: connections, binds, searches and other operations with client, connection id and result'
  - st: ping_directory_user
    desc: User entries read over SCIM, with user name, display name, emails, title and type
facts:
  Product: High-scale LDAP directory server with REST and SCIM 2.0 APIs
  Deployment: Self-managed servers or containers, usually replicated across data centres
  Log transport: Log publishers write files (access, audit, errors) and can send to syslog. SCIM endpoints are polled for user and group records
  Log format: Access logs are a bracketed timestamp, an operation type and key=value pairs. SCIM records are JSON
  What an LDAP access line answers: Which client connected or bound, on which connection, over which protocol, and with which result
  What an HTTP access line answers: Which client called which REST or SCIM URL, with which method, and the status code and elapsed time
  What a user or group record answers: Which identities and memberships the directory holds
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Directory servers
      desc: PingDirectory runs in the identity tier inside the data centre or cloud network. Applications, access managers and provisioning tools connect to it over LDAPS and HTTPS. Each server writes its own logs.
howItWorks:
  - title: LDAP operations
    body: Clients open a connection, bind, then search, add, modify or delete entries. The access logger writes a line for each connection and operation request and result, linked by conn and op ids.
  - title: REST and SCIM
    body: The HTTP connection handler serves the Directory REST API and SCIM 2.0. The HTTP access logger records each request with its headers, status and elapsed time.
  - title: Audit and errors
    body: The audit logger records changes to data, and the error logger records server events such as warnings and component start-up.
  - title: How the logs leave the product
    body: Log publishers write rotating files and can publish to syslog or JSON. A collector tails the files or receives syslog. Users and groups can be read from the SCIM endpoints.
traffic:
  handles:
    - LDAP and LDAPS
    - HTTPS REST and SCIM 2.0
    - Directory data changes
  flow:
    - step: Client connects
      desc: An application or provisioning tool connects over LDAP or HTTPS.
    - step: Server handles
      desc: PingDirectory authenticates the client and runs the operation.
    - step: Logger writes
      desc: The access, HTTP access, audit or error logger writes one line.
    - step: Collector reads
      desc: A collector tails the log files or receives syslog.
logs:
  - type: Server audit and errors
    sourcetype: ping_directory_audit
    format: text
    desc: One line per server event, with a bracketed timestamp, a severity and the message. This sample is the audit logger starting with severity SEVERE_WARNING.
    sample: '[26/May/2026:14:30:00.000 +0530] SEVERE_WARNING The File-Based Audit Logger has been started'
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: SCIM groups
    sourcetype: ping_directory_group
    format: json
    desc: One object per group. displayName is the group, members lists member DNs, and meta.resourceType and meta.location identify the SCIM resource. The sample uses documentation addresses.
    sample: '{"displayName":"security","members":["uid=alice.smith,ou=People,dc=example,dc=com"],"id":"a7631f14-c7eb-490f-8b94-724b78241e13","meta":{"resourceType":"Group","location":"https://192.0.2.20:2443/scim/v2/Groups/a7631f14-c7eb-490f-8b94-724b78241e13"},"schemas":["urn:ietf:params:scim:schemas:core:2.0:Group"]}'
    key:
      - displayName
      - members[0]
      - id
      - meta.resourceType
  - type: HTTP access
    sourcetype: ping_directory_http_access
    format: kv
    desc: One RESULT line per HTTP request. from is the client, method and url the request, requestHeader the headers, statusCode the status and etime the elapsed time. correlationID ties it to related lines. This sample is a redirect for the docs page. The sample uses documentation addresses.
    sample: '[25/May/2026:18:54:41.504 +0530] RESULT instanceName="pingdirectory-elastic-test" threadID=164 requestID=0 correlationID="ceb9fea0-0fed-4f01-8f5c-7dcc2149661a" from="198.51.100.15:55188" method="GET" url="https://198.51.100.25:2443/docs" requestHeader="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7" requestHeader="Connection: keep-alive" requestHeader="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/203.0.113.8 Safari/537.36" requestHeader="Sec-Fetch-Site: none" requestHeader="Sec-Fetch-Dest: document" requestHeader="Host: 203.0.113.40:2443" requestHeader="Accept-Encoding: gzip, deflate, br, zstd" requestHeader="Sec-Fetch-Mode: navigate" requestHeader="sec-ch-ua: ''Chromium'';v=''148'', ''Google Chrome'';v=''148'', ''Not/A)Brand'';v=''99''" requestHeader="sec-ch-ua-mobile: ?0" requestHeader="Cache-Control: max-age=0" requestHeader="Upgrade-Insecure-Requests: 1" requestHeader="sec-ch-ua-platform: ''Windows''" requestHeader="Sec-Fetch-User: ?1" requestHeader="Accept-Language: en-GB,en-US;q=0.9,en;q=0.8" statusCode=302 etime=18.465 responseContentLength=0 responseHeader="X-Frame-Options: SAMEORIGIN" responseHeader="Correlation-Id: ceb9fea0-0fed-4f01-8f5c-7dcc2149661a" responseHeader="Date: Mon, 25 May 2026 13:24:41 GMT" redirectURI="https://192.0.2.10:2443/docs/"'
    key:
      - instanceName
      - threadID
      - requestID
      - correlationID
  - type: LDAP access
    sourcetype: ping_directory_ldap_access
    format: kv
    desc: One line per LDAP connection or operation. The word after the timestamp is the operation type (CONNECT here). conn is the connection id, from and fromPort the client, to and toPort the listener, and protocol says LDAP or LDAP+TLS. The sample uses documentation addresses.
    sample: '[25/May/2026:18:22:45.267 +0530] CONNECT instanceName="pingdirectory-elastic-test" threadID=198 conn=0 from="192.0.2.20" fromPort=44560 to="198.51.100.15" toPort=1636 protocol="LDAP+TLS" clientConnectionPolicy="default"'
    key:
      - instanceName
      - threadID
      - conn
      - from
  - type: SCIM users
    sourcetype: ping_directory_user
    format: json
    desc: One object per user. userName and displayName identify the person, emails and name hold their details, and title and userType describe them. The sample uses documentation addresses.
    sample: '{"displayName":"John Doe","emails":["user@example.com","user@example.com"],"name":{"familyName":"Doe","formatted":"John Doe","givenName":"John"},"title":"DevOps Engineer","userName":"john.doe","userType":"Full-Time","id":"c9bbce6c-7d77-4d93-b674-42b1e8a00606","meta":{"resourceType":"User","location":"https://198.51.100.25:2443/scim/v2/Users/c9bbce6c-7d77-4d93-b674-42b1e8a00606"},"schemas":["urn:ietf:params:scim:schemas:core:2.0:User"]}'
    key:
      - displayName
      - emails[0]
      - emails[1]
      - name.familyName
cves: []
detections:
  - title: REST or SCIM request refused
    severity: medium
    signals:
      - statusCode
      - from
      - url
      - method
    why: A 401 or 403 from the directory API is a client failing authentication or authorisation. Bursts from one address against SCIM point at credential guessing or a misused provisioning account.
    kql: |
      dataset="ping-directory_logs"
      | where sourcetype == "ping_directory_http_access" and statusCode in (401, 403)
      | project from, method, url, statusCode, correlationID
    mitre:
      - T1110
optimizations: []
references: []
related:
  - pingfederate
  - ping-one
