id: sophos-xg
name: Sophos Firewall (XG / XGS)
short: Sophos XG
aka:
  - Sophos XG Firewall
  - Sophos XGS
  - SFOS
  - Sophos Firewall OS
  - Cyberoam (predecessor)
vendor: Sophos
category: ngfw
status: full
updated: "2026-11-12"
contributors:
