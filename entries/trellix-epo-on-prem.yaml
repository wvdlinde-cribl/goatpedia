facts:
  Where the sample comes from: Elastic integrations
  Integration package: trellix_epo_on_prem
  Sourcetypes: '8'
  Fixture events: '49'
  Log format seen: json
  Fields in the first fixture: OrionAuditLog.AutoId, OrionAuditLog.CmdName, OrionAuditLog.EndTime, OrionAuditLog.Message, OrionAuditLog.Priority, OrionAuditLog.StartTime
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Trellix Epo On Prem events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries OrionAuditLog.AutoId, OrionAuditLog.CmdName, OrionAuditLog.EndTime, OrionAuditLog.Message, OrionAuditLog.Priority, OrionAuditLog.StartTime. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads trellix_epo_on_prem and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
