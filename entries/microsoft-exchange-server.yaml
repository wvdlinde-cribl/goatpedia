summary: Microsoft Exchange Server is logged by the Elastic integrations package microsoft_exchange_server. The Pack Generator samples pool holds fixture events for 3 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: microsoft_exchange_server_imap4_pop3
    desc: 'Elastic integrations fixture, 6 events. Upstream: microsoft_exchange_server/data_stream/imap4_pop3/_dev/test/pipeline/test-imap4-pop3.json'
  - st: microsoft_exchange_server_messagetracking
    desc: 'Elastic integrations fixture, 7 events. Upstream: microsoft_exchange_server/data_stream/messagetracking/_dev/test/pipeline/test-messagetracking.log'
  - st: microsoft_exchange_server_smtp
    desc: 'Elastic integrations fixture, 7 events. Upstream: microsoft_exchange_server/data_stream/smtp/_dev/test/pipeline/test-smtp.json'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: microsoft_exchange_server
  Sourcetypes: '3'
  Fixture events: '20'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Microsoft Exchange Server events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Elastic integrations package reads microsoft_exchange_server and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as text.
