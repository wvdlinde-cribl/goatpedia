summary: Mysql Enterprise is logged by the Elastic integrations package mysql_enterprise. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: mysql_enterprise_audit
    desc: 'Elastic integrations fixture, 20 events. Upstream: mysql_enterprise/data_stream/audit/_dev/test/pipeline/test-mysql-audit.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: mysql_enterprise
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Mysql Enterprise events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Elastic integrations package reads mysql_enterprise and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text.
logs:
  - type: Audit
    sourcetype: mysql_enterprise_audit
    format: text
    desc: 20 fixture events in the samples pool (elastic).
    sample: '{ "timestamp": "2020-10-19 19:21:33", "id": 0, "class": "audit", "event": "startup", "connection_id": 0, "account": { "user": "skip-grants user", "host": "" }, "login": { "user": "", "os": "", "ip": "", "proxy": "" }, "startup_data": { "server_id": 1, "os_version": "x86_64-Linux", "mysql_version": "8.0.22-commercial", "args": ["/usr/local/mysql/bin/mysqld", "--loose-audit-log-format=JSON", "--log-error=log.err", "--pid-file=mysqld.pid", "--port=3306" ] } },'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Mysql Enterprise events arriving
    severity: low
    signals:
      - message
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "mysql_enterprise_audit"'
optimizations: []
references:
