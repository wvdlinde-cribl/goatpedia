summary: Google Secops is logged by the Elastic integrations package google_secops. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: google_secops_alert_v2
    desc: 'Elastic integrations fixture, 4 events. Upstream: google_secops/data_stream/alert_v2/_dev/test/pipeline/test-alert-v2.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: google_secops
  Sourcetypes: '1'
  Fixture events: '4'
  Log format seen: json
  Fields in the first fixture: createdTime, detection[0].alertState, detection[0].description, detection[0].detectionFields[0].key, detection[0].detectionFields[0].value, detection[0].outcomes[0].key
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Google Secops events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries createdTime, detection[0].alertState, detection[0].description, detection[0].detectionFields[0].key, detection[0].detectionFields[0].value, detection[0].outcomes[0].key. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads google_secops and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
