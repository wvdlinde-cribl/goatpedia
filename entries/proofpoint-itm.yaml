id: proofpoint-itm
name: Proofpoint Insider Threat Management
short: Proofpoint ITM
vendor: Proofpoint
category: email
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Proofpoint ITM
  - ObserveIT
tags:
  - insider-threat
  - user-activity-monitoring
  - dlp
  - endpoint
  - json
summary: Proofpoint's insider threat management product, formerly ObserveIT. Endpoint agents record what users do on their machines, which applications and windows they use, which sites they visit and which commands they run, and can capture session recordings for replay. Its activity and alert records tie each action to a user, an endpoint and a recorded session.
sourcetypes:
  - st: proofpoint_itm_report
    desc: 'User activity and alert records from ITM agents: application, window, site or command, with the user, endpoint and session'
facts:
  Product: 'Insider threat management: user activity monitoring, insider risk alerts and session recording'
  Clients: Agents on Windows, macOS and Linux endpoints and servers, managed from the ITM SaaS or on-premises console
  Log transport: HTTPS reporting API of the ITM console, polled by a collector
  Log format: One JSON object per activity or alert record
  What an activity record answers: Which user on which endpoint ran which application or command, or opened which site, and in which recorded session
placement:
  slots:
    - endpoint
    - cloud
  items:
    - slot: endpoint
      title: ITM agent
      desc: 'The agent runs on user workstations and servers. It observes the user session locally: applications, window titles, URLs and commands.'
    - slot: cloud
      title: ITM console
      desc: Agents send activity to the ITM console (SaaS or on-premises), which evaluates rules, stores recordings and serves the reporting API that a collector reads.
howItWorks:
  - title: User activity
    body: The agent records each change of application or window, visited sites and executed commands. Each record names the login, the endpoint and the session.
  - title: Rules and alerts
    body: Insider risk rules match activity, such as copying files to USB or running admin tools, and raise alerts with a risk value.
  - title: Session playback
    body: Activity is linked to a recorded session. playbackUrl and sessionUrl open the replay in the console.
  - title: How the records leave the product
    body: A collector calls the console reporting API for activity and alert records and stores each one.
traffic:
  handles:
    - User application and window activity
    - Web site access
    - Command execution
    - Insider risk alerts
  flow:
    - step: User works
      desc: A user opens an application, a site or runs a command on a monitored endpoint.
    - step: Agent records
      desc: The agent records the action and the session it belongs to.
    - step: Console evaluates
      desc: The console stores the activity and raises alerts on matching rules.
    - step: Collector pulls
      desc: A collector reads activity and alert records from the API.
logs:
  - type: Activity and alerts
    sourcetype: proofpoint_itm_report
    format: json
    desc: One object per record. loginName and domainName are the user, endpointName and host the machine, applicationName, windowTitle, accessedUrl and command what they did, and playbackUrl the session replay. The sample uses documentation addresses.
    sample: '{"_time":"2025-02-25T16:08:11Z","accessedSiteName":"Example Site","accessedUrl":"https://www.example.com","applicationName":"Windows Shell Experience Host","collectorId":"C2C1C429-C002-4FB8-99F4-7F1005ED9889","collectorUrl":"https://code1.preview.observeit.net/","command":"example_command","commandParams":"--example --params","createdAt":"2025-02-25T16:08:11Z","domainName":"code1.observeit.net","endpointId":"E035BBC2-1D72-4F25-9408-2BD807FB7B13","endpointName":"Example Endpoint","host":"host.example.com","id":"7330EB6D-A8BB-4F25-9408-2BD807FB7B13","loginName":"Administrator","observedAt":"2025-02-25T16:08:11Z","os":"Windows","playbackUrl":"https://code1.preview.observeit.net/ObserveIT/SlideViewer.aspx?SessionID=1A8B5249-EDAC-A8BB-4F25-9408-2BD807FB7B13","processExecutable":"shellexexperiencehost","remoteAddress":"192.0.2.10","remoteHostName":"Michaels-MacBoo","risingValue":"2018-06-06T17:43:18.446Z","secondaryDomainName":"n/a","secondaryLoginName":"n/a","sessionUrl":"https://session.example.com/abc123","timezoneOffset":"0","windowTitle":"Start","sessionId":"1A8B52A9-EDAC-448E-9871-79DB21D53C28","databaseName":"example_database","details":"Detailed description of the event."}'
    key:
      - _time
      - accessedSiteName
      - accessedUrl
      - applicationName
cves: []
detections: []
optimizations: []
references: []
