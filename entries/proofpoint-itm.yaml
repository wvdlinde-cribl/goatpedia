summary: Proofpoint Itm is logged by the Elastic integrations package proofpoint_itm. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: proofpoint_itm_report
    desc: 'Elastic integrations fixture, 1 events. Upstream: proofpoint_itm/data_stream/report/_dev/test/pipeline/test-alert.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: proofpoint_itm
  Sourcetypes: '1'
  Fixture events: '1'
  Log format seen: json
  Fields in the first fixture: _time, accessedSiteName, accessedUrl, applicationName, collectorId, collectorUrl
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Proofpoint Itm events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries _time, accessedSiteName, accessedUrl, applicationName, collectorId, collectorUrl. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads proofpoint_itm and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
