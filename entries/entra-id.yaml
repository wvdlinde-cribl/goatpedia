id: entra-id
name: Microsoft Entra ID (Azure AD)
short: Entra ID
aka:
  - Azure Active Directory
  - Azure AD
  - AAD
  - Microsoft Entra
  - Entra ID Protection
vendor: Microsoft
category: idp
status: full
updated: "2026-11-12"
