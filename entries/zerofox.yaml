      - logs[0].actor
cves: []
detections:
  - title: Zerofox events arriving
    severity: low
    signals:
      - alert_type
      - logs[0].id
      - logs[0].timestamp
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "zerofox_alerts"'
optimizations: []
references:
