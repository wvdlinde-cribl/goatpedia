    key:
      - DeploymentVersion
      - Level
      - Sku
      - callerIpAddress
cves: []
detections:
  - title: Failed model calls
    severity: low
    signals:
      - isRequestSuccess
      - properties.responseCode
      - callerIpAddress
    why: Bursts of failed calls from one caller can mean a stolen key being tried, quota abuse or blocked content.
    kql: |
      dataset="azure-ai-foundry_logs"
      | where sourcetype == "azure_ai_foundry" and isRequestSuccess == false
      | project time, callerIpAddress, properties.operationId, properties.responseCode, properties.url
optimizations: []
references:
  - title: Azure AI Foundry documentation
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/
  - title: Azure API Management documentation
    url: https://learn.microsoft.com/en-us/azure/api-management/
