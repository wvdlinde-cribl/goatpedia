summary: Microsoft's platform for building AI applications on Azure, with access to Azure OpenAI and other models, deployments, agents and evaluations. Many organisations put Azure API Management in front of the model endpoints as an AI gateway to control access, quotas and logging. The gateway logs record each model call that passes through, with the caller, the API operation, timing, status and optionally the request and response bodies.
sourcetypes:
  - st: azure_ai_foundry
    desc: API Management gateway logs for AI Foundry model calls, with caller IP, operation, backend URL, status, timing and request and response bodies
facts:
  Product: Azure platform for model access, deployment and AI application development
  Gateway: Azure API Management in front of model endpoints, logging each call
  Log transport: Diagnostic settings send GatewayLogs to Event Hubs, a Log Analytics workspace or storage
  Log format: Azure diagnostic JSON with category GatewayLogs and request details in properties
  What a gateway log answers: Who called which model operation, what was sent and returned, how long it took and whether it succeeded
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: API Management gateway and AI Foundry
      desc: Applications call the API Management gateway, which forwards to the AI Foundry or Azure OpenAI deployment. The gateway's diagnostic logs go where its diagnostic setting points.
howItWorks:
  - title: Models behind a gateway
    body: Model deployments in AI Foundry expose REST endpoints such as chat completions. API Management publishes them as an API, checks keys or tokens, applies rate and token limits and forwards the call to the backend.
  - title: Gateway logs
    body: Each call becomes a GatewayLogs record with callerIpAddress, the API and operation id, client and backend method and URL, response codes, durations and, when body logging is on, the request and response bodies. Azure OpenAI responses include content filter results.
  - title: How the logs leave Azure
    body: A diagnostic setting on the API Management instance sends GatewayLogs to an Event Hub or workspace. Any collector that reads them can consume the records.
traffic:
  handles:
    - Chat completion and other model API calls
    - Content filtering results on prompts and answers
  flow:
    - step: Application calls
      desc: An application sends a prompt to the API Management endpoint.
    - step: Gateway forwards
      desc: API Management authenticates the call and forwards it to the model deployment.
    - step: Gateway logs
      desc: API Management writes a GatewayLogs record, routed by its diagnostic setting.
logs:
  - type: AI gateway logs
    sourcetype: azure_ai_foundry
    format: json
    desc: One record per model call through the gateway. callerIpAddress is the client, properties.operationId the call (ChatCompletions_Create here), properties.responseCode and isRequestSuccess the result, properties.requestBody and responseBody the prompt and answer with content filter results. The caller is a documentation address.
