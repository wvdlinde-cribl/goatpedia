summary: Atlassian Jira is logged by the Elastic integrations package atlassian_jira. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: atlassian_jira_audit
    desc: 'Elastic integrations fixture, 20 events. Upstream: atlassian_jira/data_stream/audit/_dev/test/pipeline/test-audit-api.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: atlassian_jira
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: json
  Fields in the first fixture: affectedObjects, author.avatarUri, author.id, author.name, author.type, author.uri
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Atlassian Jira events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries affectedObjects, author.avatarUri, author.id, author.name, author.type, author.uri. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads atlassian_jira and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
logs:
  - type: Audit
    sourcetype: atlassian_jira_audit
    format: json
    desc: 20 fixture events in the samples pool (elastic).
    sample: '{"affectedObjects":[],"author":{"avatarUri":"","id":"18166","name":"max.mustermann","type":"ApplicationUser","uri":"https://jira.example.com/jira/secure/ViewProfile.jspa?name=max.mustermann"},"changedValues":[],"extraAttributes":[{"name":"JQLquery","nameI18nKey":"issuenav.jqlsearch.query","value":"project=\"TEST\"ANDresolution=UnresolvedORDERBYpriorityDESC,updatedDESC"},{"name":"Loadbalancer/proxyIPaddress","nameI18nKey":"atlassian.audit.event.attribute.forwarder","value":"192.0.2.20"}],"method":"Browser","node":"my-jira-node","source":"198.51.100.15,198.51.100.25","system":"https://jira.example.com/jira","timestamp":"2025-02-25T08:03:35.815Z","type":{"action":"JQLsearchperformed","actionI18nKey":"issuenav.jqlsearch.performed","category":"search","categoryI18nKey":"jira.auditing.category.search"}}'
    key:
      - affectedObjects
      - author.avatarUri
      - author.id
      - author.name
cves: []
detections:
  - title: Atlassian Jira events arriving
    severity: low
    signals:
      - affectedObjects
      - author.avatarUri
      - author.id
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "atlassian_jira_audit"'
optimizations: []
references:
