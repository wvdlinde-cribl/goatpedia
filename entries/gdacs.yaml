aka:
  - Global Disaster Alert and Coordination System
tags:
  - disaster
  - alerts
  - geojson
summary: GDACS is the Global Disaster Alert and Coordination System, run by the European Commission Joint Research Centre with United Nations partners. It publishes an alert when an earthquake, flood, cyclone or similar event may need international humanitarian coordination. Each alert is a GeoJSON feature with a place, a severity and a green, orange or red level. Any collector can pull the public feed.
sourcetypes:
  - st: gdacs
    desc: One GDACS disaster alert as a GeoJSON feature. The geometry is the place. The properties carry the event type, the alert level and the severity.
facts:
  Product: Public disaster-alert feed for earthquakes, floods, cyclones and similar events
  Who runs it: European Commission Joint Research Centre, with United Nations partners
  Log transport: HTTPS. The public API returns GeoJSON features.
  Log format: One GeoJSON Feature per event. geometry is the point or area. properties holds the alert.
  What an alert answers: What happened, where, how severe it is, and whether GDACS coloured it green, orange or red
  What alertlevel answers: Green is a small event. Orange and red are the alerts GDACS expects responders to look at.
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: GDACS feed
      desc: The alerts are published on gdacs.org. There is no appliance to deploy. A collector requests the GeoJSON and can forward each feature anywhere.
howItWorks:
  - title: One alert
    body: type Feature wraps a geometry and properties. eventtype is the kind of disaster, such as EQ for an earthquake. eventid and episodeid identify the event and this update of it. alertlevel and alertscore are the GDACS colour. severitydata is the measurement, such as a magnitude and a depth. country and iso3 are the place. fromdate is when the event happened.
  - title: The sample
    body: This feature is a green earthquake in the Solomon Islands, magnitude 4.6, sourced from NEIC. iscurrent false means it is not the live episode. url.report is the human-readable report on gdacs.org.
  - title: How a collector gets it
    body: GDACS publishes the features over HTTPS. A collector polls the feed and stores one feature per event. The feed is public. Nothing in it is tied to one destination.
traffic:
  handles:
    - Earthquake, flood and cyclone alerts
    - Alert level and severity
    - Location of the event
  flow:
    - step: A disaster is reported
      desc: A source such as NEIC reports an earthquake or another hazard.
    - step: GDACS scores it
      desc: GDACS assigns an alert level and publishes a GeoJSON feature with the place and the severity.
    - step: Collector polls
      desc: A collector fetches the feature and can forward it anywhere.
logs:
  - type: Disaster alert
    sourcetype: gdacs
    format: json
    desc: One GeoJSON feature. properties.eventtype is the hazard, alertlevel is the colour, and severitydata is the measurement. geometry is the place. This sample is a green magnitude-4.6 earthquake.
    sample: '{"type":"Feature","bbox":[162.4478,-10.5397],"geometry":{"type":"Point","coordinates":[162.4478,-10.5397]},"properties":{"eventtype":"EQ","eventid":1476137,"episodeid":1632460,"eventname":"","glide":"","name":"Earthquake in Solomon Islands","description":"Earthquake in Solomon Islands","htmldescription":"Green M 4.6 Earthquake in Solomon Islands at: 06 Apr 2025 22:00:23.","icon":"https://www.gdacs.org/images/gdacs_icons/maps/Green/EQ.png","iconoverall":"https://www.gdacs.org/images/gdacs_icons/maps/Green/EQ.png","url":{"geometry":"https://www.gdacs.org/gdacsapi/api/polygons/getgeometry?eventtype=EQ&eventid=1476137&episodeid=1632460","report":"https://www.gdacs.org/report.aspx?eventid=1476137&episodeid=1632460&eventtype=EQ","details":"https://www.gdacs.org/gdacsapi/api/events/geteventdata?eventtype=EQ&eventid=1476137"},"alertlevel":"Green","alertscore":1,"episodealertlevel":"Green","episodealertscore":0,"istemporary":"false","iscurrent":"false","country":"Solomon Islands","fromdate":"2025-04-06T22:00:23","todate":"2025-04-06T22:00:23","datemodified":"2025-04-07T01:52:47","iso3":"SLB","source":"NEIC","sourceid":"us6000q4fn","polygonlabel":"Centroid","Class":"Point_Centroid","affectedcountries":[{"iso2":"SB","iso3":"SLB","countryname":"Solomon Is."}],"severitydata":{"severity":4.6,"severitytext":"Magnitude 4.6M, Depth:50.911km","severityunit":"M"}},"polygon_geometry":{"type":"Polygon","coordinates":[[[163.364,-10.54],[163.362,-10.477]]]},"polygon_class":"Poly_Circle","polygon_label":"100km"}'
    key:
      - type
      - bbox[0]
      - bbox[1]
      - geometry.type
