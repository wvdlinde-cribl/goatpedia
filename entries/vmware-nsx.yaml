id: vmware-nsx
name: VMware NSX
short: NSX
aka:
  - NSX-T Data Center
  - NSX Data Center for vSphere (NSX-V)
  - vDefend Distributed Firewall
  - vDefend Gateway Firewall
  - Nicira NVP
vendor: Broadcom (VMware)
category: ngfw
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - firewall
