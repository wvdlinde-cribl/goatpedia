id: tychon
name: TYCHON
short: TYCHON
vendor: TYCHON
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - TYCHON Enterprise
  - TYCHON Agentless
tags:
  - endpoint
  - compliance
  - stig
  - json
summary: TYCHON collects a master record of each endpoint. It inventories hardware, software, certificates and network state, and it reports CVE matches, STIG benchmarks and endpoint-protection posture. The collection runs from scripts on the host, including an agentless mode that does not install a new service. Nineteen JSON streams are those datasets. A collector receives the JSON. Any collector the operator points the export at can do this.
sourcetypes:
  - st: tychon_arp
    desc: One ARP neighbor a host observed, with the remote address and MAC
  - st: tychon_browser
    desc: One browser-configuration result on a host
  - st: tychon_ciphers
    desc: One cipher observation. The sample ties a listening connection to a signed executable
  - st: tychon_cmrs
    desc: One asset-output record. The sample marks output_type as asset
  - st: tychon_coams
    desc: One organizational attribute attached to a host, with its name and path
  - st: tychon_cpu
    desc: One CPU inventory record for a host
  - st: tychon_cve
    desc: One CVE a host matched, with the script that ran the scan
  - st: tychon_epp
    desc: Endpoint-protection posture on a host, including whether malware protection is set to prevent
  - st: tychon_exposedservice
    desc: One listening service, with the process and the transport
  - st: tychon_externaldevicecontrol
    desc: One external-device policy result, and whether applying it succeeded
  - st: tychon_features
    desc: One Windows feature or optional component installed on the host
  - st: tychon_harddrive
    desc: One physical disk, including whether it is the boot disk
  - st: tychon_hardware
    desc: One hardware device enumerated on the host
  - st: tychon_host
    desc: One host posture record, including Device Guard and secure boot
  - st: tychon_networkadapter
    desc: One network adapter, with its address, driver and link state
  - st: tychon_softwareinventory
    desc: One installed package on the host
  - st: tychon_stig
    desc: One STIG benchmark identified on the host
  - st: tychon_systemcerts
    desc: One certificate file, and whether it is expired or weak
  - st: tychon_volume
    desc: One volume inventory record, with the script that collected it
facts:
  Product: Endpoint readiness and compliance. Enterprise and agentless editions collect a master endpoint record, including CVE, STIG and protection status
  Where it runs: Scripts or an agent on the endpoint. Results are exported as JSON for whatever collector the operator uses
  Log transport: JSON documents per dataset. The sample scripts are PowerShell (Invoke-CveScan.ps1, Get-TychonVolumeInfo.ps1)
  Log format: One JSON object per observation. Almost every object also carries host.hostname, host.biossn and host.ip so the row can be tied to a machine
  What a CVE row answers: Which CVE id the host matched, and which scan script produced the row
  What a certificate row answers: Whether the certificate file is expired, expiring soon, or weak
  What an exposed-service row answers: Which process is listening, on which transport
  What the inventory rows answer: CPU, disk, volume, adapter, hardware, features, software and ARP neighbors of that same host
placement:
  slots:
    - endpoint
    - internal
  items:
    - slot: endpoint
      title: Scanned host
      desc: The scripts run on the workstation or server. host.hostname, host.biossn and host.ip identify it. Addresses in the samples are documentation addresses. The host is where the CVE, the certificate and the listening port actually are.
    - slot: internal
      title: Collection point
      desc: Agentless collection is aimed at an existing internal stack the operator already runs. TYCHON does not require that stack to be a particular product. The JSON is the same either way.
howItWorks:
  - title: One host, many datasets
    body: Each stream is a different question about the same computer. The host block (hostname, BIOS serial, OS, IP) is repeated so a row stands alone. host.id is TYCHON's id for that computer. script.name, when present, is the scanner that produced the row. The CVE sample was produced by Invoke-CveScan.ps1. The volume sample was produced by Get-TychonVolumeInfo.ps1.
  - title: Findings versus inventory
    body: CVE, STIG, certificates, exposed services, endpoint-protection posture and external-device policy are the security and compliance results. ARP, CPU, disk, volume, adapter, hardware, features, software and the host record are inventory. A certificate row sets certificate.is_expired, certificate.is_weak and certificate.is_expiring_soon. The sample certificate is expired, expiring soon and weak. An exposed-service row names network.transport and process.executable. The sample is tcp and services.exe. Endpoint-protection posture uses the fields elastic.service.endpoint.malware, behavior_protection and memory_protection. In the sample all three are prevent. Those fields are the endpoint agent TYCHON recorded on the host.
  - title: Organizational attributes
    body: Two streams carry organization context rather than a technical finding. The COAMS sample is host.attribute.name and host.attribute.path, an organizational attribute on the computer, and host.attribute.cmrs points at a DISA address in the sample. The CMRS sample is a thin asset record whose output_type is asset and whose other fields are empty. This article does not expand those two names beyond what the fields show.
  - title: How the JSON is produced
    body: A scan writes one JSON object per observation. A collector receives that object. Any collector can be the receiver. Goatpedia reads these samples as JSON.
traffic:
  handles:
    - CVE matches and STIG benchmark identities
    - Certificate, listening-service and endpoint-protection posture
    - Hardware, software and network inventory of the same host
  flow:
    - step: A script scans the host
      desc: TYCHON runs a scan for one dataset, such as CVEs, certificates or the disk inventory.
    - step: One JSON object is written
      desc: The object carries the finding or the inventory fields plus the host identity.
    - step: A collector receives it
      desc: The object is forwarded as JSON. Inventory datasets repeat on each scan and are the bulk of the volume.
