facts:
  Where the sample comes from: Elastic integrations
  Integration package: tychon
  Sourcetypes: '19'
  Fixture events: '20'
  Log format seen: json
  Fields in the first fixture: destination.hostname, destination.ip, destination.mac, destination.name, host.biossn, host.cloud.hosted
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Tychon events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries destination.hostname, destination.ip, destination.mac, destination.name, host.biossn, host.cloud.hosted. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads tychon and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
