cves: []
detections:
  - title: Certificate is expired or weak
    severity: medium
    signals:
      - certificate.is_expired
      - certificate.is_weak
      - file.path
      - host.hostname
    why: An expired or weak certificate on a host is a credential the scan found past its date or below the strength bar. The sample certificate is both. Inventory of CPUs and disks does not answer that question.
    kql: |
      dataset="tychon_logs"
      | where sourcetype == "tychon_systemcerts" and (certificate.is_expired == "true" or certificate.is_weak == "true")
      | project file.path, file.name, certificate.is_expired, certificate.is_weak, certificate.is_expiring_soon, host.hostname
  - title: External-device policy did not succeed
    severity: medium
    signals:
      - policy.execution.action
      - policy.execution.changed
      - host.hostname
    why: policy.execution.action other than success means the device-control policy did not apply. The sample action is success, which is the ordinary case. A failed apply is the row worth an alert.
    kql: |
      dataset="tychon_logs"
      | where sourcetype == "tychon_externaldevicecontrol" and policy.execution.action != "success"
      | project script.start, policy.execution.action, policy.execution.changed, host.hostname, type
optimizations:
  - title: Sample hardware inventory
    saving: most of the inventory volume
    fn: Drop
    how: CPU, disk, volume, adapter, hardware, feature and software rows repeat for every host on every scan, and they are most of the volume. CVE matches, expired certificates, listening services and failed device-control results are the security-relevant subset. Drop or sample the inventory streams before the SIEM.
    expr: "sourcetype == 'tychon_cpu' || sourcetype == 'tychon_harddrive' || sourcetype == 'tychon_volume' || sourcetype == 'tychon_networkadapter' || sourcetype == 'tychon_hardware' || sourcetype == 'tychon_features' || sourcetype == 'tychon_softwareinventory'"
    stream:
      log: CPU
      functions:
        - id: drop
          filter: (typeof sourcetype !== 'undefined' && /^tychon_(cpu|harddrive|volume|networkadapter|hardware|features|softwareinventory)$/.test(sourcetype)) || __e['host.cpu.clockspeed'] !== undefined || __e['disk.id'] !== undefined || __e['host.adapter.id'] !== undefined || __e['device.id'] !== undefined || __e['host.os.feature.name'] !== undefined || __e['package.cpe'] !== undefined || __e['script.name'] == 'Get-TychonVolumeInfo.ps1'
          description: Drop repetitive hardware and software inventory rows (CPU, disk, volume, adapter, device, feature, software) before the SIEM; CVE, certificate, listening service and policy events pass
          conf: {}
      expect:
        out: 0
        smaller: true
references:
  - title: TYCHON Enterprise
    url: https://tychon.io/products/tychon/
  - title: TYCHON Agentless
    url: https://tychon.io/products/tychon-agentless/
