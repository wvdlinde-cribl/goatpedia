summary: Zerofox Cloud Platform is logged by the Datadog integrations-core package zerofox_cloud_platform. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: zerofox_cloud_platform
    desc: 'Datadog integrations-core fixture, 2 events. Upstream: zerofox_cloud_platform/assets/logs/zerofox-cloud-platform_tests.yaml'
facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: zerofox_cloud_platform
  Sourcetypes: '1'
  Fixture events: '2'
  Log format seen: json
  Fields in the first fixture: severity, notes, rule_name, perpetrator.name, perpetrator.id, perpetrator.display_name
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Zerofox Cloud Platform events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries severity, notes, rule_name, perpetrator.name, perpetrator.id, perpetrator.display_name. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads zerofox_cloud_platform and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
