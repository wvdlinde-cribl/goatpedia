cves:
  - id: CVE-2026-33825
    cvss: 7.8
    year: 2026
    kev: true
    scope: device
    title: Microsoft Defender Antimalware Platform local privilege escalation (insufficient access-control granularity) — used in ransomware campaigns (CNA score)
    affected: Microsoft Defender Antimalware Platform before 4.18.26030.3011
    fixed: Antimalware Platform 4.18.26030.3011 (delivered via Defender platform updates)
    detect: "DeviceInfo / Defender AV 'Product Version' (event 1116/2000) below 4.18.26030.3011. Hunt for a standard user process spawning a SYSTEM-integrity child shortly after touching Defender's ProgramData folders (DeviceProcessEvents ProcessIntegrityLevel=System with a Medium-integrity initiator)."
    avoid: Let platform updates auto-install (do not pin platform versions); enable tamper protection; alert on platform version drift.
  - id: CVE-2026-41091
    cvss: 7.8
    year: 2026
    kev: true
    scope: device
    title: Microsoft Malware Protection Engine link-following local privilege escalation (CNA score)
    affected: Microsoft Malware Protection Engine before 1.1.26040.8
    fixed: Engine 1.1.26040.8 (security intelligence / engine update)
    detect: Engine version in Defender Operational event 2000/2002 below 1.1.26040.8; DeviceFileEvents creating junctions or symbolic links in temp / quarantine paths immediately before a scan.
    avoid: Ensure engine updates flow (WSUS/Intune/MECM rings not stalled); monitor engine version per device.
  - id: CVE-2026-45498
    cvss: 7.5
    year: 2026
    kev: true
    scope: device
    title: Microsoft Defender Antimalware Platform denial of service (NVD 7.5; Microsoft scores 4.0)
    affected: Microsoft Defender Antimalware Platform before 4.18.26040.7
    fixed: Antimalware Platform 4.18.26040.7
    detect: Defender Operational 5001 / 5010 / 5012 (real-time protection or scanning disabled) or the MsMpEng service stopping, followed by a gap in DeviceEvents for the device.
    avoid: Update the platform; tamper protection on; alert on any device whose Device* streams go quiet while it is online.
  - id: CVE-2021-1647
    cvss: 7.8
    year: 2021
    kev: true
    scope: device
    title: Microsoft Defender (Malware Protection Engine) remote code execution — exploited as a zero-day in January 2021
    affected: Windows Defender, Microsoft Security Essentials, System Center Endpoint Protection with a Malware Protection Engine before the January 2021 update
    detect: Engine version below the January 2021 release; MsMpEng.exe spawning child processes or crashing (Application Error for MsMpEng) after scanning a downloaded file.
    avoid: Verify engine auto-updates; isolate devices whose engine is stale.
  - id: CVE-2024-21412
    cvss: 8.1
    year: 2024
    kev: true
    scope: traffic
    title: Windows Internet Shortcut (.url) SmartScreen / Mark-of-the-Web bypass — used by Water Hydra / DarkGate to deliver payloads (CNA score)
    affected: Windows 10, 11 and Server 2019/2022 before the February 2024 update
    fixed: Microsoft February 2024 security updates
    detect: DeviceFileEvents creating .url files in Downloads/Temp followed by DeviceProcessEvents from explorer.exe launching content from a WebDAV/SMB path (\\host@SSL\…); DeviceNetworkEvents to external WebDAV on 443/80.
    avoid: Patch; keep SmartScreen and ASR rule "Block executable content from email client and webmail" on; block outbound WebDAV.
detections:
  - title: Office application spawning a script interpreter
    severity: high
    signals:
      - category=AdvancedHunting-DeviceProcessEvents
      - InitiatingProcessFileName in WINWORD/EXCEL/OUTLOOK
      - FileName in powershell/cmd/wscript/mshta
    why: Macro- or exploit-driven initial access. Also the behaviour that ASR rule "Block all Office applications from creating child processes" stops — if you see it, the rule is in audit mode or excluded.
    kql: |-
      dataset="mde_logs" category="AdvancedHunting-DeviceProcessEvents"
      | where properties.InitiatingProcessFileName in~ ("WINWORD.EXE","EXCEL.EXE","POWERPNT.EXE","OUTLOOK.EXE")
      | where properties.FileName in~ ("powershell.exe","pwsh.exe","cmd.exe","wscript.exe","cscript.exe","mshta.exe","rundll32.exe")
      | summarize count(), cmds=make_set(properties.ProcessCommandLine, 5) by properties.DeviceName, properties.AccountName, properties.InitiatingProcessFileName
    mitre:
      - T1566.001
      - T1204.002
      - T1059.001
  - title: Encoded PowerShell followed by an outbound connection
    severity: high
    signals:
      - DeviceProcessEvents ProcessCommandLine has -enc
      - DeviceNetworkEvents from powershell.exe to a public IP
    why: Download cradles decode a payload and immediately call out; the pair is far more specific than either signal alone.
    kql: |-
      dataset="mde_logs" category="AdvancedHunting-DeviceNetworkEvents"
      | where properties.InitiatingProcessFileName in~ ("powershell.exe","pwsh.exe") and properties.RemoteIPType == "Public"
      | where properties.InitiatingProcessCommandLine matches regex @"(?i)\s-(e|en|enc|encodedcommand)\s"
      | summarize conns=count(), urls=make_set(properties.RemoteUrl, 10) by properties.DeviceName, properties.RemoteIP
    mitre:
      - T1059.001
      - T1027.010
      - T1105
  - title: Defender Antivirus turned off or tampered with
    severity: critical
    signals:
      - windows_defender EventID 5001 / 5010 / 5012
      - Set-MpPreference -DisableRealtimeMonitoring in a command line
    why: Disabling AV is a standard pre-ransomware step, and the 2026 Defender CVEs aim at the same outcome. Should be near zero with tamper protection on.
    kql: |-
      dataset="windows_defender" EventID in ("5001","5010","5012")
      | summarize count(), first=min(_time) by Computer, EventID
    mitre:
      - T1562.001
  - title: Malware detected but not remediated
    severity: high
    signals:
      - EventID=1116 without a matching 1117 success
      - Action Name = Not Applicable / Allow
    why: A detection that was only reported (exclusion, audit mode or failed remediation) leaves the payload on disk.
    kql: |-
      dataset="windows_defender" EventID in ("1116","1117")
      | summarize events=make_set(EventID), action=any(["Action Name"]) by Computer, ["Threat Name"], Path
      | where not(set_has_element(events, "1117")) or action in ("Not Applicable","Allow")
    mitre:
      - T1204.002
  - title: High-severity alert on a device with credential-access techniques
    severity: critical
    signals:
      - ms_defender_atp_alerts severity=High
      - mitreTechniques contains T1003
    why: LSASS dumping or SAM access precedes lateral movement with harvested credentials; prioritise isolating the device.
    kql: |-
      dataset="mde_alerts" severity in ("High","Critical")
      | where mitreTechniques has "T1003" or category == "CredentialAccess"
      | summarize count(), titles=make_set(title) by computerDnsName, relatedUser.userName, status
    mitre:
      - T1003.001
      - T1078
optimizations:
  - title: Unroll Event Hub records and fix _time
    saving: Correctness (prevents bad timestamps and oversized events)
    fn: Unroll + Eval
    how: Each Event Hub message is a records[] batch. Unroll it, set _time from properties.Timestamp (or record time), and drop the original records array — otherwise the SIEM sees one huge event per batch with a single timestamp.
    expr: "unroll records → __r; _time = Date.parse(__r.properties.Timestamp)/1000; remove: records"
  - title: Drop null, empty and version-info columns
    saving: 30–50 %
    fn: Eval (remove fields)
    how: Advanced Hunting rows serialise every column, mostly null. Remove nulls/empty strings plus *VersionInfo*, AppGuardContainerId and duplicate hash columns (SHA256 is usually null; MD5 redundant with SHA1).
    expr: "remove: properties.*VersionInfo*, properties.AppGuardContainerId, operationName; drop null/empty"
  - title: Reduce DeviceNetworkEvents
    saving: 20–40 %
    fn: Drop + Aggregations
    how: ListeningConnectionCreated and connections from well-known update/telemetry processes to Microsoft ranges are rarely searched. Drop them or aggregate per device/process/remote IP per minute; keep ConnectionSuccess to public IPs raw.
    expr: category=='AdvancedHunting-DeviceNetworkEvents' && (properties.ActionType=='ListeningConnectionCreated' || properties.RemoteIPType!='Public')
  - title: Route by table
    saving: SIEM licence
    fn: Routes
    how: Alerts, incidents, DeviceEvents (ASR/AV/tamper), DeviceLogonEvents and DeviceProcessEvents → SIEM. DeviceNetworkEvents, DeviceFileEvents, DeviceImageLoadEvents → Cribl Lake raw + SIEM optimised. Advanced Hunting keeps only 30 days; the lake is your long-term copy.
    expr: "category in (AlertInfo, AlertEvidence, DeviceEvents, DeviceProcessEvents) → SIEM  |  else → Lake + SIEM(optimised)"
