summary: Microsoft's EDR, built into Windows 10/11 and Server (sensor "Sense" + Defender Antivirus) and available for macOS, Linux and mobile. Telemetry lands in the Defender XDR Advanced Hunting tables (DeviceProcessEvents, DeviceNetworkEvents …); outside Microsoft it is exported through the Streaming API to Azure Event Hubs or Storage, while alerts and incidents come from the Defender REST/Graph APIs.
sourcetypes:
  - st: ms:defender:advancedhunting
    desc: Advanced Hunting events (any Device* table) collected by the Splunk Microsoft Defender add-on
  - st: ms_defender_atp_alerts
    desc: Defender for Endpoint alerts from the /api/alerts REST endpoint (ms:defender:atp:alerts)
  - st: ms365_defender_incident_alerts
    desc: Defender XDR incident + correlated alerts from the incidents API (ms365:defender:incident:alerts)
  - st: mscs_azure_eventhub_defender_advancedhunting
    desc: Streaming API records read from Azure Event Hub (mscs:azure:eventhub:defender:advancedhunting)
  - st: windows_defender
    desc: Microsoft-Windows-Windows Defender/Operational event log (Defender Antivirus 1116/1117/5001 …)
  - st: ms:defender:atp:alerts
    desc: Splunk add-on name for MDE alerts
  - st: mscs:azure:eventhub:defender:advancedhunting
    desc: Splunk Microsoft Cloud Services add-on name for Defender Event Hub data
  - st: DeviceProcessEvents
    desc: Microsoft Sentinel / Defender XDR table name (also DeviceNetworkEvents, DeviceFileEvents …)
facts:
  First released: 2016 (Windows Defender ATP); renamed Defender for Endpoint 2020
  Platform: Windows 10/11, Windows Server 2012 R2+, macOS, Linux, iOS, Android
  Delivery model: SaaS (Defender XDR portal) + built-in Windows sensor (Sense) / agent on macOS & Linux
  Licensing: Plan 1 (prevention), Plan 2 (EDR + Advanced Hunting), Defender for Business
  Telemetry export: Streaming API → Azure Event Hubs or Azure Storage; Sentinel Defender XDR connector
  Alert export: Defender for Endpoint /api/alerts, Graph security API (alerts_v2, incidents)
  Log format: JSON (Event Hub "records" array, one Advanced Hunting row per record); Windows Event Log XML for Defender AV
  Retention: 30 days in Advanced Hunting (longer only via Sentinel / export)
  Typical volume: 5–50 MB per device per day across Device* tables (DeviceNetworkEvents and DeviceEvents largest)
  Cribl Pack: Microsoft Defender for Endpoint (Event Hub) pack, Packs Dispensary (2026)
placement:
  slots:
    - endpoint
    - cloud
    - internal
  items:
    - slot: endpoint
      title: Built into Windows
      desc: The Sense service and Defender Antivirus ship with Windows; onboarding just enables them. On macOS/Linux a separate agent (mdatp) is installed. Devices report over HTTPS to the regional Defender cloud.
    - slot: cloud
      title: Defender XDR cloud and Advanced Hunting
      desc: Detection, investigation and the Advanced Hunting tables live in Microsoft's cloud. Everything leaves via the Streaming API to an Azure Event Hub or Storage account that a collector (Cribl Stream Azure Event Hubs Source, Splunk add-on) reads.
    - slot: internal
      title: Servers and domain controllers
      desc: Defender for Servers (via Defender for Cloud) onboards Windows and Linux servers; Defender for Identity sensors on DCs feed the Identity* tables of the same XDR.
howItWorks:
  - title: Sensor (Sense) and Defender Antivirus
    body: Sense collects process, network, file, registry, logon and image-load events from kernel callbacks and ETW. Defender Antivirus scans files, scripts (AMSI) and memory and enforces Attack Surface Reduction (ASR) rules; its verdicts are both local event-log entries and DeviceEvents rows.
  - title: Advanced Hunting schema
    body: "Telemetry is normalised into tables: DeviceProcessEvents, DeviceNetworkEvents, DeviceFileEvents, DeviceRegistryEvents, DeviceLogonEvents, DeviceImageLoadEvents, DeviceEvents (ASR, exploit protection, AMSI and other ActionTypes), DeviceInfo, plus AlertInfo/AlertEvidence. Every row has Timestamp, DeviceId, DeviceName, ActionType and InitiatingProcess* columns for the actor process."
  - title: Detection and automated investigation
    body: Cloud analytics and behaviour rules raise alerts (category, MITRE techniques, severity, evidence) and group them into incidents across endpoint, identity, email and cloud apps. Automated investigation and response (AIR) can remediate, isolate the device or collect an investigation package.
  - title: Streaming API → Event Hubs
    body: "Selected tables are pushed to an Event Hub (one hub for all, or one per table) or a Storage account. Each Event Hub message is {\"records\":[…]}; each record has time, tenantId, category = \"AdvancedHunting-<Table>\" and properties = the row. The collector must unroll records and take _time from the row, otherwise a batch shares one timestamp."
  - title: Alerts and incidents APIs
    body: Alerts come from the MDE /api/alerts endpoint or Microsoft Graph security alerts_v2 / incidents (OAuth2 app registration). They are low volume and carry evidence arrays (process, file, IP, URL, user) and mitreTechniques.
  - title: Device groups and tenant scope
    body: Every streamed row is decorated with MachineGroup (device group), which lets a pipeline route or tag per business unit. Streaming covers only columns that are generally available in the portal.
traffic:
  handles:
    - Process creation with full command line and parent chain
    - Outbound/inbound network connections per process (+ some HTTP/DNS/SSL inspection)
    - File create/modify/delete, executable drops
    - Registry changes and persistence
    - Logons (interactive, RDP, network) and token elevation
    - AMSI / script content, ASR rule hits, exploit protection
    - Antivirus detections and remediation actions
  flow:
    - step: Event on device
      desc: Sense / Defender AV observe a process, connection, file or registry action.
    - step: Local verdict
      desc: AV, ASR rules and network protection can block immediately and write the event log.
    - step: Cloud ingest
      desc: Telemetry is sent over TLS to the regional Defender cloud and written to Advanced Hunting tables.
    - step: Analytics
      desc: Cloud models and custom detections raise alerts and correlate them into incidents.
    - step: Stream out
      desc: Streaming API pushes selected tables to Event Hubs/Storage; alerts are pulled via REST/Graph.
    - step: Collect
      desc: Collector reads Event Hub, unrolls records, fixes _time, trims empty columns, routes to SIEM and lake.
logs:
