    sourcetype: mscs_azure_eventhub_defender_advancedhunting
    format: json
    share: 15–30 %
    avg: ~3 KB
    desc: One record per process creation, after unrolling the Event Hub records array. The richest table for hunting — command line, hashes, account and the initiating (parent) process.
    key:
      - category
      - properties.DeviceName
      - properties.ActionType
      - properties.FileName
      - properties.ProcessCommandLine
      - properties.AccountName
      - properties.InitiatingProcessFileName
      - properties.SHA1
    noise:
