id: crowdsec
name: CrowdSec
short: CrowdSec
vendor: CrowdSec
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - CrowdSec Security Engine
tags:
  - ips
  - behaviour-detection
  - open-source
  - threat-intelligence
  - json
summary: An open-source security engine that reads logs from web servers, SSH, firewalls and other services, detects attack behaviour with scenarios, and decides remediations such as banning an IP for a few hours. Bouncers on firewalls, proxies or web servers enforce those decisions. Each alert records which scenario fired, the attacking source, the evidence and the decision taken.
sourcetypes:
  - st: crowdsec_alert
    desc: Alerts from the CrowdSec Local API, one per scenario that triggered, with the source, evidence and remediation decisions
facts:
  Product: Behaviour-based intrusion detection and prevention engine with a shared IP reputation network
  Form factor: Agent on Linux, Windows, FreeBSD, containers or Kubernetes; Local API (LAPI) server; bouncers at enforcement points
  Log transport: Alerts are read from the Local API over HTTP(S), or forwarded by notification plugins
  Log format: One JSON object per alert, with nested decisions, events and meta arrays
  What an alert answers: Which scenario fired, against which source IP, how many events it took, what was targeted, and whether a ban or other remediation was decided
placement:
  slots:
    - edge
    - internal
  items:
    - slot: edge
      title: Agents and bouncers on exposed services
      desc: The agent runs next to internet-facing services (web servers, SSH, reverse proxies) and parses their logs. Bouncers on the same hosts or on firewalls apply ban decisions.
    - slot: internal
      title: Local API
      desc: The Local API stores alerts and decisions from one or more agents and serves them to bouncers and to any collector.
howItWorks:
  - title: Parsers and scenarios
    body: The agent tails service logs and parses them into events. Scenarios are leaky-bucket rules, for example http-probing or ssh-bf, with a capacity and a leak speed. When a source overflows a bucket, the scenario fires.
  - title: Decisions
    body: An overflow becomes an alert with one or more decisions. A decision has a type (ban, captcha), a scope (Ip, Range), a value and a duration. simulated says whether the scenario is in simulation mode and remediation whether a decision was made.
  - title: How the alerts leave the engine
    body: The agent pushes alerts to the Local API. A collector reads alerts from the LAPI with machine or bouncer credentials, or a notification plugin forwards them as HTTP, syslog or files. Any collector can take them.
traffic:
  handles:
    - HTTP probing and scanning
    - SSH and login brute force
    - Application-layer attacks seen in service logs
  flow:
    - step: Service logs
      desc: A web server, SSH daemon or proxy writes its normal log lines.
    - step: Scenario overflows
      desc: The agent parses the lines and a scenario fires when one source exceeds its bucket.
    - step: Alert and decision
      desc: The Local API stores the alert and the remediation decision for bouncers to enforce.
    - step: Collector reads
      desc: A collector reads the alert from the Local API or receives it from a notification plugin.
logs:
  - type: Alerts
    sourcetype: crowdsec_alert
    format: json
    desc: One object per triggered scenario. scenario is crowdsecurity/http-probing, message summarises it (11 events in 66 ms), source.ip is the attacker, meta holds the evidence (SQL-injection URIs and a sqlmap user agent), and decisions[0] is a 4h ban on that IP. Addresses are documentation addresses.
    sample: '{"capacity":10,"decisions":[{"duration":"4h","origin":"crowdsec","scenario":"crowdsecurity/http-probing","scope":"Ip","type":"ban","uuid":"6d99a8fe-d4b4-4500-8267-343315f3489b","value":"198.51.100.15"}],"events":[{"meta":[{"key":"ASNNumber","value":"0"},{"key":"IsInEU","value":"false"}],"timestamp":"2026-09-06T07:03:17Z"},{"meta":[{"key":"ASNNumber","value":"0"},{"key":"IsInEU","value":"false"}],"timestamp":"2026-09-06T07:03:17Z"}],"events_count":2,"kind":"crowdsec","labels":null,"leakspeed":"10s","machine_id":"localhost","message":"Ip 203.0.113.40 performed ''crowdsecurity/http-probing'' (11 events over 66.141098ms) at 2026-09-06 07:03:17.341951435 +0000 UTC","meta":[{"key":"target_uri","value":"[\"/products?id=1''%20OR%20''1''=''1--%201\", \"/products?id=1''%20OR%20''1''=''1--%202\"]"},{"key":"user_agent","value":"[\"sqlmap/1.7\"]"}],"remediation":true,"scenario":"crowdsecurity/http-probing","scenario_hash":"4b16f896af400e006c28b1476bf5989c748186f2b3756ed9ad7d1559480d278c","scenario_version":"0.4","simulated":false,"source":{"as_number":"0","ip":"192.0.2.10","scope":"Ip","value":"192.0.2.20"},"start_at":"2026-09-06T07:03:17.275811377Z","stop_at":"2026-09-06T07:03:17.341952475Z","uuid":"4bf17244-f3c0-4581-9559-03e2d135c71e"}'
    key:
      - capacity
      - decisions[0].duration
      - decisions[0].origin
      - decisions[0].scenario
cves: []
detections:
  - title: Source banned by a scenario
    severity: medium
    signals:
      - scenario
      - decisions[0].type
      - decisions[0].value
      - source.ip
    why: A ban decision means a source exceeded an attack scenario, such as probing, brute force or exploit attempts, and is being blocked. The same source hitting several hosts, or scenarios that point to exploitation, deserve a look beyond the automatic ban.
    kql: |
      dataset="crowdsec_logs"
      | where sourcetype == "crowdsec_alert" and decisions[0].type == "ban"
      | project start_at, scenario, source.ip, decisions[0].duration, events_count, machine_id, message
    mitre:
      - T1595
optimizations: []
references:
  - title: CrowdSec documentation
    url: https://docs.crowdsec.net/
