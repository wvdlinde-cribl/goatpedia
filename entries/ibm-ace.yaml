  Log format seen: json
  Fields in the first fixture: ibm_processId, ibm_processName, module, ibm_recordtype, ibm_sequence, type
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: IBM Ace events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries ibm_processId, ibm_processName, module, ibm_recordtype, ibm_sequence, type. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads ibm_ace and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
