id: nextron-thor
name: Nextron Thor
short: Nextron Thor
vendor: Nextron
category: saas
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - nextron_thor
  - Elastic integrations
tags:
  - elastic
  - json
summary: Nextron Thor is logged by the Elastic integrations package nextron_thor. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: nextron_thor_thor_forwarding
    desc: 'Elastic integrations fixture, 20 events. Upstream: nextron_thor/data_stream/thor_forwarding/_dev/test/pipeline/test-thorscanlogs.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: nextron_thor
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: json
  Fields in the first fixture: campaign_id, time, hostname, level, module, message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Nextron Thor events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries campaign_id, time, hostname, level, module, message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads nextron_thor and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
logs:
  - type: Thor Forwarding
    sourcetype: nextron_thor_thor_forwarding
    format: json
    desc: 20 fixture events in the samples pool (elastic).
    sample: '{"campaign_id":"2b054111-bad7-4bac-a14e-8fa8a88f1111","time":"2025-12-10T17:58:42Z","hostname":"mymachinename","level":"Info","module":"Report","message":"Thor Scan finished","scanid":"S-VavZi0stuDo","end_time":"2025-11-10T17:58:42.4290563Z","alerts":0,"warnings":16,"notices":30,"errors":0,"log_version":"v2.0.0"}'
    key:
      - campaign_id
      - time
      - hostname
      - level
cves: []
detections:
  - title: Nextron Thor events arriving
    severity: low
    signals:
      - campaign_id
      - time
      - hostname
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "nextron_thor_thor_forwarding"'
optimizations: []
references:
  - title: elastic/integrations nextron_thor/data_stream
    url: https://github.com/elastic/integrations/blob/cbfff90638a7565377768f50726775c0febc7bf4/packages/nextron_thor/data_stream/thor_forwarding/_dev/test/pipeline/test-thorscanlogs.log
  - title: Pack Generator sample nextron_thor_thor_forwarding.json
    url: https://github.com/wvdlinde-cribl/cribl-pack-samples/blob/main/samples/nextron_thor_thor_forwarding.json
