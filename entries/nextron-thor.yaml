# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: nextron-thor
name: THOR APT Scanner
short: THOR
vendor: Nextron Systems
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Nextron THOR
  - THOR Lite
  - THOR Cloud
tags:
  - compromise-assessment
  - yara
  - ioc-scanner
  - forensics
  - json
summary: A forensic compromise-assessment scanner that runs on endpoints and servers and checks files, processes, memory, registry and logs against YARA and Sigma rules and other indicators. Incident responders run it in a scan campaign across many hosts. Its log reports each finding at Alert, Warning or Notice level, and a final summary per host with the count of each.
sourcetypes:
  - st: nextron_thor_thor_forwarding
    desc: 'THOR scan log lines forwarded in JSON: individual findings by module and level, and the end-of-scan summary for a host'
facts:
  Product: Portable compromise-assessment and IOC/YARA scanner
  Form factor: Command-line scanner for Windows, Linux and macOS, run ad hoc, by a management tool, or from THOR Cloud
  Log transport: Local log file, plus optional syslog or other forwarding to a receiver while the scan runs
  Log format: Text or JSON lines. JSON lines carry log_version, hostname, module, level and message
  What a finding answers: Which module found what on which host, and how serious THOR rates it (Alert, Warning, Notice)
  What a scan summary answers: When the scan on a host finished and how many alerts, warnings, notices and errors it produced
placement:
  slots:
    - endpoint
    - internal
  items:
    - slot: endpoint
      title: Scanned host
      desc: THOR runs on the endpoint or server being assessed. It reads the local file system, processes and logs, so findings are tied to that hostname.
    - slot: internal
      title: Log receiver
      desc: During a campaign THOR forwards its log from every scanned host to a central receiver, so responders see findings as they happen.
howItWorks:
  - title: Modules and signatures
    body: A scan runs modules such as Filescan, ProcessCheck, Eventlog and Registry. Each module tests what it reads against Nextron signatures, YARA rules, Sigma rules and custom IOCs.
  - title: Levels
    body: Every log line has a level. Alert is a strong match, Warning a suspicious one, Notice a weak or informational one, and Info is progress. The Report module writes the summary at the end with alert, warning, notice and error counts.
  - title: Campaigns
    body: A campaign_id groups the scans of one assessment, and scanid identifies one scan on one host.
  - title: How the log leaves the product
    body: THOR writes its log locally and can forward each line as it is written, in text or JSON, to a syslog or TCP receiver.
traffic:
  handles:
    - File and memory scanning
    - YARA and Sigma matching
    - IOC checks
    - Scan reporting
  flow:
    - step: Scan starts
      desc: A responder or a tool starts THOR on a host as part of a campaign.
    - step: Modules match
      desc: Each module checks artefacts and writes a line for every finding at its level.
    - step: Report
      desc: At the end the Report module writes the summary with the counts per level.
    - step: Forward
      desc: Lines are forwarded in JSON to the receiver while the scan runs.
logs:
  - type: THOR scan log
    sourcetype: nextron_thor_thor_forwarding
    format: json
    desc: One JSON object per log line. level and module say what kind of line it is, hostname is the scanned host, campaign_id and scanid group the scan. This sample is the Report summary at the end of a scan, with alerts, warnings and notices counted.
    sample: '{"campaign_id":"2b054111-bad7-4bac-a14e-8fa8a88f1111","time":"2025-12-10T17:58:42Z","hostname":"mymachinename","level":"Info","module":"Report","message":"Thor Scan finished","scanid":"S-VavZi0stuDo","end_time":"2025-11-10T17:58:42.4290563Z","alerts":0,"warnings":16,"notices":30,"errors":0,"log_version":"v2.0.0"}'
    key:
      - campaign_id
      - time
      - hostname
      - level
cves: []
detections:
  - title: THOR reported an alert or warning
    severity: high
    signals:
      - level
      - module
      - hostname
      - message
    why: 'Alert and Warning lines are the findings of a compromise assessment: a signature, YARA or IOC match on that host. They are the lines responders triage first.'
    kql: |
      dataset="nextron-thor_logs"
      | where sourcetype == "nextron_thor_thor_forwarding" and level in ("Alert", "Warning")
      | project time, hostname, module, level, message, campaign_id
optimizations:
  - title: Keep findings, sample progress lines
    saving: most of the scan log volume
    fn: Drop
    how: Info lines report scan progress. The findings are Alert, Warning and Notice, plus the Report summary. Drop Info lines that are not from the Report module.
    expr: level == 'Info' && module != 'Report'
    stream:
      log: THOR scan log
      functions:
        - id: drop
          filter: level == 'Info' && module != 'Report'
          description: Drop Info progress lines that are not the Report summary; keep Alert, Warning and Notice findings
          conf: {}
      test:
        - '{"campaign_id":"2b054111-bad7-4bac-a14e-8fa8a88f1111","time":"2025-12-10T17:58:42Z","hostname":"mymachinename","level":"Info","module":"FileScan","message":"Scanning directory","scanid":"S-VavZi0stuDo","end_time":"2025-11-10T17:58:42.4290563Z","alerts":0,"warnings":16,"notices":30,"errors":0,"log_version":"v2.0.0"}'
        - '{"campaign_id":"2b054111-bad7-4bac-a14e-8fa8a88f1111","time":"2025-12-10T17:58:42Z","hostname":"mymachinename","level":"Warning","module":"FileScan","message":"Suspicious file found","scanid":"S-VavZi0stuDo","end_time":"2025-11-10T17:58:42.4290563Z","alerts":0,"warnings":16,"notices":30,"errors":0,"log_version":"v2.0.0"}'
      expect:
        out: 2
references:
  - title: THOR manual
    url: https://thor-manual.nextron-systems.com/
