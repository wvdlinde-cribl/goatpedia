summary: The message trace of Exchange Online, Microsoft 365's hosted mail service. Every message that enters or leaves the tenant is traced with sender, recipient, subject, size, the IPs it came from and went to, and its delivery status. Admins read it to follow mail flow, find spam or quarantined mail and investigate phishing.
sourcetypes:
  - st: microsoft_exchange_online_message_trace
    desc: Message trace records from Exchange Online, one per message and recipient, with sender, recipient, subject, IPs, size and status
facts:
  Product: Mail flow tracing in Exchange Online (Microsoft 365)
  Scope: All mail sent, received and relayed by the tenant
  Log transport: Message trace API (Reporting web service or Exchange Online PowerShell) polled by a collector for a time window
  Log format: One JSON object per message trace row
  What a trace record answers: Who sent which message to whom, from which IP, when it was received, and whether it was delivered, failed or filtered
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Exchange Online
      desc: Mail flow and its trace live in Microsoft's cloud. A collector polls the message trace API for the tenant over a time window.
howItWorks:
  - title: Mail flow
    body: Exchange Online receives mail from the internet and from users, filters it, and delivers or rejects it. Each step for a message is tracked against a MessageTraceId.
  - title: Message trace rows
    body: A trace row summarises one message to one recipient. It carries Received, SenderAddress, RecipientAddress, Subject, Size, FromIP and ToIP, and Status such as Delivered, Failed, FilteredAsSpam or Quarantined. StartDate and EndDate are the window that was queried.
traffic:
  handles:
    - Inbound internet mail
    - Outbound mail
    - Internal mail between users
  flow:
    - step: Message flows
      desc: A message is received, filtered and delivered or rejected by Exchange Online.
    - step: Trace recorded
      desc: The service records the message trace row with its final status.
    - step: Collector queries
      desc: A collector asks the message trace API for a time window and receives JSON rows. Goatpedia reads the line as text.
logs:
  - type: Message trace
    sourcetype: microsoft_exchange_online_message_trace
    format: text
    desc: One JSON row per message and recipient, read as one text line. SenderAddress, RecipientAddress and Subject describe the message, FromIP the sending host and Status the outcome. This sample is a delivered PIM notification about a privileged role assignment. Values are documentation addresses.
    sample: '{"EndDate":"2022-09-05T21:46:46.4206759Z","FromIP":"198.51.100.25","Index":0,"MessageId":"\user@example.com\u003e","MessageTraceId":"cf7a249a-5edd-4350-130a-08da8f69e0f6","Organization":"contoso.com","Received":"2022-09-05T18:10:13.4907658","RecipientAddress":"user@example.com","SenderAddress":"user@example.com","Size":87891,"StartDate":"2022-09-03T21:46:46.4206759Z","Status":"Delivered","Subject":"PIM: A privileged directory role was assigned outside of PIM","ToIP":"203.0.113.8"}'
    pattern: (?<message>[\s\S]+)
    key:
      - message
