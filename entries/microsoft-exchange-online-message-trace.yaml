summary: Microsoft Exchange Online Message Trace is logged by the Elastic integrations package microsoft_exchange_online_message_trace. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: microsoft_exchange_online_message_trace
    desc: 'Elastic integrations fixture, 8 events. Upstream: microsoft_exchange_online_message_trace/data_stream/log/_dev/test/pipeline/test-log.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: microsoft_exchange_online_message_trace
  Sourcetypes: '1'
  Fixture events: '8'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Microsoft Exchange Online Message Trace events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Elastic integrations package reads microsoft_exchange_online_message_trace and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text.
logs:
