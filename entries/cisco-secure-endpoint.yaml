  Log format seen: json
  Fields in the first fixture: item, audit_log_type, created_at, audit_log_user, event, message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Cisco Secure Endpoint events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries item, audit_log_type, created_at, audit_log_user, event, message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads cisco_secure_endpoint and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
logs:
  - type: Cisco Secure Endpoint
    sourcetype: cisco_secure_endpoint
    format: json
    desc: 5 fixture events in the samples pool (logtest).
    sample: '{"item":"user@example.com","audit_log_type":"User","created_at":"2024-06-19T10:16:22Z","audit_log_user":"user@example.com","event":"sso_login","message":"SCSO","audit_log_id":"10bfd8f2-8569-4b78-8996-19acc900f4fc"}'
    key:
      - item
      - audit_log_type
      - created_at
      - audit_log_user
cves: []
detections:
  - title: Cisco Secure Endpoint events arriving
    severity: low
    signals:
      - item
      - audit_log_type
      - created_at
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "cisco_secure_endpoint"'
optimizations: []
references:
