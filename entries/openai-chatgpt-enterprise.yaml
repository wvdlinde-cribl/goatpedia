id: openai-chatgpt-enterprise
name: ChatGPT Enterprise
short: ChatGPT Ent
vendor: OpenAI
category: ai
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - ChatGPT Business
  - ChatGPT Edu
  - ChatGPT Compliance API
  - Codex
tags:
  - generative-ai
  - saas
  - compliance
  - audit
  - json
summary: The business edition of ChatGPT, run as a managed workspace with SSO, admin controls and data retention policies. Members chat, connect apps, build custom agents and use Codex for coding work. Workspace logs record sign-ins, administration, conversation messages, connector use, custom agent changes and Codex activity, so a compliance or security team can see who used what and what data moved.
sourcetypes:
  - st: openai_chatgpt_enterprise_app_auth_log
    desc: Members linking or unlinking a connected app to their ChatGPT account
  - st: openai_chatgpt_enterprise_app_log
    desc: Requests that ChatGPT sends to a connected app or MCP server, with the app, the conversation and the input
  - st: openai_chatgpt_enterprise_audit_log
    desc: Administrative and API actions on the workspace, with the actor, privilege, result and client details
  - st: openai_chatgpt_enterprise_auth_log
    desc: Sign-ins to the workspace, with the user, outcome, role and client IP
  - st: openai_chatgpt_enterprise_codex_log
    desc: Codex account events such as access tokens being created, with the user and token details
  - st: openai_chatgpt_enterprise_codex_security_log
    desc: Codex Security activity, such as findings and proposed patches opened as pull requests
  - st: openai_chatgpt_enterprise_conversation_message
    desc: Messages in workspace conversations, with the author, the content and the conversation
  - st: openai_chatgpt_enterprise_custom_agents_log
    desc: Custom agents being created or changed, with their model, prompt, skills and tools
facts:
  Product: Managed ChatGPT workspace for organisations, including connectors, custom agents and Codex
  Clients: Web, desktop and mobile apps, Codex web and CLI, and API keys for admin automation
  Log transport: HTTPS compliance and audit APIs for the workspace, polled by a collector with an admin API key
  Log format: One JSON object per event. type names the stream, principal is the workspace, actor is who acted
  What a sign-in answers: Which member signed in, with what result and role, from which IP and TLS client fingerprint
  What an audit event answers: Which admin or API key acted on the workspace, with what privilege and result, from where
  What a conversation message answers: What a member wrote or received in which conversation, for retention and data-loss review
  What a Codex event answers: Who created access tokens or opened pull requests through Codex
placement:
  slots:
    - cloud
    - endpoint
  items:
    - slot: cloud
      title: ChatGPT workspace
      desc: The workspace, its conversations, connectors, agents and Codex all run in the OpenAI service. Events are recorded there and read by a collector through the workspace APIs.
    - slot: endpoint
      title: ChatGPT and Codex clients
      desc: Members use ChatGPT from a browser or app and Codex from the web or a terminal. Sign-in events name the client IP and fingerprint, and messages name the client type.
howItWorks:
  - title: Workspace and members
    body: A ChatGPT Enterprise workspace is the tenant. Every event carries principal (the workspace) and actor (a member, an API key, or the system). Sign-ins go through the workspace login or SSO.
  - title: Connectors and agents
    body: Members link apps such as Slack or drive providers. ChatGPT then calls them, often as MCP servers, during a conversation. App auth events record the link, and app log events record each request ChatGPT sent to the app. Custom agents bundle a prompt, a model, skills and tools.
  - title: Codex
    body: Codex runs coding tasks against repositories. Codex events record account actions such as access tokens. Codex Security events record security findings and patches it proposed as pull requests.
  - title: How the events leave the product
    body: Workspace owners create an admin API key with compliance access. A collector lists and downloads events per type for a time window and keeps its position. Any collector can do this.
traffic:
  handles:
    - Workspace sign-in
    - Workspace administration
    - Conversations and messages
    - Connector and MCP calls
    - Custom agents
    - Codex coding tasks
  flow:
    - step: Member acts
      desc: A member signs in, sends a message, links an app, builds an agent or runs Codex. An admin or API key changes the workspace.
    - step: Workspace records it
      desc: The event is stored under its type with the workspace as principal and the member or key as actor.
    - step: Collector pulls
      desc: A collector calls the workspace API with an admin key and fetches new events per type.
    - step: Events are JSON
      desc: Each event is one JSON object, forwarded to any destination.
logs:
  - type: Connected app authorisation
    sourcetype: openai_chatgpt_enterprise_app_auth_log
    format: json
    desc: One object per link change between a member and an app. action is what happened (link in this sample), app_id is the app, and actor.user_email is the member. The sample uses documentation addresses.
    sample: '{"event_id":"7b3e4de1-2219-4d6c-9d6e-8f4d40c7c001","type":"APP_AUTH_LOG","principal":{"id":"be545252-ad04-4cfa-9ca5-deca58416151","type":"CHATGPT_WORKSPACE"},"actor":{"type":"ACCOUNT_USER","user_id":"user-AbCdEf1234567890","user_email":"user@example.com"},"timestamp":"2026-07-09T20:33:11.112450Z","app_id":"asdk_app_0123456789abcdef0123456789abcdef","link_id":"link_00112233445566778899aabbccddeeff","action":"link"}'
    key:
      - event_id
      - type
      - principal.id
      - principal.type
  - type: Connected app requests
    sourcetype: openai_chatgpt_enterprise_app_log
    format: json
    desc: One object per request ChatGPT sent to an app. app_name and app_type name the app, conversation_id ties it to the chat, log_type says request or response, and input holds what ChatGPT asked the app for. This sample is a Slack search through MCP. The sample uses documentation addresses.
    sample: '{"event_id":"3f1a9c02-1111-4a11-8b11-000000000001","type":"APP_LOG","principal":{"id":"11111111-2222-3333-4444-555555555555","type":"CHATGPT_WORKSPACE"},"actor":{"type":"ACCOUNT_USER","user_id":"user-Aaaaaaaaaaaaaaaaaaaaaaa1","user_email":"user@example.com"},"timestamp":"2026-07-15T15:39:18.154524Z","app_id":"asdk_app_1111111111111111aaaa","app_name":"Slack","app_type":"MCP","conversation_id":"c-1111-aaaa-2222-bbbb","log_type":"request","input":{"query":"in:general after:2026-07-14","limit":20,"include_bots":true,"sort":"timestamp","sort_dir":"desc","response_format":"concise","_meta":{"openai/userAgent":"ChatGPT/1.2026.183 (Mac OS X 26.5.2; arm64; build 1783607847)","openai/locale":"en-GB","openai/userLocation":{"city":"London","region":"England","country":"GB","timezone":"Europe/London","latitude":"51.50853","longitude":"-0.12574"},"timezone":"Europe/London","openai/subject":"v1/mock-subject-aaaaaaaaaaaaaaaa","openai/session":"v1/mock-session-aaaaaaaaaaaaaaaa","openai/organization":"v1/mock-org-aaaaaaaaaaaaaaaa"}}}'
    key:
      - event_id
      - type
      - principal.id
      - principal.type
  - type: Workspace audit
    sourcetype: openai_chatgpt_enterprise_audit_log
    format: json
    desc: One object per administrative or API action. action is the operation, action_result and action_privilege its outcome and level, actor is who, and request_metadata holds client IP, user agent and JA3/JA4. This sample is an API key listing log files. The sample uses documentation addresses.
    sample: '{"event_id":"92b7dea7-9ff4-485e-b0a0-74efa627f15b","type":"AUDIT_LOG","principal":{"id":"be545252-ad04-4cfa-9ca5-deca58416151","type":"CHATGPT_WORKSPACE"},"actor":{"type":"API_KEY","redacted_id":"sk-example"},"timestamp":"2026-07-09T11:05:09.077133Z","action_result":"SUCCESS","action_privilege":"ADMIN","request_metadata":{"client_ip":"203.0.113.8","client_ip_details":{"country":"GB","city":"London","region":"England","region_code":"ENG","asn":"","latitude":"51.50853","longitude":"-0.12574"},"client_user_agent":"python-requests/2.34.2","client_ja3":"86dab2109182b6bbaa644647d7db2997","client_ja4":"t13d1713h1_ab0a1bf427ad_8537cf56674e","destination_hostname":"api.chatgpt.com"},"action_data":{"limit":"100","after":"2026-07-09T10:24:53.814285Z","event_type":"AUDIT_LOG"},"action":"LIST_WORKSPACE_LOG_FILES"}'
    key:
      - event_id
      - type
      - principal.id
      - principal.type
  - type: Sign-ins
    sourcetype: openai_chatgpt_enterprise_auth_log
    format: json
    desc: One object per sign-in. action_data.action is the outcome (login_success here), action_data.role the member role, and request_metadata.client_ip with its geolocation and TLS fingerprints the client. The sample uses documentation addresses.
    sample: '{"event_id":"9532e1b4-e44a-42c7-a52a-083c345e0001","type":"AUTH_LOG","principal":{"id":"11111111-2222-3333-4444-555555555555","type":"CHATGPT_WORKSPACE"},"actor":{"type":"ACCOUNT_USER","user_id":"user-Aaaaaaaaaaaaaaaaaaaaaaa1","user_email":"user@example.com"},"timestamp":"2026-07-15T10:53:18Z","request_metadata":{"client_ip":"203.0.113.40","client_ip_details":{"country":"GB","city":"London","region":"England","region_code":"ENG","latitude":"51.50853","longitude":"-0.12574"},"client_ja3":"f90ffded875933863a95a1a84285c922","client_ja4":"q13d0311h3_55b375c5d22e_653d80c3fe9d"},"action_data":{"action":"login_success","role":"standard-user"}}'
    key:
      - event_id
      - type
      - principal.id
      - principal.type
  - type: Codex activity
    sourcetype: openai_chatgpt_enterprise_codex_log
    format: json
    desc: One object per Codex account event. event_type is what happened, client_id the Codex client, and event_details the specifics. This sample is an access token being created with its name and expiry. The sample uses documentation addresses.
    sample: '{"event_id":"cd000000-0000-0000-0000-000000000010","type":"CODEX_LOG","timestamp":"2026-07-09T10:10:00.000000Z","principal":{"id":"be545252-ad04-4cfa-9ca5-deca58416151","type":"CHATGPT_WORKSPACE"},"actor":{"type":"ACCOUNT_USER","user_id":"user-TUvqhBX7HbQPRgHyEBt5WRcI","user_email":"user@example.com"},"event_type":"ACCESS_TOKEN_CREATED","client_id":"CODEX_WEB","workspace_id":"be545252-ad04-4cfa-9ca5-deca58416151","event_details":{"detail_type":"ACCESS_TOKEN_CREATED","access_token_id":"cat-1001","access_token_name":"ci-runner-token","created_by_user_id":"user-TUvqhBX7HbQPRgHyEBt5WRcI","expires_at":"2026-10-09T10:10:00Z"}}'
    key:
      - event_id
      - type
      - timestamp
      - principal.id
  - type: Codex Security activity
    sourcetype: openai_chatgpt_enterprise_codex_security_log
    format: json
    desc: One object per Codex Security event. event_type is what happened and event_details holds the finding and, here, the pull request it opened with a proposed patch. The sample uses documentation addresses.
    sample: '{"event_id":"cs000000-1111-4a11-8b11-000000000001","type":"CODEX_SECURITY_LOG","timestamp":"2026-07-09T13:20:00.000000Z","principal":{"id":"11111111-2222-3333-4444-555555555555","type":"CHATGPT_WORKSPACE"},"actor":{"type":"ACCOUNT_USER","user_id":"user-Aaaaaaaaaaaaaaaaaaaaaaa1","user_email":"user@example.com"},"event_type":"PROPOSED_PATCH_PR_CREATED","client_id":"CODEX_WEB","workspace_id":"11111111-2222-3333-4444-555555555555","event_details":{"detail_type":"PROPOSED_PATCH_PR_CREATED","finding_id":"hid-mock-123","pr_url":"https://github.com/example-org/example-repo/pull/123"}}'
    key:
      - event_id
      - type
      - timestamp
      - principal.id
  - type: Conversation messages
    sourcetype: openai_chatgpt_enterprise_conversation_message
    format: json
    desc: One object per message. message.author.type says who wrote it, message.content.value is the text, and conversation holds the conversation id, title and whether it is a temporary chat. The sample uses documentation addresses.
    sample: '{"event_id":"9d6bb4e9-3882-4dbe-9d4c-2668b692f9a1","type":"CONVERSATION_MESSAGE","principal":{"id":"9f1c2e3a-0b1d-4c2e-8a3f-1122334455aa","type":"CHATGPT_WORKSPACE"},"actor":{"type":"ACCOUNT_USER","user_id":"user-Aa11QwErTyUiOp","user_email":"user@example.com"},"timestamp":"2026-07-15T15:29:00.243000Z","message":{"id":"39adf8b1-e281-42c0-920b-9d8f63426fc8","created_at":"2026-07-15T15:29:00.243000Z","author":{"type":"user","client_type":"desktop_web"},"content":{"type":"text","value":"Draft a concise release note for v2.3."}},"conversation":{"id":"6a57a2e4-ba84-832d-9604-9567f8223bc6","title":"Release notes","created_at":"2026-07-15T15:10:34.219710Z","is_pinned":false,"is_temporary_chat":false}}'
    key:
      - event_id
      - type
      - principal.id
      - principal.type
  - type: Custom agents
    sourcetype: openai_chatgpt_enterprise_custom_agents_log
    format: json
    desc: One object per change to a custom agent. event_type is the change (AGENT_CREATED here), and event_details.agent_fields holds the agent name, model, prompt, skills and tools. The sample uses documentation addresses.
    sample: '{"event_id":"ca000000-0000-0000-0000-000000000001","type":"CUSTOM_AGENTS_LOG","timestamp":"2026-03-03T20:40:00.000000Z","principal":{"id":"9f1c2e3a-0b1d-4c2e-8a3f-1122334455aa","type":"CHATGPT_WORKSPACE"},"actor":{"type":"ACCOUNT_USER","user_id":"user-Aa11QwErTyUiOp","user_email":"user@example.com"},"event_type":"AGENT_CREATED","client_id":"AGENT_BUILDER_WEB","workspace_id":"9f1c2e3a-0b1d-4c2e-8a3f-1122334455aa","event_details":{"detail_type":"AGENT_CREATED","agent_id":"agent-123","version_id":"version-1","agent_fields":{"model_spec":{"name":"gpt-5","reasoning_effort":"medium"},"name":"Sales Ops Agent","prompt":"Summarize CRM activity and next actions.","description":"Workspace sales assistant","tagline":"Triage pipeline updates","category":"operations","skills":[{"id":"skill-1","type":"uploaded_skill","name":"crm-guide"}],"starter_prompts":[],"file_tree_id":"snapshot-99","tools":{"web_search":null,"image_generation_enabled":false,"widget_tools":[],"connectors":[]}}}}'
    key:
      - event_id
      - type
      - timestamp
      - principal.id
cves: []
detections:
  - title: Workspace sign-in did not succeed
    severity: medium
    signals:
      - action_data.action
      - actor.user_email
      - request_metadata.client_ip
    why: Any sign-in outcome other than success is a failed attempt on the workspace. Repeated failures for one member, or from unusual countries, are the password-guessing view of this source.
    kql: |
      dataset="openai-chatgpt-enterprise_logs"
      | where sourcetype == "openai_chatgpt_enterprise_auth_log" and action_data.action != "login_success"
      | project timestamp, actor.user_email, action_data.action, request_metadata.client_ip, request_metadata.client_ip_details.country
    mitre:
      - T1110
  - title: Codex access token created
    severity: low
    signals:
      - event_type
      - actor.user_email
      - event_details.access_token_name
    why: An access token is a long-lived credential that lets automation act as the member. New tokens should match known CI or developer use.
    kql: |
      dataset="openai-chatgpt-enterprise_logs"
      | where sourcetype == "openai_chatgpt_enterprise_codex_log" and event_type == "ACCESS_TOKEN_CREATED"
      | project timestamp, actor.user_email, event_details.access_token_name, event_details.expires_at
    mitre:
      - T1098
optimizations:
  - title: Keep message content in retention storage
    saving: most of the workspace volume
    fn: Routes
    how: Conversation messages and connector requests are the bulk of the data and are needed for compliance review, not for real-time detection. Route them to retention storage and send sign-ins, audit, Codex and agent events to the SIEM.
    expr: sourcetype == 'openai_chatgpt_enterprise_conversation_message' || sourcetype == 'openai_chatgpt_enterprise_app_log'
references: []
