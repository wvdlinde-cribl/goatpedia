summary: Nutanix is logged by the Splunk Connect for Syslog package nutanix. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: nutanix_syslog
    desc: 'Splunk Connect for Syslog fixture, 1 events. Upstream: tests/test_nutanix.py'
facts:
  Where the sample comes from: Splunk Connect for Syslog
  Integration package: nutanix
  Sourcetypes: '1'
  Fixture events: '1'
  Log format seen: kv
  Fields in the first fixture: header, node, type, msg, arch, syscall
placement:
  slots:
    - edge
  items:
    - slot: edge
      title: Splunk Connect for Syslog
      desc: Fixtures were harvested from splunk/splunk-connect-for-syslog. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Nutanix events in this library are the test fixtures shipped with splunk/splunk-connect-for-syslog (d861082778). The first event carries header, node, type, msg, arch, syscall. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - kv
  flow:
    - step: Collect
      desc: The Splunk Connect for Syslog package reads nutanix and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as kv.
