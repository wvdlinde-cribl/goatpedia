summary: Symantec Dlp is logged by the Splunk Connect for Syslog package symantec_dlp. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: symantec_dlp
    desc: 'Splunk Connect for Syslog fixture, 4 events. Upstream: tests/test_symantec_dlp.py'
facts:
  Where the sample comes from: Splunk Connect for Syslog
  Integration package: symantec_dlp
  Sourcetypes: '1'
  Fixture events: '4'
  Log format seen: kv
  Fields in the first fixture: header, Application_Name, Application_User, Attach_File_Name, Blocked, Data_Owner
placement:
  slots:
    - edge
  items:
    - slot: edge
      title: Splunk Connect for Syslog
      desc: Fixtures were harvested from splunk/splunk-connect-for-syslog. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Symantec Dlp events in this library are the test fixtures shipped with splunk/splunk-connect-for-syslog (d861082778). The first event carries header, Application_Name, Application_User, Attach_File_Name, Blocked, Data_Owner. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - kv
  flow:
    - step: Collect
      desc: The Splunk Connect for Syslog package reads symantec_dlp and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as kv.
