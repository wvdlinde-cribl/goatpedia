id: spring-boot
name: Spring Boot Actuator
short: Spring Boot
vendor: Broadcom (VMware Tanzu)
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Spring Boot
  - Spring Boot Actuator
  - httptrace endpoint
  - httpexchanges endpoint
tags:
  - java
  - application-framework
  - http
  - observability
summary: Spring Boot is a Java framework for building stand-alone web applications and services, and Actuator is its set of built-in management endpoints. The HTTP trace endpoint (httptrace, renamed httpexchanges in Spring Boot 3) keeps the most recent HTTP request-response exchanges the application served. Each record says who called which URL with which method, what status came back, and how long it took — a small access log taken from inside the application.
sourcetypes:
  - st: spring_boot_http_trace
    desc: Recent HTTP exchanges from the Actuator HTTP trace endpoint, one per request with method, URI, headers, remote address, principal, session, status and time taken
facts:
  Product: Java application framework with built-in management endpoints (Actuator)
  Form factor: Embedded web server (Tomcat, Jetty or Undertow) inside each Spring Boot application, on a VM, container or platform
  Endpoint: /actuator/httptrace in Spring Boot 2, /actuator/httpexchanges in Spring Boot 3. Off by default. Needs an HttpTraceRepository or HttpExchangeRepository bean
  Log transport: HTTPS or HTTP JSON, pulled from the Actuator endpoint by a collector
  Log format: A JSON list of exchanges. Each exchange is one JSON object
  What an exchange answers: Who (remoteAddress, principal) requested which URI with which method, what status the application returned, and how long it took
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Spring Boot application
      desc: The application runs on an application server, VM or container platform. Actuator endpoints are served on the application port or a separate management port, which should only be reachable from management networks.
howItWorks:
  - title: Actuator endpoints
    body: Actuator adds endpoints such as health, metrics, env, loggers and the HTTP trace endpoint. Each one can be enabled and exposed over HTTP or JMX. Exposed endpoints are reached under /actuator.
  - title: The HTTP trace buffer
    body: When an exchange repository bean is present, the application records each request and response in an in-memory buffer, 100 entries by default. A record holds the timestamp, principal, session, request method, URI, headers and remote address, and the response status and headers, plus the time taken.
  - title: How the data leaves the application
    body: The buffer is not written to a file. A collector calls the endpoint over HTTP on a schedule and reads the current list. Because the buffer is small, exchanges can be missed between polls on a busy application.
traffic:
  handles:
    - HTTP requests to the application
    - Actuator management endpoint calls
    - Session and principal on each request
  flow:
    - step: Client calls the application
      desc: A browser, service or monitoring agent sends an HTTP request to the Spring Boot application.
    - step: Exchange is buffered
      desc: The application stores the request and response details in its in-memory exchange repository.
    - step: Collector polls
      desc: A collector calls /actuator/httptrace or /actuator/httpexchanges and receives the recent exchanges.
    - step: Events are JSON
      desc: Each exchange is one JSON object. Goatpedia reads these samples as JSON.
logs:
  - type: HTTP exchanges
    sourcetype: spring_boot_http_trace
    format: json
    desc: One request and its response. request.method, request.uri and request.remoteAddress say what was asked and from where, principal and session say who, and response.status is the answer. This sample is an anonymous GET to an Actuator Jolokia URL that returned 200. Addresses use documentation ranges.
    sample: '{"timestamp":"2022-03-04T16:05:16.022Z","principal":"anonymousUser","session":"E175F2BFB6A22C9A60A116BE63D9F0C3","request":{"method":"GET","uri":"http://192.0.2.20:8090/actuator/jolokia/read/java.lang:name=PS%20Old%20Gen,type=MemoryPool/Usage,UsageThresholdCount,UsageThresholdSupported,UsageThreshold,U...","headers":{"host":["198.51.100.15:8090"],"accept-encoding":["gzip"],"user-agent":["Elastic-Metricbeat/8.0.0 (linux; amd64; 2ab3a7334016f570e0bfc7e9a577a35a22e02df5; 2022-02-03 18:14:06 +0000 UTC)"]},"remoteAddress":"198.51.100.25"},"response":{"status":200,"headers":{"Transfer-Encoding":["chunked"],"X-Frame-Options":["DENY"],"Cache-Control":["no-cache"],"X-Content-Type-Options":["nosniff"],"Set-Cookie":["JSESSIONID=290A264B870BB15FF8DDB6B91D098A8D; Path=/; HttpOnly"],"Expires":["Fri, 04 Mar 2022 15:05:16 GMT"],"Pragma":["no-cache"],"X-XSS-Protection":["1; mode=block"],"Date":["Fri, 04 Mar 2022 16:05:16 GMT"],"Content-Type":["text/plain;charset=utf-8"]}},"timeTaken":1}'
    key:
      - timestamp
      - principal
      - session
      - request.method
cves: []
detections:
  - title: Anonymous call to an Actuator endpoint
    severity: medium
    signals:
      - request.uri
      - principal
      - request.remoteAddress
      - response.status
    why: Actuator endpoints such as env, heapdump and jolokia expose configuration, memory and management operations. A successful call to /actuator/ by anonymousUser means those endpoints are reachable without authentication.
    kql: |
      dataset="spring-boot_logs"
      | where sourcetype == "spring_boot_http_trace" and request.uri contains "/actuator/" and principal == "anonymousUser" and response.status < 400
      | project timestamp, request.method, request.uri, request.remoteAddress, response.status
    mitre:
      - T1190
optimizations: []
references:
  - title: Spring Boot Actuator endpoints
    url: https://docs.spring.io/spring-boot/reference/actuator/endpoints.html
  - title: Spring Boot project
    url: https://spring.io/projects/spring-boot
