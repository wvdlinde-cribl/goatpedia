id: amazon-security-lake
name: Amazon Security Lake
short: Security Lake
vendor: Amazon Web Services
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - AWS Security Lake
tags:
  - security-data-lake
  - aws
  - ocsf
  - cloud
  - json
summary: An AWS service that collects security data from AWS services, third-party sources and custom sources into a data lake in the customer's own S3 buckets. Records are normalised to the Open Cybersecurity Schema Framework (OCSF) and stored as Parquet, partitioned by source, account, region and time. Subscribers read the lake through S3 notifications or query it with Athena, so each record is one OCSF event of a given class.
sourcetypes:
  - st: amazon_security_lake
    desc: OCSF events read from the lake. This stream is the Application Activity category, here HTTP activity with request, device and status
facts:
  Product: Managed security data lake in the customer's AWS account
  Schema: Open Cybersecurity Schema Framework (OCSF), one class per event type
  Storage: Apache Parquet objects in S3, managed with AWS Lake Formation
  Native sources: CloudTrail, VPC Flow Logs, Route 53 resolver logs, Security Hub findings, EKS audit logs and others, plus custom sources
  Log transport: Subscribers get new-object notifications through SQS and read S3, or query with Athena
  What an OCSF event answers: Depends on its class. An HTTP activity event answers which device made which request and with what result
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Security Lake in the AWS account
      desc: Security Lake runs in a delegated administrator account and writes to S3 buckets in each enabled region. Sources write into it, and subscribers read from it.
howItWorks:
  - title: Sources
    body: AWS sources such as CloudTrail and VPC Flow Logs are turned on per account and region and converted to OCSF by the service. Custom sources write their own OCSF Parquet into a prefix that Security Lake manages.
  - title: OCSF classes
    body: Every record has class_uid, category_uid, activity_id and a time. Fields differ by class. Application Activity events such as HTTP activity carry an http_request with URL, method and user agent, and a device that made it.
  - title: Subscribers
    body: A data access subscriber is notified of new objects through SQS and reads the Parquet from S3. A query access subscriber queries tables through Lake Formation and Athena. Any collector that can read S3 can consume the lake.
traffic:
  handles:
    - Security logs and findings from AWS services
    - Third-party and custom security data in OCSF
  flow:
    - step: Source writes
      desc: An AWS service or custom source produces security events.
    - step: Lake normalises
      desc: Security Lake converts them to OCSF and writes Parquet to S3, partitioned by source, region, account and time.
    - step: Subscriber reads
      desc: A subscriber is notified of new objects and reads them, or runs queries.
    - step: Events are OCSF JSON
      desc: Each row read from the lake is one OCSF event that the collector can forward as JSON.
