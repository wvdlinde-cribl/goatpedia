id: trellix
name: Trellix ePO & Endpoint Security (EDR)
short: Trellix
aka:
  - McAfee ePolicy Orchestrator (ePO)
  - Trellix ePO - On-prem / ePO - SaaS
  - Trellix Endpoint Security (ENS)
  - McAfee Endpoint Security
  - Trellix EDR (MVISION EDR)
  - Trellix Agent (McAfee Agent)
vendor: Trellix
category: edr
status: full
updated: "2026-11-12"
contributors:
