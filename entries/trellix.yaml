cves:
  - id: CVE-2023-5444
    cvss: 8.0
    year: 2023
    kev: false
    scope: device
    title: ePO CSRF in the dashboard lets a low-privilege user add a new administrator
    affected: Trellix ePolicy Orchestrator before 5.10.0 CP1 Update 2
    fixed: 5.10.0 CP1 Update 2
    detect: ePO audit log entries for user creation / role change that no administrator performed; new admin accounts appearing in ePO; follow-on policy changes (exclusions, disabled modules) followed by a drop in threat events.
    avoid: Patch ePO; restrict console access to admin jump hosts; review the ePO audit log daily.
  - id: CVE-2024-4844
    cvss: 7.5
    year: 2024
    kev: false
    scope: device
    title: ePO hardcoded credentials let an ePO-server admin read orion.keystore and access ePO secrets (CNA score)
    affected: Trellix ePolicy Orchestrator - On-prem before 5.10 Service Pack 1 Update 2
    fixed: 5.10 Service Pack 1 Update 2
    detect: Access to orion.keystore on the ePO server outside service accounts (Windows Security 4663 / Sysmon file events); ePO database connections from unexpected hosts.
    avoid: Patch; treat the ePO server as tier-0 (it can push code to every endpoint); limit local admin on it.
  - id: CVE-2023-0975
    cvss: 7.8
    year: 2023
    kev: false
    scope: device
    title: Trellix Agent for Windows install/upgrade lets a local user replace an Agent executable → SYSTEM
    affected: Trellix Agent for Windows 5.7.8 and earlier
    detect: Device inventory attributes.agentVersion at or below 5.7.8; EDR file events writing into the Agent install directory by a non-SYSTEM process during an upgrade window.
    avoid: Upgrade the Agent; deploy upgrades through ePO only; restrict write access to installer staging folders.
  - id: CVE-2023-3665
    cvss: 7.8
    year: 2023
    kev: false
    scope: device
    title: ENS AMSI component can be disabled by a local user via environment variables (NVD 7.8; Trellix scores 5.5)
    affected: Trellix Endpoint Security (ENS) 10.7.0 April 2023 release and earlier
    detect: Drop in AMSI-sourced detections from a host; EDR process events with unusual environment-variable setting before PowerShell / script execution; script-based malware succeeding where ENS normally blocks.
    avoid: Update ENS to a later monthly release; keep Exploit Prevention and Adaptive Threat Protection on.
  - id: CVE-2017-0144
    cvss: 8.8
    year: 2017
    kev: true
    scope: traffic
    title: Windows SMBv1 "EternalBlue" RCE (WannaCry, NotPetya) — the threat ENS firewall / exploit prevention and network IPS events are expected to flag
    affected: Windows Vista – 10 and Server 2008 – 2016 with SMBv1 before MS17-010
    fixed: MS17-010 (March 2017)
    detect: ENS / Host IPS threat events for SMB exploit signatures; EDR network events with many inbound TCP 445 connections from one internal host; lsass.exe or spoolsv.exe spawning unexpected children.
    avoid: Apply MS17-010; disable SMBv1; block TCP 445 between workstations.
detections:
  - title: Malware detected but not removed
    severity: high
    signals:
      - threat event with threathandled=false
      - or threatactiontaken in none / would block / denied
    why: A detection that was only reported (exclusion, observe mode, failed clean) leaves the payload active.
    kql: |-
      dataset="trellix_epo" type="MVEvents"
      | where attributes.threathandled == false or attributes.threatactiontaken in~ ("none","would block","IDS_ALERT_ACT_TAK_NONE")
      | summarize count(), threats=make_set(attributes.threatname, 10) by attributes.targethostname, attributes.analyzername
    mitre:
      - T1204.002
  - title: Same threat on many hosts (outbreak)
    severity: critical
    signals:
      - one threatname on > 10 distinct targethostname in 1 h
    why: Worm-like spread (EternalBlue-style) or a mass phishing campaign; trigger containment and block indicators centrally.
    kql: |-
      dataset="trellix_epo" type="MVEvents"
      | summarize hosts=dcount(attributes.targethostname), events=count() by attributes.threatname, bin(_time, 1h)
      | where hosts > 10
    mitre:
      - T1210
      - T1566.001
  - title: Encoded PowerShell with outbound connection (EDR)
    severity: high
    signals:
      - trellix_edr_event _eventType=Network Connection
      - name=powershell.exe
      - cmdLine has -enc
    why: Download cradles decode and immediately connect out; the pairing is specific.
    kql: |-
      dataset="trellix_edr" _eventType="Network Connection" direction="outbound"
      | where name in~ ("powershell.exe","pwsh.exe")
      | where cmdLine matches regex @"(?i)\s-(e|en|enc|encodedcommand)\s"
      | summarize conns=count(), dests=make_set(dnsName, 10) by _deviceId, destAddress, destPort
    mitre:
      - T1059.001
      - T1027.010
      - T1105
  - title: Endpoint protection silenced — stale agents or DAT
    severity: medium
    signals:
      - device attributes.lastUpdate older than 7 days
      - analyzerdatversion far behind the fleet
    why: Agents that stop checking in, or hosts with old DATs, are where attackers live; also the symptom of tampering.
    kql: |-
      dataset="trellix_epo_devices" type="devices"
      | extend last_checkin=todatetime(attributes.lastUpdate)
      | summarize last_checkin=max(last_checkin), agent=any(attributes.agentVersion) by attributes.computerName
      | where last_checkin < ago(7d)
    mitre:
      - T1562.001
  - title: Same download URL delivering malware to several users
    severity: high
    signals:
      - threat events with a sourceurl
      - one sourceurl on > 2 target hosts
    why: A shared URL behind detections on several hosts is an active delivery site (phishing link, compromised site); block it at the proxy and hunt for hosts that fetched it without a detection.
    kql: |-
      dataset="trellix_epo" type="MVEvents"
      | where isnotempty(attributes.sourceurl)
      | summarize hosts=dcount(attributes.targethostname), users=make_set(attributes.targetusername, 10), threats=make_set(attributes.threatname, 5) by attributes.sourceurl
      | where hosts > 2
    mitre:
      - T1566.002
      - T1189
optimizations:
  - title: Filter event IDs at the source
    saving: 20–50 %
    fn: ePO Event Filtering + Drop
    how: ePO Event Filtering decides which event IDs are forwarded. Forward threat, exploit-prevention, access-protection and firewall-block events; keep update / scan-completed / informational events in ePO only, or drop them in Stream.
    expr: attributes.threatcategory.startsWith('ops.') || attributes.threatname=='None'
  - title: Remove null and duplicate columns
    saving: 25–40 %
    fn: Eval (remove fields)
    how: Threat events carry many nulls (source*/target* not applicable), IPv6-mapped duplicates of IPv4 and self links. Remove them and flatten attributes.* to top level.
    expr: "remove: links.*, attributes.*ipv6, attributes.*mac, attributes.autoguid; drop null"
  - title: Parse syslog XML to JSON once
    saving: 30–50 % (XML tag overhead)
    fn: Parser (XML) → Serialize
    how: On-prem events arrive as verbose XML. Parse with the XML parser, keep CommonFields + MachineInfo, and serialise as JSON so on-prem and SaaS share one schema.
    expr: "C.Text.parseXml(_raw) → EPOEvent.SoftwareInfo.Event.CommonFields.*, EPOEvent.MachineInfo.*"
  - title: Enrich with devices and groups
    saving: Analyst time
    fn: Lookup
    how: Join events on agentguid / computerName to the Devices API (tags, OS, agent version) and nodepath to the Groups API (nodeTextPath) so alerts show business unit and owner.
    expr: "lookup trellix_devices.csv on agentguid → tags, osType, agentVersion; lookup trellix_groups.csv on nodepath → nodeTextPath"
  - title: Aggregate EDR network and DNS activity
    saving: 20–40 %
    fn: Aggregations
    how: EDR network and DNS events repeat heavily. Aggregate per device / process / destination per minute for the SIEM; keep raw in Cribl Lake.
    expr: "_eventType in ('Network Connection','DNS Query')  group by _deviceId, name, destAddress, destPort  window 60s"
