summary: Trellix (the merger of McAfee Enterprise and FireEye) manages endpoint protection through ePolicy Orchestrator. The Trellix Agent on each host reports threat events from Endpoint Security (ENS threat prevention, firewall, web control, exploit prevention) and DLP to ePO, which stores them and forwards them over TLS syslog as XML (on-prem) or exposes them through the Events and Devices REST APIs (ePO - SaaS). Trellix EDR adds continuous activity telemetry, threats and alerts through its own API.
sourcetypes:
  - st: trellix_edr_event
    desc: Trellix EDR activity feed / threats and alerts API events (process, file, network, DNS, registry, named pipe, scheduled task)
  - st: trellix_epo_device
    desc: ePO - SaaS Devices API (/epo/v2/devices) — inventory with agent version, OS, tags, IP
  - st: trellix_epo_event
    desc: ePO threat events — Events API (/epo/v2/events, MVEvents) or on-prem syslog XML (EPOEvent)
  - st: trellix_epo_group
    desc: ePO - SaaS Groups API (/epo/v2/groups) — System Tree groups for enrichment
  - st: mcafee:epo:syslog
    desc: Splunk Add-on for McAfee/Trellix ePO — threat events received via ePO syslog forwarding
facts:
  First released: ePO 2000 (McAfee); ENS 10 2015; Trellix brand 2022 (McAfee Enterprise + FireEye)
  Platform: Agents for Windows, macOS, Linux; ePO - On-prem on Windows Server + SQL Server; ePO - SaaS
  Delivery model: Self-hosted ePO server with Agent Handlers, or ePO - SaaS (multi-tenant)
  Log transport: On-prem — syslog over TCP+TLS only (default 6514), or SQL queries; SaaS — Events / Devices / Groups REST APIs (OAuth2 + x-api-key)
  Log format: On-prem syslog — RFC 5424 with an XML EPOEvent payload; SaaS — JSON:API documents
  EDR data: Trellix EDR activity feed and Threats/Alerts API (JSON)
  Typical volume: Threat events are low (tens to thousands per day per 10k hosts); EDR activity is high
  Current versions: ePO - On-prem 5.10 SP1, ENS 10.7.x, Trellix Agent 5.8.x
  Cribl Pack: none found in the Packs Dispensary (use the generic JSON / syslog packs)
placement:
  slots:
    - endpoint
    - internal
    - cloud
  items:
    - slot: endpoint
      title: Trellix Agent + ENS on every host
      desc: The Agent enforces ePO policy and uploads events; ENS modules (Threat Prevention, Firewall, Web Control, Adaptive Threat Protection) and DLP generate the threat events. Trellix EDR adds an activity sensor.
    - slot: internal
      title: ePO - On-prem server and Agent Handlers
      desc: Windows server with a SQL Server database. Agent Handlers in DMZs or remote sites relay agent traffic. ePO forwards selected events to a registered syslog server (TLS only).
    - slot: cloud
      title: ePO - SaaS and Trellix EDR
      desc: The SaaS console and EDR backend in Trellix's cloud; data leaves only via the REST APIs (regional gateways such as api.manage.trellix.com).
    - slot: internal
      title: SIEM collector
      desc: Cribl Stream listens on TLS syslog for ePO - On-prem, or polls the SaaS Events/Devices APIs with a REST collector.
howItWorks:
  - title: Policy and the System Tree
    body: ePO organises machines in a System Tree of groups and tags. Policies and client tasks (scans, DAT updates, product deployment) are assigned per group; the Agent checks in on an interval (ASCI) and pulls them. Every event carries the node path / group so it can be routed per business unit.
  - title: Threat events
    body: "ENS and other point products emit events with a numeric threat event ID, analyzer (product), detection method, threat name/type/category/severity, action taken and the source/target host, user, process and file. On-prem they land in the ePO SQL EPOEvents table; SaaS exposes them as MVEvents through /epo/v2/events."
  - title: Syslog forwarding (on-prem)
    body: A registered Syslog Server with "Enable event forwarding" makes the Agent Handler push each selected event as an RFC 5424 message with an XML <EPOEvent> body (MachineInfo + SoftwareInfo/Event/CommonFields). Event Filtering decides which event IDs are stored, forwarded or both. Only TCP + TLS is supported.
  - title: ePO - SaaS APIs
    body: Collectors get an IAM token (client credentials, scopes epo.evt.r / epo.admin), then page /epo/v2/events with since/until and the after cursor, and read /epo/v2/devices and /epo/v2/groups for inventory. Responses follow JSON:API (id, type, attributes, links).
  - title: Trellix EDR
    body: The EDR sensor records process, file, network, DNS, registry, named-pipe and scheduled-task activity; cloud analytics raise threats and alerts with MITRE mapping. Real-time and historical search, investigations, remediation and the activity feed are exposed through the EDR APIs.
traffic:
  handles:
    - On-access and on-demand malware detections
    - Exploit prevention and access-protection rule hits
    - Host firewall and web control (URL reputation) events
    - Adaptive Threat Protection (reputation, containment)
    - DLP endpoint incidents
    - EDR activity — process, file, network, DNS, registry, named pipe, scheduled task
    - Agent / product update and compliance status
  flow:
    - step: Detection on endpoint
      desc: ENS module (or DLP / EDR sensor) detects a threat or policy violation and acts (clean, delete, block, deny).
    - step: Agent upload
      desc: The Trellix Agent queues the event and sends it to an Agent Handler at the next communication.
    - step: ePO store
      desc: ePO writes the event to its database (on-prem) or tenant store (SaaS), subject to Event Filtering.
    - step: Forward
      desc: On-prem pushes XML over TLS syslog; SaaS events wait for an API poll.
    - step: EDR analytics
      desc: EDR activity is analysed in the cloud; threats and alerts become available via the EDR API.
    - step: Collect and route
      desc: Cribl Stream parses XML/JSON, enriches with device and group data, routes to SIEM and lake.
