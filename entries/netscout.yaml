id: netscout
name: NETSCOUT Arbor Sightline
short: Sightline
vendor: NETSCOUT
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Arbor Sightline
  - Arbor Peakflow SP
  - Peakflow
tags:
  - ddos
  - network-visibility
  - flow
  - syslog
  - text
summary: A DDoS detection and network visibility platform for service providers and large enterprises. Sightline appliances collect NetFlow, IPFIX and BGP from routers, detect attacks and traffic anomalies, and can trigger mitigation. Its syslog stream reports alerts and system events, including who changed the configuration of the deployment and when.
sourcetypes:
  - st: netscout_sightline
    desc: Syslog messages from Sightline appliances, covering DDoS and traffic alerts, system status and configuration changes
facts:
  Product: DDoS detection and network traffic analytics based on flow and routing data
  Form factor: Physical or virtual appliances in a deployment with one leader and collector or traffic-and-routing-analysis nodes
  Log transport: Syslog notifications sent from the appliances to a configured receiver
  Log format: Plain text syslog lines. The program tag (for example pfsp) names the Sightline process
  What a configuration message answers: Which leader was changed, the new configuration version, and the user who committed it
placement:
  slots:
    - internal
    - edge
  items:
    - slot: internal
      title: Sightline appliances
      desc: Sightline nodes sit in the provider or enterprise core and receive flow export and BGP from edge and core routers. The leader holds the configuration for the whole deployment. Syslog is sent from the appliances to a collector.
    - slot: edge
      title: Routers exporting flow
      desc: Border and peering routers export NetFlow or IPFIX and peer BGP with Sightline. That is the traffic Sightline analyses. The routers are not the source of these syslog lines.
howItWorks:
  - title: Flow-based detection
    body: Sightline builds a model of normal traffic from flow and routing data and raises alerts when traffic toward a managed object exceeds learned or configured thresholds, as in a volumetric DDoS.
  - title: Leader and configuration
    body: A Sightline deployment is managed from its leader. Configuration edits are committed as a new version. Each commit is logged with the leader name, the version number and the user who made it.
  - title: How the messages leave the product
    body: Notification rules send alerts and system events as syslog to one or more receivers. Any syslog collector can receive them.
traffic:
  handles:
    - NetFlow and IPFIX analysis
    - BGP routing data
    - DDoS alerting
    - Configuration commits
  flow:
    - step: Routers export
      desc: Edge routers send flow records and BGP updates to Sightline.
    - step: Sightline detects or changes
      desc: Sightline raises an alert on anomalous traffic, or an operator commits a configuration change on the leader.
    - step: Syslog is sent
      desc: A notification rule formats the event as a syslog line and sends it to the receiver.
logs:
  - type: Sightline syslog
    sourcetype: netscout_sightline
    format: text
    desc: 'One syslog line per event. The message text carries the meaning. This sample is a configuration commit: the leader, the new version and the user who changed it.'
    sample: 'January 29 06:09:59 pfsp: The configuration was changed on leader olab to version 1.6078 by rci'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Sightline configuration changed
    severity: low
    signals:
      - message
    why: A change to the leader configuration alters detection thresholds and mitigation for the whole deployment. Each commit names the user, so changes outside a change window or by an unexpected account stand out.
    kql: |
      dataset="netscout_logs"
      | where sourcetype == "netscout_sightline" and message contains "configuration was changed"
      | project message
    mitre:
      - T1562
optimizations: []
references: []
