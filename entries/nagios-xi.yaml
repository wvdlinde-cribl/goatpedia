summary: Nagios Xi is logged by the Elastic integrations package nagios_xi. The Pack Generator samples pool holds fixture events for 3 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: nagios_xi
    desc: 'Elastic integrations fixture, 1 events. Upstream: nagios_xi/data_stream/events/_dev/test/pipeline/test-events.log'
  - st: nagios_xi_host
    desc: 'Elastic integrations fixture, 2 events. Upstream: nagios_xi/data_stream/host/_dev/test/pipeline/test-host.log'
  - st: nagios_xi_service
    desc: 'Elastic integrations fixture, 12 events. Upstream: nagios_xi/data_stream/service/_dev/test/pipeline/test-service.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: nagios_xi
  Sourcetypes: '3'
  Fixture events: '15'
  Log format seen: json
  Fields in the first fixture: logentry_id, entry_time, logentry_type, logentry_data, instance_id
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Nagios Xi events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries logentry_id, entry_time, logentry_type, logentry_data, instance_id. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads nagios_xi and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
logs:
  - type: Events
    sourcetype: nagios_xi
    format: json
    desc: 1 fixture events in the samples pool (elastic).
