# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: nagios-xi
name: Nagios XI
short: Nagios XI
vendor: Nagios Enterprises
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Nagios
tags:
  - monitoring
  - infrastructure
  - availability
  - json
summary: A commercial infrastructure monitoring server built on Nagios Core. It runs active checks against hosts and services such as HTTP, SSH and ping, keeps their current state, and alerts when something goes down. Nagios XI sits inside the network with reach to the systems it watches. Its API exposes the engine's log entries and the current status of each host and service with check output and performance data.
sourcetypes:
  - st: nagios_xi
    desc: Nagios engine log entries, one per log line with entry time, type and text
  - st: nagios_xi_host
    desc: Current host status, one host with address, state, check output and performance data
  - st: nagios_xi_service
    desc: Current service status, one service on a host with state, check output and performance data
facts:
  Product: Infrastructure and application monitoring server based on Nagios Core
  Deployment: On-premises server or VM inside the monitored network
  Log transport: Nagios XI REST API (objects such as logentries, hoststatus and servicestatus) polled by a collector with an API key
  Log format: One JSON object per log entry or status record
  What a host or service record answers: Is it up, what did the last check return, and how long did it take
  What a log entry answers: What the monitoring engine did, such as check worker results, notifications and state changes
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Nagios XI server
      desc: The server runs inside the network and checks hosts and services it can reach. Status and log entries are kept in its database and read through its API.
howItWorks:
  - title: Active checks
    body: Nagios runs plugins on a schedule against each host and service. A plugin returns a state (0 OK, 1 warning, 2 critical, 3 unknown for services; 0 up, 1 down for hosts), a line of output and performance data.
  - title: Status and history
    body: The latest result per host and service is the status record, with current_state, output, perfdata and check timing. Engine messages, including check worker results, state changes and notifications, are log entries.
traffic:
  handles:
    - Host and service availability checks
    - State changes and notifications
  flow:
    - step: Check runs
      desc: Nagios runs a plugin against a host or service.
    - step: State recorded
      desc: The result updates the status record, and the engine writes log entries.
    - step: Collector polls
      desc: A collector reads status and log entries from the API. Goatpedia reads them as JSON.
logs:
  - type: Engine log entries
    sourcetype: nagios_xi
    format: json
    desc: One object per engine log line. entry_time, logentry_type and logentry_data say when and what. This sample is a check worker reporting a finished job with its exit status.
    sample: '{"logentry_id":"211300","entry_time":"2022-03-17 01:05:42","logentry_type":"1","logentry_data":"wproc:   early_timeout=0; exited_ok=1; wait_status=65280; error_code=0;","instance_id":"1"}'
    key:
      - logentry_id
      - entry_time
      - logentry_type
      - logentry_data
  - type: Host status
    sourcetype: nagios_xi_host
    format: json
    desc: One object per host. host_name, address, current_state and output give its state and last check result, and perfdata the measurements. This sample is a web host whose HTTP check is OK with a 301 redirect.
    sample: '{"host_object_id":"191","host_name":"www.twitter.com","host_alias":"","display_name":"www.twitter.com","address":"www.twitter.com","icon_image":"www_server.png","icon_image_alt":"","notes":"","notes_url":"","action_url":"","hoststatus_id":"59","instance_id":"1","status_update_time":"2022-03-16 07:26:45","output":"HTTP OK: HTTP/1.1 301 Moved Permanently - 311 bytes in 0.036 second response time","long_output":"","perfdata":"time=0.036431s;;;0.000000 size=311B;;;0","current_state":"0","has_been_checked":"1","should_be_scheduled":"1","current_check_attempt":"1","max_check_attempts":"5","last_check":"2022-03-16 07:26:45","next_check":"2022-03-16 07:31:45","check_type":"0","check_options":"0","last_state_change":"2018-09-04 11:52:29","last_hard_state_change":"2010-08-06 13:39:16","last_hard_state":"0","last_time_up":"2022-03-16 07:26:45","last_time_down":"2018-09-04 11:52:29"}'
    key:
      - host_object_id
      - host_name
      - host_alias
      - display_name
  - type: Service status
    sourcetype: nagios_xi_service
    format: json
    desc: One object per service on a host. host_name, service_description, current_state and output give the state and last check result. This sample is an SSH service that is OK and reports its OpenSSH version.
    sample: '{"host_name":"vs1.nagios.org","service_description":"SSH","display_name":"SSH","host_object_id":"120","host_address":"vs1.nagios.org","host_alias":"","icon_image":"","icon_image_alt":"","notes":"","notes_url":"","action_url":"","servicestatus_id":"872","instance_id":"1","service_object_id":"123","status_update_time":"2022-03-16 22:12:34","output":"SSH OK - OpenSSH_8.0 (protocol 2.0)","long_output":"","perfdata":"time=0.014744s;;;0.000000;10.000000","current_state":"0","has_been_checked":"1","should_be_scheduled":"1","current_check_attempt":"1","max_check_attempts":"5","last_check":"2022-03-16 22:12:34","next_check":"2022-03-16 22:17:34","check_type":"0","check_options":"0","last_state_change":"2010-07-15 15:52:36","last_hard_state_change":"2010-06-13 07:55:36","last_hard_state":"0"}'
    key:
      - host_name
      - service_description
      - display_name
      - host_object_id
cves: []
detections: []
optimizations:
  - title: Drop unchanged OK status
    saving: most status volume
    fn: Drop
    how: Polling status returns every healthy host and service each time. Keep records that are not OK, and the engine log entries for state changes.
    expr: current_state == '0'
references: []
