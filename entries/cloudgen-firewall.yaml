    sourcetype: cloudgen_firewall
    format: text
    desc: 17 fixture events in the samples pool (logtest).
    sample: '2025-09-25T15:21:00+05:30 testsdemoslocals sacumentestlocal/box_Auth_access:  Notice     sacumentestlocal LOGIN ATTEMPT: boxconfig[8652]: Login localhost_sacumentestlocal from 192.0.2.10 : Allowed.'
