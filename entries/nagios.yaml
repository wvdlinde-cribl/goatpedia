facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: nagios
  Sourcetypes: '1'
  Fixture events: '8'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Nagios events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads nagios and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text.
logs:
  - type: Nagios
    sourcetype: nagios
    format: text
    desc: 8 fixture events in the samples pool (logtest).
    sample: '[1606472574] wproc: Registry request: name=Core Worker 39;pid=39'
    pattern: (?<message>[\s\S]+)
    key:
      - message
