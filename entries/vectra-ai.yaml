facts:
  Where the sample comes from: Splunk Connect for Syslog
  Integration package: vectra_ai
  Sourcetypes: '6'
  Fixture events: '7'
  Log format seen: cef
  Fields in the first fixture: syslog_header, cef_version, device_vendor, device_product, device_version, signature_id
placement:
  slots:
    - edge
  items:
    - slot: edge
      title: Splunk Connect for Syslog
      desc: Fixtures were harvested from splunk/splunk-connect-for-syslog. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Vectra AI events in this library are the test fixtures shipped with splunk/splunk-connect-for-syslog (d861082778). The first event carries syslog_header, cef_version, device_vendor, device_product, device_version, signature_id. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - cef
  flow:
    - step: Collect
      desc: The Splunk Connect for Syslog package reads vectra_ai and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as cef.
logs:
  - type: Vectra Cognito Accountdetect
    sourcetype: vectra_cognito_accountdetect
    format: cef
    desc: 1 fixture events in the samples pool (sc4s).
    sample: '<111> Jun 15 13:45:07 sc4s-lab-01 vectra_cef_account_detection -: CEF:0|Vectra Networks|X Series|$version|$d_type|$d_type_vname|$severity|externalId=$detection_id cat=$category dvc=$headend_addr account=$accountflexNumber1Label=threat flexNumber1=$threat flexNumber2Label=certainty flexNumber2=$certainty cs4Label=Vectra Event URL cs4=$href cs5Label=triaged cs5=$triaged dst=$dd_dst_ip dhost=$dd_dst_dns dpt=$dd_dst_port out=$dd_bytes_sent in=$dd_bytes_rcvd start=$UTCTimeStartCEF end=1781531107'
    key:
      - cef_version
      - device_vendor
      - device_product
      - device_version
