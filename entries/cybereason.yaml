howItWorks:
  - title: What the fixture shows
    body: Cybereason events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries [0].simpleValues.logonType.totalValues, [0].simpleValues.logonType.values[0], [0].simpleValues.creationTime.totalValues, [0].simpleValues.creationTime.values[0], [0].simpleValues.group.totalValues, [0].simpleValues.group.values[0]. Values in the sample were rewritten to documentation addresses.
