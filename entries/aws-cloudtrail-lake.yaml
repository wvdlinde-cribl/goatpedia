summary: AWS Cloudtrail Lake is logged by the Splunk attack_data package aws_cloudtrail_lake. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: aws_cloudtrail_lake
    desc: 'Splunk attack_data fixture, 4 events. Upstream: datasets/attack_techniques/T1078/aws_updateloginprofile/asl_ocsf_cloudtrail.json'
facts:
  Where the sample comes from: Splunk attack_data
  Integration package: aws_cloudtrail_lake
  Sourcetypes: '1'
  Fixture events: '4'
  Log format seen: json
  Fields in the first fixture: metadata.product.version, metadata.product.name, metadata.product.vendor_name, metadata.product.feature.name, metadata.event_code, metadata.uid
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Splunk attack_data
      desc: Fixtures were harvested from splunk/attack_data. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: AWS Cloudtrail Lake events in this library are the test fixtures shipped with splunk/attack_data (d192cc5844). The first event carries metadata.product.version, metadata.product.name, metadata.product.vendor_name, metadata.product.feature.name, metadata.event_code, metadata.uid. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Splunk attack_data package reads aws_cloudtrail_lake and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
