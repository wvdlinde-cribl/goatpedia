summary: Citrix Adc is logged by the Elastic integrations package citrix_adc. The Pack Generator samples pool holds fixture events for 4 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: citrix_adc
    desc: 'Elastic integrations fixture, 20 events. Upstream: citrix_adc/data_stream/log/_dev/test/pipeline/test-citrix-waf-native.log'
  - st: citrix_adc_interface
    desc: 'Elastic integrations fixture, 1 events. Upstream: citrix_adc/data_stream/interface/_dev/test/pipeline/test-interface-metrics.log'
  - st: citrix_adc_lbvserver
    desc: 'Elastic integrations fixture, 2 events. Upstream: citrix_adc/data_stream/lbvserver/_dev/test/pipeline/test-lbvserver-metrics.log'
  - st: citrix_adc_service
    desc: 'Elastic integrations fixture, 1 events. Upstream: citrix_adc/data_stream/service/_dev/test/pipeline/test-service-metrics.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: citrix_adc
  Sourcetypes: '4'
  Fixture events: '24'
  Log format seen: text, json
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Citrix Adc events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Elastic integrations package reads citrix_adc and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text / json.
