summary: An application delivery controller that sits in front of web and application servers and load-balances, offloads TLS and filters requests for them. It ships as a hardware appliance, a virtual appliance (VPX) or a container (CPX). The appliance sends its own events, including Web App Firewall verdicts, over syslog, and exposes per-interface, per-virtual-server and per-service counters through its NITRO REST API.
sourcetypes:
  - st: citrix_adc
    desc: The appliance's native syslog stream, including Web App Firewall (APPFW) verdicts on individual requests
  - st: citrix_adc_interface
    desc: Counters for one network interface of the appliance, such as link state, uptime and dropped packets
  - st: citrix_adc_lbvserver
    desc: Counters for one load-balancing virtual server, such as health, active services, hits and response times
  - st: citrix_adc_service
    desc: Counters for one back-end service behind the appliance, such as throughput, requests and time to first byte
facts:
  Product: Application delivery controller, load balancer and Web App Firewall
  Form factor: MPX/SDX hardware, VPX virtual appliance, CPX container, or a cloud marketplace instance
  Log transport: Syslog from the appliance for events; NITRO REST API (HTTPS JSON) polled for statistics
  Log format: Syslog text with a Citrix event header for events; one JSON object per interface, virtual server or service for statistics
  What a syslog event answers: Which module (APPFW, SSLVPN, AAA and so on) reported what, for which client and URL, and whether the request was blocked
  What an interface record answers: Whether a link is up, how long it has been up or down, and whether it is dropping packets
  What an lbvserver record answers: Whether a virtual server is healthy, how many back-end services are active, and how busy it is
  What a service record answers: How much traffic one back-end service carries and how quickly it answers
placement:
  slots:
    - dmz
    - internal
  items:
    - slot: dmz
      title: ADC appliance
      desc: The ADC terminates client connections for published applications, usually in a DMZ. It runs the Web App Firewall, load-balancing virtual servers and TLS offload, and writes syslog events about what it saw and did.
    - slot: internal
      title: Back-end services
      desc: Behind the appliance are the services (web servers, application servers, DNS servers) that each virtual server forwards to. Service and virtual-server counters describe the health and load of that pool.
howItWorks:
  - title: Virtual servers and services
    body: An administrator defines a load-balancing virtual server on an IP and port. Clients connect to it, and the appliance picks one of the bound services (a back-end IP and port) for each connection, based on health checks and a load-balancing method. The lbvserver and service counters describe this from both sides.
  - title: Web App Firewall
    body: When an APPFW profile is bound to a virtual server, the appliance inspects each request against checks such as start URL, cross-site scripting, SQL injection and field formats. A violation produces an APPFW syslog event that names the profile, the check, the client IP, the URL and the action (blocked, not blocked, transformed).
  - title: How the data leaves the appliance
    body: Events go out as syslog to any receiver the administrator configures, in native format or CEF. Statistics are not pushed. A collector calls the NITRO API (/nitro/v1/stat/...) over HTTPS with an appliance account and receives JSON counters for interfaces, virtual servers and services.
traffic:
  handles:
    - HTTP and HTTPS requests to published applications
    - TCP, UDP and DNS load balancing
    - Web App Firewall checks on requests
  flow:
    - step: Client connects
      desc: A client opens a connection to a virtual server address on the appliance.
    - step: Appliance decides
      desc: The appliance checks the request against any bound firewall profile and chooses a back-end service.
    - step: Event or counter
      desc: A firewall violation or other event is written to syslog. Request, byte and connection counters are updated on the interface, virtual server and service.
    - step: Collector receives
      desc: Syslog arrives at the collector as it happens. A collector polls NITRO for the counters on a schedule.
logs:
  - type: Appliance syslog
    sourcetype: citrix_adc
    format: text
    desc: One syslog line per event. This sample is an APPFW cross-site scripting violation on profile pr_ffc. The line names the check, the client IP, the URL with the offending field, and ends with <blocked>, which is the action taken. Addresses are documentation addresses.
    pattern: (?<message>[\s\S]+)
    sample: 'Jun 22 19:14:37 <local0.info> 192.0.2.10 06/22/2015:19:14:37 GMT ns 0-PPE-1 : default APPFW APPFW_cross-site scripting 60 0 : 192.0.2.20 616-PPE1 y/3upt2K8ySWWId3Kavbxyni7Rw0000 pr_ffc http://aaron.stratum8.net/FFC/login.php?login_name=abc&passwd=12345&drinking_pref=on&text_area=%3Cscript%3E%0D%0A&loginButton=ClickToLogin&as_sfid=AAAAAAWEXcNQLlSokNmqaYF6dvfqlChNzSMsdyO9JXOJomm2vBwAMOqZIChv21EcgBc3rexIUcfm0vckKlsgoOeC_BArx1Ic4NLxxkWMtrJe4H7SOfkiv9NL7AG4juPIanTvVo%3D&as_fid=feeec8758b41740eedeeb6b35b85dfd3d5def30c Cross-site script check failed for field text_area="Bad tag: script" <blocked>'
    key:
      - message
  - type: Interface statistics
    sourcetype: citrix_adc_interface
    format: json
    desc: One record per interface. curlinkstate and curintfstate say whether the link and interface are up. curlinkuptime and curlinkdowntime say for how long. errdroppedrxpkts counts received packets the interface dropped.
    sample: '{"curintfstate":"UP","curlinkdowntime":"00:00:11","curlinkstate":"DOWN","curlinkuptime":"5.00:34:24","errdroppedrxpkts":"4525300","errdroppedrxpktsrate":16,"errdroppedtxpkts":"0","errdroppedtxpktsrate":0,"errifindiscards":"0","errifindiscardsrate":0,"errlinkhangs":"0","errnicmuted":"0","errpktrx":"0","errpktrxrate":0,"errpkttx":"0","errpkttxrate":0,"id":"0/1","interfacealias":"","jumbopktsreceived":"0","jumbopktsreceivedrate":0,"jumbopktstransmitted":"0","jumbopktstransmittedrate":0,"linkreinits":"0","macmovedrate":0,"netscalerpktsrate":7,"nicerrdisables":"0","nicerrifoutdiscards":"0","nicerrifoutdiscardsrate":0,"nicmulticastpktsrate":0,"nicrxstalls":"0"}'
    key:
      - curintfstate
      - curlinkdowntime
      - curlinkstate
      - curlinkuptime
  - type: Load-balancing virtual server statistics
    sourcetype: citrix_adc_lbvserver
    format: json
    desc: One record per virtual server. name and type identify it (here a DNS virtual server). state and vslbhealth say whether it is up and how healthy its pool is. actsvcs and inactsvcs count bound services, and avgcltttlb is the average client time to last byte. The address is a documentation address.
    sample: '{"name":"cpx_default_dns_vserver","avgcltttlb":"4","cltresponsetimeapdex":1,"vsvrsurgecount":"4","establishedconn":"4","inactsvcs":"1","vslbhealth":"67","primaryipaddress":"198.51.100.15","primaryport":0,"type":"DNS","state":"UP","actsvcs":"2","cpuusagepm":"10","tothits":"10","hitsrate":10,"totalrequests":"10","requestsrate":10,"totalresponses":"2","responsesrate":2,"totalrequestbytes":"2","requestbytesrate":2,"totalresponsebytes":"6","responsebytesrate":6,"totalh2requests":"6","h2requestsrate":6,"totalh2responses":"7","h2responsesrate":7,"totalpktsrecvd":"7","pktsrecvdrate":7,"totalpktssent":"8"}'
    key:
      - name
      - avgcltttlb
      - cltresponsetimeapdex
      - vsvrsurgecount
  - type: Service statistics
    sourcetype: citrix_adc_service
    format: json
    desc: One record per back-end service. name, servicetype, primaryipaddress and primaryport identify it. state says whether health checks pass. totalrequests, throughput and avgsvrttfb (average server time to first byte) describe load and speed. Addresses are documentation addresses.
    sample: '{"name":"nshttpd-gui-198.51.100.25-80","throughput":"0","throughputrate":0,"avgsvrttfb":"17","primaryipaddress":"203.0.113.8","primaryport":80,"servicetype":"HTTP","state":"UP","totalrequests":"12578","requestsrate":0,"totalresponses":"12578","responsesrate":0,"totalrequestbytes":"7091409","requestbytesrate":69,"totalresponsebytes":"23688619","responsebytesrate":151,"curclntconnections":"5","surgecount":"0","cursrvrconnections":"1","svrestablishedconn":"1","curreusepool":"1","maxclients":"0","curload":"0","totalconnreassemblyqueue75":"0","totalconnreassemblyqueueflush":"0","httpmaxhdrszpkts":"0","httpmaxhdrfldlenpkts":"0","tcpmaxooopkts":"0","curtflags":"0","totsvrttlbtransactions":"0"}'
    key:
      - name
      - throughput
      - throughputrate
      - avgsvrttfb
cves: []
detections:
  - title: Web App Firewall blocked a request
    severity: medium
    signals:
      - message
    why: An APPFW event with <blocked> means a request matched an attack check (cross-site scripting, SQL injection, illegal start URL and so on) and was stopped. Many blocks from one client are a scan or an attack against the published application.
    kql: |
      dataset="citrix-adc_logs"
      | where sourcetype == "citrix_adc" and message contains "APPFW" and message contains "<blocked>"
      | project _time, message
    mitre:
      - T1190
optimizations: []
references:
  - title: NetScaler documentation
    url: https://docs.netscaler.com/
