summary: Mcafee Epo is logged by the Splunk Connect for Syslog package mcafee_epo. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: mcafee_epo
    desc: 'Splunk Connect for Syslog fixture, 6 events. Upstream: tests/test_mcafee_epo.py'
facts:
  Where the sample comes from: Splunk Connect for Syslog
  Integration package: mcafee_epo
  Sourcetypes: '1'
  Fixture events: '6'
  Log format seen: xml
  Fields in the first fixture: 29, MachineName, AgentGUID, IPAddress, OSName, UserName
placement:
  slots:
    - edge
  items:
    - slot: edge
      title: Splunk Connect for Syslog
      desc: Fixtures were harvested from splunk/splunk-connect-for-syslog. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Mcafee Epo events in this library are the test fixtures shipped with splunk/splunk-connect-for-syslog (d861082778). The first event carries 29, MachineName, AgentGUID, IPAddress, OSName, UserName. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - xml
  flow:
    - step: Collect
      desc: The Splunk Connect for Syslog package reads mcafee_epo and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as xml.
