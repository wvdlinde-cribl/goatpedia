summary: 'Apache Hadoop is the data-processing platform. YARN is the part that schedules applications on the cluster. The ResourceManager keeps one report per application: the type, the queue, the user, the final status and the memory it used. This stream is that report, one JSON object per application. A collector reads it from the ResourceManager. The sample is a MapReduce job that succeeded.'
sourcetypes:
  - st: hadoop_application
    desc: One YARN application report. id, name, queue, applicationType and finalStatus say which job ran, where, and how it ended.
facts:
  Product: Apache Hadoop. This stream is the YARN ResourceManager's report of one application.
  Where it runs: A Hadoop cluster. The ResourceManager is the scheduler. Application masters run on the worker nodes.
  Log transport: The ResourceManager exposes application reports as JSON on its HTTP API. A collector polls that API.
  Log format: One JSON object per application. id is the application id. finalStatus is how it ended.
  What a report answers: Which application ran, in which queue, as what type, whether it succeeded, and how much memory and how many cores it was given
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: YARN ResourceManager
      desc: The ResourceManager schedules applications on the cluster and serves the application report. amHostHttpAddress is the node that ran the application master.
howItWorks:
  - title: An application
    body: A person or a scheduler submits an application. applicationType is MAPREDUCE, SPARK or another engine. name is the job name. queue is the YARN queue. user is in the application-master log URL when the report includes it. id is the application id, which embeds the cluster timestamp.
  - title: How it ended
    body: finalStatus is SUCCEEDED, FAILED or KILLED once the application is finished. state would say RUNNING while it is live. elapsedTime, allocatedMB and allocatedVCores are the size. The sample is a succeeded MapReduce application named wordcount, in the default queue, whose final status is SUCCEEDED.
  - title: How a collector reads it
    body: The ResourceManager serves the report over HTTP. A collector polls the application list and can forward each object anywhere. The cluster does not choose the destination.
traffic:
  handles:
    - YARN applications
    - Queue, type and final status
    - Memory and core allocation
  flow:
    - step: A job is submitted
      desc: An application is submitted to the ResourceManager and placed in a queue.
    - step: The ResourceManager records it
      desc: The application report carries the id, the type, the queue, the allocation and the final status.
    - step: Collector polls
      desc: A collector reads the JSON report and can forward it anywhere.
logs:
  - type: YARN application
    sourcetype: hadoop_application
    format: json
    desc: One application report. id and name identify the job. applicationType and queue say what ran and where. finalStatus is how it ended. This sample is a succeeded MapReduce word-count job.
