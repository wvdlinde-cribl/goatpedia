summary: A minimalist, self-hosted RSS and Atom feed reader. It polls the feeds a user subscribes to and stores each new article as an entry. Security teams use it to follow advisory, exploit and vendor feeds, and pull the entries from its API. Each entry gives the title, link, publication date, feed and read status.
sourcetypes:
  - st: miniflux_feed_entry
    desc: Feed entries stored by Miniflux, one article from a subscribed feed with title, URL, content, dates and read status
facts:
  Product: Self-hosted RSS, Atom and JSON Feed reader
  Deployment: Single Go binary or container with a PostgreSQL database
  Log transport: Miniflux REST API polled by a collector with an API token
  Log format: One JSON object per entry
  What an entry answers: Which article appeared in which feed, when it was published, and whether the user has read it
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Miniflux server
      desc: Miniflux runs on a small server or container, often inside the company network. Entries live in its database and are read through its API.
    - slot: cloud
      title: Subscribed feeds
      desc: Miniflux fetches feeds from publishers on the internet, such as advisory and exploit sites.
howItWorks:
  - title: Polling feeds
    body: Miniflux polls each subscribed feed on a schedule. Each new item becomes an entry with id, feed_id, user_id, hash, title, url, content and published_at.
  - title: Reading and the API
    body: Users read entries in the web UI, which changes status from unread to read. The REST API returns entries with the same fields, so a collector can pull new items, for example from threat-intelligence feeds.
traffic:
  handles:
    - RSS and Atom feed polling
    - Article storage and reading
  flow:
    - step: Feed polled
      desc: Miniflux fetches a subscribed feed and finds a new item.
    - step: Entry stored
      desc: The item is saved as an entry for the user.
    - step: Collector reads JSON
      desc: A collector calls the entries API. Goatpedia reads each entry as JSON.
logs:
  - type: Feed entries
    sourcetype: miniflux_feed_entry
    format: json
