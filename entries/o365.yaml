id: o365
name: Microsoft 365 (Office 365) Audit
short: M365
aka:
  - Office 365
  - O365
  - Microsoft Purview Audit
  - Unified Audit Log (UAL)
  - Office 365 Management Activity API
  - Exchange Online Message Trace
vendor: Microsoft
category: saas
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - saas
