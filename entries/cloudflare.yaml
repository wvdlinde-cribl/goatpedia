id: cloudflare
name: Cloudflare
short: Cloudflare
vendor: Cloudflare
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Cloudflare Logpull
  - Cloudflare CDN
tags:
  - cdn
  - waf
  - reverse-proxy
  - ddos
  - json
summary: A global reverse-proxy network that sits in front of websites and APIs as a CDN, WAF, bot manager and DDoS shield. Every request to a proxied zone passes through a Cloudflare edge data centre, which decides whether to serve it from cache, challenge it, block it or pass it to the origin. Logpull lets an Enterprise zone fetch those HTTP request logs as JSON over the Cloudflare API.
sourcetypes:
  - st: cloudflare_logpull
    desc: HTTP request logs for one zone, pulled from the Cloudflare API, one record per request handled at the edge
facts:
  Product: CDN, web application firewall, bot management and DDoS protection delivered as a reverse proxy
  Form factor: Cloud service; customers point DNS for their zone at Cloudflare
  Log transport: HTTPS pull from the Logpull API (Enterprise plans), with a time window per request
  Log format: Newline-delimited JSON, one object per request, with the fields the caller asks for
  What a request record answers: Who asked for what (client IP, country, ASN, host, path, user agent), how the edge handled it (cache status, firewall action, bot score) and what the origin answered
placement:
  slots:
    - cloud
    - internal
  items:
    - slot: cloud
      title: Cloudflare edge
      desc: Requests for the zone land on the nearest Cloudflare data centre (EdgeColoID). The edge applies cache, firewall, bot and rate-limit rules and stores a record of each request.
    - slot: internal
      title: Origin servers
      desc: Requests that are not served or stopped at the edge are forwarded to the customer's origin. Origin response fields in the record describe that leg.
howItWorks:
  - title: Edge decisions
    body: For each request the edge decides a pathing operation. EdgePathingSrc says which feature decided (for example filter_based_firewall), EdgePathingOp what it did (ban, wl, chl) and EdgePathingStatus the detail, such as a new captcha challenge. Cache fields say whether the response came from cache.
  - title: Bot and client signals
    body: Cloudflare scores each request for bot likelihood (BotScore, BotScoreSrc), classifies the client IP (ClientIPClass) and records country and ASN. These help separate verified crawlers from automation.
  - title: How the logs leave Cloudflare
    body: Logpull is a pull model. A collector holding an API token calls the zone's logs/received endpoint with a start and end time and a field list, and receives NDJSON. Logpush, which pushes the same data to storage or an HTTP endpoint, is the newer alternative.
traffic:
  handles:
    - HTTP and HTTPS requests to proxied zones
    - Firewall, bot and rate-limit decisions
    - Cache hits and misses
  flow:
    - step: Visitor requests
      desc: A browser, bot or API client sends a request to a hostname in the zone.
    - step: Edge handles it
      desc: The Cloudflare data centre applies firewall and bot rules, then serves from cache or forwards to the origin.
    - step: Request recorded
      desc: The edge stores one log record with client, request, edge decision and origin fields.
    - step: Collector pulls
      desc: A collector requests a time window from the Logpull API and receives one JSON object per request.
logs:
  - type: HTTP requests
    sourcetype: cloudflare_logpull
    format: json
    desc: One object per request. ClientIP, ClientCountry and ClientRequestHost/ClientRequestURI say who asked for what. EdgePathingSrc, EdgePathingOp and EdgePathingStatus show the edge decision, here a firewall filter that served a new captcha. BotScore and BotScoreSrc rate the client. The client address is a documentation address.
    sample: '{"BotScore":20,"BotScoreSrc":"Verified Bot","CacheCacheStatus":"unknown","CacheResponseBytes":0,"CacheResponseStatus":0,"CacheTieredFill":false,"ClientASN":15169,"ClientCountry":"us","ClientDeviceType":"desktop","ClientIP":"192.0.2.10","ClientIPClass":"noRecord","ClientRequestBytes":2577,"ClientRequestHost":"cf-analytics.com","ClientRequestMethod":"POST","ClientRequestPath":"/wp-cron.php","ClientRequestProtocol":"HTTP/1.1","ClientRequestReferer":"https://cf-analytics.com/wp-cron.php?doing_wp_cron=1564759748.3962020874023437500000","ClientRequestURI":"/wp-cron.php?doing_wp_cron=1564759748.3962020874023437500000","ClientRequestUserAgent":"WordPress/5.2.2;https://cf-analytics.com","ClientSSLCipher":"ECDHE-ECDSA-AES128-GCM-SHA256","ClientSSLProtocol":"TLSv1.2","ClientSrcPort":55028,"EdgeColoID":14,"EdgeEndTimestamp":"2019-08-02T15:29:08Z","EdgePathingOp":"ban","EdgePathingSrc":"filter_based_firewall","EdgePathingStatus":"captchaNew","EdgeRateLimitAction":"","EdgeRateLimitID":0,"EdgeRequestHost":""}'
    key:
      - BotScore
      - BotScoreSrc
      - CacheCacheStatus
      - CacheResponseBytes
cves: []
detections:
  - title: Request stopped or challenged by the firewall
    severity: low
    signals:
      - EdgePathingSrc
      - EdgePathingOp
      - EdgePathingStatus
      - ClientIP
      - ClientRequestURI
    why: Requests the edge banned or challenged are the ones its firewall rules flagged. A surge from one client or ASN, or against one path such as a login page, is an attack on the site that the edge is absorbing.
    kql: |
      dataset="cloudflare_logs"
      | where sourcetype == "cloudflare_logpull" and EdgePathingOp in ("ban", "chl")
      | project EdgeEndTimestamp, ClientIP, ClientCountry, ClientRequestHost, ClientRequestURI, EdgePathingSrc, EdgePathingStatus
    mitre:
      - T1190
optimizations:
  - title: Drop cache hits for static content
    saving: much of the request volume on cache-heavy sites
    fn: Drop
    how: Cached static assets make up a large share of requests and say little about security. Keep misses, dynamic requests and anything the firewall acted on.
    expr: CacheCacheStatus == 'hit' && EdgePathingSrc != 'filter_based_firewall'
    stream:
      log: HTTP requests
      functions:
        - id: drop
          filter: CacheCacheStatus == 'hit' && EdgePathingSrc != 'filter_based_firewall'
          description: Drop cache hits for static content unless the firewall acted on the request
          conf: {}
      test:
        - '{"BotScore":20,"BotScoreSrc":"Verified Bot","CacheCacheStatus":"hit","CacheResponseBytes":0,"CacheResponseStatus":0,"CacheTieredFill":false,"ClientASN":15169,"ClientCountry":"us","ClientDeviceType":"desktop","ClientIP":"192.0.2.10","ClientIPClass":"noRecord","ClientRequestBytes":2577,"ClientRequestHost":"example.com","ClientRequestMethod":"GET","ClientRequestPath":"/static/app.js","ClientRequestProtocol":"HTTP/1.1","ClientRequestReferer":"https://example.com/","ClientRequestURI":"/static/app.js","ClientRequestUserAgent":"Mozilla/5.0","ClientSSLCipher":"ECDHE-ECDSA-AES128-GCM-SHA256","ClientSSLProtocol":"TLSv1.2","ClientSrcPort":55028,"EdgeColoID":14,"EdgeEndTimestamp":"2019-08-02T15:29:08Z","EdgePathingOp":"wl","EdgePathingSrc":"macro","EdgePathingStatus":"nr","EdgeRateLimitAction":"","EdgeRateLimitID":0,"EdgeRequestHost":""}'
        - '{"BotScore":20,"BotScoreSrc":"Verified Bot","CacheCacheStatus":"hit","CacheResponseBytes":0,"CacheResponseStatus":0,"CacheTieredFill":false,"ClientASN":15169,"ClientCountry":"us","ClientDeviceType":"desktop","ClientIP":"192.0.2.11","ClientIPClass":"noRecord","ClientRequestBytes":2577,"ClientRequestHost":"example.com","ClientRequestMethod":"GET","ClientRequestPath":"/static/app.js","ClientRequestProtocol":"HTTP/1.1","ClientRequestReferer":"https://example.com/","ClientRequestURI":"/static/app.js","ClientRequestUserAgent":"Mozilla/5.0","ClientSSLCipher":"ECDHE-ECDSA-AES128-GCM-SHA256","ClientSSLProtocol":"TLSv1.2","ClientSrcPort":55028,"EdgeColoID":14,"EdgeEndTimestamp":"2019-08-02T15:29:08Z","EdgePathingOp":"ban","EdgePathingSrc":"filter_based_firewall","EdgePathingStatus":"captchaNew","EdgeRateLimitAction":"","EdgeRateLimitID":0,"EdgeRequestHost":""}'
      expect:
        out: 2
references:
  - title: Cloudflare Logpull
    url: https://developers.cloudflare.com/logs/logpull/
  - title: Cloudflare Logs
