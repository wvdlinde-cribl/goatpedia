howItWorks:
  - title: What the fixture shows
    body: Vectra events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries event_data.country, event_data.device_name, event_data.city, event_data.user, event_timestamp, message. Values in the sample were rewritten to documentation addresses.
