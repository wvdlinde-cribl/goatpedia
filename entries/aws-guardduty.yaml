id: aws-guardduty
name: Amazon GuardDuty
short: GuardDuty
aka:
  - AWS GuardDuty
  - GuardDuty Runtime Monitoring
  - GuardDuty Malware Protection
  - GuardDuty Extended Threat Detection
vendor: Amazon Web Services
category: cloud
status: full
updated: "2026-11-12"
contributors:
