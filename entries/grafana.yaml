id: grafana
name: Grafana
short: Grafana
vendor: Grafana Labs
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Grafana OSS
  - Grafana Enterprise
  - Grafana Cloud
tags:
  - observability
  - dashboard
  - json
summary: Grafana is the dashboard and visualization server from Grafana Labs. People query data sources and open dashboards in it. The server writes its own log as JSON, one object per line, with a level, a logger and a message. This stream is that server log. A collector tails the file or reads the process output. The sample is an informational line from startup.
sourcetypes:
  - st: grafana
    desc: One line of the Grafana server log. level, logger and msg say how serious it is and which part of the server wrote it.
facts:
  Product: Dashboard server. It queries data sources and serves dashboards. This stream is the server's own log, not the metrics it displays.
  Form factor: A server you run, or Grafana Cloud
  Log transport: The server writes JSON to its log file or to standard output. A collector tails that output.
  Log format: One JSON object per line. level is info, warn or error. logger is the component. msg is the sentence.
  What a line answers: What the server was doing, at which severity, in which component, and which version if the line is from startup
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Grafana server
      desc: The process serves the UI and writes the JSON log locally. version, commit and branch on a startup line identify the build.
    - slot: cloud
      title: Grafana Cloud
      desc: Grafana Cloud runs the same server. The log line has the same shape. A collector reads whichever place you run.
howItWorks:
  - title: The server log
    body: Each line is one thing the process did. level is the severity. logger is the subsystem, such as settings or the HTTP server. msg is the text. A startup line also carries version, commit, branch and compiled. The sample is level info, logger settings, message Starting Grafana, version 12.3.2.
  - title: Process log
    body: These lines are the Grafana process talking about itself. A startup line names the build. An error line names the component that failed. The charts people open are served by this same process.
  - title: How the lines leave
    body: Grafana writes the JSON itself. Any collector that can tail a file or a container's output can take it.
traffic:
  handles:
    - Server startup and configuration
    - Component errors and warnings
    - The build version on a startup line
  flow:
    - step: The server runs
      desc: Grafana starts, serves a request, or hits an error in a component.
    - step: It writes one JSON line
      desc: level, logger and msg describe that moment. A startup line adds the version.
    - step: Collector tails it
      desc: A collector reads the log and can forward each object anywhere.
logs:
  - type: Server log
    sourcetype: grafana
    format: json
    desc: One JSON line from the Grafana process. level is the severity, logger is the component, msg is the text. This sample is an info line that says the server is starting, and it names version 12.3.2.
    sample: '{"branch":"release-12.3.2","commit":"df2547decd50d14defa20ec9ce1c2e2bc9462d72","compiled":"2026-02-16T20:59:06Z","level":"info","logger":"settings","msg":"Starting Grafana","t":"2026-02-16T20:59:06.216437276Z","version":"12.3.2"}'
    key:
      - branch
      - commit
      - compiled
      - level
cves: []
detections: []
optimizations: []
references:
  - title: Configure Grafana
    url: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
