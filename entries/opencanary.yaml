id: opencanary
name: OpenCanary
short: OpenCanary
vendor: Thinkst Applied Research
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Thinkst OpenCanary
tags:
  - honeypot
  - deception
  - open-source
  - json
summary: 'An open-source network honeypot daemon from Thinkst. It runs fake services such as SSH, FTP, HTTP, SMB, RDP and MySQL on an internal host, and nobody legitimate has a reason to touch them. Every connection or login attempt is logged as a JSON event with the source address, so its events are high-signal: a hit usually means scanning or lateral movement.'
sourcetypes:
  - st: opencanary
    desc: 'OpenCanary events: service interactions and login attempts against the fake services, plus the daemon''s own status and errors'
facts:
  Product: Low-interaction honeypot that emulates common network services
  Form factor: Python daemon on a Linux host, VM or container, configured with opencanary.conf
  Log transport: 'Python logging handlers: local file, syslog, or webhooks and other handlers set in the config'
  Log format: One JSON object per event with logtype, src_host, dst_host, dst_port, node_id and logdata
  What an interaction answers: Which address touched which fake service on which canary, and what it sent, such as a username and password
placement:
  slots:
    - internal
    - dmz
  items:
    - slot: internal
      title: Canary host
      desc: OpenCanary runs on an ordinary-looking host inside the network, often in a server or user VLAN. It is not advertised, so any connection to it is suspicious.
    - slot: dmz
      title: Canary in the DMZ
      desc: A canary can also sit in the DMZ to catch scanning from a compromised public-facing system.
howItWorks:
  - title: Fake services
    body: Each enabled module listens on its port and responds like the real service. When something connects, logs in or sends a request, the module writes an event.
  - title: Log types
    body: logtype is a numeric code for the kind of event, such as a service login attempt or a port scan. logdata holds what was captured. node_id names the canary.
  - title: How the events leave the product
    body: OpenCanary uses Python logging. Handlers in the config send events to a file, syslog, a webhook or other destinations. Any collector can receive them.
traffic:
  handles:
    - Fake SSH, FTP, HTTP, SMB, RDP, MySQL and other services
    - Login attempts
    - Port scans
  flow:
    - step: Attacker probes
      desc: A scanner or an intruder connects to a service on the canary.
    - step: Module logs
      desc: The service module records the source, destination port and data such as credentials.
    - step: Handler sends
      desc: A logging handler writes the JSON event to file, syslog or a webhook.
logs:
  - type: Canary events
    sourcetype: opencanary
    format: json
    desc: One JSON object per event. src_host and src_port are who connected, dst_host and dst_port the fake service, logtype the kind of event, and logdata what was captured. This sample is the daemon reporting an internal error, so the source and destination are empty.
    sample: '{"dst_host":"","dst_port":-1,"level":"error","local_time":"2025-05-21 02:39:04.811038","local_time_adjusted":"2025-05-21 02:39:04.811046","logdata":"Error processing LLMNR response: list index out of range","logtype":null,"node_id":"opencanary-1","src_host":"","src_port":-1,"utc_time":"2025-05-21 02:39:04.811044"}'
    key:
      - dst_host
      - dst_port
      - level
      - local_time
cves: []
detections:
  - title: Something touched a honeypot
    severity: high
    signals:
      - src_host
      - dst_port
      - logtype
      - node_id
    why: No legitimate user or system should connect to a canary. An event with a source address is scanning or lateral movement until proven otherwise.
    kql: |
      dataset="opencanary_logs"
      | where sourcetype == "opencanary" and src_host != ""
      | project utc_time, node_id, src_host, dst_port, logtype, logdata
    mitre:
      - T1046
optimizations: []
references:
  - title: OpenCanary documentation
    url: https://opencanary.readthedocs.io/
  - title: OpenCanary source
    url: https://github.com/thinkst/opencanary
