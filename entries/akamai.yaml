    key:
      - attackData.appliedAction
      - attackData.clientIP
      - attackData.configId
      - attackData.policyId
cves: []
detections:
  - title: Request denied at the edge
    severity: medium
    signals:
      - attackData.appliedAction
      - attackData.clientIP
      - httpMessage.host
      - httpMessage.path
    why: An applied action other than monitoring or alert means a rule acted on the request. Many denied requests from one client or against one path are an attack in progress.
    kql: |
      dataset="akamai_logs"
      | where sourcetype == "akamai_siem" and attackData.appliedAction != "alert" and attackData.appliedAction != "monitor"
      | project httpMessage.start, attackData.appliedAction, attackData.clientIP, httpMessage.host, httpMessage.path, attackData.policyId
    mitre:
      - T1190
optimizations: []
references: []
