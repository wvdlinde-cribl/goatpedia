id: akamai
name: Akamai App & API Protector
short: Akamai WAF
vendor: Akamai Technologies
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Akamai SIEM Integration
  - Kona Site Defender
  - Akamai Bot Manager
tags:
  - waf
  - cdn
  - bot-management
  - web
  - json
summary: Akamai's web application firewall and bot protection, which runs on the Akamai edge in front of a customer's websites and APIs. Each request is checked against security configurations and policies, and rules can alert, deny, tarpit or otherwise act on it. The SIEM Integration API returns one JSON security event per request that triggered a rule, with the client, the HTTP request and the rules that matched.
sourcetypes:
  - st: akamai_siem
    desc: Security events from Akamai's edge for requests that triggered WAF, API or bot rules, with client, request, geo and applied action
facts:
  Product: Edge web application firewall, API protection and bot management on the Akamai CDN
  Placement: Reverse proxy on Akamai edge servers in front of the origin
  Log transport: HTTPS pull from the Akamai SIEM Integration API with EdgeGrid credentials, per security configuration
  Log format: One JSON object per security event. Rule fields inside attackData are URL-encoded, base64 lists separated by semicolons
  What a security event answers: Which client hit which host and path, which rules matched, and what Akamai did with the request
placement:
  slots:
    - edge
    - cloud
  items:
    - slot: edge
      title: Akamai edge servers
      desc: Requests to the protected sites and APIs reach an Akamai edge server first. The security policy runs there before anything is forwarded to the origin.
    - slot: cloud
      title: SIEM Integration API
      desc: Akamai keeps security events per security configuration. A collector pulls them from the SIEM Integration API using an offset.
howItWorks:
  - title: Security configurations and policies
    body: A security configuration (configId) holds one or more security policies (policyId) mapped to hostnames and paths. A policy turns on WAF rule sets, rate controls, API protections and bot detections, and sets the action for each, such as alert, deny or tarpit.
  - title: One event per triggering request
    body: When a request triggers rules, Akamai records one event for it. attackData lists every rule that matched with its action, message, tag and the data that triggered it, plus appliedAction, the action actually taken. httpMessage holds the request and response status, geo the client location, identity the TLS fingerprints.
  - title: Encoded rule lists
    body: The rule fields are lists. Each value is base64, the list is separated by semicolons, and the whole string is URL-encoded. A parser has to URL-decode, split and base64-decode them to read the rule ids and messages.
  - title: How the events leave the product
    body: A collector calls the SIEM Integration API for a configuration id with EdgeGrid authentication. Each response is newline-delimited JSON plus an offset for the next call.
traffic:
  handles:
    - HTTP and HTTPS requests to protected websites and APIs
    - Bot and automated client traffic
  flow:
    - step: Client requests
      desc: A browser, bot or API client sends a request to a hostname served by Akamai.
    - step: Edge evaluates
      desc: The edge server runs the security policy and records the rules that matched and the action taken.
    - step: Collector pulls
      desc: A collector requests new events for the configuration from the SIEM Integration API.
    - step: Events are JSON
      desc: Each event is one JSON object with attackData, httpMessage, geo and identity.
logs:
  - type: Security events
    sourcetype: akamai_siem
    format: json
    desc: One object per request that triggered rules. attackData.appliedAction is what Akamai did (tarpit here), attackData.clientIP who sent it, attackData.rules and ruleMessages the encoded rule list. httpMessage gives host, path, method and status. The client is a documentation address.
