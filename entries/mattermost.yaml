    desc: 'Elastic integrations fixture, 20 events. Upstream: mattermost/data_stream/audit/_dev/test/pipeline/test-audit.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: mattermost
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: json
  Fields in the first fixture: timestamp, event, status, user_id, session_id, ip_address
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Mattermost events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries timestamp, event, status, user_id, session_id, ip_address. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads mattermost and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
