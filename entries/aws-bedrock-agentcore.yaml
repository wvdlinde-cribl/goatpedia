id: aws-bedrock-agentcore
name: Amazon Bedrock AgentCore
short: AgentCore
vendor: Amazon Web Services
category: edr
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - AWS Bedrock AgentCore
  - AgentCore
tags:
  - ai
  - agents
  - aws
  - cloud
  - json
summary: An AWS service for running AI agents in production. Runtime hosts the agent code in isolated sessions, Gateway turns APIs and Lambda functions into tools the agent can call, and Memory stores conversation history and long-term facts. Each component writes application logs in an OpenTelemetry-style JSON record to CloudWatch Logs, with the resource ARN, session, trace and the log body.
sourcetypes:
  - st: aws_bedrock_agentcore_gateway_application_logs
    desc: Application logs from an AgentCore Gateway, such as tool requests routed to targets, with request id, trace and error flag
  - st: aws_bedrock_agentcore_memory_application_logs
    desc: Application logs from AgentCore Memory, such as conversation history processed for a namespace, actor and session
  - st: aws_bedrock_agentcore_runtime_application_logs
    desc: Application logs from AgentCore Runtime, one record per agent invocation step with session, operation, prompt and response
facts:
  Product: Managed runtime, tool gateway and memory for AI agents
  Components: Runtime, Gateway, Memory, Identity, Code Interpreter, Browser and Observability
  Log transport: Application logs delivered to CloudWatch Logs (vended logs), also to S3 or Firehose
  Log format: One JSON object per log record with resource_arn, event_timestamp, trace and span ids, severity and body
  What a gateway log answers: Which tool was called through which gateway and target, and whether it failed
  What a memory log answers: Which actor and session had memory read or written, under which namespace
  What a runtime log answers: Which agent session ran which operation with what prompt and response
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: AgentCore in the AWS account
      desc: Runtime, Gateway and Memory resources run in an AWS region in the customer's account. Their logs go to CloudWatch Logs in the same account.
howItWorks:
  - title: Runtime
    body: An agent is deployed to a Runtime and called with InvokeAgentRuntime. Each call runs in a session. Logs carry the session_id, the operation and the request and response payloads.
  - title: Gateway
    body: A Gateway exposes targets (APIs, Lambda functions) as tools. When the agent calls a tool, the gateway logs which tool and target it processed, with body.isError when it fails.
  - title: Memory
    body: Memory stores conversations per actor and session, under a namespace, and memory strategies extract long-term records. Logs show which namespace, actor and strategy were processed.
  - title: How the logs leave the service
    body: Log delivery is configured per resource to CloudWatch Logs, S3 or Firehose. Records are OpenTelemetry-shaped, with trace_id and span_id for correlation. Any collector can read them.
traffic:
  handles:
    - Agent invocations and sessions
    - Tool calls through the gateway
    - Short- and long-term agent memory
  flow:
    - step: Agent is called
      desc: An application invokes an agent runtime with a prompt.
    - step: Agent works
      desc: The agent calls tools through a Gateway and reads or writes Memory.
    - step: Components log
      desc: Runtime, Gateway and Memory each write application log records to the configured destination.
logs:
  - type: Gateway logs
    sourcetype: aws_bedrock_agentcore_gateway_application_logs
    format: json
    desc: One record per gateway log message. resource_arn names the gateway, body.log the message (a tool request here), body.isError whether it failed, trace_id the trace.
    sample: '{"resource_arn":"arn:aws:bedrock-agentcore:us-west-2:845123678901:gateway/ordermanager-gw-abc12def34","event_timestamp":1768432156789,"body":{"isError":false,"log":"Processing request for tool DocumentRetrieval___fetch_order_details from target XYZPROD001","id":"7"},"account_id":"845123678901","request_id":"a1b2c3d4-5678-9012-ef34-567890abcdef","trace_id":"8e45f912abcd3456ef7890123456abcd","span_id":"9f8e7d6c5b4a3210","resource":{"attributes":{"service.name":"ordermanager-gw-abc12def34","cloud.resource_id":"arn:aws:bedrock-agentcore:us-west-2:845123678901:gateway/ordermanager-gw-abc12def34","cloud.platform":"aws_bedrock_agentcore"}},"attributes":{"aws.request.id":"a1b2c3d4-5678-9012-ef34-567890abcdef","aws.account.id":"845123678901","aws.resource.type":"AWS2001:db8::1BedrockAgentCore2001:db8::1Gateway"},"timeUnixNano":1768432156789123600,"severityNumber":9,"severityText":"INFO","traceId":"8e45f912abcd3456ef7890123456abcd","spanId":"9f8e7d6c5b4a3210"}'
    key:
      - resource_arn
      - event_timestamp
      - body.isError
      - body.log
  - type: Memory logs
    sourcetype: aws_bedrock_agentcore_memory_application_logs
    format: json
    desc: One record per memory log message. namespace, actor_id and session_id say whose memory, memory_strategy_id which strategy, body.log what was done. This sample processes conversation history.
    sample: '{"resource_arn":"arn:aws:bedrock-agentcore:eu-west-1:912345678012:memory/salesassistant-8k2pq9RtyH","event_timestamp":1769543217654,"memory_strategy_id":"conversation_history-7bXy4m89KL","namespace":"sales/customer/PREMIUM/history","actor_id":"PREMIUM","session_id":"c4e8a2f1-9d3b-4567-a890-def123456789","body":{"log":"Processing conversation history for customer context retrieval.","requestId":"89ab12cd-ef34-5678-90ab-cdef12345678","isError":false,"currentConversations":[{"role":"USER","content":{"text":"Can you show me the latest pricing for enterprise plans?"}},{"role":"ASSISTANT","content":{"text":"I''d be happy to help you with enterprise pricing information. Based on your account status as a Premium customer, I can offer you our special enterprise rates."}}]},"resource":{"attributes":{"service.name":"salesassistant-8k2pq9RtyH","cloud.resource_id":"arn:aws:bedrock-agentcore:eu-west-1:912345678012:memory/salesassistant-8k2pq9RtyH","cloud.platform":"aws_bedrock_agentcore"}},"attributes":{"aws.resource.type":"AWS2001:db8::1BedrockAgentCore2001:db8::1Memory","aws.agentcore.memory.namespace":"sales/customer/PREMIUM/history","session.id":"c4e8a2f1-9d3b-4567-a890-def123456789","actor.id":"PREMIUM"},"timeUnixNano":1769543217654321200,"severityNumber":9,"severityText":"INFO"}'
    key:
      - resource_arn
      - event_timestamp
      - memory_strategy_id
      - namespace
  - type: Runtime logs
    sourcetype: aws_bedrock_agentcore_runtime_application_logs
    format: json
    desc: One record per runtime log message. resource_arn names the agent runtime, operation the call (InvokeAgentRuntime), session_id the session, body the request prompt and response payload.
    sample: '{"resource_arn":"arn:aws:bedrock-agentcore:us-east-1:627286350132:runtime/customersupport-3OutfrDDJ2","event_timestamp":1763962578048,"account_id":"627286350132","request_id":"083603b2-7b75-46ba-bf61-45c562764b68","session_id":"76d5c1a5-df2d-4299-b536-9f0302e344ab","span_id":"c128b28261d25f39","trace_id":"61fae24cf690c9866936148344883db0","service_name":"AgentCoreCodeRuntime","operation":"InvokeAgentRuntime","resource":{"attributes":{"cloud.provider":"aws","service.name":"customersupport.DEFAULT","cloud.resource_id":"arn:aws:bedrock-agentcore:us-east-1:627286350132:runtime/customersupport-3OutfrDDJ9","cloud.platform":"aws_bedrock_agentcore"}},"attributes":{"aws.operation.name":"InvokeAgentRuntime","aws.request.id":"083603b2-7b75-46ba-bf61-45c562764b68","aws.account.id":"627286350132","aws.resource.type":"AWS2001:db8::1BedrockAgentCore2001:db8::1Runtime","session.id":"76d5c1a5-df2d-4299-b536-9f0302e344ab"},"timeUnixNano":1763962575492617000,"severityNumber":9,"severityText":"INFO","body":{"request_payload":{"prompt":"Summarize my previous conversation","actor_id":"DEFAULT"},"response_payload":[{"role":"assistant","content":"Here is your summary of the previous conversation."},{"role":"assistant","content":"Is there anything else you would like to know?"}]},"traceId":"61fae24cf690c9866936148344883db1","spanId":"c128b28261d25f34"}'
    key:
      - resource_arn
      - event_timestamp
      - account_id
      - request_id
cves: []
detections:
  - title: Gateway tool call failed
    severity: low
    signals:
      - body.isError
      - resource_arn
      - body.log
    why: Repeated tool errors can mean a broken target or an agent being pushed to call tools it should not.
    kql: |
      dataset="aws-bedrock-agentcore_logs"
      | where sourcetype == "aws_bedrock_agentcore_gateway_application_logs" and body.isError == true
      | project event_timestamp, resource_arn, body.log, request_id, trace_id
optimizations: []
references: []
