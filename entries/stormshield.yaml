summary: Stormshield is logged by the Elastic integrations package stormshield. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: stormshield
    desc: 'Elastic integrations fixture, 20 events. Upstream: stormshield/data_stream/log/_dev/test/pipeline/test-firewall.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: stormshield
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: kv
  Fields in the first fixture: id, time, fw, tz, startime, SavedEvaluation
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Stormshield events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries id, time, fw, tz, startime, SavedEvaluation. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - kv
  flow:
    - step: Collect
      desc: The Elastic integrations package reads stormshield and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as kv.
