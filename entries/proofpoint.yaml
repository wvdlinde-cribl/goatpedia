id: proofpoint
name: Proofpoint Email Protection & TAP
short: Proofpoint
aka:
  - Proofpoint Protection Server (PPS)
  - Proofpoint on Demand (PoD)
  - Proofpoint Enterprise Protection
  - Targeted Attack Protection (TAP)
  - URL Defense
  - TAP SIEM API
vendor: Proofpoint
category: email
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - email
  - secure-email-gateway
