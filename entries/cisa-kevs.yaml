id: cisa-kevs
name: CISA Known Exploited Vulnerabilities Catalog
short: CISA KEV
vendor: CISA
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - KEV catalog
  - Known Exploited Vulnerabilities
  - Cybersecurity and Infrastructure Security Agency KEV
tags:
  - threat-intel
  - vulnerability
  - feed
  - json
summary: The Known Exploited Vulnerabilities (KEV) catalog is a list published by the US Cybersecurity and Infrastructure Security Agency (CISA) of vulnerabilities that are confirmed to be exploited in the wild. US federal agencies must remediate each entry by its due date, and many other organisations use the list to decide what to patch first. Each entry names the CVE, the vendor and product, what the flaw is, the required action, the due date and whether it is known to be used in ransomware campaigns.
sourcetypes:
  - st: cisa_kevs_vulnerability
    desc: KEV catalog entries, one record per exploited vulnerability with CVE id, vendor, product, name, date added, description, required action, due date, ransomware use and notes
facts:
  Product: Public catalog of vulnerabilities with confirmed exploitation, maintained by CISA
  Audience: Mandatory for US federal civilian agencies under Binding Operational Directive 22-01, widely used elsewhere for patch prioritisation
  Log transport: HTTPS download of the catalog as JSON or CSV from cisa.gov, fetched by any collector on a schedule
  Log format: The JSON feed wraps a vulnerabilities array. Each entry is one record with cveID, vendorProject, product, vulnerabilityName, dateAdded, shortDescription, requiredAction, dueDate, knownRansomwareCampaignUse and notes
  What an entry answers: Which CVE in which vendor's product is being exploited, since when it is listed, what must be done by when, and whether ransomware operators use it
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: cisa.gov catalog feed
      desc: CISA publishes the catalog on its website as a web page and as JSON and CSV feeds. It is reference data, not a device on the network. A collector downloads it and the entries are joined with vulnerability scan and asset data.
howItWorks:
  - title: How an entry is added
    body: CISA adds a vulnerability when it has an assigned CVE, reliable evidence of active exploitation and clear remediation guidance, such as a vendor update. The entry records the date added and a due date for federal agencies to act.
  - title: What an entry carries
    body: cveID, vendorProject and product identify the flaw and where it lives. vulnerabilityName and shortDescription describe it. requiredAction says what to do, and dueDate by when. knownRansomwareCampaignUse is Known or Unknown. notes links to the vendor advisory.
  - title: How the catalog is consumed
    body: A collector fetches the JSON feed on a schedule and splits it into one record per entry, keeping only entries that are new or changed. The records are then matched against scanner findings or asset inventories to see which exploited vulnerabilities exist in the environment. Any pipeline can do this.
traffic:
  handles:
    - Exploited vulnerability listings
    - Remediation actions and due dates
    - Ransomware use flags
  flow:
    - step: CISA confirms exploitation
      desc: CISA finds reliable evidence that a CVE is being exploited and that remediation exists.
    - step: Catalog is updated
      desc: The entry is added to the catalog web page and the JSON and CSV feeds.
    - step: Collector downloads the feed
      desc: A collector fetches the JSON feed and splits it into one record per vulnerability.
    - step: Entries are joined
      desc: The records are matched against vulnerability scans and asset data to drive patching.
logs:
  - type: KEV entry
    sourcetype: cisa_kevs_vulnerability
    format: json
    desc: One record per catalog entry. cveID, vendorProject and product name the flaw, dateAdded and dueDate the timeline, requiredAction what to do and knownRansomwareCampaignUse whether ransomware uses it. This sample is CVE-2020-3259, a Cisco ASA and FTD information disclosure added in February 2024 and known to be used in ransomware campaigns.
    sample: '{"cveID":"CVE-2020-3259","vendorProject":"Cisco","product":"Adaptive Security Appliance (ASA) and Firepower Threat Defense (FTD)","vulnerabilityName":"Cisco ASA and FTD Information Disclosure Vulnerability","dateAdded":"2024-02-15","shortDescription":"Cisco Adaptive Security Appliance (ASA) and Firepower Threat Defense (FTD) contain an information disclosure vulnerability. An attacker could retrieve memory...","requiredAction":"Apply mitigations per vendor instructions or discontinue use of the product if mitigations are unavailable.","dueDate":"2024-03-07","knownRansomwareCampaignUse":"Known","notes":"https://tools.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-info-disclose-9eJtycMB"}'
    key:
      - cveID
      - vendorProject
      - product
      - vulnerabilityName
cves: []
detections:
  - title: Exploited vulnerability used by ransomware
    severity: medium
    signals:
      - cveID
      - vendorProject
      - product
      - knownRansomwareCampaignUse
      - dueDate
    why: Entries with knownRansomwareCampaignUse Known are the flaws ransomware operators rely on. Joined with scanner findings, they are the first ones to patch, ahead of their due date.
    kql: |
      dataset="cisa-kevs_logs"
      | where sourcetype == "cisa_kevs_vulnerability" and knownRansomwareCampaignUse == "Known"
      | project dateAdded, cveID, vendorProject, product, vulnerabilityName, dueDate
optimizations: []
references:
  - title: Known Exploited Vulnerabilities Catalog
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
