summary: Multi-tenant CRM platform whose security telemetry comes from three API-pulled sources — the LoginHistory and SetupAuditTrail objects (every org) and Event Monitoring EventLogFile CSVs (Shield add-on) covering REST/SOAP/Bulk API calls, Apex execution, callouts, reports and exports. The prime target of 2025's OAuth-token and vishing data-theft campaigns, where the API logs were the only record of what was taken.
sourcetypes:
  - st: salesforce_eventlogfile_restapi
    desc: EventLogFile RestApi / ApexRestApi CSV rows — one per REST request incl. SOQL queries and rows returned
  - st: salesforce_eventlogfile_execution
    desc: EventLogFile ApexExecution CSV rows — Apex entry points, CPU/DB time, SOQL count
  - st: salesforce_eventlogfile_callout
    desc: EventLogFile ApexCallout CSV rows — outbound HTTP callouts from Apex to external endpoints
  - st: salesforce_loginhistory
    desc: LoginHistory object records — every UI, API and OAuth login with IP, country, status and application
  - st: salesforce_setupaudittrail
    desc: SetupAuditTrail object records — admin configuration changes (users, permissions, connected apps, security settings)
  - st: sfdc:logfile
    desc: Splunk Add-on for Salesforce — EventLogFile content
  - st: sfdc:LoginHistory
    desc: Splunk Add-on for Salesforce — LoginHistory object (object inputs are named sfdc:<object_name>)
  - st: sfdc:SetupAuditTrail
    desc: Splunk Add-on for Salesforce — SetupAuditTrail object input (sfdc:<object_name> pattern)
  - st: salesforce_apex
    desc: 'Elastic integrations fixture, 6 events. Upstream: salesforce/data_stream/apex/_dev/test/pipeline/test-apex.log'
  - st: salesforce_aura_request
    desc: 'Elastic integrations fixture, 20 events. Upstream: salesforce/data_stream/aura_request/_dev/test/pipeline/test-aura-request-eventlogfile-sample.log'
  - st: salesforce_login
    desc: 'Elastic integrations fixture, 3 events. Upstream: salesforce/data_stream/login/_dev/test/pipeline/test-login-object.log'
  - st: salesforce_logout
    desc: 'Elastic integrations fixture, 2 events. Upstream: salesforce/data_stream/logout/_dev/test/pipeline/test-logout-eventlogfile.log'
facts:
  First released: 1999 (salesforce.com CRM); Event Monitoring 2015 (API v32.0)
  Delivery model: Multi-tenant SaaS on Salesforce instances / Hyperforce (AWS)
  Log sources: LoginHistory + SetupAuditTrail (all editions), EventLogFile (Event Monitoring / Shield licence), Real-Time Event Monitoring objects
  Log transport: REST API pull (SOQL query + sObject Blob GET of LogFile), OAuth connected app
  Log format: JSON (object records), CSV with header (EventLogFile.LogFile, base64 in the API)
  Latency: Hourly EventLogFile (hourly interval) or next-day daily files; LoginHistory near real time
  Retention: EventLogFile 1 day free / 30 days with Shield; SetupAuditTrail 180 days in the org
  Typical volume: 10k – 50M+ ELF rows/day; RestApi + Api + URI dominate
  Cribl Pack: Salesforce Rest Collector IO (Packs Dispensary) + native Salesforce Source in Cribl Stream
placement:
  slots:
    - cloud
    - remote
    - endpoint
  items:
    - slot: cloud
      title: Salesforce org (Hyperforce)
      desc: The org lives on a Salesforce instance. Logs never leave it by themselves — a collector (Cribl Salesforce Source or REST collector) uses an OAuth connected app to query LoginHistory / SetupAuditTrail and download EventLogFile CSVs.
    - slot: cloud
      title: Integrations & connected apps
      desc: Marketing automation, chat (Drift), data loaders, ETL and AI agents hold OAuth refresh tokens. Their API calls land in RestApi / Api / BulkApi ELF rows under the integration user with a CONNECTED_APP_ID.
    - slot: remote
      title: Users & admins
      desc: Browser and mobile app sessions from anywhere; LoginHistory records each login with SourceIp, CountryIso, LoginType and status. Vishing campaigns target these users to approve a rogue connected app.
    - slot: endpoint
      title: Developer tooling
      desc: Salesforce CLI, Workbench, Data Loader and VS Code extensions run on laptops and authenticate with OAuth — a stolen token from a dev machine looks like a normal API client.
howItWorks:
  - title: Three log families
    body: LoginHistory (logins) and SetupAuditTrail (admin changes) are standard sObjects queried with SOQL in every edition. Event Monitoring adds EventLogFile — 70+ event types (RestApi, API, BulkApi2, ApexExecution, ApexCallout, Report, ReportExport, URI, Login, LoginAs, PermissionUpdate…) written as CSV files, one row per event.
  - title: EventLogFile delivery
    body: A collector queries EventLogFile records (Id, EventType, LogDate, Interval, LogFileFieldNames) and then GETs /sobjects/EventLogFile/<Id>/LogFile to download the CSV. Hourly files appear within ~3–6 h; daily files the next day. Each EventType has its own column set — the header row (LogFileFieldNames) is the schema.
  - title: Correlation keys
    body: REQUEST_ID ties all events in one transaction (an API call that triggers Apex that makes a callout). SESSION_KEY groups a session; LOGIN_KEY ties back to the Login event. USER_ID is 15-char, USER_ID_DERIVED 18-char — join on the derived one.
  - title: Connected apps & OAuth
    body: Integrations authenticate through connected apps (OAuth 2.0 web-server, JWT bearer, client credentials, refresh token). A LoginHistory row with LoginType "Remote Access 2.0" and Application = the app name records the token use; every API call then carries CONNECTED_APP_ID and CLIENT_NAME. Revoking the app's tokens is the kill switch.
  - title: Data access is the attack surface
    body: Salesforce itself is rarely "hacked" — attackers obtain a valid session or OAuth token (vishing, token theft from a third-party app) and run SOQL / Bulk API exports. ROWS_PROCESSED, URI and ENTITY_NAME in RestApi / BulkApi rows are what tells a normal integration from a mass export.
  - title: Real-Time Event Monitoring & Transaction Security
    body: Shield also streams events (LoginEvent, ApiEvent, ReportEvent, BulkApiResultEvent) as Platform Events / storage objects, and Transaction Security Policies can block or require MFA on an action in real time. ELF stays the bulk, cheapest-to-collect history.
traffic:
  handles:
    - HTTPS UI sessions (Lightning / Classic)
    - REST, SOAP, Bulk 2.0, Composite and Streaming APIs
    - OAuth 2.0 / OpenID Connect / SAML SSO logins
    - Apex code execution and outbound callouts
    - Reports, list views and data exports
    - Admin setup and permission changes
  flow:
    - step: Authenticate
      desc: User or integration logs in (password+MFA, SAML from the IdP, or an OAuth token via a connected app) → LoginHistory row.
    - step: Session / token
      desc: A session ID or access token is issued; LOGIN_KEY and SESSION_KEY are assigned.
    - step: Request
      desc: UI page, REST/SOAP/Bulk call or Apex REST endpoint is invoked; sharing, CRUD and field-level security evaluated.
    - step: Execute
      desc: SOQL runs, Apex triggers and classes execute, optional callouts to external URLs.
    - step: Log
      desc: The platform writes ELF rows (RestApi, ApexExecution, ApexCallout…) keyed by REQUEST_ID; setup changes go to SetupAuditTrail.
    - step: Collect
      desc: Collector downloads LogFile CSVs hourly and polls the objects with a time cursor (LoginTime / CreatedDate).
