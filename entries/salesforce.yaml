cves:
  - id: CVE-2025-43698
    cvss: 9.1
    year: 2025
    kev: false
    scope: device
    title: OmniStudio FlexCards SOQL data source bypasses field-level security
    affected: Salesforce OmniStudio (core and managed package) before Spring '25
    fixed: Spring '25 release (interim control EnableQueryWithFLS=true)
    detect: Experience Cloud / guest or low-privilege users (USER_TYPE Guest, CspLitePortal, PowerCustomerSuccess) issuing Aura / Apex REST requests to OmniStudio components with unusually high ROWS_PROCESSED; correlate with ApexExecution ENTRY_POINT on OmniStudio classes.
    avoid: Upgrade OmniStudio; set EnableQueryWithFLS; review guest-user profile access to OmniUiCard records.
  - id: CVE-2025-43697
    cvss: 7.5
    year: 2025
    kev: false
    scope: device
    title: OmniStudio Data Mapper Extract / Turbo Extract exposes Classic Encrypted fields in plaintext
    affected: Salesforce OmniStudio before Spring '25
    fixed: Spring '25 release
    detect: Data Mapper executions (ApexExecution / Aura rows) by users without "View Encrypted Data" returning records from objects that carry encrypted fields; unexpected exports following such calls.
    avoid: Upgrade; enable FLS enforcement for Data Mappers; restrict who can run Extract mappers.
  - id: CVE-2025-9844
    cvss: 8.8
    year: 2025
    kev: false
    scope: device
    title: Salesforce CLI on Windows uncontrolled search path — trusted executable replacement
    affected: Salesforce CLI (sf) on Windows before 2.106.6
    fixed: 2.106.6
    detect: Not in the org logs directly — the CLI's OAuth token can then be used from the same host. Watch LoginHistory / RestApi for the CLI's connected app (Salesforce CLI / "sf") from unexpected IPs or at unusual hours; endpoint telemetry for unsigned binaries in the CLI path.
    avoid: Upgrade the CLI; restrict the Salesforce CLI connected app to admin profiles and IP ranges; short refresh-token lifetime.
  - id: CVE-2026-35178
    cvss: 9.8
    year: 2026
    kev: false
    scope: traffic
    title: Workbench (Force.com API admin tool) RCE via the timezone cookie — a client of the Salesforce APIs, not the platform
    affected: Workbench before 65.0.0 (self-hosted instances)
    fixed: 65.0.0
    detect: A compromised Workbench host holds admins' sessions — look for API logins (LoginType Remote Access / SOAP) with Application or CLIENT_NAME "Workbench" from the Workbench server's IP outside admin working hours, followed by large queries.
    avoid: Upgrade or retire self-hosted Workbench; restrict API access by profile IP ranges.
  - id: CVE-2026-25650
    cvss: 7.5
    year: 2026
    kev: false
    scope: traffic
    title: MCP Salesforce Connector discloses the Salesforce auth token (AI-agent integration, not the platform)
    affected: MCP Salesforce Connector before 0.1.10
    fixed: 0.1.10
    detect: The leaked token is used from a new client — same USER_ID_DERIVED / CONNECTED_APP_ID suddenly appearing from a new CLIENT_IP or USER_AGENT, often running broad SOQL queries.
    avoid: Upgrade; give MCP/agent integrations a dedicated least-privilege integration user and IP-restricted connected app; rotate its tokens.
detections:
  - title: Mass data export through the API (OAuth token abuse)
    severity: critical
    signals:
      - RestApi / BulkApi rows
      - URI /query or /queryAll
      - sum(ROWS_PROCESSED) far above baseline per user/app
    why: The 2025 Salesloft-Drift and vishing campaigns stole data with valid OAuth tokens — the only evidence was a burst of SOQL queries returning hundreds of thousands of rows (Accounts, Contacts, Cases, Opportunities) from python or unusual clients.
    kql: |-
      dataset="salesforce_logs" EVENT_TYPE in ("RestApi","API","BulkApi2")
      | where URI has "/query"
      | summarize rows=sum(toint(ROWS_PROCESSED)), calls=count(), objects=dcount(ENTITY_NAME) by USER_ID_DERIVED, CONNECTED_APP_ID, CLIENT_IP, USER_AGENT, bin(_time, 1h)
      | where rows > 100000 or objects > 10
    mitre:
      - T1213
      - T1530
      - T1078.004
  - title: New or renamed connected app authorised (vishing / rogue Data Loader)
    severity: high
    signals:
      - LoginType="Remote Access 2.0"
      - Application not in known-app list
      - SetupAuditTrail Section="Connected Apps"
    why: UNC6040-style vishing gets a user to approve a lookalike "Data Loader" app; its first token login is a Remote Access login with a never-seen Application name, followed by bulk queries.
    kql: |-
      dataset="salesforce_logs" LoginType="Remote Access 2.0" Status="Success"
      | lookup sfdc_known_apps on Application
      | where isempty(approved)
      | summarize first=min(_time), ips=make_set(SourceIp), users=dcount(UserId) by Application
    mitre:
      - T1566.004
      - T1528
      - T1550.001
  - title: Login password spray / stuffing
    severity: high
    signals:
      - Status != "Success"
      - many UserId per SourceIp
    why: Spray against login.salesforce.com or a My Domain; a success from the same IP afterwards is the compromise.
    kql: |-
      dataset="salesforce_logs" isnotempty(LoginType) Status!="Success"
      | summarize fails=count(), users=dcount(UserId) by SourceIp, CountryIso, bin(_time, 15m)
      | where users > 5 or fails > 30
    mitre:
      - T1110.003
      - T1110.004
  - title: Privileged permission set or profile granted
    severity: high
    signals:
      - Section="Manage Users"
      - Action PermSetAssign / profile change
      - Display mentions admin, Modify All or View All
    why: Persistence and privilege escalation in Salesforce is a permission-set assignment; "Modify All Data" / "View All Data" / API Enabled on a new user precedes exfiltration.
    kql: |-
      dataset="salesforce_logs" Section="Manage Users"
      | where Action has_any ("PermSetAssign","PermSetGroupAssign","profileChanged") or Display has_any ("System Admin","Modify All","View All")
      | project _time, CreatedById, DelegateUser, Action, Display
    mitre:
      - T1098
      - T1078.004
  - title: Apex callout to an unapproved external host
    severity: medium
    signals:
      - EVENT_TYPE=ApexCallout
      - URL host not in Remote Site / Named Credential allow-list
      - large REQUEST_SIZE
    why: Malicious or compromised Apex (from a package or a rogue admin) can push records out via HTTP callouts; REQUEST_SIZE shows how much left.
    kql: |-
      dataset="salesforce_logs" EVENT_TYPE="ApexCallout"
      | extend host=extract("https?://([^/:]+)", 1, URL)
      | lookup sfdc_callout_allowlist on host
      | where isempty(owner)
      | summarize calls=count(), sent=sum(toint(REQUEST_SIZE)) by host, USER_ID_DERIVED
    mitre:
      - T1567
      - T1041
  - title: API access from scripting clients or new country
    severity: medium
    signals:
      - USER_AGENT python-requests / curl / Go-http-client
      - CLIENT_IP not seen for this user in 30 d
    why: Legitimate integrations use stable IPs and SDK user agents; a stolen token replayed from attacker infrastructure usually changes both.
    kql: |-
      dataset="salesforce_logs" EVENT_TYPE="RestApi"
      | where USER_AGENT has_any ("python-requests","curl","Go-http-client","aiohttp")
      | summarize calls=count(), rows=sum(toint(ROWS_PROCESSED)) by USER_ID_DERIVED, CLIENT_IP, USER_AGENT
    mitre:
      - T1078.004
      - T1550.001
optimizations:
  - title: Drop performance-only ELF columns
    saving: 20–35 %
    fn: Parser → Serialize
    how: Parse the CSV and drop DB_BLOCKS, DB_CPU_TIME, DB_TOTAL_TIME, CPU_TIME, RUN_TIME, the 15-char USER_ID (keep USER_ID_DERIVED), ORGANIZATION_ID (one value per org) and empty columns, then serialise as JSON.
    expr: "remove: DB_*, CPU_TIME, RUN_TIME, USER_ID, ORGANIZATION_ID, URI_ID_DERIVED; drop empty"
  - title: Route performance event types away from the SIEM
    saving: 30–60 %
    fn: Routes
    how: ApexExecution, ApexTrigger, URI, LightningPageView and UI telemetry event types are performance data. Send them to Cribl Lake / an observability tool; keep RestApi, API, BulkApi*, Login, LoginAs, Report*, PermissionUpdate and ApexCallout in the SIEM.
    expr: EVENT_TYPE in ('ApexExecution','ApexTrigger','URI','LightningPageView','LightningPerformance') → Lake
  - title: Aggregate small, repetitive integration calls
    saving: 10–25 %
    fn: Aggregations
    how: Integration users poll the same endpoint thousands of times a day with ROWS_PROCESSED 0–1. Roll up calls, rows and errors per user/app/URI per 5 minutes; keep raw rows where ROWS_PROCESSED > 1000.
    expr: EVENT_TYPE=='RestApi' && Number(ROWS_PROCESSED) < 1000
  - title: Enrich user and app IDs
    saving: Analyst time
    fn: Lookup
    how: ELF only carries IDs. Join a periodically exported User (Id → Username, Profile) and ConnectedApplication lookup so detections can read names and privilege.
    expr: lookup sfdc_users on USER_ID_DERIVED → Username, ProfileName
