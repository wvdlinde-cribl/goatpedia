summary: Klaviyo is logged by the Datadog integrations-core package klaviyo. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: klaviyo
    desc: 'Datadog integrations-core fixture, 6 events. Upstream: klaviyo/assets/logs/klaviyo_tests.yaml'
facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: klaviyo
  Sourcetypes: '1'
  Fixture events: '6'
  Log format seen: json
  Fields in the first fixture: metric_name, profile_id, attributes.datetime, attributes.uuid, attributes.timestamp, attributes.event_properties._ip
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Klaviyo events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries metric_name, profile_id, attributes.datetime, attributes.uuid, attributes.timestamp, attributes.event_properties._ip. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads klaviyo and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
