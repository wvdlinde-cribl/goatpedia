facts:
  Where the sample comes from: Elastic integrations
  Integration package: cloudflare_logpush
  Sourcetypes: '21'
  Fixture events: '80'
  Log format seen: json
  Fields in the first fixture: Action, Allowed, AppDomain, AppUUID, Connection, Country
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Cloudflare Logpush events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries Action, Allowed, AppDomain, AppUUID, Connection, Country. Values in the sample were rewritten to documentation addresses.
