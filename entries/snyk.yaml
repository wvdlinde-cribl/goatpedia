id: snyk
name: Snyk
short: Snyk
vendor: Snyk Ltd.
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Snyk Open Source
  - Snyk Code
  - Snyk Container
tags:
  - application-security
  - sca
  - devsecops
  - audit
summary: A developer security platform that scans source code, open-source dependencies, containers and infrastructure-as-code for vulnerabilities. Teams work in Snyk groups and organizations that own projects imported from source repositories and CI. Its audit log records administrative actions in those groups and organizations — settings edits, membership and role changes, integrations and API access — with the user and the before and after values.
sourcetypes:
  - st: snyk_audit_logs
    desc: Audit log of a Snyk organization or group, one event per administrative action with user, organization and before/after content
facts:
  Product: Developer security scanning (SCA, SAST, container and IaC)
  Tenant model: Groups contain organizations. Organizations contain projects, members and integrations
  Log transport: HTTPS JSON, pulled from the Snyk REST API audit log endpoints by a collector with a service account token
  Log format: One JSON object per audit event
  What an audit event answers: Which user did which action (event) in which organization, and what changed (content.before and content.after)
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Snyk organization
      desc: Projects, members, settings and the audit log live in the Snyk SaaS tenant. A collector polls the audit log API for the organization or group.
howItWorks:
  - title: Organizations and projects
    body: A Snyk organization holds projects imported from SCM integrations, the CLI or CI. Members have roles. Settings control integrations, policies and notifications.
  - title: Audit events
    body: Every administrative action in an organization or group is recorded with an event name in dotted form, such as org.edit. The event names the user_id and org_id and, where relevant, content with the before and after values.
  - title: How the data leaves the product
    body: A collector calls the audit log search endpoint with a token and a time range or cursor, and pages through results. Each event is one JSON object for any destination.
traffic:
  handles:
    - Organization and group administration
    - Membership and role changes
    - Integration and API access configuration
  flow:
    - step: Admin acts
      desc: A user renames an organization, changes a member, or edits an integration.
    - step: Snyk records it
      desc: Snyk writes an audit event with the event name, user, organization and changed content.
    - step: Collector polls
      desc: A collector calls the audit log API for new events.
    - step: Events are JSON
      desc: Each event is one JSON object. Goatpedia reads these samples as JSON.
logs:
  - type: Audit log
    sourcetype: snyk_audit_logs
    format: json
    desc: One administrative action. event names it, user_id and org_id say who and where, and content.before and content.after show the change. This sample is an organization being renamed (org.edit).
    sample: '{"content":{"after":{"name":"elastic-integration"},"before":{"name":"admin.user"}},"created":"2024-04-15T19:47:21.565Z","event":"org.edit","org_id":"86054e75-398a-4a1a-9dd8-72d026d8c237","user_id":"b4b324c4-a55c-4cd6-82b8-f96e3b3b8d85"}'
    key:
      - content.after.name
      - content.before.name
      - created
      - event
cves: []
detections:
  - title: Organization settings changed
    severity: low
    signals:
      - event
      - user_id
      - org_id
      - content.before.name
      - content.after.name
    why: org.edit changes the organization itself. An unexpected change by an unusual user is an admin change worth confirming.
    kql: |
      dataset="snyk_logs"
      | where sourcetype == "snyk_audit_logs" and event == "org.edit"
      | project created, user_id, org_id, content.before.name, content.after.name
optimizations: []
references:
  - title: Snyk documentation
    url: https://docs.snyk.io/
  - title: Snyk API reference
    url: https://apidocs.snyk.io/
