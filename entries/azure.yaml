facts:
  Where the sample comes from: Elastic integrations
  Integration package: azure
  Sourcetypes: '13'
  Fixture events: '192'
  Log format seen: json
  Fields in the first fixture: ActivityStatusValue, Caller, CallerIpAddress, CategoryValue, Claims, Claims_d.http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Azure events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries ActivityStatusValue, Caller, CallerIpAddress, CategoryValue, Claims, Claims_d.http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads azure and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
