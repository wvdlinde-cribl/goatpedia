id: azure-nsg-flow
name: Azure NSG / VNet Flow Logs
short: NSG Flow
aka:
  - Network Watcher flow logs
  - NSG flow logs (retiring)
  - Virtual network flow logs
  - NetworkSecurityGroupFlowEvent
  - FlowLogFlowEvent
vendor: Microsoft
category: ndr
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - azure
  - flow
  - cloud-network
  - json
  - storage-blob
