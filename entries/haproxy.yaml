summary: Haproxy is logged by the Elastic integrations package haproxy. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: haproxy
    desc: 'Elastic integrations fixture, 15 events. Upstream: haproxy/data_stream/log/_dev/test/pipeline/test-tcplog.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: haproxy
  Sourcetypes: '1'
  Fixture events: '15'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Haproxy events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Elastic integrations package reads haproxy and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text.
logs:
  - type: Log
    sourcetype: haproxy
    format: text
    desc: 15 fixture events in the samples pool (elastic).
    sample: 'Sep 20 15:44:23 192.0.2.10 haproxy[25457]: 192.0.2.20:40962 [20/Sep/2018:15:44:23.285] main app/<NOSRV> -1/-1/1 212 SC 1/1/0/0/0 0/0'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Haproxy events arriving
    severity: low
    signals:
      - message
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "haproxy"'
optimizations: []
references:
