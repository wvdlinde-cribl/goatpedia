summary: Cisco Nexus is Cisco's family of data centre switches running the NX-OS operating system. They form the leaf, spine and core layers that connect servers, storage and other networks, either as standalone switches or under ACI. NX-OS sends syslog for interface changes, routing protocol events, hardware and environment alerts, configuration changes and administrator logins, which tell you about the state and changes of the data centre network.
sourcetypes:
  - st: cisco_nexus
    desc: NX-OS switch syslog, one message per event from the switch, typically in %FACILITY-SEVERITY-MNEMONIC form, plus syslog daemon lines such as message repeat notices
facts:
  Product: Data centre switches running NX-OS, standalone or in Cisco ACI fabrics
  Form factor: Fixed and modular hardware switches (Nexus 3000, 5000, 7000, 9000) and the virtual Nexus 9000v
  Log transport: Syslog over UDP, TCP or TLS to configured logging servers, optionally from a management VRF
  Log format: Cisco syslog text with priority, year, date, time and zone, then a %FACILITY-SEVERITY-MNEMONIC tag and the message
  What a switch message answers: Which interface, protocol, module or user caused what change, at which severity, for example a port going down, a BGP neighbour change, a fan failure or a configuration commit
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Data centre fabric
      desc: Nexus switches sit in the data centre as leaf, spine or core switches between servers, storage and the rest of the network. Each switch sends its own syslog.
howItWorks:
  - title: NX-OS
    body: NX-OS runs each feature, such as interfaces, routing protocols, VPC and AAA, as a separate process. Each process reports events with its facility name, a severity from 0 to 7 and a mnemonic.
  - title: Repeated messages
    body: When the same message repeats, the syslog daemon suppresses the copies and writes a line saying the last message was repeated n times. That line carries no facility tag of its own.
  - title: How the logs leave the switch
    body: The switch is configured with logging server entries, a severity level and a source interface or VRF. Any syslog collector can receive the messages. The destination is a choice of the pipeline, not a property of the switch.
traffic:
  handles:
    - Ethernet switching and routing in the data centre
    - Interface, VPC and routing protocol state
    - Hardware and environment monitoring
    - Administrator logins and configuration changes
  flow:
    - step: Switch event happens
      desc: An interface changes state, a protocol neighbour changes, hardware raises an alert or an administrator changes the configuration.
    - step: NX-OS logs it
      desc: The responsible process writes a syslog message with facility, severity and mnemonic.
    - step: Syslog is sent
      desc: The switch sends the message to its configured logging servers.
logs:
  - type: Switch syslog
    sourcetype: cisco_nexus
    format: text
    desc: One syslog message from the switch. Most lines carry a %FACILITY-SEVERITY-MNEMONIC tag that names the process and severity. This sample is the syslog daemon's notice that the previous message was repeated once.
    sample: '<187>: 2023 May  2 12:55:19 UTC: last message repeated 1 times'
    pattern: (?<message>[\s\S]+)
    key:
      - message
