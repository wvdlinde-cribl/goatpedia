id: cisco-nexus
name: Cisco Nexus
short: Cisco Nexus
vendor: Cisco
category: netinfra
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - cisco_nexus
  - Elastic integrations
tags:
  - elastic
  - text
summary: Cisco Nexus is logged by the Elastic integrations package cisco_nexus. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: cisco_nexus
    desc: 'Elastic integrations fixture, 20 events. Upstream: cisco_nexus/data_stream/log/_dev/test/pipeline/test-nexus.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: cisco_nexus
  Sourcetypes: '1'
  Fixture events: '20'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Cisco Nexus events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Elastic integrations package reads cisco_nexus and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text.
logs:
  - type: Log
    sourcetype: cisco_nexus
    format: text
    desc: 20 fixture events in the samples pool (elastic).
    sample: '<187>: 2023 May  2 12:55:19 UTC: last message repeated 1 times'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Cisco Nexus events arriving
    severity: low
    signals:
      - message
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "cisco_nexus"'
optimizations: []
references:
  - title: elastic/integrations cisco_nexus/data_stream
    url: https://github.com/elastic/integrations/blob/cbfff90638a7565377768f50726775c0febc7bf4/packages/cisco_nexus/data_stream/log/_dev/test/pipeline/test-nexus.log
  - title: Pack Generator sample cisco_nexus.json
    url: https://github.com/wvdlinde-cribl/cribl-pack-samples/blob/main/samples/cisco_nexus.json
