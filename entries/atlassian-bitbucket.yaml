id: atlassian-bitbucket
name: Atlassian Bitbucket
short: Bitbucket
vendor: Atlassian
category: saas
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - atlassian_bitbucket
  - Elastic integrations
tags:
  - elastic
