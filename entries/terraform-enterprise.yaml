# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: terraform-enterprise
name: HCP Terraform / Terraform Enterprise
short: Terraform
aka:
  - HCP Terraform
  - Terraform Cloud
  - Terraform Enterprise
  - TFE
  - Audit Trails API
vendor: HashiCorp (IBM)
category: devops
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - devops
  - infrastructure-as-code
  - terraform
  - ci-cd
  - supply-chain
  - audit
  - json
summary: "HashiCorp's infrastructure-as-code platform that runs terraform plan/apply for teams, stores state and holds cloud credentials as workspace variables. HCP Terraform (SaaS) exposes an Audit Trails API; self-hosted Terraform Enterprise writes [Audit Log] JSON lines into its application log. Because it holds cloud admin credentials and every state file, its audit trail is a crown-jewel log for cloud supply-chain attacks."
sourcetypes:
  - st: terraform_enterprise_audit
    desc: Terraform audit events — HCP Terraform Audit Trails API records or Terraform Enterprise [Audit Log] JSON
  - st: TERRAFORM_ENTERPRISE
    desc: Google SecOps (Chronicle) log type for Terraform Enterprise logs
facts:
  First released: Terraform 2014; Terraform Enterprise 2017; Terraform Cloud 2019 (renamed HCP Terraform 2024)
  Platform: Ruby (atlas) + Go services in containers; TFE on Docker, Podman, Kubernetes, OpenShift or Nomad ("Flexible Deployment Options")
  Delivery model: HCP Terraform (SaaS, Standard/Premium editions) or self-hosted Terraform Enterprise
  Audit source (SaaS): GET /api/v2/organization/audit-trail — organization or audit-trail token, 1000 events per page, 14 days retention
  Audit source (self-hosted): "[Audit Log] lines mixed into the application log; Audit Trails API not available"
  Log transport: REST polling (SaaS); built-in Fluent Bit log forwarding to S3, Azure, GCS, Splunk HEC, Datadog, syslog/forward (TFE)
  Log format: JSON (API, nested auth/request/resource); TFE prefixes JSON with timestamp, level and request id
  Typical volume: Low — hundreds to a few thousand events per organization per day; TFE app logs are 100x larger than the audit subset
  Cribl Pack: None found in the Packs Dispensary — use a REST Collector (SaaS) or an HTTP/S3 source (TFE)
placement:
  slots:
    - cloud
    - internal
  items:
    - slot: cloud
      title: HCP Terraform (SaaS)
      desc: Runs live in HashiCorp's cloud (or on customer agents). Cribl polls the Audit Trails API with an audit-trail token every few minutes using since= checkpoints.
    - slot: internal
      title: Terraform Enterprise (self-hosted)
      desc: Runs in the customer's data center or cloud account next to its PostgreSQL, object storage and Redis. Fluent Bit forwards all application logs; Cribl filters the [Audit Log] lines.
    - slot: cloud
      title: Run agents in cloud accounts
      desc: Agent pools execute plans inside private VPCs with access to cloud APIs. Agent registration and pool assignment are audited — a rogue agent sees every workspace secret routed to it.
howItWorks:
  - title: Organizations, projects, workspaces
    body: An organization contains projects, which contain workspaces. Each workspace maps to one Terraform root module, a state file and a set of variables (often sensitive cloud credentials). Teams receive permissions per project or workspace.
  - title: Runs
    body: "A run = plan → (policy checks / run tasks) → apply. Runs are triggered by VCS webhooks, the API/CLI or run triggers. Each run gets a short-lived run token. Plans and applies execute in disposable workers or in customer-hosted agents."
  - title: Policy as code
    body: Sentinel or OPA policy sets are evaluated between plan and apply. Hard-mandatory failures block the run; soft-mandatory failures can be overridden by authorised users — every override is an audit event (policy_check override).
  - title: Audit Trails API (HCP Terraform)
    body: "Every change to an application entity becomes an event with auth (accessor_id, description = username, type Client / Impersonated / System, impersonator_id), request.id and resource (id, type, action, meta). Reads of sensitive data such as var show/index, state_version show and configuration_version download are recorded too."
  - title: Audit log lines (Terraform Enterprise)
    body: "TFE writes audit records into the same application log stream as everything else, tagged [Audit Log], with resource, action, resource_id, organization, actor, timestamp and actor_ip. Log forwarding is all-or-nothing, so filtering happens downstream (Fluent Bit rewrite_tag or Cribl)."
traffic:
  handles:
    - Web UI, API and terraform CLI (remote backend / cloud block)
    - VCS webhooks (GitHub, GitLab, Bitbucket, Azure DevOps)
    - Workspace variables and variable sets (cloud credentials)
    - State versions (full resource inventory and secrets)
    - Private module and provider registry
    - Sentinel / OPA policy checks and run tasks
    - Agent pools and dynamic provider credentials (OIDC)
  flow:
    - step: Trigger
      desc: VCS push, API call or CLI starts a run on a workspace.
    - step: Authenticate
      desc: User, team, organization or run token; SSO via SAML.
    - step: Plan
      desc: Worker or agent downloads the configuration version, reads variables and state, computes the plan.
    - step: Policy
      desc: Sentinel / OPA and run tasks pass, fail or get overridden.
    - step: Apply
      desc: Approved plan is applied against cloud APIs; a new state version is written.
    - step: Audit record
      desc: Each action becomes an audit-trail event (SaaS) or [Audit Log] line (TFE).
    - step: Collect
      desc: Cribl REST Collector polls the API, or receives TFE log forwarding and keeps only audit lines.
logs:
  - type: Audit trail event (HCP Terraform API)
    sourcetype: terraform_enterprise_audit
    format: json
    share: 100 % (SaaS)
    avg: ~450 B
    desc: One element of the data[] array returned by /organization/audit-trail, split into one event per record. resource.meta carries action-specific detail (policy results, team permissions, etc.).
    key:
      - timestamp
      - auth.description
      - auth.type
      - auth.impersonator_id
      - resource.type
      - resource.action
      - resource.id
    noise:
      - version
      - type
      - resource.meta
    sample: '{"id":"5b1e9a42-0d1f-4d8b-9a7c-3f0e2a6c1d77","version":"0","type":"Resource","timestamp":"2026-11-12T09:14:22.000Z","auth":{"accessor_id":"user-Q7mXa2Lb9cPdE4fG","description":"jdoe","type":"Client","impersonator_id":null,"organization_id":"org-Ab12Cd34Ef56Gh78"},"request":{"id":"8c2d4e6f-1a3b-4c5d-9e7f-0a1b2c3d4e5f"},"resource":{"id":"var-Zx9Yw8Vu7Ts6Rq5P","type":"var","action":"show","meta":null}}'
  - type: Terraform Enterprise [Audit Log] line
    sourcetype: terraform_enterprise_audit
    format: text
    share: 100 % (self-hosted)
    avg: ~320 B
    desc: Audit record embedded in the TFE application log (atlas component). Shares the stream with far noisier application logs; filter on the [Audit Log] marker.
    pattern: '^(?<log_ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \[(?<level>\w+)\] \[(?<request_id>[0-9a-f-]+)\] \[Audit Log\] \{"resource":"(?<resource>[^"]+)","action":"(?<action>[^"]+)","resource_id":"(?<resource_id>[^"]+)","organization":"(?<organization>[^"]+)","organization_id":"(?<organization_id>[^"]+)","actor":"(?<actor>[^"]+)","timestamp":"(?<timestamp>[^"]+)","actor_ip":"(?<actor_ip>[^"]+)"\}$'
    key:
      - resource
      - action
      - resource_id
      - organization
      - actor
      - actor_ip
      - timestamp
    noise:
      - log_ts
      - level
      - organization_id
    sample: '2026-11-12 09:20:41 [INFO] [7a233ad1-c50c-4737-a925-3be901e55fcb] [Audit Log] {"resource":"state_version","action":"show","resource_id":"sv-Hk3Jm5Np7Qr9St1V","organization":"example-org","organization_id":"org-Ab12Cd34Ef56Gh78","actor":"svc-reporting","timestamp":"2026-11-12T09:20:41Z","actor_ip":"198.51.100.42"}'
  - type: Policy check override
    sourcetype: terraform_enterprise_audit
    format: json
    share: < 1 %
    avg: ~800 B
    desc: Audit trail event for a Sentinel policy check that was overridden, with run and workspace context in resource.meta. Rare, high signal.
    key:
      - timestamp
      - auth.description
      - resource.action
      - resource.meta.actor
      - resource.meta.workspace.name
      - resource.meta.run.id
    noise:
      - version
      - request.id
    sample: '{"id":"a9c3e7b1-5d2f-4e8a-b6c0-1f3e5a7c9d2b","version":"0","type":"Resource","timestamp":"2026-11-12T10:02:13.000Z","auth":{"accessor_id":"user-Q7mXa2Lb9cPdE4fG","description":"jdoe","type":"Client","impersonator_id":null,"organization_id":"org-Ab12Cd34Ef56Gh78"},"request":{"id":"3e5f7a9b-2c4d-4e6f-8a0b-1c2d3e4f5a6b"},"resource":{"id":"polchk-Mn4Bv6Cx8Zl0Kj2H","type":"policy_check","action":"overridden","meta":{"comment":"hotfix","run":{"id":"run-Pq1Rs3Tu5Vw7Xy9Z","message":"Emergency SG change"},"workspace":{"id":"ws-Lk2Jh4Gf6Ds8Aq0W","name":"prod-network"},"actor":"jdoe"}}}'
cves:
  - id: CVE-2021-36230
    cvss: 8.8
    year: 2021
    kev: false
    scope: device
    title: Run token privilege escalation to organization owner (missing authorization checks on API requests)
    affected: Terraform Enterprise up to v202106-1
    fixed: v202107-1
    detect: Actions by a run token (auth.description of a run / System accessor) on organization-level resources — organization_user, team or authentication_token create/update outside a run's own workspace.
    avoid: Patch; restrict who can write Terraform configuration that runs in privileged workspaces; review org-owner team membership.
  - id: CVE-2021-40862
    cvss: 8.8
    year: 2021
    kev: false
    scope: device
    title: Configuration versions API disclosed a sensitive upload URL — privilege escalation / tampering with Terraform configuration
    affected: Terraform Enterprise up to v202108-1
    fixed: v202109-1
    detect: configuration_version show/download by users without write access to the workspace, followed by runs whose configuration was not created by that workspace's VCS connection.
    avoid: Patch; use VCS-driven workspaces only for production; alert on configuration_version download by non-owners.
  - id: CVE-2023-3114
    cvss: 7.7
    year: 2023
    kev: false
    scope: device
    title: Agent pool authorization flaw lets an unauthorized workspace target a higher-privileged agent pool
    affected: Terraform Enterprise v202207-1 up to v202306-1
    fixed: v202306-1
    detect: Workspace update events that change the execution mode / agent pool, from users who are not admins of the pool's intended workspaces; runs on a privileged pool from unexpected workspaces.
    avoid: Patch; scope agent pools to specific workspaces; give agents least-privilege cloud roles.
  - id: CVE-2026-14468
    cvss: 7.7
    year: 2026
    kev: false
    scope: device
    title: Arbitrary file read via VCS ingestion of private registry modules (packaged module content escapes the repository boundary)
    affected: Terraform Enterprise 1.0.0 before 1.2.4, and 2.0.x before 2.0.4
    fixed: v1.2.4, v2.0.4
    detect: registry_module create/update by unusual users followed by module downloads; unexpected files (e.g. /etc, config) inside module archives.
    avoid: Patch; limit who can publish to the private registry; run TFE with minimal filesystem secrets.
  - id: CVE-2023-4782
    cvss: 7.8
    year: 2023
    kev: false
    scope: traffic
    title: Terraform CLI arbitrary file write during init on a maliciously crafted configuration (configurations the platform executes)
    affected: Terraform 1.0.8 through 1.5.6
    fixed: Terraform 1.5.7
    detect: Runs on workspaces pinned to Terraform 1.0.8–1.5.6 from configuration versions uploaded by API/CLI rather than VCS; new modules from unknown sources.
    avoid: Upgrade workspace Terraform versions; only run reviewed configurations; isolate run workers or agents.
detections:
  - title: Sensitive variable or state read by an unusual actor
    severity: high
    signals:
      - resource.type in var / state_version
      - resource.action in show / index / download
      - actor not normally active on that workspace
    why: Workspace variables hold cloud keys and state files contain every resource attribute, including secrets. Bulk reads are how stolen tokens are turned into cloud access.
    kql: |-
      dataset="tfe_audit" resource.type in ("var","state_version","configuration_version")
      | where resource.action in ("show","index","download")
      | summarize reads=count(), objects=dcount(resource.id) by auth.description, auth.type, bin(_time, 1h)
      | where objects > 20
    mitre:
      - T1552
      - T1530
  - title: Policy check override on production
    severity: high
    signals:
      - resource.type=policy_check
      - resource.action=overridden
      - workspace name prod*
    why: Overriding Sentinel/OPA bypasses the guardrails that stop public buckets or open security groups. Legitimate overrides are rare and ticketed.
    kql: |-
      dataset="tfe_audit" resource.type="policy_check" resource.action="overridden"
      | project timestamp, auth.description, resource.meta.workspace.name, resource.meta.run.id, resource.meta.comment
    mitre:
      - T1562.001
  - title: New API or organization token created
    severity: medium
    signals:
      - resource.type=authentication_token
      - resource.action=create
      - auth.type=Impersonated or creator not in platform team
    why: Long-lived user, team and org tokens survive SSO deprovisioning and are the usual persistence mechanism after a session hijack.
    kql: |-
      dataset="tfe_audit" resource.type="authentication_token" resource.action="create"
      | summarize tokens=count() by auth.description, auth.type, auth.impersonator_id
    mitre:
      - T1098.001
      - T1528
  - title: Membership or SAML configuration change
    severity: high
    signals:
      - resource.type in organization_user / saml_configuration
      - resource.action in create / update / destroy / disable
    why: Adding users to the owners team or disabling SAML enforcement gives an attacker durable admin access to every workspace.
    kql: |-
      dataset="tfe_audit" resource.type in ("organization_user","saml_configuration","organization")
      | project timestamp, auth.description, auth.type, resource.type, resource.action, resource.id
    mitre:
      - T1098
      - T1556
  - title: Destroy or force-execute runs outside change windows
    severity: medium
    signals:
      - resource.type=run
      - resource.action in force_execute / apply with destroy plans
      - off-hours or unusual actor
    why: A destroy apply can delete production infrastructure in minutes; force_execute skips the queue and approvals.
    kql: |-
      dataset="tfe_audit" resource.type="run" resource.action in ("force_execute","force_cancel","apply")
      | where hourofday(_time) < 6 or hourofday(_time) > 20
      | summarize runs=count() by auth.description, resource.action
    mitre:
      - T1485
  - title: TFE audit activity from external IPs
    severity: medium
    signals:
      - "[Audit Log] actor_ip not in corporate ranges"
      - actions on var / state_version
    why: Self-hosted TFE is usually internal-only; audit actions from internet IPs point to exposure or token theft.
    kql: |-
      dataset="tfe_audit" isnotempty(actor_ip)
      | where not(ipv4_is_in_range(actor_ip, "10.0.0.0/8") or ipv4_is_in_range(actor_ip, "172.16.0.0/12") or ipv4_is_in_range(actor_ip, "192.168.0.0/16"))
      | summarize actions=count(), resources=make_set(resource) by actor, actor_ip
    mitre:
      - T1078
optimizations:
  - title: Keep only [Audit Log] lines from TFE log forwarding
    saving: 90–99 % of the TFE stream
    fn: Drop
    how: TFE forwards all application logs or none. Drop every line without the [Audit Log] marker before the SIEM (send the rest to cheap storage if operations wants it).
    expr: "!_raw.includes('[Audit Log]')"
  - title: Split API pages into events and dedupe
    saving: Clean events, no double counting
    fn: Unroll + Suppress
    how: The API returns data[] arrays with pagination. Unroll data[] into one event per record and suppress on id, because overlapping since= windows return the same records twice.
    expr: "unroll data[] → event;  key: `${id}`  allow 1 / 1h"
  - title: Summarise routine run lifecycle events
    saving: 20–40 %
    fn: Aggregations
    how: Runs, plans and policy checks that pass generate many events per run. Aggregate passing lifecycle events to counts per workspace per hour; keep overrides, failures and all var/state/token events raw.
    expr: resource.type=='run' && resource.action=='create'
  - title: Drop null meta and constant fields
    saving: 10–20 %
    fn: Eval
    how: Remove version, type (always Resource) and resource.meta when null; parse the TFE log prefix away once fields are extracted.
    expr: "remove: version, type; resource.meta==null → remove resource.meta"
