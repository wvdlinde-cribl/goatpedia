summary: Mcafee Web Gateway is logged by the Splunk Connect for Syslog package mcafee_web_gateway. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: mcafee_web_gateway
    desc: 'Splunk Connect for Syslog fixture, 2 events. Upstream: tests/test_mcafee_web_gateway.py'
facts:
  Where the sample comes from: Splunk Connect for Syslog
  Integration package: mcafee_web_gateway
  Sourcetypes: '1'
  Fixture events: '2'
  Log format seen: kv
  Fields in the first fixture: header, status, srcip, user, dhost, urlp
placement:
  slots:
    - edge
  items:
    - slot: edge
      title: Splunk Connect for Syslog
      desc: Fixtures were harvested from splunk/splunk-connect-for-syslog. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Mcafee Web Gateway events in this library are the test fixtures shipped with splunk/splunk-connect-for-syslog (d861082778). The first event carries header, status, srcip, user, dhost, urlp. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - kv
  flow:
    - step: Collect
      desc: The Splunk Connect for Syslog package reads mcafee_web_gateway and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as kv.
logs:
