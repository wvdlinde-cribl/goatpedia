howItWorks:
  - title: What the fixture shows
    body: Zscaler Private Access events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries User, ClientAuditUpdate, RequestID, ObjectID, EventType, AuditOperationType. Values in the sample were rewritten to documentation addresses.
