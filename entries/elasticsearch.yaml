summary: Elasticsearch is logged by the Elastic integrations package elasticsearch. The Pack Generator samples pool holds fixture events for 5 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: elasticsearch_audit
    desc: 'Elastic integrations fixture, 4 events. Upstream: elasticsearch/data_stream/audit/_dev/test/pipeline/test-audit-logs.log'
  - st: elasticsearch_deprecation
    desc: 'Elastic integrations fixture, 2 events. Upstream: elasticsearch/data_stream/deprecation/_dev/test/pipeline/test-deprecation-logs.log'
  - st: elasticsearch_querylog
    desc: 'Elastic integrations fixture, 2 events. Upstream: elasticsearch/data_stream/querylog/_dev/test/pipeline/test-querylog.log'
  - st: elasticsearch_server
    desc: 'Elastic integrations fixture, 6 events. Upstream: elasticsearch/data_stream/server/_dev/test/pipeline/test-server-logs.log'
  - st: elasticsearch_slowlog
    desc: 'Elastic integrations fixture, 6 events. Upstream: elasticsearch/data_stream/slowlog/_dev/test/pipeline/test-search-slowlog-logs.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: elasticsearch
  Sourcetypes: '5'
  Fixture events: '20'
  Log format seen: json
  Fields in the first fixture: type, timestamp, cluster.uuid, node.id, event.type, event.action
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Elasticsearch events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries type, timestamp, cluster.uuid, node.id, event.type, event.action. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads elasticsearch and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
