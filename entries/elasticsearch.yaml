# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: elasticsearch
name: Elasticsearch
short: Elasticsearch
vendor: Elastic
category: pipeline
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - ES
tags:
  - elastic
  - search-engine
  - database
  - audit
  - json
summary: A distributed search and analytics engine that stores JSON documents in indices spread across a cluster of nodes. Applications, Kibana and log pipelines index and query it over a REST API. Each node writes its own logs in JSON — the server log, a security audit log, a deprecation log, slow logs for slow searches and indexing, and a query log — which tell you who accessed which index, what the cluster is doing, and which queries are expensive.
sourcetypes:
  - st: elasticsearch_audit
    desc: Security audit events, such as granted or denied access, authentication results and index operations, with user, roles and origin
  - st: elasticsearch_deprecation
    desc: Warnings when a client or setting uses a feature that is deprecated and will be removed
  - st: elasticsearch_querylog
    desc: Query log entries, one per search request, with user, indices, query, hit count and duration
  - st: elasticsearch_server
    desc: The node's main server log, such as index creation, cluster state changes, startup and errors
  - st: elasticsearch_slowlog
    desc: Slow log entries for searches or indexing operations that took longer than the configured threshold
facts:
  Product: Distributed search and analytics engine and document store
  Form factor: Self-managed on Linux, Windows, Docker or Kubernetes (ECK), or hosted on Elastic Cloud
  Log transport: JSON log files on each node (logs directory), read by any log agent
  Log format: One JSON object per line in ECS-style fields; the audit log uses its own flat dotted keys
  What an audit event answers: Which user, realm and roles did which action on which indices, from which address, and whether it was granted
  What a server log line answers: What the node and cluster were doing, at what level, from which component
  What a slow log line answers: Which search or indexing operation on which shard was slow, and how slow
  What a query log line answers: Who searched which indices with what query, how many hits came back, and how long it took
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Cluster nodes
      desc: Nodes run in the data centre or a cloud VPC behind the applications that use them. Each node writes its own log files, so a cluster's logs are the union of every node's.
    - slot: cloud
      title: Hosted deployments
      desc: The same engine runs as a hosted deployment. There the hosting platform collects the node logs instead of an agent on the host.
howItWorks:
  - title: Nodes, indices and shards
    body: A cluster is a set of nodes with roles (master, data, ingest, coordinating). An index is split into shards placed on data nodes. The server log records cluster events such as index creation and shard allocation.
  - title: Security audit
    body: When security auditing is on, the node records events such as access_granted, access_denied, authentication_success and authentication_failed. Each one names the user, realm and roles, the origin type and address, the action (for example indices:admin/create) and the indices touched.
  - title: Slow, query and deprecation logs
    body: Slow logs fire when a search or indexing operation on a shard exceeds per-index thresholds. The query log records search requests with the query, indices, hit count and time. The deprecation log warns when clients or settings use features that will be removed.
  - title: How the logs leave the node
    body: Every log is written as JSON files in the node's logs directory, rotated by the node. A log agent on the host reads them and forwards each line. Any agent can do this.
traffic:
  handles:
    - Index, search and admin REST requests
    - Authentication and authorisation of users and API keys
    - Cluster state and shard management
  flow:
    - step: Client calls the API
      desc: An application, Kibana or a pipeline sends a REST request to a node.
    - step: Node authorises and runs it
      desc: The node checks the user's roles, then executes the search, index or admin action across shards.
    - step: Logs written
      desc: The node writes audit, query, slow, deprecation or server log lines as JSON.
    - step: Agent ships them
      desc: A log agent on the host reads the files and forwards each line.
logs:
  - type: Security audit
    sourcetype: elasticsearch_audit
    format: json
    desc: One object per audit event. event.action is access_granted, user.name and user.roles say the reserved elastic superuser did it, origin.address is the client, action is indices:admin/create and indices names the index created. The address is a documentation address.
    sample: '{"type":"audit","timestamp":"2022-09-04T22:54:53,028+0000","cluster.uuid":"sh0FdC0tRUGgzD6U7OsO3g","node.id":"rsRsMdvhREeQqLkk3twtqA","event.type":"transport","event.action":"access_granted","authentication.type":"REALM","user.name":"elastic","user.realm":"reserved","user.roles":["superuser"],"origin.type":"rest","origin.address":"192.0.2.20:48524","request.id":"sdzMxhL5Rga_wTaN7_pfsw","action":"indices:admin/create","request.name":"CreateIndexRequest","indices":["test_2"]}'
    key:
      - type
      - timestamp
      - cluster.uuid
      - node.id
  - type: Deprecation warnings
    sourcetype: elasticsearch_deprecation
    format: json
    desc: One object per warning. event.code and message name the deprecated feature (the index.data_path setting), elasticsearch.http.request.x_opaque_id identifies the client that used it, and log.level is WARN.
    sample: '{"@timestamp":"2022-09-05T11:43:34.505Z","log.level":"WARN","data_stream.dataset":"deprecation.elasticsearch","data_stream.namespace":"default","data_stream.type":"logs","elasticsearch.elastic_product_origin":"","elasticsearch.event.category":"settings","elasticsearch.http.request.x_opaque_id":"myAppId","event.code":"index.data_path","message":"[index.data_path] setting was deprecated in Elasticsearch and will be removed in a future release.","ecs.version":"1.2.0","service.name":"ES_ECS","event.dataset":"deprecation.elasticsearch","process.thread.name":"elasticsearch[8c0907d4a608][transport_worker][T#2]","log.logger":"org.elasticsearch.deprecation.common.settings.Settings","trace.id":"0af7651916cd43dd8448eb211c80319c","elasticsearch.cluster.uuid":"RUbX0Jn7SyuOho9LD0u82A","elasticsearch.node.id":"MmoGkS8rRRCQ1sSMruZB4A","elasticsearch.node.name":"8c0907d4a608","elasticsearch.cluster.name":"elasticsearch"}'
    key:
      - '@timestamp'
      - log.level
      - data_stream.dataset
      - data_stream.namespace
  - type: Query log
    sourcetype: elasticsearch_querylog
    format: json
    desc: One object per search. user.name and auth.type say who, elasticsearch.querylog.indices and elasticsearch.querylog.query what was searched (a match_all), elasticsearch.querylog.result_count the hits and elasticsearch.querylog.took_millis the time, and event.outcome whether it succeeded.
    sample: '{"@timestamp":"2026-03-31T19:36:14.805Z","log.level":"INFO","auth.type":"REALM","elasticsearch.querylog.dsl.total_count":3,"elasticsearch.querylog.indices":["query_log_test_index"],"elasticsearch.querylog.query":"{\"size\":10,\"query\":{\"match_all\":{\"boost\":1.0}}}","elasticsearch.querylog.result_count":3,"elasticsearch.querylog.shards.successful":1,"elasticsearch.querylog.took":1577209,"elasticsearch.querylog.took_millis":1,"elasticsearch.querylog.type":"dsl","elasticsearch.task.id":16285,"event.duration":1577209,"event.outcome":"success","http.request.headers.x_opaque_id":"riddle-me-this-batman-1774985774","trace.id":"0af7651916cd43dd8448eb211c80319c","user.name":"elastic","user.realm":"reserved","ecs.version":"1.2.0","service.name":"ES_ECS","event.dataset":"elasticsearch.querylog","process.thread.name":"elasticsearch[node-1][search][T#18]","log.logger":"elasticsearch.querylog","elasticsearch.cluster.uuid":"gjYgb-uQQAuLmDoKlQInZw","elasticsearch.node.id":"juurGSfgRYGwTP2ttZbtOQ","elasticsearch.node.name":"node-1","elasticsearch.cluster.name":"querying"}'
    key:
      - '@timestamp'
      - log.level
      - auth.type
      - elasticsearch.querylog.dsl.total_count
  - type: Server log
    sourcetype: elasticsearch_server
    format: json
    desc: One object per log line. log.level is INFO, log.logger names the component (index creation service) and message says a data stream backing index was created. elasticsearch.node.name and elasticsearch.cluster.name say where.
    sample: '{"@timestamp":"2022-09-04T22:54:04.249Z","log.level":"INFO","message":"[.ds-.logs-deprecation.elasticsearch-default-2022.09.04-000001] creating index, cause [initialize_data_stream], templates [.deprecation-indexing-template], s...","ecs.version":"1.2.0","service.name":"ES_ECS","event.dataset":"elasticsearch.server","process.thread.name":"elasticsearch[16f5806fc421][masterService#updateTask][T#1]","log.logger":"org.elasticsearch.cluster.metadata.MetadataCreateIndexService","elasticsearch.cluster.uuid":"sh0FdC0tRUGgzD6U7OsO3g","elasticsearch.node.id":"rsRsMdvhREeQqLkk3twtqA","elasticsearch.node.name":"16f5806fc421","elasticsearch.cluster.name":"elasticsearch"}'
    key:
      - '@timestamp'
      - log.level
      - message
      - ecs.version
  - type: Slow log
    sourcetype: elasticsearch_slowlog
    format: json
    desc: One object per slow operation. elasticsearch.slowlog.message names the index and shard ([test_1][0]), elasticsearch.slowlog.took the duration, elasticsearch.slowlog.total_hits the result size, and log.logger says it is the search query slow log.
    sample: '{"@timestamp":"2022-09-04T22:57:14.307Z","log.level":"DEBUG","elasticsearch.slowlog.id":null,"elasticsearch.slowlog.message":"[test_1][0]","elasticsearch.slowlog.search_type":"QUERY_THEN_FETCH","elasticsearch.slowlog.source":"{}","elasticsearch.slowlog.stats":"[]","elasticsearch.slowlog.took":"123.7micros","elasticsearch.slowlog.took_millis":0,"elasticsearch.slowlog.total_hits":"19 hits","elasticsearch.slowlog.total_shards":1,"ecs.version":"1.2.0","service.name":"ES_ECS","event.dataset":"elasticsearch.slowlog","process.thread.name":"elasticsearch[16f5806fc421][search][T#2]","log.logger":"index.search.slowlog.query","elasticsearch.cluster.uuid":"sh0FdC0tRUGgzD6U7OsO3g","elasticsearch.node.id":"rsRsMdvhREeQqLkk3twtqA","elasticsearch.node.name":"16f5806fc421","elasticsearch.cluster.name":"elasticsearch"}'
    key:
      - '@timestamp'
      - log.level
      - elasticsearch.slowlog.id
      - elasticsearch.slowlog.message
cves: []
detections:
  - title: Access denied or authentication failed
    severity: medium
    signals:
      - event.action
      - user.name
      - origin.address
      - action
    why: Denied actions and failed logins are someone trying to do what their roles do not allow, or guessing credentials. A burst from one address or against one user is the brute-force or privilege probing view of this source.
    kql: |
      dataset="elasticsearch_logs"
      | where sourcetype == "elasticsearch_audit" and ['event.action'] in ("access_denied", "authentication_failed")
      | project timestamp, ['event.action'], ['user.name'], ['origin.address'], action, indices
    mitre:
      - T1110
optimizations:
  - title: Drop routine granted-access audit events
    saving: most of the audit volume
    fn: Drop
    how: With auditing on, every allowed request produces access_granted events, which dwarf the rest. Keep denials, authentication failures and security configuration changes, and drop or sample routine grants.
    expr: __e['event.action'] == 'access_granted'
references:
  - title: Enable audit logging
    url: https://www.elastic.co/guide/en/elasticsearch/reference/current/enable-audit-logging.html
  - title: Elasticsearch logging
    url: https://www.elastic.co/guide/en/elasticsearch/reference/current/logging.html
  - title: Slow log
    url: https://www.elastic.co/guide/en/elasticsearch/reference/current/index-modules-slowlog.html
