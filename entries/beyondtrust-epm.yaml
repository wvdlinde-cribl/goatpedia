id: beyondtrust-epm
name: BeyondTrust Endpoint Privilege Management
short: BT EPM
vendor: BeyondTrust
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - EPM for Windows and Mac
  - Privilege Management for Windows and Mac
  - BeyondTrust EPM
tags:
  - endpoint
  - privilege-management
  - least-privilege
  - json
summary: BeyondTrust Endpoint Privilege Management (EPM) removes local administrator rights from Windows and macOS users and elevates individual applications by policy instead. An agent on each endpoint applies the policy, allows, elevates, blocks or prompts for each process, and reports what it did to the EPM management console. The events show which user tried to run what with elevated rights, on which host, and whether policy allowed it.
sourcetypes:
  - st: beyondtrust_epm
    desc: Endpoint Privilege Management events, one record per policy decision or agent event on a managed endpoint, such as an application elevation, block or authentication, with the host, user and outcome
facts:
  Product: Least-privilege and application control for Windows and macOS endpoints
  Form factor: An agent (adapter plus client) on each endpoint, managed from the EPM cloud console or an on-premises policy server
  Log transport: The EPM management console stores events and serves them through its events API, where any collector with an API client id and secret can read them. EPM can also send events to SIEMs as files or syslog
  Log format: JSON. Events follow Elastic Common Schema (ECS) field names such as event.action, event.outcome, host.name and user.name
  What an event answers: Which process on which host was elevated, allowed or blocked, for which user, under which rule, and whether it succeeded
placement:
  slots:
    - endpoint
    - cloud
  items:
    - slot: endpoint
      title: EPM agent on the workstation or server
      desc: The agent runs on each Windows or macOS machine, intercepts process starts and admin prompts, and applies the policy. Every decision is an event with the host and user.
    - slot: cloud
      title: EPM management console
      desc: The console holds policies and computer groups and receives events from every agent. Collectors read events from it.
howItWorks:
  - title: Policies and rules
    body: Administrators define workstyles with application groups and rules. A rule says what happens when a matching application starts or asks for admin rights, for example elevate silently, ask for a reason, require a challenge code, or block. Users work without local admin rights.
  - title: What an event records
    body: When a rule fires the agent records the application, the user, the host and the action taken. event.action names the decision, such as privilege-elevation, event.outcome whether it succeeded, and event.reason the explanation. host carries name, domain, operating system and addresses.
  - title: How the events leave the product
    body: Agents send events to the management console. A collector polls the console's events API with an OAuth client and receives JSON events in ECS shape. The destination is a choice of the pipeline, not a property of EPM.
traffic:
  handles:
    - Application elevation requests
    - Application allow and block decisions
    - Admin rights prompts and challenge-response
    - Agent and policy events
  flow:
    - step: User starts an application
      desc: A user launches a program or a task that needs administrator rights on a managed endpoint.
    - step: Agent applies policy
      desc: The EPM agent matches the application against the policy and elevates, allows, prompts or blocks it.
    - step: Console receives the event
      desc: The agent sends the decision with host, user and application details to the management console.
    - step: Collector polls
      desc: A collector reads new events from the console API and forwards each JSON object.
logs:
  - type: Privilege management event
    sourcetype: beyondtrust_epm
    format: json
