cves: []
detections:
  - title: Privilege elevation failed or blocked
    severity: medium
    signals:
      - event.action
      - event.outcome
      - event.reason
      - host.name
    why: A failed or blocked elevation is a user or process trying to gain admin rights that policy does not grant. Repeated attempts on one host, or attempts for unusual applications, can be an attacker trying to escalate privileges.
    kql: |
      dataset="beyondtrust-epm_logs"
      | where sourcetype == "beyondtrust_epm" and event.action == "privilege-elevation" and event.outcome == "failure"
      | project event.created, host.name, host.domain, event.action, event.outcome, event.reason
    mitre:
      - T1548
optimizations: []
references: []
