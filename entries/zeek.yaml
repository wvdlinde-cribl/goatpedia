cves:
  - id: CVE-2026-60109
    cvss: 7.5
    year: 2026
    kev: false
    scope: device
    title: Kerberos analyzer NULL-pointer dereference — crafted KRB_ERROR crashes the sensor
    affected: Zeek before 8.0.9
    fixed: 8.0.9
    detect: Worker crashes (zeekctl / cluster "crashed" status, crash reports) and gaps in conn.log for the affected worker. kerberos.log entries with error_msg KDC_ERR_PREAUTH_REQUIRED from unusual sources just before the gap.
    avoid: Upgrade to 8.0.9. Alert on sensor and worker silence. Restart policies keep the blind window short.
  - id: CVE-2026-60108
    cvss: 7.5
    year: 2026
    kev: false
    scope: device
    title: FTP analyzer uncontrolled memory consumption (AUTH GSSAPI + huge ADAT line) — DoS
    affected: Zeek before 8.0.9
    fixed: 8.0.9
    detect: Memory growth then OOM-kill of workers. ftp.log sessions with command AUTH and arg GSSAPI followed by ADAT from external sources. weird.log line-length anomalies.
    avoid: Upgrade to 8.0.9. Set memory limits per worker and monitor them.
  - id: CVE-2021-41732
    cvss: 7.5
    year: 2021
    kev: false
    scope: device
    title: HTTP request splitting can blind HTTP-based analysis (vendor disputes — "intended behaviour")
    affected: Zeek 4.1.0 (reported)
    detect: http.log entries with unexpected methods or missing hosts within one uid, and weird.log HTTP anomalies. Compare with WAF or proxy logs for the same uid / community_id.
    avoid: Don't rely on a single HTTP parser. Correlate with server or WAF logs. Keep Zeek current.
  - id: CVE-2019-12175
    cvss: 7.5
    year: 2019
    kev: false
    scope: device
    title: Kerberos parser NULL-pointer dereference (case-type index) — DoS
    affected: Zeek (Bro) before 2.6.2
    fixed: 2.6.2
    detect: Worker crashes during Kerberos traffic. Gaps in kerberos.log and conn.log.
    avoid: Upgrade. Legacy Bro 2.x sensors should be retired.
  - id: CVE-2020-1472
    cvss: 5.5
    year: 2020
    kev: true
    scope: traffic
    title: Zerologon — Netlogon (MS-NRPC) privilege escalation against domain controllers
    affected: Windows Server domain controllers without the August 2020+ Netlogon fix
    detect: notice.log Zerologon_Attempt / Zerologon_Password_Change from the corelight/zerologon package. dce_rpc.log bursts of NetrServerAuthenticate3 calls followed by NetrServerPasswordSet2 from one client.
    avoid: Patch DCs and enforce secure RPC (enforcement mode). Deploy the Zeek package for detection.
  - id: CVE-2017-0144
    cvss: 8.8
    year: 2017
    kev: true
    scope: traffic
    title: EternalBlue — SMBv1 remote code execution (WannaCry, NotPetya)
    affected: Windows SMBv1 servers (Vista – Server 2016 pre-MS17-010)
    detect: conn.log with service smb to many internal hosts on 445 from one source. smb_mapping / dce_rpc logs with SMBv1 negotiation. weird.log SMB anomalies. notice.log from EternalBlue detection packages.
    avoid: Apply MS17-010, disable SMBv1, segment 445 between workstations.
detections:
  - title: Beaconing — periodic connections with constant size
    severity: medium
    signals:
      - same id.orig_h → id.resp_h:id.resp_p
      - regular intervals
      - low variance in orig_bytes
    why: Implants check in on a timer. conn.log alone is enough to find them, even inside TLS, and it is the classic Zeek hunt (RITA-style).
    kql: |-
      dataset="zeek_conn" proto="tcp"
      | summarize n=count(), avg_b=avg(orig_bytes), sd_b=stdev(orig_bytes) by id.orig_h, id.resp_h, id.resp_p, bin(_time, 1h)
      | where n > 30 and sd_b < avg_b * 0.1
    mitre:
      - T1071.001
      - T1029
  - title: Large outbound transfer to a rare destination
    severity: high
    signals:
      - local_orig=true and local_resp=false
      - orig_bytes > 500 MB
      - destination seen by few hosts
    why: Exfiltration shows as an upload that is far larger than the response (orig_bytes ≫ resp_bytes) to an uncommon external host.
    kql: |-
      dataset="zeek_conn" local_orig=true local_resp=false
      | summarize up=sum(orig_bytes), down=sum(resp_bytes), hosts=dcount(id.orig_h) by id.resp_h, service
      | where up > 500000000 and up > down * 5 and hosts < 3
    mitre:
      - T1041
      - T1048
  - title: Self-signed or invalid certificate on outbound TLS
    severity: medium
    signals:
      - ssl.log validation_status != ok
      - server_name rare
      - established=true
    why: Commodity C2 and phishing kits often use self-signed or mismatched certs. Legitimate SaaS almost never does.
    kql: |-
      dataset="zeek_ssl" established=true
      | where validation_status in ("self signed certificate","unable to get local issuer certificate","certificate has expired")
      | summarize clients=dcount(id.orig_h), n=count() by server_name, id.resp_h, ja3
    mitre:
      - T1573.002
  - title: DNS tunnelling via long queries or TXT/NULL records
    severity: medium
    signals:
      - strlen(query) > 60
      - qtype_name in TXT, NULL
      - many unique subdomains under one parent
    why: Encodes data in query labels. Visible in dns.log even when clients use an external resolver directly.
    kql: |-
      dataset="zeek_dns"
      | extend parent=extract("([^.]+\\.[^.]+)$", 1, query)
      | where strlen(query) > 60 or qtype_name in ("TXT","NULL")
      | summarize names=dcount(query) by id.orig_h, parent, bin(_time, 10m)
      | where names > 50
    mitre:
      - T1071.004
      - T1048
  - title: Internal scanning / lateral SMB fan-out
    severity: high
    signals:
      - one id.orig_h to many id.resp_h on 445/3389/22
      - conn_state REJ / S0
    why: Worm-like spread (EternalBlue) and post-compromise discovery hit many internal hosts quickly. Failed handshakes (S0, REJ) make it obvious.
    kql: |-
      dataset="zeek_conn" id.resp_p in (445,3389,22,135) local_resp=true
      | summarize targets=dcount(id.resp_h), failed=countif(conn_state in ("S0","REJ","RSTO")) by id.orig_h, id.resp_p, bin(_time, 10m)
      | where targets > 50
    mitre:
      - T1046
      - T1021.002
  - title: Zerologon exploitation (Zeek package notice)
    severity: critical
    signals:
      - notice.log note Zerologon_Attempt / Zerologon_Password_Change
      - target is a domain controller
    why: A successful Zerologon resets the DC machine password and leads to domain takeover in minutes.
    kql: |-
      dataset="zeek_notice"
      | where note has "Zerologon"
      | summarize n=count(), first=min(_time) by src, dst, note
    mitre:
      - T1210
      - T1068
optimizations:
  - title: Filter low-value logs at the source
    saving: 10–25 %
    fn: Drop
    how: loaded_scripts, packet_filter, stats, capture_loss and reporter are operational, so send them to Lake or a metrics store. Keep conn, dns, http, ssl, x509, files, notice, weird, smb, kerberos, dce_rpc and intel.
    expr: "['loaded_scripts','packet_filter','stats','capture_loss','reporter'].includes(_path)"
  - title: Drop unanswered / scan noise from conn.log
    saving: 15–35 % of conn
    fn: Drop
    how: Inbound internet scans produce S0/REJ connections with zero bytes to closed ports. Keep a sampled or aggregated view, and drop the rest before the SIEM.
    expr: "!local_orig && ['S0','REJ','OTH'].includes(conn_state) && !orig_bytes && !resp_bytes"
  - title: Aggregate internal chatter to metrics
    saving: 30–50 % of conn
    fn: Aggregations
    how: Roll up internal DNS, NTP, LDAP and Kerberos conn records to counts and bytes per src/dst/service per minute. Raw records go to Lake for replay.
    expr: local_orig && local_resp && ['dns','ntp','krb','ldap'].includes(service)
  - title: Trim fields and convert TSV to JSON
    saving: 10–20 %
    fn: Parser → Serialize
    how: Parse TSV using the #fields header, drop missed_bytes, *_ip_bytes, tunnel_parents and "-" placeholders, and add community_id for joins with Suricata and EDR.
    expr: "remove: missed_bytes, orig_ip_bytes, resp_ip_bytes, tunnel_parents; drop '-' and '(empty)'"
  - title: Route by log path
    saving: SIEM licence
    fn: Routes
    how: notice, intel, weird, ssl, http, dns and files go to the SIEM. conn goes to Lake in full, with an aggregated copy in the SIEM. Pivot on uid when replaying an incident.
    expr: _path=='conn' → Lake + SIEM(aggregated)  |  else → SIEM
