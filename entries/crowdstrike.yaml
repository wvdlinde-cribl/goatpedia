      - event_simpleName
      - aid
      - CommandLine
      - ImageFileName
      - ParentBaseFileName
      - SHA256HashData
      - UserSid
      - TargetProcessId
    noise:
      - ConfigStateHash
      - ConfigBuild
      - Entitlements
      - EffectiveTransmissionClass
      - ProcessSxsFlags
      - WindowFlags
      - ShowWindowFlags
      - Tags
