facts:
  First released: 2013 (Falcon Host); FDR GA 2017
  Platform: Windows, macOS, Linux, ChromeOS, iOS/Android, containers / Kubernetes
  Delivery model: SaaS console (US-1, US-2, EU-1, US-GOV clouds) + kernel/user-mode sensor
  Telemetry export: Falcon Data Replicator — gzip NDJSON in a CrowdStrike-owned S3 bucket, SQS notifications
  Detection export: Event Streams (long-lived HTTPS stream), Alerts / Hosts / Spotlight REST APIs (OAuth2)
  Log format: JSON, one event per line, discriminated by event_simpleName
  Typical volume: 50–300 MB per endpoint per day FDR (≈ 1–10 GB per 1,000 hosts per hour at peak)
  Event types: 300+ event_simpleName values (ProcessRollup2, DnsRequest, NetworkConnectIP4, …)
  Cribl Pack: CrowdStrike FDR (cribl_crowdstrike, Packs Dispensary); Cribl Stream has a native CrowdStrike FDR Source
placement:
  slots:
    - endpoint
    - cloud
    - internal
  items:
    - slot: endpoint
      title: Sensor on every host
      desc: The Falcon sensor runs on workstations, servers and VDI. It records process, network, DNS, file, registry and module activity and enforces prevention policies locally, even offline.
    - slot: cloud
      title: Threat Graph (SaaS)
      desc: Telemetry is streamed over TLS to the CrowdStrike cloud, where cloud-side ML and IOA correlation generate detections. FDR and the APIs are read from here, never from the endpoint.
    - slot: cloud
      title: FDR bucket in AWS
      desc: CrowdStrike writes data/ and aidmaster/ batches to an S3 bucket it owns and announces each batch on SQS. A collector (Cribl Stream CrowdStrike Source, Splunk TA, SIEM connector) pulls them.
    - slot: internal
      title: Servers and domain controllers
      desc: Falcon Identity Protection adds AD/Kerberos/NTLM telemetry from sensors on domain controllers. DC sensors are often the noisiest FDR producers.
howItWorks:
  - title: Sensor and event model
    body: The kernel-mode sensor (user-mode eBPF on modern Linux) emits small typed events identified by event_simpleName. Every event carries aid (agent id), cid (customer id), aip (public IP seen by the cloud), event_platform and timestamp (ms, cloud receipt). Process events are linked by TargetProcessId / ParentProcessId — Falcon-unique ids, not OS PIDs (RawProcessId).
  - title: ProcessRollup2 and the process tree
    body: "ProcessRollup2 (PR2) is the anchor event: image path, command line, hashes, user SID, integrity level and parent. Child events (DnsRequest, NetworkConnectIP4, file writes, registry sets) reference the process through ContextProcessId = the PR2's TargetProcessId — that join is how you rebuild a process tree in a SIEM."
  - title: Indicators of Attack (IOA) and detections
    body: Behavioural IOAs and ML models run on the sensor and in the cloud. A match produces a detection (DetectionSummaryEvent in Event Streams, an alert in the Alerts API) with tactic/technique, severity and the PatternDisposition flags that say whether Falcon killed, blocked or only detected.
  - title: Falcon Data Replicator (FDR)
    body: "FDR is a firehose copy of all customer telemetry. CrowdStrike writes gzip NDJSON batches to data/ (events) and fdrv2/aidmaster, fdrv2/managedassets, fdrv2/notmanagedassets (inventory) in an S3 bucket, then posts an SQS message with the object keys. Consumers poll SQS, download, decompress and delete the message. Batches can be several GB, so the SQS visibility timeout must be long (Cribl recommends 6 h)."
  - title: Event Streams and REST APIs
    body: Event Streams is a long-lived HTTPS stream (OAuth2 client credentials) of detections, audit events (logins, policy changes, RTR sessions) and incident updates with a resumable offset. The REST APIs return alerts, hosts and Spotlight vulnerabilities on demand and are polled by SIEM connectors.
  - title: Enrichment gap
    body: FDR data/ events carry only aid, not the host name. ComputerName, OS, OU and agent version come from aidmaster/ and must be joined in the pipeline (Cribl Pack uses Redis or a lookup) — otherwise analysts see only hex ids.
traffic:
  handles:
    - Process creation / termination with full command line
    - DNS requests per process
    - TCP/UDP connect, accept and listen per process
    - File writes, executable drops, script content (AMSI)
    - Registry and service changes, scheduled tasks
    - Logons, user and token information
    - Detections, prevention actions and RTR sessions
  flow:
    - step: Kernel hook
      desc: The sensor observes a syscall/ETW/eBPF event (process start, socket connect, DNS query).
    - step: Local IOA / ML
      desc: On-sensor models decide prevent (kill/block/quarantine) or allow, independently of connectivity.
    - step: Stream to cloud
      desc: Typed events are sent over TLS to the Threat Graph; the cloud stamps timestamp and aip.
    - step: Cloud correlation
      desc: Cloud IOAs and threat intel correlate across hosts; a match creates a detection / alert.
    - step: Export
      desc: Telemetry is batched to FDR S3 + SQS; detections and audit events go to Event Streams / Alerts API.
    - step: Collect and enrich
      desc: Collector pulls from SQS/S3 or the API, joins aidmaster for host names, then routes to SIEM and lake.
