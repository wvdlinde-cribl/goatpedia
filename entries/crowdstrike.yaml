summary: Cloud-native EDR/XDR. A lightweight kernel sensor streams process, network, DNS, file and registry telemetry to the CrowdStrike Threat Graph, where detections are made. Customers get the raw telemetry through Falcon Data Replicator (gzip JSON in S3, announced via SQS) and the verdicts through the Event Streams and Alerts APIs — FDR is one of the largest single log sources a SOC can turn on.
sourcetypes:
  - st: crowdstrike:events:sensor
    desc: Splunk TA name for FDR sensor telemetry (ProcessRollup2, DnsRequest, NetworkConnectIP4 …)
  - st: crowdstrike_event_streams_json
    desc: Event Streams API (DetectionSummaryEvent, AuthActivityAuditEvent, UserActivityAuditEvent …)
  - st: crowdstrike_events_sensor
    desc: FDR sensor events, underscore variant of crowdstrike:events:sensor
  - st: crowdstrike_falcon
    desc: Generic Falcon JSON (detections and sensor events mixed)
  - st: falcon_events
    desc: Falcon sensor events collected without the FDR envelope
  - st: falcon_fdr
    desc: Falcon Data Replicator data/ prefix — all endpoint telemetry keyed by event_simpleName
  - st: falcon_fdr_aidmaster
    desc: FDR aidmaster/ prefix — host inventory (aid → ComputerName, OS, agent version)
  - st: falcon_fdr_external_api
    desc: FDR ExternalApiEvent records (cloud-side API activity, usually sampled)
  - st: falcon_rest_alerts
    desc: Alerts API (/alerts/entities/alerts/v2) detection and incident records
  - st: falcon_rest_devices
    desc: Hosts API (/devices/entities/devices/v2) device inventory
  - st: falcon_rest_vulnerabilities
    desc: Spotlight vulnerabilities API — CVE findings per host
