    title: Falcon sensor for Windows TOCTOU in Office macro removal → arbitrary file write / SYSTEM (CNA score)
    affected: Falcon sensor for Windows 7.34–8.10, 7.32 LTS, 7.16 (Win7/2008 R2), 7.33 and ≤7.31 (unsupported), when "Microsoft Office File Malicious Macro Removal" is enabled; Laroux Cleanup Tool ≤1.3.65.0
    fixed: 8.10.21408, 7.40.21309, 7.39.21113, 7.38.21007 LTS, 7.37.20912, 7.36.20807, 7.35.20712, 7.34.20613, 7.32.20410 LTS, 7.16.18644 (Win7/2008 R2); Laroux 1.4.70.0
    detect: "aidmaster AgentVersion below the fixed build on hosts with the macro-removal policy. In FDR: a non-admin process creating an NTFS mount point / reparse point under %TEMP%, followed by a write to System32\\WindowsPowerShell\\v1.0\\bcrypt.dll and a SYSTEM scheduled task (MareBackup) loading it."
    avoid: Upgrade the sensor via Sensor Update Policies; until then disable the macro-removal setting (Cloud Anti-malware for Office files still protects). Alert on unexpected DLL writes into System32.
  - id: CVE-2025-1146
    cvss: 8.1
    year: 2025
    kev: false
    scope: device
    title: Falcon sensor for Linux / Container / K8s Admission Controller TLS certificate validation flaw → MitM of sensor-to-cloud channel (CNA score)
    affected: Falcon sensor for Linux, Falcon Container Sensor and Falcon Kubernetes Admission Controller before 7.06
    fixed: 7.06 and later (all three components)
    detect: aidmaster AgentVersion < 7.06 on Linux; sensors reporting from an unexpected aip; gaps in sensor heartbeat events while the host is up.
    avoid: Upgrade to 7.06+; force sensor egress through a controlled proxy; alert on sensor version drift.
  - id: CVE-2025-42706
    cvss: 6.5
    year: 2025
    kev: false
    scope: device
    title: Falcon sensor for Windows logic error (origin validation) lets local code delete arbitrary files (paired with race condition CVE-2025-42701, 5.6)
    affected: Falcon sensor for Windows 7.24.19607 and earlier, 7.25.19706, 7.26.19809/19811, 7.27.19907, 7.28.20006; 7.16.18635 and earlier (Win7/2008 R2)
    fixed: 7.24.19608, 7.25.19707, 7.26.19813, 7.27.19909, 7.28.20008 and later; 7.16.18637 (Win7/2008 R2)
    detect: Sensor health events going silent or reduced-functionality mode after a low-privilege process ran; file-delete activity against sensor or OS files; aidmaster versions below the fixed builds.
    avoid: Upgrade the sensor; keep uninstall/maintenance tokens enabled; monitor for sensors that stop reporting.
  - id: CVE-2021-34527
    cvss: 8.8
    year: 2021
    kev: true
    scope: traffic
    title: Windows Print Spooler "PrintNightmare" RCE / LPE — a classic endpoint exploit Falcon is expected to catch
    affected: Windows client and server with the Print Spooler service running
    fixed: Microsoft July 2021 security updates (plus Point and Print registry hardening)
    detect: "PR2 child of spoolsv.exe (cmd.exe, rundll32.exe, powershell.exe); new DLL written under C:\\Windows\\System32\\spool\\drivers\\ followed by a module load in spoolsv.exe; Falcon detection with Technique \"Exploitation for Privilege Escalation\"."
    avoid: Patch; disable Print Spooler on domain controllers and servers that do not print; restrict Point and Print.
  - id: CVE-2023-23397
    cvss: 9.8
    year: 2023
    kev: true
    scope: traffic
    title: Microsoft Outlook NTLM credential leak via reminder sound path (zero-click)
    affected: Microsoft Outlook for Windows (all supported versions before the March 2023 update)
    fixed: Microsoft March 2023 security updates
    detect: NetworkConnectIP4 from OUTLOOK.EXE to an external IP on TCP 445 (SMB) or WebDAV; NTLM authentication to an internet host right after calendar processing.
    avoid: Patch Outlook; block outbound TCP 445 at the perimeter; add users to the Protected Users group.
detections:
  - title: Office application spawning a script interpreter
    severity: high
    signals:
      - event_simpleName=ProcessRollup2
      - ParentBaseFileName in WINWORD/EXCEL/OUTLOOK
      - ImageFileName ends powershell.exe / cmd.exe / wscript.exe / mshta.exe
    why: Macro or exploit-driven initial access almost always shows up as an Office parent launching an interpreter. Rare in legitimate use.
    kql: |-
      dataset="crowdstrike_fdr" event_simpleName="ProcessRollup2"
      | where ParentBaseFileName in~ ("WINWORD.EXE","EXCEL.EXE","POWERPNT.EXE","OUTLOOK.EXE")
      | where ImageFileName matches regex @"(?i)\\(powershell|pwsh|cmd|wscript|cscript|mshta|rundll32)\.exe$"
      | summarize count(), cmds=make_set(CommandLine, 5) by aid, ParentBaseFileName, ImageFileName
    mitre:
      - T1566.001
      - T1204.002
      - T1059.001
  - title: Encoded or hidden PowerShell
    severity: high
    signals:
      - event_simpleName=ProcessRollup2
      - CommandLine contains -enc / -EncodedCommand / -w hidden
    why: Base64-encoded PowerShell is the default for most loaders and post-exploitation frameworks; it hides the real command from simple string matching.
    kql: |-
      dataset="crowdstrike_fdr" event_simpleName="ProcessRollup2"
      | where ImageFileName endswith "powershell.exe" or ImageFileName endswith "pwsh.exe"
      | where CommandLine matches regex @"(?i)\s-(e|en|enc|encodedcommand)\s" or CommandLine has "-w hidden"
      | summarize count() by aid, UserSid, CommandLine
    mitre:
      - T1059.001
      - T1027.010
  - title: High / critical Falcon detection not blocked
    severity: critical
    signals:
      - metadata.eventType=DetectionSummaryEvent
      - event.SeverityName in High/Critical
      - PatternDisposition = detection only
    why: Falcon saw it but policy only detected. These are the detections that need a human fast, and they also expose prevention-policy gaps.
    kql: |-
      dataset="crowdstrike_events" metadata.eventType="DetectionSummaryEvent"
      | where event.SeverityName in ("High","Critical")
      | where event.PatternDispositionDescription !contains "Prevention"
      | summarize count(), first=min(_time) by event.ComputerName, event.UserName, event.DetectName, event.Tactic, event.Technique
    mitre:
      - T1059
      - T1204
  - title: DNS to newly seen or algorithmically generated domains
    severity: medium
    signals:
      - event_simpleName=DnsRequest
      - DomainName not seen in 30 days
      - high-entropy / long labels
    why: Process-attributed DNS lets you see which binary beacons. Rare domains contacted by a single process on few hosts are typical of C2.
    kql: |-
      dataset="crowdstrike_fdr" event_simpleName="DnsRequest"
      | where strlen(DomainName) > 40 or DomainName matches regex @"[a-z0-9]{20,}\."
      | summarize hosts=dcount(aid), lookups=count() by DomainName
      | where hosts < 3
    mitre:
      - T1071.004
      - T1568.002
  - title: Credential dumping tooling on host
    severity: critical
    signals:
      - event_simpleName=ProcessRollup2
      - CommandLine has sekurlsa / comsvcs.dll MiniDump / procdump lsass
    why: LSASS dumping precedes lateral movement with harvested credentials. Falcon usually blocks it; the attempt alone is worth an incident.
    kql: |-
      dataset="crowdstrike_fdr" event_simpleName="ProcessRollup2"
      | where CommandLine has_any ("sekurlsa","comsvcs.dll, MiniDump","comsvcs.dll MiniDump","procdump") and CommandLine has "lsass"
      | summarize count() by aid, UserSid, ImageFileName, CommandLine
    mitre:
      - T1003.001
  - title: Sensor gone quiet / downgraded
    severity: medium
    signals:
      - aidmaster AgentVersion below policy
      - no FDR events for an aid for > 24 h while aidmaster still lists it
    why: Tampering (or the 2025/2026 sensor CVEs) often shows up as a sensor that stops sending or runs an old build.
    kql: |-
      dataset="crowdstrike_fdr" event_simpleName="ProcessRollup2"
      | summarize last_seen=max(_time) by aid
      | join kind=rightouter (dataset="crowdstrike_aidmaster" | summarize arg_max(_time, ComputerName, AgentVersion) by aid) on aid
      | where isnull(last_seen) or last_seen < ago(24h)
    mitre:
      - T1562.001
optimizations:
  - title: Drop low-value event_simpleNames
    saving: 30–60 %
    fn: Drop + Lookup
    how: FDR ships hundreds of event types; most SOCs use a few dozen. Keep a lookup of allowed event_simpleName values (PR2, DnsRequest, NetworkConnectIP4, file-written, registry, user logon, detections) and drop the rest to Lake only.
    expr: "!C.Lookup('event_simpleName_keep.csv','event_simpleName').match(event_simpleName)"
  - title: Remove config and flag fields
    saving: 15–25 %
    fn: Eval (remove fields)
    how: ConfigBuild, ConfigStateHash, Entitlements, EffectiveTransmissionClass, *Flags, Tags and empty strings are present on almost every event and never searched.
    expr: "remove: ConfigBuild, ConfigStateHash, Entitlements, EffectiveTransmissionClass, *Flags, Tags; drop empty"
  - title: Drop DNS to top domains
    saving: 10–20 %
    fn: Lookup + Drop
    how: Most DnsRequest events resolve Microsoft, Google and CDN names. Drop DomainName values in a top-5k list (Majestic/Tranco) before the SIEM; keep everything in the lake.
    expr: event_simpleName=='DnsRequest' && C.Lookup('top_domains.csv','domain').match(DomainName)
  - title: Aggregate network connections
    saving: 10–25 %
    fn: Aggregations
    how: Repeated NetworkConnectIP4 / NetworkReceiveAcceptIP4 from the same process to the same destination roll up to one record with a count per minute.
    expr: "event_simpleName.startsWith('Network')  group by aid, ContextProcessId, RemoteAddressIP4, RemotePort  window 60s"
  - title: Enrich with aidmaster, route by value
    saving: Analyst time + SIEM licence
    fn: Lookup + Routes
    how: Join aid → ComputerName/OS/OU from aidmaster so detections are readable; send Event Streams detections and audit at full fidelity to the SIEM, all FDR raw to Cribl Lake for replay.
    expr: "metadata.eventType → SIEM  |  event_simpleName → Lake + SIEM(optimised)"
