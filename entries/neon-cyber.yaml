# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: neon-cyber
name: Neon Cyber
short: Neon Cyber
vendor: Neon Cyber
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Neon Cyber browser security
tags:
  - browser-security
  - phishing
  - endpoint
  - json
summary: A browser security product delivered as an extension in users' browsers. The extension watches what happens in the browser, such as where users sign in and which pages ask for credentials, and reports events and detections to the Neon Cyber cloud. Its events stream records browser telemetry with location and agent details, and its detections stream records risks such as a compromised credential entered in a web form.
sourcetypes:
  - st: neon_cyber
    desc: Browser telemetry events from the Neon Cyber extension, with event type, browser, agent version, IP and location
  - st: neon_cyber_detections
    desc: Detections raised by the extension, such as a compromised credential entered into a form, with URL, browser and location
facts:
  Product: Browser security extension with cloud management
  Clients: Extension in Chrome and other Chromium browsers on Windows, macOS and Linux
  Log transport: Neon Cyber API polled by a collector
  Log format: One JSON object per event or detection
  What an event answers: Which managed browser reported what, from which IP and location, with which agent version
  What a detection answers: What risk the extension found, on which URL, in which browser and where
placement:
  slots:
    - endpoint
    - cloud
  items:
    - slot: endpoint
      title: Browser extension
      desc: The extension runs in each user's browser and sees pages, forms and sign-ins. It is where the user acts.
    - slot: cloud
      title: Neon Cyber service
      desc: Events and detections from all extensions are collected in the Neon Cyber cloud for the deployment and read from its API.
howItWorks:
  - title: Extension telemetry
    body: Each installed extension is registered to a deployment and client. It sends events such as geo updates with the browser name and version, agent version, OS, architecture, IP and the location derived from it.
  - title: Detections
    body: When the extension sees a risk it raises a detection with detection_type (for example form), source (for example Compromised Credential), the URL and tab, whether the window was incognito, and the same browser and location context.
traffic:
  handles:
    - Web browsing and sign-in pages
    - Credential entry in web forms
  flow:
    - step: User browses
      desc: A user opens pages and fills forms in a managed browser.
    - step: Extension reports
      desc: The extension sends telemetry and raises detections to the Neon Cyber service.
    - step: Collector polls
      desc: A collector reads events and detections from the API. Goatpedia reads them as JSON.
logs:
  - type: Browser events
    sourcetype: neon_cyber
    format: json
    desc: One object per extension event. event_type says what was reported, name and version the browser, agent the extension version, and ip, city and country where it was. This sample is a geo event from Chrome on Windows. Values are documentation addresses.
    sample: '{"id":"67739497-055a-4ead-ac18-6af8482b93ff","deployment_id":"ec080215-913c-490c-bb81-a1baa311ee45","client_id":"3fcbb274-4dbb-4d77-b1e7-7336fcd3a609","registration_id":"25249c89-542d-4c59-b3f5-e455aeba0a54","event_type":"geo","event_timestamp":"2025-09-30T19:24:27.909+00:00","inserted_at":"2025-09-30T19:24:29.837364+00:00","updated_at":"2025-09-30T19:24:29.837364+00:00","agent":"1.2.25","arch":"x86-64","display":"Chrome","name":"chrome","os":"win","ua":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/192.0.2.20 Safari/537.36","version":"198.51.100.15","latitude":11.1111,"longitude":-0.111,"ip":"198.51.100.25","ip_latitude":11.1111,"ip_longitude":-0.111,"asn":7922,"asn_isp":"COMCAST-7922","city":"Portland","country":"US","postal_code":"97214","region_code":"OR","region_name":"Oregon","tab_id":null,"url":null,"frame_id":null}'
    key:
      - id
      - deployment_id
      - client_id
      - registration_id
  - type: Detections
    sourcetype: neon_cyber_detections
    format: json
    desc: One object per detection. detection_type and source say what was found, url where, and incognito, name and os in which browser. This sample is a compromised credential entered into a form in Chrome on Linux. Values are documentation addresses.
    sample: '{"id":"344d53e6-43b4-4cdd-84ad-9421a5f6dc31","deployment_id":"ec080215-913c-490c-bb81-a1baa311ee45","client_id":"d19143bd-3a34-4c7e-886b-87f643df4835","registration_id":"a00db187-ad55-4074-8a84-d085555abe29","detection_type":"form","detection_subtype":null,"detection_timestamp":"2025-10-10T17:09:32.988+00:00","inserted_at":"2025-10-13T18:13:16.648002+00:00","updated_at":"2025-10-13T18:13:16.648002+00:00","source":"Compromised Credential","description":null,"tab_id":12345,"url":"https://support.notanapp.com","incognito":false,"agent":"1.2.4","arch":"arm64","display":"Chrome","name":"chrome","os":"linux","ua":"Mozilla/5.0 (X11; Linux aarch64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/203.0.113.8 Safari/537.36","version":"203.0.113.40","latitude":11.1111,"longitude":-0.111,"ip_latitude":11.1111,"ip_longitude":-0.111,"asn":9105,"asn_isp":"TalkTalk","city":"Brighton","country":"GB","postal_code":"BN3"}'
    key:
      - id
      - deployment_id
      - client_id
      - registration_id
cves: []
detections:
  - title: Compromised credential used in a browser form
    severity: high
    signals:
      - detection_type
      - source
      - url
      - client_id
    why: A known-compromised credential typed into a web form means a user is still using a leaked password. The account behind it should be reset.
    kql: |
      dataset="neon-cyber_logs"
      | where sourcetype == "neon_cyber_detections" and source == "Compromised Credential"
      | project detection_timestamp, detection_type, url, client_id, name, os, country
    mitre:
      - T1078
optimizations: []
references: []
