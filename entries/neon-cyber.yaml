  - st: neon_cyber_detections
    desc: 'Elastic integrations fixture, 3 events. Upstream: neon_cyber/data_stream/detections/_dev/test/pipeline/test-detections.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: neon_cyber
  Sourcetypes: '2'
  Fixture events: '9'
  Log format seen: json
  Fields in the first fixture: id, deployment_id, client_id, registration_id, event_type, event_timestamp
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Neon Cyber events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries id, deployment_id, client_id, registration_id, event_type, event_timestamp. Values in the sample were rewritten to documentation addresses.
