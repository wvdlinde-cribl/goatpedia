# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: microsoft-intune
name: Microsoft Intune
short: Intune
vendor: Microsoft
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Microsoft Endpoint Manager
  - Intune MDM
tags:
  - mdm
  - endpoint-management
  - compliance
  - audit
  - json
summary: Microsoft's cloud mobile device and endpoint management service. It enrols Windows, macOS, iOS, Android and Linux devices, pushes configuration and app policies, and judges devices compliant or not for Conditional Access. Through diagnostic settings it exports an audit log of admin changes and a device inventory with compliance and ownership.
sourcetypes:
  - st: microsoft_intune_audit
    desc: Intune audit log, one admin or app change such as creating, updating or deleting a policy, with actor and targets
  - st: microsoft_intune_managed_device
    desc: Managed device inventory, one device with owner, OS, model, serial, compliance state and management state
facts:
  Product: Cloud MDM and endpoint management with compliance for Conditional Access
  Devices: Windows, macOS, iOS/iPadOS, Android and Linux
  Log transport: Diagnostic settings export to an Event Hub, storage or a Log Analytics workspace, read by a collector
  Log format: One JSON object per record, Azure Monitor resource log shape (time, tenantId, category, operationName, properties)
  What an audit record answers: Who (Actor.UPN or application) did which operation on which target, and whether it succeeded
  What a device record answers: Which device belongs to whom, what it runs, and whether it is compliant and managed
placement:
  slots:
    - cloud
    - endpoint
  items:
    - slot: cloud
      title: Intune service
      desc: Policies, compliance and the audit log live in the Intune service in Microsoft's cloud. Diagnostic settings export records to an Event Hub for any collector.
    - slot: endpoint
      title: Managed devices
      desc: Enrolled devices check in, receive policies and report state. Their inventory and compliance appear in the device records.
howItWorks:
  - title: Enrolment and policy
    body: Devices enrol in Intune and check in regularly. Admins assign configuration, compliance and app policies. Compliance results feed Entra ID Conditional Access.
  - title: Audit log
    body: Every create, update, delete and action in Intune is audited. operationName names the operation (for example Delete DeviceManagementConfigurationPolicy), properties.Actor the user or app, properties.Targets the objects and their modified properties, and ActivityResultStatus the result.
  - title: Device export
    body: The Devices category exports the managed device inventory with DeviceName, UPN, OS and version, model, serial, CompliantState, Ownership, ManagedBy and encryption status.
traffic:
  handles:
    - Device enrolment and check-in
    - Policy and app assignment
    - Compliance evaluation
    - Admin changes
  flow:
    - step: Admin or device acts
      desc: An admin changes a policy, or a device checks in and reports state.
    - step: Intune records it
      desc: The service writes an audit record or updates the device inventory.
    - step: Diagnostic export
      desc: Diagnostic settings stream the records to an Event Hub. A collector reads them. Goatpedia reads them as JSON.
logs:
  - type: Audit log
    sourcetype: microsoft_intune_audit
    format: json
    desc: One object per audited operation. operationName says what was done, properties.Actor.UPN who did it, and properties.TargetDisplayNames to what. This sample is a configuration policy named Testing1 being deleted through the Intune portal. Values are documentation addresses.
    sample: '{"time":"2026-02-12T06:43:08.8107000Z","tenantId":"3adb963c-8e61-48e8-a06d-6dbb0dacea39","category":"AuditLogs","operationName":"Delete DeviceManagementConfigurationPolicy","properties":{"ActivityDate":"2/12/2026 6:43:08 AM","ActivityResultStatus":1,"ActivityType":1,"Actor":{"ActorType":1,"Application":"5926fc8e-304e-4f59-8bed-58ca97cc39a4","ApplicationName":"Microsoft Intune portal extension","IsDelegatedAdmin":false,"Name":null,"ObjectId":"1ce0bf0b-1a79-4caf-b932-4658cf273074","PartnerTenantId":"00000000-0000-0000-0000-000000000000","UserPermissions":["*"],"UPN":"user@example.com"},"AdditionalDetails":"Key = AccountQuotaEntityValue = DeviceConfiguration\r\n","AuditEventId":"73537880-bdd5-4a62-8251-68a3a4c7bdbe","Category":3,"RelationId":null,"TargetDisplayNames":["Testing1"],"TargetObjectIds":["916dc511-df99-45da-8eb6-1ac55579e16f"],"Targets":[{"ModifiedProperties":[{"Name":"Name","Old":null,"New":"Testing1"}],"Name":"Testing1"}]},"resultType":"Success","resultDescription":"None","correlationId":"aa49be9b-7f26-41cf-9e42-bca545ca88b4","identity":"user@example.com"}'
    key:
      - time
      - tenantId
      - category
      - operationName
  - type: Managed devices
    sourcetype: microsoft_intune_managed_device
    format: json
    desc: One object per managed device. properties.DeviceName, UPN, OS, CompliantState, Ownership and DeviceState describe it. This sample is a compliant, corporate Windows laptop managed by Intune. Values are documentation addresses.
    sample: '{"time":"2023-10-27T00:10:43.5547000Z","tenantId":"3adb963c-8e61-48e8-a06d-6dbb0dacea39","category":"Devices","operationName":"Devices","resultType":"None","properties":{"DeviceId":"6c4217e6-bc89-4e7f-a04c-129f04866de4","DeviceName":"CLW555TEST","UPN":"user@example.com","LastContact":"2023-10-26 12:23:58.7994868","OSVersion":"10.0.22621.2428","OS":"Windows","CompliantState":"Compliant","Ownership":"Corporate","ManagedBy":"Intune","Model":"20U1A006IG","SerialNumber":"PF2C55YE","Manufacturer":"LENOVO","CreatedDate":"2023-10-20 06:55:27.6237465","DeviceState":"Managed","UserEmail":"user@example.com","UserName":"CDP User IS-38411","IMEI":"","PhoneNumber":"","DeviceRegistrationState":"Registered","ReferenceId":"f18bd540-d5e4-46e0-8ddd-3d03a59e4e14","ManagedDeviceName":"cdp.38411_Windows_10/20/2023_6:55 AM","GraphDeviceIsManaged":true,"CategoryName":"","EncryptionStatusString":"True","SubscriberCarrierNetwork":"","JoinType":"Azure AD joined","SupervisedStatusString":"False","WifiMacAddress":"A87EEABC6AC9","StorageTotal":243406,"StorageFree":205247}}'
    key:
      - time
      - tenantId
      - category
      - operationName
cves: []
detections:
  - title: Intune policy deleted
    severity: medium
    signals:
      - operationName
      - properties.Actor.UPN
      - properties.TargetDisplayNames
    why: Deleting a configuration or compliance policy removes protection from every device it was assigned to. Deletions should map to a known admin and change.
    kql: |
      dataset="microsoft-intune_logs"
      | where sourcetype == "microsoft_intune_audit" and operationName startswith "Delete"
      | project time, operationName, properties.Actor.UPN, properties.Actor.ApplicationName, properties.TargetDisplayNames
    mitre:
      - T1562
  - title: Non-compliant managed device
    severity: low
    signals:
      - properties.CompliantState
      - properties.DeviceName
      - properties.UPN
    why: A non-compliant device is blocked or flagged by Conditional Access. Corporate devices that stay non-compliant miss required security settings.
    kql: |
      dataset="microsoft-intune_logs"
      | where sourcetype == "microsoft_intune_managed_device" and properties.CompliantState != "Compliant"
      | project time, properties.DeviceName, properties.UPN, properties.OS, properties.CompliantState, properties.Ownership
optimizations: []
references:
  - title: Send Intune log data to Azure Monitor
    url: https://learn.microsoft.com/en-us/mem/intune/fundamentals/review-logs-using-azure-monitor
