id: forescout
name: Forescout Platform
short: Forescout
vendor: Forescout
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Forescout CounterACT
  - Forescout eyeSight
  - Forescout eyeControl
tags:
  - nac
  - asset-inventory
  - network-security
  - kv
  - json
summary: A network access control and device visibility platform. Forescout appliances watch the network through switch, wireless, DHCP and traffic integrations, classify every connected device, check compliance policies and can restrict or quarantine devices. The appliances log their own system activity, such as commands run on the appliance, and can publish host properties for each device they see.
sourcetypes:
  - st: forescout
    desc: System log events from a Forescout appliance, such as privileged commands run by its services or administrators
  - st: forescout_host
    desc: Host property records for one device seen by the platform, such as IP, MAC, compliance state, segment, open ports and user
facts:
  Product: Network access control, device classification and compliance enforcement
  Form factor: Physical or virtual appliances with an Enterprise Manager that manages them
  Log transport: Syslog from the appliances; host properties published through syslog or the platform's integration and API modules
  Log format: Syslog with key=value pairs (sudo style) for system events; JSON records of host properties for devices
  What a system event answers: Which service or user ran which command as which account on the appliance, in which directory
  What a host record answers: What a device is, where it is connected, whether it is compliant or a guest, and who uses it
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Forescout appliances
      desc: Appliances connect to switches, wireless controllers and a traffic mirror in the campus and data centre. They discover and classify devices, apply policy, and send system logs and host properties to a receiver.
howItWorks:
  - title: Discovery and classification
    body: The appliance learns about devices from switch and wireless controller queries, DHCP, traffic and optional agents, then resolves properties such as IP, MAC, operating system, open ports, segment and logged-on user.
  - title: Policy and control
    body: Policies evaluate host properties, for example whether antivirus is running or whether the device is corporate or guest, and set compliance state. Actions can notify, move a device to a VLAN, or block it.
  - title: System logs
    body: Like any Linux-based appliance, Forescout logs privileged commands. A sudo-style entry names the calling service or user, the TTY, working directory, run-as user and command.
  - title: How the data leaves the platform
    body: The appliance sends its system log over syslog. Host properties are published by the platform's syslog and integration modules or read through its API. Any receiver can take them.
traffic:
  handles:
    - Device discovery and classification
    - Compliance checks and network access control
    - Appliance administration
  flow:
    - step: Device connects
      desc: A device joins a switch port, wireless network or VPN.
    - step: Forescout classifies
      desc: The appliance resolves the device's properties and evaluates policy.
    - step: Record or log
      desc: Host properties are published, and the appliance's own commands are written to its system log.
    - step: Receiver collects
      desc: A syslog receiver or API collector takes the records.
logs:
  - type: Appliance system log
    sourcetype: forescout
    format: kv
    desc: One sudo-style line per command. The calling service is _fsservice, USER is root, PWD is the working directory, and COMMAND is the command run (an fstool netflow initialisation here).
    sample: '_fsservice : TTY=unknown ; PWD=/usr/local/forescout ; USER=root ; COMMAND=/bin/fstool netflowtool netflow_init_softflow'
    key:
      - TTY
      - PWD
      - USER
      - COMMAND
  - type: Host properties
    sourcetype: forescout_host
    format: json
    desc: One object per device. ip is the device address, compliance_state and guest_corporate_state the policy results, segment_name and segment_path where it sits, openports and os_cpe what it runs, and user who uses it. Values such as Unknown and Irresolvable mean the property could not be resolved. The address is a documentation address.
    sample: '{"timestamp":"2026-03-20T10:41:23.966575","access_ip":"Unknown","compliance_state":"N/A","guest_corporate_state":"N/A","device_interfaces":"Irresolvable","is_dhcp_relay":"No DHCP traffic seen","is_dhcp_server":"No DHCP traffic seen","is_behind_nat":"Irresolvable","dhcp_server":"Unknown","ip":"198.51.100.25","mac":"Unknown","nested_device_id":"Unknown","nested_device_parent_ip":"Unknown","hwi_network_adapters":"Irresolvable","openports":"Unknown","os_cpe":"Irresolvable","segment_name":"","segment_path":"Irresolvable","smb_relay":"Irresolvable","user":"User"}'
    key:
      - timestamp
      - access_ip
      - compliance_state
      - guest_corporate_state
cves: []
detections:
  - title: Device not compliant
    severity: medium
    signals:
      - compliance_state
      - ip
      - mac
      - segment_name
    why: A non-compliant device failed a policy check such as missing endpoint protection or an unsupported operating system. These are the devices that policy may quarantine and that should be fixed or explained.
    kql: |
      dataset="forescout_logs"
      | where sourcetype == "forescout_host" and compliance_state == "Not Compliant"
      | project timestamp, ip, mac, user, segment_name, os_cpe, compliance_state
optimizations: []
references: []
