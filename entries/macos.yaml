optimizations:
  - title: Drop Info and Debug messages
    saving: a large share of unified log volume
    fn: Drop
    how: The unified log is very chatty at Info and Debug. Security use needs Default, Error and Fault messages from the selected subsystems. Better still, narrow the predicate on the Mac so the noise is never exported.
    expr: messageType == 'Info' || messageType == 'Debug'
    stream:
      log: System services
      functions:
        - id: drop
          filter: messageType == 'Info' || messageType == 'Debug'
          description: Drop Info and Debug unified log messages; keep Default, Error and Fault
          conf: {}
      test:
        - '{"timezoneName":"","messageType":"Info","eventType":"logEvent","source":null,"formatString":"[%p] activating connection: mach=%{bool}d listener=%{bool}d peer=%{bool}d name=%{public}s","userID":0,"activityIdentifier":0,"subsystem":"com.apple.xpc","category":"connection","threadID":12345,"senderImageUUID":"ABCE7E08-7D29-3BE0-AF60-F0DC752E951C","backtrace":{"frames":[{"imageOffset":43862,"imageUUID":"ABCE7E08-7D29-3BE0-AF60-F0DC752E951C"}]},"bootUUID":"218031E6-E47F-4A77-B7FC-5A57B049F4BC","processImagePath":"/usr/libexec/launchd","senderImagePath":"/usr/lib/system/libxpc.dylib","timestamp":"2025-12-19 15:18:32.238726+0530","machTimestamp":454777460134003,"eventMessage":"[0x7fd20cffa690] activating connection: mach=true listener=false peer=false name=com.apple.xpc.launchd","processImageUUID":"04C516B8-C8E5-30EF-AC49-1631528F5645","traceID":35866893965594628,"processID":1,"senderProgramCounter":43862,"parentActivityIdentifier":0}'
        - '{"timezoneName":"","messageType":"Debug","eventType":"logEvent","source":null,"formatString":"[%p] activating connection: mach=%{bool}d listener=%{bool}d peer=%{bool}d name=%{public}s","userID":0,"activityIdentifier":0,"subsystem":"com.apple.xpc","category":"connection","threadID":12345,"senderImageUUID":"ABCE7E08-7D29-3BE0-AF60-F0DC752E951C","backtrace":{"frames":[{"imageOffset":43862,"imageUUID":"ABCE7E08-7D29-3BE0-AF60-F0DC752E951C"}]},"bootUUID":"218031E6-E47F-4A77-B7FC-5A57B049F4BC","processImagePath":"/usr/libexec/launchd","senderImagePath":"/usr/lib/system/libxpc.dylib","timestamp":"2025-12-19 15:18:32.238726+0530","machTimestamp":454777460134003,"eventMessage":"[0x7fd20cffa690] activating connection: mach=true listener=false peer=false name=com.apple.xpc.launchd","processImageUUID":"04C516B8-C8E5-30EF-AC49-1631528F5645","traceID":35866893965594628,"processID":1,"senderProgramCounter":43862,"parentActivityIdentifier":0}'
      expect:
        out: 1
        smaller: true
