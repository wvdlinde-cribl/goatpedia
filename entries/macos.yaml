# Goatpedia entry — see CONTRIBUTING.md and schema/entry.schema.json
id: macos
name: macOS unified logging
short: macOS
vendor: Apple
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - macOS
  - Mac OS X
  - OS X
  - Apple unified log
tags:
  - os
  - endpoint
  - apple
  - unified-logging
  - json
summary: The operating system of Apple's Mac computers. Since macOS 10.12, system components and apps write to the unified logging system, which tags every message with a subsystem, category, process and level. Exported as JSON, those messages show logins and logouts, file access by sandboxed apps, network connections, code-signing and Gatekeeper decisions, and account changes on each Mac.
sourcetypes:
  - st: macos_advanced_monitoring
    desc: Unified log messages of low-level system services, such as XPC connections made by launchd
  - st: macos_authentication
    desc: Unified log messages about login, logout and session handling from loginwindow and related services
  - st: macos_file_read_write
    desc: Unified log messages about file opens and access by apps, such as sandbox filesystem messages
  - st: macos_network_activity
    desc: Unified log messages from the network stack about connections opened, used and cancelled
  - st: macos_process_execution_monitoring
    desc: Unified log messages about process execution and code signing from securityd and related services
  - st: macos_system_change
    desc: Unified log messages about system policy and configuration, such as syspolicyd decisions on apps
  - st: macos_user_and_account_management
    desc: Unified log messages about users and accounts from opendirectoryd, such as SecureToken status
facts:
  Product: Apple's desktop and laptop operating system
  Form factor: Mac laptops and desktops, usually managed by an MDM
  Logging system: Unified logging, read with the log command (log show or log stream with --style ndjson)
  Log transport: An agent on the Mac runs log stream or log show and forwards the JSON; nothing is pushed off the Mac by default
  Log format: One JSON object per message with subsystem, category, processImagePath, messageType and eventMessage
  What a message answers: Which process and subsystem logged what, at what time and level, under which user ID
placement:
  slots:
    - endpoint
  items:
    - slot: endpoint
      title: Mac
      desc: The unified log lives on each Mac. An agent on the device streams or exports it as JSON and forwards it. Every stream here is a slice of the same unified log, selected by subsystem and process.
howItWorks:
  - title: Unified logging
    body: Apple's components and apps log through os_log. Each message is stored with a timestamp, subsystem (such as com.apple.network), category, the process image path and ID, the user ID, a level (Default, Info, Debug, Error, Fault) and the formatted message. The format string is kept separately from the message.
  - title: Streams by subsystem
    body: The streams here are filters on the same log. Authentication comes from loginwindow, file access from com.apple.sandbox, network from com.apple.network, code signing from com.apple.securityd, system policy from syspolicyd and accounts from opendirectoryd.
  - title: Getting the log off the Mac
    body: The unified log is local and compressed. An agent runs log stream or log show with an ndjson style and a predicate, and forwards each JSON object. Any collector can take it from there.
traffic:
  handles:
    - Login and logout sessions
    - File access by apps
    - Network connections
    - Code signing and Gatekeeper decisions
    - User and account management
  flow:
    - step: Component logs
      desc: A macOS component or app writes an os_log message under its subsystem and category.
    - step: Unified log stores it
      desc: The message is kept in the local unified log store with process, user and level.
    - step: Agent exports JSON
      desc: An agent on the Mac streams the log as JSON objects with a predicate for the subsystems it wants. Goatpedia reads the samples as JSON.
logs:
  - type: System services
    sourcetype: macos_advanced_monitoring
    format: json
    desc: One unified log message. subsystem, category and processImagePath say who logged, eventMessage what happened. This sample is launchd activating an XPC connection.
