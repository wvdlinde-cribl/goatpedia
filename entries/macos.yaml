      - timezoneName
      - messageType
      - eventType
      - source
  - type: Login and sessions
    sourcetype: macos_authentication
    format: json
    desc: One unified log message from the login stack. processImagePath is loginwindow and eventMessage describes the session. This sample is the session logout manager building the session dictionary for a logout.
