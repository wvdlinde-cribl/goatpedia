    sample: '{"timezoneName":"","messageType":"Default","eventType":"logEvent","source":null,"formatString":"code signing internal problem: unexpected error from xpc: %s","userID":501,"activityIdentifier":0,"subsystem":"com.apple.securityd","category":"SecError","threadID":199743,"senderImageUUID":"AF38D16B-954C-3A9E-B0F7-5100DB3D566C","backtrace":{"frames":[{"imageOffset":2219233,"imageUUID":"AF38D16B-954C-3A9E-B0F7-5100DB3D566C"}]},"bootUUID":"AB156DC0-B7BC-4860-9E5C-A34A8BBE8699","processImagePath":"/System/Library/Frameworks/StoreKit.framework/Support/storekitagent","senderImagePath":"/System/Library/Frameworks/Security.framework/Versions/A/Security","timestamp":"2026-01-13 17:58:13.140307+0530","machTimestamp":82458117633560,"eventMessage":"code signing internal problem: unexpected error from xpc: <dictionary: 0x7ff8593dcce0> { count = 1, transaction: 0, voucher = 0x0, contents =\n\t\"XPCErrorDescr...","processImageUUID":"63A2B64B-11CA-3ABA-94D7-3916A3BD8D08","traceID":232616665735757820,"processID":552,"senderProgramCounter":2219233,"parentActivityIdentifier":0}'
