aka:
  - Qualys GAV
  - Qualys CyberSecurity Asset Management
  - Qualys CSAM
tags:
  - asset-inventory
  - cmdb
  - vulnerability-management
  - saas
  - json
summary: 'Qualys'' asset inventory application. It combines data from Qualys Cloud Agents, scanners and connectors into one record per asset, with hardware, operating system, software, network and cloud details normalised against a catalogue. These records are inventory: what each asset is, where it runs and when it was last seen.'
sourcetypes:
  - st: qualys_gav_asset
    desc: Asset records with identifiers, addresses, operating system, hardware, last boot, user and sensor timestamps
facts:
  Product: IT asset discovery and inventory on the Qualys platform
  Sensors: Qualys Cloud Agent, network scanners, passive sensors and cloud connectors
  Log transport: Qualys asset API over HTTPS, polled by a collector with platform credentials
  Log format: One JSON object per asset
  What an asset record answers: What the asset is (OS, hardware, cloud instance), its address and name, who last logged on, and when it last reported
placement:
  slots:
    - cloud
    - endpoint
  items:
    - slot: cloud
      title: Qualys platform
      desc: Inventory is built and stored in the Qualys cloud platform. A collector polls its API.
    - slot: endpoint
      title: Cloud Agent
      desc: The Cloud Agent runs on servers, workstations and cloud instances and reports hardware and software inventory.
howItWorks:
  - title: Sensors
    body: Agents and scanners report what they find on each asset. Connectors add cloud metadata.
  - title: Normalisation
    body: Raw OS, hardware and software names are mapped to a catalogue with categories, lifecycle and vendor.
  - title: How the records leave the product
    body: A collector pages through the asset API and stores one record per asset, typically using lastModifiedDate to fetch changes.
traffic:
  handles:
    - Asset discovery
    - Hardware and software inventory
  flow:
    - step: Sensor reports
      desc: An agent or scanner reports the asset's inventory.
    - step: Platform normalises
      desc: Qualys merges and normalises the data into the asset record.
    - step: Collector polls
      desc: A collector reads changed assets from the API.
logs:
  - type: Asset inventory
    sourcetype: qualys_gav_asset
    format: json
