id: imperva-waf
name: Imperva Cloud WAF (Incapsula)
short: Imperva WAF
aka:
  - Incapsula
  - Imperva Cloud Application Security
  - Imperva Cloud WAF
  - Thales Imperva
  - Imperva WAF Gateway (on-prem, ex-SecureSphere)
vendor: Imperva (Thales)
category: waf
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - waf
  - cdn
  - ddos
  - bot-protection
  - reverse-proxy
  - cef
  - saas
summary: A cloud reverse-proxy that sits in front of web sites and APIs — DNS points the site at Imperva's PoPs, which terminate TLS, apply WAF rules, bot and DDoS protection, cache content and forward clean requests to the origin. Every request (access log) and every rule hit (security log) is delivered in batched CEF, LEEF or W3C files that SIEMs pull from an API or receive via SFTP/S3/HEC.
sourcetypes:
  - st: imperva_incapsula_waf
    desc: Cloud WAF SIEM log events (CEF) — access and security events in one stream
  - st: imperva:incapsula
    desc: Splunk-style sourcetype used by the Imperva SIEM package / Splunk add-ons
  - st: cef:imperva
    desc: Generic CEF routing name for Incapsula SIEMintegration events
  - st: ImpervaWAFCloudV2
    desc: Microsoft Sentinel table (SentinelImpervaWAFCloudV2Logs) fed by the Imperva connector
  - st: imperva_waf
    desc: 'Splunk Connect for Syslog fixture, 2 events. Upstream: tests/test_imperva_waf.py'
  - st: imperva_waf_firewall_cef
    desc: 'Splunk Connect for Syslog fixture, 2 events. Upstream: tests/test_imperva_waf.py'
  - st: imperva_waf_security_cef
    desc: 'Splunk Connect for Syslog fixture, 3 events. Upstream: tests/test_imperva_waf.py'
facts:
  First released: 2009 (Incapsula); acquired by Imperva 2014, Imperva by Thales 2023
  Delivery model: SaaS reverse proxy on a global PoP network (CDN + WAF + DDoS)
  Onboarding: DNS change (CNAME / A record) or BGP (network DDoS for whole subnets)
  Log types: Access logs (every request) and Security logs (rule hits), delivered together
  Log transport: Pull via Log Integration API, or push to SFTP, Amazon S3 or Splunk HEC
  Log format: CEF (default), LEEF or W3C; files compressed, optionally RSA/AES encrypted
  Latency: Security logs ~3–5 min, access logs ~10 min (up to 30+ min under load)
  Typical volume: 1 event per HTTP request when access logging is on — millions/day per busy site
  Cribl Pack: Imperva WAF & DAM (criblpacks/cribl-imperva, Packs Dispensary)
placement:
  slots:
    - cloud
    - edge
    - dmz
  items:
    - slot: cloud
      title: Imperva PoP (reverse proxy)
      desc: Requests resolve to Imperva's anycast PoPs, where TLS is terminated and WAF, bot, DDoS and caching run. The logs are produced here, not on your network.
    - slot: edge
      title: In front of the internet perimeter
      desc: Origin servers are reachable only from Imperva IP ranges; direct-to-origin traffic should be blocked at the firewall so the WAF can't be bypassed.
    - slot: dmz
      title: Origin web / API servers
      desc: Clean traffic is forwarded to the origin in the DMZ or cloud. The original client IP arrives in X-Forwarded-For / Incap-Client-IP, which origin logs must record for correlation.
howItWorks:
  - title: Reverse proxy on DNS
    body: The protected site's DNS record points at an Imperva CNAME. Clients connect to the nearest PoP, which terminates TLS with a managed or uploaded certificate, inspects the request and opens its own connection to the origin. Each request gets a unique deviceExternalId (request ID) that ties the log to the console.
  - title: WAF rule engine
    body: Managed rules cover SQL injection (code 0), cross-site scripting (1), illegal resource access (3), remote file inclusion (10) and backdoor uploads (9); custom IncapRules (11) add ACL-style logic. The attack name and code are written into the CEF header; the matched rule IDs land in fileType/filePermission and mapped CVEs in cs17.
  - title: Client classification
    body: Each client is fingerprinted (TLS, headers, JavaScript and cookie challenges) and classified as Human, Browser, Search bot, Vulnerability scanner, Hacking tool, DDoS bot… That classification (dproc, cs6 client app) drives bot policy and is one of the most useful fields for hunting.
  - title: DDoS and rate limiting
    body: Layer-7 DDoS mitigation challenges or blocks floods (code 8) and Advanced Bot Protection (14) handles scraping and credential stuffing. Account Takeover Protection (13) watches login endpoints for spraying and stuffing patterns.
  - title: Caching and delivery
    body: Cacheable responses are served from the PoP (act=REQ_CACHED_*), so the origin never sees them — the Imperva access log is the only record of those requests.
  - title: SIEM log integration
    body: Events are aggregated into files (header with account, format, checksum, then one event per line), compressed and optionally encrypted with your public key. A collector pulls them from the Log Integration API or Imperva pushes them to SFTP, S3 or Splunk HEC.
traffic:
  handles:
    - HTTP/1.1, HTTP/2 and HTTP/3 to protected sites
    - TLS termination (TLS 1.2/1.3)
    - REST / GraphQL APIs (API Security)
    - WebSockets
    - Layer-7 floods and bot traffic
    - Network-layer DDoS (BGP / IP protection)
  flow:
    - step: DNS resolve
      desc: Client resolves the site to an Imperva anycast IP.
    - step: TLS + fingerprint
      desc: PoP terminates TLS, records TLS version/cipher (ver) and fingerprints the client.
    - step: Classify client
      desc: Human vs bot classification, JS/cookie challenge if needed (act=REQ_CHALLENGED_*).
    - step: WAF + policy
      desc: Managed rules, IncapRules, ACLs, rate limits — a hit writes a security event.
    - step: Cache or forward
      desc: Served from cache (REQ_CACHED_*) or forwarded to the origin with XFF.
    - step: Log batch
      desc: Access and security events are written to log files and delivered within minutes.
logs:
  - type: Security event
    sourcetype: imperva_incapsula_waf
    format: cef
    share: 1–10 %
    avg: ~1.6 KB
    desc: Written when a WAF rule, bot, DDoS or custom rule acts on a request. The CEF name carries the attack type and the severity slot the Imperva rule code. Contains every access field plus attack IDs, mapped CVEs and response action.
    key:
      - name
      - act
      - src
      - request
      - qstr
      - requestClientApplication
      - dproc
      - cs17
    noise:
      - cs1Label
      - cs2Label
      - cs3Label
      - cs4Label
      - cs6Label
      - cs7Label
      - cs8Label
      - cs15Label
    sample: |-
      CEF:0|Incapsula|SIEMintegration|1|1|SQL Injection|0| fileId=3412341160002518171 sourceServiceName=shop.example.com siteid=1509732 suid=50005477 requestClientApplication=sqlmap/1.7.2#stable (https://sqlmap.org) deviceFacility=fra ccode=DE cicode=Frankfurt am Main start=1794557662213 request=shop.example.com/catalog/search requestMethod=GET app=HTTPS act=REQ_BLOCKED_SECURITY deviceExternalId=33411452762204224 cpt=51822 src=203.0.113.45 end=1794557662251 cn1=403 qstr=q\=shoes%27%20UNION%20SELECT%20username%2Cpassword%20FROM%20users-- ref=https://shop.example.com/ xff=203.0.113.45 in=1450 sip=198.51.100.20 spt=443 tag=example-retail siteTag=shop-prod ver=TLSv1.3 TLS_AES_128_GCM_SHA256 dproc=Vulnerability Scanner Customer=Example Retail Ltd fileType=12999 filePermission=37 cs17=[["CVE-2023-34362"]] cs17Label=CVE cs1=NA cs1Label=Cap Support cs2=true cs2Label=Javascript Support cs3=true cs3Label=CO Support cs4=c2e72124-0e8a-4dd8-b13b-3da246af3ab2 cs4Label=VID cs6=sqlmap cs6Label=clapp cs7=50.1109 cs7Label=latitude cs8=8.6821 cs8Label=longitude cs15=X25519 cs15Label=TLS KX Group
