cves:
  - id: CVE-2021-45468
    cvss: 9.8
    year: 2022
    kev: false
    scope: device
    title: WAF bypass via "Content-Encoding gzip" on POST requests
    affected: Imperva Cloud WAF before 2021-12-23
    fixed: Service-side fix deployed by Imperva on 2021-12-23 (no customer action)
    detect: Not visible as a security event (that is the bypass). Hunt access events with requestMethod=POST and attack payloads appearing only in origin logs; compare origin WAF/app errors against Imperva act=REQ_PASSED for the same deviceExternalId/XFF.
    avoid: Keep a second layer (origin input validation, RASP); reject Content-Encoding on request bodies at the origin unless an API needs it.
  - id: CVE-2023-50969
    cvss: 9.8
    year: 2024
    kev: false
    scope: device
    title: WAF Gateway (on-prem SecureSphere) rule bypass via crafted POST body
    affected: Imperva SecureSphere / WAF Gateway 14.7.0.40 (on-prem product, not the cloud service)
    detect: Same pattern as any WAF bypass — exploit payloads reaching the origin while the WAF logs the request as passed; diff origin errors against WAF events.
    avoid: Apply the vendor's Gateway update; validate multipart/POST parsing at the origin; do not rely on a single WAF layer.
  - id: CVE-2021-44228
    cvss: 10
    year: 2021
    kev: true
    scope: traffic
    title: Log4Shell — JNDI lookup RCE in Log4j 2 apps behind the WAF
    affected: Apache Log4j 2.0-beta9 through 2.15.0 (excluding 2.12.2, 2.12.3, 2.3.1)
    fixed: Log4j 2.16.0 / 2.12.2 / 2.3.1 (2.17.1+ recommended)
    detect: Security events whose cs17 contains CVE-2021-44228 / CVE-2021-45046, or "${jndi:" in request, qstr, requestClientApplication or additionalReqHeaders. Repeat attempts days later indicate scanners still probing.
    avoid: Patch Log4j at the origin; keep the managed rule in block mode; block outbound LDAP/RMI from web servers.
  - id: CVE-2023-34362
    cvss: 9.8
    year: 2023
    kev: true
    scope: traffic
    title: MOVEit Transfer SQL injection (Cl0p mass exploitation) on protected file-transfer sites
    affected: MOVEit Transfer before 2021.0.6, 2021.1.4, 2022.0.4, 2022.1.5, 2023.0.1
    fixed: 2021.0.6 (13.0.6), 2021.1.4 (13.1.4), 2022.0.4 (14.0.4), 2022.1.5 (14.1.5), 2023.0.1 (15.0.1)
    detect: SQL Injection security events against /moveitisapi/moveitisapi.dll or /guestaccess.aspx with cs17=CVE-2023-34362; follow-up requests to human2.aspx (web shell).
    avoid: Patch MOVEit; block the paths for untrusted sources; alert on any act=REQ_PASSED for human2.aspx.
  - id: CVE-2023-44487
    cvss: 7.5
    year: 2023
    kev: true
    scope: traffic
    title: HTTP/2 "Rapid Reset" request-cancellation DoS
    affected: HTTP/2 servers and proxies (protocol-level weakness)
    detect: DDoS (code 8) security events or a burst of access events per src with very short start→end times and act=REQ_BAD_* / REQ_CHALLENGED_*.
    avoid: Keep L7 DDoS protection on; patch origin HTTP/2 stacks; restrict origin to Imperva IP ranges so attackers can't go direct.
detections:
  - title: Exploit attempt reached the origin (security event not blocked)
    severity: critical
    signals:
      - name != Normal
      - act = REQ_PASSED
      - cs17 populated (mapped CVE)
    why: The WAF recognised an attack but the site policy only alerts — the payload was delivered to the application. These are the events to triage first.
    kql: |-
      dataset="imperva_waf" name!="Normal" act="REQ_PASSED"
      | summarize hits=count(), cves=make_set(cs17) by sourceServiceName, name, src
      | sort by hits desc
    mitre:
      - T1190
  - title: Vulnerability scanner / hacking tool sweeping a site
    severity: high
    signals:
      - dproc in (Vulnerability Scanner, Hacking Tool)
      - many distinct request paths per src
    why: Automated reconnaissance precedes targeted exploitation; one source hitting hundreds of paths is a scanner even if every request was blocked.
    kql: |-
      dataset="imperva_waf" dproc in ("Vulnerability Scanner","Hacking Tool")
      | summarize paths=dcount(request), attacks=dcount(name) by src, cs6, bin(_time, 15m)
      | where paths > 50
    mitre:
      - T1595.002
      - T1190
  - title: Credential stuffing on login endpoints
    severity: high
    signals:
      - requestMethod=POST
      - request contains login / signin
      - high request rate per src or many src per path
      - name = Account Takeover / Bad Bots
    why: Stuffing and spraying against web logins is invisible to the IdP when the app has its own auth; the WAF sees every attempt.
    kql: |-
      dataset="imperva_waf" requestMethod="POST"
      | where request has_any ("login","signin","auth")
      | summarize attempts=count(), statuses=make_set(cn1) by src, sourceServiceName, bin(_time, 5m)
      | where attempts > 30
    mitre:
      - T1110.004
      - T1110.003
  - title: Log4Shell / JNDI payloads in headers or query
    severity: high
    signals:
      - cs17 has CVE-2021-44228
      - "${jndi: in qstr / requestClientApplication"
    why: Log4Shell probing never stopped; a hit on a site whose origin runs Java is worth confirming the patch level.
    kql: |-
      dataset="imperva_waf"
      | where cs17 has "CVE-2021-44228" or qstr has "jndi" or requestClientApplication has "jndi"
      | summarize count() by sourceServiceName, src, act
    mitre:
      - T1190
  - title: Layer-7 flood or DDoS mitigation spike
    severity: medium
    signals:
      - name = DDoS
      - act = REQ_CHALLENGED_* / REQ_BLOCKED_*
      - request rate per site
    why: Separates a real attack from organic traffic growth and shows which PoPs (deviceFacility) absorbed it.
    kql: |-
      dataset="imperva_waf"
      | where name=="DDoS" or act startswith "REQ_CHALLENGED"
      | summarize reqs=count(), srcs=dcount(src) by sourceServiceName, deviceFacility, bin(_time, 1m)
    mitre:
      - T1498
      - T1499.002
optimizations:
  - title: Route security events to the SIEM, access events to Lake
    saving: 60–90 % of SIEM volume
    fn: Routes
    how: Security events (name!='Normal') are low volume and high value. Access logs are 90 %+ of the stream; send them to Cribl Lake / object storage and only aggregates to the SIEM.
    expr: name!='Normal' → SIEM  |  name=='Normal' → Lake + Aggregations
  - title: Collapse csN / csNLabel pairs
    saving: 15–25 %
    fn: Eval
    how: Every event repeats label strings (cs4Label=VID, cs7Label=latitude…). Rename csN to its label (cs7 → latitude) and drop the *Label fields — what the Cribl Imperva pack does.
    expr: "latitude=cs7, longitude=cs8, vid=cs4, client_app=cs6; remove: cs*Label"
  - title: Drop postbody and response headers
    saving: 10–20 %
    fn: Eval
    how: postbody (when enabled) and additionalResHeaders are large and rarely searched; keep them only on security events.
    expr: "name=='Normal' → remove: postbody, additionalResHeaders, additionalReqHeaders"
  - title: Aggregate cache hits and static assets
    saving: 20–40 % of access volume
    fn: Aggregations
    how: Cached static requests (images, CSS, JS) are useful as counts, not individually. Roll up per site/PoP/status per minute.
    expr: act.startsWith('REQ_CACHED') || /\.(png|jpg|css|js|woff2?)$/.test(request)
