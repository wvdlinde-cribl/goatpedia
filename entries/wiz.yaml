id: wiz
name: Wiz
short: Wiz
vendor: Wiz
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Wiz Cloud
  - Wiz Defend
tags:
  - cnapp
  - cloud
  - audit
  - json
summary: Wiz is a cloud security platform. It connects to AWS, Azure, Google Cloud and Kubernetes, reads configuration and workload state, and reports misconfigurations, vulnerabilities, issues and runtime threats. It also writes an audit log of who did what inside the Wiz tenant. Six JSON streams cover that audit log, configuration findings, the full posture snapshot, Defend detections, issues and vulnerabilities. A collector pulls them from the Wiz API.
sourcetypes:
  - st: wiz_audit
    desc: One action in the Wiz tenant, such as a login, with the actor and whether it succeeded
  - st: wiz_cloud_configuration_finding
    desc: One configuration rule result for a cloud resource, including failures that are still open
  - st: wiz_cloud_configuration_finding_full_posture
    desc: The same kind of configuration result, exported as the full posture rather than only what changed
  - st: wiz_defend_v2
    desc: One runtime threat match, with the rule, the actor and the resource
  - st: wiz_issue
    desc: One issue Wiz opened, such as a threat detection, with status and the rules that sourced it
  - st: wiz_vulnerability
    desc: One vulnerable package or image finding, with the CVE name, the score and whether it is still open
facts:
  Product: Cloud security platform for configuration, identity, vulnerabilities and runtime threats
  Where it sits: A Wiz tenant in the cloud, connected to the customer's cloud accounts and clusters. Optional sensors run on workloads for runtime detections
  Log transport: HTTPS JSON from the Wiz GraphQL API. Audit, findings, issues, vulnerabilities and Defend are separate queries
  Log format: One JSON object per record. Audit uses action and status. Findings use result and severity. Defend uses a rule match
  What an audit event answers: Who called the Wiz API or signed in, and whether the call succeeded
  What a finding answers: Which resource failed which configuration rule
  What a Defend event answers: Which threat rule matched, and which actor and resource were involved
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Wiz tenant
      desc: The graph of cloud resources, the findings and the audit log live in the Wiz tenant. A collector queries the API of that tenant. resource.subscription.cloudProvider on a finding says which cloud the resource is in. The sample finding is an Azure Kubernetes pod.
howItWorks:
  - title: Audit
    body: An audit event is an action inside Wiz, not a finding about a cloud resource. action is the verb. The sample action is a user login. status is SUCCESS or a failure. user and serviceAccount name the actor. actionParameters carries the client, the role and the scopes when the action is an API client. sourceIP is the caller when Wiz has it. The sample sourceIP is null.
  - title: Configuration findings
    body: A configuration finding is one rule against one resource. result is PASS or FAIL. status is OPEN or resolved. severity is Wiz's rating. rule.name is the control. resource.name and resource.nativeType are the object. The sample is a FAIL, still OPEN, at LOW severity, for a Kubernetes pod that runs containers with extra capabilities. The full-posture stream is the same shape of object exported as the whole set of results, not only the delta. Passing results are most of that snapshot.
  - title: Defend, issues and vulnerabilities
    body: A Defend event is a threat rule match. ruleMatch.rule.name is the rule. The sample rule is UnauthorizedAccess:EC2/SSHBruteForce, origin AWS GuardDuty, against a virtual machine. primaryActor is the network address that was brute-forcing. An issue is a case. The sample type is THREAT_DETECTION, status IN_PROGRESS, sourced from rules about an SSH server and a modified security file. A vulnerability is a CVE on a package. The sample name is a CVE, status OPEN, on a library, with hasExploit false.
  - title: How the records are collected
    body: Wiz serves these through its API. A collector with a service account queries each one. Any collector can do this. Addresses in the samples are documentation addresses. Goatpedia reads these samples as JSON.
traffic:
  handles:
    - Sign-in and API calls inside the Wiz tenant
    - Configuration rule results on cloud resources
    - Runtime threat matches, issues and vulnerable packages
  flow:
    - step: Wiz reads the cloud
      desc: The tenant scans accounts and clusters, and sensors report runtime activity where they are installed.
    - step: Wiz writes a record
      desc: A rule failure, a threat match, an issue, a vulnerability or an audit action becomes one JSON object.
    - step: Collector queries the API
      desc: A collector requests the audit log, the findings, Defend, issues and vulnerabilities separately.
