cves: []
detections:
  - title: Wiz audit action did not succeed
    severity: medium
    signals:
      - status
      - action
      - serviceAccount.name
      - user.name
    why: status other than SUCCESS is a login or an API call the tenant rejected. The sample login succeeded, which is the ordinary case. Repeated failures for one service account are the brute-force view of this audit log.
    kql: |
      dataset="wiz_logs"
      | where sourcetype == "wiz_audit" and status != "SUCCESS"
      | project timestamp, action, status, serviceAccount.name, user.name, sourceIP
    mitre:
      - T1110
  - title: Defend matched an SSH brute-force rule
    severity: high
    signals:
      - ruleMatch.rule.name
      - severity
      - primaryResource.name
      - primaryActor.type
    why: The sample Defend rule is an SSH brute-force match against a virtual machine, with a network address as the actor. That is someone guessing credentials against a cloud host. Configuration findings at LOW severity are posture, not this signal.
    kql: |
      dataset="wiz_logs"
      | where sourcetype == "wiz_defend_v2" and ruleMatch.rule.name == "UnauthorizedAccess:EC2/SSHBruteForce"
      | project createdAt, severity, ruleMatch.rule.name, primaryResource.name, primaryResource.externalId, primaryActor.name
    mitre:
      - T1110
optimizations:
  - title: Drop passing posture results
    saving: most of the configuration-check volume
    fn: Drop
    how: A full posture export repeats every rule result, and the passes are most of that volume. Security monitoring needs the failures, plus Defend matches, issues and the audit log. Drop result PASS before the SIEM.
    expr: "result == 'PASS'"
    stream:
      log: Full posture
      functions:
        - id: drop
          filter: result == 'PASS'
          description: Drop passing posture results; keep failures for security monitoring
          conf: {}
      test:
        - '{"id":"bdeba988-f41b-55e6-9b99-96b8d3dc67d5","targetExternalId":"k8s/pod/da99fd668e64c2def251b1d48b7b69ad3129638787a0f9144a993fe30fd4554f/default/cluster-autoscaler-azure-cluster-autoscaler-8bc677d64-z2qfx","targetObjectProviderUniqueId":"cd971d74-92db-495c-8244-82da9a988fd0","firstSeenAt":"2023-06-12T11:38:07.900129Z","analyzedAt":"2023-06-12T11:38:07.900129Z","updatedAt":"2023-06-12T11:38:07.900129Z","severity":"LOW","result":"PASS","status":"RESOLVED","remediation":"n/a","resource":{"id":"0e814bb7-29e8-5c15-be9c-8da42c67ee99","providerId":"provider-id-0e814bb7-29e8-5c15-be9c-8da42c67ee99","name":"cluster-autoscaler-azure-cluster-autoscaler-8bc677d64-z2qfx","nativeType":"Pod","type":"POD","region":null,"subscription":{"id":"a3a3cc43-1dfd-50f1-882e-692840d4a891","name":"Wiz - DEV Outpost","externalId":"cfd132be-3bc7-4f86-8efd-ed53ae498fec","cloudProvider":"Azure"},"projects":null,"tags":[]},"rule":{"id":"73553de7-f2ad-4ffb-b425-c69815033530","shortId":"Pod-32","graphId":"99ffeef7-75df-5c88-9265-5ab50ffbc2b9","name":"Pod should run containers with authorized additional capabilities (PSS Restricted)","description":"n/a","remediationInstructions":"n/a","functionAsControl":false},"securitySubCategories":[]}'
      expect:
        out: 1
