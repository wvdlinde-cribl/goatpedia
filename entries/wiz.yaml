facts:
  Where the sample comes from: Elastic integrations
  Integration package: wiz
  Sourcetypes: '6'
  Fixture events: '24'
  Log format seen: json
  Fields in the first fixture: id, action, requestId, status, timestamp, actionParameters.clientID
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Wiz events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries id, action, requestId, status, timestamp, actionParameters.clientID. Values in the sample were rewritten to documentation addresses.
traffic:
