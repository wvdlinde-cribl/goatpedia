:"sample_value","first_seen":"2024-07-16T06:20:33+00:00","ghost":false,"id":79,"insight_names":["End Of Life Assets","Full Match CVEs"],"installed_antivirus":"sample_value","installed_programs_count":10,"last_entity_seen":"2024-07-16T10:07:23+00:00","last_seen":"2024-07-16T10:07:23+00:00","last_updated":"2024-07-16T10:16:42+00:00","mac":["2001:db8::1"],"name":"2001:db8::1 (multicast)","network":{"id":1,"name":"Default","resource_id":"1-1","site_id":1}}'
    key:
      - active_queries_names[0]
      - active_tasks_names[0]
      - active_scans_names[0]
      - approved
  - type: Communication baselines
    sourcetype: claroty_ctd_baseline
    format: json
    desc: One record per learned conversation. source_entity and destination_entity are the two assets, protocol and transmission are CIP over TCP 44818, description is the command, and approved says whether the conversation is part of the accepted baseline. Addresses are documentation addresses.
    sample: '{"approved":true,"category":3,"category_access":1,"description":"CIP : Service Get Attribute All called on ExtendedDevice","destination_asset_id":64,"destination_entity":{"asset_name":"Chemical_plants","id":3,"ipv4":"203.0.113.8","mac":"2001:db8::1","resource_id":"3-1","virtual_zone_id":3,"virtual_zone_name":"PLC: Rockwell"},"dst_port":44818,"frequency":0,"has_values":false,"hash":7899219255097204000,"id":784,"interval":null,"last_seen":"2023-04-17T07:40:19+00:00","last_updated":"2024-07-04T12:51:10+00:00","protocol":"CIP","resource_id":"784-1","session_state":3,"site_id":1,"source_asset_id":69,"source_entity":{"asset_name":"203.0.113.40","id":50,"ipv4":"192.0.2.10","mac":"2001:db8::1","resource_id":"50-1","virtual_zone_id":23,"virtual_zone_name":"HMI: Other"},"src_port":null,"timestamp":"2023-04-17T07:40:19+00:00","transmission":"TCP / 44818","type":0,"valid":true}'
    key:
      - approved
      - category
      - category_access
      - description
cves: []
detections:
  - title: Conversation not in the approved baseline
    severity: medium
    signals:
      - approved
      - protocol
      - description
      - source_entity.ipv4
      - destination_entity.ipv4
    why: In an OT network the set of conversations is stable. A baseline entry that is not approved is a new talker, protocol or command between assets, which is how unauthorised engineering access or lateral movement into control systems shows up.
    kql: |
      dataset="claroty-ctd_logs"
      | where sourcetype == "claroty_ctd_baseline" and approved == false
      | project timestamp, protocol, description, source_entity.ipv4, destination_entity.ipv4, transmission
    mitre:
      - T0886
optimizations: []
references: []
