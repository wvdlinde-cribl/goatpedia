id: claroty-ctd
name: Claroty Continuous Threat Detection
short: Claroty CTD
vendor: Claroty
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Claroty CTD
tags:
  - ot-security
  - ics
  - asset-inventory
  - network-monitoring
  - cef
summary: An industrial (OT) network monitoring platform. It listens passively to traffic from a SPAN port or TAP in plant networks, builds an inventory of PLCs, HMIs and engineering stations, learns which devices normally talk to each other, and raises alerts on changes and threats. It sends its own events as CEF syslog, and its asset and baseline tables can be read from its REST API.
sourcetypes:
  - st: claroty_ctd
    desc: Events from the CTD server in CEF, such as activity-log entries, alerts and system changes
  - st: claroty_ctd_asset
    desc: Asset inventory records, one per discovered OT or IT device with its type, firmware and criticality
  - st: claroty_ctd_baseline
    desc: Communication baselines, one per learned conversation between two assets over an industrial protocol
facts:
  Product: Passive OT/ICS network monitoring, asset inventory and threat detection
  Form factor: On-premises server or virtual appliance, with sensors on industrial network segments
  Log transport: Syslog (CEF) for events; HTTPS REST API for assets and baselines
  Log format: CEF:0 with vendor Claroty and product CTD for events; JSON records for assets and baselines
  What an event answers: What happened in the CTD system or on the monitored network, who triggered it, and whether it succeeded
  What an asset record answers: What a device is (PLC, HMI, endpoint), its firmware, criticality and whether it is approved
  What a baseline record answers: Which two assets talk, over which protocol and port, what the command means, and whether that conversation is approved
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: CTD server and sensors on plant networks
      desc: Sensors take a copy of traffic from switches in the OT network. The CTD server stores assets, baselines and alerts for each site and sends events to a syslog receiver.
howItWorks:
  - title: Passive discovery
    body: CTD decodes industrial protocols such as CIP, Modbus, S7 and others from mirrored traffic. Each device it sees becomes an asset with a type, vendor, firmware, rack and card details, and a criticality.
  - title: Baselines
    body: In learning mode CTD records every distinct conversation between two assets, including the protocol, port and the protocol command (for example a CIP Get Attribute All). After the system moves to operational mode, a conversation that is not in the approved baseline is a deviation and can raise an alert.
  - title: Events
    body: The server writes events for alerts, user activity and system changes. CtdLogType says whether it is a system, user or alert event, CtdAction says what happened and CtdActionStatus whether it succeeded. These leave the server as CEF syslog to any receiver.
traffic:
  handles:
    - Industrial protocols such as CIP, Modbus and S7
    - Asset discovery on OT networks
    - Changes to monitoring mode and configuration
  flow:
    - step: Traffic mirrored
      desc: A switch SPAN port or TAP copies OT traffic to a CTD sensor.
    - step: Assets and conversations
      desc: CTD decodes the packets, updates the asset inventory and compares each conversation with the baseline.
    - step: Events written
      desc: Alerts, user actions and system changes become events on the server.
    - step: Out to a collector
      desc: Events are sent as CEF syslog. A collector reads assets and baselines from the REST API.
logs:
  - type: CTD events
    sourcetype: claroty_ctd
    format: cef
    desc: One CEF event. This sample is an activity-log entry. CtdAction says the site was changed to Operational Mode, CtdActionStatus is Success and CtdLogType is System. CtdSite and CtdUser say where and who.
    sample: <30> 2023-08-15T06:33:33Z Site syslog-ActivityLog-Default - - - CEF:0|Claroty|CTD|4.10.0|ActivityLog|Site  Mode|0|CtdTimeGenerated=Aug 15 2023 09:32:11 CtdSite=Default CtdUser= CtdAction=Changed to Operational Mode CtdActionStatus=Success CtdMessage=System was moved to [[Operational Mode]] CtdLogType=System
    key:
      - cef_version
      - device_vendor
      - device_product
      - device_version
  - type: Assets
    sourcetype: claroty_ctd_asset
    format: json
    desc: One record per asset. asset_type__ is the kind of device (eEndpoint here, with a child ePLC), criticality__ is its importance, firmware and first_seen describe it, and approved says whether it has been accepted into the inventory. Addresses are documentation addresses.
