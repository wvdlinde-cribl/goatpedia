    desc: 'Elastic integrations fixture, 4 events. Upstream: tenable_io/data_stream/vulnerability/_dev/test/pipeline/test-vulnerability.log'
facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: tenable_io
  Sourcetypes: '6'
  Fixture events: '28'
  Log format seen: json
  Fields in the first fixture: crud, actor.name, actor.id, action, received, id
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Tenable Io events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries crud, actor.name, actor.id, action, received, id. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads tenable_io and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
