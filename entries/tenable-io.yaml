    desc: 'Datadog integrations-core fixture, 2 events. Upstream: tenable_io/assets/logs/tenable-io_tests.yaml'
  - st: tenable_io_asset
    desc: 'Elastic integrations fixture, 10 events. Upstream: tenable_io/data_stream/asset/_dev/test/pipeline/test-asset.log'
  - st: tenable_io_audit
    desc: 'Elastic integrations fixture, 5 events. Upstream: tenable_io/data_stream/audit/_dev/test/pipeline/test-audit.log'
