summary: Iru is logged by the Elastic integrations package iru. The Pack Generator samples pool holds fixture events for 2 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: iru_audit
    desc: 'Elastic integrations fixture, 6 events. Upstream: iru/data_stream/audit/_dev/test/pipeline/test-iru-audit-samples.log'
  - st: iru_device
    desc: 'Elastic integrations fixture, 5 events. Upstream: iru/data_stream/device/_dev/test/pipeline/test-iru-device-samples.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: iru
  Sourcetypes: '2'
  Fixture events: '11'
  Log format seen: json
  Fields in the first fixture: id, action, occurred_at, actor_id, actor_type, target_id
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Iru events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries id, action, occurred_at, actor_id, actor_type, target_id. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads iru and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
