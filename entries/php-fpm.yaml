id: php-fpm
name: Php Fpm
short: Php Fpm
vendor: Php
category: saas
status: full
updated: '2026-11-12'
contributors:
  - wlinde
aka:
  - php_fpm
  - Elastic integrations
tags:
  - elastic
  - json
summary: Php Fpm is logged by the Elastic integrations package php_fpm. The Pack Generator samples pool holds fixture events for 2 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: php_fpm_pool
    desc: 'Elastic integrations fixture, 1 events. Upstream: php_fpm/data_stream/pool/_dev/test/pipeline/test-pool-metrics.log'
  - st: php_fpm_process
    desc: 'Elastic integrations fixture, 1 events. Upstream: php_fpm/data_stream/process/_dev/test/pipeline/test-process-metrics.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: php_fpm
  Sourcetypes: '2'
  Fixture events: '2'
  Log format seen: json
  Fields in the first fixture: pool, process manager, start time, start since, accepted conn, listen queue
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Php Fpm events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries pool, process manager, start time, start since, accepted conn, listen queue. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads php_fpm and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as json.
logs:
  - type: Pool
    sourcetype: php_fpm_pool
    format: json
    desc: 1 fixture events in the samples pool (elastic).
    sample: '{"pool":"www","process manager":"dynamic","start time":1667299161,"start since":4803,"accepted conn":485,"listen queue":0,"max listen queue":0,"listen queue len":0,"idle processes":1,"active processes":1,"total processes":2,"max active processes":1,"max children reached":0,"slow requests":0}'
    key:
