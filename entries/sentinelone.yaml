summary: AI-driven EPP/EDR platform. An autonomous agent with static and behavioural AI engines prevents and remediates on the endpoint (including ransomware rollback) and groups every action into a "Storyline". Deep Visibility telemetry is exported by Cloud Funnel as newline-delimited JSON into a customer S3 / GCS / Azure Blob bucket; threats and alerts come from the management REST API.
sourcetypes:
  - st: sentinelone_cloudfunnel_v1
    desc: Cloud Funnel 1.0 — nested JSON (meta / event objects) via the SentinelOne-owned S3 bucket or Kafka
  - st: sentinelone_cloudfunnel_v2
    desc: Cloud Funnel 2.0 — flat dotted-key JSON (src.process.*, tgt.*, event.*) from Singularity Data Lake to a customer bucket
  - st: SentinelOne_CL
    desc: Microsoft Sentinel table of the SentinelOne connector, read by the ASIM SentinelOne parsers (the newer codeless connector writes SentinelOneThreats_CL, SentinelOneActivities_CL, SentinelOneAgents_CL and others)
  - st: sentinel_one_activity
    desc: 'Elastic integrations fixture, 20 events. Upstream: sentinel_one/data_stream/activity/_dev/test/pipeline/test-pipeline-activity.log'
