    format: json
    share: 15–25 %
    avg: ~3 KB
    desc: "meta.event.name=PROCESSCREATION: the source (parent) process creating a target process, with command lines, hashes, signer, integrity level and Storyline ids."
    key:
      - event.type
      - endpoint.name
      - src.process.user
      - src.process.name
      - tgt.process.name
      - tgt.process.cmdline
      - tgt.process.image.sha256
      - src.process.storyline.id
    noise:
      - i.scheme
      - i.version
      - sca:atlantisIngestTime
      - sca:ingestTime
      - mgmt.url
      - src.process.moduleCount
      - src.process.crossProcessDupRemoteProcessHandleCount
      - src.process.indicatorRansomwareCount
