cves:
  - id: CVE-2025-29824
    cvss: 7.8
    year: 2025
    kev: true
    scope: traffic
    title: Windows CLFS driver use-after-free → SYSTEM (exploited by ransomware) — the agent itself has no NVD CVEs, so this is an endpoint exploit SentinelOne must catch
    affected: Windows 10/11 and Windows Server before the April 2025 update
    fixed: Microsoft April 2025 security updates
    detect: "Process events: dllhost.exe or a user process spawning a SYSTEM-integrity child; file events writing .blf files under C:\\ProgramData\\SkyPDF\\ or unusual CLFS paths; Indicators category Exploitation / PrivilegeEscalation in the same Storyline."
    avoid: Patch; keep the agent in Protect mode; alert on low-to-SYSTEM integrity transitions.
  - id: CVE-2023-36884
    cvss: 7.5
    year: 2023
    kev: true
    scope: traffic
    title: Office and Windows HTML / Search RCE via crafted documents (RomCom/Storm-0978)
    affected: Microsoft Office and Windows before the August 2023 update
    fixed: Microsoft August 2023 security updates (Office defense-in-depth ADV230003)
    detect: Process events with WINWORD.EXE spawning MSDT/cmd/powershell or loading remote content; IP/DNS events from Office processes to newly seen domains; Indicators "Exploitation" in an Office Storyline.
    avoid: Patch; block Office child processes; disable MSHTML/remote-template loading for internet documents.
  - id: CVE-2025-33053
    cvss: 8.8
    year: 2025
    kev: true
    scope: traffic
    title: Internet Shortcut (.url) WebDAV working-directory hijack → remote code execution (Stealth Falcon)
    affected: Windows 10/11 and Windows Server before the June 2025 update
    fixed: Microsoft June 2025 security updates
    detect: File events creating .url files; process events where a signed Windows tool (iediagcmd.exe, etc.) starts from a WebDAV path (\\host@SSL\…); DNS/IP events to external WebDAV servers.
    avoid: Patch; block outbound WebDAV / SMB to the internet; enable Storyline-based remediation.
  - id: CVE-2024-1086
    cvss: 7.8
    year: 2024
    kev: true
    scope: traffic
    title: Linux kernel nf_tables use-after-free LPE (used by ransomware) — relevant for Linux server agents
    affected: Linux kernel 3.15 through 6.8-rc1 (distribution kernels before their early-2024 fixes)
    fixed: Upstream kernel commit f342de4e2f33 (6.8-rc2 and stable backports)
    detect: Linux process events where an unprivileged user's process chain gains uid 0 without sudo/su; unshare / user-namespace creation followed by a root shell in the same Storyline.
    avoid: Patch the kernel; restrict unprivileged user namespaces (kernel.unprivileged_userns_clone=0).
detections:
  - title: Office application spawning a script interpreter
    severity: high
    signals:
      - meta.event.name=PROCESSCREATION
      - src.process.name in WINWORD/EXCEL/OUTLOOK
      - tgt.process.name in powershell/cmd/wscript/mshta
    why: The most common initial-access chain after a malicious document. The Storyline id lets you pull every follow-on action.
    kql: |-
      dataset="s1_cloudfunnel" meta.event.name="PROCESSCREATION"
      | where src.process.name in~ ("WINWORD.EXE","EXCEL.EXE","POWERPNT.EXE","OUTLOOK.EXE")
      | where tgt.process.name in~ ("powershell.exe","pwsh.exe","cmd.exe","wscript.exe","cscript.exe","mshta.exe")
      | summarize count(), cmds=make_set(tgt.process.cmdline, 5) by endpoint.name, src.process.user, src.process.storyline.id
    mitre:
      - T1566.001
      - T1204.002
      - T1059.001
  - title: Ransomware or injection indicators
    severity: critical
    signals:
      - meta.event.name=BEHAVIORALINDICATORS
      - indicator.category in Ransomware / Injection / Evasion
    why: Behavioural indicators are SentinelOne's own early-warning signal; several in one Storyline on one host is a strong attack signal even when no threat was raised.
    kql: |-
      dataset="s1_cloudfunnel" meta.event.name="BEHAVIORALINDICATORS"
      | where indicator.category in ("Ransomware","Injection","Evasion","Persistence")
      | summarize indicators=dcount(indicator.name), names=make_set(indicator.name, 10) by endpoint.name, src.process.storyline.id
      | where indicators >= 3
    mitre:
      - T1486
      - T1055
  - title: DNS to rare domains from scripting hosts
    severity: medium
    signals:
      - meta.event.name=DNS
      - src.process.name in powershell/wscript/rundll32
      - event.dns.request seen on < 3 endpoints
    why: Script interpreters rarely resolve unique domains; this catches download cradles and early C2.
    kql: |-
      dataset="s1_cloudfunnel" meta.event.name="DNS"
      | where src.process.name in~ ("powershell.exe","pwsh.exe","wscript.exe","cscript.exe","rundll32.exe","mshta.exe")
      | summarize hosts=dcount(endpoint.name), lookups=count() by event.dns.request
      | where hosts < 3
    mitre:
      - T1071.004
      - T1105
  - title: Agent bypass via local installer (Bring Your Own Installer)
    severity: high
    signals:
      - PROCESSCREATION of SentinelOneInstaller*.exe / SentinelInstaller*.msi by a non-deployment account
      - msiexec.exe killed during a version change
      - agent then stops reporting
    why: Documented 2025 technique that leaves a host unprotected when Local Upgrade Authorization is off; no CVE, so only telemetry catches it.
    kql: |-
      dataset="s1_cloudfunnel" meta.event.name="PROCESSCREATION"
      | where tgt.process.name matches regex @"(?i)^Sentinel(One)?Installer.*\.(exe|msi)$" or (tgt.process.name =~ "taskkill.exe" and tgt.process.cmdline has "msiexec")
      | summarize count(), first=min(_time) by endpoint.name, src.process.user, tgt.process.cmdline
    mitre:
      - T1562.001
  - title: Encoded PowerShell
    severity: high
    signals:
      - tgt.process.name=powershell.exe
      - tgt.process.cmdline has -enc / -EncodedCommand
    why: Encoded commands hide the payload from simple string matching and are the default in most loaders.
    kql: |-
      dataset="s1_cloudfunnel" meta.event.name="PROCESSCREATION" tgt.process.name in~ ("powershell.exe","pwsh.exe")
      | where tgt.process.cmdline matches regex @"(?i)\s-(e|en|enc|encodedcommand)\s"
      | summarize count() by endpoint.name, src.process.name, tgt.process.cmdline
    mitre:
      - T1059.001
      - T1027.010
optimizations:
  - title: Filter categories at the source, then in Stream
    saving: 30–60 %
    fn: Drop + Routes
    how: Use Cloud Funnel query filters to stop exporting categories nobody uses; in Stream, route module loads, cross-process handle duplication and registry reads to the lake only.
    expr: event.category in ('module','cross_process') || (event.category=='registry' && event.type=='Registry Value Read')
  - title: Remove counters and ingest metadata
    saving: 25–40 %
    fn: Eval (remove fields)
    how: Every 2.0 event repeats dozens of src.process.*Count counters, osSrc.* duplicates and pipeline metadata (i.scheme, i.version, sca:*, mgmt.url). Remove them before the SIEM.
    expr: "remove: src.process.*Count, src.process.parent.*Count, osSrc.*, i.*, sca:*, mgmt.url"
  - title: Drop DNS to top domains
    saving: 10–20 %
    fn: Lookup + Drop
    how: Most DNS events are OS, browser and SaaS lookups. Drop event.dns.request values in a top-domains list; keep everything from scripting hosts.
    expr: meta.event.name=='DNS' && C.Lookup('top_domains.csv','domain').match(event.dns.request) && !/powershell|wscript|rundll32/i.test(src.process.name)
  - title: Normalise v1 and v2 to one schema
    saving: Detection reuse
    fn: Eval + Serialize
    how: Detect the version (meta.traceId → v1, meta.event.name → v2) and map both to one schema (OCSF or your SIEM model) so detections are written once.
    expr: "__ver = meta && meta.traceId ? 'v1' : 'v2'"
