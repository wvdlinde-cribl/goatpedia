facts:
  First released: 2013 (company); Deep Visibility 2018; Cloud Funnel 2.0 2022
  Platform: Windows, macOS, Linux, Kubernetes / containers, cloud workloads
  Delivery model: SaaS management console (or on-prem / air-gapped) + autonomous agent
  Telemetry export: Cloud Funnel 2.0 → customer S3 (also GCS / Azure Blob); Cloud Funnel 1.0 → SentinelOne S3 / Kafka
  Alert export: Management REST API (threats, alerts, activities, agents) and syslog/CEF notifications
  Log format: Newline-delimited JSON, one event per line (gzip objects); CEF for syslog notifications
  Event categories: Process, Cross Process, DNS, File, IP, Indicators, Logins, Module, Registry, Scheduled Task, URL, Driver, Group
  Typical volume: 20–150 MB per endpoint per day Cloud Funnel (filters reduce this at the source)
  Cribl Pack: Cribl Pack for SentinelOne Cloud Funnel (v1 and v2), Packs Dispensary
placement:
  slots:
    - endpoint
    - cloud
    - internal
  items:
    - slot: endpoint
      title: Agent on every host
      desc: The agent prevents, detects and remediates locally (kill, quarantine, network isolation, ransomware rollback via VSS) and works offline. It streams Deep Visibility events to the console.
    - slot: cloud
      title: Management console + Singularity Data Lake
      desc: Multi-tenant SaaS (Account → Site → Group hierarchy). Deep Visibility / Data Lake stores telemetry; Cloud Funnel copies it out to a bucket the customer or MDR reads.
    - slot: cloud
      title: Customer S3 / GCS / Blob bucket
      desc: Cloud Funnel 2.0 writes gzip NDJSON objects organised by account, date and event type. Cribl Stream reads them via an S3 Source with SQS notifications.
    - slot: internal
      title: Servers, Kubernetes and Ranger
      desc: Server and container agents cover workloads; Ranger uses agents to discover unmanaged devices on the same subnet; Singularity Identity adds AD deception and protection on domain controllers.
howItWorks:
  - title: Static and behavioural AI
    body: A static AI engine scores files pre-execution; a behavioural engine watches process activity on the endpoint in real time. Detections are mapped to MITRE techniques and raised as threats with a mitigation status (killed, quarantined, remediated, rolled back).
  - title: Storyline
    body: Every process is assigned a Storyline id (src.process.storyline.id) that follows the chain of related activity across process creation, injection and file/network actions — even across reboots. Hunting and remediation operate on the whole Storyline, and Cloud Funnel exports the id so a SIEM can reconstruct the chain.
  - title: Deep Visibility event model
    body: "Events have a category (process, dns, ip, file, registry, indicators, logins …), an event.type, the source process (src.process.*, with parent.*) and a target (tgt.process.* / tgt.file.* / event.dns.* / dst.ip.*). Indicators events carry behavioural verdicts (indicator.category, indicator.name, indicator.description with MITRE ids)."
  - title: Cloud Funnel 1.0 vs 2.0
    body: "Cloud Funnel 1.0 delivered nested JSON (meta{} + event{}) via a SentinelOne-owned bucket or Kafka. 2.0 is fed from Singularity Data Lake, writes flat dotted-key JSON (\"src.process.cmdline\") to a customer-owned bucket and supports query filters to export only the categories you need. Field names differ completely — pipelines must detect the version."
  - title: Management API and notifications
    body: The REST API (API token) exposes threats, alerts, activities (console and agent audit), agents and applications/vulnerabilities. Syslog/CEF notifications can push threats and activities in near real time.
  - title: Anti-tamper and agent upgrade
    body: The agent protects itself (Anti-Tamper, PPL). Two public techniques — "Bring Your Own Installer" (2025, interrupting a local version change) and "Bring Your Own EDR" (2026, abusing the SentinelHelper COM Dump method, fixed in agent 26.1.1) — need local admin but leave hosts unprotected or abuse the agent's trust. Enable Local Upgrade Authorization and watch agent version and status events.
traffic:
  handles:
    - Process creation and termination with command line and Storyline
    - Cross-process access (injection, handle duplication)
    - DNS and IP connections per process, URLs
    - File create/modify/delete, module and driver loads
    - Registry and scheduled-task persistence
    - Logins (local, RDP, network) with success/failure
    - Behavioural indicators and threats with mitigation status
  flow:
    - step: Event on endpoint
      desc: Agent observes a process, file, network or registry action and tags it with the Storyline.
    - step: On-agent AI
      desc: Static/behavioural engines decide; policy can kill, quarantine, isolate or roll back immediately.
    - step: Console + Data Lake
      desc: Telemetry and threats are sent to the console; Deep Visibility events land in Singularity Data Lake.
    - step: Cloud Funnel export
      desc: Filtered telemetry is written as gzip NDJSON objects into the customer bucket by account/date/type.
    - step: Collect
      desc: S3 object-created notification → SQS → Cribl Stream S3 Source downloads and breaks events.
    - step: Shape and route
      desc: Pipeline detects v1/v2, drops noisy categories, enriches with CMDB, routes to SIEM and lake.
logs:
