cves: []
detections:
  - title: Secret pushed past push protection
    severity: high
    signals:
      - secret_type
      - state
      - push_protection_bypassed
      - html_url
    why: Push protection is supposed to block a commit that contains a secret. push_protection_bypassed true means the author overrode that block and the secret was pushed. That is the secret-scanning event worth an alert, including when someone later marks the alert a false positive.
    kql: |
      dataset="github_logs"
      | where sourcetype == "github_secret_scanning" and push_protection_bypassed == true
      | project created_at, secret_type, state, resolution, html_url, push_protection_bypassed_by.login
    mitre:
      - T1552
  - title: Open critical Dependabot alert
    severity: high
    signals:
      - state
      - securityAdvisory.severity
      - securityVulnerability.package.name
      - securityAdvisory.ghsaId
    why: An open Dependabot alert is a dependency the repository still builds with. Critical is Dependabot's highest advisory rating. The sample is one of these.
    kql: |
      dataset="github_logs"
      | where sourcetype == "github_dependabot" and state == "OPEN" and securityAdvisory.severity == "CRITICAL"
      | project createdAt, state, securityAdvisory.ghsaId, securityAdvisory.severity, securityVulnerability.package.name, repository.name
optimizations: []
references:
  - title: Reviewing the organization audit log
    url: https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization
  - title: About secret scanning
