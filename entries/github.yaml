id: github
name: GitHub
short: GitHub
vendor: GitHub
category: devops
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - GitHub Enterprise
  - GitHub Advanced Security
tags:
  - devops
  - audit
  - code-security
  - json
summary: GitHub hosts Git repositories and the pull requests, issues and security tools around them. An organization audit log records who changed the org. GitHub Advanced Security adds code scanning, Dependabot and secret scanning for a repository. The Advisory Database is GitHub's published list of vulnerabilities. A collector pulls each of these as JSON from the GitHub API.
sourcetypes:
  - st: github_audit
    desc: One organization audit event. actor, org and action say who did what in the org.
  - st: github_code_scanning
    desc: One code-scanning alert for a repository, including the rule, the tool and the file location.
  - st: github_dependabot
    desc: One Dependabot alert for a vulnerable dependency in a repository.
  - st: github_issues
    desc: One GitHub issue, with its title, state, author and repository.
  - st: github_secret_scanning
    desc: One secret-scanning alert. The secret type, the state and whether push protection was bypassed are the fields that matter.
  - st: github_security_advisories
    desc: One entry from the GitHub Advisory Database, with the GHSA id, the CVE id when there is one, and the affected package.
facts:
  Product: Hosted Git, with organization administration and code-security alerts
  Clients: github.com, GitHub Enterprise Cloud, and the Git and API clients people use to push code
  Log transport: HTTPS JSON from the GitHub REST API. Each stream is a different endpoint. A token needs the matching permission.
  Log format: One JSON object per audit event, alert, issue or advisory
  What an audit event answers: Who performed which organization action, and when
  What a secret-scanning alert answers: Which kind of secret was found, whether it is still open, and whether the author bypassed push protection
  What a Dependabot alert answers: Which package is vulnerable, how severe the advisory is, and whether the alert is still open
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: GitHub organization
      desc: Repositories, teams and organization settings live on GitHub. The audit log, the code-security alerts and the issues are stored there. A collector calls the API.
howItWorks:
  - title: Organization audit
    body: An audit event is one action in the organization. actor is who did it. org is the organization. action is the verb, such as a label being created. created_at is when. Reading the action string is the whole event. The sample is organization_default_label.create.
  - title: Code security
    body: Code scanning is one alert from a tool such as CodeQL. state is open or dismissed. rule.id and rule.severity name the finding. most_recent_instance.location is the file and line. Dependabot is one vulnerable dependency. state, securityAdvisory.severity and securityVulnerability.package are the alert. Secret scanning is one exposed secret. secret_type is the kind. state and resolution say what an admin did with it. push_protection_bypassed true means the author pushed past the protection that would have blocked the secret.
  - title: Advisories and issues
    body: A security advisory is a row from GitHub's published database, not an action inside your organization. ghsa_id and cve_id identify it. severity and the vulnerabilities list say which package and which versions are affected. An issue is tracker work. title, state and user.login describe it. Issues are not a security decision.
  - title: How a collector pulls them
    body: GitHub does not push these streams as syslog. A collector with a token calls the REST API for the organization audit log, the repository alerts, the issues and the advisory list. Each response is JSON. Any collector can do this.
traffic:
  handles:
    - Organization administration
    - Code scanning, Dependabot and secret scanning
    - Issues and published security advisories
  flow:
    - step: Someone acts on GitHub
      desc: A person changes the organization, or a scanner opens an alert, or an issue is filed, or GitHub publishes an advisory.
    - step: GitHub stores the record
      desc: The audit log, the alert, the issue or the advisory is one JSON object on the matching API.
    - step: Collector calls the API
      desc: A collector requests the next page with a token and can forward each object anywhere.
logs:
  - type: Organization audit
    sourcetype: github_audit
    format: json
    desc: One organization action. actor is who, org is the organization, action is the verb. This sample is a default label being created.
    sample: '{"actor":"github-actor","org":"Example-Org","action":"organization_default_label.create","created_at":1583364251067}'
    key:
      - actor
      - org
      - action
      - created_at
