cves: []
detections:
  - title: Sophos alert of medium or high severity
    severity: high
    signals:
      - severity
      - threat
      - description
      - data.endpoint_id
    why: Alerts are the events Sophos itself says need action, such as a threat it could not clean or an exploit it blocked. Medium and high severity alerts should be triaged.
    kql: |
      dataset="sophos-central_logs"
      | where sourcetype == "sophos_central_alert" and severity in ("medium", "high")
      | project created_at, severity, threat, description, source, data.endpoint_id, data.endpoint_platform
optimizations: []
references:
