id: sophos-central
name: Sophos Central
short: Sophos Central
vendor: Sophos
category: idp
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Sophos Central Endpoint
  - Sophos Intercept X
  - Sophos Central SIEM API
tags:
  - edr
  - endpoint-protection
  - antivirus
  - xdr
summary: The cloud management console for Sophos protection products, mainly Intercept X endpoint and server protection. Agents on computers and servers detect and clean malware, block exploits and ransomware, and report to Sophos Central. Its SIEM API exposes two streams — events (everything the agents report, from detections to user and policy events) and alerts (the subset that needs attention).
sourcetypes:
  - st: sophos_central
    desc: Sophos Central events from endpoints and servers, such as malware and exploit detections, IPS blocks, cleanups and user or policy changes
  - st: sophos_central_alert
    desc: Sophos Central alerts, the events that need an admin's attention, with threat, endpoint, severity and remediation details
facts:
  Product: Cloud-managed endpoint and server protection (Intercept X) and related Sophos products
  Clients: Sophos agents on Windows, macOS and Linux computers and servers
  Log transport: HTTPS JSON, pulled from the Sophos Central SIEM API (events and alerts) with an API client credential
  Log format: One JSON object per event or alert
  What an event answers: What happened on which endpoint (endpoint_id, type, group), which threat or file was involved, and for whom
  What an alert answers: Which threat needs action, how severe it is, and what cleanup already did on the endpoint
placement:
  slots:
    - endpoint
    - cloud
  items:
    - slot: endpoint
      title: Sophos agent
      desc: The agent on each computer or server detects threats, blocks exploits and cleans files. Detections happen here.
    - slot: cloud
      title: Sophos Central
      desc: The agents report to the Sophos Central tenant, which stores events and alerts. A collector polls the SIEM API for each tenant.
howItWorks:
  - title: Protection on the endpoint
    body: Intercept X combines signature and machine-learning malware detection, exploit mitigation (HitmanPro.Alert, the HMPA app), CryptoGuard anti-ransomware, AMSI script scanning and a host IPS. Each detection names the threat, the file or process, and what cleanup did.
  - title: Events and alerts
    body: Every report from an agent is an event with a type, a group (for example PROTECTION or MALWARE), a severity and the endpoint. Events that need an admin decision are also raised as alerts with a description, the threat and remediation detail.
  - title: How the data leaves the product
    body: A collector authenticates to Sophos Central with an API client, then pages through the SIEM events and alerts endpoints using a cursor. Each record is a JSON object for any destination.
traffic:
  handles:
    - Malware detection and cleanup
    - Exploit and ransomware protection
    - Host intrusion prevention
    - Endpoint user and policy events
  flow:
    - step: Agent detects
      desc: The Sophos agent on an endpoint detects a threat, blocks an exploit or reports a state change.
    - step: Central records it
      desc: Sophos Central stores the event, and raises an alert when action is needed.
    - step: Collector polls
      desc: A collector calls the SIEM API for events and alerts since its last cursor.
    - step: Events are JSON
      desc: Each event or alert is one JSON object. Goatpedia reads these samples as JSON.
logs:
