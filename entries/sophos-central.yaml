    body: Sophos Central events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries source, appSha256, appCerts[0].signer, appCerts[0].thumbprint, appCerts[1].signer, appCerts[1].thumbprint. Values in the sample were rewritten to documentation addresses.
