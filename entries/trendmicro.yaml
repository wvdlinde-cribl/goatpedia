summary: Trend Micro Deep Security protects servers and workloads. An agent on the host does anti-malware, intrusion prevention, firewall, integrity monitoring and log inspection, and it reports to a manager. The manager records system events for those modules. This stream is one of those events, kept as a single text message. Any collector that receives the manager's forwarded log can store it.
sourcetypes:
  - st: trendmicro_deep_security
    desc: One Deep Security system event, kept as a single text message
facts:
  Product: Host protection for servers and cloud workloads. Agents report to a Deep Security Manager or to Trend Cloud One Workload Security
  Where the agent sits: On servers and workload instances. The manager is on the internal network or in Trend's cloud
  Log transport: The manager can forward system events as syslog. A collector receives that forward
  Log format: One text line per event in this stream. The line is the message field and is not split further here
  What a system event answers: What the agent or the manager recorded, once the line is read. This sample's text does not name a module or an action
placement:
  slots:
    - endpoint
    - internal
    - cloud
  items:
    - slot: endpoint
      title: Deep Security agent
      desc: The agent on the server inspects files, traffic and changes, and sends results to the manager. The host is where the activity happened.
    - slot: internal
      title: Deep Security Manager
      desc: An on-premises manager stores system events and can forward them. The event in this stream is the manager's record, not a packet capture.
    - slot: cloud
      title: Workload Security
      desc: The same agent can report to Trend Cloud One Workload Security instead of an on-premises manager. The event shape the collector receives is still one text line in this stream.
howItWorks:
  - title: Agents and system events
    body: Deep Security separates protection modules (anti-malware, web reputation, firewall, intrusion prevention, integrity monitoring, log inspection, application control) from the system events that record what those modules and the manager did. A system event is one of those records. The manager is the place that can forward them.
  - title: What this stream stores
    body: This stream does not parse the event into fields. message is the whole line. The sample value is the text "Description Omitted", so this particular line does not show a malware name, a rule or a disposition. Searches that need a module or an action have to match text inside message, and only when the forwarded line actually contains that text.
  - title: How the line is collected
    body: The manager forwards events to a syslog receiver the operator chooses. Any collector can be that receiver. Goatpedia reads these samples as text.
traffic:
  handles:
    - System events from the Deep Security agent and manager
  flow:
    - step: Agent reports to the manager
      desc: The agent sends module activity and status to the Deep Security Manager or to Workload Security.
    - step: Manager records a system event
      desc: The manager stores one system event and, when forwarding is on, sends it as a log line.
    - step: Collector receives the line
      desc: The line arrives as text and is stored in message.
logs:
  - type: System event
    sourcetype: trendmicro_deep_security
    format: text
    desc: One system-event line in message. This sample's text is "Description Omitted", so the line does not name an action, a host or a rule. There is no documentation address in the sample.
    sample: Description Omitted
    pattern: (?<message>[\s\S]+)
    key:
      - message
