summary: Apache Cassandra is an open-source distributed NoSQL database built for large write volumes and high availability across many nodes and data centres. Each node runs a Java process that logs its own startup, configuration, compaction, gossip, repair and error messages to system.log. Those logs tell you how a node is configured, whether it joined the cluster, and what went wrong when it misbehaves.
sourcetypes:
  - st: cassandra
    desc: Cassandra node system log (system.log), one line per message from the database process with level, thread, timestamp, Java source location and message
facts:
  Product: Distributed wide-column NoSQL database
  Deployment: A cluster of nodes on servers, VMs or containers in the organisation's data centre or cloud, often across several data centres
  Log transport: Written by Logback to files in the node's log directory (system.log, debug.log), read by any file collector
  Log format: Text lines, LEVEL [thread] timestamp SourceFile.java:line - message. Stack traces continue over following lines
  What a system log line answers: What the node was doing (startup, configuration loading, gossip, compaction, repair, streaming) and which warnings or errors it hit
  Other logs: Optional audit logging and full query logging record client queries and logins separately
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Cassandra nodes
      desc: The cluster runs on internal servers or in a private cloud network. Applications connect to it over the CQL native protocol. Each node writes its own system log locally.
howItWorks:
  - title: Nodes and the ring
    body: Data is spread across nodes by partition key and replicated according to the keyspace's replication settings. Nodes learn about each other through gossip. Writes go to a commit log and memtables and are flushed to SSTables, which compaction merges in the background.
  - title: What the system log records
    body: On startup the node logs where it loaded cassandra.yaml from and the effective settings. While running it logs gossip state changes, schema changes, compactions, repairs, streaming and garbage collection pauses at INFO or WARN, and failures at ERROR with a stack trace.
  - title: How the logs leave the node
    body: Logback writes the log files on each node. A file collector or agent tails system.log and forwards each line, joining stack traces to the line that started them. The destination is a choice of the pipeline, not a property of Cassandra.
traffic:
  handles:
    - CQL client reads and writes
    - Inter-node gossip and replication
    - Compaction, repair and streaming
  flow:
    - step: Node does work
      desc: The Cassandra process starts, loads configuration, talks to other nodes and serves client requests.
    - step: Logback writes a line
      desc: Each message is written to system.log with its level, thread, timestamp and source location.
    - step: Collector tails the file
      desc: A file collector reads new lines from system.log and forwards them.
logs:
  - type: System log
    sourcetype: cassandra
    format: text
    desc: One line per message. The level, thread in brackets, timestamp and Java source file and line come before the message. This sample is an INFO line from the main thread at startup, in which YamlConfigurationLoader reports where the node read cassandra.yaml.
    sample: 'INFO  [main] 2021-07-21 12:18:15,910 YamlConfigurationLoader.java:92 - Configuration location: file:/C:/Users/kush.rana/Desktop/Projects/elasticconnectors/apache-cassandra-3.11.10/conf/cassandra.yaml'
    pattern: (?<message>[\s\S]+)
    key:
      - message
