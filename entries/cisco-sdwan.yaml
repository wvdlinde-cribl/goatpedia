id: cisco-sdwan
name: Cisco Catalyst SD-WAN
short: Cisco SD-WAN
aka:
  - Cisco SD-WAN
  - Viptela
  - vManage / SD-WAN Manager
  - vSmart / SD-WAN Controller
  - vBond / SD-WAN Validator
  - cEdge / vEdge
vendor: Cisco
category: netinfra
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - sd-wan
