id: cisco-ise
name: Cisco Identity Services Engine (ISE)
short: Cisco ISE
aka:
  - ISE
  - Identity Services Engine
  - ISE-PIC
  - ISE Passive Identity Connector
  - cisco_ise
vendor: Cisco
category: idp
status: full
updated: "2026-11-14"
contributors:
