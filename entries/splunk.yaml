id: splunk
name: Splunk Enterprise
short: Splunk
vendor: Splunk (Cisco)
category: pipeline
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Splunk
  - Splunk Cloud Platform
  - Splunk Enterprise Security
tags:
  - siem
  - search
  - notable-events
  - analytics
summary: A data platform that indexes machine data and runs searches over it, with Splunk Enterprise Security adding correlation searches that write notable events. The streams here are results read out of Splunk itself — notable events from the notable index, and the results of a saved or ad hoc search. Each record is a Splunk event with its index metadata, so it tells you what a correlation search fired on, or what a search returned.
sourcetypes:
  - st: splunk_alert
    desc: Notable events from the Splunk notable index, written by correlation searches, with the rule name, index metadata and the summarised raw event
  - st: splunk_search
    desc: Results of a Splunk search run through the REST API, with the query, its author and each result event with index metadata
facts:
  Product: Indexing, search and analytics platform for machine data, with Enterprise Security as a SIEM app
  Form factor: Self-managed Splunk Enterprise (indexers, search heads, forwarders) or Splunk Cloud Platform
  Log transport: HTTPS JSON from the Splunk REST API (search jobs and exports) on the management port, pulled by a collector
  Log format: One JSON object per result event, with Splunk internal fields such as _raw, _time, _bkt, _cd, _indextime, index, source and sourcetype
  What a notable event answers: Which correlation search fired (source, search_name inside _raw), when, and on which values
  What a search result answers: Which events matched a given query, and where they were indexed
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Search head and indexers
      desc: In a self-managed deployment, indexers store the data and the search head runs scheduled correlation searches and REST searches. A collector calls the search head's REST API.
    - slot: cloud
      title: Splunk Cloud Platform
      desc: In Splunk Cloud the same search head REST API is reached over the internet, subject to the stack's access controls.
howItWorks:
  - title: Events and indexes
    body: Every event Splunk stores has _raw (the original text), _time, index, source, sourcetype and host, plus internal fields such as _bkt (the bucket) and _cd (its address in the bucket). _indextime is when it was indexed.
  - title: Correlation searches and notables
    body: In Enterprise Security, a correlation search runs on a schedule. When it matches, it writes a notable event into the notable index through a summary (stash) sourcetype. The notable's source is the correlation search name, and _raw holds the fields the search produced.
  - title: How the data leaves the product
    body: A collector creates a search job or export through the REST API with a query, for example over index=notable, and reads the results as JSON. Each result is one event with its metadata, ready for any destination.
traffic:
  handles:
    - Correlation search results (notable events)
    - Ad hoc and saved search results
    - Indexed event metadata
  flow:
    - step: Search runs
      desc: A scheduled correlation search or an API search runs on the search head.
    - step: Results are written
      desc: A correlation match is written as a notable event into the notable index with sourcetype stash.
    - step: Collector queries
      desc: A collector runs a search or export through the REST API and receives the matching events.
    - step: Events are JSON
      desc: Each result is one JSON object. Goatpedia reads these samples as JSON.
logs:
  - type: Notable events
    sourcetype: splunk_alert
    format: json
    desc: One notable event. source names the correlation search, index is notable, sourcetype is stash, and _raw holds the search_name and the values it matched. This sample is an "Access - Excessive Failed Logins - Rule" notable. Hosts use documentation addresses.
    sample: '{"_bkt":"notable~70~E10E99CE-2B29-4D28-B797-57BEABF6E876","_cd":"70:13771","_indextime":"1739168416","_raw":"1739168412, search_name=\"Access - Excessive Failed Logins - Rule\", app=\"ssl-web\", craction=\"4\", count=\"5\", ip=\"198.51.100.15\", tz=\"555\", time=\"10/01/24 18:57...","_serial":"476","_si":["203.0.113.8","notable"],"_sourcetype":"stash","_time":"2025-02-10T11:50:16.000+05:30","host":"203.0.113.40","index":"notable","linecount":"1","source":"Access - Excessive Failed Logins - Rule","sourcetype":"stash","splunk_server":"192.0.2.10"}'
    key:
      - _bkt
      - _cd
      - _indextime
      - _raw
  - type: Search results
    sourcetype: splunk_search
    format: json
    desc: One search result. query and author describe the search, and result is the matching event with _raw, _time, index, source and sourcetype. This sample is a summary event from the main index returned by search *.
    sample: '{"author":"author_mcauthorface","query":"search *","result":{"_bkt":"main~0~266C23A8-75B5-4A00-8732-4A6065281018","_cd":"0:10","_indextime":"1740148016","_raw":"02/21/2025 14:26:56 +0000, info_min_time=1740060000.000, info_max_time=1740148015.000, info_search_time=1740148015.943, field1=test","_serial":"0","_si":["ip-186-86-82-48","main"],"_sourcetype":"stash","_time":"2025-02-21T14:26:56.000+00:00","host":"ip-186-86-82-48","index":"main","linecount":"1","source":"/opt/splunk/var/spool/splunk/cafc46ad8c914957_a9876ea14cfe7ac8_events.stash_new","sourcetype":"stash","splunk_server":"ip-186-86-82-49"}}'
    key:
      - author
      - query
      - result._bkt
      - result._cd
cves: []
detections:
  - title: Notable event from a correlation search
    severity: medium
    signals:
      - index
      - source
      - _raw
      - host
    why: A notable is a detection Splunk Enterprise Security has already raised. Forwarding it lets another tool correlate or track it. source tells you which rule fired.
    kql: |
      dataset="splunk_logs"
      | where sourcetype == "splunk_alert" and index == "notable"
      | project _time, source, host, _raw
optimizations: []
references:
  - title: Splunk Enterprise documentation
    url: https://docs.splunk.com/Documentation/Splunk
  - title: Splunk REST API search endpoints
    url: https://docs.splunk.com/Documentation/Splunk/latest/RESTREF/RESTsearch
