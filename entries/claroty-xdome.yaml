      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Claroty Xdome events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries dest_network, source_site_name, dest_device_type, event_type, detection_time, dest_port. Values in the sample were rewritten to documentation addresses.
