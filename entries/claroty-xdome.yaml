id: claroty-xdome
name: Claroty xDome
short: Claroty xDome
vendor: Claroty
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - xDome
tags:
  - ot-security
  - iot-security
  - asset-inventory
  - vulnerability-management
  - json
summary: A cloud (SaaS) platform for cyber-physical systems that inventories and protects OT, IoT and medical devices. Collection servers or existing network tools feed it traffic and device data from each site, and the cloud service detects communication events, raises alerts and tracks device vulnerabilities. Events, alerts and vulnerabilities are read as JSON from its API.
sourcetypes:
  - st: claroty_xdome
    desc: Communication events between devices, such as a configuration upload from an engineering station to a PLC
  - st: claroty_xdome_alert
    desc: Alerts, each with the alert class and type, the affected device and how many devices it covers
  - st: claroty_xdome_vulnerability
    desc: Vulnerability findings per device, with the device context, assignees and risk
facts:
  Product: SaaS cyber-physical systems protection for OT, IoT and medical devices
  Form factor: Cloud service with on-site collection servers or integrations with existing network infrastructure
  Log transport: HTTPS REST API, polled by any collector with an API token
  Log format: One JSON object per event, alert or device-vulnerability record
  What an event answers: Which device did what to which other device, over which protocol, and at which site
  What an alert answers: Which kind of alert fired, on how many devices, with what risk, and whether it is resolved
  What a vulnerability record answers: Which device is affected, what it is, who is assigned, and how exposed it is
placement:
  slots:
    - cloud
    - internal
  items:
    - slot: cloud
      title: xDome service
      desc: The xDome tenant stores the device inventory, events, alerts and vulnerabilities for every site. A collector polls its API.
    - slot: internal
      title: Collection servers at sites
      desc: On each site a collection server or network integration observes device traffic on industrial, building and clinical networks and sends what it learns to the cloud.
howItWorks:
  - title: Devices
    body: xDome classifies each device by category (OT, IoT, IT, medical), type and vendor, and keeps hardware details such as rack and slot cards for PLCs. Alerts and vulnerabilities are attached to these devices.
  - title: Events and alerts
    body: A communication event is a notable action seen on the network, such as a configuration upload or download to a controller, with source and destination device, protocol and port. Alerts group conditions such as device changes or malicious IP communication and carry a risk score and status.
  - title: How the data leaves the product
    body: xDome does not push syslog for these streams. A collector with an API token queries the events, alerts and vulnerabilities endpoints and receives JSON. Any collector can do this.
traffic:
  handles:
    - Industrial protocols such as CIP
    - Device configuration uploads and downloads
    - Device changes and vulnerability exposure
  flow:
    - step: Devices communicate
      desc: Devices on a site network talk to each other and to the outside.
    - step: Site collection
      desc: A collection server observes that traffic and sends device data to the xDome cloud.
    - step: Cloud analysis
      desc: xDome records events, raises alerts and matches devices to vulnerabilities.
    - step: Collector polls
      desc: A collector reads events, alerts and vulnerabilities from the API as JSON.
logs:
  - type: Communication events
    sourcetype: claroty_xdome
    format: json
    desc: One object per event. event_type is what happened (Configuration Upload here), source_device_type and dest_device_type say an Engineering Station talked to a PLC, protocol is CIP, and source_username, source_site_name and dest_site_name add context. Addresses are documentation addresses.
    sample: '{"dest_network":"Industrial","source_site_name":"Houston_Line_1","dest_device_type":"PLC","event_type":"Configuration Upload","detection_time":"2025-02-02T19:54:13.691489+00:00","dest_port":2222,"protocol":"CIP","source_network":"Industrial","source_port":56576,"source_asset_id":"MNCYPGV","source_ip":"192.0.2.20","source_device_name":"198.51.100.15","mode":"mode1","source_device_type":"Engineering Station","dest_ip":"198.51.100.25","related_alert_ids":[1000039,10076],"dest_asset_id":"EHBLLGK","source_username":"user1","dest_site_name":"NY-BR-212","description":"Configuration Upload was detected from 203.0.113.8 (Engineering Station) to 203.0.113.40 (PLC)","dest_device_name":"dvc1","event_id":12,"ip_protocol":"UDP"}'
    key:
      - dest_network
      - source_site_name
      - dest_device_type
      - event_type
  - type: Alerts
    sourcetype: claroty_xdome_alert
    format: json
    desc: One object per alert and device. alert_info.alert_class and alert_info.alert_type_name say what kind of alert it is (Device Changes, Location Change), alert_info.status says whether it is resolved, and risk_score with risk_score_points rate the device. slot_cards lists the controller hardware. Addresses are documentation addresses.
    sample: '{"ad_description":"ad description","risk_score":"Very Low","slot_cards":{"racks":[{"cards":[{"uid":"3b6c4639-3743-4362-b38a-d1edcde189b1","slot_number":0,"name":null,"card_type":"CPU","model":"1756-L7SP/B LOGIXSAFETY","vendor":"Rockwell Automation","sw_version":"V24.012","serial_number":"00172DC0"},{"uid":"f1495b05-2262-4726-b604-aff5034d4e0f","slot_number":1,"name":null,"card_type":"I/O","model":"1756-OB16E/A DCOUT EFUSE","vendor":"Rockwell Automation","sw_version":"V3.003","serial_number":"000F75F0"}],"number_of_slots":9}],"cards_count":9},"risk_score_points":57.090244,"ad_distinguished_name":"ad_distinguished_name","domains":["dmn1","dmn2"],"ae_titles":[],"alert_info":{"alert_class":"Device Changes Alerts","alert_type_name":"Location Change","category":"Device Changes","description":"A SSID Change alert of type Location Change was created for 30 devices","detected_time":"2024-09-14T01:01:57.093925Z","devices_count":30,"id":1000088,"iot_devices_count":19,"it_devices_count":5,"malicious_ip_tags_list":["ip-tag1","ip-tag2"],"medical_devices_count":0,"mitre_technique_enterprise_ids":[],"mitre_technique_enterprise_names":[],"mitre_technique_ics_ids":[],"mitre_technique_ics_names":[],"ot_devices_count":6,"status":"Unresolved","unresolved_devices_count":30,"updated_time":"2025-03-20T02:56:32.316179Z"},"asset_id":"IFDFHWB","assignees":[],"device_name":"198.51.100.15","assignees_data":[{"id":37,"type":"group","display_name":"3rd Party SOC"}],"combined_os":"Windows XP","consequence_of_failure":"unknown","device_category":"OT","device_subcategory":"Process","device_type":"Autonomous Vehicle","device_type_family":"Autonomous Vehicle","dhcp_fingerprint":"fingerprint-1","dhcp_hostnames":["dhname"],"dhcp_last_seen_hostname":"dlasthname","endpoint_security_names":[],"equipment_class":"eclass","fda_class":"fda-class","http_hostnames":["httphname"],"http_last_seen_hostname":"host1name","hw_version":"1.0.5","ip_list":["198.51.100.25"],"switch_ip_list":["203.0.113.8"],"labels":["OT Assets without Assignees","OT Internet Klabin"]}'
    key:
      - ad_description
      - risk_score
      - slot_cards.racks[0].cards[0].uid
      - slot_cards.racks[0].cards[0].slot_number
  - type: Device vulnerabilities
    sourcetype: claroty_xdome_vulnerability
    format: json
    desc: One object per vulnerable device. asset_id and combined_os identify the device, assignees says who owns the fix, and the collection_servers fields say which site saw it.
    sample: '{"active_queries_seen_reported_from":[],"activity_rate":52,"ad_description":null,"ad_distinguished_name":null,"ae_titles":[],"ap_location_list":[null],"ap_name_list":[null],"applied_acl_list":[null],"applied_acl_type_list":[null],"asset_id":"DLUPOQD","assignees":["3rd Party SOC (Group)","Ben Jackman"],"assignees_data":[{"display_name":"Ben Jackman","id":"ben.jackman","is_active":true,"type":"user"},{"display_name":"3rd Party SOC","id":37,"type":"group"}],"authentication_user_list":[null],"avg_examinations_per_day":null,"avg_in_use_per_day":null,"avg_online_per_day":12.4,"battery_level":null,"bssid_list":[null],"cmms_asset_tag":null,"cmms_financial_cost":null,"collection_interfaces_seen_reported_from":["ens142@demo-collection-columbia","ens178@demo-collection-clinton"],"collection_servers_seen_reported_from":["demo-collection-clinton","demo-collection-columbia"],"combined_os":"Windows 10 1607","connection_paths":[],"connection_type_list":["Ethernet"],"consequence_of_failure":null,"cppm_authentication_status_list":[null],"cppm_service_list":[null],"data_sources_seen_reported_from":["Passive Collection","Edge Scan"],"device_category":"OT"}'
    key:
      - active_queries_seen_reported_from
      - activity_rate
      - ad_description
      - ad_distinguished_name
cves: []
detections:
  - title: Configuration upload from a controller
    severity: high
    signals:
      - event_type
      - source_device_type
      - dest_device_type
      - source_ip
      - dest_ip
    why: A configuration upload copies the logic of a PLC to the station that asked for it. Outside a change window, or from an unexpected engineering station or user, it is how an attacker studies a control process before changing it.
    kql: |
      dataset="claroty-xdome_logs"
      | where sourcetype == "claroty_xdome" and event_type == "Configuration Upload"
      | project detection_time, event_type, source_ip, source_username, source_device_type, dest_ip, dest_device_type, dest_site_name
    mitre:
      - T0845
optimizations: []
references: []
