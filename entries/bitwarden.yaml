placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Bitwarden events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries object, type, itemId, collectionId, groupId, policyId. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads bitwarden and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
