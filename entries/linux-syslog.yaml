id: linux-syslog
name: Linux Syslog (messages / secure / auth)
short: Linux syslog
aka:
  - /var/log/messages
  - /var/log/secure
  - /var/log/auth.log
  - /var/log/syslog
  - rsyslog
  - syslog-ng
  - systemd-journald
vendor: Linux distributions
category: os
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - linux
  - syslog
