id: box-events
name: Box
short: Box
vendor: Box
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Box Enterprise Events
  - Box admin logs
tags:
  - content-collaboration
  - file-sharing
  - audit
  - json
summary: Box is a cloud content management and file sharing service. Users upload, preview, download, share and collaborate on files and folders, and administrators manage users, groups and security settings for the enterprise. Box records these actions in its enterprise event stream, which any collector can read through the Events API, so the logs show who logged in, who accessed or shared which content, and which admin settings changed.
sourcetypes:
  - st: box_events
    desc: Box enterprise events (admin_logs stream), one record per user or admin action identified by event_type, such as LOGIN, FAILED_LOGIN, DOWNLOAD, SHARE or ACCESS_GRANTED
facts:
  Product: Cloud content management, file sharing and collaboration
  Clients: Web app, Box Drive, desktop and mobile apps, and integrations through the Box API
  Log transport: HTTPS JSON from the Box Events API with stream_type admin_logs (or admin_logs_streaming), pulled by any collector authorised as an enterprise admin app
  Log format: One JSON object per event with event_type, created_by, source (the affected item or user), ip_address, created_at and additional_details
  What an event answers: Who did what (event_type) to which file, folder, user or setting, from which IP, and when
placement:
  slots:
    - cloud
    - endpoint
  items:
    - slot: cloud
      title: Box enterprise
      desc: Files, folders, users and settings live in the Box service. Every action against them is recorded in the enterprise event stream there.
    - slot: endpoint
      title: Box apps and browsers
      desc: People act from the web app, Box Drive or mobile apps. The event records the user and the client IP address.
howItWorks:
  - title: Enterprise events
    body: Box keeps an event for every significant action in the enterprise. event_type names it, for example LOGIN, FAILED_LOGIN, UPLOAD, DOWNLOAD, PREVIEW, DELETE, SHARE, COLLABORATION_INVITE or ADMIN_LOGIN. ACCESS_GRANTED and ACCESS_REVOKED record a user granting or revoking Box access to their account.
  - title: Who and what
    body: created_by is the user who acted, source is the file, folder or user the action applied to, ip_address is the client, and additional_details holds event-specific detail such as a shared link's access level.
  - title: How the events leave the product
    body: A collector authorised as an enterprise application with admin scope calls the Events API with stream_type admin_logs and a stream position, and receives a page of JSON events plus the next position. Any collector can do this. The destination is a choice of the pipeline, not a property of Box.
traffic:
  handles:
    - User logins and failed logins
    - File and folder upload, preview, download and delete
    - Sharing, shared links and collaboration invites
    - Admin changes to users, groups and settings
  flow:
    - step: User or admin acts
      desc: Someone logs in, works with a file or folder, shares content or changes an enterprise setting.
    - step: Box records it
      desc: Box adds an enterprise event with the event type, the actor, the affected item and the IP address.
    - step: Collector polls
      desc: A collector calls the Events API with the admin_logs stream type and its saved stream position.
    - step: Events are JSON
      desc: Each event is one JSON object and is forwarded as one record.
logs:
  - type: Enterprise event
    sourcetype: box_events
    format: json
    desc: One record per enterprise event. event_type says what happened, and in full events created_by, source and ip_address say who, to what and from where. This sample is a minimal ACCESS_GRANTED event, a user granting Box access to their account, carrying only the event type.
    sample: '{"event_type":"ACCESS_GRANTED"}'
    key:
      - event_type
cves: []
detections:
  - title: Failed logins to Box
    severity: medium
    signals:
      - event_type
    why: FAILED_LOGIN events are someone failing to sign in to the enterprise. A burst for one user or from one address is password guessing against the Box account.
    kql: |
      dataset="box-events_logs"
      | where sourcetype == "box_events" and event_type == "FAILED_LOGIN"
    mitre:
      - T1110
optimizations:
  - title: Keep sharing, admin and login events, sample previews
    saving: much of the event volume
    fn: Routes
    how: Previews and downloads of ordinary content make up much of a busy enterprise's events. Sharing, collaboration, admin and login events carry the security questions. Send those to the SIEM in full and send routine previews to cheaper storage.
    expr: "event_type == 'PREVIEW'"
    stream:
      routes:
        - name: Box routine previews and downloads → cheaper storage
          filter: /"event_type":"(PREVIEW|DOWNLOAD)"/.test(_raw)
          to: Cribl Lake or other low-cost storage; replay on demand
          final: true
        - name: Box sharing, collaboration, admin and login events → SIEM
          filter: /"event_type":"/.test(_raw)
          to: The SIEM, full fidelity
          final: true
      note: Routes see the raw event, so they match event_type inside the JSON text. Put the preview route first so everything else, including sharing, collaboration, admin and login events, reaches the SIEM in full.
references:
  - title: Box API list events
    url: https://developer.box.com/reference/get-events/
