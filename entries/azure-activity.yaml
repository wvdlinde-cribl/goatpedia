cves:
  - id: CVE-2025-55241
    cvss: 9.8
    year: 2025
    kev: false
    scope: traffic
    title: Entra ID actor-token impersonation via the legacy Azure AD Graph API — a forged Global Admin could then act in Azure; those ARM actions land in the Activity Log
    affected: Microsoft Entra ID (cloud service) before Microsoft's server-side fix (published September 2025)
    fixed: Fixed server-side by Microsoft — no customer action
    detect: The token abuse itself left no tenant logs. Afterwards, look for Microsoft.Authorization/roleAssignments/write or elevateAccess/action by a Global Admin identity with no matching Entra sign-in, or from callerIpAddress values never seen for that upn.
    avoid: Alert on elevateAccess and Owner / User Access Administrator assignments; Privileged Identity Management for Azure roles; correlate Activity Log callers with Entra sign-in logs.
  - id: CVE-2021-38647
    cvss: 9.8
    year: 2021
    kev: true
    scope: traffic
    title: OMIGOD — unauthenticated RCE as root in the OMI agent that Azure VM extensions install on Linux VMs
    affected: Open Management Infrastructure (OMI) before 1.6.8-1, deployed by Log Analytics/OMS agent, Azure Diagnostics, Automation and DSC extensions
    fixed: OMI 1.6.8-1 (OMS Agent for Linux 1.13.40-0)
    detect: The exploit hits ports 5985/5986/1270 on the VM and is not in the Activity Log. Use it to find exposed VMs (Microsoft.Compute/virtualMachines/extensions/write for OmsAgentForLinux / LinuxDiagnostic) and to spot follow-on control-plane actions from the VM's managed identity.
    avoid: Update OMI and the extensions; block 5985/5986/1270 from the internet with NSGs; migrate to Azure Monitor Agent.
  - id: CVE-2023-36052
    cvss: 8.6
    year: 2023
    kev: false
    scope: traffic
    title: Azure CLI printed secrets from app settings into CI/CD logs — leaked credentials then used against ARM
    affected: Azure CLI before 2.53.1 (az webapp / functionapp / logicapp / staticwebapp appsettings set|delete)
    fixed: Azure CLI 2.53.1
    detect: Activity Log Microsoft.Web/sites/config/write and listKeys / listsecrets actions from a service principal (appid) outside its pipeline agent IP ranges, or storage listKeys followed by data-plane access.
    avoid: Upgrade the CLI; mask outputs in pipelines; rotate any secret that appeared in build logs; use Key Vault references and managed identities.
  - id: CVE-2021-42306
    cvss: 6.5
    year: 2021
    kev: false
    scope: traffic
    title: Azure Automation Run As / Azure Migrate private keys readable in Entra app keyCredentials (CredManifest) — allowed takeover of the Run As service principal
    affected: Azure Automation Run As accounts, Azure Migrate and Azure Site Recovery app registrations created before the November 2021 change
    fixed: Fixed by Microsoft (November 2021); customers had to rotate affected Run As certificates
    detect: Activity Log operations by the Automation Run As service principal (identity.claims.appid) from callerIpAddress values outside Azure Automation, especially role assignments or VM runCommand.
    avoid: Rotate Run As certificates or move to managed identities; scope the Run As SP to least privilege.
detections:
  - title: Privileged role assignment created
    severity: high
    signals:
      - operationName=Microsoft.Authorization/roleAssignments/write
      - requestbody RoleDefinitionId = Owner / Contributor / User Access Administrator
      - resultType=Success
    why: Granting Owner or User Access Administrator (often to a new service principal) is the most common Azure privilege-escalation and persistence step.
    kql: |-
      dataset="azure_activity" operationName=~"Microsoft.Authorization/roleAssignments/write" resultType="Success"
      | where properties.requestbody has_any ("8e3af657-a8ff-443c-a75c-2fe8c4bcb635","b24988ac-6180-42a0-ab88-20f7382dd24c","18d7d88d-d35e-4fb5-a5c3-7773c20a72d9")
      | project _time, callerIpAddress, identity.claims.appid, identity.authorization.scope, properties.requestbody
    mitre:
      - T1098.003
  - title: VM Run Command or script extension
    severity: high
    signals:
      - operationName.value=Microsoft.Compute/virtualMachines/runCommand/action
      - or virtualMachines/extensions/write with CustomScript
    why: Run Command executes arbitrary scripts as SYSTEM/root from the control plane — an attacker with Contributor gets code execution on every VM without network access.
    kql: |-
      dataset="azure_activity"
      | where operationName.value in~ ("Microsoft.Compute/virtualMachines/runCommand/action","Microsoft.Compute/virtualMachines/runCommands/write","Microsoft.Compute/virtualMachines/extensions/write") or operationName in~ ("Microsoft.Compute/virtualMachines/runCommand/action","Microsoft.Compute/virtualMachines/extensions/write")
      | summarize count() by caller, httpRequest.clientIpAddress, resourceId, status.value
    mitre:
      - T1651
  - title: Activity Log export or monitoring disabled
    severity: critical
    signals:
      - operationName in microsoft.insights/diagnosticSettings/delete
      - Microsoft.Security/pricings/write (Defender plan off)
      - alertRules / activityLogAlerts delete
    why: Attackers remove the diagnostic setting (stopping the SIEM feed) or Defender plans before acting.
    kql: |-
      dataset="azure_activity"
      | where operationName in~ ("microsoft.insights/diagnosticSettings/delete","Microsoft.Insights/DiagnosticSettings/Write","Microsoft.Security/pricings/write","microsoft.insights/activityLogAlerts/delete")
      | project _time, operationName, callerIpAddress, identity.claims.appid, resourceId, resultType
    mitre:
      - T1562.008
  - title: Storage account keys or Key Vault access changed
    severity: medium
    signals:
      - Microsoft.Storage/storageAccounts/listKeys/action
      - Microsoft.KeyVault/vaults/accessPolicies/write
      - unusual caller or IP
    why: Listing storage keys gives full data-plane access outside RBAC; widening a vault access policy exposes secrets, keys and certificates.
    kql: |-
      dataset="azure_activity"
      | where operationName in~ ("Microsoft.Storage/storageAccounts/listKeys/action","Microsoft.KeyVault/vaults/accessPolicies/write","Microsoft.KeyVault/vaults/write")
      | summarize count(), ips=make_set(callerIpAddress) by operationName, identity.claims.appid, resourceId
    mitre:
      - T1555.006
      - T1552
  - title: Mass resource deletion
    severity: high
    signals:
      - category=Delete or operationName ends with /delete
      - many resources per caller in a short window
    why: Destructive attacks (and ransom of backups) delete resource groups, vaults or disks in bulk from one identity.
    kql: |-
      dataset="azure_activity" category="Delete" resultType="Success"
      | summarize deletes=count(), types=dcount(tostring(split(resourceId,"/PROVIDERS/")[1])) by identity.claims.appid, callerIpAddress, bin(_time, 15m)
      | where deletes > 25
    mitre:
      - T1485
  - title: Subscription-wide access elevation
    severity: critical
    signals:
      - operationName=Microsoft.Authorization/elevateAccess/action
    why: A Global Administrator granting themselves User Access Administrator at root scope gains control of every subscription — rare and always worth review.
    kql: |-
      dataset="azure_activity" operationName=~"Microsoft.Authorization/elevateAccess/action"
      | project _time, callerIpAddress, identity.claims.appid, resultType, correlationId
    mitre:
      - T1078.004
      - T1098.003
optimizations:
  - title: Keep only final status of each operation
    saving: 30–50 %
    fn: Drop
    how: Long-running operations log Started and Accepted before Succeeded/Failed under one correlationId. Drop the intermediate events (REST schema status.value Started/Accepted; Event Hub resultType Start/Accept).
    expr: "['Start','Accept','Started','Accepted'].includes(resultType) || ['Started','Accepted'].includes(status && status.value)"
  - title: Reduce Policy audit noise
    saving: 10–40 %
    fn: Suppress
    how: Policy audit and auditIfNotExists fire on every evaluation of a non-compliant resource. Keep deny events in full; suppress audit duplicates per resource and policy per 24 h.
    expr: "key: `${resourceId}:${properties.policies}`  allow 1 / 86400s  when /POLICIES\\/AUDIT/i.test(operationName)"
  - title: Strip token claims and localized duplicates
    saving: 25–45 %
    fn: Parser → Serialize
    how: Keep upn, objectidentifier, appid and ipaddr from the claims; drop iat/nbf/exp/ver/puid/aud and the long schema URIs, and every localizedValue in the REST schema.
    expr: "remove: identity.claims.(iat|nbf|exp|ver|puid|aud|iss), *.localizedValue, properties.hierarchy"
  - title: Route operational categories away from the SIEM
    saving: SIEM licence
    fn: Routes
    how: Administrative writes/actions/deletes, Security and Policy deny go to the SIEM; Service Health, Resource Health, Autoscale and Recommendation go to Lake or an ops tool.
    expr: "category in (Write, Delete, Action, Administrative, Security) → SIEM | else → Lake"
