summary: The subscription-level log of the Azure control plane. Every Azure Resource Manager write, delete and action (create a VM, assign a role, list storage keys, run a command on a VM), plus Service Health, Resource Health, Policy, Autoscale, Recommendation and Security alert events, recorded with caller, IP, RBAC evidence and result. It is the Azure counterpart of CloudTrail management events and the main source for Azure persistence, privilege-escalation and defence-evasion detections.
sourcetypes:
  - st: azure_monitor_activity
    desc: Pack Generator sourcetype for Activity Log records from a diagnostic setting (Event Hub / storage schema)
  - st: mscs_azure_audit
    desc: Pack Generator sourcetype for Activity Log events from the REST API (Splunk mscs:azure:audit shape)
  - st: azure:monitor:activity
    desc: Splunk Add-on for Microsoft Cloud Services sourcetype for Activity Log via Event Hub
  - st: mscs:azure:audit
    desc: Splunk Add-on for Microsoft Cloud Services sourcetype for the Azure Audit (Activity Log REST) input
  - st: AzureActivity
    desc: Microsoft Sentinel / Log Analytics table populated by the Azure Activity connector
  - st: AZURE_ACTIVITY
    desc: Google SecOps (Chronicle) log type
facts:
  First released: 2015 (Azure Resource Manager audit logs, renamed Activity Log 2016)
  Delivery model: Platform log of every Azure subscription — always on, no agent
  Event categories: Administrative, Service Health, Resource Health, Alert, Autoscale, Recommendation, Security, Policy
  Retention: 90 days in the portal / REST API; longer only via a diagnostic setting
  Log transport: Diagnostic setting to Event Hub, Storage account (hourly JSON blobs), Log Analytics (AzureActivity table) or partner solution; REST API (Microsoft.Insights/eventtypes/management/values)
  Log format: "JSON — Event Hub/storage wrap records in {\"records\": [...]} with a flat schema; REST API returns the richer value/localizedValue schema"
  Scope: Subscription and resource-group operations only — no data-plane reads (use resource logs) and no Entra ID events (use Entra audit/sign-in logs)
  Typical volume: 1k – 1M+ events/day per subscription; Policy audit and automation dominate
  Cribl Pack: No Activity-Log-specific Dispensary pack found (Azure Audit Logs to OCSF covers Entra audit); collect with the Cribl Azure Event Hubs source
placement:
  slots:
    - cloud
    - remote
  items:
    - slot: cloud
      title: Subscription / management-group diagnostic setting
      desc: Each subscription exports its Activity Log (all categories) to a central Event Hub namespace; Cribl's Event Hubs source (Kafka protocol) reads it. Azure Policy can deploy the setting across every subscription.
    - slot: cloud
      title: Log Analytics / Sentinel workspace
      desc: The same export to a workspace populates AzureActivity; Cribl can also forward Activity data into Sentinel through the Logs Ingestion API.
    - slot: remote
      title: Admins, pipelines and automation
      desc: Portal users, Azure CLI/PowerShell, Terraform and DevOps service principals are the callers; their IPs and app IDs are in the claims.
howItWorks:
  - title: Azure Resource Manager as the choke point
    body: Every control-plane request (portal, CLI, SDK, ARM templates) goes to management.azure.com. ARM authenticates the Entra ID token, evaluates RBAC and Azure Policy, forwards to the resource provider and writes an Activity Log event for each write (PUT/PATCH), delete and POST action. GET reads are not logged.
  - title: Started / Accepted / Succeeded
    body: Long-running operations produce several events with the same correlationId — Started, Accepted, then Succeeded or Failed. Dedup on correlationId plus final status before counting operations.
  - title: Identity and authorization evidence
    body: identity.claims carries the token claims (upn, objectidentifier, appid, ipaddr, authentication methods), and identity.authorization records the action, scope and the role assignment that granted it (evidence.role, principalId, principalType). This shows which role allowed the action.
  - title: Policy and other categories
    body: Azure Policy evaluation writes Policy events (audit, deny, deployIfNotExists); Service Health and Resource Health record platform incidents; Security records Defender for Cloud alerts; Autoscale and Recommendation are operational.
  - title: Two schemas
    body: The REST API / Splunk mscs:azure:audit format uses nested value/localizedValue objects (operationName.value, status.value) with caller and httpRequest. The diagnostic-setting (Event Hub/storage) format is flatter (operationName string, resultType, resultSignature, callerIpAddress, category = Write/Delete/Action for Administrative). Parsers must handle both.
traffic:
  handles:
    - ARM write / delete / action operations on every resource type
    - RBAC role assignments and definitions
    - Key Vault, storage and VM control-plane actions (listKeys, runCommand)
    - Azure Policy evaluations
    - Service and resource health events
    - Defender for Cloud security alerts
  flow:
    - step: Request
      desc: A user, app or pipeline calls management.azure.com with an Entra ID access token.
    - step: Authenticate
      desc: ARM validates the token and extracts claims (upn, appid, ipaddr).
    - step: Authorise
      desc: RBAC and deny assignments are evaluated; the matching role assignment becomes authorization evidence.
    - step: Policy
      desc: Azure Policy can deny or audit the request before it reaches the resource provider.
    - step: Execute
      desc: The resource provider performs the operation; Started, Accepted and Succeeded/Failed events are written.
    - step: Export
      desc: Diagnostic settings stream the events to Event Hub, Storage or Log Analytics within minutes.
logs:
  - type: Administrative (Event Hub schema)
    sourcetype: azure_monitor_activity
    format: json
    share: 60–90 %
    avg: ~2.5 KB
    desc: One record per ARM write, delete or action, from a diagnostic setting. category is Write / Delete / Action; resultType and resultSignature give the outcome.
    key:
      - operationName
      - resultType
      - callerIpAddress
      - identity.authorization.scope
      - identity.authorization.evidence.principalId
      - identity.claims.appid
      - "identity.claims.http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn"
      - properties.requestbody
    noise:
      - identity.claims.iat
      - identity.claims.nbf
      - identity.claims.exp
      - identity.claims.ver
      - identity.claims.puid
      - identity.claims.aud
      - identity.authorization.evidence.roleDefinitionId
      - properties.serviceRequestId
