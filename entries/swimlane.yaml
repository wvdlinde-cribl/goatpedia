placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Swimlane events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries $type, accountId, actionType, authenticationType, category, description. Values in the sample were rewritten to documentation addresses.
traffic:
