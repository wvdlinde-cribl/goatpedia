    desc: 'Elastic integrations fixture, 2 events. Upstream: swimlane/data_stream/turbine_api/_dev/test/pipeline/test-events.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: swimlane
  Sourcetypes: '4'
