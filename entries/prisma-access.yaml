summary: Palo Alto Networks' cloud-delivered security service. Remote users connect through GlobalProtect and branches through IPsec, and their traffic is inspected by cloud firewalls that run PAN-OS. Logs go to Strata Logging Service and can be forwarded as syslog. They cover traffic, threats, URL filtering, GlobalProtect connections and user authentication.
sourcetypes:
  - st: prisma_access
    desc: Prisma Access logs forwarded from Strata Logging Service in CEF, including authentication, traffic, threat and GlobalProtect records
facts:
  Product: 'SASE: cloud firewall, secure web gateway and ZTNA for mobile users and branches'
  Clients: GlobalProtect app for mobile users, IPsec tunnels for remote networks, explicit proxy
  Log transport: Strata Logging Service (formerly Cortex Data Lake) log forwarding over syslog (TCP/TLS) or HTTPS
  Log format: CEF over syslog in this sample. LEEF and other formats are available
  What an authentication record answers: Which user authenticated, with which method and profile, from which client, and which rule applied
  What a traffic or threat record answers: Who connected to what, which policy allowed or blocked it, and what threat was found
placement:
  slots:
    - cloud
    - remote
    - edge
  items:
    - slot: cloud
      title: Prisma Access cloud
      desc: Security processing nodes run in Palo Alto Networks' cloud. User and branch traffic is inspected there and logs are stored in Strata Logging Service, which forwards them to a collector.
    - slot: remote
      title: Mobile users
      desc: Remote users connect with GlobalProtect to the nearest Prisma Access location. Their identity and client details appear in the logs.
    - slot: edge
      title: Remote networks
      desc: Branch firewalls or routers connect to Prisma Access over IPsec, sending branch internet traffic through the service.
howItWorks:
  - title: Cloud firewalls
    body: Prisma Access runs PAN-OS security policy in the cloud. Traffic from users and branches is matched against rules, and allowed traffic is inspected for threats and URL categories.
  - title: Authentication
    body: Users authenticate to GlobalProtect or to the explicit proxy with SAML, RADIUS or other profiles. Each attempt is an AUTH log with the user, the method and the result.
  - title: How the logs leave the product
    body: All logs land in Strata Logging Service. A log forwarding profile sends selected log types to a syslog receiver as CEF or LEEF, or over HTTPS.
traffic:
  handles:
    - Internet and SaaS traffic for remote users and branches
    - GlobalProtect VPN
    - User authentication
    - Threat and URL inspection
  flow:
    - step: User or branch connects
      desc: Traffic arrives over GlobalProtect or IPsec at a Prisma Access location.
    - step: Policy is applied
      desc: The cloud firewall authenticates the user, matches policy and inspects the traffic.
    - step: Logs stored
      desc: Prisma Access writes traffic, threat, URL and authentication logs to Strata Logging Service.
    - step: Logs forwarded
      desc: Log forwarding sends them as CEF syslog to a collector.
logs:
  - type: Prisma Access CEF logs
    sourcetype: prisma_access
    format: cef
    desc: One syslog-framed CEF record. The CEF header names the vendor, product (LF, the log forwarder), version, log type (AUTH in this sample) and severity. Extensions such as PanOSAuthenticatedUserName, PanOSClientTypeName and PanOSRuleMatched carry the user, client and rule. The sample uses documentation addresses.
