  Integration package: prisma_access
  Sourcetypes: '1'
  Fixture events: '11'
  Log format seen: cef
  Fields in the first fixture: syslog_header, cef_version, device_vendor, device_product, device_version, signature_id
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Prisma Access events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries syslog_header, cef_version, device_vendor, device_product, device_version, signature_id. Values in the sample were rewritten to documentation addresses.
