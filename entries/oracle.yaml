summary: Oracle's relational database. Its audit trail records connections, privileged operations and audited statements. When the audit trail is written to the operating system, each audit file holds records with a timestamp header followed by fields such as action, database user, privilege, client user, terminal and status. Those records say who connected or acted on the database, with which privilege, and whether it worked.
sourcetypes:
  - st: oracle_database_audit
    desc: Oracle Database audit records written to operating system audit files, one record per audited connection or action
facts:
  Product: Relational database server
  Deployment: On-premises servers, Exadata, or Oracle and other clouds
  Log transport: Audit files (.aud) in the audit file directory, or syslog when configured. Unified auditing stores records in the database instead
  Log format: Text records. Each starts with a timestamp and continues with labelled lines such as ACTION, DATABASE USER, PRIVILEGE and STATUS
  What an audit record answers: Which database user and OS user connected or acted, with which privilege (for example SYSDBA), and the return status
placement:
  slots:
    - internal
  items:
    - slot: internal
      title: Database server
      desc: The database runs on internal servers. The audit files are written on the database host, where a file collector reads them.
howItWorks:
  - title: Audit trail
    body: Oracle audits connections by privileged users always, plus the actions set by audit policies. Records can be stored in the database, in OS files, or sent to syslog.
  - title: OS audit files
    body: With the operating system trail, each session writes records to an .aud file. A record starts with its timestamp and then lists LENGTH, ACTION, DATABASE USER, PRIVILEGE, CLIENT USER, CLIENT TERMINAL and STATUS.
  - title: How the records leave the product
    body: A collector tails the audit directory on the host, or receives the syslog stream. A record spans several lines, so the collector must break events on the timestamp line.
traffic:
  handles:
    - Database connections
    - Privileged (SYSDBA, SYSOPER) operations
    - Audited SQL actions
  flow:
    - step: User connects or acts
      desc: A user or a tool connects to the database or runs an audited statement.
    - step: Database audits
      desc: Oracle writes an audit record with the action, users, privilege and status.
    - step: Collector reads
      desc: A collector tails the audit files or receives syslog and groups each multi-line record.
logs:
  - type: Database audit records
    sourcetype: oracle_database_audit
    format: text
    desc: One audit record. The record starts with its timestamp, and the following lines name the action, database user, privilege, client user and status. This sample shows only the timestamp header line of a record.
    sample: Wed Oct 21 11:58:08 2020 -04:00
    pattern: (?<message>[\s\S]+)
    key:
      - message
