id: mongodb-atlas
name: MongoDB Atlas
short: MongoDB Atlas
vendor: MongoDB, Inc.
category: db
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - Atlas
tags:
  - database
  - dbaas
  - nosql
  - audit
  - text
summary: MongoDB's fully managed database service, running clusters in AWS, Azure or Google Cloud. Atlas keeps the mongod database log of each cluster member and, when database auditing is enabled, the audit log of authentication, authorization and schema actions. A collector downloads these logs per host and time window through the Atlas Administration API.
sourcetypes:
  - st: mongodb_atlas_mongod_audit
    desc: The mongod audit log of an Atlas cluster member, downloaded through the Administration API
  - st: mongodb_atlas_mongod_database
    desc: The mongod database log of an Atlas cluster member, downloaded through the Administration API
facts:
  Product: Managed MongoDB database service (DBaaS)
  Hosting: Clusters in AWS, Azure or Google Cloud, run by MongoDB
  Log transport: Atlas Administration API log download per host and time window, polled by a collector
  Log format: Compressed log files with one entry per line; the API answers with a plain-text message when it has nothing for the window
  What an audit entry answers: Who authenticated, or ran which audited action, against which database, and with what result
  What a database-log entry answers: What the mongod component did, such as connections, slow operations and replication
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Atlas cluster
      desc: Cluster members run in MongoDB's account in the chosen cloud provider. Their database and audit logs are kept by Atlas and fetched through the Administration API for each host.
howItWorks:
  - title: Per-host logs
    body: Each member of an Atlas cluster runs mongod. Atlas keeps its database log and, if database auditing is turned on for the project, its audit log, for a limited retention period.
  - title: Database auditing
    body: Auditing records authentication, authorization failures and the actions selected in the audit filter, such as user and role changes or collection drops.
  - title: Download through the API
    body: A collector asks the Administration API for one log type, one host and a time window. If there is nothing for that window, or the host cannot be reached, the API answers with a short plain-text message instead of log data.
traffic:
  handles:
    - Database authentication and authorization
    - Database operations
    - Cluster member activity
  flow:
    - step: Cluster logs
      desc: A cluster member writes its database log and audit log.
    - step: Collector requests
      desc: The collector calls the Administration API for a host, log type and time window.
    - step: Text returned
      desc: The API returns the log lines, or a message saying there is no data. Goatpedia reads the samples as text.
logs:
  - type: Audit log download
    sourcetype: mongodb_atlas_mongod_audit
    format: text
    desc: One line from an audit log download. This sample is the API's answer when there is no audit data for the window or the host is unreachable, not an audit entry. A real download carries one audit entry per line.
    sample: No data for given time period or host is unreachable
    pattern: (?<message>[\s\S]+)
    key:
      - message
  - type: Database log download
    sourcetype: mongodb_atlas_mongod_database
    format: text
    desc: One line from a database log download. This sample is the API's answer when there is no data for the window or the host is unreachable, not a mongod log line. A real download carries one mongod log entry per line.
    sample: No data for given time period or host is unreachable
    pattern: (?<message>[\s\S]+)
    key:
      - message
