  - text
summary: Apache Tomcat is a Java application server. It hosts servlets and web applications, and it sits behind a load balancer or directly on an application network. For each HTTP request it handles, Tomcat can write an access line. This stream keeps that line as one text message. Any collector that can read the server's log file or syslog can receive it.
sourcetypes:
  - st: tomcat
    desc: One HTTP access line written by Tomcat, kept as a single text message
facts:
  Product: Java servlet and JSP application server
  Where it sits: On an application host, often behind a reverse proxy, in an internal network or a DMZ
  Log transport: Access log file on the host, or syslog if the host forwards it. Any collector that tails the file or receives the syslog can take it
  Log format: One text line per request. This stream does not split the line into columns. The whole line is the message field
  What an access line answers: Which client asked for which URL, when, and with which user agent, once the line is read
placement:
  slots:
    - internal
    - dmz
  items:
    - slot: internal
      title: Application host
      desc: Tomcat runs on a server that hosts Java web applications. The access log is a file on that host. A collector on the host, or a syslog forwarder, sends the lines on.
    - slot: dmz
      title: Published application
      desc: The same server is often placed in a DMZ when the application is reachable from outside. The log is still written on the Tomcat host. Placement of the host does not change the shape of the line.
howItWorks:
  - title: Requests and the access log
    body: A client sends HTTP to a web application running in Tomcat. The Access Log Valve, or a custom pattern the operator configured, writes one line per request. A stock pattern is close to the combined log format. Operators also use their own separators and fields. This stream does not assume a stock pattern.
  - title: What this line contains
    body: The sample line is pipe-separated. It carries a client address, a timestamp, a request URL, a referrer and a user agent, plus application-specific tokens. Because the stream stores the line as message, a search reads the line as text. Addresses in the sample are documentation addresses.
  - title: How the line is collected
    body: Tomcat writes the file locally. A collector tails catalina or the access log the valve was pointed at, or the host forwards it as syslog. Nothing in the product sends the line to one particular SIEM. Goatpedia reads these samples as text.
traffic:
  handles:
    - HTTP requests to applications hosted on Tomcat
  flow:
    - step: Client requests a page
      desc: A browser or another client calls a URL on a web application running in Tomcat.
    - step: Tomcat writes a line
      desc: The access log records that request as one text line, using the valve pattern configured on the server.
    - step: Collector reads the line
      desc: A collector tails the log file or receives the syslog and forwards the line as message.
logs:
  - type: Access log
    sourcetype: tomcat
    format: text
    desc: One access line. The whole line is message, so the client address, timestamp, URL and user agent stay inside that string. This sample is a pipe-separated line with a documentation URL and a documentation client address.
    sample: '%APACHETOMCAT-1516-asdf: 198.51.100.25||eacommod||rci||[29/Jan/2016:6:09:59 OMST]||exercita||https://example.com/illumqui/ventore.html?min=ite#utl||vol||amremap||oremi||ntsunti||5293||https://mail.example.net/turadipi/aeca.htm?ntium=psaq#cer||Mozilla/5.0 (Linux; Android 9; G8142) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.83 Mobile Safari/537.36||aliqu'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections: []
optimizations: []
