summary: Hashicorp Vault is logged by the Elastic integrations package hashicorp_vault. The Pack Generator samples pool holds fixture events for 2 sourcetypes. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: hashicorp_vault
    desc: 'Elastic integrations fixture, 12 events. Upstream: hashicorp_vault/data_stream/log/_dev/test/pipeline/test-log.log'
  - st: hashicorp_vault_audit
    desc: 'Elastic integrations fixture, 13 events. Upstream: hashicorp_vault/data_stream/audit/_dev/test/pipeline/test-audit.log'
facts:
  Where the sample comes from: Elastic integrations
  Integration package: hashicorp_vault
  Sourcetypes: '2'
  Fixture events: '25'
  Log format seen: json
  Fields in the first fixture: '@level, @message, @module, @timestamp, error, lease_id'
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Elastic integrations
      desc: Fixtures were harvested from elastic/integrations. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Hashicorp Vault events in this library are the test fixtures shipped with elastic/integrations (cbfff90638). The first event carries @level, @message, @module, @timestamp, error, lease_id. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - json
  flow:
    - step: Collect
      desc: The Elastic integrations package reads hashicorp_vault and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as json.
logs:
  - type: Log
    sourcetype: hashicorp_vault
    format: json
    desc: 12 fixture events in the samples pool (elastic).
    sample: '{"@level":"error","@message":"failed to revoke lease","@module":"expiration","@timestamp":"2021-07-16T06:30:48.194192Z","error":"failed to revoke entry: resp: (*logical.Response)(nil) err: RequestError: send request failed\ncaused by: Post \"https://iam.amazonaws.com/\": dial tcp: lookup ...","lease_id":"aws/creds/ddns-updater/oS5t84TSPRoYF2gX8McPyw4u"}'
