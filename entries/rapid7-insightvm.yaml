cves: []
detections:
  - title: Asset with critical vulnerabilities
    severity: medium
    signals:
      - critical_vulnerabilities
      - exploits
      - host_name
      - ip
      - risk_score
    why: Critical findings on an asset, especially with public exploits, are the exposure to remediate first.
    kql: |
      dataset="rapid7-insightvm_logs"
      | where sourcetype == "rapid7_insightvm_asset_vulnerability" and critical_vulnerabilities > 0
      | project host_name, ip, critical_vulnerabilities, exploits, malware_kits, risk_score, last_scan_end
    mitre:
      - T1190
optimizations:
  - title: Keep vulnerability definitions as a lookup
    saving: all definition volume in the SIEM
    fn: Routes
    how: Vulnerability definitions are a slowly changing catalogue. Store them as a lookup keyed by id and enrich asset findings from it instead of indexing them as events.
    expr: sourcetype == 'rapid7_insightvm_vulnerability'
    stream:
      routes:
        - name: InsightVM vulnerability definitions → lookup store
          filter: /^\{"added":/.test(_raw) && /"cvss_v2_vector":/.test(_raw) && !/"vulnerability":\{/.test(_raw) && !/"last_scan_end":/.test(_raw)
          to: A lookup file or KV store keyed by id (for example Cribl Lake or a CSV lookup refreshed on a schedule), not the SIEM index
          final: true
        - name: InsightVM assets and asset vulnerabilities → SIEM
          filter: /"last_scan_end":/.test(_raw)
          to: The SIEM, enriched from the vulnerability definitions lookup on vulnerability.vulnerability_id
          final: true
      note: Routes see the raw event, so the definitions route matches the catalogue shape (top-level added and CVSS keys with no scan fields); if the source sets sourcetype rapid7_insightvm_vulnerability, you can match on that instead. Put the definitions route first, and use a Lookup function on the asset findings to enrich them from the stored catalogue.
references:
