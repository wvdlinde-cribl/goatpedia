id: rapid7-insightvm
name: Rapid7 InsightVM
short: InsightVM
vendor: Rapid7
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - InsightVM
  - Nexpose
tags:
  - vulnerability-management
  - scanner
  - json
summary: Rapid7's vulnerability management product, the successor of Nexpose. Scan engines and Insight Agents assess assets, the Security Console tracks findings, and the Insight Platform adds risk scoring and remediation tracking. Its data is assets with vulnerability counts and risk, the vulnerabilities found on each asset, and the vulnerability catalogue with CVSS and exploit details.
sourcetypes:
  - st: rapid7_insightvm_asset
    desc: Assets with OS, addresses, last scan and counts of critical, severe and moderate vulnerabilities, exploits and risk score
  - st: rapid7_insightvm_asset_vulnerability
    desc: Assets with the vulnerabilities found on them, including counts, risk score and per-finding detail
  - st: rapid7_insightvm_vulnerability
    desc: 'Vulnerability definitions: CVEs, CVSS v2 and v3 scores and vectors, categories, description and references'
facts:
  Product: Vulnerability scanning, risk prioritisation and remediation tracking
  Sensors: Scan engines on the network, Insight Agents on hosts, and cloud discovery connections
  Log transport: InsightVM cloud API and Security Console API over HTTPS, polled by a collector with an API key
  Log format: One JSON object per asset or vulnerability
  What an asset record answers: Which host it is, when it was last scanned, how many critical or exploitable vulnerabilities it has, and its risk score
  What a vulnerability record answers: What the vulnerability is, which CVEs it covers, and how severe and exploitable it is
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: Scan engines and agents
      desc: Scan engines run inside the network and Insight Agents on hosts. They assess assets and report to the console.
    - slot: cloud
      title: Insight Platform
      desc: Asset and vulnerability data is synchronised to the Rapid7 Insight Platform, whose API a collector polls. The on-premises Security Console has its own API.
howItWorks:
  - title: Assessment
    body: Scans and agents check assets for vulnerabilities, misconfigurations and policy compliance. Each asset record keeps the last scan times and vulnerability counts.
  - title: Risk
    body: Each finding and asset gets a risk score built from CVSS, exploit and malware kit availability, and age. critical_vulnerabilities, exploits and malware_kits summarise it per asset.
  - title: How the data leaves the product
    body: A collector calls the asset and vulnerability search APIs with an API key and pages through the results.
traffic:
  handles:
    - Network and agent vulnerability scanning
    - Risk scoring
    - Vulnerability catalogue
  flow:
    - step: Scan
      desc: A scan engine or agent assesses an asset.
    - step: Console records
      desc: Findings are stored against the asset and synchronised to the platform.
    - step: Collector polls
      desc: A collector reads assets, asset vulnerabilities and definitions from the API.
