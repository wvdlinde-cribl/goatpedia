summary: Gitlab Runner is logged by the Datadog integrations-core package gitlab_runner. The Pack Generator samples pool holds fixture events for 1 sourcetype. This article describes those fixtures and does not add CVE history.
sourcetypes:
  - st: gitlab_runner
    desc: 'Datadog integrations-core fixture, 5 events. Upstream: gitlab_runner/assets/logs/gitlab-runner_tests.yaml'
facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: gitlab_runner
  Sourcetypes: '1'
  Fixture events: '5'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Gitlab Runner events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads gitlab_runner and the samples pool stores the fixture used here.
    - step: Parse
      desc: Secpedia reads the fixture as text.
logs:
  - type: Gitlab Runner
    sourcetype: gitlab_runner
    format: text
    desc: 5 fixture events in the samples pool (logtest).
    sample: 'Aug 19 09:11:49 vagrant gitlab-runner[5219]: Running in system-mode.'
    pattern: (?<message>[\s\S]+)
    key:
      - message
cves: []
detections:
  - title: Gitlab Runner events arriving
    severity: low
    signals:
      - message
    why: Confirms this source is present. It is not a vulnerability claim.
    kql: '| where sourcetype == "gitlab_runner"'
optimizations: []
references:
  - title: DataDog/integrations-core gitlab_runner/assets
    url: https://github.com/DataDog/integrations-core/blob/faa3db574bb0a2d218968c7bc2134f34f1ec9155/gitlab_runner/assets/logs/gitlab-runner_tests.yaml
  - title: Pack Generator sample gitlab_runner.json
