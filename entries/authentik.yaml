id: authentik
name: authentik
short: authentik
vendor: Authentik Security
category: saas
status: full
updated: '2026-11-16'
contributors:
  - wlinde
aka:
  - goauthentik
tags:
  - identity
  - sso
  - idp
  - open-source
  - json
  - audit
summary: An open-source identity provider for single sign-on, self-hosted or offered as a managed service. It authenticates users through configurable flows and serves applications over OAuth2/OpenID Connect, SAML, LDAP and a proxy outpost. authentik records an event for logins, failures, policy runs and model changes, and its API also returns users and groups as directory records.
sourcetypes:
  - st: authentik
    desc: authentik events, one per action such as login, login failure, policy execution or model change, with user, app and context
  - st: authentik_group
    desc: Groups in authentik, with superuser flag, parent, members, roles and attributes
  - st: authentik_user
    desc: Users in authentik, with username, active and superuser flags, groups, last login, path and attributes
facts:
  Product: Self-hosted identity provider and SSO
  Protocols: OAuth2 and OpenID Connect, SAML, LDAP, RADIUS, and a forward-auth proxy outpost
  Deployment: Server and worker containers with PostgreSQL, plus outposts near the applications
  Log transport: HTTPS JSON REST API (/api/v3), polled by a collector with an API token. Notification rules can also push events to a webhook
  Log format: One JSON object per event, user or group
  What an event answers: Who did what in authentik, from which IP, and with what result
  What a user or group record answers: Who exists, whether they are active or superuser, and what they belong to
placement:
  slots:
    - internal
    - cloud
  items:
    - slot: internal
      title: authentik server and outposts
      desc: The authentik server runs the flows and stores events. Outposts for proxy, LDAP or RADIUS run near the applications they protect.
    - slot: cloud
      title: Federated applications
      desc: SaaS and internal applications trust authentik as their identity provider over OIDC or SAML.
howItWorks:
  - title: Flows and stages
    body: A login is a flow made of stages, such as identification, password, MFA and consent. Policies bound to flows and stages decide who may pass. Each run of a policy can be recorded as a policy_execution event with the result.
  - title: Events
    body: Every significant action is an event with an action (login, login_failed, policy_execution, model_created, model_updated, model_deleted and others), the user, the client IP, a context with details and an expiry. Notification rules match events and send alerts.
  - title: Directory
    body: Users and groups are authentik's own directory, which can be synced from LDAP or Active Directory sources. A group can be superuser, which grants full admin rights to its members.
  - title: How the events leave the product
    body: A collector with an API token reads /api/v3/events/events/, /core/users/ and /core/groups/ and keeps its place by the created time. A notification rule with a webhook transport can push events instead.
traffic:
  handles:
    - User login, MFA and enrollment flows
    - OAuth2, OIDC, SAML, LDAP and proxy authentication for applications
    - Administration of users, groups, policies and applications
  flow:
    - step: User or admin acts
      desc: A user runs a login flow, or an admin changes users, groups or policies.
    - step: authentik records
      desc: authentik writes an event with the action, the user and context. Users and groups are updated in the directory.
    - step: Collector polls
      desc: A collector reads events, users and groups from the API, or receives events from a webhook.
logs:
  - type: Events
    sourcetype: authentik
    format: json
    desc: One object per authentik event. action is what happened, here a policy_execution triggered by a login_failed event. user is who, context the details and result, client_ip where from. The email uses example.com.
    sample: '{"pk":"1e399dbf-bb30-4d0f-acf3-a5275e065cd0","user":{"pk":4,"email":"user@example.com","username":"akadmin"},"action":"policy_execution","app":"authentik.policies.process","context":{"result":{"passing":false,"messages":[],"raw_result":null,"log_messages":[],"source_binding":null,"source_results":[]},"binding":{"pk":"db99e0c8076f40db82de1295a47d0fd7","app":"authentik_policies","name":"Binding from Notification Rule elastic-test #0 to Policy match-all-events","model_name":"policybinding"},"message":"Policy Execution","request":{"obj":{"pk":"20ce67d61faa4eafa7e785944a5ffdfd","app":"authentik_events","name":"elastic-test","model_name":"notificationrule"},"user":{"pk":4,"email":"user@example.com","username":"akadmin"},"context":{"event":{"pk":"e076090e7ae54273928e24da2a292f9f","app":"authentik_events","name":"Event action=login_failed user={''pk'': 4, ''email'': ''user@example.com'', ''username'': ''akadmin''} context={''stage'': {''pk'': ''78aa6805067c4d4cad52322cdfc2f52a'', ''ap...","model_name":"event"}},"http_request":null},"policy_uuid":"e315fac82dab41ce9b7d3eb299510a17"},"client_ip":null,"created":"2024-08-07T06:28:59.565191Z","expires":"2025-08-07T06:28:59.562523Z","brand":{"pk":"df46a0dde5cc4d9397e5cface96e5c9c","app":"authentik_brands","name":"Brand fallback","model_name":"brand"}}'
    key:
      - pk
      - user.pk
      - user.email
      - user.username
  - type: Groups
    sourcetype: authentik_group
    format: json
    desc: One object per group. name and is_superuser say what it grants, users lists member ids, parent and roles place it, attributes carry synced directory data such as the LDAP SID.
    sample: '{"pk":"29613be9-2db3-4488-9338-60ec7762f60d","num_pk":55003,"name":"AllUsers","is_superuser":false,"parent":null,"parent_name":null,"users":[12,14],"users_obj":null,"attributes":{"ldap_uniq":"S-1-5-21-1234567890-1234567890-1234567890-1234"},"roles":[],"roles_obj":[]}'
    key:
      - pk
      - num_pk
      - name
      - is_superuser
  - type: Users
    sourcetype: authentik_user
    format: json
    desc: One object per user. username, is_active and is_superuser describe the account, last_login when it was used, path and attributes where it came from (an LDAP source here). The email uses example.com.
    sample: '{"pk":1090,"username":"mockuser.953","name":"MockUser 953","is_active":true,"last_login":null,"is_superuser":false,"groups":[],"groups_obj":null,"email":"user@example.com","avatar":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NHB4IiBoZWlnaHQ9IjY0cHgiIHZpZXdCb3g9IjAgMCA2NCA2NCIgdmVyc2lvbj0iMS4...","attributes":{"sn":"953","upn":"mockuser.953","ldap_uniq":"S-1-5-21-1234567890-1234567890-1234567890-2234"},"uid":"0c20aac19d914b7abcdef895517d6d9b01234567899abcdefabcdef4f5cd4e99","path":"goauthentik.io/sources/test-ldap/Company/AllUsers","type":"internal","uuid":"abcdef12-1234-5678-9122-abcdefabcdef"}'
    key:
      - pk
      - username
      - name
      - is_active
cves: []
detections:
  - title: Failed logins
    severity: medium
    signals:
      - action
      - user.username
      - client_ip
    why: login_failed events are wrong passwords or failed MFA. Many for one user, or across many users from one IP, are guessing or spraying.
    kql: |
      dataset="authentik_logs"
      | where sourcetype == "authentik" and action == "login_failed"
      | project created, action, user.username, user.email, client_ip
    mitre:
      - T1110
  - title: Superuser group
    severity: low
    signals:
      - is_superuser
      - name
      - users
    why: Members of a superuser group are full authentik administrators. The list of such groups and their members is the admin inventory to review.
    kql: |
      dataset="authentik_logs"
      | where sourcetype == "authentik_group" and is_superuser == true
      | project name, users, parent_name
    mitre:
      - T1078
optimizations: []
references:
  - title: authentik documentation
    url: https://docs.goauthentik.io/
