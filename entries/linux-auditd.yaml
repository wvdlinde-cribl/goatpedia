id: linux-auditd
name: Linux Audit (auditd)
short: auditd
aka:
  - Linux Audit Framework
  - auditd
  - audispd
  - audit.log
  - ausearch / aureport
vendor: Linux kernel / Red Hat
category: os
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - linux
