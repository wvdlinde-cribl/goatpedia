facts:
  Where the sample comes from: Datadog integrations-core
  Integration package: ossec_security
  Sourcetypes: '1'
  Fixture events: '15'
  Log format seen: text
  Fields in the first fixture: message
placement:
  slots:
    - cloud
  items:
    - slot: cloud
      title: Datadog integrations-core
      desc: Fixtures were harvested from DataDog/integrations-core. The product may also be deployed on a network or an endpoint; this article only places the source of the sample.
howItWorks:
  - title: What the fixture shows
    body: Ossec Security events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries message. Values in the sample were rewritten to documentation addresses.
traffic:
  handles:
    - text
  flow:
    - step: Collect
      desc: The Datadog integrations-core package reads ossec_security and the samples pool stores the fixture used here.
    - step: Parse
      desc: Goatpedia reads the fixture as text.
logs:
  - type: Ossec
    sourcetype: ossec
    format: text
    desc: 15 fixture events in the samples pool (logtest).
    sample: '<132>Jun 19 11:56:43 ub20 ossec: {"crit":2,"id":1002,"component":"ub20->/var/log/syslog","classification":" syslog,errors,","description":"Unknown problem somewhere in the system.","message":"Jun 19 11:56:42 ub20 multipathd[740]: sda: failed to get sysfs uid: Invalid argument"}'
    pattern: (?<message>[\s\S]+)
    key:
      - message
