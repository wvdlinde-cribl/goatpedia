howItWorks:
  - title: What the fixture shows
    body: Extrahop events in this library are the test fixtures shipped with DataDog/integrations-core (faa3db574b). The first event carries appliance_id, mod_time, create_time, risk_score, end_time, description. Values in the sample were rewritten to documentation addresses.
