id: barracuda-cloudgen
name: Barracuda CloudGen Firewall
short: Barracuda
aka:
  - Barracuda CGF
  - Barracuda NextGen Firewall F-Series
  - Barracuda NG Firewall
  - phion netfence (origin)
  - Firewall Control Center
vendor: Barracuda Networks
category: ngfw
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - firewall
  - sd-wan
