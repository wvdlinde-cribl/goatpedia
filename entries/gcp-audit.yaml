id: gcp-audit
name: Google Cloud Audit Logs
short: GCP Audit
aka:
  - Cloud Audit Logs
  - cloudaudit.googleapis.com
  - Admin Activity logs
  - Data Access logs
  - GKE audit logs
vendor: Google Cloud
category: cloud
status: full
updated: "2026-11-12"
contributors:
  - wlinde
tags:
  - gcp
